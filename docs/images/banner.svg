<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">openair — 把 Skill 做成应用</title>
  <desc id="desc">由 AirThink、AirCode 和本机 Codex 驱动的开放应用集。发现工具、创建应用，让想法成为现实。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D8CFC1"/></pattern>
    <linearGradient id="card" x1="910" y1="80" x2="1280" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1EADF"/></linearGradient>
  </defs>
  <rect width="1440" height="480" rx="24" fill="#FAF8F3"/>
  <rect x="800" width="640" height="480" fill="url(#grid)"/>
  <path d="M0 456H1440" stroke="#A36E4E" stroke-width="2"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <g transform="translate(72 62)" fill="#A36E4E"><rect width="15" height="15" rx="4"/><rect x="21" width="15" height="15" rx="4"/><rect y="21" width="15" height="15" rx="4"/><rect x="21" y="21" width="15" height="15" rx="4" fill="#C3A58D"/></g>
    <text x="124" y="88" font-size="14" letter-spacing="3" fill="#766D61">小工具，大可能。</text>
    <text x="68" y="206" font-size="100" font-weight="700" letter-spacing="-6" fill="#302C25">openair<tspan fill="#A36E4E">.</tspan></text>
    <text x="74" y="268" font-size="32" fill="#544C41">把 Skill 做成应用。</text>
    <text x="74" y="309" font-size="19" fill="#81776A">你的想法，你的工具，你自己的 Codex。</text>
    <g font-size="14" fill="#786653">
      <rect x="74" y="355" width="144" height="36" rx="18" fill="#EFE8DC"/><text x="146" y="379" text-anchor="middle">100+ 个应用</text>
      <rect x="230" y="355" width="144" height="36" rx="18" fill="#EFE8DC"/><text x="302" y="379" text-anchor="middle">本地运行</text>
      <rect x="386" y="355" width="144" height="36" rx="18" fill="#EFE8DC"/><text x="458" y="379" text-anchor="middle">按需定制</text>
    </g>
    <rect x="918" y="75" width="392" height="322" rx="20" fill="#E7DFD2" transform="rotate(6 1114 236)"/>
    <rect x="886" y="64" width="392" height="322" rx="20" fill="url(#card)" stroke="#D8CFC1"/>
    <circle cx="912" cy="89" r="4" fill="#C3A58D"/><circle cx="927" cy="89" r="4" fill="#D6C5B4"/><circle cx="942" cy="89" r="4" fill="#E2D8CB"/>
    <path d="M886 109H1278" stroke="#E3DDD2"/>
    <text x="918" y="152" font-size="12" letter-spacing="2" fill="#81776A">从 Skill 到日常工具</text>
    <rect x="918" y="175" width="328" height="52" rx="12" fill="#EEE6DA"/><text x="940" y="207" font-size="20" font-weight="600" fill="#554535">AirThink</text><text x="1226" y="206" text-anchor="end" font-size="13" fill="#81776A">发现与打开</text>
    <path d="M1082 229V244m-5-5 5 5 5-5" stroke="#A36E4E" stroke-width="2"/>
    <rect x="918" y="248" width="328" height="52" rx="12" fill="#E8EDE3"/><text x="940" y="280" font-size="20" font-weight="600" fill="#536348">AirCode</text><text x="1226" y="279" text-anchor="end" font-size="13" fill="#708066">运行与连接</text>
    <path d="M1082 302V317m-5-5 5 5 5-5" stroke="#A36E4E" stroke-width="2"/>
    <text x="1082" y="349" text-anchor="middle" font-size="18" fill="#544C41">你的本机 Codex CLI</text>
  </g>
</svg>
