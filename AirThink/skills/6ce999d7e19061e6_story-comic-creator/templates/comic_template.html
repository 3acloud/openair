<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[漫画标题]</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #d9cfbe;
    font-family: 'Noto Serif SC', 'SimSun', serif;
    color: #2a2218;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  /* ===== 封面 ===== */
  .book-cover {
    max-width: 800px;
    margin: 0 auto;
    padding: 80px 40px 60px;
    text-align: center;
    background: linear-gradient(180deg, #ede4d3 0%, #e0d5c0 100%);
    border-bottom: 3px double #8b7355;
  }
  .book-cover .book-label {
    font-size: 13px;
    letter-spacing: 10px;
    color: #9a8565;
    margin-bottom: 30px;
    font-family: 'ZCOOL KuaiLe', cursive;
  }
  .book-cover h1 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 52px;
    color: #3d3226;
    letter-spacing: 6px;
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .book-cover .book-sub {
    font-size: 15px;
    color: #7a6a52;
    letter-spacing: 3px;
  }
  .book-cover .book-divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #8b7355, transparent);
    margin: 30px auto;
  }

  /* ===== 剧集 ===== */
  .episode {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 20px;
  }
  .episode-title {
    text-align: center;
    margin-bottom: 24px;
  }
  .episode-title .ep-num {
    display: inline-block;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 14px;
    letter-spacing: 4px;
    color: #fff;
    background: #6b5a45;
    padding: 4px 16px;
    border-radius: 2px;
    margin-bottom: 10px;
  }
  .episode-title h2 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 28px;
    color: #3d3226;
    letter-spacing: 4px;
    font-weight: 400;
  }

  /* ===== 宫格 ===== */
  .grid-2x2, .grid-2x3 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 3px solid #3a3025;
    background: #3a3025;
  }

  /* ===== 画格单元（图片+旁白栏） ===== */
  .panel-cell {
    display: flex;
    flex-direction: column;
    border: 1.5px solid #3a3025;
    background: #ede8dd;
  }

  /* ===== 画格（仅图片+叠加气泡） ===== */
  .panel {
    position: relative;
    overflow: hidden;
    background: #ddd;
    line-height: 0;
    flex: 1;
  }
  .panel img {
    width: 100%;
    display: block;
  }

  /* ===== 旁白栏（图片下方，独立空间，绝不盖脸） ===== */
  .narration-bar {
    background: #ede4d3;
    border-top: 1px solid #c4b89a;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.65;
    color: #3a3025;
    font-weight: 500;
    letter-spacing: 0.3px;
    text-align: center;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .narration-bar:empty { display: none; }

  /* ===== 叠加气泡（对白/心理活动，仅在图片上） ===== */
  .bubble {
    position: absolute;
    max-width: 58%;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.55;
    font-weight: 500;
    letter-spacing: 0.3px;
    z-index: 10;
  }

  /* 对白气泡 */
  .speech {
    background: #fffef8;
    border: 1.5px solid #3a3025;
    border-radius: 12px;
    color: #2a2218;
    box-shadow: 1px 1px 0 rgba(58,48,37,0.15);
  }
  .speech::after {
    content: '';
    position: absolute;
    width: 0; height: 0;
    border: 5px solid transparent;
  }
  .speech.pos-bl::after { bottom: -9px; left: 16px; border-top-color: #3a3025; }
  .speech.pos-br::after { bottom: -9px; right: 16px; border-top-color: #3a3025; }
  .speech.pos-tl::after { top: -9px; left: 16px; border-bottom-color: #3a3025; }
  .speech.pos-tr::after { top: -9px; right: 16px; border-bottom-color: #3a3025; }

  /* 电话对白（虚线） */
  .speech-phone {
    background: rgba(255,254,248,0.92);
    border: 1.5px dashed #6b5a45;
    border-radius: 12px;
    color: #4a3f35;
    font-style: italic;
  }

  /* 心理活动气泡 */
  .thought {
    background: #f5f0e5;
    border: 1.5px solid #8b7355;
    border-radius: 16px;
    color: #4a3f35;
    font-style: italic;
  }
  .thought::before, .thought::after {
    content: '';
    position: absolute;
    background: #f5f0e5;
    border: 1.5px solid #8b7355;
    border-radius: 50%;
  }
  .thought.pos-bl::before { width: 8px; height: 8px; bottom: -12px; left: 18px; }
  .thought.pos-bl::after { width: 5px; height: 5px; bottom: -19px; left: 12px; }
  .thought.pos-br::before { width: 8px; height: 8px; bottom: -12px; right: 18px; }
  .thought.pos-br::after { width: 5px; height: 5px; bottom: -19px; right: 12px; }

  /* 音效字 */
  .sfx {
    position: absolute;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    color: #c0392b;
    text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff;
    z-index: 10;
    letter-spacing: 2px;
    transform: rotate(-5deg);
  }

  /* 位置（仅用于叠加气泡，固定在四角，避免居中盖脸） */
  .pos-tl { top: 6px; left: 6px; }
  .pos-tr { top: 6px; right: 6px; }
  .pos-bl { bottom: 6px; left: 6px; }
  .pos-br { bottom: 6px; right: 6px; }

  /* 回忆滤镜 */
  .panel.flashback img { filter: sepia(0.15) contrast(0.95); }

  /* ===== 结尾 ===== */
  .book-ending {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 40px 40px;
    text-align: center;
    background: linear-gradient(180deg, #e0d5c0 0%, #d5c9b3 100%);
    border-top: 3px double #8b7355;
  }
  .book-ending p {
    font-size: 15px;
    color: #5a4a35;
    line-height: 2.2;
    letter-spacing: 1px;
  }
  .book-ending .end-sig {
    margin-top: 30px;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 24px;
    color: #4a3f35;
    letter-spacing: 4px;
  }

  /* ===== 响应式（手机优化） ===== */
  @media (max-width: 600px) {
    .book-cover h1 { font-size: 32px; letter-spacing: 3px; }
    .episode-title h2 { font-size: 20px; }
    .bubble {
      font-size: 10px;
      padding: 4px 7px;
      max-width: 62%;
      line-height: 1.45;
    }
    .narration-bar {
      font-size: 10.5px;
      padding: 6px 8px;
      line-height: 1.55;
      min-height: 30px;
    }
    .sfx { font-size: 14px; }
    .pos-tl, .pos-tr { top: 4px; }
    .pos-bl, .pos-br { bottom: 4px; }
    .pos-tl, .pos-bl { left: 4px; }
    .pos-tr, .pos-br { right: 4px; }
  }

  /* 超小屏进一步压缩 */
  @media (max-width: 380px) {
    .bubble { font-size: 9px; padding: 3px 6px; max-width: 65%; }
    .narration-bar { font-size: 9.5px; padding: 5px 6px; }
  }
</style>
</head>
<body>

<!-- 封面 -->
<div class="book-cover">
  <div class="book-label">连 环 画</div>
  <h1>[漫画标题]</h1>
  <div class="book-divider"></div>
  <div class="book-sub">[副标题/一句话简介]</div>
</div>

<!-- ========== 第X集（模板） ========== -->
<!--
  画格结构说明：
  - .panel-cell: 画格单元（flex列，图片在上，旁白栏在下）
  - .panel: 仅放图片 + 叠加气泡（对白/心理活动/音效）
  - .narration-bar: 旁白栏，在图片下方独立空间，绝不盖脸
  - 叠加气泡只用四角位置(pos-tl/tr/bl/br)，避免居中盖脸
  - 没有旁白时，narration-bar 留空或省略
-->
<div class="episode">
  <div class="episode-title">
    <div class="ep-num">第X集</div>
    <h2>[集标题]</h2>
  </div>
  <div class="grid-2x2">
    <!-- 格1：有旁白 -->
    <div class="panel-cell">
      <div class="panel">
        <img src="panels/e0X_p01.jpg" alt="[画面描述]">
      </div>
      <div class="narration-bar">[旁白文字]</div>
    </div>
    <!-- 格2：有对白 -->
    <div class="panel-cell">
      <div class="panel">
        <img src="panels/e0X_p02.jpg" alt="[画面描述]">
        <div class="bubble speech pos-tr">[对白文字]</div>
      </div>
    </div>
    <!-- 格3：有心理活动 -->
    <div class="panel-cell">
      <div class="panel">
        <img src="panels/e0X_p03.jpg" alt="[画面描述]">
        <div class="bubble thought pos-bl">[心理活动文字]</div>
      </div>
    </div>
    <!-- 格4：有旁白+对白 -->
    <div class="panel-cell">
      <div class="panel">
        <img src="panels/e0X_p04.jpg" alt="[画面描述]">
        <div class="bubble speech pos-tl">[对白文字]</div>
      </div>
      <div class="narration-bar">[旁白文字]</div>
    </div>
  </div>
</div>

<!-- 结尾 -->
<div class="book-ending">
  <p>[结尾文字]</p>
  <div class="end-sig">—— 全 书 完 ——</div>
</div>

</body>
</html>
