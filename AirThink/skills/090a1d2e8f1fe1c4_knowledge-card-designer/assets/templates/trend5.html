<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>趋势五 · 100亿数字员工</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1080px;
            height: 1350px;
            min-height: 1350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            color: #fff;
            overflow: hidden;
        }
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            background-color: #0f0f1a;
        }
        .card {
            width: 1080px;
            height: 1350px;
            padding: 45px 50px 45px 50px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .page-num {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 120px;
            font-weight: 800;
            color: rgba(255,255,255,0.08);
            line-height: 1;
        }
        .header { margin-bottom: 25px; margin-top: 10px; }
        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.5);
            border-radius: 20px;
            font-size: 14px;
            color: #ef4444;
            margin-bottom: 16px;
        }
        .title {
            font-size: 56px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 26px;
            color: rgba(255,255,255,0.6);
        }
        .comparison {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 20px 0;
        }
        .now, .future {
            text-align: center;
            padding: 20px 40px;
            border-radius: 14px;
            background: rgba(255,255,255,0.05);
        }
        .future {
            background: rgba(251,191,36,0.15);
            border: 1px solid rgba(251,191,36,0.5);
        }
        .comp-label {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 6px;
        }
        .comp-value {
            font-size: 34px;
            font-weight: 700;
            color: #fbbf24;
        }
        .arrow {
            font-size: 36px;
            color: #fbbf24;
        }
        .big-number {
            text-align: center;
            margin: 20px 0;
        }
        .number {
            font-size: 90px;
            font-weight: 800;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .unit {
            font-size: 24px;
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            margin-top: 6px;
        }
        .content-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin: 12px 0;
        }
        .section-title {
            font-size: 20px;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .section-text {
            font-size: 22px;
            line-height: 1.5;
            color: rgba(255,255,255,0.9);
        }
        .spacer { flex: 1; min-height: 20px; }
        .footer {
            padding: 18px 22px;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            border-left: 4px solid #ef4444;
            margin-bottom: 30px;
        }
        .footer-title {
            font-size: 17px;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .footer-text {
            font-size: 21px;
            line-height: 1.4;
            color: rgba(255,255,255,0.9);
        }
        .watermark {
            position: absolute;
            bottom: 8px;
            right: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="page-num">06</div>
        
        <div class="header">
            <div class="tag">趋势 05</div>
            <h1 class="title">100亿数字员工</h1>
            <p class="subtitle">人机比例 1:10</p>
        </div>
        
        <div class="comparison">
            <div class="now">
                <div class="comp-label">现在</div>
                <div class="comp-value">10亿人</div>
            </div>
            <div class="arrow">→</div>
            <div class="future">
                <div class="comp-label">未来</div>
                <div class="comp-value">100亿AI</div>
            </div>
        </div>
        
        <div class="big-number">
            <div class="number">100%</div>
            <div class="unit">软件工程师将得到AI辅助</div>
        </div>
        
        <div class="content-card">
            <div class="section-title">💼 产业影响</div>
            <p class="section-text">企业级AI Agent大规模部署，<span style="color:#ef4444">客服、财务、法务、HR</span>等岗位面临重构。</p>
        </div>
        
        <div class="spacer"></div>
        
        <div class="footer">
            <div class="footer-title">💡 普通人影响</div>
            <p class="footer-text">简历必加"熟练使用AI工具"。5年后：园区没司机、餐厅有机器人、老人有AI陪伴。</p>
        </div>
        
        <div class="watermark">GTC 2026 深度解读</div>
    </div>
</body>
</html>
