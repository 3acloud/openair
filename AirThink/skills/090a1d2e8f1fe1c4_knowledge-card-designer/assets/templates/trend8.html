<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>趋势八 · AI技术霸权</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1080px;
            height: 1350px;
            min-height: 1350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            color: #fff;
            overflow: hidden;
        }
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            background-color: #0f0f1a;
        }
        .card {
            width: 1080px;
            height: 1350px;
            padding: 50px 55px 55px 55px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .page-num {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 120px;
            font-weight: 800;
            color: rgba(255,255,255,0.08);
            line-height: 1;
        }
        .header { margin-bottom: 30px; margin-top: 10px; }
        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.5);
            border-radius: 20px;
            font-size: 14px;
            color: #ef4444;
            margin-bottom: 16px;
        }
        .title {
            font-size: 56px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 26px;
            color: rgba(255,255,255,0.6);
        }
        .content-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 22px;
        }
        .quote {
            font-size: 28px;
            line-height: 1.5;
            color: #fff;
            margin-bottom: 20px;
        }
        .highlight {
            color: #ef4444;
            font-weight: 700;
        }
        .warning-box {
            background: rgba(239,68,68,0.15);
            border-radius: 16px;
            padding: 28px;
            margin: 20px 0;
            border: 1px solid rgba(239,68,68,0.4);
            text-align: center;
        }
        .warning-title {
            font-size: 22px;
            color: #ef4444;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .warning-text {
            font-size: 26px;
            color: rgba(255,255,255,0.9);
            font-weight: 600;
        }
        .section-title {
            font-size: 20px;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .section-text {
            font-size: 24px;
            line-height: 1.55;
            color: rgba(255,255,255,0.85);
        }
        .spacer { flex: 1; }
        .footer {
            padding: 24px 28px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border-left: 4px solid #ef4444;
        }
        .footer-title {
            font-size: 18px;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .footer-text {
            font-size: 22px;
            color: rgba(255,255,255,0.9);
            line-height: 1.5;
        }
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 25px;
            font-size: 13px;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="page-num">09</div>
        <div class="header">
            <div class="tag">趋势 08</div>
            <h1 class="title">AI技术霸权时代</h1>
            <p class="subtitle">不是能不能买，而是让不让你买</p>
        </div>
        
        <div class="content-card">
            <div class="quote">"<span class="highlight">芯片禁令</span>不仅是技术问题，更是<span class="highlight">战略安全问题</span>。"</div>
        </div>
        
        <div class="warning-box">
            <div class="warning-title">⚠️ 技术鸿沟拉大</div>
            <div class="warning-text">Rubin架构性能<span style="color:#fbbf24">350倍</span>提升，但出口管制让中国落后2-3年</div>
        </div>
        
        <div class="content-card">
            <div class="section-title">💼 产业影响</div>
            <p class="section-text"><span class="highlight">半导体、AI芯片</span>等国产替代产业将加速发展。华为、寒武纪等国内厂商迎来历史性机遇。</p>
        </div>
        
        <div class="spacer"></div>
        
        <div class="footer">
            <div class="footer-title">💡 普通人影响</div>
            <p class="footer-text">国产替代相关专业和岗位需求暴增。芯片设计、半导体工艺、AI算法工程师将成为最抢手人才。</p>
        </div>
        <div class="watermark">GTC 2026 深度解读</div>
    </div>
</body>
</html>
