<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>趋势四 · AI智能体</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1080px;
            height: 1350px;
            min-height: 1350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            color: #fff;
            overflow: hidden;
        }
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            background-color: #0f0f1a;
        }
        .card {
            width: 1080px;
            height: 1350px;
            padding: 45px 50px 40px 50px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .page-num {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 120px;
            font-weight: 800;
            color: rgba(255,255,255,0.08);
            line-height: 1;
        }
        .header { margin-bottom: 25px; margin-top: 10px; }
        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.5);
            border-radius: 20px;
            font-size: 14px;
            color: #ef4444;
            margin-bottom: 16px;
        }
        .title {
            font-size: 54px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 26px;
            color: rgba(255,255,255,0.6);
        }
        .visual {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 15px 0;
        }
        .device {
            text-align: center;
            padding: 18px 28px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
        }
        .device-icon {
            font-size: 50px;
            margin-bottom: 8px;
        }
        .device-name {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
        }
        .connector {
            font-size: 28px;
            color: #38bdf8;
        }
        .content-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin: 12px 0;
        }
        .section-title {
            font-size: 20px;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .section-text {
            font-size: 22px;
            line-height: 1.5;
            color: rgba(255,255,255,0.9);
        }
        .highlight {
            color: #ef4444;
            font-weight: 700;
        }
        .spacer { flex: 1; min-height: 20px; }
        .footer {
            padding: 18px 22px;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            border-left: 4px solid #ef4444;
            margin-bottom: 25px;
        }
        .footer-title {
            font-size: 17px;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .footer-text {
            font-size: 21px;
            line-height: 1.4;
            color: rgba(255,255,255,0.9);
        }
        .watermark {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="page-num">05</div>
        
        <div class="header">
            <div class="tag">趋势 04</div>
            <h1 class="title">AI智能体无处不在</h1>
            <p class="subtitle">从手机到汽车，从家居到工厂</p>
        </div>
        
        <div class="visual">
            <div class="device">
                <div class="device-icon">📱</div>
                <div class="device-name">手机</div>
            </div>
            <div class="connector">⟷</div>
            <div class="device">
                <div class="device-icon">🚗</div>
                <div class="device-name">汽车</div>
            </div>
            <div class="connector">⟷</div>
            <div class="device">
                <div class="device-icon">🏠</div>
                <div class="device-name">家居</div>
            </div>
            <div class="connector">⟷</div>
            <div class="device">
                <div class="device-icon">🏭</div>
                <div class="device-name">工厂</div>
            </div>
        </div>
        
        <div class="content-card">
            <div class="section-title">📱 产业影响</div>
            <p class="section-text"><span class="highlight">端侧AI</span>成为标配，手机、PC、汽车都将内置大模型。NVIDIA Isaac平台让机器人拥有"大脑"。</p>
        </div>
        
        <div class="content-card">
            <div class="section-title">💼 普通人机会</div>
            <p class="section-text"><span class="highlight">Agent开发</span>成为新技能，个人可以创建专属AI助手处理日常事务。</p>
        </div>
        
        <div class="spacer"></div>
        
        <div class="footer">
            <div class="footer-title">💡 普通人影响</div>
            <p class="footer-text">你的手机将变成超级助理，汽车变成智能驾驶舱，家里有个全能管家。生活将变得更简单。</p>
        </div>
        
        <div class="watermark">GTC 2026 深度解读</div>
    </div>
</body>
</html>
