<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">用户登录注册流程</title>
  <desc id="desc">从打开 App、校验 Token，到验证码或密码登录、风控检测、签发 JWT 并进入首页；异常分支包含账号锁定与申诉。</desc>
  <defs>
    <radialGradient id="ambient" cx="53%" cy="48%" r="56%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" x2="1">
      <stop offset="0" stop-color="#c9a96e"/><stop offset="1" stop-color="#e8c49a"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d4a574"/></marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fdba74"/></marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <style>
      text{font-family:-apple-system,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
      .ttl{font-family:Georgia,"Times New Roman","Songti SC",serif;font-size:27px;font-weight:700;fill:#f5f0eb}
      .sub{font-size:11px;fill:#a39787;letter-spacing:.12em}
      .section{font-family:Georgia,"Times New Roman","Songti SC",serif;font-size:14px;font-weight:700;fill:#c9a96e}
      .node{fill:#111;stroke-width:1.6}
      .nm{font-size:15px;font-weight:600;fill:#f5f0eb}
      .sm{font-size:11px;fill:#a39787}
      .decision{fill:#16130f;stroke:#fbbf24;stroke-width:1.7}
      .edge{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .primary{stroke:#d4a574;stroke-width:2.2;marker-end:url(#arr-gold)}
      .control{stroke:#fdba74;stroke-width:1.8;marker-end:url(#arr-orange)}
      .exception{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 4;marker-end:url(#arr-gray)}
      .edgeLabel{font-size:11px;font-weight:600;fill:#e8c49a}
      .mutedLabel{font-size:11px;font-weight:600;fill:#94a3b8}
    </style>
  </defs>

  <rect width="1200" height="800" fill="#0a0a0a"/>
  <rect width="1200" height="800" fill="url(#ambient)"/>
  <path d="M48 92 H1152" stroke="url(#goldLine)" stroke-width="1" opacity=".42"/>
  <text id="diagram-title" x="60" y="55" class="ttl">用户登录注册流程</text>
  <text x="60" y="77" class="sub">IDENTITY · RISK CONTROL · SESSION ISSUANCE</text>
  <text x="1140" y="59" text-anchor="end" class="sub" fill="#6b5f53">AUTH FLOW / 01</text>

  <rect x="42" y="112" width="1116" height="152" rx="10" fill="#111" fill-opacity=".22" stroke="#d4a574" stroke-width=".8" stroke-dasharray="6 5" opacity=".72"/>
  <text x="60" y="136" class="section">快速通行</text>
  <rect x="42" y="292" width="1116" height="266" rx="10" fill="#111" fill-opacity=".22" stroke="#d4a574" stroke-width=".8" stroke-dasharray="6 5" opacity=".72"/>
  <text x="60" y="317" class="section">身份验证</text>
  <rect x="642" y="586" width="516" height="150" rx="10" fill="#111" fill-opacity=".22" stroke="#94a3b8" stroke-width=".8" stroke-dasharray="6 5" opacity=".62"/>
  <text x="660" y="612" class="section" fill="#94a3b8">异常处置</text>

  <!-- connectors: drawn below nodes and labels -->
  <path class="edge primary" d="M236 188 H304"/>
  <path class="edge primary" d="M496 188 H964"/>
  <path class="edge control" d="M400 244 V340"/>
  <path class="edge control" d="M332 400 H236 V430"/>
  <path class="edge control" d="M400 424 V480 H236"/>
  <path class="edge primary" d="M332 466 H514"/>
  <path class="edge primary" d="M332 516 H454 V490 H514"/>
  <path class="edge primary" d="M706 466 H784"/>
  <path class="edge primary" d="M954 466 H1046 V264"/>
  <path class="edge exception" d="M610 514 V660 H724"/>
  <path class="edge exception" d="M884 660 H954"/>

  <!-- nodes -->
  <g id="open-app">
    <rect class="node" x="76" y="154" width="160" height="68" rx="6" stroke="#a78bfa"/>
    <rect x="92" y="168" width="22" height="38" rx="4" fill="none" stroke="#a78bfa" stroke-width="1.3"/>
    <circle cx="103" cy="201" r="1.6" fill="#a78bfa"/>
    <text x="128" y="184" class="nm">打开 App</text><text x="128" y="202" class="sm">启动认证会话</text>
  </g>
  <g id="token-check">
    <polygon class="decision" points="400,132 496,188 400,244 304,188"/>
    <text x="400" y="184" text-anchor="middle" class="nm">Token 有效？</text><text x="400" y="204" text-anchor="middle" class="sm">校验状态与时效</text>
  </g>
  <g id="home">
    <rect class="node" x="964" y="154" width="160" height="68" rx="6" stroke="#5a9e6f" filter="url(#softGlow)"/>
    <path d="M983 188 l16-14 16 14 v18 h-11 v-12 h-10 v12 h-11z" fill="none" stroke="#5a9e6f" stroke-width="1.5"/>
    <text x="1027" y="184" class="nm">进入首页</text><text x="1027" y="202" class="sm">已建立登录态</text>
  </g>
  <g id="login-method">
    <polygon class="decision" points="400,316 468,370 400,424 332,370"/>
    <text x="400" y="365" text-anchor="middle" class="nm">登录方式</text><text x="400" y="385" text-anchor="middle" class="sm">二选一</text>
  </g>
  <g id="code-login">
    <rect class="node" x="76" y="430" width="256" height="72" rx="6" stroke="#a78bfa"/>
    <circle cx="103" cy="466" r="13" fill="none" stroke="#a78bfa" stroke-width="1.4"/><path d="M97 466 l4 4 8-9" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="126" y="461" class="nm">验证码登录</text><text x="126" y="480" class="sm">校验手机号与一次性验证码</text>
  </g>
  <g id="password-login">
    <rect class="node" x="76" y="516" width="256" height="72" rx="6" stroke="#a78bfa"/>
    <circle cx="103" cy="551" r="9" fill="none" stroke="#a78bfa" stroke-width="1.4"/><path d="M103 560 v8 M98 568 h10" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="126" y="547" class="nm">密码登录</text><text x="126" y="566" class="sm">校验账号凭据与失败次数</text>
  </g>
  <g id="risk-check">
    <polygon class="decision" points="610,418 706,466 610,514 514,466"/>
    <text x="610" y="462" text-anchor="middle" class="nm">风控通过？</text><text x="610" y="481" text-anchor="middle" class="sm">设备 · 行为 · 频次</text>
  </g>
  <g id="jwt">
    <rect class="node" x="784" y="430" width="170" height="72" rx="6" stroke="#5a9e6f"/>
    <path d="M804 448 h24 l7 7-7 7h-24l-7-7z" fill="none" stroke="#5a9e6f" stroke-width="1.3"/>
    <text x="844" y="461" class="nm">签发 JWT</text><text x="804" y="480" class="sm">生成访问令牌与刷新令牌</text>
  </g>
  <g id="locked">
    <rect class="node" x="724" y="626" width="160" height="68" rx="6" stroke="#f87171"/>
    <rect x="744" y="651" width="20" height="16" rx="3" fill="none" stroke="#f87171" stroke-width="1.4"/><path d="M748 651 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#f87171" stroke-width="1.4"/>
    <text x="778" y="655" class="nm">账号锁定</text><text x="778" y="674" class="sm">阻断高风险访问</text>
  </g>
  <g id="appeal">
    <rect class="node" x="954" y="626" width="170" height="68" rx="6" stroke="#94a3b8"/>
    <path d="M974 643 h23 v26 h-23z M979 650 h13 M979 656 h13 M979 662 h9" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="1008" y="655" class="nm">发起申诉</text><text x="1008" y="674" class="sm">人工复核与解锁</text>
  </g>

  <!-- connector labels -->
  <text x="710" y="180" text-anchor="middle" class="edgeLabel">是 · 会话有效</text>
  <text x="412" y="286" class="edgeLabel">否 · 重新认证</text>
  <text x="272" y="352" text-anchor="middle" class="edgeLabel">验证码</text>
  <text x="422" y="454" class="edgeLabel">密码</text>
  <text x="745" y="458" text-anchor="middle" class="edgeLabel">通过</text>
  <text x="622" y="588" class="mutedLabel">拒绝</text>
  <text x="919" y="652" text-anchor="middle" class="mutedLabel">申诉</text>

  <!-- legend -->
  <g transform="translate(60 758)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#d4a574" stroke-width="2.2"/><circle cx="0" cy="0" r="3" fill="#d4a574"/>
    <text x="48" y="4" class="sm">主认证链路</text>
    <line x1="160" y1="0" x2="198" y2="0" stroke="#fdba74" stroke-width="1.8"/><circle cx="160" cy="0" r="3" fill="#fdba74"/>
    <text x="208" y="4" class="sm">条件分支</text>
    <line x1="300" y1="0" x2="338" y2="0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/><circle cx="300" cy="0" r="3" fill="#94a3b8"/>
    <text x="348" y="4" class="sm">异常处置</text>
  </g>
  <text x="1140" y="762" text-anchor="end" class="sub">SECURE BY DESIGN</text>
</svg>
