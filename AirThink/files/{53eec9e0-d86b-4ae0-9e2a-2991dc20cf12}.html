<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETL 实时数据管道</title>
<style>
:root{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#111827;background:#f8fafc}*{box-sizing:border-box}body{margin:0;min-width:760px}.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid #e5e7eb}.top h1{font-size:18px;margin:0}.top p{font-size:12px;color:#6b7280;margin:2px 0 0}.spacer{flex:1}button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;color:#374151}button:hover,button.active{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}.stage{overflow:hidden;position:relative;background:radial-gradient(#dbe3ee 1px,transparent 1px);background-size:24px 24px}.stage svg{width:100%;height:100%;display:block;touch-action:none}.node{cursor:pointer}.node .card{transition:.18s}.node:hover .card,.node:focus .card{stroke:#2563eb;stroke-width:2.3}.edge{transition:.2s}.dim{opacity:.09}.legend{display:flex;gap:18px;align-items:center;padding:10px 20px;background:#fff;border-top:1px solid #e5e7eb;font-size:12px;color:#4b5563}.key{display:flex;align-items:center;gap:7px;cursor:pointer}.swatch{width:28px;height:3px;border-radius:2px}.hint{margin-left:auto;color:#9ca3af}.tip{position:fixed;display:none;max-width:260px;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-shadow:0 10px 24px #0f172a1c;font-size:12px;line-height:1.55;pointer-events:none;z-index:3}.badge{font-size:10px;font-weight:700}.title{font-size:14px;font-weight:600}.sub{font-size:11px;fill:#6b7280}.label{font-size:11px;font-weight:600}.lane{font-size:11px;font-weight:700;letter-spacing:.08em}
</style>
</head>
<body>
<main class="app">
 <header class="top"><div><h1>ETL 实时数据管道</h1><p>CDC 采集 → 流式清洗 → 实时数仓 → BI 洞察</p></div><div class="spacer"></div><button id="fit">适配画布</button><button id="mainOnly">聚焦主链路</button><button id="all">显示全部</button></header>
 <section class="stage" id="stage" aria-label="可交互 ETL 数据流图">
 <svg id="diagram" viewBox="0 0 1240 660" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">ETL 实时数据管道数据流图</title><desc id="svgDesc">业务库变更经 CDC 进入 Kafka，由 Flink 清洗后写入 Doris 并供 BI 展示。脏数据进入旁路，失败消息通过重试队列，超过阈值进入死信队列。</desc>
  <defs>
   <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
   <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
   <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
   <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
  </defs>
  <g id="viewport">
   <rect x="34" y="64" width="1172" height="282" rx="12" fill="#eff6ff" fill-opacity=".52" stroke="#bfdbfe" stroke-dasharray="7 5"/><text class="lane" x="54" y="89" fill="#2563eb">实时主链路</text>
   <rect x="326" y="392" width="880" height="214" rx="12" fill="#fff7ed" fill-opacity=".7" stroke="#fed7aa" stroke-dasharray="7 5"/><text class="lane" x="346" y="417" fill="#c2410c">异常治理旁路</text>
   <g class="edge main" data-flow="main" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"><path d="M224 210H286"/><path d="M446 210H508"/><path d="M668 210H730"/><path d="M890 210H952"/></g>
   <g fill="#1d4ed8" class="label"><text x="255" y="197" text-anchor="middle">变更事件</text><text x="477" y="197" text-anchor="middle">CDC 消息</text><text x="699" y="197" text-anchor="middle">清洁数据</text><text x="921" y="197" text-anchor="middle">查询结果</text></g>
   <g class="edge dirty" data-flow="dirty" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"><path d="M588 258V470H730"/></g><text class="label" x="604" y="372" fill="#b91c1c">脏数据</text>
   <g class="edge retry" data-flow="retry" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arr-purple)"><path d="M810 470H870"/><path d="M950 432V336H648V258"/></g>
   <text class="label" x="840" y="457" fill="#7e22ce" text-anchor="middle">失败事件</text><text class="label" x="782" y="323" fill="#7e22ce" text-anchor="middle">重试回放（退避）</text>
   <g class="edge dlq" data-flow="dlq" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arr-red)"><path d="M950 508V548H1018"/></g><text class="label" x="984" y="536" fill="#b91c1c" text-anchor="middle">超过阈值</text>
   <g class="node" tabindex="0" data-title="业务数据库" data-info="交易、订单等业务表产生 INSERT / UPDATE / DELETE 变更。"><rect class="card" x="64" y="154" width="160" height="104" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><ellipse cx="104" cy="184" rx="22" ry="8" fill="#dbeafe" stroke="#4479a1"/><path d="M82 184v32c0 11 44 11 44 0v-32" fill="#eff6ff" stroke="#4479a1"/><ellipse cx="104" cy="216" rx="22" ry="8" fill="#dbeafe" stroke="#4479a1"/><text class="badge" x="104" y="204" text-anchor="middle" fill="#315d7d">DB</text><text class="title" x="142" y="190">业务库</text><text class="sub" x="142" y="210">MySQL / OLTP</text><text class="sub" x="142" y="228">变更源</text></g>
   <g class="node" tabindex="0" data-title="CDC 采集" data-info="捕获数据库日志变更，保持顺序并输出标准化变更事件。"><rect class="card" x="286" y="154" width="160" height="104" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="326" cy="196" r="23" fill="#14b8a6"/><path d="M315 196h22M326 185v22" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text class="title" x="362" y="190">CDC 采集</text><text class="sub" x="362" y="210">Binlog 捕获</text><text class="sub" x="362" y="228">顺序与位点</text></g>
   <g class="node" tabindex="0" data-title="Kafka" data-info="承载 CDC 事件，解耦生产与消费，并支持持久化回放。"><rect class="card" x="508" y="154" width="160" height="104" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><circle cx="548" cy="196" r="23" fill="#231f20"/><text class="badge" x="548" y="200" text-anchor="middle" fill="#fff">KAFKA</text><text class="title" x="584" y="190">Kafka</text><text class="sub" x="584" y="210">CDC Topic</text><text class="sub" x="584" y="228">缓冲与回放</text></g>
   <g class="node" tabindex="0" data-title="Flink 实时清洗" data-info="执行校验、去重、字段标准化与维表关联；异常记录投递至旁路。"><rect class="card" x="730" y="154" width="160" height="104" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/><circle cx="770" cy="196" r="23" fill="#e6526f"/><path d="M758 188h24l-8 8 8 8h-24l8-8z" fill="#fff"/><text class="title" x="806" y="190">Flink</text><text class="sub" x="806" y="210">实时清洗</text><text class="sub" x="806" y="228">校验 · 去重 · 关联</text></g>
   <g class="node" tabindex="0" data-title="Doris 实时数仓" data-info="接收清洁明细与聚合结果，提供高并发低延迟分析查询。"><rect class="card" x="952" y="154" width="160" height="104" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><ellipse cx="992" cy="182" rx="23" ry="8" fill="#86efac" stroke="#16a34a"/><path d="M969 182v34c0 11 46 11 46 0v-34" fill="#dcfce7" stroke="#16a34a"/><ellipse cx="992" cy="216" rx="23" ry="8" fill="#86efac" stroke="#16a34a"/><text class="badge" x="992" y="204" text-anchor="middle" fill="#166534">DORIS</text><text class="title" x="1030" y="190">Doris</text><text class="sub" x="1030" y="210">实时数仓</text><text class="sub" x="1030" y="228">明细与聚合</text></g>
   <g class="node" tabindex="0" data-title="BI 看板" data-info="面向运营与管理人员展示实时指标、趋势和异常告警。"><rect class="card" x="1112" y="154" width="70" height="104" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><rect x="1127" y="176" width="40" height="28" rx="3" fill="#fff" stroke="#f59e0b"/><path d="M1134 197v-8m9 8v-14m9 14v-20m9 20v-11" stroke="#f59e0b" stroke-width="4"/><text class="title" x="1147" y="225" text-anchor="middle">BI</text><text class="sub" x="1147" y="242" text-anchor="middle">看板</text></g>
   <g class="node" tabindex="0" data-title="脏数据旁路" data-info="隔离格式错误、规则校验失败或无法关联的记录，避免阻塞主链路。"><rect class="card" x="730" y="432" width="160" height="76" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><path d="M754 454h26l-4 29h-18z" fill="#fee2e2" stroke="#dc2626"/><path d="M758 450h18" stroke="#dc2626" stroke-width="3"/><text class="title" x="796" y="461">脏数据旁路</text><text class="sub" x="796" y="482">隔离 · 审计 · 修复</text></g>
   <g class="node" tabindex="0" data-title="重试队列" data-info="对可恢复失败执行指数退避和限次重试，成功后回放至 Flink。"><rect class="card" x="870" y="432" width="160" height="76" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/><circle cx="904" cy="470" r="20" fill="#ede9fe" stroke="#9333ea"/><path d="M895 466a10 10 0 1 1 0 9M895 466v-8m0 8h8" fill="none" stroke="#9333ea" stroke-width="2.5"/><text class="title" x="934" y="461">重试队列</text><text class="sub" x="934" y="482">退避 · 限次 · 回放</text></g>
   <g class="node" tabindex="0" data-title="死信队列（DLQ）" data-info="保存超过重试阈值的消息，等待人工排查、修复和受控重放。"><rect class="card" x="1018" y="522" width="164" height="66" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><path d="M1036 544h26v20h-26z" fill="#fee2e2" stroke="#dc2626"/><path d="M1036 544l13 11 13-11" fill="none" stroke="#dc2626"/><text class="title" x="1072" y="548">死信队列</text><text class="sub" x="1072" y="568">人工处置 · 受控重放</text></g>
  </g>
 </svg>
 </section>
 <footer class="legend"><span class="key" data-filter="main"><i class="swatch" style="background:#2563eb"></i>主数据流</span><span class="key" data-filter="dirty"><i class="swatch" style="background:#dc2626"></i>脏数据 / DLQ</span><span class="key" data-filter="retry"><i class="swatch" style="background:#9333ea"></i>重试回放</span><span class="hint">滚轮缩放 · 拖动画布 · 点击节点查看说明</span></footer>
</main><div class="tip" id="tip"></div>
<script>
(()=>{const svg=document.querySelector('#diagram'),vp=document.querySelector('#viewport'),stage=document.querySelector('#stage'),tip=document.querySelector('#tip');let s=1,tx=0,ty=0,drag=false,last=[0,0];const apply=()=>vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${s})`);const reset=()=>{s=1;tx=0;ty=0;apply()};stage.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY<0?1.1:.9;s=Math.max(.55,Math.min(2.5,s*k));apply()},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag=true;last=[e.clientX,e.clientY];svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;tx+=(e.clientX-last[0])/s;ty+=(e.clientY-last[1])/s;last=[e.clientX,e.clientY];apply()});svg.addEventListener('pointerup',()=>drag=false);document.querySelector('#fit').onclick=reset;const show=type=>document.querySelectorAll('.edge').forEach(x=>x.classList.toggle('dim',type&&x.dataset.flow!==type));document.querySelector('#mainOnly').onclick=()=>show('main');document.querySelector('#all').onclick=()=>show(null);document.querySelectorAll('.key').forEach(k=>k.onclick=()=>show(k.dataset.filter));document.querySelectorAll('.node').forEach(n=>{const open=e=>{tip.innerHTML=`<strong>${n.dataset.title}</strong><br>${n.dataset.info}`;tip.style.display='block';tip.style.left=Math.min(innerWidth-280,e.clientX+14)+'px';tip.style.top=Math.min(innerHeight-90,e.clientY+14)+'px'};n.addEventListener('pointerenter',open);n.addEventListener('pointermove',open);n.addEventListener('pointerleave',()=>tip.style.display='none');n.addEventListener('focus',()=>{const r=n.getBoundingClientRect();open({clientX:r.right,clientY:r.top})});n.addEventListener('blur',()=>tip.style.display='none')});})();
</script>
</body></html>
