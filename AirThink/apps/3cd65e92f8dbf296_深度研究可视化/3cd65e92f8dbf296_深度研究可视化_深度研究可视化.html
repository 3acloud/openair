<main class="shell"><section id="consolePage"><div class="eyebrow" data-i18n="workspace">RESEARCH WORKSPACE</div><h1 class="page-title" data-i18n="startTitle">发起深度研究</h1><p class="page-intro" data-i18n="startIntro">输入研究主题与重点，AI 将自动组织内容并生成多张数据可视化图表。</p><div class="dashboard"><section class="panel"><div class="panel-head"><div><h2><i class="fa-solid fa-flask"></i> <span data-i18n="newResearch">新建研究</span></h2><p data-i18n="formHint">描述您的研究方向与预期读者</p></div></div><form id="researchForm"><div class="field"><label for="researchForm_topic" data-i18n="topic">研究主题</label><input id="researchForm_topic" name="研究主题" required maxlength="300" autocomplete="off"></div><div class="field"><label for="researchForm_focus" data-i18n="focus">研究重点</label><textarea id="researchForm_focus" name="研究重点" required></textarea></div><div class="field"><label for="researchForm_audience" data-i18n="audience">目标受众</label><select id="researchForm_audience" name="目标受众"><option value="通用读者" data-i18n="general">通用读者</option><option value="管理决策者" data-i18n="managers">管理决策者</option><option value="专业研究者" data-i18n="researchers">专业研究者</option><option value="学生" data-i18n="students">学生</option><option value="客户" data-i18n="clients">客户</option></select></div><div class="field"><label for="researchForm_language" data-i18n="outputLang">输出语言</label><select id="researchForm_language" name="输出语言"><option value="中文" data-i18n="chinese">中文</option><option value="英文" data-i18n="english">英文</option><option value="中英双语" data-i18n="bilingual">中英双语</option></select></div><button class="primary wide" id="submitButton" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="submit">开始深度研究并生成可视化</span></button><div class="status hidden" id="formStatus" role="status" aria-live="polite"></div></form></section><section class="panel report-panel"><div class="panel-head"><div><h2 data-i18n="reportTitle">深度研究可视化报告</h2><p data-i18n="reportHint">研究完成后，报告与图表将显示于此</p></div><div class="report-actions"><button class="secondary" id="newTaskButton" type="button"><i class="fa-solid fa-plus"></i> <span data-i18n="newTask">新建任务</span></button></div></div><div class="report-body" id="reportBody"><div class="empty"><i class="fa-solid fa-chart-network fa-chart-simple"></i><strong data-i18n="emptyReport">等待开启新的研究</strong><span data-i18n="emptyReportHint">填写左侧表单，生成第一份可视化报告。</span></div></div></section></div></section><section id="historyPage" class="hidden"><div class="eyebrow" data-i18n="archive">RESEARCH ARCHIVE</div><div class="history-top"><div><h1 class="page-title" data-i18n="history">研究历史库</h1><p class="page-intro" data-i18n="historyIntro">集中管理与查阅您过往生成的所有深度研究可视化成果。</p></div><button class="secondary" id="refreshHistoryButton" type="button"><i class="fa-solid fa-rotate"></i> <span data-i18n="refresh">刷新</span></button></div><div class="stat"><i class="fa-solid fa-layer-group"></i><div><strong id="recordCount">—</strong><span data-i18n="totalTasks">总研究任务数</span></div></div><div class="history-grid" id="historyGrid"></div><div class="list-message hidden" id="historyMessage"></div></section></main>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("3cd65e92f8dbf296_深度研究可视化")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {

        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));

        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }

      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {

      document.body.removeChild(fileInput);
    });

    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function languageFromBrowser(){try{const list=navigator.languages;if(!list||!list.length)return 'cn';return list.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}catch{return 'cn'}}
function initialLanguage(){const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)return stored==='en'?'en':'cn';const url=new URL(location.href);const q=url.searchParams.get('lang');if(q==='cn'||q==='en')return q;return languageFromBrowser()}
function applyLanguage(lang){uiLang=lang;document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});$('topLangButton').textContent=lang==='cn'?'EN':'中文';$('mobileLangButton').textContent=lang==='cn'?'English':'中文';document.title=tr('appName');if(!historyRows.length&&currentPage==='history'&&!$('historyMessage').classList.contains('hidden'))$('historyMessage').textContent=tr('emptyHistory')}
function toggleLanguage(){const next=uiLang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',next);applyLanguage(next);closeMenu()}
function closeMenu(){$('mobileMenu').classList.add('hidden');$('menuBackdrop').classList.add('hidden');$('menuButton').setAttribute('aria-expanded','false')}
function toggleMenu(){const show=$('mobileMenu').classList.contains('hidden');$('mobileMenu').classList.toggle('hidden',!show);$('menuBackdrop').classList.toggle('hidden',!show);$('menuButton').setAttribute('aria-expanded',String(show))}
function showPage(page,record=true){if(page===currentPage){closeMenu();return}if(record)historyStack.push({page:currentPage,scroll:window.scrollY});currentPage=page;$('consolePage').classList.toggle('hidden',page!=='console');$('historyPage').classList.toggle('hidden',page!=='history');document.querySelectorAll('[data-page]').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='history')loadHistory()}
function setStatus(message,kind=''){$('formStatus').textContent=message;$('formStatus').className='status'+(kind?' '+kind:'')+(message?'':' hidden')}
function setBusy(value){isBusy=value;$('submitButton').disabled=value;for(const field of $('researchForm').elements){if(field!==$('submitButton'))field.disabled=value}}
function emptyReport(){$('reportBody').innerHTML='<div class="empty"><i class="fa-solid fa-chart-simple"></i><strong>'+escapeHTML(tr('emptyReport'))+'</strong><span>'+escapeHTML(tr('emptyReportHint'))+'</span></div>'}
function fileUrl(value){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(value)}
function safeAssetUrl(value){const s=String(value||'').trim();if(!s)return '';if(/^(?:https?:|data:image\/)/i.test(s))return s;if(/^(?:javascript:|data:|vbscript:)/i.test(s))return '';return fileUrl(s)}
function renderMarkdown(text,target){if(!window.marked||!window.DOMPurify){target.textContent=tr('noMarkdown');return}const renderer=new marked.Renderer();renderer.image=function(arg){const href=typeof arg==='string'?arg:arg.href;const title=typeof arg==='string'?'':arg.title;const label=typeof arg==='string'?'':arg.text;const url=safeAssetUrl(href);if(!url)return '';return '<a href="'+escapeHTML(url)+'" download target="_blank" rel="noopener noreferrer"><img src="'+escapeHTML(url)+'" alt="'+escapeHTML(label||'')+'"'+(title?' title="'+escapeHTML(title)+'"':'')+' loading="lazy"></a>'};marked.setOptions({gfm:true,breaks:false,renderer});const dirty=marked.parse(String(text||''));target.innerHTML=DOMPurify.sanitize(dirty,{ADD_ATTR:['target','download']});target.querySelectorAll('a').forEach(a=>{if(!a.hasAttribute('download')){a.target='_blank';a.rel='noopener noreferrer'}})}
function showReport(text){$('reportBody').classList.add('markdown-body');renderMarkdown(text,$('reportBody'))}
function openReportModal(title){$('reportModalTitle').textContent=title||tr('reportTitle');$('reportModalBody').textContent=tr('reportLoading');$('reportModalLayer').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeReportModal(){$('reportModalLayer').classList.add('hidden');document.body.style.overflow=''}
function openConfirm(row){deleteRow=row;$('confirmModalLayer').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeConfirm(){$('confirmModalLayer').classList.add('hidden');deleteRow=0;document.body.style.overflow=''}
function isGoodResponse(value){const s=String(value??'').trim();if(!s)return false;if(/^(error|错误|失败)\s*[:：]/i.test(s))throw new Error(s);return true}
async function pollReport(row,token){const deadline=Date.now()+1800000;while(Date.now()<deadline&&token===pollToken){const result=await callAppBridge({type:'轮询',data:TABLE,payload:'可视化结果'});if(token!==pollToken)return;isGoodResponse(result);if(String(result??'').trim()){currentRow=row;showReport(result);setStatus('', '');return}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken)setStatus(tr('timedOut'),'error')}
async function submitResearch(event){event.preventDefault();if(isBusy)return;const form=$('researchForm');if(!form.reportValidity())return;const payload={};for(const field of new FormData(form).entries())payload[field[0]]=field[1];setBusy(true);setStatus(tr('submitting'));const token=++pollToken;try{const result=await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(payload)});if(result&&/^(error|错误|失败)\s*[:：]/i.test(String(result).trim()))throw new Error(result);currentRow=1;setStatus(tr('loading'));$('formStatus').insertAdjacentHTML('afterbegin','<span class="spinner"></span>');await pollReport(1,token)}catch(err){if(token===pollToken)setStatus(tr('failed')+(err?.message||String(err)),'error')}finally{if(token===pollToken)setBusy(false)}}
function newTask(){++pollToken;setBusy(false);currentRow=0;$('researchForm').reset();setStatus('');emptyReport();$('reportBody').classList.remove('markdown-body');$('researchForm_topic').focus()}
async function loadHistory(){const grid=$('historyGrid'),msg=$('historyMessage');grid.replaceChildren();msg.textContent=tr('historyLoading');msg.classList.remove('hidden');$('recordCount').textContent='—';try{const [countText,csv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'研究主题,研究重点,目标受众,输出语言'})]);const count=Number.parseInt(String(countText).trim(),10);$('recordCount').textContent=Number.isFinite(count)?String(count):String(countText||'0');historyRows=String(csv||'').trim()?parseCSV(String(csv)):[];grid.replaceChildren();historyRows.forEach((row,index)=>{const card=document.createElement('article');card.className='history-card';const title=document.createElement('h3');title.textContent=row[0]||'—';const summary=document.createElement('p');summary.textContent=row[1]||'—';const tags=document.createElement('div');tags.className='tags';for(const value of [row[2],row[3]])if(value){const tag=document.createElement('span');tag.className='tag';tag.textContent=value;tags.append(tag)}const actions=document.createElement('div');actions.className='card-actions';const view=document.createElement('button');view.type='button';view.className='primary';view.innerHTML='<i class="fa-solid fa-eye"></i> '+escapeHTML(tr('view'));view.addEventListener('click',()=>viewHistory(index+1,row[0]));const del=document.createElement('button');del.type='button';del.className='secondary';del.innerHTML='<i class="fa-solid fa-trash"></i> '+escapeHTML(tr('delete'));del.addEventListener('click',()=>openConfirm(index+1));actions.append(view,del);card.append(title,summary,tags,actions);grid.append(card)});msg.classList.toggle('hidden',historyRows.length>0);if(!historyRows.length)msg.textContent=tr('emptyHistory')}catch(err){historyRows=[];msg.textContent=tr('failed')+(err?.message||String(err));msg.classList.remove('hidden')}}
async function viewHistory(row,title){currentRow=row;openReportModal(title);try{const result=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'可视化结果/'+row});if($('reportModalLayer').classList.contains('hidden'))return;if(String(result||'').trim())renderMarkdown(result,$('reportModalBody'));else $('reportModalBody').textContent=tr('reportMissing')}catch(err){$('reportModalBody').textContent=tr('failed')+(err?.message||String(err))}}
async function deleteHistory(){const row=deleteRow;if(!row)return;const btn=$('confirmDeleteButton');btn.disabled=true;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});closeConfirm();if(currentRow===row){currentRow=0;emptyReport()}else if(currentRow>row)currentRow--;await loadHistory()}catch(err){$('confirmBody').textContent=tr('failed')+(err?.message||String(err))}finally{btn.disabled=false}}
function airBack(){if(!$('confirmModalLayer').classList.contains('hidden')){closeConfirm();return 'false'}if(!$('reportModalLayer').classList.contains('hidden')){closeReportModal();return 'false'}if(!$('mobileMenu').classList.contains('hidden')){closeMenu();return 'false'}if(historyStack.length){const previous=historyStack.pop();showPage(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false'}return 'true'}
function keepInputVisible(){const focused=document.activeElement;if(!focused||!focused.matches('input,textarea,select'))return;setTimeout(()=>focused.scrollIntoView({block:'center',behavior:'smooth'}),150)}
async function initialize(){applyLanguage(initialLanguage());try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.mode=String(mode).trim()==='暗色'?'dark':'light'}catch{document.documentElement.dataset.mode='light'}document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>showPage(btn.dataset.page)));$('brandButton').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('topLangButton').addEventListener('click',toggleLanguage);$('mobileLangButton').addEventListener('click',toggleLanguage);$('menuButton').addEventListener('click',toggleMenu);$('menuBackdrop').addEventListener('click',closeMenu);$('researchForm').addEventListener('submit',submitResearch);$('newTaskButton').addEventListener('click',newTask);$('refreshHistoryButton').addEventListener('click',loadHistory);$('reportModalClose').addEventListener('click',closeReportModal);$('reportModalLayer').addEventListener('click',event=>{if(event.target===$('reportModalLayer'))closeReportModal()});$('confirmClose').addEventListener('click',closeConfirm);$('confirmCancel').addEventListener('click',closeConfirm);$('confirmModalLayer').addEventListener('click',event=>{if(event.target===$('confirmModalLayer'))closeConfirm()});$('confirmDeleteButton').addEventListener('click',deleteHistory);document.addEventListener('keydown',event=>{if(event.key==='Escape')airBack()});document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))keepInputVisible()});if(window.visualViewport)window.visualViewport.addEventListener('resize',keepInputVisible);emptyReport()}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })()});
</script>
</body>
</html>
