<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

    fileInput.addEventListener('change', (event) => {

      document.body.removeChild(fileInput);

      document.body.removeChild(fileInput);
    });

    document.body.appendChild(fileInput);

    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

 cn:{appName:'物理教案设计系统',home:'首页',library:'教案库',newLesson:'新建教案',eyebrow:'面向物理教师的智能工具',heroTitle:'物理教案智能设计',heroDesc:'依据课题、学段、学情与实验条件，一键生成一体化教案框架，赋能物理教学。',startCreate:'开始新建教案',total:'总教案数',junior:'初中教案数',senior:'高中教案数',recent:'最近教案',viewAll:'查看全部',libraryTitle:'物理教案库',libraryDesc:'集中管理和查看您设计的所有物理教案',searchPlaceholder:'搜索物理主题',allStages:'全部学段',juniorStage:'初中',seniorStage:'高中',collegeStage:'大学基础',otherStage:'其他',allLessons:'全部教案',stage:'年级学段',topic:'物理主题',concept:'核心观念',direction:'应用方向',hours:'课时安排',actions:'操作',createTitle:'新建物理教案',createDesc:'填写课题与教学背景信息，AI智能体将为您生成框架。',baseInfo:'教案基础信息',chooseStage:'请选择学段',topicHint:'例如：牛顿第二定律',matter:'物质观',motion:'运动观',energy:'能量观',interaction:'相互作用',evolution:'演化观',hoursHint:'例如：2课时',weakness:'学情弱项',weaknessHint:'描述学生理解难点',experiment:'实验条件',experimentHint:'填写可用器材和实验条件',life:'生活应用',technology:'科技应用',frontier:'前沿应用',variation:'题目变式',generate:'生成教案框架',generating:'正在进行物理观念、概念建构、规律教学分析，请稍候...',resultTitle:'教案生成结果',copy:'复制教案',view:'查看教案',delete:'删除',empty:'暂无教案',noResults:'没有匹配的教案',confirmDelete:'确定删除这篇教案吗？',deleted:'教案已删除',saved:'教案已提交，正在生成',timeout:'生成超时，请稍后到教案库查看',failed:'操作失败：',copied:'已复制教案文本',count:'篇教案',detail:'教案详情',untitled:'未命名主题'},
 en:{appName:'Physics Lesson Planner',home:'Home',library:'Lesson Library',newLesson:'New Lesson',eyebrow:'A smart tool for physics teachers',heroTitle:'Design physics lessons',heroDesc:'Build a complete lesson framework from your topic, grade level, students and experiment resources.',startCreate:'Create a lesson',total:'Total lessons',junior:'Junior lessons',senior:'Senior lessons',recent:'Recent lessons',viewAll:'View all',libraryTitle:'Physics Lesson Library',libraryDesc:'Manage and review all your physics lesson plans.',searchPlaceholder:'Search physics topics',allStages:'All levels',juniorStage:'Junior high',seniorStage:'Senior high',collegeStage:'University basics',otherStage:'Other',allLessons:'All lessons',stage:'Grade level',topic:'Physics topic',concept:'Core concepts',direction:'Applications',hours:'Class periods',actions:'Actions',createTitle:'New Physics Lesson',createDesc:'Enter the topic and teaching context to generate a lesson framework.',baseInfo:'Lesson basics',chooseStage:'Select grade level',topicHint:'e.g. Newton’s second law',matter:'Matter',motion:'Motion',energy:'Energy',interaction:'Interaction',evolution:'Evolution',hoursHint:'e.g. 2 periods',weakness:'Student difficulties',weaknessHint:'Describe likely learning obstacles',experiment:'Experiment resources',experimentHint:'Available equipment and conditions',life:'Daily life',technology:'Technology',frontier:'Frontier',variation:'Problem variations',generate:'Generate lesson framework',generating:'Analyzing concepts, knowledge building and physical laws. Please wait...',resultTitle:'Generated lesson',copy:'Copy lesson',view:'View lesson',delete:'Delete',empty:'No lessons yet',noResults:'No matching lessons',confirmDelete:'Delete this lesson?',deleted:'Lesson deleted',saved:'Lesson submitted; generation in progress',timeout:'Generation timed out. Check the library later.',failed:'Operation failed: ',copied:'Lesson text copied',count:'lessons',detail:'Lesson details',untitled:'Untitled topic'}
};
const STAGE_KEYS={'初中':'juniorStage','高中':'seniorStage','大学基础':'collegeStage','其他':'otherStage'};
let lang='cn',page='home',historyStack=[],rows=[],currentMarkdown='',busy=false,toastTimer=null,pollToken=0;
function tr(key){return WORDS[lang][key]||key}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dom(id){return document.getElementById(id)}
function showToast(message){const el=dom('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},4000)}
function initialLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved!==null&&saved!=='')return saved==='en'?'en':'cn';const p=new URLSearchParams(location.search).get('lang');if(p==='cn'||p==='en')return p;try{const list=navigator.languages;if(!list||!list.length)return 'cn';return list.some(function(v){return /^zh(?:-|$)/i.test(v)})?'cn':'en'}catch(e){return 'cn'}}
function applyLanguage(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=tr(el.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=tr(el.dataset.i18nPlaceholder)});dom('desktopLang').textContent=lang==='cn'?'EN':'中文';dom('mobileLang').textContent=lang==='cn'?'English':'中文';document.title=tr('appName');renderRecent();renderLibrary()}
function toggleLanguage(){lang=lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',lang);applyLanguage();closeMenu()}
function closeMenu(){dom('mobileMenu').classList.remove('open');dom('hamburger').setAttribute('aria-expanded','false')}
function openPage(next,record){if(page===next){closeMenu();return}if(record!==false)historyStack.push({page:page,scroll:window.scrollY});page=next;document.querySelectorAll('.page').forEach(function(el){el.classList.toggle('active',el.id==='page-'+next)});document.querySelectorAll('.nav-link').forEach(function(el){el.classList.toggle('active',el.dataset.page===next)});closeMenu();window.scrollTo(0,0);if(next==='home')refreshHome();if(next==='library')refreshLibrary()}
function closeDetail(){dom('detailModal').hidden=true;document.body.style.overflow=''}
function airBack(){if(!dom('detailModal').hidden){closeDetail();return 'false'}if(dom('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const last=historyStack.pop();openPage(last.page,false);requestAnimationFrame(function(){window.scrollTo(0,last.scroll)});return 'false'}return 'true'}
window.airBack=airBack;
function readRows(csv,columns){return parseCSV(String(csv||'')).filter(function(r){return r.some(function(v){return String(v).trim()!==''})}).map(function(r,i){const item={row:i+1};columns.forEach(function(name,j){item[name]=r[j]||''});return item})}
async function refreshHome(){try{const results=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'年级学段'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'年级学段,物理主题,课时安排'})]);dom('totalCount').textContent=String(results[0]).trim()||'0';const stages=readRows(results[1],['年级学段']);dom('juniorCount').textContent=stages.filter(function(r){return r['年级学段']==='初中'}).length;dom('seniorCount').textContent=stages.filter(function(r){return r['年级学段']==='高中'}).length;const recent=readRows(results[2],['年级学段','物理主题','课时安排']);renderRecent(recent)}catch(e){dom('recentList').innerHTML='<div class="empty error">'+esc(tr('failed')+e)+'</div>';showToast(tr('failed')+e)}}
let recentRows=[];
function renderRecent(newRows){if(newRows)recentRows=newRows;const el=dom('recentList');el.replaceChildren();if(!recentRows.length){el.innerHTML='<div class="empty">'+esc(tr('empty'))+'</div>';return}recentRows.slice(0,3).forEach(function(item){const b=document.createElement('button');b.type='button';b.className='lesson-card';b.innerHTML='<span class="tag">'+esc(tr(STAGE_KEYS[item['年级学段']]||item['年级学段']))+'</span><strong>'+esc(item['物理主题']||tr('untitled'))+'</strong><small><i class="fa-regular fa-clock"></i> '+esc(item['课时安排'])+'</small>';b.addEventListener('click',async function(){openPage('library');await openDetail(item.row,item['物理主题'])});el.appendChild(b)})}
async function refreshLibrary(){try{const csv=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:'年级学段,物理主题,核心观念,应用方向,课时安排'});rows=readRows(csv,['年级学段','物理主题','核心观念','应用方向','课时安排']);renderLibrary()}catch(e){dom('lessonRows').innerHTML='';dom('libraryEmpty').hidden=false;dom('libraryEmpty').textContent=tr('failed')+e;showToast(tr('failed')+e)}}
function renderLibrary(){const query=dom('topicSearch').value.trim().toLocaleLowerCase(),filter=dom('stageFilter').value;const visible=rows.filter(function(r){return (!query||r['物理主题'].toLocaleLowerCase().includes(query))&&(!filter||r['年级学段']===filter)});dom('libraryCount').textContent=visible.length+' '+tr('count');const body=dom('lessonRows');body.replaceChildren();dom('libraryEmpty').hidden=visible.length>0;dom('libraryEmpty').textContent=rows.length?tr('noResults'):tr('empty');visible.forEach(function(item){const row=document.createElement('tr');const cells=[tr(STAGE_KEYS[item['年级学段']]||item['年级学段']),item['物理主题'],item['核心观念'],item['应用方向'],item['课时安排']];cells.forEach(function(value,i){const td=document.createElement('td');td.className=i===1?'topic':i===2||i===3?'truncate':'';td.textContent=value;td.title=value;row.appendChild(td)});const action=document.createElement('td');action.className='actions';const view=document.createElement('button');view.type='button';view.className='button secondary small';view.innerHTML='<i class="fa-regular fa-eye"></i> '+esc(tr('view'));view.addEventListener('click',function(){openDetail(item.row,item['物理主题'])});const del=document.createElement('button');del.type='button';del.className='button danger small';del.innerHTML='<i class="fa-regular fa-trash-can"></i> '+esc(tr('delete'));del.addEventListener('click',function(){deleteLesson(item.row)});action.append(view,del);row.appendChild(action);body.appendChild(row)})}
function markdown(text){let raw=esc(text).replace(/\n/g,'<br>');if(window.marked){raw=marked.parse(String(text||''),{gfm:true,breaks:true})}if(window.DOMPurify)raw=DOMPurify.sanitize(raw,{ADD_ATTR:['download']});return raw}
function renderMarkdown(element,text){element.innerHTML=markdown(text);element.querySelectorAll('img').forEach(function(img){const source=img.getAttribute('src')||'';if(source&&!/^(?:https?:|data:|blob:)/i.test(source)){img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(source)}img.addEventListener('click',function(){const a=document.createElement('a');a.href=img.currentSrc||img.src;a.download='';document.body.appendChild(a);a.click();a.remove()})})}
async function openDetail(row,topic){try{dom('detailTitle').textContent=topic||tr('detail');dom('detailMarkdown').textContent=tr('generating');dom('detailModal').hidden=false;document.body.style.overflow='hidden';const value=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'教案设计/'+row});if(!dom('detailModal').hidden)renderMarkdown(dom('detailMarkdown'),String(value||''))}catch(e){dom('detailMarkdown').textContent=tr('failed')+e}}
async function deleteLesson(row){if(!window.confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});showToast(tr('deleted'));await Promise.all([refreshLibrary(),refreshHome()])}catch(e){showToast(tr('failed')+e)}}
function formValue(name){return dom('lessonForm').elements.namedItem(name).value.trim()}
function checkedValues(name){return Array.from(dom('lessonForm').querySelectorAll('input[type="checkbox"][name="'+name+'"]:checked')).map(function(el){return el.value}).join(',')}
function sleep(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
async function pollLesson(token){const start=Date.now();while(token===pollToken&&Date.now()-start<1800000){await sleep(1000);if(token!==pollToken)return;try{const value=String(await callAppBridge({type:'轮询',data:FORM_TABLE,payload:'教案设计'})||'').trim();if(value){currentMarkdown=value;renderMarkdown(dom('resultMarkdown'),value);dom('resultPanel').hidden=false;dom('loading').hidden=true;busy=false;dom('lessonForm_submit').disabled=false;await Promise.all([refreshHome(),refreshLibrary()]);return}}catch(e){showToast(tr('failed')+e);break}}busy=false;dom('lessonForm_submit').disabled=false;dom('loading').hidden=true;showToast(tr('timeout'))}
async function submitLesson(event){event.preventDefault();if(busy)return;const form=dom('lessonForm');if(!form.reportValidity())return;const data={'年级学段':formValue('年级学段'),'物理主题':formValue('物理主题'),'核心观念':checkedValues('核心观念'),'课时安排':formValue('课时安排'),'学情弱项':formValue('学情弱项'),'实验条件':formValue('实验条件'),'应用方向':checkedValues('应用方向')};busy=true;dom('lessonForm_submit').disabled=true;dom('loading').hidden=false;dom('resultPanel').hidden=true;try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(data)});showToast(tr('saved'));form.reset();pollToken++;await pollLesson(pollToken)}catch(e){busy=false;dom('lessonForm_submit').disabled=false;dom('loading').hidden=true;showToast(tr('failed')+e)}}
async function copyLesson(){if(!currentMarkdown)return;try{await navigator.clipboard.writeText(currentMarkdown);showToast(tr('copied'))}catch(e){const t=document.createElement('textarea');t.value=currentMarkdown;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast(tr('copied'))}}
function setupKeyboard(){document.addEventListener('focusin',function(e){if(!e.target.matches('input,textarea,select'))return;setTimeout(function(){e.target.scrollIntoView({block:'center',behavior:'smooth'})},300)});if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){const a=document.activeElement;if(a&&a.matches('input,textarea,select'))setTimeout(function(){a.scrollIntoView({block:'center',behavior:'smooth'})},150)})}}
async function initialize(){lang=initialLanguage();applyLanguage();document.querySelectorAll('[data-page]').forEach(function(el){el.addEventListener('click',function(){openPage(el.dataset.page)})});dom('brand').addEventListener('click',function(){if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});dom('heroCreate').addEventListener('click',function(){openPage('create')});dom('libraryCreate').addEventListener('click',function(){openPage('create')});dom('viewAll').addEventListener('click',function(){openPage('library')});dom('desktopLang').addEventListener('click',toggleLanguage);dom('mobileLang').addEventListener('click',toggleLanguage);dom('hamburger').addEventListener('click',function(){const menu=dom('mobileMenu');menu.classList.toggle('open');dom('hamburger').setAttribute('aria-expanded',String(menu.classList.contains('open')))});document.addEventListener('click',function(e){if(!dom('topbar').contains(e.target))closeMenu()});dom('topicSearch').addEventListener('input',renderLibrary);dom('stageFilter').addEventListener('change',renderLibrary);dom('lessonForm').addEventListener('submit',submitLesson);dom('copyLesson').addEventListener('click',copyLesson);dom('closeDetail').addEventListener('click',closeDetail);dom('detailModal').addEventListener('click',function(e){if(e.target===dom('detailModal'))closeDetail()});document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!dom('detailModal').hidden)closeDetail();else closeMenu()}});setupKeyboard();try{const mode=String(await callAppBridge({type:'模式'})).trim();document.body.classList.toggle('dark',mode==='暗色')}catch(e){}await Promise.all([refreshHome(),refreshLibrary()])}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',async function(){await initialize()},{once:true})}else{(async () => { await initialize(); })()}
</script>
