<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {

    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });

    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `

      gap: 20px;
    `;
    
    // 创建拍照按钮

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);

            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

async function getCSV(fields){const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:fields.join(',')});return String(csv||'').trim()?parseCSV(String(csv)).map((row,i)=>Object.fromEntries(fields.map((f,j)=>[f,row[j]||''])).valueOf()).map((obj,i)=>({...obj,_row:i+1})):[]}
async function getCell(field,row){return await callAppBridge({type:'GetCellValue',data:SOURCE,payload:`${field}/${row}`})}
async function setCell(field,row,value){return await callAppBridge({type:'SetCellValue',data:SOURCE,payload:`${field}/${row}/${String(value??'')}`})}

async function getDetail(row){const obj={_row:row};for(const f of DETAIL_FIELDS)obj[f]=await getCell(f,row);return obj}
function stat(icon,label,value){return `<div class="stat"><i class="fa-solid ${icon}"></i><span class="num">${esc(value)}</span><span class="label">${esc(t(label))}</span></div>`}

function renderAnalyzeRecent(){$('analysisRecent').innerHTML=newest(records).slice(0,3).map(x=>`<li>${listItem(x)}</li>`).join('')||`<li class="list-item muted">${t('noData')}</li>`;$('analysisRecent').querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>loadResult(Number(el.dataset.row)))}

function markdown(raw){let html=window.marked?.parse?marked.parse(String(raw||''),{gfm:true,breaks:true}):`<p>${esc(raw).replace(/\n/g,'<br>')}</p>`;html=window.DOMPurify?DOMPurify.sanitize(html):esc(raw).replace(/\n/g,'<br>');const tmp=document.createElement('div');tmp.innerHTML=html;tmp.querySelectorAll('img').forEach(img=>{const a=document.createElement('a');let src=img.getAttribute('src')||'';if(!/^https?:|^data:/i.test(src))src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);img.src=src;a.href=src;a.download='';img.replaceWith(a);a.appendChild(img)});tmp.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});return tmp.innerHTML}
function emptyHTML(key,icon='fa-align-left'){return `<div class="empty"><div><i class="fa-solid ${icon}"></i><div>${esc(t(key))}</div></div></div>`}
function renderRecords(){const query=$('recordSearch').value.trim().toLocaleLowerCase(),target=$('targetFilter').value,difficulty=$('difficultyFilter').value,review=$('reviewFilter').value;let rows=records.filter(r=>(!query||['任务标题','英文句子','句子来源'].some(f=>r[f].toLocaleLowerCase().includes(query)))&&(!target||r['提取目标'].includes(target))&&(!difficulty||r['难度等级']===difficulty)&&(!review||r['是否已复核']===review));rows.sort((a,b)=>sortDir*(String(a[sortKey]).localeCompare(String(b[sortKey]),'zh-CN')||(a._row-b._row)));const pages=Math.max(1,Math.ceil(rows.length/10));recordPage=Math.min(recordPage,pages);const shown=rows.slice((recordPage-1)*10,recordPage*10);$('recordsHead').innerHTML=`<tr>${FIELDS.map(f=>`<th>${f==='任务标题'||f==='创建时间'?`<button class="sort-btn" type="button" data-sort="${f}">${esc(t(f==='任务标题'?'sortTitle':'sortCreated'))} ${sortKey===f?(sortDir===1?'↑':'↓'):''}</button>`:esc(({英文句子:t('sentence'),句子来源:t('source'),提取目标:t('target'),难度等级:t('difficulty'),是否已复核:t('reviewed'),复核备注:t('note')}[f]||f))}</th>`).join('')}<th>${t('actions')}</th></tr>`;$('recordsHead').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortDir=sortKey===b.dataset.sort?-sortDir:(b.dataset.sort==='创建时间'?-1:1);sortKey=b.dataset.sort;renderRecords()});$('recordsBody').innerHTML=shown.map(r=>`<tr>${FIELDS.map(f=>`<td title="${esc(r[f])}">${esc(f==='英文句子'?clip(r[f],100):f==='复核备注'?clip(r[f],65):r[f])}</td>`).join('')}<td class="actions"><button class="btn small" data-action="detail" data-row="${r._row}">${t('detailsBtn')}</button><button class="btn small" data-action="edit" data-row="${r._row}">${t('edit')}</button><button class="btn small danger" data-action="delete" data-row="${r._row}">${t('delete')}</button><button class="btn small" data-action="review" data-row="${r._row}">${r['是否已复核']==='是'?t('unmark'):t('mark')}</button></td></tr>`).join('')||`<tr><td colspan="9" class="muted">${t('noData')}</td></tr>`;$('recordsBody').querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const row=Number(b.dataset.row),action=b.dataset.action;if(action==='detail')openDetail(row);if(action==='edit')openEdit(row);if(action==='delete')openDelete(row);if(action==='review')toggleReview(row)});$('recordsPager').innerHTML=`<button class="btn small" id="prevPage" ${recordPage<=1?'disabled':''}>${t('prev')}</button><span>${t('page')} ${recordPage} / ${pages}</span><button class="btn small" id="nextPage" ${recordPage>=pages?'disabled':''}>${t('next')}</button>`;$('prevPage').onclick=()=>{recordPage--;renderRecords()};$('nextPage').onclick=()=>{recordPage++;renderRecords()}}
function renderReview(){const r=records;$('reviewStats').innerHTML=stat('fa-hourglass-half','pendingCount',r.filter(x=>x['是否已复核']!=='是').length)+stat('fa-circle-check','doneCount',r.filter(x=>x['是否已复核']==='是').length)+stat('fa-triangle-exclamation','complexPending',r.filter(x=>x['难度等级']==='复杂'&&x['是否已复核']!=='是').length);$('reviewToggle').innerHTML=['pending','done','all'].map(m=>`<button class="btn small ${m===reviewMode?'active':''}" data-mode="${m}">${t(m)}</button>`).join('');$('reviewToggle').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{reviewMode=b.dataset.mode;renderReview()});const filtered=newest(r).filter(x=>reviewMode==='all'||(reviewMode==='done'?x['是否已复核']==='是':x['是否已复核']!=='是'));$('reviewList').innerHTML=filtered.map(x=>`<li>${listItem(x)}</li>`).join('')||`<li class="list-item muted">${t('noData')}</li>`;$('reviewList').querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>selectReview(Number(el.dataset.row)));if(!reviewRow)$('reviewDetail').innerHTML=emptyHTML('noSelection','fa-clipboard-check')}

async function openDetail(index){const token=++detailToken;modalOpen('detailOverlay');$('detailContent').innerHTML=emptyHTML('polling','fa-spinner fa-spin');try{const rec=records.find(x=>x._row===index);if(!rec)throw Error(t('noData'));const row=await resolveRow(rec);const d=await getDetail(row);if(token!==detailToken)return;$('detailContent').innerHTML=detailMeta(d)+`<h3 class="section-label">${esc(lang==='cn'?'主干提取结果':'Core analysis')}</h3><div class="markdown-body">${markdown(d['主干提取结果']||t('emptyResult'))}</div><div class="btn-row" style="margin-top:20px"><button id="detailEdit" class="btn" type="button">${t('edit')}</button></div>`;$('detailEdit').onclick=()=>{modalClose('detailOverlay');openEdit(index)}}catch(e){if(token===detailToken)$('detailContent').textContent=t('error')+': '+String(e)}}

async function changeReview(value){try{await setCell('是否已复核',reviewRow,value);await refreshAll();await selectReview(reviewRow)}catch(e){if($('reviewMessage'))showError('reviewMessage',e)}}
async function loadResult(index){$('analysisResult').innerHTML=emptyHTML('polling','fa-spinner fa-spin');try{const rec=records.find(x=>x._row===index);if(!rec)throw Error(t('noData'));const row=await resolveRow(rec);const d=await getDetail(row);$('analysisResult').innerHTML=resultHTML(d)}catch(e){$('analysisResult').textContent=t('error')+': '+String(e)}}
async function submitNew(e){e.preventDefault();if(polling)return;const v=valuesFrom('newForm');v['英文句子']=v['英文句子'].trim();if(!v['英文句子']){showError('analyzeMessage',t('required'));return}if(!v['提取目标']){showError('analyzeMessage',t('selectTarget'));return}v['任务标题']=v['任务标题'].trim()||v['英文句子'].slice(0,30);v['创建时间']=localDateTime();v['是否已复核']='否';v['复核备注']='';polling=true;const token=++pollToken;$('analyzeSubmit').disabled=true;$('analyzeMessage').textContent=t('polling');$('analysisResult').innerHTML=`<div class="result-head"><h3>${esc(v['任务标题'])}</h3><span class="tag">${esc(v['难度等级'])}</span><span class="tag">${esc(v['提取目标'])}</span></div>${emptyHTML('polling','fa-spinner fa-spin')}`;try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(v)});currentRow=1;await refreshAll();const deadline=Date.now()+1800000;while(token===pollToken&&Date.now()<deadline){const content=await getCell('主干提取结果',1);if(String(content||'').trim()){if(token===pollToken){$('analysisResult').innerHTML=resultHTML({...v,'主干提取结果':content});$('analyzeMessage').textContent=''}return}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken){$('analyzeMessage').textContent=t('timeout');$('analysisResult').innerHTML=emptyHTML('emptyResult')}}catch(err){if(token===pollToken){showError('analyzeMessage',err);$('analysisResult').innerHTML=emptyHTML('emptyResult')}}finally{if(token===pollToken){polling=false;$('analyzeSubmit').disabled=false;await refreshAll().catch(()=>{})}}}
function clearAnalysis(){if(polling)return;$('newForm').reset();$('analyzeMessage').textContent='';$('analysisResult').innerHTML=emptyHTML('waiting');currentRow=0}
function bindEvents(){$('brandButton').onclick=()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)};$('menuButton').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))};document.addEventListener('pointerdown',e=>{if(!$('topNav').contains(e.target))closeMenu()});$('languageButton').onclick=toggleLanguage;$('startButton').onclick=()=>navigate('analyze');$('homeAllButton').onclick=()=>navigate('records');$('analyzeRecordsButton').onclick=()=>navigate('records');$('recordsNewButton').onclick=()=>{clearAnalysis();navigate('analyze')};$('newForm').onsubmit=submitNew;$('clearButton').onclick=clearAnalysis;$('editForm').onsubmit=saveEdit;for(const [id,overlay] of [['detailClose','detailOverlay'],['editClose','editOverlay'],['editCancel','editOverlay'],['confirmClose','confirmOverlay'],['confirmCancel','confirmOverlay']])$(id).onclick=()=>modalClose(overlay);for(const id of ['detailOverlay','editOverlay','confirmOverlay'])$(id).addEventListener('pointerdown',e=>{if(e.target===$(id))modalClose(id)});$('confirmDelete').onclick=confirmDelete;for(const id of ['recordSearch','targetFilter','difficultyFilter','reviewFilter'])$(id).addEventListener(id==='recordSearch'?'input':'change',()=>{recordPage=1;renderRecords()});window.addEventListener('resize',fitNav);document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});document.addEventListener('focusin',e=>{if(!e.target.matches('input,textarea,select'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a?.matches?.('input,textarea,select'))setTimeout(()=>a.scrollIntoView({block:'center'}),120)})}
async function initialize(){let languages=navigator.languages;if(!languages||!languages.length)lang='cn';else lang=languages.some(x=>String(x).toLowerCase().startsWith('zh'))?'cn':'en';const urlLang=new URLSearchParams(location.search).get('lang');if(urlLang==='cn'||urlLang==='en')lang=urlLang;const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)lang=stored==='en'?'en':'cn';try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}bindEvents();setLanguage(lang);clearAnalysis();try{await refreshAll()}catch(e){$('homeRecent').innerHTML=`<li class="list-item muted">${esc(t('error')+': '+String(e))}</li>`}}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
</script>
