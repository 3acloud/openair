<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

        url = 'http://' + window.location.hostname + ':3130/request';

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**
 * 上传文件到Flask服务端
 * @param {File} file - 要上传的文件
 * @returns {Promise<string>} - 返回GUID文件名
 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function chips(record){return '<div class="chips"><span class="chip">'+esc(record['页数']||t('defaultPages'))+'</span><span class="chip">'+esc(themeLabel(record['主题风格']))+'</span><span class="chip">'+esc(mediaLabel(record['媒体需求']))+'</span><span class="chip">'+esc(formatLabel(record['交付格式']))+'</span></div>'}
function cardHTML(record,recent=false){const file=record['素材文件'];return '<article class="card lift record-card" tabindex="0" role="button" data-act="details" data-row="'+record.row+'"><div class="record-cover">'+(file&&isImage(file)?'<img src="'+esc(fileURL(file))+'" alt="'+esc(file)+'" loading="lazy">':'<i class="fa-solid fa-film" aria-hidden="true"></i>')+'</div><div class="record-body"><div class="record-title" data-summary-row="'+record.row+'">'+t('loading')+'</div>'+chips(record)+(recent?'<div id="recentStatus-'+record.row+'" class="status">'+t('loading')+'</div>':'')+'</div>'+(recent?'':'<div class="record-actions">'+['details','edit','download','remove'].map(action=>'<button data-act="'+action+'" data-row="'+record.row+'">'+t(action)+'</button>').join('')+'</div>')+'</article>'}
async function hydrateSummaries(){const generation=++summaryGeneration,sourceGeneration=dataGeneration;const nodes=[...document.querySelectorAll('[data-summary-row]')];const rows=[...new Set(nodes.map(node=>Number(node.dataset.summaryRow)))];for(const row of rows){try{const brief=await api('GetCellValue','演示需求/'+row);if(generation!==summaryGeneration||sourceGeneration!==dataGeneration)return;const chars=Array.from(brief),summary=chars.slice(0,42).join('')+(chars.length>42?'…':'');for(const node of nodes)if(Number(node.dataset.summaryRow)===row&&node.isConnected)node.textContent=summary}catch(error){for(const node of nodes)if(Number(node.dataset.summaryRow)===row&&node.isConnected)node.textContent=t('loadFailure')}}}
function emptyHTML(matches=false){return '<div class="card empty"><i class="fa-solid fa-clapperboard"></i><h3>'+t(matches?'noMatches':'empty')+'</h3><p class="muted">'+t(matches?'noMatchesHint':'emptyHint')+'</p>'+(matches?'':'<button class="primary" data-act="new">'+t('start')+'</button>')+'</div>'}
function renderHome(){const heat=THEMES.map(value=>records.filter(r=>r['主题风格']===value).length),max=Math.max(1,...heat);$('heatGrid').innerHTML=THEMES.map((value,i)=>'<button class="heat-button" data-act="heat" data-value="'+esc(value)+'"><div class="heat-meta"><span>'+esc(themeLabel(value))+'</span><span>'+heat[i]+'</span></div><div class="track"><span style="width:'+heat[i]/max*100+'%"></span></div></button>').join('');$('recentWall').innerHTML=records.length?records.slice(0,4).map(r=>cardHTML(r,true)).join(''):emptyHTML();$('atlas').innerHTML=themeButtons('',true);hydrateRecent(dataGeneration)}
async function hydrateRecent(generation){for(const record of records.slice(0,4)){try{const value=(await api('GetCellValue','演示文件/'+record.row)).trim();if(generation!==dataGeneration)return;const node=$('recentStatus-'+record.row);if(node){node.textContent=t(value?'ready':'notReady');node.classList.toggle('ready',!!value)}}catch(error){const node=$('recentStatus-'+record.row);if(node)node.textContent=t('loadFailure')}}}
function option(value,label){return '<option value="'+esc(value)+'">'+esc(label)+'</option>'}
function renderFilters(){const values=['themeFilter','mediaFilter','formatFilter','pageSort'].map(id=>$(id).value);$('librarySearch').placeholder=t('search');$('librarySearch').setAttribute('aria-label',t('search'));$('themeFilter').innerHTML=option('',t('allThemes'))+THEMES.map(x=>option(x,themeLabel(x))).join('');$('mediaFilter').innerHTML=option('',t('allMedia'))+MEDIA.map(x=>option(x,mediaLabel(x))).join('');$('formatFilter').innerHTML=option('',t('allFormats'))+FORMATS.map(x=>option(x,formatLabel(x))).join('');$('pageSort').innerHTML=option('',t('newest'))+option('asc',t('ascending'))+option('desc',t('descending'));['themeFilter','mediaFilter','formatFilter','pageSort'].forEach((id,i)=>{$(id).value=values[i];$(id).setAttribute('aria-label',t(['theme','media','format','pages'][i]))})}
function filteredRecords(){const needle=$('librarySearch').value.trim().toLocaleLowerCase(),theme=$('themeFilter').value,media=$('mediaFilter').value,format=$('formatFilter').value;const result=records.filter(r=>(!needle||r['演示需求'].toLocaleLowerCase().includes(needle))&&(!theme||r['主题风格']===theme)&&(!media||r['媒体需求']===media)&&(!format||r['交付格式']===format));const direction=$('pageSort').value;if(direction)result.sort((a,b)=>{const x=a['页数'].trim(),y=b['页数'].trim();if(!x)return y?1:a.row-b.row;if(!y)return -1;return (Number(x)-Number(y))*(direction==='asc'?1:-1)||a.row-b.row});return result}
function renderLibrary(){const rows=filteredRecords(),visible=rows.slice(0,limit);$('libraryCount').textContent=lang==='cn'?'显示 '+Math.min(limit,rows.length)+' / '+rows.length+' 条演示':Math.min(limit,rows.length)+' of '+rows.length+' presentations';$('viewCards').classList.toggle('selected',view==='cards');$('viewTable').classList.toggle('selected',view==='table');$('moreButton').hidden=visible.length>=rows.length;
if(!rows.length){$('libraryResults').innerHTML=emptyHTML(records.length>0);hydrateSummaries();return}
if(view==='cards')$('libraryResults').innerHTML='<div class="wall">'+visible.map(r=>cardHTML(r)).join('')+'</div>';
else $('libraryResults').innerHTML='<div class="table-scroll" tabindex="0"><table><thead><tr>'+FIELDS.map(f=>'<th>'+fieldLabel(f)+'</th>').join('')+'<th>'+t('details')+'</th></tr></thead><tbody>'+visible.map(r=>'<tr data-act="details" data-row="'+r.row+'" tabindex="0">'+FIELDS.map(f=>'<td>'+esc(f==='主题风格'?themeLabel(r[f]):f==='媒体需求'?mediaLabel(r[f]):f==='交付格式'?formatLabel(r[f]):r[f])+'</td>').join('')+'<td>'+['details','edit','download','remove'].map(action=>'<button data-act="'+action+'" data-row="'+r.row+'">'+t(action)+'</button>').join('')+'</td></tr>').join('')+'</tbody></table></div>';
hydrateSummaries();
}
async function loadData(){const generation=++dataGeneration;$('loadBanner').hidden=false;$('loadBanner').textContent=t('loading');try{const responses=await Promise.all([api('GetTableCSV',FIELDS.join(',')),api('GetRecordCount'),api('GetTableCSV','交付格式'),api('GetTableCSV','主题风格')]);if(generation!==dataGeneration)return;const parsed=parseCSV(responses[0]);records=parsed.map((cells,index)=>{const result={row:index+1};FIELDS.forEach((name,i)=>result[name]=cells[i]||'');return result});const number=Number(responses[1].trim());if(!Number.isSafeInteger(number)||number<0)throw new Error(t('loadFailure'));count=number;$('statTotal').textContent=count;const formats=parseCSV(responses[2]);$('statHTML').textContent=formats.filter(r=>r[0]===FORMATS[0]).length;$('statPPTX').textContent=formats.filter(r=>r[0]===FORMATS[1]).length;$('statPDF').textContent=formats.filter(r=>r[0]===FORMATS[2]).length;
renderHome();const styles=parseCSV(responses[3]);const heat=THEMES.map(value=>styles.filter(row=>row[0]===value).length),max=Math.max(1,...heat);$('heatGrid').innerHTML=THEMES.map((value,i)=>'<button class="heat-button" data-act="heat" data-value="'+esc(value)+'"><div class="heat-meta"><span>'+esc(themeLabel(value))+'</span><span>'+heat[i]+'</span></div><div class="track"><span style="width:'+heat[i]/max*100+'%"></span></div></button>').join('');renderLibrary();renderPreview();$('loadBanner').hidden=true;
}catch(error){if(generation!==dataGeneration)return;$('loadBanner').innerHTML=esc(errorMessage(error))+' <button data-act="refreshData">'+t('retry')+'</button>';toast(errorMessage(error));throw error}}
function closeMenu(){$('mobileNav').hidden=true;$('hamburger').setAttribute('aria-expanded','false')}
function adaptNav(){const navbar=$('navbar'),desktop=$('desktopNav');desktop.hidden=false;$('hamburger').hidden=true;const needed=$('brand').getBoundingClientRect().width+desktop.scrollWidth+80;const fit=needed<=navbar.clientWidth;desktop.hidden=!fit;$('hamburger').hidden=fit;if(fit)closeMenu()}
function activatePage(target,scroll=0){page=target;for(const section of document.querySelectorAll('.page'))section.hidden=section.id!=='page-'+target;for(const button of document.querySelectorAll('[data-act="page"]')){button.classList.toggle('active',button.dataset.page===target);if(button.closest('nav'))button.setAttribute('aria-current',button.dataset.page===target?'page':'false')}closeMenu();requestAnimationFrame(()=>window.scrollTo(0,scroll))}
function navigate(target){if(target!==page){historyStack.push({page:page,scroll:window.scrollY});activatePage(target)}else closeMenu()}
function pushOverlay(kind,title,body,footer='',row=0,reading=false){const el=document.createElement('div');el.className='overlay'+(reading?' reading-overlay':'');el.style.zIndex=2001+overlays.length*2;el.innerHTML='<section class="dialog '+(kind==='confirm'?'confirm-dialog':'')+'" role="dialog" aria-modal="true" aria-labelledby="dialog-title-'+overlays.length+'"><div class="dialog-head"><h2 id="dialog-title-'+overlays.length+'">'+esc(title)+'</h2><button data-act="close" aria-label="'+t('close')+'"><i class="fa-solid fa-xmark"></i></button></div><div class="dialog-body">'+body+'<div class="keyboard-pad"></div></div>'+(footer?'<div class="dialog-footer">'+footer+'</div>':'')+'</section>';const entry={kind:kind,el:el,row:row,previousFocus:document.activeElement};overlays.push(entry);document.body.append(el);document.body.style.overflow='hidden';el.addEventListener('click',event=>{if(event.target===el)closeOverlay(entry)});requestAnimationFrame(()=>el.querySelector('button,input,textarea')?.focus({preventScroll:true}));return entry}
function closeOverlay(entry=overlays[overlays.length-1]){if(!entry)return;if(entry!==overlays[overlays.length-1])return;if(busy&&entry.kind!=='confirm'){toast(t('busy'));return}overlays.pop();entry.el.remove();if(entry.resolve)entry.resolve(false);if(!overlays.length)document.body.style.overflow='';if(entry.previousFocus?.isConnected)entry.previousFocus.focus({preventScroll:true})}
function confirmAction(title,body){return new Promise(resolve=>{const entry=pushOverlay('confirm',title,'<p>'+esc(body)+'</p>','<button data-act="close">'+t('cancel')+'</button><button class="primary" data-act="confirm">'+t('confirm')+'</button>');entry.resolve=resolve})}
window.airBack=function(){if(overlays.length){closeOverlay();return 'false'}if(!$('mobileNav').hidden){closeMenu();return 'false'}if(historyStack.length){const previous=historyStack.pop();activatePage(previous.page,previous.scroll);return 'false'}return 'true'};
async function readRecord(row){const record={row:row};for(const name of [...FIELDS,'演示文件'])record[name]=await api('GetCellValue',name+'/'+row);return record}
async function showDetails(row){const record=await readRecord(row);currentRow=row;previewGeneration++;renderFilm(record,true);filmOutput=record['演示文件'].trim();renderPreview();const title=record['演示需求'].split(/\r?\n/)[0]||t('details');const entry=pushOverlay('details',title,'<div class="chips">'+chips(record)+'<span class="chip">'+t('row')+' '+row+'</span></div><div class="detail-section markdown" data-part="brief"></div><div class="detail-section"><h3>'+t('material')+'</h3><div class="material-view" data-part="material"></div></div><div class="detail-section"><h3>'+t('output')+'</h3><div data-part="output"></div><button data-act="refreshDetails" data-row="'+row+'">'+t('refreshFile')+'</button></div>','<button data-act="edit" data-row="'+row+'">'+t('edit')+'</button><button class="primary" data-act="download" data-row="'+row+'">'+t('download')+'</button><button class="danger" data-act="remove" data-row="'+row+'">'+t('remove')+'</button>',row,true);entry.record=record;markdown(entry.el.querySelector('[data-part="brief"]'),record['演示需求']);renderMaterial(entry.el.querySelector('[data-part="material"]'),record['素材文件']);renderOutput(entry.el.querySelector('[data-part="output"]'),record['演示文件'],record['交付格式'])}
async function showEditor(row){const record=await readRecord(row);currentRow=row;previewGeneration++;renderFilm(record,true);filmOutput=record['演示文件'].trim();renderPreview();const top=overlays[overlays.length-1];if(top?.kind==='details')closeOverlay(top);const entry=pushOverlay('edit',t('editHeading'),'<p class="field-caption">'+t('editNote')+'</p>'+buildForm('editor',record)+'<h3>'+t('output')+'</h3><div data-part="output"></div><p id="editorValidation" class="error" aria-live="polite"></p>','<button class="primary" data-act="save" data-row="'+row+'">'+t('save')+'</button><button data-act="copy" data-row="'+row+'">'+t('copy')+'</button><button data-act="close">'+t('cancel')+'</button>',row);entry.record=record;fillForm('editor',record);renderOutput(entry.el.querySelector('[data-part="output"]'),record['演示文件'],record['交付格式'])}
async function mayReplaceFilm(){return currentRow!==0||JSON.stringify(readForm('film'))===filmBase||await confirmAction(t('discardTitle'),t('discardBody'))}
async function newFilm(theme=null,copied=null){if(!await mayReplaceFilm())return;previewGeneration++;currentRow=0;filmOutput='';const data=copied?Object.fromEntries(FIELDS.map(name=>[name,copied[name]??''])):defaultData();if(theme)data['主题风格']=theme;renderFilm(data);filmBase=JSON.stringify(defaultData());renderPreview();navigate('studio')}
async function browse(target){if(target<1||target>count||!await mayReplaceFilm())return;const record=await readRecord(target);previewGeneration++;currentRow=target;filmOutput=record['演示文件'].trim();renderFilm(record,true);renderPreview()}
function stopPoll(){clearTimeout(pollTimer);clearTimeout(pollExpiry);pollTimer=null;pollExpiry=null;poll=null;if($('film'))updateForm('film')}
function schedulePoll(){clearTimeout(pollTimer);if(!poll)return;const remaining=poll.deadline-Date.now();if(remaining<=0){stopPoll();renderPreview();toast(t('timeout'));return}pollTimer=setTimeout(pollTick,Math.min(2000,remaining))}
async function pollTick(){if(!poll)return;const job=poll;if(Date.now()>=job.deadline){stopPoll();renderPreview();toast(t('timeout'));return}if(pollInFlight){schedulePoll();return}pollInFlight=job;try{const filename=(await api('GetCellValue','演示文件/'+job.row)).trim();if(poll!==job)return;if(filename){if(currentRow===job.row){filmOutput=filename;renderPreview()}for(const entry of overlays){if(entry.row===job.row&&entry.record){entry.record['演示文件']=filename;renderOutput(entry.el.querySelector('[data-part="output"]'),filename,entry.record['交付格式'])}}stopPoll();renderPreview();toast(t('ready'));hydrateRecent(dataGeneration)}else schedulePoll()}catch(error){if(poll===job){toast(errorMessage(error));schedulePoll()}}finally{pollInFlight=null}}
async function generate(){if(currentRow!==0||poll)return;const data=normalized(readForm('film')),message=validate(data);if(message){toast(message);return}checkMutationResponse(await api('SubmitRecord',JSON.stringify(data),TABLE));currentRow=1;previewGeneration++;filmOutput='';renderFilm(data,true);poll={row:1,deadline:Date.now()+1800000};pollExpiry=setTimeout(()=>{if(poll){stopPoll();renderPreview();toast(t('timeout'))}},1800000);renderPreview();toast(t('submitted'));schedulePoll();await loadData()}
async function refreshPreview(){if(!currentRow){toast(t('noRecord'));return}if(poll&&poll.row===currentRow){await pollTick();return}const row=currentRow,generation=previewGeneration;const filename=(await api('GetCellValue','演示文件/'+row)).trim();if(row===currentRow&&generation===previewGeneration){filmOutput=filename;renderPreview()}}
async function downloadRecord(row){const filename=(await api('GetCellValue','演示文件/'+row)).trim();if(filename)openURL(fileURL(filename));else toast(t('notReady'))}
async function saveEditor(){const entry=overlays[overlays.length-1];if(entry?.kind!=='edit')return;const data=normalized(readForm('editor')),message=validate(data);if(message){$('editorValidation').textContent=message;return}for(const field of FIELDS)checkMutationResponse(await api('SetCellValue',field+'/'+entry.row+'/'+data[field]));entry.record={...entry.record,...data};if(currentRow===entry.row){renderFilm(data,true);renderPreview()}await loadData();toast(t('saved'))}
async function deleteRecord(row){if(poll){toast(t('pendingDelete'));return}if(!await confirmAction(t('deleteTitle'),t('deleteBody')))return;busy=true;try{checkMutationResponse(await api('DeleteRecord',row.toString()));for(let i=overlays.length-1;i>=0;i--){const entry=overlays[i];if(entry.row===row){entry.el.remove();overlays.splice(i,1)}else if(entry.row>row){entry.row--;if(entry.record)entry.record.row--;for(const button of entry.el.querySelectorAll('[data-row]'))if(Number(button.dataset.row)>row)button.dataset.row=String(Number(button.dataset.row)-1)}}
if(!overlays.length)document.body.style.overflow='';if(currentRow===row){currentRow=0;filmOutput='';renderFilm(defaultData())}else if(currentRow>row)currentRow--;previewGeneration++;await loadData();toast(t('deleted'))}finally{busy=false;updateForm('film');renderPreview()}}
async function chooseMaterial(prefix,type){if($(prefix).dataset.readonly==='true')return;if(type==='clear'){ $(prefix+'-material').value='';updateForm(prefix);return}const filename=(await callAppBridge({type:type})).trim();if(filename&&$(prefix)){$(prefix+'-material').value=filename;updateForm(prefix)}}
function localize(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('brand')+' · '+t('subtitle');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('navbar').setAttribute('aria-label',lang==='cn'?'主导航':'Main navigation');$('previousRecord').setAttribute('aria-label',lang==='cn'?'上一条':'Previous record');$('nextRecord').setAttribute('aria-label',lang==='cn'?'下一条':'Next record');$('hamburger').setAttribute('aria-label',lang==='cn'?'打开导航菜单':'Open navigation menu');const data=$('film')?readForm('film'):defaultData(),baseline=filmBase;renderFilm(data,currentRow!==0);filmBase=baseline||JSON.stringify(defaultData());renderFilters();renderHome();renderLibrary();renderPreview();adaptNav()}
async function handleAction(button){const action=button.dataset.act,row=Number(button.dataset.row);
if(action==='closeApp'){if(typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);else toast(t('error')+': closeFullHtml');return}
if(action==='menu'){$('mobileNav').hidden=!$('mobileNav').hidden;$('hamburger').setAttribute('aria-expanded',String(!$('mobileNav').hidden));return}
if(action==='page'){navigate(button.dataset.page);return}
if(action==='close'){closeOverlay();return}
if(action==='confirm'){const entry=overlays.pop();entry.el.remove();if(!overlays.length)document.body.style.overflow='';entry.resolve(true);return}
if(action==='language'){lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch(e){}const query=new URL(location.href);query.searchParams.set('lang',lang);try{window.history.replaceState(null,'',query)}catch(e){}closeMenu();localize();return}
if(action==='view'){view=button.dataset.view;renderLibrary();return}
if(action==='more'){limit+=12;renderLibrary();return}
if(action==='pick'){const prefix=button.dataset.prefix;if($(prefix).dataset.readonly==='true')return;const index=FIELDS.indexOf(button.dataset.field);$(prefix+'-'+suffixes[index]).value=button.dataset.value;updateForm(prefix);return}
if(action==='heat'){$('themeFilter').value=button.dataset.value;limit=12;renderLibrary();navigate('library');return}
if(busy){toast(t('busy'));return}
if(action==='new'||action==='atlas'){await newFilm(action==='atlas'?button.dataset.value:null);return}
if(action==='remove'){await deleteRecord(row);return}
if(action==='copy'){const entry=overlays[overlays.length-1],data=readForm('editor');if(await mayReplaceFilm()){closeOverlay(entry);await newFilm(null,data)}return}
busy=true;updateForm('film');renderPreview();button.disabled=true;
try{switch(action){
case 'material':await chooseMaterial(button.dataset.prefix,button.dataset.type);break;
case 'generate':await generate();break;
case 'previous':await browse(currentRow-1);break;
case 'next':await browse(currentRow===0?1:currentRow+1);break;
case 'details':if(await mayReplaceFilm())await showDetails(row);break;
case 'edit':if(await mayReplaceFilm())await showEditor(row);break;
case 'editCurrent':await showEditor(currentRow);break;
case 'download':await downloadRecord(row);break;
case 'save':await saveEditor();break;
case 'refreshPreview':await refreshPreview();break;
case 'refreshDetails':{const entry=overlays[overlays.length-1];if(entry?.record){const value=(await api('GetCellValue','演示文件/'+entry.row)).trim();entry.record['演示文件']=value;renderOutput(entry.el.querySelector('[data-part="output"]'),value,entry.record['交付格式']);if(currentRow===entry.row){filmOutput=value;renderPreview()}}break}
case 'refreshData':await loadData();break;
}}finally{busy=false;if(button.isConnected)button.disabled=false;if($('film'))updateForm('film');renderPreview()}}
function ensureInputVisible(){const active=document.activeElement;if(!active?.matches('input:not([type="hidden"]),textarea,select'))return;const viewport=window.visualViewport;const height=viewport?viewport.height:window.innerHeight;const keyboard=Math.max(0,window.innerHeight-height);if(window.innerWidth<=760){document.body.style.paddingBottom=Math.max(160,keyboard+80)+'px';for(const pad of document.querySelectorAll('.keyboard-pad'))pad.style.height=Math.max(160,keyboard+80)+'px'}setTimeout(()=>active.isConnected&&active.scrollIntoView({behavior:'smooth',block:'center'}),150)}
async function initialize(){
lang=selectLanguage();filmData=defaultData();renderFilm(filmData);renderFilters();localize();
document.addEventListener('submit',event=>event.preventDefault());
document.addEventListener('click',event=>{const button=event.target.closest('[data-act]');if(button&&!button.disabled){event.stopPropagation();handleAction(button).catch(error=>toast(errorMessage(error)))}else if(!event.target.closest('#navbar'))closeMenu()});
document.addEventListener('input',event=>{const form=event.target.closest('form');if(form?.id==='film'||form?.id==='editor')updateForm(form.id);if(event.target.id==='librarySearch'){limit=12;renderLibrary()}});
document.addEventListener('change',event=>{if(['themeFilter','mediaFilter','formatFilter','pageSort'].includes(event.target.id)){limit=12;renderLibrary()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(overlays.length)closeOverlay();else closeMenu()}if(event.key==='Enter'&&event.target.matches('[role="button"],tr[data-act]')){event.preventDefault();handleAction(event.target).catch(error=>toast(errorMessage(error)))}if(event.key==='Tab'&&overlays.length){const el=overlays[overlays.length-1].el,items=[...el.querySelectorAll('button:not(:disabled),a[href],input:not([type="hidden"]):not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex="0"]')].filter(x=>x.getClientRects().length);if(items.length&&(event.shiftKey&&document.activeElement===items[0]||!event.shiftKey&&document.activeElement===items[items.length-1])){event.preventDefault();(event.shiftKey?items[items.length-1]:items[0]).focus()}}});
document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))ensureInputVisible()});
window.addEventListener('resize',()=>{adaptNav();ensureInputVisible()});window.visualViewport?.addEventListener('resize',ensureInputVisible);
window.addEventListener('beforeunload',event=>{if(poll||currentRow===0&&JSON.stringify(readForm('film'))!==filmBase){event.preventDefault();event.returnValue=''}});
try{const mode=(await callAppBridge({type:'模式'})).trim();document.body.classList.toggle('dark',mode==='暗色')}catch(error){document.body.classList.toggle('dark',window.matchMedia('(prefers-color-scheme: dark)').matches)}
await loadData();
}
(async () => { await initialize(); })().catch(error=>toast(errorMessage(error)));
</script>
