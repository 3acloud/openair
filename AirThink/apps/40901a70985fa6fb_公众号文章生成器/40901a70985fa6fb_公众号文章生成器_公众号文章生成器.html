  <style>

    main{max-width:1258px;margin:auto;padding:34px 24px 88px}.page{display:none}.page.active{display:block}.hero{position:relative;overflow:hidden;border-radius:28px;padding:66px 58px;background:linear-gradient(120deg,#102b69 4%,#2555bc 67%,#4f83ed);color:#fff;box-shadow:var(--shadow)}.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.16);border-radius:50%;pointer-events:none}.hero:before{width:500px;height:500px;right:-125px;top:-285px}.hero:after{width:360px;height:360px;right:80px;bottom:-265px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.8}.hero h1{font-size:clamp(33px,4.2vw,54px);line-height:1.15;letter-spacing:-.045em;margin:16px 0;max-width:750px}.hero p{max-width:610px;font-size:16px;line-height:1.9;color:#dbe7ff;margin:0 0 32px}.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:12px;padding:12px 19px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s;text-decoration:none}.button:hover{transform:translateY(-2px)}.button-primary{background:var(--nav2);color:#fff;box-shadow:0 8px 20px rgba(30,58,138,.22)}.button-primary:hover{background:#2853b7}.button-light{background:#fff;color:#173c91}.button-subtle{background:var(--accent-soft);color:var(--accent)}.button-danger{background:#fff0f2;color:#aa2740}.button:disabled{cursor:wait;opacity:.65;transform:none}.hero .button{padding:15px 24px}

    .section-heading,.page-heading{display:flex;align-items:end;justify-content:space-between;gap:15px}.section-heading h2,.page-heading h1{margin:0;color:var(--text);letter-spacing:-.025em}.section-heading h2{font-size:23px}.page-heading h1{font-size:32px}.page-heading p{color:var(--muted);margin:5px 0 0}.section-heading{margin:0 0 18px}.recent-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.recent-card{display:flex;flex-direction:column;min-height:180px;text-align:left;padding:20px;transition:transform .2s,box-shadow .2s;color:var(--text)}.recent-card:hover,.article-card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(26,52,105,.16)}.recent-card h3{font-size:16px;line-height:1.45;margin:10px 0 9px;word-break:break-word}.recent-meta{font-size:12px;color:var(--muted);margin-top:auto}.chip{display:inline-flex;align-items:center;border-radius:100px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;font-size:11px;font-weight:750;white-space:nowrap}.chip.secondary{background:rgba(110,124,150,.12);color:var(--muted)}
    .page-heading{margin:7px 0 25px}.workspace-grid{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);gap:22px;align-items:start}.panel{padding:26px}.panel-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:760;margin:0 0 23px}.panel-title i{color:var(--accent)}.field{margin:0 0 17px}.field label{display:block;margin:0 0 7px;font-size:13px;font-weight:720}.field input,.field select,.field textarea,.control{width:100%;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--text);outline:none}.field textarea{min-height:98px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(85,119,220,.15)}.submit-button{width:100%;min-height:51px;margin-top:8px}.preview-panel{min-height:700px}.preview-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:18px}.preview-head .panel-title{margin:0}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:65px 20px;min-height:490px}.empty-illustration{display:grid;place-items:center;width:116px;height:116px;border-radius:30px;background:var(--accent-soft);color:var(--accent);font-size:53px;margin-bottom:22px;transform:rotate(-5deg)}.empty-state h3{color:var(--text);font-size:21px;margin:0 0 7px}.empty-state p{max-width:400px;line-height:1.8;margin:0}.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}@keyframes spin{to{transform:rotate(360deg)}}.status{min-height:24px;margin:12px 0 0;color:var(--muted);font-size:13px}.status.error{color:var(--danger)}

<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <button class="brand" id="brandButton" type="button" aria-label="Close"><span class="brand-icon"><i class="fa-solid fa-feather-pointed"></i></span><span data-i18n="appName">公众号文章生成器</span></button>
      <nav class="nav-links" id="desktopNav" aria-label="Main navigation">
        <button type="button" class="nav-link active" data-page="home" data-i18n="home">首页</button><button type="button" class="nav-link" data-page="workshop" data-i18n="workshop">创作工坊</button><button type="button" class="nav-link" data-page="library" data-i18n="library">文章管理库</button>
      </nav>
      <button type="button" class="language-btn" id="languageButton" aria-label="Switch language">EN</button>
      <button type="button" class="menu-btn" id="menuButton" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <button type="button" data-page="home" data-i18n="home">首页</button><button type="button" data-page="workshop" data-i18n="workshop">创作工坊</button><button type="button" data-page="library" data-i18n="library">文章管理库</button><button type="button" id="mobileLanguageButton">English</button>
    </div>
  </header>
  <main id="mainContent">
    <section class="page active" id="page-home">
      <div class="hero"><div class="eyebrow">AI · CONTENT STUDIO</div><h1 data-i18n="heroTitle">智能公众号文章创作助手</h1><p data-i18n="heroDescription">输入您的核心需求，AI智能体将自动搜索参考资料、规划文章大纲、撰写高质量文案并生成适配手机端的可视化图片。</p><button class="button button-light" id="startButton" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="startCreation">开启灵感创作</span></button></div>
      <div class="stats"><div class="stat-card"><div class="stat-label" data-i18n="totalArticles">累计创作文章数</div><div class="stat-value" id="articleCount">—</div><div class="stat-hint" data-i18n="totalHint">系统已经为您生成的文章总数</div></div><div class="stat-card"><div class="stat-label" data-i18n="styleDistribution">文章风格分布统计</div><div class="style-bars" id="styleBars"></div></div></div>
      <div class="section-heading"><h2 data-i18n="recentCreations">最近创作</h2></div><div class="recent-grid" id="recentGrid"></div>
    </section>
    <section class="page" id="page-workshop">
      <div class="page-heading"><div><h1 data-i18n="workshop">创作工坊</h1><p data-i18n="workshopDescription">设定您的文章需求，AI将为您量身打造精彩内容。</p></div></div>
      <div class="workspace-grid"><div class="panel"><h2 class="panel-title"><i class="fa-solid fa-pen-nib"></i><span data-i18n="articleNeeds">文章需求</span></h2><form id="articleForm">
        <div class="field"><label for="articleForm_topic" data-i18n="topic">主题</label><input id="articleForm_topic" name="主题" type="text" required></div>
        <div class="field"><label for="articleForm_audience" data-i18n="audience">目标读者</label><input id="articleForm_audience" name="目标读者" type="text" required></div>
        <div class="field"><label for="articleForm_angle" data-i18n="angle">写作角度</label><input id="articleForm_angle" name="写作角度" type="text"></div>
        <div class="field"><label for="articleForm_style" data-i18n="style">文章风格</label><select id="articleForm_style" name="文章风格" required><option value="" data-i18n="selectStyle">请选择文章风格</option><option value="专业深度" data-i18n="styleProfessional">专业深度</option><option value="通俗易懂" data-i18n="styleAccessible">通俗易懂</option><option value="观点评论" data-i18n="styleOpinion">观点评论</option><option value="故事叙述" data-i18n="styleStory">故事叙述</option><option value="商业分析" data-i18n="styleBusiness">商业分析</option></select></div>
        <div class="field"><label for="articleForm_words" data-i18n="wordCount">字数要求</label><input id="articleForm_words" name="字数要求" type="number" min="1" step="1" required></div>
        <div class="field"><label for="articleForm_purpose" data-i18n="purpose">发布目的</label><select id="articleForm_purpose" name="发布目的" required><option value="" data-i18n="selectPurpose">请选择发布目的</option><option value="知识科普" data-i18n="purposeKnowledge">知识科普</option><option value="品牌传播" data-i18n="purposeBrand">品牌传播</option><option value="产品推广" data-i18n="purposeProduct">产品推广</option><option value="行业分析" data-i18n="purposeIndustry">行业分析</option><option value="活动预热" data-i18n="purposeEvent">活动预热</option></select></div>
        <div class="field"><label for="articleForm_reference" data-i18n="reference">参考资料</label><textarea id="articleForm_reference" name="参考资料" rows="4"></textarea></div>
        <button class="button button-primary submit-button" id="generateButton" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="generate">开始生成文章</span></button><p class="status" id="formStatus" role="status"></p>
      </form></div><div class="panel preview-panel"><div class="preview-head"><h2 class="panel-title"><i class="fa-regular fa-file-lines"></i><span data-i18n="articlePreview">文章预览</span></h2></div><div id="previewContent" class="empty-state"><div class="empty-illustration"><i class="fa-solid fa-feather"></i></div><h3 data-i18n="waitingTitle">等待生成文章</h3><p data-i18n="waitingDescription">填写左侧需求，开启您的下一篇精彩文章。</p></div></div></div>
    </section>
    <section class="page" id="page-library"><div class="page-heading"><div><h1 data-i18n="library">文章管理库</h1><p data-i18n="libraryDescription">管理和查看所有已生成的公众号文章。</p></div><button class="button button-primary" id="newArticleButton" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="newArticle">新建文章</span></button></div>
      <div class="library-toolbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input class="control" id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="搜索文章主题"></div><select class="control" id="styleFilter"><option value="" data-i18n="allStyles">全部文章风格</option><option value="专业深度" data-i18n="styleProfessional">专业深度</option><option value="通俗易懂" data-i18n="styleAccessible">通俗易懂</option><option value="观点评论" data-i18n="styleOpinion">观点评论</option><option value="故事叙述" data-i18n="styleStory">故事叙述</option><option value="商业分析" data-i18n="styleBusiness">商业分析</option></select><select class="control" id="purposeFilter"><option value="" data-i18n="allPurposes">全部发布目的</option><option value="知识科普" data-i18n="purposeKnowledge">知识科普</option><option value="品牌传播" data-i18n="purposeBrand">品牌传播</option><option value="产品推广" data-i18n="purposeProduct">产品推广</option><option value="行业分析" data-i18n="purposeIndustry">行业分析</option><option value="活动预热" data-i18n="purposeEvent">活动预热</option></select></div><div class="article-grid" id="articleGrid"></div>
    </section>
  </main>
  <div class="modal-backdrop" id="detailBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-head"><h2 id="detailTitle"></h2><button type="button" class="icon-button" id="detailCloseButton" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="detail-meta" id="detailMeta"></div><article class="markdown-body" id="detailContent"></article></div></div></div>
  <div class="modal-backdrop" id="confirmBackdrop"><div class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="modal-head"><h2 id="confirmTitle" data-i18n="deleteTitle">删除文章</h2><button type="button" class="icon-button" id="confirmCloseButton" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="confirm-text" id="confirmText"></div><div class="confirm-actions"><button type="button" class="button button-subtle" id="cancelDeleteButton" data-i18n="cancel">取消</button><button type="button" class="button button-danger" id="confirmDeleteButton" data-i18n="confirmDelete">确认删除</button></div></div></div>
  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    buttonContainer.style.cssText = `

    `;

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }
