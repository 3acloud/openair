  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

}

    // 请求摄像头访问权限

      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

      cn:{appName:'阳明心学智慧助手',home:'首页',ask:'智慧问答',library:'问答宝库',heroEyebrow:'知行合一 · 致良知',heroDesc:'基于王阳明心学智慧，解答理论与经典困惑，化解人生困境，输出深度分析与实操行动指南。知行合一，从心出发。',startAsk:'开始智慧问答',totalQuestions:'总问答数',sceneCount:'场景类型覆盖数',recentActive:'最近活跃',quotesTitle:'心学金句轮播',quoteSource:'—— 王阳明',recentQuestions:'最近心学问答',viewAll:'查看全部',askDesc:'描述你的困惑与场景，获取心学深度解读与行动指南',viewLibrary:'查看问答宝库',askFormTitle:'心学问答',question:'问题描述',questionPlaceholder:'请详细描述你的理论困惑、人生困境或想请教的问题…',scene:'场景类型',getAnswer:'获取心学解读',waiting:'心学大儒正在格物致知，为您深度解读中…',answerResult:'心学解读结果',copyAll:'复制全文',askAgain:'再问一题',saveView:'存入宝库并查看',libraryDesc:'沉淀每一次心学对话，随时温习知行合一',newQuestion:'新建问答',searchPlaceholder:'搜索问题描述关键词',empty:'宝库暂无记录，快去智慧问答开启第一次格物致知吧',detailTitle:'心学问答详情',printExport:'打印/导出',close:'关闭',editTitle:'编辑心学问答',cancel:'取消',save:'保存修改',all:'全部',generated:'已生成',generating:'生成中',viewAnswer:'查看解读',viewDetail:'查看详情',edit:'编辑',delete:'删除',confirmDelete:'确认删除这条问答吗？',none:'暂无记录',copied:'已复制全文',copyFailed:'复制失败',timeout:'等待超时，请稍后到问答宝库查看。',error:'操作失败，请稍后重试。',noAnswer:'解读尚未生成。'},
      en:{appName:'Yangming Wisdom Assistant',home:'Home',ask:'Ask Wisdom',library:'Q&A Library',heroEyebrow:'Unity of Knowledge and Action',heroDesc:'Explore Wang Yangming’s philosophy, understand the classics, and find practical guidance for life’s challenges.',startAsk:'Start asking',totalQuestions:'Total questions',sceneCount:'Topics covered',recentActive:'Latest question',quotesTitle:'Yangming’s words',quoteSource:'— Wang Yangming',recentQuestions:'Recent questions',viewAll:'View all',askDesc:'Describe your question or situation to receive a thoughtful interpretation and action guide.',viewLibrary:'View library',askFormTitle:'Ask a question',question:'Question',questionPlaceholder:'Describe your question or challenge in detail…',scene:'Topic',getAnswer:'Get interpretation',waiting:'Reflecting on your question and preparing an interpretation…',answerResult:'Interpretation',copyAll:'Copy all',askAgain:'Ask another',saveView:'View in library',libraryDesc:'Revisit every conversation and put insight into practice.',newQuestion:'New question',searchPlaceholder:'Search questions',empty:'No questions yet. Ask your first question to begin.',detailTitle:'Question details',printExport:'Print / export',close:'Close',editTitle:'Edit question',cancel:'Cancel',save:'Save changes',all:'All',generated:'Ready',generating:'Generating',viewAnswer:'View answer',viewDetail:'Details',edit:'Edit',delete:'Delete',confirmDelete:'Delete this question?',none:'No records yet',copied:'Copied',copyFailed:'Could not copy',timeout:'Timed out. Check the library later.',error:'Operation failed. Please try again.',noAnswer:'Interpretation is still being generated.'}
    };
    const SCENE_EN = ['Theory','Classics','Work anxiety','Life direction','Relationships','Procrastination','Decisions','Setbacks','Leadership','Biography','Quotes','Practice','Reading list','General inquiry'];
    const QUOTES = [{cn:'此心光明，亦复何言',en:'This heart is luminous; what more need be said?'},{cn:'知是行之始，行是知之成',en:'Knowledge begins action; action completes knowledge.'},{cn:'心即理也',en:'The mind itself is principle.'}];
    let lang='cn',theme='亮色',currentPage='home',historyStack=[],currentRow=0,editRow=0,records=[],polling=false,pollToken=0,resultText='',quoteIndex=0,toastTimer=0,loadSerial=0,questionCache=new Map();
    const $ = id => document.getElementById(id);
    const tr = key => (I18N[lang] && I18N[lang][key]) || key;
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}
    function snippet(value,n){const s=String(value||'').trim();return s.length>n?s.slice(0,n)+'…':s}
    function sceneLabel(scene){const index=SCENES.indexOf(scene);return lang==='en'&&index>=0?SCENE_EN[index]:scene||'—'}
    function setLanguage(next){lang=next==='en'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',lang);document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=tr(el.dataset.i18nPlaceholder)});$('langButton').textContent=lang==='cn'?'EN':'中文';$('mobileLangButton').textContent=lang==='cn'?'English':'中文';fillSceneSelects();renderQuote();renderRecords()}
    function fillSceneSelects(){const selectedAsk=$('askForm_scene').value,selectedEdit=$('editForm_scene').value,selectedFilter=$('sceneFilter').value;for(const id of ['askForm_scene','editForm_scene','sceneFilter']){const sel=$(id);sel.replaceChildren();if(id==='sceneFilter'){const opt=new Option(tr('all'),'');sel.add(opt)}SCENES.forEach(scene=>sel.add(new Option(sceneLabel(scene),scene)));sel.value=id==='askForm_scene'?selectedAsk||SCENES[0]:id==='editForm_scene'?selectedEdit||SCENES[0]:selectedFilter}}
    function chooseLanguage(){let languages;try{languages=navigator.languages}catch(e){}let chosen=!languages||!languages.length?'cn':languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';const urlLang=new URLSearchParams(location.search).get('lang');if(urlLang==='cn'||urlLang==='en')chosen=urlLang;const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)chosen=saved==='en'?'en':'cn';return chosen}
    function applyTheme(value){theme=value==='暗色'?'暗色':'亮色';document.documentElement.dataset.theme=theme==='暗色'?'dark':'light'}
    function renderQuote(){const q=QUOTES[quoteIndex];$('quoteText').textContent='“'+q[lang]+'”';$('quoteDots').replaceChildren();QUOTES.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.className='quote-dot'+(i===quoteIndex?' active':'');b.setAttribute('aria-label','Quote '+(i+1));b.addEventListener('click',()=>{quoteIndex=i;renderQuote()});$('quoteDots').appendChild(b)})}
    function showPage(page,push=true,scrollY=0){if(!['home','ask','library'].includes(page))return;if(page!==currentPage){if(push)historyStack.push({page:currentPage,y:window.scrollY});currentPage=page}document.querySelectorAll('.page').forEach(el=>el.hidden=el.id!=='page-'+page);document.querySelectorAll('.nav-link').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();requestAnimationFrame(()=>window.scrollTo(0,scrollY));if(page==='library'||page==='home')refreshData()}
    function closeMenu(){$('mobileMenu').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false')}
    function checkNavFit(){const nav=$('navLinks'),toggle=$('menuToggle');nav.style.display='flex';toggle.style.display='none';const need=nav.getBoundingClientRect().right>window.innerWidth-18 || $('brandButton').getBoundingClientRect().right+16>nav.getBoundingClientRect().left;if(need){nav.style.display='none';toggle.style.display='block'}else closeMenu()}
    function parseRows(csv){return parseCSV(String(csv||'')).filter(row=>row.some(cell=>cell!==''))}
    async function refreshData(){const serial=++loadSerial;try{const [countCsv,sceneCsv,questionCsv,recordCsv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'场景类型'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'问题描述'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'问题描述,场景类型,心学解读'})]);if(serial!==loadSerial)return;questionCache=new Map();records=parseRows(recordCsv).map((r,i)=>({row:i+1,question:r[0]||'',scene:r[1]||'',answer:r[2]||''}));$('totalCount').textContent=String(countCsv||'0').trim()||'0';$('sceneCount').textContent=String(new Set(parseRows(sceneCsv).map(r=>r[0]).filter(Boolean)).size);$('recentActive').textContent=snippet(parseRows(questionCsv)[0]?.[0]||'',20)||'—';if(records.length)fullQuestion(1).then(value=>{if(serial===loadSerial)$('recentActive').textContent=snippet(value,20)||'—'}).catch(console.error);$('libraryError').textContent='';renderRecords()}catch(e){if(serial!==loadSerial)return;$('libraryError').textContent=tr('error');console.error(e)}}
    function fullQuestion(row){if(!questionCache.has(row))questionCache.set(row,getField('问题描述',row));return questionCache.get(row)}
    function cardFor(record,recent){const card=document.createElement('article');card.className='card record-card';card.tabIndex=0;card.setAttribute('role','button');card.addEventListener('click',()=>openDetail(record.row));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(record.row)}});const badge=document.createElement('span');badge.className='badge'+(SCENES.indexOf(record.scene)%2?' alt':'');badge.textContent=sceneLabel(record.scene);const p=document.createElement('p');p.textContent=snippet(record.question,recent?60:80);fullQuestion(record.row).then(value=>{if(card.isConnected)p.textContent=snippet(value,recent?60:80)}).catch(console.error);const foot=document.createElement('div');foot.className='record-foot';const status=document.createElement('span');status.className='status';status.textContent=tr(record.answer.trim()?'generated':'generating');foot.appendChild(status);const actions=document.createElement('div');actions.style.display='flex';actions.style.gap='6px';const makeButton=(label,icon,handler)=>{const b=document.createElement('button');b.type='button';b.className='btn secondary small';b.innerHTML='<i class="fa-solid '+icon+'"></i>';b.append(document.createTextNode(' '+tr(label)));b.addEventListener('click',e=>{e.stopPropagation();handler()});actions.appendChild(b)};makeButton(recent?'viewAnswer':'viewDetail','fa-eye',()=>openDetail(record.row));if(!recent){makeButton('edit','fa-pen',()=>openEdit(record.row));makeButton('delete','fa-trash',()=>deleteRecord(record.row))}foot.appendChild(actions);card.append(badge,p,foot);return card}
    function renderRecords(){const recent=$('recentList'),library=$('libraryList');recent.replaceChildren();library.replaceChildren();records.slice(0,5).forEach(r=>recent.appendChild(cardFor(r,true)));if(!records.length){const e=document.createElement('div');e.className='card empty';e.textContent=tr('none');recent.appendChild(e)}const term=$('searchInput').value.trim().toLocaleLowerCase(),scene=$('sceneFilter').value;const visible=records.filter(r=>r.question.toLocaleLowerCase().includes(term)&&(!scene||r.scene===scene));visible.forEach(r=>library.appendChild(cardFor(r,false)));$('libraryEmpty').hidden=visible.length>0}
    function markdownHtml(value){if(!value)return '<p>'+escapeHtml(tr('noAnswer'))+'</p>';if(!window.marked)return '<pre>'+escapeHtml(value)+'</pre>';marked.setOptions({gfm:true,breaks:true});let html=marked.parse(value);if(window.DOMPurify)html=DOMPurify.sanitize(html,{ADD_ATTR:['target','download']});else return '<pre>'+escapeHtml(value)+'</pre>';return html}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function renderMarkdown(target,value){target.innerHTML=markdownHtml(value);target.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';if(raw&&!/^(?:https?:|data:|blob:|\/)/i.test(raw))img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(raw);img.title='Download image';img.addEventListener('click',()=>{const a=document.createElement('a');a.href=img.currentSrc||img.src;a.download='';document.body.appendChild(a);a.click();a.remove()})})}
    function openModal(id){$(id).hidden=false;document.body.classList.add('modal-open')}
    function closeModal(id){$(id).hidden=true;if($('detailBackdrop').hidden&&$('editBackdrop').hidden)document.body.classList.remove('modal-open')}
    async function getField(field,row){return String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})||'')}
    async function openDetail(row){try{const [question,scene,answer]=await Promise.all([getField('问题描述',row),getField('场景类型',row),getField('心学解读',row)]);currentRow=row;$('detailQuestion').textContent=question;$('detailScene').textContent=sceneLabel(scene);renderMarkdown($('detailMarkdown'),answer);openModal('detailBackdrop')}catch(e){toast(tr('error'));console.error(e)}}
    async function openEdit(row){try{const question=await getField('问题描述',row),scene=await getField('场景类型',row);editRow=row;currentRow=row;$('editForm_question').value=question;$('editForm_scene').value=scene||SCENES[0];$('editError').textContent='';openModal('editBackdrop')}catch(e){toast(tr('error'));console.error(e)}}
    async function deleteRecord(row){if(!confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});currentRow=0;await refreshData()}catch(e){toast(tr('error'));console.error(e)}}
    async function saveEdit(e){e.preventDefault();const q=$('editForm_question').value.trim(),s=$('editForm_scene').value;if(!q||!editRow)return;const b=$('saveEdit');b.disabled=true;$('editError').textContent='';try{await callAppBridge({type:'SetCellValue',data:TABLE,payload:'问题描述/'+editRow+'/'+q});await callAppBridge({type:'SetCellValue',data:TABLE,payload:'场景类型/'+editRow+'/'+s});closeModal('editBackdrop');await refreshData()}catch(err){$('editError').textContent=tr('error');console.error(err)}finally{b.disabled=false}}
    function setWaiting(value){polling=value;$('waitingArea').classList.toggle('show',value);$('submitAsk').disabled=value||!$('askForm_question').value.trim();$('askForm_question').readOnly=value;$('askForm_scene').disabled=value}
    async function submitAsk(e){e.preventDefault();const question=$('askForm_question').value.trim(),scene=$('askForm_scene').value;if(!question||polling)return;$('askError').textContent='';$('resultCard').hidden=true;resultText='';setWaiting(true);const token=++pollToken;try{await callAppBridge({type:'SubmitRecord',data:'心学问答',payload:JSON.stringify({'问题描述':question,'场景类型':scene})});currentRow=1;await refreshData();await pollAnswer(token)}catch(err){$('askError').textContent=tr('error');console.error(err);setWaiting(false)}}
    async function pollAnswer(token){const deadline=Date.now()+1800000;let previous='',stable=0;while(token===pollToken&&Date.now()<deadline){try{const answer=(await getField('心学解读',1)).trim();if(answer){stable=answer===previous?stable+1:0;previous=answer;if(stable>=1){resultText=answer;renderMarkdown($('resultMarkdown'),answer);$('resultCard').hidden=false;setWaiting(false);await refreshData();$('resultCard').scrollIntoView({behavior:'smooth',block:'start'});return}}}catch(e){console.error(e)}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken){setWaiting(false);$('askError').textContent=tr('timeout')}}
    function resetAsk(){pollToken++;currentRow=0;resultText='';$('askForm').reset();$('askForm_scene').value=SCENES[0];$('resultCard').hidden=true;$('askError').textContent='';setWaiting(false);$('askForm_question').focus()}
    function bindEvents(){document.querySelectorAll('[data-page],[data-go]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page||el.dataset.go)));$('brandButton').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});$('menuToggle').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});for(const id of ['langButton','mobileLangButton'])$(id).addEventListener('click',()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu();checkNavFit()});document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeModal(el.dataset.close)));for(const id of ['detailBackdrop','editBackdrop'])$(id).addEventListener('click',e=>{if(e.target===$(id))closeModal(id)});$('askForm_question').addEventListener('input',()=>{$('submitAsk').disabled=polling||!$('askForm_question').value.trim()});$('askForm').addEventListener('submit',submitAsk);$('editForm').addEventListener('submit',saveEdit);$('searchInput').addEventListener('input',renderRecords);$('sceneFilter').addEventListener('change',renderRecords);$('askAgain').addEventListener('click',resetAsk);$('copyResult').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(resultText);toast(tr('copied'))}catch(e){toast(tr('copyFailed'))}});$('printDetail').addEventListener('click',()=>window.print());document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('editBackdrop').hidden)closeModal('editBackdrop');else if(!$('detailBackdrop').hidden)closeModal('detailBackdrop');else closeMenu()}});window.addEventListener('resize',checkNavFit);window.visualViewport?.addEventListener('resize',ensureFocusedVisible);document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(ensureFocusedVisible,250)})}
    function ensureFocusedVisible(){const el=document.activeElement;if(!el||!el.matches('input,textarea,select'))return;const vp=window.visualViewport;const visibleBottom=vp?vp.offsetTop+vp.height:window.innerHeight;const r=el.getBoundingClientRect();if(r.bottom>visibleBottom-20||r.top<72)el.scrollIntoView({block:'center',behavior:'smooth'})}
    function airBack(){if(!$('editBackdrop').hidden){closeModal('editBackdrop');return 'false'}if(!$('detailBackdrop').hidden){closeModal('detailBackdrop');return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const entry=historyStack.pop();showPage(entry.page,false,entry.y);return 'false'}return 'true'}
    window.airBack=airBack;
    async function initialize(){bindEvents();setLanguage(chooseLanguage());checkNavFit();renderQuote();setInterval(()=>{quoteIndex=(quoteIndex+1)%QUOTES.length;renderQuote()},5000);try{applyTheme(await callAppBridge({type:'模式'}))}catch(e){applyTheme('亮色')}await refreshData()}
    document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
  </script>
