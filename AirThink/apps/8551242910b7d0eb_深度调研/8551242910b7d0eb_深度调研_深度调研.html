<script>
+        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            // 使用atob解码Base64得到二进制字符串

            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');

        }

const dict={cn:{app:'深度调研',home:'首页',create:'发起调研',archive:'调研档案',heroDesc:'提出问题、划定边界，智能体检索权威资料并核验推导，输出结论清晰、证据可追溯的调研报告',startOnce:'发起一次深度调研',total:'累计调研数',completed:'已生成报告数',recent:'最近调研',allRecords:'查看全部',createDesc:'写清问题与研究边界，智能体将拆解子问题、检索核验并生成可追溯报告',viewArchive:'查看调研档案',question:'调研问题',boundary:'研究边界',launch:'启动深度调研',reportDocument:'报告文稿',newResearch:'+ 新调研',archiveDesc:'浏览、阅读与管理全部深度调研记录',plusCreate:'+ 发起调研',searchPlaceholder:'搜索调研问题或研究边界',previous:'上一页',next:'下一页',editResearch:'编辑调研',reportReadOnly:'调研报告（只读）',cancel:'取消',save:'保存修改',generated:'报告已生成',pending:'生成中/未生成',notGenerated:'未生成',noRecent:'暂无调研记录',noArchive:'还没有调研档案',firstResearch:'发起第一次调研',viewReport:'查看报告',edit:'编辑',delete:'删除',confirmDelete:'确定删除这条调研记录吗？',waiting:'正在拆解问题、检索权威资料并核验事实，请稍候…',steps:['拆解子问题','检索权威资料','核验时效与适用对象','推导结论与建议'],emptyReport:'报告尚未生成',selectReport:'提交调研或从档案中打开报告',loadFailed:'加载失败',submitFailed:'提交失败',saveFailed:'保存失败',deleteFailed:'删除失败',timeout:'等待报告超时，请稍后在调研档案中查看。',page:'页',of:'共',questionPlaceholder:'例如：新能源汽车补贴退坡对二三线城市消费意愿的影响',boundaryPlaceholder:'可填写研究对象、人群、地域、时间、层级；留空则由智能体合理界定并在报告中说明'},en:{app:'Deep Research',home:'Home',create:'New Research',archive:'Archive',heroDesc:'Define a question and its scope. The research agent checks authoritative sources and produces a clear, traceable report.',startOnce:'Start deep research',total:'Total studies',completed:'Reports generated',recent:'Recent research',allRecords:'View all',createDesc:'Describe the question and scope. The agent will break down, source, verify, and write a traceable report.',viewArchive:'View archive',question:'Research question',boundary:'Research scope',launch:'Start research',reportDocument:'Research report',newResearch:'+ New research',archiveDesc:'Browse, read, and manage all research',plusCreate:'+ New research',searchPlaceholder:'Search question or scope',previous:'Previous',next:'Next',editResearch:'Edit research',reportReadOnly:'Research report (read only)',cancel:'Cancel',save:'Save changes',generated:'Report ready',pending:'Generating / pending',notGenerated:'Pending',noRecent:'No research yet',noArchive:'No research in the archive yet',firstResearch:'Start your first research',viewReport:'View report',edit:'Edit',delete:'Delete',confirmDelete:'Delete this research record?',waiting:'Breaking down the question, checking sources and verifying facts…',steps:['Break down questions','Find authoritative sources','Verify currency and applicability','Derive findings and advice'],emptyReport:'The report is still being generated',selectReport:'Start a study or open a report from the archive',loadFailed:'Could not load data',submitFailed:'Could not submit research',saveFailed:'Could not save changes',deleteFailed:'Could not delete record',timeout:'Report generation timed out. Check the archive later.',page:'Page',of:'of',questionPlaceholder:'e.g. How do changes in EV subsidies affect demand in smaller cities?',boundaryPlaceholder:'Specify subject, population, region, period, or level. Leave blank for the agent to define.',}};
const $=id=>document.getElementById(id);const state={lang:'cn',page:'home',history:[],records:[],count:0,row:0,archivePage:1,polling:false,pollTimer:null,editRow:0,openDialogs:[]};const t=k=>dict[state.lang][k]??k;
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function notice(id,message){const el=$(id);el.textContent=message;el.classList.toggle('show',!!message)}
function parseRows(csv){return parseCSV(String(csv||'')).filter(r=>r.length>1||String(r[0]||'').trim()).map((r,i)=>({row:i+1,question:r[0]||'',boundary:r[1]||'',report:r[2]||''}));}
async function refreshData(){const results=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS})]);state.records=parseRows(results[1]);const n=Number.parseInt(results[0],10);state.count=Number.isFinite(n)?n:state.records.length;renderHome();renderArchive();updatePager()}
function renderHome(){ $('total-count').textContent=state.count;$('report-count').textContent=state.records.filter(r=>r.report.trim()).length;const root=$('recent-list');root.replaceChildren();for(const record of state.records.slice(0,5)){const item=document.createElement('button');item.type='button';item.className='recent-item';item.innerHTML=`<span class="recent-title">${escapeHtml(record.question)}</span><span class="recent-sub">${escapeHtml(record.boundary)}</span><span class="recent-foot"><span class="badge ${record.report.trim()?'':'pending'}">${t(record.report.trim()?'generated':'pending')}</span></span>`;item.addEventListener('click',()=>openDetail(record.row));root.append(item)}if(!root.children.length)root.innerHTML=`<p class="report-empty">${escapeHtml(t('noRecent'))}</p>`}
function renderArchive(){const root=$('archive-content');root.replaceChildren();const search=$('archive-search').value.trim().toLocaleLowerCase();const filtered=state.records.filter(r=>(r.question+' '+r.boundary).toLocaleLowerCase().includes(search));if(!state.records.length){root.innerHTML=`<div class="paper empty"><h2>${escapeHtml(t('noArchive'))}</h2><button class="primary" id="empty-create">${escapeHtml(t('firstResearch'))}</button></div>`;$('empty-create').addEventListener('click',()=>navigate('create'));$('archive-paging').hidden=true;return}if(!filtered.length){root.innerHTML=`<div class="paper empty">${escapeHtml(t('noRecent'))}</div>`;$('archive-paging').hidden=true;return}const pageSize=12;const pages=Math.ceil(filtered.length/pageSize);state.archivePage=Math.min(state.archivePage,pages);const grid=document.createElement('div');grid.className='archive-grid';for(const record of filtered.slice((state.archivePage-1)*pageSize,state.archivePage*pageSize)){const card=document.createElement('article');card.className='paper record-card';card.tabIndex=0;card.innerHTML=`<h3>${escapeHtml(record.question)}</h3><p class="record-summary">${escapeHtml(record.boundary.slice(0,80))}</p><div class="record-foot"><span class="badge ${record.report.trim()?'':'pending'}">${t(record.report.trim()?'generated':'notGenerated')}</span><div class="record-actions"><button type="button" data-action="view" aria-label="${t('viewReport')}" title="${t('viewReport')}"><i class="fa-solid fa-book-open"></i></button><button type="button" data-action="edit" aria-label="${t('edit')}" title="${t('edit')}"><i class="fa-solid fa-pen"></i></button><button type="button" data-action="delete" aria-label="${t('delete')}" title="${t('delete')}"><i class="fa-solid fa-trash"></i></button></div></div>`;card.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='edit')openEdit(record.row);else if(action==='delete')deleteRecord(record.row);else openDetail(record.row)});card.addEventListener('keydown',e=>{if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDetail(record.row)}});grid.append(card)}root.append(grid);$('archive-paging').hidden=pages<=1;$('archive-prev').disabled=state.archivePage<=1;$('archive-next').disabled=state.archivePage>=pages;$('archive-page-label').textContent=`${t('page')} ${state.archivePage} ${t('of')} ${pages}`}
function setLanguage(lang){state.lang=lang==='en'?'en':'cn';document.documentElement.lang=state.lang==='en'?'en':'zh-CN';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('create-form-question').placeholder=t('questionPlaceholder');$('create-form-boundary').placeholder=t('boundaryPlaceholder');$('desktop-lang').textContent=state.lang==='cn'?'EN':'中';$('mobile-lang').textContent=state.lang==='cn'?'English':'中文';renderHome();renderArchive();if(state.row===0&&!state.polling)$('create-report-content').textContent=t('selectReport')}
function closeMenu(){$('mobile-menu').classList.remove('open');$('menu-button').setAttribute('aria-expanded','false')}
function navigate(page,push=true,restoreY=0){if(page===state.page){closeMenu();return}if(push)state.history.push({page:state.page,y:scrollY});state.page=page;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id==='view-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,restoreY);if(page==='archive')renderArchive()}
function openDialog(id){const el=$(id);el.classList.add('open');state.openDialogs.push(id);document.body.style.overflow='hidden'}
function closeDialog(id){$(id).classList.remove('open');state.openDialogs=state.openDialogs.filter(x=>x!==id);if(!state.openDialogs.length)document.body.style.overflow=''}
function airBack(){if(state.openDialogs.length){closeDialog(state.openDialogs[state.openDialogs.length-1]);return 'false'}if(state.history.length){const previous=state.history.pop();navigate(previous.page,false,previous.y);return 'false'}return 'true'}window.airBack=airBack;
async function getRecord(row){const names=['调研问题','研究边界','调研报告'];const values=[];for(const name of names)values.push(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:`${name}/${row}`}));return {row,question:values[0]||'',boundary:values[1]||'',report:values[2]||''}}
function markdownHtml(raw){const source=String(raw||'');if(!source.trim())return `<p class="report-empty">${escapeHtml(t('emptyReport'))}</p>`;if(!window.marked||!window.DOMPurify)return `<pre>${escapeHtml(source)}</pre>`;marked.setOptions({gfm:true,breaks:true});return DOMPurify.sanitize(marked.parse(source),{ADD_ATTR:['target','download']})}
function renderMarkdown(container,raw){container.innerHTML=markdownHtml(raw);container.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(!src||/^(data:|blob:)/i.test(src))return;const filename=src.split('/').pop().split('?')[0];if(!filename)return;const url=/^https?:\/\//i.test(src)?src:'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(filename);img.src=url;img.style.cursor='pointer';img.title='Download';img.addEventListener('click',()=>window.open(url,'_blank'))});container.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'})}
async function openDetail(row){try{state.row=row;const record=await getRecord(row);$('detail-question').textContent=record.question;$('detail-boundary').textContent=record.boundary;renderMarkdown($('detail-content'),record.report);openDialog('detail-overlay');updatePager()}catch(e){alert(t('loadFailed')+': '+e.message)}}
async function openEdit(row){try{state.editRow=row;const record=await getRecord(row);$('edit-form-question').value=record.question;$('edit-form-boundary').value=record.boundary;renderMarkdown($('edit-form-report'),record.report);notice('edit-notice','');openDialog('edit-overlay')}catch(e){alert(t('loadFailed')+': '+e.message)}}
async function saveEdit(e){e.preventDefault();const button=$('edit-form-submit');button.disabled=true;try{const row=state.editRow;const question=$('edit-form-question').value.trim();const boundary=$('edit-form-boundary').value.trim();if(!question)return;await callAppBridge({type:'SetCellValue',data:SOURCE,payload:`调研问题/${row}/${question}`});await callAppBridge({type:'SetCellValue',data:SOURCE,payload:`研究边界/${row}/${boundary}`});closeDialog('edit-overlay');await refreshData();if(state.row===row)await loadReport(row)}catch(e){notice('edit-notice',t('saveFailed')+': '+e.message)}finally{button.disabled=false}}
async function deleteRecord(row){if(!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(state.row===row)clearReport();else if(state.row>row)state.row--;await refreshData()}catch(e){alert(t('deleteFailed')+': '+e.message)}}
function clearReport(){state.row=0;$('create-report-question').hidden=true;$('create-report-boundary').hidden=true;$('create-report-content').textContent=t('selectReport');$('create-report-content').classList.add('report-empty');$('report-controls').hidden=true}
async function loadReport(row){const record=await getRecord(row);state.row=row;$('create-report-question').textContent=record.question;$('create-report-question').hidden=false;$('create-report-boundary').textContent=record.boundary;$('create-report-boundary').hidden=!record.boundary;$('create-report-content').classList.remove('report-empty');renderMarkdown($('create-report-content'),record.report);$('report-controls').hidden=false;updatePager()}
function updatePager(){$('previous-report').disabled=state.row<=1||state.polling;$('next-report').disabled=state.row>=state.count||state.polling;$('report-position').textContent=state.row?`${state.row} / ${state.count}`:''}
function progressMarkup(step){return `<div class="progress"><p>${escapeHtml(t('waiting'))}</p><div class="progress-steps">${t('steps').map((s,i)=>`<div class="step ${i<=step?'active':''}">${escapeHtml(s)}</div>`).join('')}</div></div>`}
function stopPolling(){state.polling=false;clearInterval(state.pollTimer);state.pollTimer=null;$('create-form-submit').disabled=!$('create-form-question').value.trim();updatePager()}
async function pollReport(){const start=Date.now();let ticks=0;state.polling=true;$('create-form-submit').disabled=true;$('create-report-content').innerHTML=progressMarkup(0);updatePager();while(state.polling&&Date.now()-start<1800000){await new Promise(resolve=>setTimeout(resolve,1000));if(!state.polling)break;ticks++;$('create-report-content').innerHTML=progressMarkup(Math.min(3,Math.floor(ticks/8)%4));try{const report=await callAppBridge({type:'轮询',data:TABLE,payload:'调研报告'});if(String(report||'').trim()){stopPolling();await loadReport(1);await refreshData();return}}catch(e){notice('create-notice',e.message)}}if(state.polling){stopPolling();notice('create-notice',t('timeout'));await refreshData()}}
async function submitResearch(e){e.preventDefault();if(state.polling)return;const question=$('create-form-question').value.trim();const boundary=$('create-form-boundary').value.trim();if(!question)return;notice('create-notice','');$('create-form-submit').disabled=true;try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify({'调研问题':question,'研究边界':boundary})});state.row=1;state.count++;$('create-report-question').textContent=question;$('create-report-question').hidden=false;$('create-report-boundary').textContent=boundary;$('create-report-boundary').hidden=!boundary;$('report-controls').hidden=true;$('create-report').scrollIntoView({behavior:'smooth',block:'start'});await pollReport()}catch(e){stopPolling();notice('create-notice',t('submitFailed')+': '+e.message)}}
function resetResearch(){if(state.polling)return;$('create-form').reset();$('create-form-submit').disabled=true;notice('create-notice','');clearReport();$('create-form-question').focus()}
function keyboardVisibility(){const viewport=window.visualViewport;if(!viewport)return;const field=document.activeElement;if(field&&/^(INPUT|TEXTAREA|SELECT)$/.test(field.tagName)){setTimeout(()=>field.scrollIntoView({block:'center',behavior:'smooth'}),150)}}
async function initialize(){const saved=localStorage.getItem('iThinkAir_UiLanguage');const urlLang=new URLSearchParams(location.search).get('lang');const langs=navigator.languages;let lang=Array.isArray(langs)?(langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'):'cn';if(urlLang==='cn'||urlLang==='en')lang=urlLang;if(saved)lang=saved==='en'?'en':'cn';setLanguage(lang);try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('light',String(mode).trim()==='亮色')}catch(e){}clearReport();document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.page)));$('brand').addEventListener('click',e=>{e.preventDefault();if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('menu-button').addEventListener('click',()=>{const open=$('mobile-menu').classList.toggle('open');$('menu-button').setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});for(const id of ['desktop-lang','mobile-lang'])$(id).addEventListener('click',()=>{const next=state.lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',next);setLanguage(next);closeMenu()});$('home-start').onclick=()=>navigate('create');$('home-all').onclick=()=>navigate('archive');$('create-archive').onclick=()=>navigate('archive');$('archive-create').onclick=()=>navigate('create');$('archive-search').addEventListener('input',()=>{state.archivePage=1;renderArchive()});$('archive-prev').onclick=()=>{state.archivePage--;renderArchive()};$('archive-next').onclick=()=>{state.archivePage++;renderArchive()};$('create-form-question').addEventListener('input',()=>{$('create-form-submit').disabled=state.polling||!$('create-form-question').value.trim()});$('create-form').addEventListener('submit',submitResearch);$('new-research').onclick=resetResearch;$('previous-report').onclick=async()=>{if(state.row>1)await loadReport(state.row-1)};$('next-report').onclick=async()=>{if(state.row<state.count)await loadReport(state.row+1)};$('edit-form').addEventListener('submit',saveEdit);$('edit-cancel').onclick=()=>closeDialog('edit-overlay');$('detail-close').onclick=()=>closeDialog('detail-overlay');$('edit-close').onclick=()=>closeDialog('edit-overlay');for(const id of ['detail-overlay','edit-overlay'])$(id).addEventListener('click',e=>{if(e.target===$(id))closeDialog(id)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.openDialogs.length)closeDialog(state.openDialogs[state.openDialogs.length-1])});document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))keyboardVisibility()});if(window.visualViewport)window.visualViewport.addEventListener('resize',keyboardVisibility);try{await refreshData()}catch(e){notice('create-notice',t('loadFailed')+': '+e.message)}}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
</script>
