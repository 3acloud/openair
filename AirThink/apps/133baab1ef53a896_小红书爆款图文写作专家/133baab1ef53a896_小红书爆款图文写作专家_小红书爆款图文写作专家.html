<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }

      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {

    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });

      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);

  });
}

      },

    })
    .then(stream => {
      // 将视频流连接到video元素

      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas

          resolve(file);

          cleanup();
        }

    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素

        document.body.removeChild(container);
      }

        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {

                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {

                        currentField = '';

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;

             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function closeModal(){const top=modalStack.at(-1);if(!top)return;if(top.locked){toast(t('busy'));return}detailVersion++;modalStack.pop();top.overlay.remove();if(modalStack.length)modalStack.at(-1).overlay.inert=false;else{document.body.style.overflow='';document.querySelector('main').inert=false;$('navbar').inert=false}top.previousFocus?.focus?.()}
async function openDetails(row){if(mutation||loadBusy){toast(t('busy'));return}currentRow=row;const entry=openModal(t('details'),'<p>'+esc(t('loading'))+'</p>',{markdown:true});async function load(next){const version=++detailVersion;entry.row=next;currentRow=next;const body=entry.overlay.querySelector('.dialog-content');body.innerHTML='<p>'+esc(t('loading'))+'</p>';entry.overlay.querySelector('.extra-controls').innerHTML='';try{const count=Number(await api('GetRecordCount',SOURCE));const record=await getRecord(next);if(!entry.overlay.isConnected||version!==detailVersion)return;if(next<1||next>count)throw Error('Missing record');const controls=entry.overlay.querySelector('.extra-controls');controls.innerHTML='<button class="icon-btn" data-prev aria-label="'+esc(t('previous'))+'" '+(next<=1?'disabled':'')+'><i class="fa-solid fa-chevron-left"></i></button> <span class="hint">'+next+' / '+count+'</span> <button class="icon-btn" data-next aria-label="'+esc(t('next'))+'" '+(next>=count?'disabled':'')+'><i class="fa-solid fa-chevron-right"></i></button>';controls.querySelector('[data-prev]').onclick=()=>load(next-1);controls.querySelector('[data-next]').onclick=()=>load(next+1);
body.innerHTML=(record['参考图片']?imageTag(record['参考图片'],'preview-cover'):'')+'<h1>'+esc(record['主题']||t('untitled'))+'</h1><span class="tag">'+esc(styleName(record['风格']))+'</span><div class="markdown"></div><div class="dialog-footer"><button class="btn" data-detail-edit '+(generating?'disabled':'')+'>'+esc(t('edit'))+'</button></div>';renderMarkdown(body.querySelector('.markdown'),record['图文方案']);body.querySelector('[data-detail-edit]').onclick=()=>{const r=entry.row;closeModal();openEdit(r)};body.scrollTop=0}catch{if(entry.overlay.isConnected&&version===detailVersion){body.innerHTML='<div class="notice">'+esc(t('readFailed'))+'</div><button class="btn" data-read-retry>'+esc(t('retry'))+'</button>';body.querySelector('[data-read-retry]').onclick=()=>load(next)}}}await load(row)}
async function openEdit(row){if(generating||mutation||loadBusy){toast(t('busy'));return}currentRow=row;const entry=openModal(t('editTitle'),'<p>'+esc(t('loading'))+'</p>');const body=entry.overlay.querySelector('.dialog-content');try{const r=await getRecord(row);if(!entry.overlay.isConnected)return;body.innerHTML='<form id="editForm"><fieldset id="editForm_fields"><div class="field"><label for="editForm_topic">'+esc(t('topic'))+'</label><textarea id="editForm_topic" name="主题" required>'+esc(r['主题'])+'</textarea></div><div class="field"><label for="editForm_style">'+esc(t('style'))+'</label><select id="editForm_style" name="风格">'+options(r['风格'])+'</select></div><div class="field"><span class="field-label">'+esc(t('reference'))+'</span><input type="hidden" id="editForm_image" name="参考图片" value="'+esc(r['参考图片'])+'"><div class="image-box" id="editForm_imagePreview"></div><div class="image-buttons"><button type="button" class="btn small" data-image="SelectImage" data-form="editForm">'+esc(t('upload'))+'</button><button type="button" class="btn small" data-image="CapturePhoto" data-form="editForm">'+esc(t('camera'))+'</button><button type="button" class="btn small subtle" data-remove="editForm">'+esc(t('remove'))+'</button></div></div><label for="editForm_plan">'+esc(t('readonly'))+'</label><div id="editForm_plan" class="markdown" role="document"></div><input type="hidden" id="editForm_planValue" name="图文方案" value="'+esc(r['图文方案'])+'"><div class="notice" id="editForm_error" hidden role="alert"></div><div class="dialog-footer"><button type="button" class="btn subtle" data-close>'+esc(t('cancel'))+'</button><button type="submit" class="btn primary" id="editForm_submit">'+esc(t('save'))+'</button></div></fieldset></form>';if(r['风格']&&!STYLES.some(s=>s[0]===r['风格'])){const opt=new Option(r['风格'],r['风格'],true,true);$('editForm_style').add(opt)}renderImage('editForm');renderMarkdown($('editForm_plan'),r['图文方案']);$('editForm').onsubmit=async e=>{e.preventDefault();if(mutation||!$('editForm_topic').value.trim())return;const values={'主题':$('editForm_topic').value.trim(),'风格':$('editForm_style').value,'参考图片':$('editForm_image').value};mutation=true;entry.locked=true;$('editForm_fields').disabled=true;$('editForm_submit').textContent=t('saving');try{for(const key of ['主题','风格','参考图片'])await api('SetCellValue',SOURCE,key+'/'+row+'/'+values[key]);entry.locked=false;mutation=false;closeModal();toast(t('saved'));await refreshData()}catch{$('editForm_error').textContent=t('partialSave');$('editForm_error').hidden=false}finally{mutation=false;entry.locked=false;if($('editForm_fields')){$('editForm_fields').disabled=false;$('editForm_submit').textContent=t('save')}updateCreate();renderLists()}}}catch{body.innerHTML='<p class="notice">'+esc(t('readFailed'))+'</p><button class="btn" data-edit-retry>'+esc(t('retry'))+'</button>';body.querySelector('[data-edit-retry]').onclick=()=>{closeModal();openEdit(row)}}}
function confirmDelete(row){if(generating||mutation||loadBusy){toast(t('busy'));return}currentRow=row;const rec=records.find(r=>r.row===row);const entry=openModal(t('confirmDelete'),'<p>'+esc(rec?.['主题']||t('untitled'))+'</p><p>'+esc(t('deleteHint'))+'</p><div class="notice" data-delete-error hidden></div><div class="dialog-footer"><button class="btn subtle" data-close>'+esc(t('cancel'))+'</button><button class="btn primary" data-confirm-delete>'+esc(t('delete'))+'</button></div>',{small:true});entry.overlay.querySelector('[data-confirm-delete]').onclick=async e=>{mutation=true;entry.locked=true;e.target.disabled=true;e.target.textContent=t('deletePending');try{await api('DeleteRecord',SOURCE,row.toString());entry.locked=false;mutation=false;closeModal();currentRow=0;toast(t('deleted'));await refreshData()}catch{const err=entry.overlay.querySelector('[data-delete-error]');err.hidden=false;err.textContent=t('failed')}finally{mutation=false;entry.locked=false;e.target.disabled=false;e.target.textContent=t('delete');updateCreate();renderLists()}}}
async function selectImage(form,type,button){const field=$(form+'_image');if(!field||generating||mutation||imageBusy)return;imageBusy=true;const fieldset=$(form+'_fields');if(fieldset)fieldset.disabled=true;const entry=form==='editForm'?modalStack.at(-1):null;if(entry)entry.locked=true;updateCreate();try{const file=await api(type);if(file&&field.isConnected){field.value=file;renderImage(form)}}catch{toast(t('failed'))}finally{imageBusy=false;if(fieldset)fieldset.disabled=false;if(entry)entry.locked=false;updateCreate()}}
function bindEvents(){document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page)showPage(b.dataset.page);if(b.dataset.go)showPage(b.dataset.go);if(b.hasAttribute('data-preset')){if(generating){toast(t('busy'));return}$('createForm_style').value=b.dataset.preset;renderPills();showPage('studio')}if(b.hasAttribute('data-style')){$('createForm_style').value=b.dataset.style;renderPills()}if(b.dataset.image)selectImage(b.dataset.form,b.dataset.image,b);if(b.dataset.remove){$(b.dataset.remove+'_image').value='';renderImage(b.dataset.remove)}if(b.dataset.detail)openDetails(Number(b.dataset.detail));if(b.dataset.edit)openEdit(Number(b.dataset.edit));if(b.dataset.delete)confirmDelete(Number(b.dataset.delete))});
$('createForm').addEventListener('submit',generate);$('createForm_topic').addEventListener('input',updateCreate);$('resetButton').onclick=resetCreate;$('newButton').onclick=()=>{if(resetCreate())showPage('studio')};$('languageButton').onclick=toggleLanguage;$('mobileLanguageButton').onclick=toggleLanguage;$('menuButton').onclick=()=>{const open=$('mobileNav').hidden;$('mobileNav').hidden=!open;$('menuButton').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('navbar').contains(e.target))closeMenu()});$('brand').onclick=()=>{try{if(typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);else toast(t('hostClose'))}catch{toast(t('hostClose'))}};$('retryButton').onclick=async()=>{await refreshData();updateCreate()};$('librarySearch').oninput=()=>{visibleCount=12;renderLists()};$('libraryFilter').onchange=()=>{visibleCount=12;renderLists()};$('moreButton').onclick=()=>{visibleCount+=12;renderLists()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalStack.length)closeModal();else closeMenu()}const top=modalStack.at(-1);if(e.key==='Tab'&&top){const focusable=[...top.overlay.querySelectorAll('button:not(:disabled),input:not([type=hidden]):not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);if(!focusable.length){e.preventDefault();return}const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||!focusable.includes(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!focusable.includes(document.activeElement))){e.preventDefault();first.focus()}}if(e.key==='Enter'&&e.target.matches('img[data-download]'))e.target.click()});
document.addEventListener('click',e=>{const img=e.target.closest('.markdown img');if(img?.dataset.download){e.preventDefault();e.stopPropagation();const a=document.createElement('a');a.href=img.dataset.download;a.target='_blank';a.rel='noopener noreferrer';a.download='';a.click()}},true);
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){const img=e.target;img.alt=t('imageFailed');img.style.objectFit='contain'}},true);
const ensureVisible=()=>{const el=document.activeElement;if(el&&el.matches('input:not([type=hidden]),textarea,select'))setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),120)};
document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))ensureVisible()});window.visualViewport?.addEventListener('resize',()=>{document.body.classList.toggle('keyboard-open',window.innerHeight-window.visualViewport.height>120);ensureVisible()});window.addEventListener('resize',fitNavigation);if(window.ResizeObserver)new ResizeObserver(fitNavigation).observe($('navInner'));
}
async function initialize(){lang=chooseLanguage();bindEvents();applyLanguage();updateCreate();try{const mode=await api('模式');document.documentElement.dataset.theme=mode.trim()==='暗色'?'dark':'light'}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}await refreshData();updateCreate()}
(async () => { await initialize(); })();
</script>
