<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    // 组装元素

    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

erence:'Practice preference',quoteHint:'Today, receive one sentence. No questions needed.',submit:'Send to coach',response:'Coach response',again:'Start again',saveArchive:'Keep this in insights',archiveIntro:'Your conversations with yourself are kept here. Open a card to revisit the choices you made.',newPractice:'+ New practice',search:'Search situation, preference, and response',all:'All',detail:'Insight detail',editTitle:'Edit coach request',save:'Save changes',guide:'Guided practice',review:'Progress review',quote:'Daily quote',guideLine:'Look closely at this discomfort',guideSub:'Empathy first, then one question at a time',reviewLine:'Look back at your path',reviewSub:'A kind observation and one practical suggestion',quoteLine:'One sentence for today',quoteSub:'A quote, its source, and a short reflection',emptyRecent:'No recent insights yet.',emptyArchive:'No insights yet. Begin with one breath.',first:'Begin your first practice',view:'View details',edit:'Edit',delete:'Delete',confirmDelete:'Delete this record?',cancel:'Cancel',wait:'Your coach is lighting the lamp…',timeout:'The 1800-second wait ended. Check your insights later.',stageEmpty:'Set judgment aside and sit for a moment. Your response will appear here after you submit.',oneQuestion:'One question · notice, then choose',discomfort:'Discomfort',noText:'—',error:'Action failed: ',copied:'Response copied',required:'Please describe what is happening.',refreshError:'Data is temporarily unavailable.'}};
let lang='cn',currentPage='home',currentRow=0,recordCount=0,records=[],responseText='',waiting=false,pollToken=0,historyStack=[],detailOpen=false,editOpen=false,toastTimer;
const $=id=>document.getElementById(id),t=key=>i18n[lang][key]||key,escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rowObject(row,index){const o={row:index+1};FIELDS.forEach((f,i)=>o[f]=row[i]??'');return o}
function short(s,n){return (s||'').replace(/<[^>]*>/g,'').replace(/[#*_`~>\[\]()]/g,'').trim().slice(0,n)||t('noText')}
function badge(intent){return '<span class="badge '+(intent===INTENTS[0]?'guide':intent===INTENTS[1]?'review':'quote')+'">'+escapeHtml(intentLabel(intent))+'</span>'}
function intentLabel(v){return t(v===INTENTS[0]?'guide':v===INTENTS[1]?'review':'quote')}
function safeMarkdown(value){const text=String(value||'');if(!window.marked)return '<p>'+escapeHtml(text).replace(/\n/g,'<br>')+'</p>';const html=marked.parse(text,{gfm:true,breaks:true});const safe=window.DOMPurify?DOMPurify.sanitize(html):html;const host=document.createElement('div');host.innerHTML=safe;host.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(!/^(https?:|data:)/i.test(src))img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);const a=document.createElement('a');a.href=img.src;a.download='';a.target='_blank';a.rel='noopener';img.replaceWith(a);a.appendChild(img)});host.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'});return host.innerHTML}
function notify(message){const el=$('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4000)}
function showError(e){notify(t('error')+(e&&e.message?e.message:String(e)))}
function setLanguage(next){lang=next;try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch(e){}document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('languageButton').textContent=lang==='cn'?'EN':'中文';$('mobileLanguage').textContent=lang==='cn'?'English':'中文';$('practiceForm_situation').placeholder=lang==='cn'?'发生了什么？身体和情绪此刻如何？只需如实写下。':'What happened? How do your body and emotions feel right now?';$('practiceForm_preference').placeholder=lang==='cn'?'例如：更短的问题、只要行动建议、偏马可·奥勒留风格……可留空':'For example: shorter questions, practical steps, or a Marcus Aurelius style… optional';$('editForm_situation').placeholder=$('practiceForm_situation').placeholder;$('editForm_preference').placeholder=$('practiceForm_preference').placeholder;renderIntentButtons('practice');renderIntentButtons('edit');renderFilter();renderHome();renderArchive();renderStage();if(detailOpen)openDetail(currentRow,false);if(editOpen)updateIntentUI('edit')}
function initialLanguage(){let chosen;try{const langs=navigator.languages;if(!langs||!langs.length)chosen='cn';else chosen=langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}catch(e){chosen='cn'}const url=new URLSearchParams(location.search).get('lang');if(url==='cn'||url==='en')chosen=url;try{const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)chosen=saved==='en'?'en':'cn'}catch(e){}return chosen}
function setMode(mode){document.body.classList.toggle('light',String(mode||'').includes('亮'))}
function renderIntentButtons(prefix){const node=$(prefix+'IntentButtons'),value=$(prefix+'Form_intent').value;node.innerHTML=INTENTS.map((v,i)=>'<button type="button" data-intent="'+v+'" class="'+(v===value?'selected':'')+'">'+t(['guide','review','quote'][i])+'</button>').join('')}
function updateIntentUI(prefix){const intent=$(prefix+'Form_intent').value;$(prefix+'DegreeGroup').hidden=intent!==INTENTS[0];$(prefix+'SituationGroup').hidden=intent===INTENTS[2];$(prefix+'PreferenceGroup').hidden=intent!==INTENTS[0];$(prefix+'QuoteHint').hidden=intent!==INTENTS[2];if(prefix==='practice')validateForm();renderIntentButtons(prefix)}
function selectIntent(prefix,intent){$(prefix+'Form_intent').value=intent;updateIntentUI(prefix)}
function validateForm(){const intent=$('practiceForm_intent').value;const ok=!!intent&&(intent!==INTENTS[0]||!!$('practiceForm_situation').value.trim());$('submitButton').disabled=waiting||!ok}
function navigate(page,push=true){if(page===currentPage)return;if(push)historyStack.push({page:currentPage,scroll:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'Page'));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='archive')renderArchive()}
function closeMenu(){$('mobileMenu').hidden=true;$('menuToggle').setAttribute('aria-expanded','false')}
function airBack(){if(editOpen){closeEdit();return 'false'}if(detailOpen){closeDetail();return 'false'}if(!$('mobileMenu').hidden){closeMenu();return 'false'}if(historyStack.length){const previous=historyStack.pop();navigate(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false'}return 'true'}window.airBack=airBack;
function renderHome(){$('intentCards').innerHTML=INTENTS.map((v,i)=>'<button class="card intent-card" type="button" data-intent="'+v+'"><i class="fa-solid '+['fa-hand-holding-heart','fa-compass','fa-scroll'][i]+'"></i><strong>'+t(['guideLine','reviewLine','quoteLine'][i])+'</strong><span>'+t(['guideSub','reviewSub','quoteSub'][i])+'</span></button>').join('');$('statGuide').textContent=records.filter(r=>r['用户意图']===INTENTS[0]).length;$('statReview').textContent=records.filter(r=>r['用户意图']===INTENTS[1]).length;$('statQuote').textContent=records.filter(r=>r['用户意图']===INTENTS[2]).length;$('statTotal').textContent=recordCount;const recent=records.slice(0,5);$('recentList').innerHTML=recent.length?recent.map(r=>'<button type="button" class="card record-card" data-row="'+r.row+'">'+badge(r['用户意图'])+(r['用户意图']===INTENTS[0]?'<span class="degree">'+t('discomfort')+' '+escapeHtml(r['不适程度'])+'/10</span>':'')+'<p>'+escapeHtml(short(r.summarySituation??r['情况描述'],40))+'</p><p class="excerpt">'+escapeHtml(short(r.summaryResponse??r['教练回应'],60))+'</p></button>').join(''):'<div class="empty">'+t('emptyRecent')+'</div>'}
function renderFilter(){const v=$('archiveFilter').value;$('archiveFilter').innerHTML='<option value="">'+t('all')+'</option>'+INTENTS.map((x,i)=>'<option value="'+x+'">'+t(['guide','review','quote'][i])+'</option>').join('');$('archiveFilter').value=v}
function renderArchive(){const q=$('archiveSearch').value.toLocaleLowerCase(),intent=$('archiveFilter').value;const shown=records.filter(r=>(!intent||r['用户意图']===intent)&&(!q||['情况描述','练习偏好','教练回应'].some(f=>String(r[f]).toLocaleLowerCase().includes(q))));$('archiveList').innerHTML=shown.length?shown.map(r=>'<article class="card archive-card" tabindex="0" data-row="'+r.row+'"><div class="card-top"><div>'+badge(r['用户意图'])+(r['用户意图']===INTENTS[0]?'<span class="degree">'+t('discomfort')+' '+escapeHtml(r['不适程度'])+'/10</span>':'')+'</div><i class="fa-solid fa-chevron-right"></i></div><p>'+escapeHtml(short(r.summarySituation??r['情况描述'],50))+'</p>'+(r['练习偏好']?'<p class="quiet">'+t('preference')+': '+escapeHtml(r['练习偏好'])+'</p>':'')+'<p class="excerpt">'+escapeHtml(short(r.summaryResponse??r['教练回应'],80))+'</p><div class="actions"><button type="button" class="btn" data-action="detail">'+t('view')+'</button><button type="button" class="btn" data-action="edit">'+t('edit')+'</button><button type="button" class="btn danger" data-action="delete">'+t('delete')+'</button></div></article>').join(''):'<div class="empty">'+t('emptyArchive')+'<div class="center"><button class="btn primary" id="firstPracticeButton" type="button">'+t('first')+'</button></div></div>'}
async function refreshData(){const [countText,csv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS.join(',')})]);recordCount=Math.max(0,Number.parseInt(countText,10)||0);records=csv&&String(csv).trim()?parseCSV(String(csv)).filter(row=>row.some(v=>v!=='')).map(rowObject):[];for(let start=0;start<records.length;start+=5){const batch=records.slice(start,start+5),jobs=[];for(const r of batch){jobs.push(callAppBridge({type:'GetCellValue',data:TABLE,payload:'情况描述/'+r.row}));jobs.push(callAppBridge({type:'GetCellValue',data:TABLE,payload:'教练回应/'+r.row}))}const values=await Promise.all(jobs);for(let i=0;i<batch.length;i++){batch[i].summarySituation=String(values[i*2]??'');batch[i].summaryResponse=String(values[i*2+1]??'')}}renderHome();renderArchive()}
function resetPractice(keepIntent=true){pollToken++;waiting=false;responseText='';currentRow=0;const value=keepIntent?$('practiceForm_intent').value:INTENTS[0];$('practiceForm').reset();$('practiceForm_intent').value=value;$('practiceForm_degree').value='5';$('practiceDegreeValue').textContent='5';updateIntentUI('practice');renderStage()}
function renderStage(){const stage=$('stageBody');$('copyButton').disabled=!responseText;$('saveArchiveButton').hidden=!responseText||currentRow===0;if(waiting){stage.innerHTML='<div class="waiting"><i class="fa-solid fa-spinner fa-spin"></i>'+t('wait')+'</div>';return}if(!responseText){stage.innerHTML='<div class="stage-empty">'+t('stageEmpty')+'</div>';return}const intent=$('practiceForm_intent').value;let inner='<div class="markdown">'+safeMarkdown(responseText)+'</div>';if(intent===INTENTS[0])inner='<div class="thin-rule">'+t('oneQuestion')+'</div>'+inner;if(intent===INTENTS[2])inner='<div class="quote-stage">'+inner+'</div>';stage.innerHTML=inner}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function pollResponse(token){const end=Date.now()+1800000;while(Date.now()<end&&token===pollToken){await sleep(1000);if(token!==pollToken)return;try{const result=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'教练回应/'+currentRow});if(result&&String(result).trim()){responseText=String(result);waiting=false;renderStage();await refreshData();return}}catch(e){showError(e)}}if(token===pollToken){waiting=false;renderStage();notify(t('timeout'))}}
async function submitPractice(event){event.preventDefault();validateForm();if($('submitButton').disabled)return;const intent=$('practiceForm_intent').value,payload={'用户意图':intent};if(intent===INTENTS[0]){payload['不适程度']=$('practiceForm_degree').value;payload['情况描述']=$('practiceForm_situation').value.trim();payload['练习偏好']=$('practiceForm_preference').value}if(intent===INTENTS[1])payload['情况描述']=$('practiceForm_situation').value;waiting=true;validateForm();renderStage();try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(payload)});currentRow=1;responseText='';try{await refreshData()}catch(e){showError(e)}const token=++pollToken;await pollResponse(token)}catch(e){waiting=false;validateForm();renderStage();showError(e)}}
async function getField(field,row){return String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})??'')}
async function getFullRecord(row){const result={row};for(const field of FIELDS)result[field]=await getField(field,row);return result}
async function openDetail(row,push=true){if(row<1)return;currentRow=row;detailOpen=true;$('detailOverlay').hidden=false;const requestRow=row;try{recordCount=Math.max(0,Number.parseInt(await callAppBridge({type:'GetRecordCount',data:TABLE}),10)||0);const record=await getFullRecord(row);if(!detailOpen||currentRow!==requestRow)return;$('detailFields').innerHTML=FIELDS.slice(0,4).map(f=>'<div class="detail-cell"><small>'+escapeHtml(f==='用户意图'?t('intent'):f==='不适程度'?t('degree'):f==='情况描述'?t('situation'):t('preference'))+'</small>'+escapeHtml(record[f]||t('noText'))+'</div>').join('');$('detailResponse').innerHTML=safeMarkdown(record['教练回应']);$('detailPrevious').disabled=row<=1;$('detailNext').disabled=row>=recordCount}catch(e){showError(e)}}
function closeDetail(){detailOpen=false;$('detailOverlay').hidden=true}
async function openEdit(row){currentRow=row;editOpen=true;$('editOverlay').hidden=false;try{const record=await getFullRecord(row);if(!editOpen||currentRow!==row)return;$('editForm_intent').value=record['用户意图']||INTENTS[0];$('editForm_degree').value=record['不适程度']||'5';$('editDegreeValue').textContent=$('editForm_degree').value;$('editForm_situation').value=record['情况描述'];$('editForm_preference').value=record['练习偏好'];$('editResponsePreview').innerHTML=safeMarkdown(record['教练回应']);updateIntentUI('edit')}catch(e){showError(e)}}
function closeEdit(){editOpen=false;$('editOverlay').hidden=true}
async function saveEdit(event){event.preventDefault();const btn=$('editSaveButton');btn.disabled=true;const intent=$('editForm_intent').value;const fields={'用户意图':intent,'不适程度':intent===INTENTS[0]?$('editForm_degree').value:'','情况描述':intent===INTENTS[2]?'':$('editForm_situation').value,'练习偏好':intent===INTENTS[0]?$('editForm_preference').value:''};try{for(const [field,value] of Object.entries(fields))await callAppBridge({type:'SetCellValue',data:TABLE,payload:field+'/'+currentRow+'/'+value});closeEdit();await refreshData()}catch(e){showError(e)}finally{btn.disabled=false}}
async function deleteRecord(row){if(!window.confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});if(currentRow===row)currentRow=0;await refreshData()}catch(e){showError(e)}}
function focusVisibility(){document.addEventListener('focusin',event=>{if(!event.target.matches('input,textarea,select'))return;setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),300)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),80)})}
function bind(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.page)));$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('menuToggle').addEventListener('click',()=>{const menu=$('mobileMenu');menu.hidden=!menu.hidden;$('menuToggle').setAttribute('aria-expanded',String(!menu.hidden))});document.addEventListener('click',event=>{if(!$('navbar').contains(event.target))closeMenu()});$('languageButton').addEventListener('click',()=>setLanguage(lang==='cn'?'en':'cn'));$('mobileLanguage').addEventListener('click',()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu()});$('intentCards').addEventListener('click',event=>{const card=event.target.closest('[data-intent]');if(card){resetPractice();selectIntent('practice',card.dataset.intent);navigate('practice')}});$('todayButton').addEventListener('click',()=>navigate('practice'));$('viewArchiveButton').addEventListener('click',()=>navigate('archive'));$('newPracticeButton').addEventListener('click',()=>{resetPractice();navigate('practice')});$('recentList').addEventListener('click',event=>{const card=event.target.closest('[data-row]');if(card){navigate('archive');openDetail(Number(card.dataset.row))}});for(const prefix of ['practice','edit']){$(prefix+'IntentButtons').addEventListener('click',event=>{const button=event.target.closest('[data-intent]');if(button)selectIntent(prefix,button.dataset.intent)});$(prefix+'Form_degree').addEventListener('input',()=>{$(prefix+'DegreeValue').textContent=$(prefix+'Form_degree').value})}$('practiceForm_situation').addEventListener('input',validateForm);$('practiceForm').addEventListener('submit',submitPractice);$('againButton').addEventListener('click',()=>resetPractice());$('copyButton').addEventListener('click',async()=>{try{const plain=document.createElement('div');plain.innerHTML=safeMarkdown(responseText);await navigator.clipboard.writeText(plain.textContent||'');notify(t('copied'))}catch(e){showError(e)}});$('saveArchiveButton').addEventListener('click',()=>{const row=currentRow;navigate('archive');openDetail(row)});$('archiveSearch').addEventListener('input',renderArchive);$('archiveFilter').addEventListener('change',renderArchive);$('archiveList').addEventListener('click',event=>{if(event.target.closest('#firstPracticeButton')){navigate('practice');return}const card=event.target.closest('[data-row]');if(!card)return;const row=Number(card.dataset.row),action=event.target.closest('[data-action]')?.dataset.action;if(action==='edit')openEdit(row);else if(action==='delete')deleteRecord(row);else openDetail(row)});$('archiveList').addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('.archive-card')){event.preventDefault();openDetail(Number(event.target.dataset.row))}});$('detailClose').addEventListener('click',closeDetail);$('detailOverlay').addEventListener('click',event=>{if(event.target===$('detailOverlay'))closeDetail()});$('detailPrevious').addEventListener('click',()=>openDetail(currentRow-1));$('detailNext').addEventListener('click',()=>openDetail(currentRow+1));$('editClose').addEventListener('click',closeEdit);$('editOverlay').addEventListener('click',event=>{if(event.target===$('editOverlay'))closeEdit()});$('editForm').addEventListener('submit',saveEdit);document.addEventListener('keydown',event=>{if(event.key==='Escape')airBack()})}
async function initialize(){setLanguage(initialLanguage());bind();focusVisibility();updateIntentUI('practice');updateIntentUI('edit');renderStage();try{setMode(await callAppBridge({type:'模式'}))}catch(e){}try{await refreshData()}catch(e){renderHome();renderArchive();notify(t('refreshError'))}const quotes=lang==='cn'?['控制你能控制的。','先审视判断。','平静始于内心。']:['Attend to what is yours.','Examine the judgment.','Peace begins within.'];let index=0;$('motto').textContent=quotes[0];setInterval(()=>{$('motto').textContent=quotes[++index%quotes.length]},6000)}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
</script>
