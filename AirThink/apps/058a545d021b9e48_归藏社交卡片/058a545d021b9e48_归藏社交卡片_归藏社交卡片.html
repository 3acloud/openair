<script>

        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("058a545d021b9e48_归藏社交卡片")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';

    fileInput.addEventListener('change', (event) => {

  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function modal(title,reading=false){const overlay=document.createElement('div');overlay.className='overlay'+(reading?' reading':'');overlay.innerHTML='<section class="dialog" role="dialog" aria-modal="true" tabindex="-1"><div class="dialoghead"><h2>'+esc(title)+'</h2><button class="x" aria-label="'+esc(t('close'))+'"><i class="fa-solid fa-xmark"></i></button></div><div class="content"></div></section>';overlay.style.zIndex=2002+modals.length;const item={overlay,focus:document.activeElement,locked:false};modals.push(item);document.body.append(overlay);document.body.style.overflow='hidden';overlay.querySelector('.x').onclick=()=>closeModal();overlay.onclick=e=>{if(e.target===overlay)closeModal();};overlay.querySelector('.dialog').focus();return overlay.querySelector('.content');}

function formValues(id){const f=$(id),obj={};for(const field of FIELDS){if(OPTIONS[field])obj[field]=Array.from(f.querySelectorAll('input[name="'+field+'"]:checked')).map(e=>e.value).join(',');else obj[field]=f.elements.namedItem(field).value.trim();}return obj;}
function renderForm(id,values={}){const f=$(id);f.innerHTML=FIELDS.map((field,index)=>{const key=id+'-f'+index,v=values[field]??(OPTIONS[field]?OPTIONS[field][0]:'');if(OPTIONS[field])return '<fieldset class="field"><legend>'+esc(t(field))+'</legend><div class="choices">'+OPTIONS[field].map((option,i)=>'<label class="choice" for="'+key+'-'+i+'"><input id="'+key+'-'+i+'" name="'+field+'" type="'+(field==='目标平台'?'checkbox':'radio')+'" value="'+option+'" '+(files(v).includes(option)?'checked':'')+'><span>'+esc(t(option))+'</span></label>').join('')+'</div></fieldset>';return '<div class="field"><label for="'+key+'">'+esc(t(field))+(field==='源内容'?' *':'')+'</label>'+(field==='素材文件'?'<input id="'+key+'" name="'+field+'" value="'+esc(v)+'" placeholder="file1.png,file2.mp4"><div class="files" id="'+id+'-files"></div><div class="actions">'+[['SelectImage','image','fa-image'],['SelectFile','file','fa-paperclip'],['CapturePhoto','camera','fa-camera']].map(([type,label,icon])=>'<button type="button" data-pick="'+type+'"><i class="fa-solid '+icon+'"></i> '+t(label)+'</button>').join('')+'</div>':'<textarea id="'+key+'" name="'+field+'" '+(field==='源内容'?'required rows="7"':'rows="4"')+' placeholder="'+esc(t(field==='源内容'?'sourcePlaceholder':'briefPlaceholder'))+'">'+esc(v)+'</textarea>')+'</div>';}).join('')+'<div class="hint" id="'+id+'-hint" aria-live="polite"></div><button class="primary" id="'+id+'-submit" type="submit">'+t(id==='createForm'?'generate':'save')+'</button>'+(id==='editForm'?'<p class="muted">'+t('editNote')+'</p>':'');f.oninput=()=>updateForm(id);f.onchange=()=>updateForm(id);f.querySelectorAll('[data-pick]').forEach(b=>b.onclick=run(async()=>{b.disabled=true;try{const name=await callAppBridge({type:b.dataset.pick});if(name){const input=f.elements.namedItem('素材文件');input.value=[...files(input.value),name].join(',');updateForm(id);}}finally{b.disabled=false;}}));updateForm(id);}
function updateForm(id){const f=$(id),v=formValues(id),hint=[];if(v['目标平台'].includes('小红书'))hint.push(t('xhsHint'));if(v['目标平台'].includes('微信公众号'))hint.push(t('wechatHint'));if(v['卡片形式']==='公众号双封面'&&v['画面比例']!=='21:9与1:1双封面')hint.push(t('ratioHint'));if(v['卡片形式'].includes('实况'))hint.push(t('videoHint'));const missing=v['配图来源']==='用户提供'&&!files(v['素材文件']).length;if(missing)hint.push(t('assetsRequired'));$(id+'-hint').textContent=hint.join('\n');$(id+'-submit').disabled=missing||(id==='createForm'&&busy);$(id+'-files').replaceChildren();for(const name of files(v['素材文件'])){const el=document.createElement('span');el.className='file';el.innerHTML=(isImage(name)?'<img alt="" src="'+esc(fileURL(name))+'">':'')+'<button type="button">'+esc(name)+'</button><button type="button" aria-label="'+esc(t('remove')+' '+name)+'">×</button>';el.querySelectorAll('button')[0].onclick=run(()=>openFile(name));el.querySelectorAll('button')[1].onclick=()=>{f.elements.namedItem('素材文件').value=files(f.elements.namedItem('素材文件').value).filter(x=>x!==name).join(',');updateForm(id);};$(id+'-files').append(el);}}
function validate(v){if(!v['源内容'])throw Error(t('required'));if(v['配图来源']==='用户提供'&&!files(v['素材文件']).length)throw Error(t('assetsRequired'));}
function normalizeMarkdown(text){return text.replace(/(!?\[[^\]]*\]\()([^\s)]+)(\))/g,(m,a,b,c)=>a+(/^(https?:|data:|#)/i.test(b)?b:fileURL(b))+c);}
function renderMarkdown(el,text,empty='pending'){el.replaceChildren();if(!text.trim()){el.innerHTML=emptyHTML(empty);return;}if(!window.marked||!window.DOMPurify){el.textContent=text;return;}el.innerHTML=DOMPurify.sanitize(marked.parse(normalizeMarkdown(text),{gfm:true,breaks:true}));el.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src');if(!src)return;img.src=safeURL(src);img.style.cursor='pointer';img.tabIndex=0;img.setAttribute('role','link');img.title=t('download');const download=e=>{e.preventDefault();e.stopPropagation();window.open(img.src,'_blank','noopener');};img.onclick=download;img.onkeydown=e=>{if(e.key==='Enter')download(e);};});el.querySelectorAll('a').forEach(a=>{a.rel='noopener noreferrer';a.target='_blank';const href=a.getAttribute('href')||'';if(/\.html?(?:[?#]|$)/i.test(href)){a.onclick=run(async e=>{e.preventDefault();await openFile(decodeURIComponent(href.split('/').pop().split(/[?#]/)[0]));});}else if(/\.(mp4|webm|mov|mp3|wav|m4a)(?:[?#]|$)/i.test(href)&&href.includes('ithinkair.com:3031/')){a.onclick=run(async e=>{e.preventDefault();await openFile(decodeURIComponent(href.split('/').pop().split(/[?#]/)[0]));});}});const known=new Set();for(const match of text.matchAll(/(?:^|[\s`])([^\s`<>"\[\]()]+\.(?:png|jpe?g|webp|gif|html?|zip|mp4|webm|mp3|pdf))(?=$|[\s`])/gi)){const name=match[1];if(name.includes('://')||name.includes('/'))continue;if(known.has(name))continue;known.add(name);const block=document.createElement('p');if(isImage(name)){const a=document.createElement('a');a.href=fileURL(name);a.target='_blank';a.rel='noopener';const im=document.createElement('img');im.src=fileURL(name);im.alt=name;a.append(im);block.append(a);}const b=document.createElement('button');b.textContent=t('open')+' · '+name;b.onclick=run(()=>openFile(name));block.append(b);const a=document.createElement('a');a.textContent=' '+t('download');a.href=fileURL(name);a.target='_blank';a.rel='noopener';block.append(a);el.append(block);}}
async function openFile(name){const content=modal(name,true);if(/\.html?$/i.test(name)){const frame=document.createElement('iframe');frame.className='viewer';frame.title=name;frame.sandbox='allow-scripts allow-downloads';frame.src=fileURL(name,true);content.append(frame);}else if(/\.(mp4|webm|mov|mp3|wav|m4a)$/i.test(name)){content.textContent=t('loading');const b64=await api('FileToBase64',name);const media=document.createElement(/\.(mp3|wav|m4a)$/i.test(name)?'audio':'video');const ext=name.split('.').pop().toLowerCase(),mime={mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4'}[ext];media.controls=true;media.style.maxWidth='100%';media.src=b64.startsWith('data:')?b64:'data:'+mime+';base64,'+b64;content.replaceChildren(media);}else if(/\.(md|markdown|txt|csv|json)$/i.test(name)){content.textContent=t('loading');const txt=await api('ReadFile',name);if(/\.(md|markdown)$/i.test(name)){content.classList.add('markdown');renderMarkdown(content,txt);}else{const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=txt;content.replaceChildren(pre);}}else if(isImage(name)){const img=document.createElement('img');img.src=fileURL(name);img.alt=name;img.style.maxWidth='100%';content.append(img);}else{const frame=document.createElement('iframe');frame.className='viewer';frame.title=name;frame.src=fileURL(name,true);content.append(frame);}const a=document.createElement('a');a.href=fileURL(name);a.textContent=t('download');a.target='_blank';a.rel='noopener';content.append(a);}
async function getRecord(row,includeResult=true){const obj={};for(const field of [...FIELDS,...(includeResult?['生成结果']:[])])obj[field]=await api('GetCellValue',TABLE,field+'/'+row);return obj;}
function updateNav(){$('rowLabel').textContent=currentRow+' / '+recordCount;$('prev').disabled=busy||loading||currentRow<=1;$('next').disabled=busy||loading||currentRow>=recordCount;$('newDraft').disabled=busy||loading;$('newCard').disabled=busy||loading;}
function renderResult(){renderMarkdown($('result'),resultText,currentRow?'unfinished':'blank');if(busy)$('result').innerHTML=emptyHTML('wait');updateNav();}
function newDraft(){if(busy||loading)throw Error(t('locked'));currentRow=0;resultText='';renderForm('createForm');renderResult();}
async function browseRow(n){if(busy||loading||n<1||n>recordCount)return;loading=true;updateNav();try{const v=await getRecord(n);currentRow=n;resultText=v['生成结果'];renderForm('createForm',v);renderResult();}finally{loading=false;updateNav();}}
async function loadSummary(obj){obj['源内容']=await api('GetCellValue',TABLE,'源内容/'+obj.row);obj['制作要求']=await api('GetCellValue',TABLE,'制作要求/'+obj.row);}
async function loadData(){const values=await Promise.all([api('GetRecordCount'),api('GetTableCSV',TABLE,FIELDS.join(',')),api('GetTableCSV',TABLE,'目标平台'),api('GetTableCSV',TABLE,'卡片形式')]);recordCount=Number(values[0]);if(!Number.isFinite(recordCount))throw Error('Invalid record count');const parsed=parseCSV(values[1]);const next=[];for(let i=0;i<parsed.length;i++){const obj={row:i+1};FIELDS.forEach((f,j)=>obj[f]=parsed[i][j]||'');next.push(obj);}await Promise.all(next.map(obj=>loadSummary(obj)));rows=next;const platforms=parseCSV(values[2]);const live=parseCSV(values[3]);window.statCounts=[recordCount,platforms.filter(r=>(r[0]||'').includes('小红书')).length,platforms.filter(r=>(r[0]||'').includes('微信公众号')).length,live.filter(r=>OPTIONS['卡片形式'].slice(1,5).includes(r[0])).length];dataReady=true;renderData();updateNav();}
function renderStats(){$('stats').innerHTML=['total','xhs','wechat','live'].map((k,i)=>'<div class="stat"><span class="eyebrow">0'+(i+1)+'</span><strong>'+(window.statCounts?window.statCounts[i]:'—')+'</strong><span class="muted">'+t(k)+'</span></div>').join('');}
function card(obj,recent=false){const el=document.createElement('article');el.className='card';const thumb=files(obj['素材文件']).find(isImage);el.innerHTML='<button class="cardbody" type="button">'+files(obj['目标平台']).map(v=>'<span class="badge">'+esc(t(v))+'</span>').join('')+(thumb?'<img class="thumb" loading="lazy" src="'+esc(fileURL(thumb))+'" alt="">':'')+'<h3>'+esc(t(obj['卡片形式']))+'</h3><small>'+esc(t(obj['视觉风格']))+' / '+esc(t(obj['画面比例']))+'</small><p>'+esc(obj['源内容'].slice(0,recent?80:60))+'</p><p class="muted">'+esc(obj['制作要求'].slice(0,40))+'</p><small>'+esc(t(obj['配图来源']))+'</small></button>';el.querySelector('button').onclick=run(()=>showDetail(obj.row));if(!recent){const actions=document.createElement('div');actions.className='actions';for(const [label,fn] of [['view',showDetail],['edit',editRecord],['remake',remakeRecord],['remove',deleteRecord]]){const b=document.createElement('button');b.textContent=t(label);b.disabled=busy&&label!=='view';b.onclick=run(()=>fn(obj.row));actions.append(b);}el.append(actions);}return el;}
function like(value,pattern){const re=pattern.split('%').map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.*');return new RegExp('^'+re+'$','i').test(value);}
function renderData(){renderStats();$('recent').replaceChildren();rows.slice(0,6).forEach(r=>$('recent').append(card(r,true)));if(!rows.length)$('recent').innerHTML=emptyHTML(dataReady?'empty':'loading');renderCollection();}
function renderFilters(){const previous={};$('filters').querySelectorAll('input,select').forEach(e=>previous[e.name]=e.value);$('filters').innerHTML='<input id="search" name="search" aria-label="'+esc(t('search'))+'" placeholder="'+esc(t('search'))+'">'+['目标平台','卡片形式','视觉风格','配图来源'].map((field,i)=>'<select id="filter-'+i+'" name="'+field+'" aria-label="'+esc(t(field))+'"><option value="">'+t(field)+' · '+t('any')+'</option>'+OPTIONS[field].map(v=>'<option value="'+v+'">'+t(v)+'</option>').join('')+'</select>').join('');$('filters').querySelectorAll('input,select').forEach(e=>{e.value=previous[e.name]||'';e.oninput=()=>{limit=12;renderCollection();};});}
function renderCollection(){if(!$('search'))return;const q=$('search').value.trim().toLowerCase(),filters=Array.from($('filters').querySelectorAll('select'));const found=rows.filter(r=>(!q||(r['源内容']+'\n'+r['制作要求']).toLowerCase().includes(q))&&filters.every(e=>!e.value||(e.name==='目标平台'?like(r[e.name],'%'+e.value+'%'):r[e.name]===e.value)));$('collection').replaceChildren();found.slice(0,limit).forEach(r=>$('collection').append(card(r)));if(!found.length)$('collection').innerHTML=emptyHTML(dataReady?(rows.length?'noMatch':'empty'):'loading');$('countLabel').textContent=lang==='en'?found.length+' works':found.length+' 件作品';$('more').hidden=found.length<=limit;}
async function showDetail(row){if(busy||loading)throw Error(t('locked'));currentRow=row;updateNav();const content=modal(t('view'),true);content.textContent=t('loading');try{const v=await getRecord(row);resultText=v['生成结果'];renderForm('createForm',v);renderResult();content.innerHTML='<div class="detail"><dl></dl><div><h3>'+t('生成结果')+'</h3><div class="markdown"></div></div></div><div class="actions detailactions"></div>';const dl=content.querySelector('dl');for(const f of FIELDS){const dt=document.createElement('dt');dt.textContent=t(f);const dd=document.createElement('dd');if(f==='素材文件'){for(const name of files(v[f])){const b=document.createElement('button');b.textContent=name;b.onclick=run(()=>openFile(name));const a=document.createElement('a');a.textContent=' '+t('download');a.href=fileURL(name);a.target='_blank';a.rel='noopener';dd.append(b,a,document.createElement('br'));}}else dd.textContent=OPTIONS[f]?files(v[f]).map(t).join(', '):v[f];dl.append(dt,dd);}renderMarkdown(content.querySelector('.markdown'),v['生成结果']);for(const [label,fn] of [['close',()=>closeModal()],['edit',()=>{closeModal();return editRecord(row);}],['remake',()=>{closeModal();return remakeRecord(row);}],['remove',()=>deleteRecord(row)]]){const b=document.createElement('button');b.textContent=t(label);b.disabled=busy&&label!=='close';b.onclick=run(fn);content.querySelector('.detailactions').append(b);}}catch(e){content.textContent=t('error')+(e.message||e);}}
async function editRecord(row){if(busy)throw Error(t('locked'));currentRow=row;updateNav();const content=modal(t('edit')+' · '+t('app'));const item=modals.at(-1);content.textContent=t('loading');const v=await getRecord(row,false);content.innerHTML='<form id="editForm"></form>';renderForm('editForm',v);$('editForm').onsubmit=run(async e=>{e.preventDefault();const values=formValues('editForm');validate(values);item.locked=true;const form=$('editForm');form.querySelectorAll('input,textarea,button').forEach(e=>e.disabled=true);try{for(const f of FIELDS)await api('SetCellValue',TABLE,f+'/'+row+'/'+values[f]);item.locked=false;closeModal();await loadData();$('globalStatus').textContent=t('saved');}catch(error){showError(Error((error.message||error)+' '+t('partial')));}finally{item.locked=false;if(form.isConnected){form.querySelectorAll('input,textarea,button').forEach(e=>e.disabled=false);updateForm('editForm');}}});}

async function submitCreate(e){e.preventDefault();if(busy)return;const v=formValues('createForm');validate(v);busy=true;$('language').disabled=true;renderData();$('createForm').querySelectorAll('input,textarea,button').forEach(e=>e.disabled=true);renderResult();try{await api('SubmitRecord','社交卡片',JSON.stringify(v));currentRow=1;recordCount++;updateNav();const deadline=Date.now()+1800000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));const remaining=deadline-Date.now();if(remaining<=0)break;let timer;let output;try{output=await Promise.race([api('GetCellValue',TABLE,'生成结果/1'),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error(t('timeout'))),remaining);})]);}finally{clearTimeout(timer);}if(output.trim()){resultText=output;return;}}throw Error(t('timeout'));}finally{busy=false;$('language').disabled=false;$('createForm').querySelectorAll('input,textarea,button').forEach(e=>e.disabled=false);updateForm('createForm');renderResult();try{await loadData();}catch(error){showError(error);}}}
function applyLanguage(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.title=t('app');document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('language').textContent=lang==='en'?'中文':'EN';const v=$('createForm').elements.length?formValues('createForm'):{};renderForm('createForm',v);renderFilters();renderData();renderResult();document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page));fitNav();}
async function initialize(){lang=getLanguage();applyLanguage();$('brand').onclick=run(()=>parent.closeFullHtml(false));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('hamburger').onclick=()=>{$('nav').classList.toggle('open');$('hamburger').setAttribute('aria-expanded',String($('nav').classList.contains('open')));};document.addEventListener('click',e=>{if(!$('nav').contains(e.target))closeMenu();});$('language').onclick=()=>{if(busy)return;lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang);}catch{}closeMenu();applyLanguage();};$('createForm').onsubmit=run(submitCreate);$('newDraft').onclick=run(()=>newDraft());$('newCard').onclick=run(()=>{newDraft();navigate('studio');});$('prev').onclick=run(()=>browseRow(currentRow-1));$('next').onclick=run(()=>browseRow(currentRow+1));$('more').onclick=()=>{limit+=12;renderCollection();};$('refresh').onclick=run(async()=>{$('refresh').disabled=true;try{await loadData();$('globalStatus').textContent='';}finally{$('refresh').disabled=false;}});window.addEventListener('resize',fitNav);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modals.length)closeModal();else closeMenu();}if(e.key==='Tab'&&modals.length){const dialog=modals.at(-1).overlay;const focusable=Array.from(dialog.querySelectorAll('button,a,input,textarea,select,iframe,[tabindex="0"]')).filter(x=>!x.disabled&&x.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||!focusable.includes(document.activeElement))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&(document.activeElement===last||!focusable.includes(document.activeElement))){e.preventDefault();first?.focus();}}});const reveal=()=>{const el=document.activeElement;if(el&&/INPUT|TEXTAREA|SELECT/.test(el.tagName))setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),200);};document.addEventListener('focusin',reveal);window.visualViewport?.addEventListener('resize',()=>{document.body.classList.toggle('keyboard',window.innerHeight-window.visualViewport.height>120);reveal();});const settled=await Promise.allSettled([callAppBridge({type:'模式'}).then(mode=>document.body.classList.toggle('dark',mode.trim()==='暗色')),loadData()]);for(const result of settled)if(result.status==='rejected')showError(result.reason);}
(async () => { await initialize(); })();
