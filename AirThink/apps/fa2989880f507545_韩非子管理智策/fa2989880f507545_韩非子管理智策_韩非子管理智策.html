<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      max-height: 70vh;

    `;
    
    // 将视频放入容器中

    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);

            // 使用TextDecoder将字节数组解码为UTF-8字符串

            return decoder.decode(bytes);
        }

function notifyError(error){const n=$('notice');n.textContent=t('failed')+': '+(error?.message||String(error));n.classList.remove('hidden');clearTimeout(notifyError.timer);notifyError.timer=setTimeout(()=>n.classList.add('hidden'),6500)}

function idNow(){const d=new Date();const p=n=>String(n).padStart(2,'0');return 'HF'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+String(Math.floor(Math.random()*10000)).padStart(4,'0')}
function langFromBrowser(){const q=new URLSearchParams(location.search).get('lang');const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved!==null&&saved!=='')return saved==='en'?'en':'cn';if(q==='en'||q==='cn')return q;const langs=navigator.languages;if(!langs||!langs.length)return 'cn';return langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}

function fieldMarkup(prefix){const isEdit=prefix==='editForm';const text=(name,key,required=false)=>`<div class="field ${name==='核心问题'?'full':''}"><label for="${prefix}_${key}">${t(key)}${required?' *':''}</label><textarea id="${prefix}_${key}" name="${name}" ${required?'required':''} placeholder="${esc(t(key))}"></textarea></div>`;return `<div class="field"><label for="${prefix}_scene">${t('scene')} *</label><select id="${prefix}_scene" name="应用场景" required><option value="">${t('selectScene')}</option>${SCENES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div><div class="field"><label for="${prefix}_urgency">${t('urgency')} *</label><select id="${prefix}_urgency" name="紧急程度" required><option value="">${t('selectUrgency')}</option>${URGENCIES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>${text('核心问题','problem',true)}${text('组织背景','context')}${text('期望目标','goal',true)}<div class="field full"><label>${t('dimensions')}</label><div class="chips" id="${prefix}_dimensions">${DIMS.map(s=>`<button type="button" class="chip" data-dim="${s}" aria-pressed="false">${s}</button>`).join('')}</div><input type="hidden" id="${prefix}_dimensionValue" name="重点维度"></div>${text('合规边界','boundary')}<div class="field full"><label>${t('file')}</label><div class="file-row"><button class="button small alt" type="button" data-pick="${prefix}"><i class="fa-solid fa-paperclip"></i>${t('pick')}</button><span class="file-name" id="${prefix}_fileName"></span><button class="text-link" type="button" data-clear="${prefix}">${t('clear')}</button></div><input type="hidden" id="${prefix}_file" name="资料文件"></div>${isEdit?`<div class="field full"><label>${t('advice')}</label><div id="${prefix}_advicePreview" class="status-line"></div></div>`:''}`}
function buildForms(){const createData=readForm('createForm');$('createFields').innerHTML=fieldMarkup('createForm');if(createData)fillForm('createForm',createData)}
function readForm(prefix){const form=$(prefix);if(!form)return null;const data={};for(const el of form.querySelectorAll('[name]'))data[el.name]=el.value;return data}
function fillForm(prefix,data){const form=$(prefix);if(!form)return;for(const el of form.querySelectorAll('[name]'))el.value=data[el.name]||'';const selected=String(data['重点维度']||'').split(/[,，、;；]/).map(x=>x.trim());form.querySelectorAll('[data-dim]').forEach(e=>{const on=selected.includes(e.dataset.dim);e.classList.toggle('selected',on);e.setAttribute('aria-pressed',String(on))});$(prefix+'_fileName').textContent=data['资料文件']||''}
function buildFilters(){const values={scenes:[...$('sceneFilter').selectedOptions].map(o=>o.value),urgent:$('urgencyFilter').value,dim:$('dimensionFilter').value,status:$('generatedFilter').value,sort:$('sortSelect').value};$('sceneFilter').innerHTML=SCENES.map(s=>`<option value="${s}">${s}</option>`).join('');$('urgencyFilter').innerHTML=`<option value="">${t('allUrgency')}</option>`+URGENCIES.map(s=>`<option value="${s}">${s}</option>`).join('');$('dimensionFilter').innerHTML=`<option value="">${t('allDimensions')}</option>`+DIMS.map(s=>`<option value="${s}">${s}</option>`).join('');$('generatedFilter').innerHTML=`<option value="">${t('allStatus')}</option><option value="yes">${t('hasAdvice')}</option><option value="no">${t('noAdvice')}</option>`;$('sortSelect').innerHTML=`<option value="latest">${t('latest')}</option><option value="urgency">${t('sortUrgency')}</option><option value="scene">${t('sortScene')}</option>`;for(const o of $('sceneFilter').options)o.selected=values.scenes.includes(o.value);$('urgencyFilter').value=values.urgent;$('dimensionFilter').value=values.dim;$('generatedFilter').value=values.status;$('sortSelect').value=values.sort||'latest'}
function showLoading(){if(state.page==='home')$('recentList').innerHTML=`<div class="loading"><i class="fa-solid fa-yin-yang"></i> ${t('loading')}</div>`;if(state.page==='archive')$('archiveCards').innerHTML=`<div class="loading"><i class="fa-solid fa-yin-yang"></i> ${t('loading')}</div>`}
async function refresh(){showLoading();const [csv,count]=await Promise.all([callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS.join(',')}),callAppBridge({type:'GetRecordCount',data:TABLE})]);state.records=parseCSV(String(csv||'')).filter(r=>r.length>1||r[0]).map((r,i)=>({row:i+1,...Object.fromEntries(FIELDS.map((f,j)=>[f,r[j]||'']))}));const n=Number(count);$('statTotal').textContent=Number.isFinite(n)?n:state.records.length;state.summaryCache=new Map();renderAll()}
function renderAll(){const rows=state.records;$('statUrgent').textContent=rows.filter(r=>['高','危急'].includes(r['紧急程度'])).length;$('statStrategy').textContent=rows.filter(r=>['制度建设','战略决策'].includes(r['应用场景'])).length;$('statDone').textContent=rows.filter(r=>r['智慧建议'].trim()).length;$('recentList').innerHTML=rows.length?rows.slice(0,5).map(r=>card(r,true)).join(''):`<div class="empty">${t('noRecords')}</div>`;renderArchive()}
function urgencyColor(u){return u==='危急'?'#b52c25':u==='高'?'#cf7131':u==='中'?'#b58a39':'#908b82'}
function truncate(s,n){return [...String(s||'')].slice(0,n).join('')+(String(s||'').length>n?'…':'')}
function fieldLabel(f){return t(({请求编号:'id',应用场景:'scene',核心问题:'problem',组织背景:'context',期望目标:'goal',重点维度:'dimensions',紧急程度:'urgency',合规边界:'boundary',资料文件:'file',智慧建议:'advice'})[f]||f)}
function summarySpan(row,field,length){return `<span data-summary="${row}" data-field="${esc(field)}" data-length="${length}">…</span>`}
async function hydrateSummaries(){const nodes=[...document.querySelectorAll('[data-summary]')];const groups=new Map();for(const node of nodes){const key=node.dataset.summary+'/'+node.dataset.field;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(node)}await Promise.all([...groups].map(async([key,elements])=>{try{let value=state.summaryCache?.get(key);if(value===undefined){const [row,...parts]=key.split('/');value=await callAppBridge({type:'GetCellValue',data:TABLE,payload:parts.join('/')+'/'+row});state.summaryCache?.set(key,value)}for(const el of elements)if(el.isConnected)el.textContent=truncate(value,Number(el.dataset.length))}catch(e){for(const el of elements)if(el.isConnected)el.textContent='—'}}))}
function card(r,recent=false){const done=!!r['智慧建议'].trim();return `<article class="record-card" data-row="${r.row}" style="--urgency:${urgencyColor(r['紧急程度'])}" tabindex="0"><div class="card-top"><span class="tag">${esc(r['应用场景'])}</span><span class="tag ${r['紧急程度']==='危急'?'red':''}">${esc(r['紧急程度'])}</span></div><h3>${summarySpan(r.row,'核心问题',recent?40:100)}</h3>${recent?`<p>${summarySpan(r.row,'期望目标',70)}</p>`:`<p><b>${t('context')}：</b>${summarySpan(r.row,'组织背景',85)}</p><p><b>${t('goal')}：</b>${summarySpan(r.row,'期望目标',85)}</p>`}<div class="tag-list">${String(r['重点维度']).split(/[,，、;；]/).filter(Boolean).map(s=>`<span class="tag muted">${esc(s.trim())}</span>`).join('')}</div><div class="card-top"><span class="tag ${done?'red':'muted'}"><i class="fa-solid ${done?'fa-stamp':'fa-hourglass-half'}"></i>&nbsp;${t(done?'ready':'pending')}</span>${r['资料文件']?'<i class="fa-solid fa-paperclip"></i>':''}</div>${!recent&&done?`<p class="preview">${summarySpan(r.row,'智慧建议',80)} <span style="color:var(--red)">${t('preview')}</span></p>`:''}${recent?'':`<div class="card-footer"><button class="button small alt" data-action="detail" data-row="${r.row}">${t('detail')}</button><button class="button small plain" data-action="edit" data-row="${r.row}">${t('edit')}</button><button class="button small plain" data-action="regenerate" data-row="${r.row}">${t('regenerate')}</button><button class="button small danger" data-action="delete" data-row="${r.row}">${t('delete')}</button></div>`}</article>`}
function filteredRows(){const q=$('searchInput').value.trim().toLocaleLowerCase(),scenes=[...$('sceneFilter').selectedOptions].map(o=>o.value),urg=$('urgencyFilter').value,dim=$('dimensionFilter').value,status=$('generatedFilter').value,sort=$('sortSelect').value;const list=state.records.filter(r=>(!q||['核心问题','组织背景','期望目标'].some(k=>r[k].toLocaleLowerCase().includes(q)))&&(!scenes.length||scenes.includes(r['应用场景']))&&(!urg||r['紧急程度']===urg)&&(!dim||r['重点维度'].includes(dim))&&(!status||(status==='yes'?!!r['智慧建议'].trim():!r['智慧建议'].trim())));if(sort==='urgency')list.sort((a,b)=>URGENCIES.indexOf(b['紧急程度'])-URGENCIES.indexOf(a['紧急程度'])||a.row-b.row);if(sort==='scene')list.sort((a,b)=>a['应用场景'].localeCompare(b['应用场景'],'zh')||a.row-b.row);return list}
function renderArchive(){const all=filteredRows(),shown=all.slice(0,state.shown);$('archiveCount').textContent=`${all.length} ${t('count')}`;$('archiveCards').innerHTML=shown.length?shown.map(r=>card(r)).join(''):`<div class="empty">${t('noRecords')}</div>`;$('archiveTable').innerHTML=shown.length?`<table><thead><tr>${['应用场景','核心问题','组织背景','期望目标','重点维度','紧急程度','合规边界','资料文件','智慧建议'].map(x=>`<th>${esc(fieldLabel(x))}</th>`).join('')}<th>${t('detail')}</th></tr></thead><tbody>${shown.map(r=>`<tr>${['应用场景','核心问题','组织背景','期望目标','重点维度','紧急程度','合规边界','资料文件','智慧建议'].map(f=>`<td>${esc(truncate(r[f],f==='智慧建议'?70:100))}</td>`).join('')}<td><div class="actions">${['detail','edit','regenerate','delete'].map(a=>`<button class="button small ${a==='delete'?'danger':'alt'}" data-action="${a}" data-row="${r.row}">${t(a)}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table>`:'';$('archiveMore').classList.toggle('hidden',all.length<=state.shown);$('archiveCards').classList.toggle('hidden',state.view==='table');$('archiveTable').classList.toggle('hidden',state.view!=='table');hydrateSummaries()}
function openModal(title,html,content=false){state.modal=title;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalShade').classList.remove('hidden');$('modalShade').classList.toggle('content-modal',content);document.body.style.overflow='hidden'}
function closeModal(){state.modal=null;$('modalShade').classList.add('hidden');$('modalBody').innerHTML='';document.body.style.overflow=''}
async function getRecordValues(row,fields){const obj={};for(const field of fields)obj[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row});return obj}
function markdown(text){if(!text)return '';if(!window.marked||!window.DOMPurify)return `<pre>${esc(text)}</pre>`;marked.setOptions({gfm:true,breaks:true});return DOMPurify.sanitize(marked.parse(text),{ADD_ATTR:['target']})}
function bindMarkdownImages(scope){scope.querySelectorAll('.markdown-body img').forEach(img=>{let src=img.getAttribute('src')||'';if(src&&!/^(https?:|data:)/i.test(src)){src=fileUrl(src);img.src=src}img.style.cursor='pointer';img.addEventListener('click',()=>{const a=document.createElement('a');a.href=src;a.download='';a.target='_blank';a.click()})})}
async function showDetail(row){state.currentRow=row;openModal(t('detail'),`<div class="loading"><i class="fa-solid fa-yin-yang"></i> ${t('loading')}</div>`,true);try{const data=await getRecordValues(row,FIELDS);if(state.currentRow!==row||!state.modal)return;const fields=FIELDS.filter(x=>x!=='智慧建议');$('modalBody').innerHTML=`<div class="detail-grid">${fields.map(f=>`<div class="detail-item ${['核心问题','组织背景','期望目标','合规边界'].includes(f)?'wide':''}"><b>${esc(fieldLabel(f))}</b>${f==='资料文件'&&data[f]?`<p><a href="${fileUrl(data[f],'private')}" target="_blank" rel="noopener">${t('open')}</a> · <a href="${fileUrl(data[f])}" download>${t('download')}</a></p>`:`<p>${esc(data[f])}</p>`}</div>`).join('')}</div><div class="section-head"><h2>${t('advice')}</h2><button class="button small alt" id="detailCopy">${t('copy')}</button></div><article class="markdown-body">${data['智慧建议']?markdown(data['智慧建议']):`<p>${t('pending')}</p>`}</article><div class="spacer"></div>`;$('detailCopy').onclick=()=>copyText(data['智慧建议']);bindMarkdownImages($('modalBody'))}catch(e){notifyError(e);closeModal()}}
async function showEdit(row){state.currentRow=row;openModal(t('edit'),`<div class="loading"><i class="fa-solid fa-yin-yang"></i> ${t('loading')}</div>`);try{const data=await getRecordValues(row,FIELDS);if(!state.modal||state.currentRow!==row)return;$('modalBody').innerHTML=`<form id="editForm"><input type="hidden" id="editForm_id" name="请求编号"><div class="form-grid">${fieldMarkup('editForm')}</div><div class="form-actions"><button type="button" class="button plain" id="editCancel">${t('cancel')}</button><button type="submit" class="button" id="editSave">${t('save')}</button></div></form>`;fillForm('editForm',data);$('editForm_advicePreview').textContent=truncate(data['智慧建议'],180)||t('pending');$('editCancel').onclick=closeModal;$('editForm').onsubmit=saveEdit}catch(e){notifyError(e);closeModal()}}
function validateForm(prefix){const form=$(prefix);let okay=true;for(const el of form.querySelectorAll('[required]')){const good=!!el.value.trim();el.closest('.field')?.classList.toggle('invalid',!good);if(!good)okay=false}if(!okay){message(t('required'));form.querySelector('.invalid input,.invalid select,.invalid textarea')?.focus()}return okay}
async function saveEdit(e){e.preventDefault();if(!validateForm('editForm'))return;const button=$('editSave'),row=state.currentRow,data=readForm('editForm');button.disabled=true;try{for(const f of EDIT_FIELDS){if(f==='请求编号')continue;await callAppBridge({type:'SetCellValue',data:TABLE,payload:f+'/'+row+'/'+(data[f]||'')})}message(t('saved'));closeModal();await refresh()}catch(err){notifyError(err)}finally{button.disabled=false}}

async function regenerate(row){if(state.polling||!confirm(t('confirmRegenerate')))return;try{const data=await getRecordValues(row,EDIT_FIELDS);data['请求编号']=idNow();data['智慧建议']='';await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(data)});state.currentRow=1;state.attachment=data['资料文件']||'';closeModal();navigate('create');showWaiting();pollAdvice(1)}catch(e){notifyError(e)}}
async function submitNew(e){e.preventDefault();if(state.polling||!validateForm('createForm'))return;const data=readForm('createForm');data['请求编号']=idNow();data['智慧建议']='';$('createForm_id').value=data['请求编号'];$('submitBtn').disabled=true;try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(data)});state.currentRow=1;state.attachment=data['资料文件']||'';message(t('submitted'));showWaiting();pollAdvice(1);await refresh()}catch(err){notifyError(err);$('submitBtn').disabled=false}}
function showWaiting(){state.polling=true;$('submitBtn').disabled=true;$('resultPanel').classList.remove('hidden');$('resultSeal').classList.add('hidden');$('resultActions').classList.add('hidden');$('resultMarkdown').innerHTML=`<div class="loading"><i class="fa-solid fa-yin-yang"></i></div>`;$('resultStatus').textContent=t('waiting');$('resultPanel').scrollIntoView({behavior:'smooth',block:'start'})}
async function pollAdvice(row){const token=++state.pollToken;const start=Date.now();let previous='',stable=0;while(token===state.pollToken&&Date.now()-start<1800000){await new Promise(resolve=>setTimeout(resolve,1000));try{const value=String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:'智慧建议/'+row})||'').trim();if(value){stable=value===previous?stable+1:0;previous=value;if(stable>=2){state.result=value;state.polling=false;$('submitBtn').disabled=false;$('resultStatus').textContent='';$('resultSeal').classList.remove('hidden');$('resultActions').classList.remove('hidden');$('resultMarkdown').innerHTML=markdown(value);bindMarkdownImages($('resultMarkdown'));$('resultAttachment').innerHTML=state.attachment?`<a href="${fileUrl(state.attachment)}" download><i class="fa-solid fa-paperclip"></i> ${t('download')}：${esc(state.attachment)}</a>`:'';await refresh();return}}}catch(e){notifyError(e);break}}if(token===state.pollToken){state.polling=false;$('submitBtn').disabled=false;$('resultStatus').textContent=t('pollTimeout');$('resultMarkdown').innerHTML=''}}
async function copyText(value){try{await navigator.clipboard.writeText(value||'');message(t('copied'))}catch(e){notifyError(e)}}
async function exportResult(){if(!state.result)return;const name='HanFeizi_'+idNow()+'.md';try{const returned=await callAppBridge({type:'WriteFile',data:name,payload:state.result});const file=/\.md$/i.test(String(returned||''))?String(returned).trim():name;$('exportLink').innerHTML=`<a href="${fileUrl(file)}" download>${t('download')}</a>`}catch(e){notifyError(e)}}
function resetNew(){state.pollToken++;state.polling=false;state.currentRow=0;state.result='';state.attachment='';$('createForm').reset();$('createForm_id').value='';$('createForm_fileName').textContent='';$('createForm_dimensionValue').value='';$('createForm').querySelectorAll('.chip').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});$('submitBtn').disabled=false;$('resultPanel').classList.add('hidden');$('exportLink').innerHTML='';scrollTo({top:0,behavior:'smooth'})}
function onClick(e){const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}const chip=e.target.closest('[data-dim]');if(chip){chip.classList.toggle('selected');chip.setAttribute('aria-pressed',String(chip.classList.contains('selected')));const form=chip.closest('form');$(form.id+'_dimensionValue').value=[...form.querySelectorAll('.chip.selected')].map(x=>x.dataset.dim).join(',');return}const pick=e.target.closest('[data-pick]');if(pick){callAppBridge({type:'SelectFile'}).then(v=>{if(v){$(pick.dataset.pick+'_file').value=v;$(pick.dataset.pick+'_fileName').textContent=v}}).catch(notifyError);return}const clear=e.target.closest('[data-clear]');if(clear){$(clear.dataset.clear+'_file').value='';$(clear.dataset.clear+'_fileName').textContent='';return}const act=e.target.closest('[data-action]');if(act){e.stopPropagation();const row=Number(act.dataset.row);({detail:showDetail,edit:showEdit,delete:deleteRecord,regenerate})[act.dataset.action]?.(row);return}const card=e.target.closest('.record-card[data-row]');if(card)showDetail(Number(card.dataset.row))}
async function initialize(){state.lang=langFromBrowser();try{state.theme=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(state.theme).includes('暗'))}catch(e){document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches)}setLanguage(state.lang);$('createForm').addEventListener('submit',submitNew);document.addEventListener('click',onClick);$('menuBtn').onclick=()=>toggleMenu();$('langBtn').onclick=()=>setLanguage(state.lang==='cn'?'en':'cn');$('mobileLangBtn').onclick=()=>{setLanguage(state.lang==='cn'?'en':'cn');toggleMenu(false)};$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){notifyError(e)}};document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))toggleMenu(false)});$('modalClose').onclick=closeModal;$('modalShade').onclick=e=>{if(e.target===$('modalShade'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else toggleMenu(false)}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.record-card')){e.preventDefault();showDetail(Number(e.target.dataset.row))}});$('copyResult').onclick=()=>copyText(state.result);$('exportResult').onclick=exportResult;$('againBtn').onclick=resetNew;$('moreBtn').onclick=()=>{state.shown+=12;renderArchive()};$('resetFilters').onclick=()=>{$('searchInput').value='';for(const o of $('sceneFilter').options)o.selected=false;for(const id of ['urgencyFilter','dimensionFilter','generatedFilter'])$(id).value='';state.shown=12;renderArchive()};for(const id of ['searchInput','sceneFilter','urgencyFilter','dimensionFilter','generatedFilter','sortSelect'])$(id).addEventListener(id==='searchInput'?'input':'change',()=>{state.shown=12;renderArchive()});$('cardViewBtn').onclick=()=>{state.view='cards';renderArchive()};$('tableViewBtn').onclick=()=>{state.view='table';renderArchive()};document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select')&&innerWidth<720)setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a?.matches?.('input,textarea,select'))setTimeout(()=>a.scrollIntoView({block:'center',behavior:'smooth'}),100)});try{await refresh()}catch(e){notifyError(e)}}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
</script>
</body>
