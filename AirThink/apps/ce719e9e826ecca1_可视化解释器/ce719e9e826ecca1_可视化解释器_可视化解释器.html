olumns:repeat(3,minmax(0,1fr));gap:18px}.record-card{min-width:0;display:flex;flex-direction:column;gap:15px;border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:21px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}.record-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 17px 40px #17396824}.record-card.clickable{cursor:pointer}.record-card p{margin:0;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{display:inline-block;border-radius:20px;padding:5px 9px;font-size:.73rem;font-weight:700;background:var(--soft);color:var(--primary)}.tag.alt{background:#e5f5f1;color:#117961}.tag.warm{background:#fff0e4;color:#a85a14}:root[data-mode="dark"] .tag.alt{background:#124239;color:#91dcc9}:root[data-mode="dark"] .tag.warm{background:#4a301f;color:#ffd0a4}.card-foot{margin-top:auto;display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.file-name{min-width:0;color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{border:1px dashed var(--line);border-radius:17px;padding:44px 22px;text-align:center;color:var(--muted);background:var(--panel)}.empty i{font-size:2rem;color:var(--primary);display:block;margin-bottom:13px}.error{color:var(--danger);font-size:.9rem;margin-top:12px;min-height:1.3em}.workspace{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:20px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);min-width:0}.form-panel{padding:25px}.panel h2{margin:0 0 20px;font-size:1.3rem}.field{display:block;margin-bottom:18px}.field span{display:block;font-weight:650;font-size:.9rem;margin-bottom:8px}.field textarea,.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:11px 12px;outline:none}.field textarea:focus,.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #3676ea24}.field textarea{min-height:140px;resize:vertical;line-height:1.6}.file-row{display:flex;gap:8px}.file-row input{min-width:0;flex:1}.file-row button{flex:none}.form-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.preview-panel{overflow:hidden}.preview-head{padding:20px 23px;border-bottom:1px solid var(--line);font-size:1.15rem;font-weight:700}.preview-body{min-height:580px;display:grid;place-items:center}.preview-placeholder{text-align:center;color:var(--muted);padding:35px}.preview-placeholder i{display:block;font-size:2.4rem;color:var(--primary);margin-bottom:15px}.preview-frame{width:100%;height:min(75vh,850px);min-height:580px;border:0;background:#fff}.status{font-size:.9rem;color:var(--muted)}.status.waiting{color:var(--primary)}.status.error{color:var(--danger)}.modal-backdrop{position:fixed;inset:0;z-index:2000;background:#07162ccf;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,28px)}.modal{width:min(1400px,100%);height:min(900px,100%);display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:17px;overflow:hidden;box-shadow:0 25px 75px #0007}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 19px;border-bottom:1px solid var(--line)}.modal-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal-actions{display:flex;gap:8px;align-items:center}.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:9px;background:var(--soft);color:var(--ink)}.modal iframe{width:100%;flex:1;border:0;background:#fff}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:3000;padding:12px 18px;border-radius:10px;background:var(--nav);color:#fff;box-shadow:var(--shadow);max-width:calc(100vw - 30px)}

<main><section class="page active" id="page-home"><div class="hero"><div class="eyebrow">VISUAL EXPLAINER</div><h1 data-i18n="appName">可视化解释器</h1><p data-i18n="heroText">将复杂的技术概念、代码变更或计划，一键转换为直观的浏览器可视化解释页面。</p><button class="btn large" id="newFromHome" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="newPage">新建解释页面</span></button></div><div class="stat"><i class="fa-solid fa-chart-simple"></i><div><strong id="totalCount">—</strong><span data-i18n="totalCount">总生成次数</span></div></div><div class="section-head"><h2 data-i18n="recent">最近生成记录</h2></div><div class="grid" id="recentGrid"></div><div class="error" id="homeError" role="status"></div></section>
<section class="page" id="page-workspace"><div class="page-heading"><div><h1 data-i18n="generateTitle">生成可视化解释</h1><p data-i18n="generateHelp">提供背景信息，选择呈现形式，然后生成可交互的解释页面。</p></div></div><div class="workspace"><div class="panel form-panel"><h2 data-i18n="requestForm">可视化解释请求</h2><form id="requestForm"><label class="field"><span data-i18n="content">解释内容</span><textarea id="requestForm_content" name="解释内容" required data-i18n-placeholder="contentPlaceholder" placeholder="描述需要解释的系统、变更、计划或数据"></textarea></label><label class="field"><span data-i18n="sourceFile">资料文件</span><div class="file-row"><input id="requestForm_sourceFile" name="资料文件" type="text" data-i18n-placeholder="sourcePlaceholder" placeholder="可选：选择资料文件"><button class="btn ghost small" id="selectFileButton" type="button"><i class="fa-solid fa-paperclip"></i><span data-i18n="selectFile">选择文件</span></button></div></label><label class="field"><span data-i18n="visualType">可视化类型</span><select id="requestForm_visualType" name="可视化类型"><option value="架构概览">架构概览</option><option value="流程图">流程图</option><option value="数据表">数据表</option><option value="实施计划">实施计划</option><option value="差异评审">差异评审</option><option value="计划评审">计划评审</option><option value="项目回顾">项目回顾</option><option value="幻灯片">幻灯片</option></select></label><label class="field"><span data-i18n="outputType">输出形式</span><select id="requestForm_outputType" name="输出形式"><option value="HTML页面">HTML页面</option><option value="幻灯片">幻灯片</option></select></label><label class="field"><span data-i18n="style">视觉风格</span><select id="requestForm_style" name="视觉风格"><option value="自动选择">自动选择</option><option value="蓝图">蓝图</option><option value="编辑排版">编辑排版</option><option value="纸张墨水">纸张墨水</option><option value="终端风格">终端风格</option><option value="数据密集">数据密集</option></select></label><div class="form-actions"><button class="btn" id="submitButton" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="startGenerate">开始生成</span></button><span class="status" id="formStatus" role="status"></span></div></form></div><div class="panel preview-panel"><div class="preview-head" data-i18n="livePreview">实时预览</div><div class="preview-body" id="previewBody"><div class="preview-placeholder"><i class="fa-solid fa-window-maximize"></i><span data-i18n="previewEmpty">在左侧完成配置并生成</span></div></div></div></div></section>
<section class="page" id="page-history"><div class="page-heading"><div><h1 data-i18n="historyTitle">历史解释记录</h1><p data-i18n="historyHelp">管理和回顾生成的所有可视化页面</p></div><button class="btn" id="newFromHistory" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="goGenerate">去生成</span></button></div><div class="grid" id="historyGrid"></div><div class="error" id="historyError" role="status"></div></section></main>
<div class="modal-backdrop hidden" id="viewerBackdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="viewerTitle"><div class="modal-head"><strong id="viewerTitle"></strong><div class="modal-actions"><a class="btn ghost small" id="viewerOpenLink" target="_blank" rel="noopener" data-i18n="openBrowser">在浏览器打开</a><button class="icon-btn" id="viewerClose" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div></div><iframe id="viewerFrame" title="Preview"></iframe></div></div><div class="toast hidden" id="toast" role="status"></div>
<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("ce719e9e826ecca1_可视化解释器")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{

              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();

      } catch (err) {

    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {

    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;

      left: 0;

      height: 100%;
      background: rgba(0, 0, 0, 0.9);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const $=id=>document.getElementById(id);
function t(key){return i18n[lang][key]||key}
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function truncate(value,n){const s=String(value||'').trim();return s.length>n?s.slice(0,n)+'…':s}
function fileURL(file){return 'http://' + window.location.hostname + ':3130/private/'+encodeURIComponent(String(file).trim())}
function fileName(file){return String(file||'').split(/[\\/]/).pop()}
function showToast(message){const box=$('toast');box.textContent=message;box.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.add('hidden'),3500)}
function determineLanguage(){const params=new URLSearchParams(location.search);const query=params.get('lang');let languages;try{languages=navigator.languages}catch(e){};let result=!languages||!languages.length?'cn':languages.some(v=>/^zh(?:-|$)/i.test(v))?'cn':'en';if(query==='cn'||query==='en')result=query;try{const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)result=saved==='en'?'en':'cn'}catch(e){}return result}
function applyLanguage(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});for(const select of document.querySelectorAll('select'))for(const option of select.options)option.textContent=optionLabels[lang][option.value]||option.value;$('langSwitch').textContent=lang==='cn'?'English':'中文';$('mobileLanguage').textContent=lang==='cn'?'English':'中文';document.title=t('appName');renderRecords();if(!busy&&!$('previewBody').querySelector('iframe'))renderEmptyPreview()}
function toggleLanguage(){lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch(e){}applyLanguage()}
function showMenu(open){$('mobileMenu').classList.toggle('open',open);$('menuScrim').classList.toggle('hidden',!open);$('menuToggle').setAttribute('aria-expanded',String(open))}
function fitNav(){const row=document.querySelector('.navrow');const brand=$('brandButton');const links=$('navLinks');links.classList.remove('hidden');const mobile=window.innerWidth<600||brand.scrollWidth+links.scrollWidth+70>row.clientWidth;links.classList.toggle('hidden',mobile);$('menuToggle').style.display=mobile?'block':'none';if(!mobile)showMenu(false)}
function navigate(page,save=true){if(!['home','workspace','history'].includes(page))return;if(page!==currentPage&&save)historyStack.push({page:currentPage,scroll:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));showMenu(false);window.scrollTo(0,0);if(page==='history'||page==='home')refreshData()}
function renderEmptyPreview(){const body=$('previewBody');body.replaceChildren();const box=document.createElement('div');box.className='preview-placeholder';box.innerHTML='<i class="fa-solid fa-window-maximize"></i><span>'+escapeHTML(t('previewEmpty'))+'</span>';body.append(box)}
function setPreviewMessage(message){const body=$('previewBody');body.replaceChildren();const box=document.createElement('div');box.className='preview-placeholder';box.innerHTML='<i class="fa-solid fa-rotate fa-spin"></i><span>'+escapeHTML(message)+'</span>';body.append(box)}
function setPreviewFile(file){const body=$('previewBody');body.replaceChildren();const iframe=document.createElement('iframe');iframe.className='preview-frame';iframe.title=t('livePreview');iframe.src=fileURL(file);body.append(iframe)}
function parseRows(csv,withFile){return parseCSV(String(csv||'')).filter(row=>row.some(cell=>cell!=='' )).map((row,index)=>({row:index+1,content:row[0]||'',file:withFile?(row[1]||''):'',type:row[withFile?2:1]||'',output:row[withFile?3:2]||'',style:row[withFile?4:3]||''}))}
function tag(text,kind=''){return text?'<span class="tag '+kind+'">'+escapeHTML(optionLabels[lang][text]||text)+'</span>':''}
function card(record,recent){const card=document.createElement('article');card.className='record-card'+(recent?' clickable':'');card.innerHTML='<div class="tags">'+tag(record.type)+tag(record.style,'alt')+(recent?'':tag(record.output,'warm'))+'</div><p>'+escapeHTML(truncate(record.content,60))+'</p>'+(recent?'':'<div class="file-name" title="'+escapeHTML(record.file)+'">'+(record.file?'<i class="fa-solid fa-paperclip"></i> '+escapeHTML(fileName(record.file)):'')+'</div><div class="card-foot"><button class="btn small view-action" type="button"><i class="fa-solid fa-eye"></i> '+escapeHTML(t('viewPage'))+'</button><button class="btn danger small delete-action" type="button"><i class="fa-solid fa-trash"></i> '+escapeHTML(t('delete'))+'</button></div>');if(recent){card.tabIndex=0;card.setAttribute('role','button');card.addEventListener('click',()=>openViewer(record));card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openViewer(record)}})}else{card.querySelector('.view-action').addEventListener('click',()=>openViewer(record));card.querySelector('.delete-action').addEventListener('click',()=>deleteRecord(record))}return card}
function fillGrid(grid,items,recent){grid.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<i class="fa-regular fa-folder-open"></i>'+escapeHTML(t('noRecords'));grid.append(empty);return}for(const item of items)grid.append(card(item,recent))}
function renderRecords(){fillGrid($('recentGrid'),recentRecords.slice(0,5),true);fillGrid($('historyGrid'),records,false)}
async function refreshData(){const [countResult,recentResult,historyResult]=await Promise.allSettled([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'解释内容,可视化类型,输出形式,视觉风格'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'解释内容,资料文件,可视化类型,输出形式,视觉风格'})]);if(countResult.status==='fulfilled'){$('totalCount').textContent=String(countResult.value||'0');$('homeError').textContent=''}else{$('totalCount').textContent='—';$('homeError').textContent=t('requestFailed')+': '+String(countResult.reason)}if(recentResult.status==='fulfilled'){recentRecords=parseRows(recentResult.value,false);$('homeError').textContent=''}else{$('homeError').textContent=t('requestFailed')+': '+String(recentResult.reason)}if(historyResult.status==='fulfilled'){records=parseRows(historyResult.value,true);$('historyError').textContent=''}else{$('historyError').textContent=t('requestFailed')+': '+String(historyResult.reason)}renderRecords()}
async function openViewer(record){try{const file=String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:'可视化解释文件/'+record.row})||'').trim();if(!file){showToast(t('noFile'));return}const backdrop=$('viewerBackdrop');$('viewerTitle').textContent=truncate(record.content,80)||t('viewPage');$('viewerFrame').src=fileURL(file);$('viewerOpenLink').href=fileURL(file);backdrop.classList.remove('hidden');document.body.style.overflow='hidden'}catch(error){showToast(t('requestFailed')+': '+String(error))}}
function closeViewer(){$('viewerBackdrop').classList.add('hidden');$('viewerFrame').removeAttribute('src');document.body.style.overflow=''}
async function deleteRecord(record){if(!window.confirm(t('deleteConfirm')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:record.row.toString()});showToast(t('deleted'));await refreshData()}catch(error){showToast(t('requestFailed')+': '+String(error))}}
function setBusy(state){busy=state;$('submitButton').disabled=state;$('selectFileButton').disabled=state;$('requestForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=state)}
async function pollForFile(token){const deadline=Date.now()+1800000;while(Date.now()<deadline&&token===pollToken){await new Promise(resolve=>setTimeout(resolve,1000));if(token!==pollToken)return;try{const file=String(await callAppBridge({type:'轮询',data:FORM_TABLE,payload:'可视化解释文件'})||'').trim();if(file){setPreviewFile(file);$('formStatus').textContent='';setBusy(false);await refreshData();return}}catch(error){$('formStatus').textContent=t('requestFailed')+': '+String(error)}}if(token===pollToken){$('formStatus').textContent=t('timeout');setBusy(false)}}
async function submitRequest(event){event.preventDefault();if(busy)return;const form=$('requestForm');if(!form.reportValidity())return;const payload={};for(const [key,value] of new FormData(form).entries())payload[key]=String(value);setBusy(true);$('formStatus').textContent=t('generating');setPreviewMessage(t('generating'));try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(payload)});const currentRow=1;void currentRow;await refreshData();pollForFile(++pollToken)}catch(error){setBusy(false);$('formStatus').textContent=t('submitFailed')+': '+String(error);renderEmptyPreview()}}
function airBack(){if(!$('viewerBackdrop').classList.contains('hidden')){closeViewer();return 'false'}if($('mobileMenu').classList.contains('open')){showMenu(false);return 'false'}if(historyStack.length){const previous=historyStack.pop();navigate(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false'}return 'true'}
function attachKeyboardVisibility(){document.addEventListener('focusin',event=>{if(!event.target.matches('input,textarea,select'))return;const field=event.target;setTimeout(()=>field.scrollIntoView({block:'center',behavior:'smooth'}),300)});if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{const focused=document.activeElement;if(focused&&focused.matches('input,textarea,select'))setTimeout(()=>focused.scrollIntoView({block:'center',behavior:'smooth'}),100)})}}
async function initialize(){lang=determineLanguage();applyLanguage();$('brandButton').addEventListener('click',()=>{try{parent.closeFullHtml(false)}catch(error){showToast(String(error))}});document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.page)));$('newFromHome').addEventListener('click',()=>navigate('workspace'));$('newFromHistory').addEventListener('click',()=>navigate('workspace'));$('langSwitch').addEventListener('click',toggleLanguage);$('mobileLanguage').addEventListener('click',()=>{toggleLanguage();showMenu(false)});$('menuToggle').addEventListener('click',()=>showMenu(!$('mobileMenu').classList.contains('open')));$('menuScrim').addEventListener('click',()=>showMenu(false));$('viewerClose').addEventListener('click',closeViewer);$('viewerBackdrop').addEventListener('click',event=>{if(event.target===$('viewerBackdrop'))closeViewer()});document.addEventListener('keydown',event=>{if(event.key==='Escape')airBack()});$('selectFileButton').addEventListener('click',async()=>{try{const file=await callAppBridge({type:'SelectFile'});if(file)$('requestForm_sourceFile').value=String(file)}catch(error){showToast(t('fileError')+': '+String(error))}});$('requestForm').addEventListener('submit',submitRequest);attachKeyboardVisibility();fitNav();if(window.ResizeObserver)new ResizeObserver(fitNav).observe(document.querySelector('.navrow'));window.addEventListener('resize',fitNav);try{const mode=String(await callAppBridge({type:'模式'})||'').trim();document.documentElement.dataset.mode=mode==='暗色'?'dark':'light'}catch(error){document.documentElement.dataset.mode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}await refreshData()}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
</script>
</body>
</html>
