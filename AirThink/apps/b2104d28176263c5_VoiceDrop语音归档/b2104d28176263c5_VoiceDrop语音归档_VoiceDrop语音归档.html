<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script><script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("b2104d28176263c5_VoiceDrop语音归档")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

function PauseRecordVoiceA() {

}

/**

 */
function ContinueRecordVoiceA() {

    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

async function audioSource(file){if(!file)return '';const b64=await bridge({type:'FileToBase64',data:file});if(!b64)return '';let raw=String(b64).includes(',')?String(b64).split(',')[1]:String(b64);const binary=atob(raw),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));mediaUrls.push(url);return url}
async function mountAudio(container,file,auto=false){if(!file||!container)return;try{const src=await audioSource(file);if(!container.isConnected)return;const a=document.createElement('audio');a.controls=true;a.className='itemAudio';a.src=src;container.appendChild(a);if(auto)a.play().catch(()=>{})}catch(e){container.textContent=String(e)}}

function fieldHtml(formId,field,value,kind){const id=formId+'_'+field,name=' name="'+attr(field)+'"',val=attr(value||''),hidden=['记录时间','创建时间','整理结果'].includes(field);if(field==='整理结果')return '';if(hidden)return '<div class="field hidden"><input id="'+id+'"'+name+' value="'+val+'"></div>';let control='';if(field==='录音文件'){control='<input id="'+id+'"'+name+' readonly value="'+val+'"><div class="actions"><button type="button" class="btn small secondary" id="'+formId+'_chooseFile">'+t('selectAudio')+'</button><button type="button" class="btn small ghost" id="'+formId+'_recordFile"><i class="fa-solid fa-microphone"></i></button><button type="button" class="btn small ghost" id="'+formId+'_finishFile" hidden>'+t('recording')+'</button></div><div id="'+formId+'_audio"></div>'}else if(field==='记录类型'||field==='归档状态'||field==='优先级'||field==='是否重点'||field==='是否完成'){const opts=field==='记录类型'?types:field==='归档状态'?['待整理','已归档','已完成']:field==='优先级'?['高','中','低']:['是','否'];control='<select id="'+id+'"'+name+'>'+opts.map(o=>'<option value="'+attr(o)+'" '+(value===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'}else if(field==='标签'){control='<div class="chips">'+tags.map((o,i)=>'<label class="chip"><input type="checkbox" name="'+attr(field)+'" value="'+attr(o)+'" '+(String(value||'').split(/[,，;；]/).includes(o)?'checked':'')+'> '+esc(o)+'</label>').join('')+'</div>'}else if(field==='笔记标题'&&kind==='task'){const options=window.noteTitleOptions||[];control='<input id="'+id+'"'+name+' list="'+formId+'_noteOptions" value="'+val+'"><datalist id="'+formId+'_noteOptions">'+options.map(x=>'<option value="'+attr(x['笔记标题'])+'"></option>').join('')+'</datalist>'}else if(field==='任务说明'){control='<textarea id="'+id+'"'+name+'>'+esc(value)+'</textarea>'}else{const type=field==='截止日期'?'date':'text';control='<input type="'+type+'" id="'+id+'"'+name+' value="'+val+'" '+(field==='笔记标题'&&kind==='note'?'placeholder="可留空，让 AI 为你命名"':'')+'>'}return '<div class="field '+(['任务说明','标签','录音文件'].i async function openForm(kind,row=0,prefill={}){const isNote=kind==='note',fields=isNote?NOTE_FIELDS:TASK_FIELDS,table=isNote?NOTE_TABLE:TASK_TABLE,formId=isNote?'noteForm':'taskForm';modalKind=kind;modalRow=row;modalTable=table;const values={};if(row){for(const f of fields)values[f]=await cell(table,f,row)}else{Object.assign(values,prefill);values[isNote?'记录时间':'创建时间']=localDate();values[isNote?'是否重点':'是否完成']='否';if(isNote)values['归档状态']='待整理'}const html='<form id="'+formId+'"><div class="formGrid">'+fields.map(f=>fieldHtml(formId,f,values[f],kind)).join('')+'</div><div class="actions" style="margin-top:25px"><button class="btn secondary" type="button" data-close>'+t('cancel')+'</button><button class="btn" type="submit">'+t('save')+'</button></div></form>';openModal(isNote?t('notes'):t('tasks'),html);modalKind=kind;modalRow=row;modalTable=table;const form=$(formId);form.addEventListener('submit',async e=>{e.preventDefault();const save=form.querySelector('[type=submit]');save.disabled=true;try{const payload={};for(const f of fields){if(f==='整理结果')continue;if(f==='标签')payload[f]=[...form.querySelectorAll('[name="标签"]:checked')].map(x=>x.value).join(',');else payload[f]=form.elements[f]?.value||''}if(isNote&&!payload['录音文件'])throw Error('请先录入语音');if(row){for(const f of fields){if(f==='整理结果')continue;await setCell(table,f,row,payload[f])}currentRow=row}else{await bridge({type:'SubmitRecord',data:isNote?'语音笔记':'待办事项',payload:JSON.stringify(payload)});currentRow=1}closeModal();if(isNote){await refreshNotes();await refreshHome();if(!row)startPoll(1)}else await refreshTasks()}catch(err){showToast(String(err))}finally{save.disabled=false}});if(isNote){$('noteForm_chooseFile').onclick=async()=>{try{const file=await bridge({type:'SelectFile'});if(file){$('noteForm_录音文件').value=file;const slot=$('noteForm_audio');slot.innerHTML='';await mountAudio(slot,file)}}catch(e){}};$('noteForm_recordFile').onclick=async()=>{try{await bridge({type:'StartRecordVoice'});$('noteForm_recordFile').hidden=true;$('noteForm_finishFile').hidden=false}catch(e){}};$('noteForm_finishFile').onclick=async()=>{try{const file=await bridge({type:'FinishRecordVoice'});$('noteForm_录音文件').value=file;$('noteForm_finishFile').hidden=true;$('noteForm_recordFile').hidden=false;const slot=$('noteForm_audio');slot.innerHTML='';await mountAudio(slot,file)}catch(e){}};if(values['录音文件'])mountAudio($('noteForm_audio'),values['录音文件'])}}
function updateRecorder(){$('recordStatus').textContent=t(recordState==='recording'?'recording':recordFile?'recordDone':'recordReady');$('recordOrb').classList.toggle('recording',recordState==='recording');$('recordOrb').innerHTML='<i class="fa-solid fa-'+(recordState==='recording'?'stop':'microphone')+'"></i>';$('recordOrb').title=recordState==='recording'?t('recording'):t('capture');$('selectAudio').hidden=recordState==='recording';$('cancelAudio').hidden=recordState==='idle'&&!recordFile;$('openArchive').disabled=!recordFile||polling}

async function relatedNote(taskRow){const task=tasks.find(x=>x._row===taskRow);if(!task?.['笔记标题'])return;const rowText=await bridge({type:'GetRecordRow',data:NOTE_TABLE,payload:'笔记标题/'+task['笔记标题']});const row=Number(rowText);if(row>0)await detailNote(row);else showToast(lang==='cn'?'关联笔记未找到':'Related note not found')}
function bindEvents(){document.addEventListener('click',async e=>{const btn=e.target.closest('button,[data-row]');if(!btn)return;try{if(btn.id==='brand'){stopAudio();if(window.parent?.closeFullHtml)window.parent.closeFullHtml(false);return}if(btn.id==='menuBtn'){$('mobileMenu').classList.toggle('open');return}if(btn.id==='langDesktop'||btn.id==='langMobile'){chooseLang(lang==='cn'?'en':'cn');$('mobileMenu').classList.remove('open');return}if(btn.dataset.go){go(btn.dataset.go);return}if(btn.dataset.prefill){prefillType=btn.dataset.prefill;go('capture');return}if(btn.dataset.segment){taskSegment=btn.dataset.segment;fillFilters();renderTaskCards();return}if(btn.dataset.close!==undefined||btn.id==='modalClose'){closeModal();return}if(btn.id==='recordOrb'){await toggleRecording();return}if(btn.id==='selectAudio'){const file=await bridge({type:'SelectFile'});if(file){recordFile=file;recordState='done';updateRecorder();$('captureAudio').innerHTML='';await mountAudio($('captureAudio'),file)}return}if(btn.id==='cancelAudio'){await resetRecorder();return}if(btn.id==='openArchive'){if(recordFile)await openForm('note',0,{'录音文件':recordFile,'记录类型':prefillType||'灵感'});return}if(btn.id==='addTask'){await openForm('task');return}if(btn.id==='againBtn'){await resetRecorder();return}if(btn.dataset.confirmArchive){await setCell(NOTE_TABLE,'归档状态',Number(btn.dataset.confirmArchive),'已归档');showToast(t('archived'));await refreshNotes();await refreshHome();return}if(btn.dataset.markImportant){await setCell(NOTE_TABLE,'是否重点',Number(btn.dataset.markImportant),'是');showToast(t('important'));await refreshNotes();await refreshHome();return}if(btn.dataset.noteDetail){await detailNote(Number(btn.dataset.noteDetail));return}if(btn.dataset.noteEdit){await openForm('note',Number(btn.dataset.noteEdit));return}if(btn.dataset.noteDelete){await removeRecord(NOTE_TABLE,Number(btn.dataset.noteDelete));return}if(btn.dataset.noteTask){const row=Number(btn.dataset.noteTask);let title=notes.find(x=>x._row===row)?.['笔记标题'];if(title===undefined)title=await cell(NOTE_TABLE,'笔记标题',row);go('tasks');await openForm('task',0,{'笔记标题':title||''});return}if(btn.dataset.taskEdit){await openForm('task',Number(btn.dataset.taskEdit));return}if(btn.dataset.taskDelete){await removeRecord(TASK_TABLE,Number(btn.dataset.taskDelete));return}if(btn.dataset.related){await relatedNote(Number(btn.dataset.related));return}if(btn.dataset.row){await detailNote(Number(btn.dataset.row));return}}catch(err){showToast(String(err))}});$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});document.addEventListener('click',e=>{if(!$('nav').contains(e.target))$('mobileMenu').classList.remove('open')});document.addEventListener('change',async e=>{if(e.target.dataset.taskToggle){try{await setCell(TASK_TABLE,'是否完成',Number(e.target.dataset.taskToggle),e.target.checked?'是':'否');await refreshTasks()}catch(err){showToast(String(err))}}});['noteSearch','noteType','noteStatus','noteStar','noteTag'].forEach(id=>$(id).addEventListener('input',renderNoteCards));['taskSearch','taskPriority','taskDone'].forEach(id=>$(id).addEventListener('input',renderTaskCards));document.addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),320)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const focused=document.activeElement;if(focused?.matches('input,select,textarea'))setTimeout(()=>focused.scrollIntoView({block:'center',behavior:'smooth'}),120)});window.addEventListener('pagehide',stopAudio);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio()})}
async function initialize(){const stored=localStorage.getItem('iThinkAir_UiLanguage'),param=new URLSearchParams(location.search).get('lang');const langs=navigator.languages;lang=stored?(stored==='en'?'en':'cn'):param==='en'?'en':param==='cn'?'cn':!langs||!langs.length?'cn':langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';try{const mode=await bridge({type:'模式'});if(String(mode).trim()==='暗色')document.body.classList.add('dark')}catch(e){}bindEvents();chooseLang(lang);updateRecorder();await Promise.allSettled([refreshHome(),refreshTasks()])}
document.addEventListener('click',e=>{if(e.target.closest('audio,a,input,select,textarea'))e.stopPropagation()},true);
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
