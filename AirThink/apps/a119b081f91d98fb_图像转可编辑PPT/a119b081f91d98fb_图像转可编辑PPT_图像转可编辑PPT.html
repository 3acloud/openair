<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("a119b081f91d98fb_图像转可编辑PPT")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {

      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {

                        i++;

                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;

                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);

                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function link(file,open=false){return 'https://www.ithinkair.com:3031/'+(open?'private/':'download/')+encodeURIComponent(file)}
function fileName(file){return String(file||'').split(/[\\/]/).pop()||'—'}
function kind(file){return /\.(png|jpe?g|webp|gif|bmp|svg|heic|tiff?)(?:$|\?)/i.test(file)?'image':/\.pdf$/i.test(file)?'PDF':/\.pptx?$/i.test(file)?'PPT':'unknown'}
function thumb(file){const k=kind(file);return '<div class="thumb">'+(k==='image'?'<img loading="lazy" src="'+esc(link(file))+'" alt="'+esc(fileName(file))+'">':'<i aria-hidden="true" class="fa-solid '+(k==='PDF'?'fa-file-pdf':k==='PPT'?'fa-file-powerpoint':'fa-file')+'"></i>')+'</div>'}
function extractFile(value){const s=String(value||'').trim();if(!s)return '';try{const j=JSON.parse(s);if(typeof j==='string')return extractFile(j);if(j&&typeof j==='object'){for(const v of Object.values(j)){const f=extractFile(typeof v==='object'?JSON.stringify(v):v);if(f)return f}return ''}}catch{}const u=s.match(/https?:\/\/[^\s<>"\]]+?\.pptx(?:\?[^\s<>"\]]*)?/i);if(u){try{const p=new URL(u[0]).pathname;return decodeURIComponent(p.substring(p.lastIndexOf('/')+1))}catch{}}if(/^[^<>\r\n]+\.pptx$/i.test(s)&&!s.includes(']('))return s;const m=s.match(/\]\((?:<)?([^)\r\n]+?\.pptx)(?:>)?\)/i);if(m)return m[1];const f=s.match(/(?:^|[\s"'`])([^\s<>"`]+\.(?:pptx))(?=$|[\s"'`])/i);return f?f[1]:''}
function markdown(value){if(!value)return '<p class="muted">'+t('waiting')+'</p>';if(!window.marked||!window.DOMPurify)return '<p class="muted">'+t('markdownFail')+'</p><pre>'+esc(value)+'</pre>';let text=String(value);try{const obj=JSON.parse(text);if(obj&&typeof obj==='object')text=Object.entries(obj).map(([k,v])=>'### '+k+'\n\n'+(typeof v==='object'?JSON.stringify(v,null,2):String(v))).join('\n\n')}catch{}const box=document.createElement('div');box.innerHTML=DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:true}));box.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(src&&!/^(https?:|data:)/i.test(src))img.src=link(src);const a=document.createElement('a');let f=src;try{if(/^https?:/i.test(src))f=decodeURIComponent(new URL(src).pathname.split('/').pop())}catch{}a.href=link(f);a.target='_blank';a.rel='noopener noreferrer';img.replaceWith(a);a.append(img)});box.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});return box.innerHTML}
function fileActions(value){const f=extractFile(value);return f?'<div class="actions"><a class="file-link" href="'+esc(link(f))+'" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-download"></i> '+t('download')+'</a><a class="file-link" href="'+esc(link(f,true))+'" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> '+t('open')+'</a></div>':value?'<p class="muted">'+t('noFile')+'</p>':''}
function closeMenu(){$('navTabs').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}
function fitNav(){const nav=$('navigation');nav.classList.remove('mobile');if(nav.scrollWidth>nav.clientWidth||innerWidth<720)nav.classList.add('mobile')}
function showPage(next,remember=true){closeMenu();if(next!==page){if(remember)historyStack.push({page,y:scrollY});page=next;window.scrollTo(0,0)}for(const p of ['home','convert','records'])$('page-'+p).hidden=p!==page;document.querySelectorAll('#navTabs [data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')})}
function applyLanguage(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('brand')+' · '+t('brandSub');document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('languageButton').textContent=lang==='cn'?'English':'中文';renderSource();renderResult();renderLists();if(modalKind&&modalRecord)renderModal();requestAnimationFrame(fitNav)}
function renderSource(){$('convertForm-source').value=source;$('sourcePreview').innerHTML=source?thumb(source)+'<h3 class="filename">'+esc(fileName(source))+'</h3><span class="badge">'+t('ready')+'</span>':'<i class="fa-solid fa-cloud-arrow-up"></i><h3>'+t('drop')+'</h3><p>'+t('dropSub')+'</p>';updateControls()}
function updateControls(){$('submitButton').disabled=!source||busy||mutating;for(const id of ['chooseFile','chooseImage','clearSource','newConvert','recordsNew'])$(id).disabled=busy||mutating;$('previousRow').disabled=busy||mutating||currentRow<=1;$('nextRow').disabled=busy||mutating||currentRow===0||currentRow>=count;$('rowIndicator').textContent=currentRow+' / '+count}
function renderResult(){updateControls();$('resultBody').innerHTML=(resultSource?'<div class="result-source">'+thumb(resultSource)+'<div><small class="muted">'+t('source')+'</small><div class="filename">'+esc(fileName(resultSource))+'</div></div></div>':'')+(resultValue?'<div class="markdown">'+markdown(resultValue)+'</div>'+fileActions(resultValue):'<div class="wait">'+(busy?'<i class="fa-solid fa-circle-notch fa-spin"></i>':'<i class="fa-regular fa-file-powerpoint"></i>')+'<p>'+t(busy?'wait':timedOut?'timeout':currentRow?'waiting':'idle')+'</p></div>')}
function card(record,recent=false){const f=extractFile(record.result);return '<article class="card record" tabindex="0" data-row="'+record.row+'" aria-label="'+esc(fileName(record.source))+'">'+thumb(record.source)+'<span class="badge">'+esc(kind(record.source)==='image'?t('image'):kind(record.source)==='unknown'?t('unknown'):kind(record.source))+'</span><span class="status">'+t(record.result.trim()?'downloadable':'waiting')+'</span><h3 class="filename">'+esc(fileName(record.source))+'</h3><small class="muted">'+t('source')+'</small>'+(!recent?'<div class="summary" data-summary="'+record.row+'">'+t('output')+' · '+t('loading')+'</div>':'')+'<div class="actions"><button data-action="details">'+t('details')+'</button><button data-action="download" '+(!f?'disabled':'')+'>'+t('download')+'</button>'+(!recent?'<button data-action="open" '+(!f?'disabled':'')+'>'+t('open')+'</button><button data-action="edit">'+t('edit')+'</button><button data-action="again">'+t('again')+'</button><button data-action="delete">'+t('delete')+'</button>':'')+'</div></article>'}
function renderLists(){const q=$('recordSearch').value.trim().toLowerCase(),filter=$('recordFilter').value;const filtered=rows.filter(r=>r.source.toLowerCase().includes(q)&&(filter==='all'||(filter==='ready'?!!r.result.trim():!r.result.trim())));$('recentList').innerHTML=rows.length?rows.slice(0,5).map(r=>card(r,true)).join(''):'<div class="empty">'+t('empty')+'</div>';$('recordList').innerHTML=filtered.length?filtered.slice(0,limit).map(r=>card(r)).join(''):'<div class="empty">'+t(rows.length?'noMatch':'empty')+'</div>';$('moreButton').hidden=filtered.length<=limit;const version=++summaryVersion;void summaries(filtered.slice(0,limit),version)}
async function summaries(records,version){for(const r of records){if(version!==summaryVersion)return;try{const val=await cell('可编辑PPT文件',r.row);if(version!==summaryVersion)return;const el=document.querySelector('[data-summary="'+r.row+'"]');if(el){const box=document.createElement('div');box.innerHTML=markdown(val);el.textContent=t('output')+' · '+(box.textContent||t('waiting')).slice(0,160)}}catch{const el=document.querySelector('[data-summary="'+r.row+'"]');if(el)el.textContent=t('summaryFail')}}}
async function refresh(){const version=++loadVersion;const [csv,n]=await Promise.all([callAppBridge({type:'GetTableCSV',data:TABLE,payload:'源文件,可编辑PPT文件'}),callAppBridge({type:'GetRecordCount',data:TABLE})]);if(version!==loadVersion)return;const num=Number(n);if(!Number.isFinite(num)||num<0)throw new Error(t('loadFail'));rows=parseCSV(csv).map((r,i)=>({row:i+1,source:r[0]||'',result:r[1]||''}));count=num;$('totalCount').textContent=count;$('taskCount').textContent=rows.length;$('readyCount').textContent=rows.filter(r=>r.result.trim()).length;renderLists();updateControls()}
async function cell(field,row){return String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})||'')}
async function readRow(row){const s=await cell('源文件',row);const v=await cell('可编辑PPT文件',row);return {row,source:s,result:v}}
async function checkedRecord(record){const fresh=await readRow(record.row);if(fresh.source!==record.source){await refresh();throw new Error(t('changed'))}return fresh}
async function selectSource(type,target='main'){if(busy||mutating)return;const value=String(await callAppBridge({type})||'').trim();if(!value)return;if(target==='main'){source=value;renderSource()}else{modalRecord.editSource=value;$('editForm-source').value=value;$('editPreview').innerHTML=thumb(value)+'<p class="filename">'+esc(fileName(value))+'</p>'}}
function newConversion(value=''){if(busy||mutating){notify(t('busy'));return}currentRow=0;source=value;resultSource='';resultValue='';timedOut=false;renderSource();renderResult();showPage('convert')}
async function readHistory(row){const rec=await readRow(row);currentRow=row;resultSource=rec.source;resultValue=rec.result;timedOut=false;renderResult()}
function openModal(kind,record){returnFocus=document.activeElement;modalKind=kind;modalRecord=record;$('modal').hidden=false;$('modal').classList.toggle('reading',kind==='details');document.body.style.overflow='hidden';renderModal();$('closeDialog').focus()}
function closeModal(){if(modalBusy)return false;$('modal').hidden=true;document.body.style.overflow='';modalKind='';modalRecord=null;if(returnFocus?.isConnected)returnFocus.focus();return true}
function renderModal(){const r=modalRecord;$('dialogTitle').textContent=modalKind==='delete'?t('delete'):t('records')+' · '+t(modalKind==='edit'?'edit':'details');if(modalKind==='delete'){$('dialogBody').innerHTML='<p>'+t('confirmDelete')+'</p><p class="filename">'+esc(fileName(r.source))+'</p><div class="actions"><button data-modal="cancel">'+t('cancel')+'</button><button class="primary" data-modal="delete">'+t('confirm')+'</button></div>';return}
$('dialogBody').innerHTML=(modalKind==='edit'?'<form id="editForm"><label for="editForm-source">'+t('source')+'</label><input id="editForm-source" name="源文件" readonly value="'+esc(r.editSource??r.source)+'"><div id="editPreview">'+thumb(r.editSource??r.source)+'</div><div class="actions"><button type="button" data-modal="file">'+t('chooseFile')+'</button><button type="button" data-modal="image">'+t('chooseImage')+'</button></div>':'<h3>'+t('source')+'</h3>'+thumb(r.source)+'<p class="filename">'+esc(fileName(r.source))+'</p>')+'<h3>'+t('output')+'</h3><small class="muted">'+t('readonly')+'</small><div class="markdown">'+markdown(r.result)+'</div>'+fileActions(r.result)+(modalKind==='edit'?'<div class="actions"><button type="submit" class="primary">'+t('save')+'</button><button type="button" data-modal="cancel">'+t('cancel')+'</button></div></form>':'');if($('editForm'))$('editForm').onsubmit=e=>{e.preventDefault();void run(saveEdit)}}
async function saveEdit(){if(busy||mutating||modalBusy){notify(t('busy'));return}const r=modalRecord;if(!r.editSource&&!r.source)return;modalBusy=true;mutating=true;updateControls();$('dialogBody').querySelectorAll('button').forEach(b=>b.disabled=true);try{const fresh=await checkedRecord(r);await callAppBridge({type:'SetCellValue',data:TABLE,payload:'源文件/'+r.row+'/'+(r.editSource??r.source)});await callAppBridge({type:'SetCellValue',data:TABLE,payload:'可编辑PPT文件/'+r.row+'/'+fresh.result});modalBusy=false;closeModal();notify(t('saved'));await refresh()}catch(e){notify(t('partial'));throw e}finally{modalBusy=false;mutating=false;updateControls();if(modalKind)renderModal()}}
async function deleteRecord(){if(busy||mutating){notify(t('busy'));return}modalBusy=true;mutating=true;updateControls();try{await checkedRecord(modalRecord);await callAppBridge({type:'DeleteRecord',data:TABLE,payload:modalRecord.row.toString()});modalBusy=false;closeModal();currentRow=0;resultSource='';resultValue='';renderResult();await refresh();notify(t('deleted'))}finally{modalBusy=false;mutating=false;updateControls()}}
async function recordAction(event){const article=event.target.closest('[data-row]');if(!article)return;const record=rows.find(r=>r.row===Number(article.dataset.row));if(!record)return;const action=event.target.closest('[data-action]')?.dataset.action||'details';if((action==='delete'||action==='edit'||action==='again')&&(busy||mutating)){notify(t('busy'));return}if(action==='download'||action==='open'){const file=extractFile(record.result);if(file)window.open(link(file,action==='open'),'_blank','noopener');return}const fresh=await checkedRecord(record);if(action==='again'){newConversion(fresh.source);return}showPage('records');if(action==='edit')currentRow=fresh.row;openModal(action,fresh)}
async function submit(){if(busy||mutating||!source)return;busy=true;timedOut=false;resultValue='';resultSource=source;renderSource();renderResult();try{await callAppBridge({type:'SubmitRecord',data:'图像转PPT',payload:JSON.stringify({'源文件':source})});currentRow=1;count++;updateControls();const deadline=Date.now()+1800000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));const remaining=deadline-Date.now();if(remaining<=0)break;let timer;const tick=(async()=>{await callAppBridge({type:'轮询',data:'图像转PPT',payload:'可编辑PPT文件'});return await readRow(currentRow)})();const rec=await Promise.race([tick,new Promise(resolve=>{timer=setTimeout(()=>resolve(null),remaining)})]).finally(()=>clearTimeout(timer));if(!rec)break;resultSource=rec.source;if(rec.result.trim()){resultValue=rec.result;notify(t('done'));break}}if(!resultValue){timedOut=true;notify(t('timeout'))}}finally{busy=false;renderSource();renderResult();await refresh()}}
window.airBack=function(){if(!$('modal').hidden){closeModal();return 'false'}if($('navTabs').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const h=historyStack.pop();showPage(h.page,false);requestAnimationFrame(()=>scrollTo(0,h.y));return 'false'}return 'true'};
async function initialize(){lang=language();applyLanguage();showPage('home',false);
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
$('brand').onclick=()=>run(async()=>{parent.closeFullHtml(false)});
$('menuButton').onclick=()=>{$('navTabs').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String($('navTabs').classList.contains('open')))};
document.addEventListener('click',e=>{if(!$('navigation').contains(e.target))closeMenu()});
$('languageButton').onclick=()=>{lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch{}closeMenu();applyLanguage()};
$('startButton').onclick=()=>showPage('convert');$('chooseFile').onclick=()=>run(()=>selectSource('SelectFile'));$('chooseImage').onclick=()=>run(()=>selectSource('SelectImage'));$('clearSource').onclick=()=>{source='';renderSource()};$('convertForm').onsubmit=e=>{e.preventDefault();void run(submit)};
$('newConvert').onclick=()=>newConversion();$('recordsNew').onclick=()=>newConversion();$('previousRow').onclick=()=>run(()=>readHistory(currentRow-1));$('nextRow').onclick=()=>run(()=>readHistory(currentRow+1));
$('recordSearch').oninput=()=>{limit=12;renderLists()};$('recordFilter').onchange=()=>{limit=12;renderLists()};$('refreshButton').onclick=()=>run(refresh);$('moreButton').onclick=()=>{limit+=12;renderLists()};
for(const id of ['recordList','recentList']){$(id).onclick=e=>run(()=>recordAction(e));$(id).onkeydown=e=>{if(e.target.matches('article')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();void run(()=>recordAction(e))}}}
$('closeDialog').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('dialogBody').onclick=e=>{const a=e.target.closest('[data-modal]')?.dataset.modal;if(a==='cancel')closeModal();if(a==='file')void run(()=>selectSource('SelectFile','edit'));if(a==='image')void run(()=>selectSource('SelectImage','edit'));if(a==='delete')void run(deleteRecord)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.airBack();if(e.key==='Tab'&&!$('modal').hidden){const all=[...$('dialog').querySelectorAll('button:not(:disabled),a[href],input:not([type=hidden]),select,textarea')].filter(el=>el.getClientRects().length);const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
addEventListener('resize',fitNav);const focusVisible=()=>{const el=document.activeElement;if(el&&el.matches('input,select,textarea')){const extra=window.visualViewport?Math.max(0,innerHeight-visualViewport.height):0;$('dialog').style.paddingBottom=innerWidth<600?Math.max(180,extra+80)+'px':'';setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),120)}};document.addEventListener('focusin',focusVisible);window.visualViewport?.addEventListener('resize',focusVisible);
await Promise.allSettled([(async()=>{try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=mode.trim()==='亮色'?'light':'dark'}catch(e){notify(t('error')+String(e))}})(),(async()=>{try{await refresh()}catch(e){$('recentList').innerHTML=$('recordList').innerHTML='<div class="empty">'+t('loadFail')+'</div>';notify(t('error')+(e.message||e))}})()]);
}
(async () => { await initialize(); })();
</script>
