<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("9859c62ac99a3ce4_学霸笔记")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));

    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

                const char = csvText[i];

                    }

                        i++;

                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }

                        currentField = '';

                        // 跳过连续换行符

                            i++;
                        }

                        currentField += char;
                        i++;
                    }
                }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

        }

',termsHint:'Separate with commas or line breaks',visual:'Visual components',icons:'Icon themes',empty:'No notes yet',noMatches:'No matching notes',waiting:'Writing your notebook with a fountain pen, please wait…',open:'Open in new window',download:'Download',again:'Write another',all:'View all notes',confirmDelete:'Delete this note?',confirmRegenerate:'Copy these fields into a new record and regenerate HTML?',required:'Please enter a title and outline.',timeout:'Generation timed out (1800 seconds). Check the library later.',error:'Operation failed',saved:'Changes saved',generating:'Generation in progress; please wait',noFile:'HTML notebook is not ready yet',summaryLoading:'Loading summary…'}};
let lang='cn', page='home', historyStack=[], rows=[], total=0, currentRow=0, detailData=null, editing=false, busy=false, shown=12, generationToken=0; const summaryCache=new Map();
const $=id=>document.getElementById(id), t=k=>TXT[lang][k]||k;
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function excerpt(v,n){const s=String(v||'').trim();return s.length>n?s.slice(0,n)+'…':s;}
function safeFile(v,kind){const name=String(v||'').trim().replace(/^\/+/, '');return 'https://www.ithinkair.com:3031/'+kind+'/'+name.split('/').map(encodeURIComponent).join('/');}
function setStatus(id,message,error=false){const el=$(id);el.textContent=message;el.classList.toggle('error',error);}
function getDefaultLang(){const q=new URLSearchParams(location.search).get('lang');if(q==='cn'||q==='en')return q;try{const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn';}catch(e){}const langs=navigator.languages;if(!langs||!langs.length)return 'cn';return langs.some(x=>String(x).toLowerCase().startsWith('zh'))?'cn':'en';}
function setLang(next){const hasForms=$('createFields').children.length>0,createDraft=hasForms?readForm('createForm'):null,detailDraft=hasForms?readForm('detailForm'):null,wasEditing=editing;lang=next;document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('langSwitch').textContent=lang==='cn'?'EN':'中文';$('mobileLangSwitch').textContent=lang==='cn'?'English':'中文';if(hasForms){buildForms();fillForm('createForm',createDraft);fillForm('detailForm',detailDraft);updateCreateSubmit();if(detailData)setEditing(wasEditing);}try{localStorage.setItem('iThinkAir_UiLanguage',lang);const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);}catch(e){}renderFilters();renderStats();renderRecent();renderLibrary();checkNav();closeMenu();}
function checkNav(){const inner=$('navInner'),links=$('navLinks'),menu=$('menuToggle'),brand=$('brand');links.style.display='flex';menu.style.display='none';const shouldCollapse=inner.clientWidth<brand.scrollWidth+links.scrollWidth+65;links.style.display=shouldCollapse?'none':'flex';menu.style.display=shouldCollapse?'block':'none';if(!shouldCollapse)closeMenu();}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false');}
function showPage(next,push=true,restore=0){if(push&&page!==next)historyStack.push({page,scroll:window.scrollY,row:currentRow});page=next;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+next));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===next));closeMenu();window.scrollTo(0,restore);if(next==='home'||next==='library')refreshAll();}
function airBack(){if($('previewModal').classList.contains('open')){closeModal();return 'false';}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false';}if(historyStack.length){const prev=historyStack.pop();if(prev.page==='detail'&&prev.row)openDetail(prev.row,false,prev.scroll);else showPage(prev.page,false,prev.scroll);return 'false';}return 'true';}window.airBack=airBack;
function rowsFromCSV(csv){return parseCSV(String(csv||'')).filter(r=>r.some(x=>String(x).trim()!=='' )).map((r,i)=>({row:i+1,title:r[0]||'',subtitle:r[1]||'',outline:r[2]||'',terms:r[3]||'',visual:r[4]||'',icons:r[5]||''}));}
async function refreshAll(){try{const result=await Promise.all([callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS.join(',')}),callAppBridge({type:'GetRecordCount',data:TABLE})]);rows=rowsFromCSV(result[0]);const count=Number.parseInt(result[1],10);total=Number.isFinite(count)?count:rows.length;renderStats();renderRecent();renderFilters();renderLibrary();}catch(e){setStatus(page==='create'?'createStatus':'detailStatus',t('error')+': '+String(e),true);}}
function renderStats(){$('totalCount').textContent=total;$('weekCount').textContent=total; /* 无日期字段，按最近记录数近似 */ $('flowCount').textContent=rows.filter(r=>r.visual.includes('流程图')).length;}
function renderFilters(){const vf=$('visualFilter'),ic=$('iconFilter'),v=vf.value,i=ic.value;vf.innerHTML='<option value="">'+escapeHTML(t('allVisual'))+'</option>'+VISUALS.map(x=>'<option value="'+escapeHTML(x)+'">'+escapeHTML(x)+'</option>').join('');ic.innerHTML='<option value="">'+escapeHTML(t('allIcons'))+'</option>'+ICONS.map(x=>'<option value="'+escapeHTML(x)+'">'+escapeHTML(x)+'</option>').join('');vf.value=v;ic.value=i;}
async function getOutline(row){if(summaryCache.has(row))return summaryCache.get(row);try{const v=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'内容大纲/'+row});summaryCache.set(row,String(v||''));return String(v||'');}catch(e){return '';}}
function tagsFor(r){const a=String(r.visual).split(',').map(x=>x.trim()).filter(Boolean),b=String(r.icons).split(',').map(x=>x.trim()).filter(Boolean);return '<div class="tags">'+a.map(x=>'<span class="tag">'+escapeHTML(x)+'</span>').join('')+b.map(x=>'<span class="tag alt">'+escapeHTML(x)+'</span>').join('')+'</div>';}
function cardHTML(r,full,summary){return '<article class="paper note-card"><div class="card-main" role="button" tabindex="0" data-row="'+r.row+'"><h3>'+escapeHTML(r.title||'—')+'</h3><p class="subtitle">'+escapeHTML(r.subtitle)+'</p><p class="summary">'+escapeHTML(excerpt(summary,full?100:80))+'</p>'+tagsFor(r)+'</div>'+(full?'<div class="card-actions"><button class="btn small" data-action="preview" data-row="'+r.row+'"><i class="fa-solid fa-eye"></i>'+t('preview')+'</button><button class="btn small" data-action="edit" data-row="'+r.row+'"><i class="fa-solid fa-pen"></i>'+t('edit')+'</button><button class="btn small danger" data-action="delete" data-row="'+r.row+'"><i class="fa-solid fa-trash"></i>'+t('delete')+'</button></div>':'')+'</article>';}
async function renderCards(container,list,full){const target=$(container);if(!list.length){target.innerHTML='<div class="paper empty">'+escapeHTML(full&&rows.length?t('noMatches'):t('empty'))+'</div>';return;}target.innerHTML=list.map(r=>cardHTML(r,full,t('summaryLoading'))).join('');const summaries=await Promise.all(list.map(r=>getOutline(r.row)));if((full&&page!=='library')||(!full&&page!=='home'))return;target.innerHTML=list.map((r,i)=>cardHTML(r,full,summaries[i])).join('');}
function renderRecent(){renderCards('recentCards',rows.slice(0,6),false);}
function renderLibrary(){const q=$('searchInput').value.trim().toLocaleLowerCase(),v=$('visualFilter').value,i=$('iconFilter').value;const filtered=rows.filter(r=>(!q||[r.title,r.subtitle,r.terms].some(s=>String(s).toLocaleLowerCase().includes(q)))&&(!v||r.visual.split(',').map(s=>s.trim()).includes(v))&&(!i||r.icons.split(',').map(s=>s.trim()).includes(i)));renderCards('libraryCards',filtered.slice(0,shown),true);$('loadMore').hidden=filtered.length<=shown;}
function choicesHTML(formId,field,options,icons=[]){return '<div class="choice-grid">'+options.map((x,i)=>'<label class="choice"><input type="checkbox" name="'+field+'" id="'+formId+'_'+field+'_'+i+'" value="'+escapeHTML(x)+'"><i class="fa-solid '+(icons[i]||'fa-pen-nib')+'"></i><span>'+escapeHTML(x)+'</span></label>').join('')+'</div>';}
function fieldHTML(formId,id,label,multiline=false,hint=''){return '<div class="field '+(multiline?'wide':'')+'"><label for="'+formId+'_'+id+'">'+t(label)+'</label>'+(multiline?'<textarea id="'+formId+'_'+id+'" name="'+id+'"></textarea>':'<input id="'+formId+'_'+id+'" name="'+id+'" type="text">')+(hint?'<span class="hint">'+t(hint)+'</span>':'')+'</div>';}
function formHTML(formId){return '<section class="paper form-card"><h2><i class="fa-solid fa-book-open"></i> '+t('basic')+'</h2><div class="form-grid">'+fieldHTML(formId,'笔记标题','title')+fieldHTML(formId,'副标题','subtitle')+'</div></section><section class="paper form-card"><h2><i class="fa-solid fa-feather-pointed"></i> '+t('content')+'</h2><div class="form-grid">'+fieldHTML(formId,'内容大纲','outline',true)+fieldHTML(formId,'技术术语','terms',true,'termsHint')+'</div></section><section class="paper form-card"><h2><i class="fa-solid fa-palette"></i> '+t('style')+'</h2><div class="field"><label class="fieldset-title">'+t('visual')+'</label>'+choicesHTML(formId,'视觉组件',VISUALS)+'</div><div class="field" style="margin-top:20px"><label class="fieldset-title">'+t('icons')+'</label>'+choicesHTML(formId,'图标主题',ICONS,ICON_CLASS)+'</div></section>';}
function buildForms(){$('createFields').innerHTML=formHTML('createForm');$('detailFields').innerHTML=formHTML('detailForm');updateCreateSubmit();}
function updateCreateSubmit(){const f=$('createForm');$('createSubmit').disabled=busy||!f.elements['笔记标题'].value.trim()||!f.elements['内容大纲'].value.trim();}
function readForm(id){const f=$(id),d={};for(const name of FIELDS){if(name==='视觉组件'||name==='图标主题')d[name]=[...f.querySelectorAll('input[name="'+name+'"]:checked')].map(x=>x.value).join(',');else d[name]=f.elements[name].value.trim();}return d;}
function fillForm(id,d){const f=$(id);for(const name of FIELDS){if(name==='视觉组件'||name==='图标主题'){const values=String(d[name]||'').split(',').map(s=>s.trim());f.querySelectorAll('input[name="'+name+'"]').forEach(x=>x.checked=values.includes(x.value));}else f.elements[name].value=d[name]||'';}}
function setEditing(value){editing=value;for(const el of $('detailForm').querySelectorAll('input,textarea'))el.disabled=!value;$('detailSaveWrap').hidden=!value;$('editNote').hidden=value;}
async function getRecord(row){const d={};for(const name of ALL_FIELDS)d[name]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:name+'/'+row});return d;}
async function openDetail(row,push=true,restore=0){if(row<1)return;currentRow=row;showPage('detail',push,restore);setStatus('detailStatus',t('summaryLoading'));try{detailData=await getRecord(row);renderDetail();setStatus('detailStatus','');}catch(e){setStatus('detailStatus',t('error')+': '+String(e),true);}}
function renderDetail(){if(!detailData)return;buildForms();fillForm('detailForm',detailData);setEditing(false);$('detailHeading').textContent=detailData['笔记标题']||t('detail');$('detailSubtitle').textContent=detailData['副标题']||'';$('previousNote').disabled=currentRow<=1;$('nextNote').disabled=currentRow>=total;renderResult('detailResult',detailData['HTML笔记'],false);}
function renderResult(id,file,creation){const el=$(id);if(!file){el.innerHTML=creation?'':'<div class="paper empty">'+t('noFile')+'</div>';return;}const p=safeFile(file,'private'),d=safeFile(file,'download');el.innerHTML='<div class="paper result"><h2>'+t('preview')+'</h2><div class="result-actions"><a class="btn small" href="'+escapeHTML(p)+'" target="_blank" rel="noopener">'+t('open')+'</a><a class="btn small" href="'+escapeHTML(d)+'" download>'+t('download')+'</a></div><iframe class="preview-frame" src="'+escapeHTML(p)+'" title="'+t('preview')+'" loading="lazy"></iframe>'+(creation?'<div class="result-actions"><button class="btn" id="writeAgain" type="button">'+t('again')+'</button><button class="btn" data-page="library" type="button">'+t('all')+'</button></div>':'')+'</div>';}
async function previewRow(row){try{const name=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'HTML笔记/'+row});if(!name){alert(t('noFile'));return;}$('modalBody').innerHTML='<iframe class="preview-frame" src="'+escapeHTML(safeFile(name,'private'))+'" title="'+t('preview')+'"></iframe>'; $('previewModal').classList.add('open');document.body.style.overflow='hidden';}catch(e){alert(t('error')+': '+String(e));}}
function closeModal(){$('previewModal').classList.remove('open');$('modalBody').innerHTML='';document.body.style.overflow='';}
async function deleteRow(row){if(busy||!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});summaryCache.clear();if(page==='detail'){currentRow=0;detailData=null;showPage('library');}await refreshAll();}catch(e){alert(t('error')+': '+String(e));}}
async function pollGenerated(destination){const token=++generationToken,start=Date.now(),pollRow=currentRow;setStatus(destination==='createResult'?'createStatus':'detailStatus',t('waiting'));while(token===generationToken&&Date.now()-start<1800000){await new Promise(resolve=>setTimeout(resolve,1000));let file='';try{file=String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:'HTML笔记/'+pollRow})||'').trim();}catch(e){}if(file){renderResult(destination,file,destination==='createResult');setStatus(destination==='createResult'?'createStatus':'detailStatus','');busy=false;updateCreateSubmit();await refreshAll();return;}}setStatus(destination==='createResult'?'createStatus':'detailStatus',t('timeout'),true);busy=false;updateCreateSubmit();await refreshAll();}
async function submitNew(data,destination){if(busy)return;if(!data['笔记标题'].trim()||!data['内容大纲'].trim()){alert(t('required'));return;}busy=true;updateCreateSubmit();try{const payload={...data,'HTML笔记':''};await callAppBridge({type:'SubmitRecord',data:'笔记',payload:JSON.stringify(payload)});currentRow=1;summaryCache.clear();await pollGenerated(destination);}catch(e){busy=false;updateCreateSubmit();setStatus(destination==='createResult'?'createStatus':'detailStatus',t('error')+': '+String(e),true);}}
async function saveDetail(event){event.preventDefault();if(busy||!editing)return;const d=readForm('detailForm');if(!d['笔记标题']||!d['内容大纲']){alert(t('required'));return;}busy=true;try{for(const field of FIELDS)await callAppBridge({type:'SetCellValue',data:TABLE,payload:field+'/'+currentRow+'/'+d[field]});detailData={...detailData,...d};summaryCache.delete(currentRow);setEditing(false);setStatus('detailStatus',t('saved'));await refreshAll();}catch(e){setStatus('detailStatus',t('error')+': '+String(e),true);}finally{busy=false;}}
async function initialize(){lang=getDefaultLang();try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色');}catch(e){}buildForms();setLang(lang);checkNav();await refreshAll();}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){e.preventDefault();if(busy&&page==='create')return;showPage(nav.dataset.page);return;}const action=e.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);if(action.dataset.action==='preview')await previewRow(row);if(action.dataset.action==='edit'){await openDetail(row);setEditing(true);$('detailForm').scrollIntoView({block:'start'});}if(action.dataset.action==='delete')await deleteRow(row);return;}const card=e.target.closest('.card-main[data-row]');if(card){await openDetail(Number(card.dataset.row));return;}if(e.target.closest('#writeAgain')){generationToken++;currentRow=0;$('createForm').reset();updateCreateSubmit();$('createResult').innerHTML='';setStatus('createStatus','');window.scrollTo(0,0);return;}if(!e.target.closest('#mobileMenu,#menuToggle'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('previewModal').classList.contains('open'))closeModal();else closeMenu();}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card-main[data-row]')){e.preventDefault();openDetail(Number(e.target.dataset.row));}});
$('brand').addEventListener('click',e=>{e.preventDefault();if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);});
$('menuToggle').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open));});
$('langSwitch').addEventListener('click',()=>setLang(lang==='cn'?'en':'cn'));
$('mobileLangSwitch').addEventListener('click',()=>setLang(lang==='cn'?'en':'cn'));
$('searchInput').addEventListener('input',()=>{shown=12;renderLibrary();});$('visualFilter').addEventListener('change',()=>{shown=12;renderLibrary();});$('iconFilter').addEventListener('change',()=>{shown=12;renderLibrary();});$('loadMore').addEventListener('click',()=>{shown+=12;renderLibrary();});
$('createForm').addEventListener('input',updateCreateSubmit);$('createForm').addEventListener('submit',e=>{e.preventDefault();submitNew(readForm('createForm'),'createResult');});$('detailForm').addEventListener('submit',saveDetail);
$('editNote').addEventListener('click',()=>{setEditing(true);$('detailForm').scrollIntoView({block:'start'});});$('cancelEdit').addEventListener('click',()=>{fillForm('detailForm',detailData);setEditing(false);});$('deleteNote').addEventListener('click',()=>deleteRow(currentRow));$('previousNote').addEventListener('click',()=>openDetail(currentRow-1));$('nextNote').addEventListener('click',()=>openDetail(currentRow+1));
$('regenerateNote').addEventListener('click',async()=>{if(busy||!confirm(t('confirmRegenerate')))return;const data=editing?readForm('detailForm'):{...detailData};await submitNew(data,'detailResult');if(!busy)await openDetail(1,false);});
$('closeModal').addEventListener('click',closeModal);$('previewModal').addEventListener('click',e=>{if(e.target===$('previewModal'))closeModal();});
window.addEventListener('resize',()=>{checkNav();if(document.activeElement&&document.activeElement.matches('input,textarea'))setTimeout(()=>document.activeElement.scrollIntoView({block:'center',behavior:'smooth'}),250);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a&&a.matches('input,textarea'))setTimeout(()=>a.scrollIntoView({block:'center',behavior:'smooth'}),150);});
document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300);});
document.addEventListener('DOMContentLoaded',async () => { await initialize(); });
</script>
</body>
