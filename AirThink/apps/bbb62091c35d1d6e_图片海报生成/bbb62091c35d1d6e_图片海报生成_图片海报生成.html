<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    canvas.style.display = 'none';

    container.style.cssText = `

      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

meout:'Generation timed out. Check the gallery later.',confirmDelete:'Delete this poster?',deleted:'Deleted.',noResult:'No matching posters.'}};
const optionText={广告海报:'Advertising',宣传海报:'Promotional',活动海报:'Event',产品海报:'Product',品牌海报:'Brand',线上推广:'Online promotion',线下展示:'Offline display',社交媒体:'Social media',印刷物料:'Print material'};
let lang='cn',currentPage='home',historyStack=[],galleryRows=[],referenceImage='',resultImage='',polling=false,pollToken=0,detailOpen=false;
const $=id=>document.getElementById(id), t=key=>words[lang][key]||key;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imageUrl(file){return 'http://' + window.location.hostname + ':3130/private/'+encodeURIComponent(file);}
function downloadUrl(file){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(file);}
function labelOption(v){return lang==='en'?(optionText[v]||v):v;}
function chooseLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved!==null&&saved!=='')return saved==='en'?'en':'cn';const query=new URLSearchParams(location.search).get('lang');if(query==='cn'||query==='en')return query;const languages=navigator.languages;if(!languages||!languages.length)return 'cn';return languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';}
function fillSelect(id,values,all=false){const el=$(id),old=el.value;el.innerHTML=(all?'<option value="">'+esc(t('allTypes'))+'</option>':'')+values.map(v=>'<option value="'+esc(v)+'">'+esc(labelOption(v))+'</option>').join('');if(values.includes(old)||all&&old==='')el.value=old;}
function applyLanguage(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n)});document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('desktopLang').textContent=lang==='cn'?'EN':'中文';$('mobileLang').textContent=lang==='cn'?'English':'中文';fillSelect('posterForm_type',typeValues);fillSelect('posterForm_channel',channelValues);fillSelect('posterForm_format',formatValues);fillSelect('typeFilter',typeValues,true);renderGallery();renderRecent();if(!resultImage&&!polling)showWaiting();}
function toggleLanguage(){lang=lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',lang);applyLanguage();}
function closeMenu(){$('mobileMenu').classList.add('hidden');$('menuButton').setAttribute('aria-expanded','false');}
function showPage(page,push=true){if(!['home','studio','gallery'].includes(page))return;if(page!==currentPage){if(push)historyStack.push({page:currentPage,y:scrollY});document.querySelectorAll('section.page').forEach(el=>el.classList.toggle('active',el.id===page+'Page'));currentPage=page;document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));window.scrollTo(0,0);}closeMenu();if(page==='gallery')loadGallery();if(page==='home')loadHome();}
function airBack(){if(detailOpen){closeDetail();return 'false';}if(!$('mobileMenu').classList.contains('hidden')){closeMenu();return 'false';}if(historyStack.length){const previous=historyStack.pop();showPage(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.y));return 'false';}return 'true';}
window.airBack=airBack;
async function bridge(req){return await callAppBridge(req);}
async function rowsFor(fields){const raw=await bridge({type:'GetTableCSV',data:TABLE,payload:fields.join(',')});return parseCSV(String(raw||''));}
function card(row,editable=false){const file=row.image||'';const image=file?'<img loading="lazy" src="'+esc(imageUrl(file))+'" alt="'+esc(row.subject||'')+'">':'<i class="fa-regular fa-image"></i>';return '<article class="poster-card glass" data-row="'+row.row+'"'+(editable?'':' data-action="view"')+'><div class="poster-image">'+image+'</div><div class="poster-copy"><span class="badge">'+esc(labelOption(row.type||''))+'</span><strong>'+esc(row.subject||'—')+'</strong></div><div class="poster-actions"><button class="secondary" data-action="view" data-row="'+row.row+'" title="'+esc(t('view'))+'"><i class="fa-solid fa-eye"></i><span>'+esc(t('view'))+'</span></button>'+(editable?'<button class="danger" data-action="delete" data-row="'+row.row+'" title="'+esc(t('delete'))+'"><i class="fa-solid fa-trash"></i></button>':'')+'</div></article>';}
function renderRecent(){const rows=galleryRows.slice(0,4);$('recentGrid').innerHTML=rows.length?rows.map(x=>card(x)).join(''):'<div class="empty">'+esc(t('empty'))+'</div>';}
function renderGallery(){const q=$('searchInput').value.trim().toLocaleLowerCase(),type=$('typeFilter').value;const filtered=galleryRows.filter(x=>(!type||x.type===type)&&(!q||x.subject.toLocaleLowerCase().includes(q)));$('galleryGrid').innerHTML=filtered.length?filtered.map(x=>card(x,true)).join(''):'<div class="empty">'+esc(galleryRows.length?t('noResult'):t('empty'))+'</div>';}
async function loadHome(){try{const count=await bridge({type:'GetRecordCount',data:TABLE});$('posterCount').textContent=String(count||'0');await loadGalleryData();renderRecent();}catch(e){$('posterCount').textContent='—';$('recentGrid').innerHTML='<div class="empty">'+esc(t('failed')+String(e))+'</div>';}}
async function loadGalleryData(){const rows=await rowsFor(['海报类型','主题','传播渠道','视觉风格']);const entries=rows.map((r,i)=>({row:i+1,type:r[0]||'',subject:r[1]||'',channel:r[2]||'',style:r[3]||'',image:''}));for(const entry of entries){try{entry.image=String(await bridge({type:'GetCellValue',data:TABLE,payload:'海报图片/'+entry.row})||'').trim();}catch(e){entry.image='';}}galleryRows=entries;}
async function loadGallery(){$('galleryStatus').textContent=t('loading');try{await loadGalleryData();renderGallery();$('galleryStatus').textContent='';}catch(e){$('galleryStatus').textContent=t('failed')+String(e);}}
function showWaiting(){$('resultPreview').innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i><p>'+esc(t('waiting'))+'</p>';}
function showPolling(){$('resultPreview').innerHTML='<div class="spinner"></div><p>'+esc(t('polling'))+'</p>';}
function showResult(file){resultImage=file;$('resultPreview').innerHTML='<img src="'+esc(imageUrl(file))+'" alt="'+esc(t('result'))+'"><div class="preview-actions"><a class="primary" href="'+esc(downloadUrl(file))+'" download><i class="fa-solid fa-download"></i>'+esc(t('download'))+'</a><button class="secondary" id="resetResultButton" type="button"><i class="fa-solid fa-rotate-left"></i>'+esc(t('reset'))+'</button></div>';}
function resetForm(){pollToken++;polling=false;referenceImage='';resultImage='';$('posterForm').reset();$('referencePreview').innerHTML='<i class="fa-solid fa-image"></i><span>'+esc(t('noImage'))+'</span>';$('generateButton').disabled=false;$('formStatus').textContent='';$('formStatus').classList.remove('error');showWaiting();}
async function submitPoster(event){event.preventDefault();if(polling)return;const data={};for(const el of $('posterForm').elements){if(el.name)data[el.name]=el.value.trim();}data['图片']=referenceImage;polling=true;$('generateButton').disabled=true;$('formStatus').textContent=t('polling');$('formStatus').classList.remove('error');showPolling();const token=++pollToken;try{await bridge({type:'SubmitRecord',data:SUBMIT_TABLE,payload:JSON.stringify(data)});const started=Date.now();while(token===pollToken&&Date.now()-started<1800000){let value='';try{value=String(await bridge({type:'轮询',data:SUBMIT_TABLE,payload:'海报图片'})||'').trim();}catch(e){}if(value){const file=String(await bridge({type:'GetCellValue',data:TABLE,payload:'海报图片/1'})||value).trim();if(token===pollToken){showResult(file);$('formStatus').textContent='';}break;}await new Promise(resolve=>setTimeout(resolve,1000));}if(token===pollToken&&!resultImage){$('formStatus').textContent=t('timeout');$('formStatus').classList.add('error');showWaiting();}if(token===pollToken){polling=false;$('generateButton').disabled=false;}}catch(e){if(token===pollToken){polling=false;$('generateButton').disabled=false;$('formStatus').textContent=t('failed')+String(e);$('formStatus').classList.add('error');showWaiting();}}}
async function openDetail(rowNumber){detailOpen=true;$('detailBackdrop').classList.remove('hidden');document.body.style.overflow='hidden';$('detailImage').innerHTML='<div class="spinner"></div>';$('detailValues').innerHTML='';$('detailDownload').classList.add('hidden');try{const values={};for(const name of [...fieldNames,'海报图片']){values[name]=String(await bridge({type:'GetCellValue',data:TABLE,payload:name+'/'+rowNumber})||'');}if(!detailOpen)return;const file=values['海报图片'];$('detailImage').innerHTML=file?'<img src="'+esc(imageUrl(file))+'" alt="'+esc(values['主题'])+'">':'<i class="fa-regular fa-image"></i>';$('detailDownload').href=downloadUrl(file);$('detailDownload').classList.toggle('hidden',!file);$('detailValues').innerHTML=fieldNames.map((name,i)=>'<div class="detail-value"><small>'+esc(t(['type','subject','content','audience','scene','channel','style','format'][i]))+'</small>'+esc(name==='海报类型'||name==='传播渠道'?labelOption(values[name]):values[name]||'—')+'</div>').join('');}catch(e){$('detailImage').innerHTML='';$('detailValues').textContent=t('failed')+String(e);}}
function closeDetail(){detailOpen=false;$('detailBackdrop').classList.add('hidden');document.body.style.overflow='';}
async function deletePoster(row){if(!window.confirm(t('confirmDelete')))return;$('galleryStatus').textContent=t('loading');try{await bridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});await loadGallery();await loadHome();$('galleryStatus').textContent=t('deleted');}catch(e){$('galleryStatus').textContent=t('failed')+String(e);}}
function keepInputVisible(){const active=document.activeElement;if(!active||!['INPUT','TEXTAREA','SELECT'].includes(active.tagName))return;setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),250);}
async function initialize(){lang=chooseLanguage();applyLanguage();$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));$('startButton').addEventListener('click',()=>showPage('studio'));$('seeAllButton').addEventListener('click',()=>showPage('gallery'));$('newPosterButton').addEventListener('click',()=>showPage('studio'));$('desktopLang').addEventListener('click',toggleLanguage);$('mobileLang').addEventListener('click',()=>{toggleLanguage();closeMenu()});$('menuButton').addEventListener('click',()=>{const menu=$('mobileMenu');menu.classList.toggle('hidden');$('menuButton').setAttribute('aria-expanded',String(!menu.classList.contains('hidden')))});document.addEventListener('click',e=>{if(!$('nav').contains(e.target))closeMenu()});$('posterForm').addEventListener('submit',submitPoster);$('uploadButton').addEventListener('click',async()=>{try{const file=String(await bridge({type:'SelectImage'})||'').trim();if(file){referenceImage=file;$('referencePreview').innerHTML='<img src="'+esc(imageUrl(file))+'" alt="'+esc(t('reference'))+'">';}}catch(e){$('formStatus').textContent=t('failed')+String(e);$('formStatus').classList.add('error');}});$('resultPreview').addEventListener('click',e=>{if(e.target.closest('#resetResultButton'))resetForm()});$('searchInput').addEventListener('input',renderGallery);$('typeFilter').addEventListener('change',renderGallery);for(const id of ['recentGrid','galleryGrid'])$(id).addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;const row=Number(button.dataset.row);if(button.dataset.action==='view')openDetail(row);if(button.dataset.action==='delete')deletePoster(row)});$('detailClose').addEventListener('click',closeDetail);$('detailBackdrop').addEventListener('click',e=>{if(e.target===$('detailBackdrop'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(detailOpen)closeDetail();else closeMenu()}});document.addEventListener('focusin',keepInputVisible);if(window.visualViewport)window.visualViewport.addEventListener('resize',keepInputVisible);await loadHome();}
async function applyMode(){try{const mode=String(await callAppBridge({type:'模式'})||'').trim();document.body.classList.toggle('light',mode==='亮色');}catch(e){}}
document.addEventListener('DOMContentLoaded',() => { (async () => { await applyMode(); await initialize(); })(); });
</script>
</body>
