<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("11c2d979bab321ad_录音转稿助手")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

                        i++;

            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

        }

async function csv(source,fields){const raw=await callAppBridge({type:'GetTableCSV',data:source,payload:fields.join(',')});return parseCSV(String(raw||'')).filter(row=>row.some(cell=>cell!==''))}
async function loadAll(){const results=await Promise.allSettled([csv(SOURCES.records,['录音编号','录音主题','录制日期']),csv(SOURCES.minutes,['纪要编号','录音编号','会议类型','是否跟进']),csv(SOURCES.analysis,['分析编号','录音编号','分析说明']),callAppBridge({type:'GetRecordCount',data:SOURCES.records}),callAppBridge({type:'GetRecordCount',data:SOURCES.minutes}),callAppBridge({type:'GetRecordCount',data:SOURCES.analysis})]);if(results[0].status==='fulfilled')records=results[0].value.map((r,i)=>({id:r[0],topic:r[1],date:r[2],row:i+1}));if(results[1].status==='fulfilled')minutes=results[1].value.map((r,i)=>({id:r[0],recordId:r[1],type:r[2],follow:r[3],row:i+1}));if(results[2].status==='fulfilled')analysis=results[2].value.map((r,i)=>({id:r[0],recordId:r[1],description:r[2],row:i+1}));['records','minutes','analysis'].forEach((key,i)=>{$('count-'+key).textContent=results[i+3].status==='fulfilled'?String(results[i+3].value):'—'});renderAll()}
function topicFor(id){return records.find(r=>r.id===id)?.topic||id||'—'}function typeLabel(x){const n=types.indexOf(x);return n<0?x:t(typeKeys[n])}
function renderAll(){if(!$('recentList'))return;opts();const recent=[...records].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);$('recentList').innerHTML=recent.length?recent.map(r=>'<button class="recent-item" data-kind="records" data-action="view" data-id="'+esc(r.id)+'"><span><i class="fa-solid fa-microphone" aria-hidden="true"></i> &nbsp;'+esc(r.topic||'—')+'</span><small>'+esc(r.date||'')+'</small></button>').join(''):'<div class="empty">'+esc(t('empty'))+'</div>';const q=$('recordSearch').value.trim().toLocaleLowerCase();$('recordRows').innerHTML=rows(records.filter(r=>String(r.topic||'').toLocaleLowerCase().includes(q)).map(r=>[r.topic,r.date]),records.filter(r=>String(r.topic||'').toLocaleLowerCase().includes(q)),'records','viewTranscript');const ft=$('minutesType').value,ff=$('minutesFollow').value;const m=minutes.filter(r=>(!ft||r.type===ft)&&(!ff||String(r.follow).includes(ff)));$('minutesRows').innerHTML=rows(m.map(r=>[r.id,topicFor(r.recordId),typeLabel(r.type),r.follow==='是'?t('yes'):r.follow==='否'?t('no'):r.follow]),m,'minutes','viewMinutes');$('analysisRows').innerHTML=rows(analysis.map(r=>[r.id,topicFor(r.recordId),r.description]),analysis,'analysis','viewCloud')}
function rows(cells,items,kind,viewKey){if(!items.length)return '<tr><td colspan="6" class="empty">'+esc(t('empty'))+'</td></tr>';return items.map((r,i)=>'<tr>'+cells[i].map(v=>'<td>'+esc(v||'—')+'</td>').join('')+'<td><div class="actions"><button class="btn small" data-kind="'+kind+'" data-action="view" data-id="'+esc(r.id)+'"><i class="fa-solid fa-eye"></i>'+esc(t(viewKey))+'</button><button class="btn small danger" data-kind="'+kind+'" data-action="delete" data-id="'+esc(r.id)+'"><i class="fa-solid fa-trash"></i>'+esc(t('delete'))+'</button></div></td></tr>').join('')}
async function recordRow(kind,id){const field=kind==='records'?'录音编号':kind==='minutes'?'纪要编号':'分析编号';const row=await callAppBridge({type:'GetRecordRow',data:SOURCES[kind],payload:field+'/'+String(id)});const n=Number(row);if(!Number.isInteger(n)||n<1)throw Error('Record row unavailable');return n}
async function viewItem(kind,id){try{openModal(t(kind==='records'?'viewTranscript':kind==='minutes'?'viewMinutes':'viewCloud'),'<div class="notice"><span class="loading"></span>'+esc(t('waiting'))+'</div>','',true,kind==='records');const row=await recordRow(kind,id),field=kind==='records'?'转写文本':kind==='minutes'?'会议纪要文档':'词云图文件';const value=String(await callAppBridge({type:'GetCellValue',data:SOURCES[kind],payload:field+'/'+row})||'').trim();if(!modalOpen)return;if(!value){$('modalBody').innerHTML='<div class="empty">'+esc(t('notReady'))+'</div>';return}if(kind==='records'){const source=window.marked?marked.parse(value,{gfm:true,breaks:true}):'<pre>'+esc(value)+'</pre>';const safe=window.DOMPurify?DOMPurify.sanitize(source):'<pre>'+esc(value)+'</pre>';$('modalBody').innerHTML='<article class="markdown">'+safe+'</article>';document.querySelectorAll('#modalBody .markdown img').forEach(img=>{const a=document.createElement('a');const raw=img.getAttribute('src');if(raw&&!/^(?:https?:|data:|blob:)/i.test(raw))img.src=fileUrl(raw);a.href=img.src;a.download='';img.replaceWith(a);a.appendChild(img)})}else if(kind==='minutes'){$('modalBody').innerHTML='<div class="notice"><i class="fa-solid fa-file-word"></i> '+esc(value)+'</div><a class="btn primary" href="'+esc(fileUrl(value))+'" download><i class="fa-solid fa-download"></i>'+esc(t('download'))+'</a>'}else{$('modalBody').innerHTML='<img class="detail-image" alt="Word cloud" src="'+esc(fileUrl(value))+'">'}}catch(e){if(modalOpen)$('modalBody').innerHTML='<div class="error">'+esc(t('error')+': '+e.message)+'</div>'}}
function fileUrl(name){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(name)}
async function deleteItem(kind,id){if(!confirm(t('confirmDelete')))return;try{const row=await recordRow(kind,id);await callAppBridge({type:'DeleteRecord',data:SOURCES[kind],payload:row.toString()});await loadAll()}catch(e){alert(t('error')+': '+e.message)}}
async function openForm(kind){activeForm=kind;recording=false;const title=t(kind==='records'?'addRecord':kind==='minutes'?'addMinutes':'addAnalysis'),id='form-'+kind;let body='<form id="'+id+'">';if(kind==='records'){body+='<div class="field"><label for="'+id+'-topic">'+esc(t('topic'))+'</label><input id="'+id+'-topic" name="录音主题" required maxlength="200"></div><div class="field"><label for="'+id+'-file">'+esc(t('file'))+'</label><input id="'+id+'-file" name="录音文件" readonly required><div class="file-actions"><button class="btn small" id="chooseAudio" type="button"><i class="fa-solid fa-file-audio"></i>'+esc(t('selectFile'))+'</button><button class="btn small" id="startAudio" type="button"><i class="fa-solid fa-microphone"></i>'+esc(t('startRecord'))+'</button><button class="btn small" id="finishAudio" type="button" disabled><i class="fa-solid fa-stop"></i>'+esc(t('finishRecord'))+'</button></div><div class="file-name" id="audioState"></div></div>'}else{body+='<div class="field"><label for="'+id+'-record">'+esc(t('topic'))+'</label><select id="'+id+'-record" name="录音编号" required><option value="">'+esc(t('chooseRecord'))+'</option>'+records.map(r=>'<option value="'+esc(r.id)+'">'+esc(r.topic||r.id)+'</option>').join('')+'</select></div>';if(kind==='minutes')body+='<div class="field"><label for="'+id+'-type">'+esc(t('meetingType'))+'</label><select id="'+id+'-type" name="会议类型" required><option value="">'+esc(t('selectType'))+'</option>'+types.map((x,i)=>'<option value="'+esc(x)+'">'+esc(t(typeKeys[i]))+'</option>').join('')+'</select></div><div class="field"><label for="'+id+'-follow">'+esc(t('follow'))+'</label><select id="'+id+'-follow" name="是否跟进"><option value="否">'+esc(t('no'))+'</option><option value="是">'+esc(t('yes'))+'</option></select></div>';else body+='<div class="field"><label for="'+id+'-description">'+esc(t('description'))+'</label><textarea id="'+id+'-description" name="分析说明" rows="3"></textarea></div>'}body+='</form><div id="formStatus" aria-live="polite"></div>';openModal(title,body,'<button class="btn" id="formCancel">'+esc(t('cancel'))+'</button><button class="btn primary" id="formSubmit">'+esc(t('submit'))+'</button>');$('formCancel').onclick=closeModal;$('formSubmit').onclick=()=>submitForm(kind);if(kind==='records'){ $('chooseAudio').onclick=async()=>{try{const f=await callAppBridge({type:'SelectFile'});if(f)$('form-records-file').value=String(f)}catch(e){$('audioState').textContent=e.message}};$('startAudio').onclick=async()=>{try{await callAppBridge({type:'StartRecordVoice'});recording=true;$('startAudio').disabled=true;$('finishAudio').disabled=false;$('audioState').textContent=t('recording')}catch(e){$('audioState').textContent=e.message}};$('finishAudio').onclick=async()=>{try{const f=await callAppBridge({type:'FinishRecordVoice'});recording=false;$('startAudio').disabled=false;$('finishAudio').disabled=true;if(f)$('form-records-file').value=String(f);$('audioState').textContent=String(f||'')}catch(e){$('audioState').textContent=e.message}}}}
async function submitForm(kind){if(processing)return;const form=$('form-'+kind);if(!form.reportValidity())return;const fd=new FormData(form),data=Object.fromEntries(fd.entries());if(kind==='records'){if(!data['录音文件']){alert(t('selectAudio'));return}data['录音编号']=newId();data['录制日期']=localDate()}if(kind==='minutes')data['纪要编号']=newId();if(kind==='analysis')data['分析编号']=newId();processing=true;$('formSubmit').disabled=true;$('formCancel').disabled=true;$('closeModal').disabled=true;try{await callAppBridge({type:'SubmitRecord',data:TABLES[kind],payload:JSON.stringify(data)});const field=kind==='records'?'转写文本':kind==='minutes'?'会议纪要文档':'词云图文件',label=kind==='records'?'transcribing':kind==='minutes'?'generatingMinutes':'generatingCloud';$('modalTitle').textContent=t(label);$('modalBody').innerHTML='<div class="notice"><span class="loading"></span>'+esc(t('waiting'))+'</div>';$('modalFoot').style.display='none';const started=Date.now();while(Date.now()-started<1800000){await new Promise(resolve=>setTimeout(resolve,1000));const result=String(await callAppBridge({type:'轮询',data:TABLES[kind],payload:field})||'').trim();if(result){$('modalBody').innerHTML='<div class="notice">'+esc(result)+'</div>';break}}if(Date.now()-started>=1800000)$('modalBody').innerHTML='<div class="notice">'+esc(t('timeout'))+'</div>';await loadAll()}catch(e){$('modalBody').innerHTML='<div class="error">'+esc(t('error')+': '+e.message)+'</div>'}finally{processing=false;$('closeModal').disabled=false;$('modalFoot').innerHTML='<button class="btn primary" id="doneButton">'+esc(t('cancel'))+'</button>';$('modalFoot').style.display='flex';$('doneButton').onclick=closeModal}}
async function initialize(){initLanguage();try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));$('brand').onclick=e=>{e.preventDefault();if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)};$('desktopLang').onclick=()=>setLanguage(lang==='cn'?'en':'cn');document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{setLanguage(b.dataset.lang);closeMenu()});$('menuButton').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!e.target.closest('#navbar'))closeMenu();const b=e.target.closest('[data-action]');if(b){if(b.dataset.action==='view')viewItem(b.dataset.kind,b.dataset.id);else deleteItem(b.dataset.kind,b.dataset.id)}});$('quickAdd').onclick=()=>{showPage('records');openForm('records')};$('addRecord').onclick=()=>openForm('records');$('addMinutes').onclick=()=>openForm('minutes');$('addAnalysis').onclick=()=>openForm('analysis');$('recordSearch').oninput=renderAll;$('minutesType').onchange=renderAll;$('minutesFollow').onchange=renderAll;$('closeModal').onclick=closeModal;$('modalOverlay').onclick=e=>{if(e.target===$('modalOverlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select')&&modalOpen)setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const el=document.activeElement;if(modalOpen&&el&&el.matches('input,textarea,select'))setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),100)});await loadAll()}
