<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("ee3d8751d7a3b047_易经64卦分析")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;

/**

const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));

    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';

                        }

                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符

                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function toggleLanguage(){const next=language==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',next);applyLanguage(next);closeMenu();}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false');}
function showPage(page,remember=true){if(!$("page-"+page))return;if(page!==currentPage&&remember)historyStack.push({page:currentPage,y:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='history')loadHistory();if(page==='statistics')loadStatistics();if(page==='home')loadHome();}
function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden';}
function closeModal(id){$(id).classList.remove('open');if(!document.querySelector('.modal.open'))document.body.style.overflow='';}
function airBack(){const open=Array.from(document.querySelectorAll('.modal.open'));if(open.length){closeModal(open[open.length-1].id);return 'false';}if(historyStack.length){const old=historyStack.pop();showPage(old.page,false);requestAnimationFrame(()=>window.scrollTo(0,old.y));return 'false';}return 'true';}window.airBack=airBack;
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),4500);}
function bridgeError(err){toast(tr('failed')+String(err));}
function csvRows(text){return parseCSV(String(text||'')).filter(row=>row.some(cell=>String(cell).trim()!==''));}
function normalizedDate(value){return String(value||'').slice(0,10).replaceAll('/','-');}
function sortRows(items){return items.sort((a,b)=>normalizedDate(b.date).localeCompare(normalizedDate(a.date))||a.row-b.row);}
async function getHistoryRows(){const raw=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:'日期,占何事,卦象'});return sortRows(csvRows(raw).map((a,i)=>({row:i+1,date:a[0]||'',question:a[1]||'',hexagram:a[2]||''})));}
async function loadHome(){try{const [countText,dateText,recentText]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'日期'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'日期,占何事,卦象'})]);$('totalCount').textContent=String(countText).trim()||'0';$('todayCount').textContent=csvRows(dateText).filter(row=>normalizedDate(row[0])===localDate()).length;rows=sortRows(csvRows(recentText).map((a,i)=>({row:i+1,date:a[0]||'',question:a[1]||'',hexagram:a[2]||''})));renderRecent();}catch(err){bridgeError(err);}}
function renderRecent(){const items=rows.slice(0,3);$('recentList').innerHTML=items.length?items.map(item=>`<button class="recent-item" type="button" data-recent-row="${item.row}"><span><small>${escapeHTML(item.date)}</small><strong>${escapeHTML(item.question)}</strong><span class="muted">${escapeHTML(item.hexagram)}</span></span><i class="fa-solid fa-angle-right"></i></button>`).join(''):`<div class="empty">${tr('noData')}</div>`;}
async function loadHistory(){try{rows=await getHistoryRows();renderHistory();}catch(err){bridgeError(err);}}
function renderHistory(){const term=$('historySearch').value.trim().toLocaleLowerCase();const matches=rows.filter(x=>(x.question+' '+x.hexagram).toLocaleLowerCase().includes(term));$('historyBody').innerHTML=matches.length?matches.map(item=>`<tr><td>${escapeHTML(item.date)}</td><td>${escapeHTML(item.question)}</td><td>${escapeHTML(item.hexagram)}</td><td><div class="actions"><button class="tiny" type="button" data-action="detail" data-row="${item.row}" title="${tr('view')}"><i class="fa-regular fa-eye"></i></button><button class="tiny secondary" type="button" data-action="edit" data-row="${item.row}" title="${tr('edit')}"><i class="fa-solid fa-pen"></i></button><button class="tiny danger" type="button" data-action="delete" data-row="${item.row}" title="${tr('delete')}"><i class="fa-solid fa-trash"></i></button></div></td></tr>`).join(''):`<tr><td colspan="4" class="empty">${tr('noData')}</td></tr>`;}
function downloadImagesIn(root){root.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(src&&!/^https?:|^data:/i.test(src))img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);img.title=language==='cn'?'点击下载图片':'Click to download image';img.addEventListener('click',()=>{const a=document.createElement('a');a.href=img.src;a.download='';document.body.append(a);a.click();a.remove();});});}
function renderMarkdown(target,source){const html=window.marked?marked.parse(String(source||''),{gfm:true,breaks:true}):escapeHTML(source).replaceAll('\n','<br>');target.innerHTML=window.DOMPurify?DOMPurify.sanitize(html,{ADD_ATTR:['target']}):html;downloadImagesIn(target);target.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer';});}
async function showDetail(row){const item=rows.find(x=>x.row===row);if(!item)return;$('detailMeta').innerHTML=`<div><small>${tr('date')}</small>${escapeHTML(item.date)}</div><div><small>${tr('question')}</small>${escapeHTML(item.question)}</div><div><small>${tr('hexagram')}</small>${escapeHTML(item.hexagram)}</div>`;$('detailMarkdown').textContent=tr('loading');openModal('detailModal');try{const result=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'分析结果/'+row});if($('detailModal').classList.contains('open'))renderMarkdown($('detailMarkdown'),result||tr('resultPending'));}catch(err){$('detailMarkdown').textContent=tr('failed')+String(err);}}
const NEW_FIELDS=[{name:'记录ID',kind:'hidden'},{name:'日期',kind:'date',required:true},{name:'占何事',kind:'textarea',required:true},{name:'卦象',kind:'text',required:true}];
function fieldHTML(formId,field,value=''){const id=formId+'_'+field.name;const content=escapeHTML(value);if(field.kind==='hidden')return `<input id="${id}" name="${field.name}" type="hidden" value="${content}">`;const label=tr(({日期:'date',占何事:'question',卦象:'hexagram',记录ID:'id',分析结果:'analysis'})[field.name]);const control=field.kind==='textarea'?`<textarea id="${id}" name="${field.name}" ${field.required?'required':''}>${content}</textarea>`:`<input id="${id}" name="${field.name}" type="${field.kind}" value="${content}" ${field.required?'required':''} ${field.name==='卦象'?'placeholder="0,1,1,0,0,1"':''}>`;return `<div class="field"><label for="${id}">${label}</label>${control}${field.name==='卦象'?'<span class="hint">0,1,1,0,0,1</span>':''}</div>`;}
function renderForm(){const prior=Object.fromEntries(new FormData($('divinationForm')).entries());$('divinationFields').innerHTML=NEW_FIELDS.map(field=>fieldHTML('divinationForm',field,prior[field.name]??(field.name==='日期'?localDate():field.name==='记录ID'?String(Date.now())+String(Math.floor(Math.random()*1000000)).padStart(6,'0'):''))).join('');}
function formValues(form){return Object.fromEntries(new FormData(form).entries());}
function validate(values){if(!values['占何事'].trim())return tr('required');if(!/^[01](\s*,\s*[01]){5}$/.test(values['卦象'].trim()))return tr('invalid');values['卦象']=values['卦象'].split(',').map(x=>x.trim()).join(',');return '';}
function directiveFor(values){return DIRECTIVE.replaceAll('{{日期}}',values['日期']).replaceAll('{{占何事}}',values['占何事']).replaceAll('{{卦象}}',values['卦象']);}
async function submitDivination(event){event.preventDefault();if(polling)return;const values=formValues($('divinationForm'));const error=validate(values);$('formError').textContent=error;if(error)return;values['分析结果']=directiveFor(values);$('submitDivination').disabled=true;try{await callAppBridge({type:'SubmitRecord',data:SUBMIT_TABLE,payload:JSON.stringify(values)});polling=true;pollStarted=Date.now();$('resultArea').className='loading';$('resultArea').innerHTML=`<i class="fa-solid fa-yin-yang"></i><p>${tr('loading')}</p>`;await loadHome();pollAnalysis(1);}catch(err){$('submitDivination').disabled=false;bridgeError(err);}}
async function pollAnalysis(row){if(!polling)return;if(Date.now()-pollStarted>=1800000){finishPolling(tr('timeout'));return;}try{const result=String(await callAppBridge({type:'轮询',data:SUBMIT_TABLE,payload:'分析结果'})||'').trim();if(result){finishPolling(result,true);return;}}catch(err){bridgeError(err);}pollTimer=setTimeout(()=>pollAnalysis(row),1000);}
function finishPolling(text,isMarkdown=false){polling=false;clearTimeout(pollTimer);$('submitDivination').disabled=false;$('resultArea').className=isMarkdown?'markdown-body':'result-empty';if(isMarkdown)renderMarkdown($('resultArea'),text);else $('resultArea').textContent=text;}
async function editRecord(row){editRow=row;$('editError').textContent='';$('editFields').innerHTML=`<div class="loading"><i class="fa-solid fa-yin-yang"></i></div>`;openModal('editModal');try{const fields=['记录ID','日期','占何事','卦象','分析结果'];const values=[];for(const field of fields){values.push(await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row}));}if(editRow!==row)return;const defs=[{name:'记录ID',kind:'text'},{name:'日期',kind:'date',required:true},{name:'占何事',kind:'textarea',required:true},{name:'卦象',kind:'text',required:true},{name:'分析结果',kind:'textarea'}];$('editFields').innerHTML=defs.map((f,i)=>fieldHTML('editForm',f,values[i])).join('');}catch(err){$('editError').textContent=tr('failed')+String(err);}}
async function saveEdit(event){event.preventDefault();if(editRow===null)return;const values=formValues($('editForm'));const error=validate(values);$('editError').textContent=error;if(error)return;$('saveEdit').disabled=true;try{for(const field of ['记录ID','日期','占何事','卦象','分析结果'])await callAppBridge({type:'SetCellValue',data:TABLE,payload:field+'/'+editRow+'/'+(values[field]||'')});closeModal('editModal');editRow=null;toast(tr('saved'));await loadHistory();await loadHome();}catch(err){$('editError').textContent=tr('failed')+String(err);}finally{$('saveEdit').disabled=false;}}
async function deleteRecord(row){if(!confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});toast(tr('deleted'));await loadHistory();await loadHome();}catch(err){bridgeError(err);}}
function chartTheme(){return {chart:{backgroundColor:'transparent',style:{fontFamily:"'Songti SC','SimSun',serif"}},title:{text:null},credits:{enabled:false},legend:{enabled:false},xAxis:{labels:{style:{color:getComputedStyle(document.body).getPropertyValue('--ink')}}},yAxis:{title:{text:null},min:0,allowDecimals:false,labels:{style:{color:getComputedStyle(document.body).getPropertyValue('--ink')}}},colors:['#a6483c','#38584d']};}
async function loadStatistics(){try{const [datesText,questionsText,hexText]=await Promise.all([callAppBridge({type:'GetTableCSV',data:TABLE,payload:'日期'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'占何事'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'卦象'})]);const dates=csvRows(datesText).map(x=>x[0]);const questions=csvRows(questionsText).map(x=>x[0]);const hexagrams=csvRows(hexText).map(x=>x[0]);const count=values=>{const m=new Map();values.filter(Boolean).forEach(v=>m.set(v,(m.get(v)||0)+1));return m;};const month=count(dates.map(x=>normalizedDate(x).slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)));window._stats={month:[...month].sort((a,b)=>a[0].localeCompare(b[0])),questions:[...count(questions)].sort((a,b)=>b[1]-a[1]),hexagrams:[...count(hexagrams)].sort((a,b)=>b[1]-a[1])};renderStatistics();}catch(err){bridgeError(err);}}
function renderStatistics(){const stats=window._stats;if(!stats)return;$('keywordList').innerHTML=stats.questions.length?stats.questions.map(([word,count])=>`<span class="keyword">${escapeHTML(word)} <b>×${count}</b></span>`).join(''):`<div class="empty">${tr('noData')}</div>`;if(!window.Highcharts){$('monthlyChart').textContent=tr('noData');$('hexagramChart').textContent=tr('noData');return;}charts.forEach(c=>c.destroy());const base=chartTheme();charts=[Highcharts.chart('monthlyChart',{...base,xAxis:{...base.xAxis,categories:stats.month.map(x=>x[0])},series:[{type:'line',name:tr('monthlyTrend'),data:stats.month.map(x=>x[1])}]}),Highcharts.chart('hexagramChart',{...base,xAxis:{...base.xAxis,categories:stats.hexagrams.slice(0,12).map(x=>x[0])},series:[{type:'column',name:tr('popularHexagrams'),data:stats.hexagrams.slice(0,12).map(x=>x[1])}]})];}
function enableKeyboardVisibility(){document.addEventListener('focusin',event=>{if(!event.target.matches('input,textarea,select'))return;setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),250);});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100);});}
async function initialize(){try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色');}catch{document.body.classList.toggle('dark',window.matchMedia('(prefers-color-scheme: dark)').matches);}applyLanguage(decideLanguage());$('brandButton').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);});$('menuButton').addEventListener('click',event=>{event.stopPropagation();const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open));});document.addEventListener('click',event=>{if(!event.target.closest('#menuWrap'))closeMenu();const nav=event.target.closest('[data-page]');if(nav)showPage(nav.dataset.page);const close=event.target.closest('[data-close]');if(close)closeModal(close.dataset.close);if(event.target.classList.contains('modal'))closeModal(event.target.id);const recent=event.target.closest('[data-recent-row]');if(recent){const row=Number(recent.dataset.recentRow);showPage('history');showDetail(row);}const action=event.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);if(action.dataset.action==='detail')showDetail(row);if(action.dataset.action==='edit')editRecord(row);if(action.dataset.action==='delete')deleteRecord(row);}});$('desktopLanguage').addEventListener('click',toggleLanguage);$('mobileLanguage').addEventListener('click',toggleLanguage);$('heroStart').addEventListener('click',()=>showPage('divination'));$('newDivination').addEventListener('click',()=>showPage('divination'));$('historySearch').addEventListener('input',renderHistory);$('divinationForm').addEventListener('submit',submitDivination);$('editForm').addEventListener('submit',saveEdit);document.addEventListener('keydown',event=>{if(event.key==='Escape'){const open=Array.from(document.querySelectorAll('.modal.open'));if(open.length)closeModal(open[open.length-1].id);else closeMenu();}});enableKeyboardVisibility();await loadHome();}
function updateNavLayout(){document.body.classList.remove('compact-nav');if(innerWidth<=760)return;const inner=$('navInner'),brand=$('brandButton'),nav=$('desktopNav');if(brand.scrollWidth+nav.scrollWidth+72>inner.clientWidth)document.body.classList.add('compact-nav');}
const originalApplyLanguage=applyLanguage;
applyLanguage=function(lang){originalApplyLanguage(lang);updateNavLayout();};
window.addEventListener('resize',updateNavLayout);
document.addEventListener('DOMContentLoaded',()=>{(async () => {    await initialize();  })();});
</script>
</body>
