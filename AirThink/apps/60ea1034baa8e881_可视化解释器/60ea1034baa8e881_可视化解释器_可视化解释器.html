<style>

w);backdrop-filter:blur(14px)}.stat{padding:23px;min-height:145px;position:relative;overflow:hidden}.stat .label{color:var(--muted);font-size:13px}.stat .number{font:800 42px/1.2 ui-monospace,monospace;margin-top:14px}.stat i{position:absolute;right:23px;top:24px;color:var(--blue);font-size:25px}.distribution{display:flex;align-items:center;gap:14px;margin-top:22px}.distribution>span{white-space:nowrap;font-size:12px;color:var(--muted)}.bar{display:flex;flex:1;height:10px;min-width:25px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar span:first-child{background:var(--blue)}.bar span:last-child{background:var(--green)}.recent-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.recent-card{width:100%;min-height:155px;padding:20px;text-align:left;color:var(--text);transition:transform .15s,border-color .15s}.recent-card:hover{transform:translateY(-3px);border-color:var(--blue)}.recent-card .file-icon{color:var(--blue);font-size:19px}.recent-card h3{font-size:15px;line-height:1.5;min-height:45px;margin:17px 0 13px;overflow-wrap:anywhere}.badge-row{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;color:var(--green);background:rgba(78,201,176,.12);border:1px solid rgba(78,201,176,.2)}.badge.blue{color:var(--blue);background:rgba(86,156,214,.11);border-color:rgba(86,156,214,.2)}
.work-grid{display:grid;grid-template-columns:minmax(330px,.82fr) minmax(0,1.18fr);gap:22px;margin-top:23px;align-items:start}.panel{padding:24px}.panel h2{font-size:20px;margin:0 0 21px}.form-grid{display:grid;gap:17px}.field{display:grid;gap:8px}.field label{font-size:13px;font-weight:700;color:var(--muted)}.control{width:100%;min-width:0;min-height:44px;padding:11px 12px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:9px;outline:0}.control:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(86,156,214,.15)}textarea.control{resize:vertical;min-height:132px}.file-row{display:flex;gap:8px;min-width:0}.file-row .control{flex:1}.file-row .btn{flex:none}.submit-row{display:flex;gap:10px;margin-top:8px}.submit-row .btn{flex:1}.result-panel{min-height:620px;display:flex;flex-direction:column}.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.result-head h2{margin-bottom:0}.result-actions{display:flex;gap:7px;flex-wrap:wrap}.result-body{flex:1;min-height:500px;margin-top:21px;border:1px dashed var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}.result-placeholder{height:100%;min-height:500px;display:grid;place-content:center;text-align:center;color:var(--muted);padding:30px}.result-placeholder i{font-size:37px;color:var(--blue);margin-bottom:17px}.result-placeholder strong{color:var(--text);font-size:17px}.result-placeholder p{line-height:1.6}.preview-frame{width:100%;height:600px;border:0;background:white}.reset-wrap{margin-top:18px}.loading-spin{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:1100px){.recent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.work-grid{grid-template-columns:1fr}.result-panel{min-height:520px}.preview-frame{height:520px}}@media(max-width:720px){.nav-links,.topbar>.lang-btn{display:none}.menu-btn{display:block}.topbar{padding:0 16px;min-height:62px}.shell{padding:24px 15px 180px}.hero{padding:38px 24px}.stats{grid-template-columns:1fr}.history-top{align-items:stretch;flex-direction:column}.history-top .btn{align-self:flex-start}.history-card{grid-template-columns:1fr}.history-actions{justify-content:flex-start}.filters .control{max-width:none;flex:1;min-width:145px}.modal-layer{padding:10px}.modal{max-height:calc(100dvh - 20px)}.modal-layer.preview-layer{padding:0}.preview-layer .modal{width:100%;height:100dvh;max-height:100dvh;border-radius:0}.preview-layer .modal-scroll{padding:0;flex:1}.preview-layer .modal-scroll iframe{height:100%;min-height:0}.modal-scroll{padding-bottom:260px}.brand{font-size:16px}.brand-icon{width:35px;height:35px}.result-body,.result-placeholder{min-height:380px}}

<body>
<header class="topbar" id="topbar"><button class="brand" id="brandButton" type="button"><span class="brand-icon"><i class="fa-solid fa-diagram-project"></i></span><span data-i18n="appName">可视化解释器</span></button><nav class="nav-links" id="desktopNav"><button class="nav-btn active" type="button" data-page="home" data-i18n="home">首页</button><button class="nav-btn" type="button" data-page="create" data-i18n="create">新建可视化</button><button class="nav-btn" type="button" data-page="history" data-i18n="history">历史记录</button></nav><button class="lang-btn" id="desktopLanguage" type="button">EN</button><button class="menu-btn" id="menuButton" type="button" aria-expanded="false" aria-label="Menu"><i class="fa-solid fa-bars"></i></button><div class="mobile-menu" id="mobileMenu"><button class="nav-btn active" type="button" data-page="home" data-i18n="home">首页</button><button class="nav-btn" type="button" data-page="create" data-i18n="create">新建可视化</button><button class="nav-btn" type="button" data-page="history" data-i18n="history">历史记录</button><button class="lang-btn" id="mobileLanguage" type="button">English</button></div></header>
<main class="shell"><section class="page active" id="page-home"><div class="hero"><div class="eyebrow">VISUAL INTELLIGENCE / WORKSPACE</div><h1 data-i18n="appName">可视化解释器</h1><p data-i18n="heroText">输入源文件与解释要求，一键生成精美架构图、流程图与数据仪表盘。</p><button class="btn primary" id="heroCreate" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="createVisual">创建可视化</span></button></div><div class="section-heading"><h2 data-i18n="overview">工作概览</h2></div><div class="stats"><div class="card stat"><span class="label" data-i18n="totalCount">总生成次数</span><i class="fa-solid fa-layer-group"></i><div class="number" id="totalCount">—</div></div><div class="card stat"><span class="label" data-i18n="distribution">各类形式分布</span><i class="fa-solid fa-chart-pie"></i><div class="distribution"><span id="htmlCount">HTML 0</span><div class="bar" id="distributionBar"><span></span><span></span></div><span id="slidesCount">0 Slides</span></div></div></div><div class="section-heading"><h2 data-i18n="recent">最近生成记录</h2><button class="btn small ghost" id="viewAll" type="button"><span data-i18n="viewAll">查看全部</span><i class="fa-solid fa-arrow-right"></i></button></div><div class="recent-grid" id="recentGrid"></div></section>
<section class="page" id="page-create"><div class="eyebrow">CONFIGURATION / OUTPUT</div><div class="section-heading"><div><h1 class="page-title" data-i18n="taskConfig">任务配置</h1><p class="page-intro" data-i18n="createIntro">选择源文件并描述希望呈现的内容。</p></div></div><div class="work-grid"><div class="card panel"><h2 data-i18n="generationConfig">生成配置</h2><form id="createForm" class="form-grid"><div class="field"><label for="createForm_sourceFile" data-i18n="sourceFile">源文件</label><div class="file-row"><input class="control" id="createForm_sourceFile" name="源文件" readonly required><button class="btn small" id="selectFileButton" type="button"><i class="fa-solid fa-folder-open"></i><span data-i18n="selectFile">选择文件</span></button></div></div><div class="field"><label for="createForm_prompt" data-i18n="prompt">解释要求</label><textarea class="control" id="createForm_prompt" name="解释要求" required data-placeholder="promptPlaceholder"></textarea></div><div class="field"><label for="createForm_contentType" data-i18n="contentType">内容类型</label><select class="control" id="createForm_contentType" name="内容类型"></select></div><div class="field"><label for="createForm_outputType" data-i18n="outputType">输出形式</label><select class="control" id="createForm_outputType" name="输出形式"></select></div><div class="field"><label for="createForm_style" data-i18n="style">视觉风格</label><select class="control" id="createForm_style" name="视觉风格"></select></div><div class="submit-row"><button class="btn primary" id="submitCreate" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="generate">生成可视化</span></button></div></form><div class="reset-wrap"><button class="btn ghost small" id="resetCreate" type="button"><i class="fa-solid fa-rotate-left"></i><span data-i18n="reset">清空重置</span></button></div></div><div class="card panel result-panel"><div class="result-head"><h2 data-i18n="visualResult">可视化结果</h2><div class="result-actions" id="resultActions" hidden><button class="btn small" id="openResult" type="button"><i class="fa-solid fa-arrow-up-right-from-square"></i><span data-i18n="openTab">在新标签页打开</span></button><button class="btn small" id="downloadResult" type="button"><i class="fa-solid fa-download"></i><span data-i18n="downloadFile">下载文件</span></button></div></div><div class="result-body" id="resultBody"><div class="result-placeholder"><i class="fa-solid fa-code-branch"></i><strong data-i18n="waitingInput">等待任务输入...</strong></div></div></div></div></section>
<section class="page" id="page-history"><div class="history-top"><div><div class="eyebrow">ARCHIVE / GENERATED FILES</div><h1 class="page-title" style="margin-top:8px" data-i18n="history">历史记录</h1><p class="page-intro" data-i18n="historyIntro">查看和管理过去生成的可视化文件</p></div><button class="btn primary" id="historyCreate" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="create">新建可视化</span></button></div><div class="filters"><input class="control" id="historySearch" type="search" data-placeholder="searchPlaceholder" aria-label="Search"><select class="control" id="historyTypeFilter" aria-label="Content type"></select></div><div class="history-list" id="historyList"></div><div style="text-align:center;margin-top:18px"><button class="btn" id="historyMore" type="button" hidden data-i18n="more">查看更多</button></div></section></main>
<div class="modal-layer preview-layer" id="previewLayer"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="previewTitle"><div class="modal-head"><h2 id="previewTitle" data-i18n="viewResult">查看结果</h2><div class="modal-head-actions"><button class="btn small" id="previewDownload" type="button"><i class="fa-solid fa-download"></i><span data-i18n="download">下载</span></button><button class="icon-btn" id="closePreview" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div></div><div class="modal-scroll" id="previewContent"></div></div></div>
<div class="modal-layer" id="editLayer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal-head"><h2 id="editTitle" data-i18n="editConfig">编辑配置</h2><button class="icon-btn" id="closeEdit" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-scroll"><form id="editForm" class="form-grid"><div class="field"><label for="editForm_prompt" data-i18n="prompt">解释要求</label><textarea class="control" id="editForm_prompt" name="解释要求" required></textarea></div><div class="field"><label for="editForm_contentType" data-i18n="contentType">内容类型</label><select class="control" id="editForm_contentType" name="内容类型"></select></div><div class="field"><label for="editForm_outputType" data-i18n="outputType">输出形式</label><select class="control" id="editForm_outputType" name="输出形式"></select></div><div class="field"><label for="editForm_style" data-i18n="style">视觉风格</label><select class="control" id="editForm_style" name="视觉风格"></select></div></form></div><div class="modal-foot"><button class="btn" id="editCancel" type="button" data-i18n="cancel">取消</button><button class="btn primary" id="editSave" type="button" data-i18n="save">保存</button></div></div></div>
<div class="modal-layer" id="deleteLayer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><div class="modal-head"><h2 id="deleteTitle" data-i18n="confirmDelete">确认删除</h2><button class="icon-btn" id="closeDelete" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-scroll"><p data-i18n="deleteWarning">确定删除这条记录吗？此操作无法撤销。</p></div><div class="modal-foot"><button class="btn" id="deleteCancel" type="button" data-i18n="cancel">取消</button><button class="btn danger" id="deleteConfirm" type="button" data-i18n="delete">删除</button></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }

                        }));

                }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {

}

function capturePhotoA() {

    `;
    
    // 创建拍照按钮

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {

             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }
