<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];

        if (!file.type.startsWith('image/')) {

        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {

      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

const I18N={cn:{brand:'语桥 · 多语种实时翻译',home:'首页',translate:'即时翻译',records:'翻译记录',hero:'语桥 · 开口即译',heroDesc:'自动识别源语言，支持数十种语言互译，译文附带标准发音朗读，适合日常交流、学习与出行',start:'开始即时翻译',total:'总翻译次数',topLang:'最常用目标语言',directions:'语言方向覆盖',recent:'最近翻译',viewAll:'查看全部',translateDesc:'输入或粘贴原文，选择语言，一键获得译文与标准发音',viewRecords:'查看翻译记录',sourceLang:'源语言',targetLang:'目标语言',original:'原文',output:'译文与朗读',sourcePlaceholder:'输入或粘贴要翻译的文字…',translateAction:'翻译',newTranslation:'新的翻译',recordsDesc:'回看每一次跨越语言的对话，支持检索、再译与删除',searchPlaceholder:'搜索原文关键词',more:'查看更多',detail:'翻译详情',edit:'编辑',editRecord:'编辑翻译记录',save:'保存修改',retranslate:'按当前内容重新翻译',auto:'自动识别',allSource:'全部源语言',allTarget:'全部目标语言',empty:'暂无记录',noResult:'没有符合条件的记录',resultHint:'译文将在这里以图文和语音呈现',waiting:'正在跨越语桥，生成译文与标准发音…',timeout:'翻译等待超时，请稍后在记录中查看',copy:'已复制译文',delete:'删除',again:'再次翻译',viewDetail:'查看详情',confirmDelete:'确定删除这条翻译记录？',loading:'正在加载…',download:'下载语音',error:'操作失败',saved:'已保存',none:'暂无',cancel:'取消'},en:{brand:'Lingua Bridge · Live Translation',home:'Home',translate:'Translate',records:'History',hero:'Speak freely, translate instantly',heroDesc:'Detect the source language automatically, translate across dozens of languages, and hear a natural pronunciation for travel, study and daily conversation.',start:'Start translating',total:'Total translations',topLang:'Top target language',directions:'Language directions',recent:'Recent translations',viewAll:'View all',translateDesc:'Enter or paste text, choose languages, and get a translation with pronunciation.',viewRecords:'View history',sourceLang:'Source language',targetLang:'Target language',original:'Original text',output:'Translation & audio',sourcePlaceholder:'Enter or paste text to translate…',translateAction:'Translate',newTranslation:'New translation',recordsDesc:'Revisit your conversations. Search, translate again, or delete.',searchPlaceholder:'Search original text',more:'Show more',detail:'Translation details',edit:'Edit',editRecord:'Edit translation',save:'Save changes',retranslate:'Translate current text again',auto:'Auto detect',allSource:'All source languages',allTarget:'All target languages',empty:'No translations yet',noResult:'No matching translations',resultHint:'Your translation and audio will appear here',waiting:'Crossing the bridge—generating translation and pronunciation…',timeout:'Translation timed out. Check history later.',copy:'Translation copied',delete:'Delete',again:'Translate again',viewDetail:'View details',confirmDelete:'Delete this translation?',loading:'Loading…',download:'Download audio',error:'Action failed',saved:'Saved',none:'None',cancel:'Cancel'}};
let uiLang='cn',mode='暗色',page='home',historyStack=[],currentRow=0,detailRow=0,recordCount=0,records=[],visibleCount=12,busy=false,pollToken=0,translationMarkdown='';
const $=id=>document.getElementById(id), tr=k=>I18N[uiLang][k]||k;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function plain(md){return String(md||'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/<[^>]*>/g,'').replace(/[`*_~>#|]/g,'').replace(/\s+/g,' ').trim();}
function trimText(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;}
function langName(v){let i=LANGS.indexOf(v);return uiLang==='en'&&i>=0?EN_LANGS[i]:v==='自动识别'?tr('auto'):v;}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3200);}
function safeCSV(text){return parseCSV(String(text||'')).filter(r=>r.some(x=>String(x).trim()!==''));}
function fillLanguages(){for(const id of ['sourceLang','targetLang','editForm_sourceLang','editForm_targetLang']){const el=$(id),value=el.value;el.innerHTML='';const list=id.includes('source')||id.includes('sourceLang')?['自动识别',...LANGS]:LANGS;for(const v of list){const o=document.createElement('option');o.value=v;o.textContent=langName(v);el.append(o)}el.value=value||((id.includes('target')||id.includes('targetLang'))?'英语':'自动识别');}for(const [id,all] of [['sourceFilter','allSource'],['targetFilter','allTarget']]){const el=$(id),value=el.value;el.innerHTML='<option value="">'+esc(tr(all))+'</option>';for(const v of (id==='sourceFilter'?['自动识别',...LANGS]:LANGS)){const o=document.createElement('option');o.value=v;o.textContent=langName(v);el.append(o)}el.value=value;}}
function setLanguage(value){uiLang=value==='en'?'en':'cn';document.documentElement.lang=uiLang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.placeholder));$('desktopLangBtn').textContent=uiLang==='cn'?'EN':'中文';fillLanguages();renderPhrases();renderTargetChips();renderRecent();renderRecords();if(!translationMarkdown&&!busy)$('translationResult').textContent=tr('resultHint');updateStatsDisplay();}
function chooseLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn';const param=new URLSearchParams(location.search).get('lang');if(param==='en'||param==='cn')return param;try{const list=navigator.languages;if(!list||!list.length)return'cn';return list.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}catch{return'cn'}}
function renderPhrases(){const phrases=['请问洗手间在哪里？','How much is this?','メニューをください','Dónde está la estación?'];$('phraseRow').innerHTML='';for(const p of phrases){const b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>{newTranslation(false);$('sourceText').value=p;updateInput();navigate('translate')};$('phraseRow').append(b)}}
function renderTargetChips(){const host=$('targetChips');host.innerHTML='';for(const v of ['中文','英语','日语','韩语','法语','西班牙语','德语','阿拉伯语']){const b=document.createElement('button');b.className='chip'+($('targetLang').value===v?' active':'');b.textContent=langName(v);b.onclick=()=>{$('targetLang').value=v;renderTargetChips()};host.append(b)}}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false')}
function navigate(next,fromBack=false){if(next===page&&!fromBack){closeMenu();return}if(!fromBack)historyStack.push({page,scroll:scrollY});page=next;document.querySelectorAll('.page').forEach(x=>x.hidden=x.id!=='page-'+page);document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='records')loadRecords();if(page==='home')loadHome();if(page==='translate')updateNavButtons()}
function airBack(){if(!$('editOverlay').hidden){closeEdit();return'false'}if(!$('detailOverlay').hidden){closeDetail();return'false'}if(!$('mobileMenu').classList.contains('open')){}else{closeMenu();return'false'}if(historyStack.length){const prev=historyStack.pop();navigate(prev.page,true);setTimeout(()=>scrollTo(0,prev.scroll),0);return'false'}return'true'}window.airBack=airBack;
async function bridge(req){return await callAppBridge(req)}
async function countRecords(){const n=parseInt(await bridge({type:'GetRecordCount',data:TABLE}),10);recordCount=Number.isFinite(n)?n:0;updateNavButtons();return recordCount}
async function fetchRecords(){const csv=await bridge({type:'GetTableCSV',data:TABLE,payload:'原文,源语言,目标语言,翻译结果'});records=safeCSV(csv).map((r,i)=>({row:i+1,original:r[0]||'',source:r[1]||'',target:r[2]||'',result:r[3]||''}));return records}
function updateStatsDisplay(){if(window.homeStats){$('totalStat').textContent=String(window.homeStats.count);$('topLangStat').textContent=window.homeStats.top?langName(window.homeStats.top)+' · '+window.homeStats.topCount:tr('none');$('directionStat').textContent=String(window.homeStats.directions)}}
async function loadHome(){try{const [count,targets,pairs]=await Promise.all([bridge({type:'GetRecordCount',data:TABLE}),bridge({type:'GetTableCSV',data:TABLE,payload:'目标语言'}),bridge({type:'GetTableCSV',data:TABLE,payload:'源语言,目标语言'})]);const tally={};for(const r of safeCSV(targets)){const v=r[0];if(v)tally[v]=(tally[v]||0)+1}const top=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0]||'';const directions=new Set(safeCSV(pairs).filter(r=>r[0]&&r[1]).map(r=>r[0]+'→'+r[1])).size;window.homeStats={count:Number(count)||0,top,topCount:tally[top]||0,directions};updateStatsDisplay();await fetchRecords();renderRecent()}catch(e){toast(tr('error')+': '+e.message)}}
function cardHTML(r,recent){return '<article class="card record-card" data-row="'+r.row+'"><div><span class="source-tag">'+esc(langName(r.source))+'</span> <i class="fa-solid fa-arrow-right small"></i> <span class="target-tag">'+esc(langName(r.target))+'</span></div><h3>'+esc(trimText(r.original,recent?60:120))+'</h3><p>'+esc(trimText(plain(r.result),recent?80:100))+'</p>'+(recent?'':'<div class="actions"><button class="secondary" type="button" data-action="detail">'+esc(tr('viewDetail'))+'</button><button class="secondary" type="button" data-action="again">'+esc(tr('again'))+'</button><button class="danger" type="button" data-action="delete">'+esc(tr('delete'))+'</button></div>')+'</article>'}
function renderRecent(){const rows=records.slice(0,5);$('recentList').innerHTML=rows.length?rows.map(r=>cardHTML(r,true)).join(''):'<div class="card empty">'+esc(tr('empty'))+'</div>'}
async function loadRecords(){try{await Promise.all([fetchRecords(),countRecords()]);renderRecords()}catch(e){toast(tr('error')+': '+e.message)}}
function renderRecords(){const q=$('searchInput').value.trim().toLocaleLowerCase(),s=$('sourceFilter').value,t=$('targetFilter').value;const rows=records.filter(r=>r.original.toLocaleLowerCase().includes(q)&&(!s||r.source===s)&&(!t||r.target===t));$('recordList').innerHTML=rows.length?rows.slice(0,visibleCount).map(r=>cardHTML(r,false)).join(''):'<div class="card empty">'+esc(records.length?tr('noResult'):tr('empty'))+'</div>';$('pager').hidden=rows.length<=visibleCount}
function updateInput(){$('charCount').textContent=String($('sourceText').value.length);$('translateBtn').disabled=busy||!$('sourceText').value.trim()}
function updateNavButtons(){$('prevBtn').disabled=busy||currentRow<=1;$('nextBtn').disabled=busy||currentRow===0||currentRow>=recordCount;$('copyBtn').disabled=!translationMarkdown}
function newTranslation(go=true){pollToken++;busy=false;currentRow=0;translationMarkdown='';$('sourceText').value='';$('sourceLang').value='自动识别';$('translationResult').className='result placeholder';$('translationResult').textContent=tr('resultHint');updateInput();updateNavButtons();if(go)navigate('translate')}
function renderMarkdown(md,host){const raw=window.marked?marked.parse(String(md||''),{gfm:true,breaks:true}):esc(md).replace(/\n/g,'<br>');host.innerHTML=window.DOMPurify?DOMPurify.sanitize(raw):raw;host.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});host.querySelectorAll('img').forEach(img=>{const a=document.createElement('a');a.href=img.src;a.download='';a.target='_blank';img.parentNode.insertBefore(a,img);a.append(img)});host.classList.add('markdown-body');const audio=findAudio(md);if(audio){const wrap=document.createElement('div');wrap.className='audio-wrap';const player=document.createElement('audio');player.controls=true;player.preload='none';player.src=audio.play;const link=document.createElement('a');link.className='secondary';link.href=audio.download;link.target='_blank';link.rel='noopener';link.textContent=tr('download');wrap.append(player,link);host.prepend(wrap)}}
function findAudio(md){const text=String(md||'');const links=[...text.matchAll(/(?:https?:\/\/[^\s)"'<>]+|[\w\u4e00-\u9fff.()\-]+\.(?:mp3|wav|m4a|ogg))/gi)].map(m=>m[0]);const item=links.find(x=>/\.(mp3|wav|m4a|ogg)(?:\?|$)/i.test(x));if(!item)return null;let name=item;try{name=decodeURIComponent(new URL(item).pathname.split('/').pop())}catch{name=item.split('/').pop()}return{play:'http://' + window.location.hostname + ':3130/private/'+encodeURIComponent(name),download:'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(name)}}
function displayResult(md){translationMarkdown=String(md||'');const host=$('translationResult');host.className='result';host.innerHTML='';if(md)renderMarkdown(md,host);else{host.classList.add('placeholder');host.textContent=tr('resultHint')}updateNavButtons()}
async function cell(field,row){return await bridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})}
async function readRow(row){const values={};for(const field of ['原文','源语言','目标语言','翻译结果'])values[field]=await cell(field,row);return values}
async function showRowInTranslate(row){try{const v=await readRow(row);currentRow=row;$('sourceText').value=v['原文'];$('sourceLang').value=v['源语言'];$('targetLang').value=v['目标语言'];renderTargetChips();displayResult(v['翻译结果']);updateInput();await countRecords();navigate('translate')}catch(e){toast(tr('error')+': '+e.message)}}
async function translateNow(){if(busy||!$('sourceText').value.trim())return;const data={'原文':$('sourceText').value.trim(),'源语言':$('sourceLang').value,'目标语言':$('targetLang').value};await submitTranslation(data)}
async function submitTranslation(data){busy=true;updateInput();updateNavButtons();const token=++pollToken;displayResult('');$('translationResult').classList.add('placeholder');$('translationResult').textContent=tr('waiting');try{await bridge({type:'SubmitRecord',data:SUBMIT_TABLE,payload:JSON.stringify(data)});currentRow=1;await countRecords();const started=Date.now();while(token===pollToken&&Date.now()-started<1800000){const value=await cell('翻译结果',1);if(String(value||'').trim()){displayResult(value);break}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken&&!translationMarkdown)$('translationResult').textContent=tr('timeout');await Promise.all([loadHome(),loadRecords()])}catch(e){if(token===pollToken){$('translationResult').textContent=tr('error')+': '+e.message;toast(tr('error')+': '+e.message)}}finally{if(token===pollToken){busy=false;updateInput();updateNavButtons()}}}
async function openDetail(row){detailRow=row;currentRow=row;$('detailOverlay').hidden=false;$('detailOverlay').classList.add('markdown-open');$('detailBody').textContent=tr('loading');try{const v=await readRow(row);if(detailRow!==row)return;const host=$('detailBody');host.innerHTML='<div><span class="source-tag">'+esc(langName(v['源语言']))+'</span> <i class="fa-solid fa-arrow-right"></i> <span class="target-tag">'+esc(langName(v['目标语言']))+'</span></div><h3>'+esc(tr('original'))+'</h3><p style="white-space:pre-wrap">'+esc(v['原文'])+'</p><h3>'+esc(tr('output'))+'</h3><div id="detailMarkdown"></div>';renderMarkdown(v['翻译结果'],$('detailMarkdown'))}catch(e){$('detailBody').textContent=tr('error')+': '+e.message}}
function closeDetail(){$('detailOverlay').hidden=true;$('detailOverlay').classList.remove('markdown-open')}
async function openEdit(){const row=detailRow;if(!row)return;$('editOverlay').hidden=false;try{for(const [field,id] of [['原文','editForm_original'],['源语言','editForm_sourceLang'],['目标语言','editForm_targetLang']])$(id).value=await cell(field,row)}catch(e){toast(tr('error')+': '+e.message)}}
function closeEdit(){$('editOverlay').hidden=true}
async function saveEdit(){const row=detailRow;if(!row)return;$('editSaveBtn').disabled=true;try{for(const [field,id] of [['原文','editForm_original'],['源语言','editForm_sourceLang'],['目标语言','editForm_targetLang']])await bridge({type:'SetCellValue',data:TABLE,payload:field+'/'+row+'/'+$(id).value});toast(tr('saved'));closeEdit();await Promise.all([loadHome(),loadRecords()]);await openDetail(row)}catch(e){toast(tr('error')+': '+e.message)}finally{$('editSaveBtn').disabled=false}}
async function retranslateEdited(){const data={'原文':$('editForm_original').value.trim(),'源语言':$('editForm_sourceLang').value,'目标语言':$('editForm_targetLang').value};if(!data['原文'])return;closeEdit();closeDetail();newTranslation(false);$('sourceText').value=data['原文'];$('sourceLang').value=data['源语言'];$('targetLang').value=data['目标语言'];renderTargetChips();updateInput();navigate('translate');await submitTranslation(data)}
async function deleteRow(row){if(!confirm(tr('confirmDelete')))return;try{await bridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});if(currentRow===row)currentRow=0;else if(currentRow>row)currentRow--;await Promise.all([loadHome(),loadRecords()]);updateNavButtons()}catch(e){toast(tr('error')+': '+e.message)}}
function bindEvents(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('brandBtn').onclick=()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)};$('menuBtn').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open))};document.addEventListener('pointerdown',e=>{if(!$('topbar').contains(e.target))closeMenu()});$('desktopLangBtn').onclick=$('mobileLangBtn').onclick=()=>{setLanguage(uiLang==='cn'?'en':'cn');localStorage.setItem('iThinkAir_UiLanguage',uiLang);closeMenu()};$('startBtn').onclick=()=>navigate('translate');$('allRecordsBtn').onclick=$('goRecordsBtn').onclick=()=>navigate('records');$('recordsNewBtn').onclick=$('newTranslateFab').onclick=()=>newTranslation();$('sourceText').oninput=updateInput;$('clearBtn').onclick=()=>{$('sourceText').value='';updateInput()};$('sourceLang').onchange=renderTargetChips;$('targetLang').onchange=renderTargetChips;$('swapBtn').onclick=()=>{const s=$('sourceLang').value,t=$('targetLang').value;$('sourceLang').value=t;$('targetLang').value=s==='自动识别'?'中文':s;if(s!=='自动识别'){const previous=$('sourceText').value;$('sourceText').value=plain(translationMarkdown)||previous;displayResult('')}renderTargetChips();updateInput()};$('translateBtn').onclick=translateNow;$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(plain(translationMarkdown));toast(tr('copy'))};$('prevBtn').onclick=()=>showRowInTranslate(currentRow-1);$('nextBtn').onclick=()=>showRowInTranslate(currentRow+1);for(const id of ['searchInput','sourceFilter','targetFilter'])$(id).addEventListener(id==='searchInput'?'input':'change',()=>{visibleCount=12;renderRecords()});$('moreBtn').onclick=()=>{visibleCount+=12;renderRecords()};for(const id of ['recentList','recordList'])$(id).onclick=e=>{const card=e.target.closest('[data-row]');if(!card)return;const row=Number(card.dataset.row),action=e.target.closest('[data-action]')?.dataset.action;if(action==='delete')deleteRow(row);else if(action==='again')showRowInTranslate(row);else openDetail(row)};$('detailOverlay').onclick=e=>{if(e.target===$('detailOverlay'))closeDetail()};$('detailCloseBtn').onclick=closeDetail;$('detailEditBtn').onclick=openEdit;$('editOverlay').onclick=e=>{if(e.target===$('editOverlay'))closeEdit()};$('editCloseBtn').onclick=closeEdit;$('editSaveBtn').onclick=saveEdit;$('editRetranslateBtn').onclick=retranslateEdited;document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const e=document.activeElement;if(e&&e.matches('input,textarea,select'))setTimeout(()=>e.scrollIntoView({block:'center',behavior:'smooth'}),150)})}
async function initialize(){setLanguage(chooseLanguage());bindEvents();try{mode=await bridge({type:'模式'});document.body.classList.toggle('light',String(mode).trim()==='亮色')}catch{}newTranslation(false);navigate('home',true);await loadHome();await countRecords()}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
</script>
