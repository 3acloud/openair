<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串

function t(key){return (i18n[state.lang]||i18n.cn)[key]||key}function tr(v){return state.lang==='en'?(optionEn[v]||fieldEn[v]||v):v}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(tag,cl,txt){const node=document.createElement(tag);if(cl)node.className=cl;if(txt!=null)node.textContent=txt;return node}function now(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}function newId(){return String(Date.now())+String(Math.floor(Math.random()*900000+100000))}function fileUrl(name){return 'https://www.ithinkair.com/Files/'+encodeURIComponent(name)}function downloadUrl(name){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(name)}function sample(a){return a[Math.floor(Math.random()*a.length)]}function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3500)}function report(e){console.error(e);toast(t('failed'))}function safeAction(fn){return async(...args)=>{try{await fn(...args)}catch(e){report(e)}}}
async function api(type,data,payload){const q={type};if(data!==undefined)q.data=data;if(payload!==undefined)q.payload=payload;return await callAppBridge(q)}
async function csv(key,selectedFields=fields[key]){const raw=await api('GetTableCSV',db[key],selectedFields.join(','));if(!raw)return [];return parseCSV(String(raw)).filter(r=>r.some(x=>x!=='' )).map((r,i)=>{const obj={_row:i+1};selectedFields.forEach((f,j)=>obj[f]=r[j]??'');return obj})}

async function refreshHome(){const [a,b,c,d,themes,tasks]=await Promise.all([api('GetRecordCount',db.theme),api('GetRecordCount',db.task),api('GetRecordCount',db.image),api('GetRecordCount',db.work),csv('theme',['主题名称','主题分类']),csv('task',['任务编号','任务标题','主题名称','绘画难度','海报尺寸','手绘风格','创建时间'])]);renderStats({theme:a,task:b,image:c,work:d});const cats=new Map(themes.map(x=>[x.主题名称,x.主题分类]));$('recent-list').innerHTML='';const recent=tasks.sort((x,y)=>String(y.创建时间).localeCompare(String(x.创建时间))).slice(0,5);if(!recent.length)showEmpty($('recent-list'));for(const row of recent){const card=el('article','mini-card clickable');card.innerHTML=`<h3>${esc(row.任务标题||row.主题名称)}</h3><p>${esc(row.主题名称)} · ${esc(tr(cats.get(row.主题名称)||''))}</p><p>${esc(tr(row.绘画难度))} · ${esc(tr(row.海报尺寸))} · ${esc(tr(row.手绘风格))}</p><span class="subtle">${esc(row.创建时间)}</span>`;card.addEventListener('click',safeAction(async()=>{openPage('generate');await loadTaskById(row.任务编号)}));$('recent-list').append(card)}const counts={};for(const row of themes)counts[row.主题分类]=(counts[row.主题分类]||0)+1;$('category-cloud').innerHTML='';for(const [cat,count] of Object.entries(counts)){const button=el('button','tag',`${tr(cat)}  ${count}`);button.onclick=()=>{$('theme-category-filter').value=cat;openPage('themes');renderThemes()};$('category-cloud').append(button)}if(!themes.length)showEmpty($('category-cloud'))}

function renderThemes(){const q=$('theme-search').value.trim().toLowerCase(),cat=$('theme-category-filter').value,grade=$('theme-grade-filter').value,sort=$('theme-sort').value;let rows=state.theme.filter(x=>(!q||['主题名称','主题说明','常用元素','推荐标语'].some(f=>String(x[f]).toLowerCase().includes(q)))&&(!cat||x.主题分类===cat)&&(!grade||String(x.适合年级).includes(grade)));if(sort==='name')rows=rows.slice().sort((a,b)=>String(a.主题名称).localeCompare(String(b.主题名称),'zh'));const shown=rows.slice(0,state.limits.theme),host=$('theme-list');host.innerHTML='';if(!shown.length)showEmpty(host);for(const row of shown){const card=el('article','mini-card clickable');card.innerHTML=`<span class="tag">${esc(tr(row.主题分类))}</span><h3>${esc(row.主题名称)}</h3><p>${esc(row.主题说明)}</p><p><b>${esc(tr('适合年级'))}:</b> ${esc(row.适合年级.split(/[,，、]/).map(tr).join(', '))}</p><p><b>${esc(tr('常用元素'))}:</b> ${esc(row.常用元素)}</p><p><b>${esc(tr('推荐标语'))}:</b> ${esc(row.推荐标语)}</p><div class="action-row"><button class="btn small secondary" data-action="edit">${esc(t('edit'))}</button><button class="btn small danger" data-action="delete">${esc(t('delete'))}</button><button class="btn small" data-action="use">${esc(t('useTheme'))}</button></div>`;card.onclick=safeAction(async e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='delete')await removeTheme(row);else if(action==='use'){openPage('generate');$('task-form_主题名称').value=row.主题名称}else await editTheme(row._row)});host.append(card)}$('theme-more').hidden=rows.length<=state.limits.theme}

function collectTask(){const data=formData($('task-form'),'task');data.任务编号=$('task-form').dataset.id||newId();data.创建时间=$('task-form').dataset.created||now();data.海报方案=$('task-form').dataset.plan||'';data.生成方式=state.mode;data.换一张次数=String(Math.max(0,Number(data.换一张次数)||0));return data}
function randomizeTask(data){if(state.theme.length)data.主题名称=sample(state.theme).主题名称;for(const f of ['绘画难度','海报尺寸','手绘风格','配色偏好'])data[f]=sample(choices[f]);if(!data.任务标题)data.任务标题=data.主题名称||'';return data}
function taskValid(data){if(data.生成方式==='关键词生成'&&!data.关键词.trim()){toast(t('needKeyword'));return false}if(data.生成方式==='随机生成'&&!data.主题名称){toast(t('needTheme'));return false}return true}
async function poll(key,field,row,statusTarget){const started=Date.now();while(Date.now()-started<1800000){const value=String(await cell(key,field,row)||'').trim();if(value)return value;await new Promise(resolve=>setTimeout(resolve,1000))}statusTarget.textContent=t('timeout');throw new Error('Poll timeout')}
async function saveNewTask(another=false){if(state.busy)return;let data=collectTask();if(another){data.换一张次数=String((Number(data.换一张次数)||0)+1);data.任务编号=newId();data.创建时间=now();data.海报方案=''}if(data.生成方式==='随机生成'&&!another)data=randomizeTask(data);if(!taskValid(data))return;state.busy=true;$('submit-task').disabled=true;$('another-task').disabled=true;loading($('plan-preview'),t('waitPlan'));$('task-status').textContent=t('waitPlan');try{await submit('task',data);state.currentTaskRow=1;state.currentTaskId=data.任务编号;state.taskEditRow=0;renderTaskForm(data);const plan=await poll('task','海报方案',1,$('task-status'));$('task-form').dataset.plan=plan;markdown($('plan-preview'),plan);$('task-status').textContent='';await Promise.all([refreshTasks(),refreshGallery()]);toast(t('saved'))}finally{state.busy=false;$('submit-task').disabled=false;$('another-task').disabled=false}}
async function loadTaskById(id){let row=state.task.find(x=>x.任务编号===id);if(!row){await refreshTasks();row=state.task.find(x=>x.任务编号===id)}if(!row)return;await loadTask(row._row)}
async function loadTask(row){state.currentTaskRow=row;state.taskEditRow=row;const data=await readRecord('task',row);state.currentTaskId=data.任务编号;renderTaskForm(data);const plan=await cell('task','海报方案',row);markdown($('plan-preview'),plan||t('noPlan'));await refreshGallery();return data}
async function editTask(row){const record=await readRecord('task',row);state.taskEditRow=row;const form=el('form');form.id='task-edit-form';form.innerHTML=`<div class="form-grid">${fields.task.filter(f=>!['任务编号','创建时间','海报方案'].includes(f)).map(f=>controlHtml(form.id,f,record[f])).join('')}</div><div class="action-row"><button class="btn" type="submit">${esc(t('save'))}</button><button class="btn secondary" type="button" id="task-edit-form_cancel">${esc(t('cancel'))}</button></div>`;openModal(t('edit'),form);$('task-edit-form_cancel').onclick=closeModal;form.onsubmit=safeAction(async e=>{e.preventDefault();const data=formData(form,'task');data.任务编号=record.任务编号;data.创建时间=record.创建时间;data.海报方案=record.海报方案;if(!taskValid(data))return;const btn=form.querySelector('[type=submit]');btn.disabled=true;try{await updateRecord('task',row,data);closeModal();await refreshTasks();await loadTask(row);toast(t('saved'))}finally{btn.disabled=false}})}
async function refreshTasks(){state.task=await csv('task');renderTasks()}
function tableHtml(rows,cols,onRow){const wrap=el('div');const table=el('table');const head=el('thead');head.innerHTML=`<tr>${cols.map(f=>`<th>${esc(tr(f))}</th>`).join('')}<th></th></tr>`;table.append(head);const body=el('tbody');for(const row of rows){const trNode=el('tr','clickable');for(const f of cols){const td=el('td');if(f==='海报方案'){td.innerHTML=`<span class="ellipsis">${esc(row[f])}</span>`}else td.textContent=f==='生成方式'||choices[f]?tr(row[f]):row[f];trNode.append(td)}const act=el('td');act.className='actions-cell';const div=el('div','actions');for(const [action,label,klass] of [['edit','edit','secondary'],['plan','viewPlan','secondary'],['image','makeImage','secondary'],['delete','delete','danger']]){const btn=el('button',`btn small ${klass}`,t(label));btn.type='button';btn.onclick=safeAction(async e=>{e.stopPropagation();if(action==='edit')await editTask(row._row);if(action==='plan'){const text=await cell('task','海报方案',row._row);modalMarkdown(t('planDetail'),text||t('noPlan'))}if(action==='image'){await loadTask(row._row);window.scrollTo(0,0)}if(action==='delete'){if(confirm(t('confirmDelete'))){await deleteRow('task',row._row);if(state.currentTaskId===row.任务编号){state.currentTaskId='';state.currentTaskRow=0;renderTaskForm();markdown($('plan-preview'),'');await refreshGallery()}await refreshTasks()}}});div.append(btn)}act.append(div);trNode.append(act);trNode.onclick=safeAction(async()=>{await loadTask(row._row);window.scrollTo(0,0)});body.append(trNode)}table.append(body);wrap.append(table);onRow.innerHTML='';onRow.append(wrap)}
function renderTasks(){const q=$('task-search').value.trim().toLowerCase(),filters=[['绘画难度','task-difficulty-filter'],['海报尺寸','task-size-filter'],['手绘风格','task-style-filter'],['配色偏好','task-color-filter']];let rows=state.task.filter(x=>(!q||['任务标题','关键词','主题名称'].some(f=>String(x[f]).toLowerCase().includes(q)))&&filters.every(([f,id])=>!$(id).value||x[f]===$(id).value));rows=rows.slice().sort($('task-sort').value==='name'?(a,b)=>String(a.任务标题).localeCompare(String(b.任务标题),'zh'):(a,b)=>String(b.创建时间).localeCompare(String(a.创建时间)));const shown=rows.slice(0,state.limits.task);if(!shown.length)showEmpty($('task-table'));else tableHtml(shown,fields.task,$('task-table'));$('task-more').hidden=rows.length<=state.limits.task}
async function refreshGallery(){if(!state.currentTaskId){showEmpty($('gallery'));return}state.image=await csv('image');const items=state.image.filter(x=>x.任务编号===state.currentTaskId);const host=$('gallery');host.innerHTML='';if(!items.length)showEmpty(host);for(const row of items){const card=el('article','mini-card image-card');card.innerHTML=`${row.图片?`<img src="${esc(fileUrl(row.图片))}" alt="${esc(tr(row.图片用途))}">`:`<div class="image-placeholder"><i class="fa-solid fa-paintbrush"></i></div>`}<h3>${esc(tr(row.图片用途))}</h3><p>${esc(row.生成时间)} · ${esc(tr(row.是否满意))}</p><div class="action-row"></div>`;const bar=card.querySelector('.action-row');for(const [action,label] of [['satisfied','satisfied'],['favorite','favorite'],['large','large']]){const b=el('button','btn small secondary',t(label));b.onclick=safeAction(async()=>{state.currentImageRow=row._row;state.currentImageId=row.图片编号;if(action==='satisfied'){await setCell('image','是否满意',row._row,'是');await refreshGallery();toast(t('saved'))}else if(action==='favorite')await favorite(row);else if(row.图片)showLarge(row.图片);else toast(t('needImage'))});bar.append(b)}host.append(card)}}
async function generateImage(purpose){if(state.busy)return;if(!state.currentTaskId){toast(t('needTask'));return}state.busy=true;document.querySelectorAll('[data-purpose]').forEach(b=>b.disabled=true);$('image-status').innerHTML=`<div class="paint-progress"></div>${esc(t('waitImage'))}`;const data={'图片编号':newId(),'任务编号':state.currentTaskId,'图片用途':purpose,'是否满意':'否','生成时间':now(),'图片':''};try{await submit('image',data);state.currentImageRow=1;state.currentImageId=data.图片编号;await poll('image','图片',1,$('image-status'));$('image-status').textContent='';await refreshGallery();toast(t('saved'))}finally{state.busy=false;document.querySelectorAll('[data-purpose]').forEach(b=>b.disabled=false)}}
function showLarge(filename){const wrap=el('div');wrap.innerHTML=`<img class="big" src="${esc(fileUrl(filename))}" alt=""><div class="action-row"><a class="btn secondary" href="${esc(downloadUrl(filename))}" target="_blank" download><i class="fa-solid fa-download"></i> Download</a></div>`;openModal(t('large'),wrap,true)}
async function favorite(image){if(!state.currentTaskId){toast(t('needTask'));return}const data={'收藏编号':newId(),'任务编号':state.currentTaskId,'图片编号':image?.图片编号||state.currentImageId||'','收藏备注':'','收藏时间':now()};await submit('work',data);toast(t('saved'));if(state.page==='works')await refreshWorks()}
async function refreshWorks(){const [works,tasks,images]=await Promise.all([csv('work'),csv('task',['任务编号','任务标题','主题名称','海报方案']),csv('image')]);const taskMap=new Map(tasks.map(x=>[x.任务编号,x]));const imageMap=new Map(images.map(x=>[x.图片编号,x]));state.work=works.map(w=>({...w,_task:taskMap.get(w.任务编号)||{},_image:imageMap.get(w.图片编号)||{}}));renderWorks()}
function renderWorks(){const q=$('work-search').value.trim().toLowerCase(),purpose=$('work-purpose-filter').value,sat=$('work-satisfied-filter').value;let rows=state.work.filter(w=>(!q||[w._task.任务标题,w._task.主题名称,w.收藏备注].some(x=>String(x||'').toLowerCase().includes(q)))&&(!purpose||w._image.图片用途===purpose)&&(!sat||w._image.是否满意===sat));rows=rows.slice().sort($('work-sort').value==='name'?(a,b)=>String(a._task.任务标题||'').localeCompare(String(b._task.任务标题||''),'zh'):(a,b)=>String(b.收藏时间).localeCompare(String(a.收藏时间)));const host=$('works-list');host.innerHTML='';if(!rows.length)showEmpty(host);for(const w of rows.slice(0,state.limits.work)){const card=el('article','mini-card work-card');card.innerHTML=`${w._image.图片?`<img src="${esc(fileUrl(w._image.图片))}" alt="">`:`<div class="image-placeholder"><i class="fa-solid fa-heart"></i></div>`}<div class="meta"><h3>${esc(w._task.任务标题||w._task.主题名称||'')}</h3><p>${esc(w._task.主题名称||'')} · ${esc(tr(w._image.图片用途||''))} · ${esc(tr(w._image.是否满意||''))}</p><p>${esc(w.收藏备注)}</p><span class="subtle">${esc(w.收藏时间)}</span></div><div class="action-row"></div>`;const bar=card.querySelector('.action-row');for(const [action,label] of [['detail','details'],['note','editNote'],['remove','unfavorite'],['export','export']]){const b=el('button','btn small secondary',t(label));b.onclick=safeAction(async()=>{if(action==='detail')await detailWork(w);if(action==='note')await editNote(w);if(action==='remove'){if(confirm(t('confirmUnfavorite'))){await deleteRow('work',w._row);await refreshWorks()}}if(action==='export')await exportWork(w)});bar.append(b)}host.append(card)}$('work-more').hidden=rows.length<=state.limits.work}
async function detailWork(w){const plan= w._task.任务编号?await cell('task','海报方案',w._task._row):'';const wrap=el('div');wrap.innerHTML=`${w._image.图片?`<img class="big" src="${esc(fileUrl(w._image.图片))}" alt="">`:''}<p><b>${esc(tr('主题名称'))}:</b> ${esc(w._task.主题名称||'')}</p><p><b>${esc(tr('图片用途'))}:</b> ${esc(tr(w._image.图片用途||''))} · <b>${esc(tr('是否满意'))}:</b> ${esc(tr(w._image.是否满意||''))}</p><p><b>${esc(tr('收藏备注'))}:</b> ${esc(w.收藏备注)}</p><div class="markdown-body"></div>`;openModal(t('workDetail'),wrap,true);markdown(wrap.querySelector('.markdown-body'),plan||t('noPlan'))}
async function editNote(w){const current=await cell('work','收藏备注',w._row);const form=el('form');form.id='note-form';form.innerHTML=`<div class="form-field"><label for="note-form_收藏备注">${esc(tr('收藏备注'))}</label><textarea class="field" id="note-form_收藏备注" name="收藏备注" rows="5">${esc(current)}</textarea></div><div class="action-row"><button class="btn" type="submit">${esc(t('save'))}</button></div>`;openModal(t('editNote'),form);form.onsubmit=safeAction(async e=>{e.preventDefault();await setCell('work','收藏备注',w._row,form.elements.namedItem('收藏备注').value);closeModal();await refreshWorks();toast(t('saved'))})}
async function exportWork(w){const content=w._task.任务编号?await cell('task','海报方案',w._task._row):'';if(!content){toast(t('noPlan'));return}const filename=`poster-${w.任务编号||newId()}.md`;await api('WriteFile',filename,content);await api('ExportFile','海报方案',filename);toast(t('saved'))}
function renderAll(){const draft=$('task-form_任务标题')?collectTask():null;renderThemes();renderTasks();renderWorks();renderTaskForm(draft);refreshGallery().catch(report)}
async function initialize(){let lang='cn';const langs=navigator.languages;if(Array.isArray(langs)&&langs.length)lang=langs.some(x=>String(x).toLowerCase().startsWith('zh'))?'cn':'en';const param=new URLSearchParams(location.search).get('lang');if(param==='cn'||param==='en')lang=param;const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)lang=stored==='en'?'en':'cn';state.lang=lang;try{const mode=await api('模式');document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){console.warn(e)}setLanguage(lang);renderTaskForm();measureNav();const initial=[refreshHome(),refreshThemes(),refreshTasks(),refreshGallery(),refreshWorks()];const results=await Promise.allSettled(initial);for(const r of results)if(r.status==='rejected')report(r.reason)}
$('brand').onclick=()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
$('menu-toggle').onclick=()=>{const open=$('mobile-menu').classList.toggle('open');$('menu-toggle').setAttribute('aria-expanded',String(open))};
document.addEventListener('click',e=>{if(!e.target.closest('#topbar'))closeMenu()});
$('language-toggle').onclick=()=>setLanguage(state.lang==='cn'?'en':'cn');$('mobile-language').onclick=()=>{setLanguage(state.lang==='cn'?'en':'cn');closeMenu()};
$('random-top').onclick=$('mobile-random').onclick=()=>{openPage('generate');setMode('随机生成');renderTaskForm()};
$('start-generate').onclick=$('works-generate').onclick=()=>openPage('generate');$('browse-themes').onclick=()=>openPage('themes');$('add-theme').onclick=()=>editTheme(0).catch(report);
for(const id of ['theme-search','theme-category-filter','theme-grade-filter','theme-sort'])$(id).addEventListener('input',renderThemes);
for(const id of ['task-search','task-difficulty-filter','task-size-filter','task-style-filter','task-color-filter','task-sort'])$(id).addEventListener('input',renderTasks);
for(const id of ['work-search','work-purpose-filter','work-satisfied-filter','work-sort'])$(id).addEventListener('input',renderWorks);
for(const key of ['theme','task','work'])$(`${key}-more`).onclick=()=>{state.limits[key]+=12;({theme:renderThemes,task:renderTasks,work:renderWorks})[key]()};
$('mode-random').onclick=$('mode-keyword').onclick=e=>setMode(e.currentTarget.dataset.mode);
$('task-form').onsubmit=safeAction(async e=>{e.preventDefault();await saveNewTask(false)});
$('another-task').onclick=()=>saveNewTask(true).catch(report);
document.querySelectorAll('[data-purpose]').forEach(b=>b.onclick=()=>generateImage(b.dataset.purpose).catch(report));
$('favorite-current').onclick=()=>favorite(null).catch(report);
$('modal-close').onclick=closeModal;$('modal-backdrop').onclick=e=>{if(e.target===$('modal-backdrop'))closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modalOpen)closeModal();else closeMenu()}});
document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,select,textarea'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),150)});
window.addEventListener('resize',measureNav);
(async () => { await initialize(); })();
</script>
</body>
