  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("15a1bb98a46e89b3_小红书长图切割")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

}

    buttonContainer.style.cssText = `

    `;
    
    // 创建拍照按钮

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

      currentPage=page; el('workbenchPage').hidden=page!=='workbench'; el('historyPage').hidden=page!=='history';
      document.querySelectorAll('[data-page]').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===page));
      closeMenu(); window.scrollTo(0,0); if(page==='history') loadHistory();
    }
    function showEmpty(){ el('resultBody').innerHTML='<div class="empty"><span class="empty-icon"><i class="fa-regular fa-images"></i></span><strong>'+escapeHTML(t('emptyTitle'))+'</strong><span>'+escapeHTML(t('emptyDesc'))+'</span></div>'; }
    function showWaiting(){ el('resultBody').innerHTML='<div class="waiting"><span class="spinner" aria-hidden="true"></span><strong>'+escapeHTML(t('waitingTitle'))+'</strong><span>'+escapeHTML(t('waiting'))+'</span></div>'; }
    function showMessage(message){ el('resultBody').innerHTML='<div class="notice">'+escapeHTML(message)+'</div>'; }
    function markdownHTML(markdown){
      if(!window.marked||!window.DOMPurify) return '<pre>'+escapeHTML(markdown)+'</pre>';
      const raw=marked.parse(String(markdown),{gfm:true,breaks:true});
      const doc=new DOMParser().parseFromString('<div>'+raw+'</div>','text/html');
      doc.querySelectorAll('img').forEach(img=>{
        const src=img.getAttribute('src')||'';
        if(!src || /^(javascript:|data:)/i.test(src)){img.remove();return;}
        const filename=src.split('/').pop();
        const safeURL=src.startsWith('http://' + window.location.hostname + ':3130/download/')?src:downloadURL(filename);
        img.setAttribute('src',safeURL); img.setAttribute('data-download-url',safeURL); img.setAttribute('title',lang==='cn'?'点击下载图片':'Click to download image');
      });
      return DOMPurify.sanitize(doc.body.innerHTML,{ADD_ATTR:['data-download-url']});
    }
    function renderMarkdown(target,content){ target.innerHTML='<div class="markdown-body">'+markdownHTML(content)+'</div>'; }
    function showResult(content){ renderMarkdown(el('resultBody'),content); const actions=document.createElement('div'); actions.className='result-actions'; actions.innerHTML='<button class="secondary" id="resetBtn" type="button"><i class="fa-solid fa-rotate-right"></i>'+escapeHTML(t('reset'))+'</button>'; el('resultBody').appendChild(actions); el('resetBtn').addEventListener('click',resetForm); }
    function resetForm(){pollToken++;currentRow=0;busy=false;el('splitForm').reset();el('splitForm_startY').value='0';el('splitForm_cutBottom').value='0';el('splitForm_width').value='1080';el('splitForm_height').value='1440';el('splitForm_format').value='png';el('imagePreview').removeAttribute('src');el('imagePreview').classList.remove('visible');el('formError').textContent='';el('submitBtn').disabled=false;showEmpty();}
    async function pollResult(token){
      const deadline=Date.now()+1800*1000;
      while(token===pollToken && Date.now()<deadline){
        await new Promise(resolve=>setTimeout(resolve,1000));
        if(token!==pollToken) return;
        try { const result=await callAppBridge({type:'轮询',data:'长图切割',payload:'切割结果'}); if(token!==pollToken)return; if(String(result??'').trim()){ const content=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'切割结果/1'}); if(token!==pollToken)return; showResult(String(content??'').trim()||String(result)); busy=false;el('submitBtn').disabled=false;return; } }
        catch(error){ if(token===pollToken){showMessage(t('pollError')+error);busy=false;el('submitBtn').disabled=false;}return; }
      }
      if(token===pollToken){showMessage(t('timeout'));busy=false;el('submitBtn').disabled=false;}
    }
    async function loadHistory(){
      const grid=el('historyGrid');grid.innerHTML='<div class="notice"><span class="spinner" style="display:inline-block;vertical-align:middle"></span></div>';
      try{
        const [countText,csv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS})]);
        el('recordCount').textContent=String(countText??'0').trim()||'0';
        const rows=parseCSV(String(csv??'')).filter(row=>row.some(cell=>String(cell).trim()!==''));
        grid.innerHTML='';historyLoaded=true;
        if(!rows.length){grid.innerHTML='<div class="notice">'+escapeHTML(t('historyEmpty'))+'</div>';return;}
        rows.forEach((row,index)=>{
          const [image,startY,cutBottom,width,height,format]=row;
          const card=document.createElement('article');card.className='history-card';
          card.innerHTML='<div class="history-image">'+(image?'<img src="'+escapeHTML(imageURL(image))+'" alt="'+escapeHTML(t('image'))+'" loading="lazy">':'<i class="fa-regular fa-image fa-2x"></i>')+'</div><div class="history-info"><h3>'+escapeHTML(width||'—')+' × '+escapeHTML(height||'—')+' ('+escapeHTML(format||'—')+')</h3><p>'+escapeHTML(t('startY'))+': '+escapeHTML(startY||'0')+'</p><p>'+escapeHTML(t('cutBottom'))+': '+escapeHTML(cutBottom||'0')+'</p></div><div class="history-actions"><button class="small-btn view-btn" type="button"><i class="fa-regular fa-eye"></i>'+escapeHTML(t('view'))+'</button><button class="danger delete-btn" type="button"><i class="fa-regular fa-trash-can"></i>'+escapeHTML(t('delete'))+'</button></div>';
          const rowNumber=index+1;
          card.querySelector('.view-btn').addEventListener('click',()=>openResultModal(rowNumber));
          card.querySelector('.delete-btn').addEventListener('click',()=>deleteRecord(rowNumber));grid.appendChild(card);
        });
      }catch(error){grid.innerHTML='<div class="notice">'+escapeHTML(t('loadError')+error)+'</div>';}
    }
    async function openResultModal(row){el('modalBody').textContent=t('resultLoading');el('resultModal').classList.add('open');el('resultModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';try{const content=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'切割结果/'+row});renderMarkdown(el('modalBody'),String(content??'').trim()||t('resultEmpty'));}catch(error){el('modalBody').textContent=t('loadError')+error;}}
    function closeModal(){el('resultModal').classList.remove('open');el('resultModal').setAttribute('aria-hidden','true');document.body.style.overflow='';}
    async function deleteRecord(row){if(!window.confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});await loadHistory();}catch(error){window.alert(t('loadError')+error);}}
    function airBack(){if(el('resultModal').classList.contains('open')){closeModal();return 'false';}if(el('mobileMenu').classList.contains('open')){closeMenu();return 'false';}if(navHistory.length){const previous=navHistory.pop();navigate(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false';}return 'true';}
    async function initialize(){
      try{document.documentElement.dataset.theme=(await callAppBridge({type:'模式'}))==='暗色'?'dark':'light';}catch(_){document.documentElement.dataset.theme='light';}
      const languages=navigator.languages; let preferred=!languages||!languages.length?'cn':(languages.some(item=>/^zh(?:-|$)/i.test(item))?'cn':'en');
      const urlLang=new URLSearchParams(location.search).get('lang');if(urlLang==='cn'||urlLang==='en')preferred=urlLang;
      const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)preferred=saved==='en'?'en':'cn';setLanguage(preferred);showEmpty();
      el('brand').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false);});
      document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.page)));
      el('menuBtn').addEventListener('click',()=>{const open=el('mobileMenu').classList.toggle('open');el('menuBtn').setAttribute('aria-expanded',String(open));});
      document.addEventListener('click',event=>{if(!event.target.closest('.topbar'))closeMenu();});
      function toggleLanguage(){const next=lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',next);setLanguage(next);closeMenu();}
      el('langBtn').addEventListener('click',toggleLanguage);el('mobileLangBtn').addEventListener('click',toggleLanguage);
      el('selectImageBtn').addEventListener('click',async()=>{try{const image=await callAppBridge({type:'SelectImage'});if(image){el('splitForm_image').value=String(image);el('imagePreview').src=imageURL(image);el('imagePreview').classList.add('visible');el('formError').textContent='';}}catch(error){el('formError').textContent=t('selectError')+error;}});
      el('splitForm').addEventListener('submit',async event=>{
        event.preventDefault();if(busy)return;el('formError').textContent='';
        if(!el('splitForm_image').value.trim()){el('formError').textContent=t('noImage');return;}
        const numeric=['startY','cutBottom','width','height'].map(key=>Number(el('splitForm_'+key).value));
        if(numeric.some((n,index)=>!Number.isSafeInteger(n)||n<(index<2?0:1))){el('formError').textContent=t('invalidNumber');return;}
        const payload={};new FormData(el('splitForm')).forEach((value,key)=>{payload[key]=String(value);});
        busy=true;el('submitBtn').disabled=true;showWaiting();
        try{await callAppBridge({type:'SubmitRecord',data:'长图切割',payload:JSON.stringify(payload)});currentRow=1;historyLoaded=false;const token=++pollToken;pollResult(token);}catch(error){busy=false;el('submitBtn').disabled=false;showEmpty();el('formError').textContent=t('submitError')+error;}
      });
      el('closeModalBtn').addEventListener('click',closeModal);el('resultModal').addEventListener('click',event=>{if(event.target===el('resultModal'))closeModal();});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(el('resultModal').classList.contains('open'))closeModal();else closeMenu();}});
      document.addEventListener('click',event=>{const img=event.target.closest('.markdown-body img[data-download-url]');if(img){const a=document.createElement('a');a.href=img.dataset.downloadUrl;a.download='';document.body.appendChild(a);a.click();a.remove();}});
      document.addEventListener('focusin',event=>{if(!event.target.matches('input,select,textarea'))return;setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),260);});
      if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const focused=document.activeElement;if(focused&&focused.matches('input,select,textarea'))focused.scrollIntoView({block:'center',behavior:'smooth'});});
    }
    (async () => { await initialize(); })();
  </script>
</body>
