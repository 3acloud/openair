<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';

    fileInput.addEventListener('change', (event) => {

        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {

      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

const I18N={cn:{appName:'智能记录本',desk:'智能记录台',history:'记录历史',eyebrow:'SMART CAPTURE',quickTitle:'快速记录',quickDesc:'自然语言描述支出、出货、日志或备忘，AI将自动提取分类与归档。',recordForm:'智能记录',content:'记录内容',contentPlaceholder:'写下你想记录的内容…',image:'图片',file:'文件',camera:'拍照',chooseImage:'选择图片',chooseFile:'选择文件',process:'交给AI处理',resultTitle:'智能处理结果',resultEmpty:'提交记录后，AI处理结果将在这里显示。',analyzing:'AI正在分析分类，提取关键字段中...',continue:'继续记录',archive:'ARCHIVE',hallTitle:'记录大厅',hallDesc:'浏览所有通过AI处理和归档的历史记录。',total:'总记录数',more:'查看更多',details:'记录详情与编辑',editRecord:'修改记录',cancel:'取消',save:'保存修改',deleteTitle:'确认删除',deleteQuestion:'确定删除这条记录吗？此操作无法撤销。',delete:'删除',emptyImage:'尚未添加图片',emptyFile:'尚未添加文件',emptyHistory:'暂无记录',loading:'正在加载…',timeout:'AI处理超时，请稍后在记录历史中查看。',saved:'修改已保存',deleted:'记录已删除',submitted:'记录已提交',failed:'操作失败',download:'下载文件',record:'记录',attachment:'附件',processing:'处理中',selectFailed:'未获取到文件',notReady:'Markdown组件尚未加载',resultMissing:'暂无处理结果'},en:{appName:'Smart Notebook',desk:'Smart Desk',history:'History',eyebrow:'SMART CAPTURE',quickTitle:'Capture instantly',quickDesc:'Describe expenses, shipments, logs, or notes naturally. AI will classify and organize them.',recordForm:'Smart record',content:'Content',contentPlaceholder:'Write what you want to remember…',image:'Image',file:'File',camera:'Take photo',chooseImage:'Choose image',chooseFile:'Choose file',process:'Process with AI',resultTitle:'AI result',resultEmpty:'Your AI result will appear here after submission.',analyzing:'AI is analyzing and extracting key details...',continue:'New record',archive:'ARCHIVE',hallTitle:'Record hall',hallDesc:'Browse your processed and archived records.',total:'Total records',more:'Load more',details:'Record details and edit',editRecord:'Edit record',cancel:'Cancel',save:'Save changes',deleteTitle:'Delete record',deleteQuestion:'Delete this record? This cannot be undone.',delete:'Delete',emptyImage:'No image selected',emptyFile:'No file selected',emptyHistory:'No records yet',loading:'Loading…',timeout:'AI processing timed out. Check history later.',saved:'Changes saved',deleted:'Record deleted',submitted:'Record submitted',failed:'Operation failed',download:'Download file',record:'Record',attachment:'Attachment',processing:'Processing',selectFailed:'No file was returned',notReady:'Markdown renderer is not available',resultMissing:'No result yet'}};
const state={lang:'cn',page:'desk',history:[],scroll:{desk:0,history:0},editRow:0,deleteRow:0,visible:0,polling:false,pollToken:0,menu:false,stack:[],busy:false};
const $=id=>document.getElementById(id);
const tr=key=>I18N[state.lang][key]||key;
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fileUrl(name,privateFile=false){return 'https://www.ithinkair.com:3031/'+(privateFile?'private/':'download/')+encodeURIComponent(String(name||''));}
function fileLabel(name){return String(name||'').split(/[\\/]/).pop();}
function htmlFile(name){return /\.html?$/i.test(fileLabel(name));}
function showToast(message){const node=$('toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>node.classList.add('hidden'),3500);}
function errorMessage(error){return (error&&error.message)||String(error||tr('failed'));}
function languageFromEnvironment(){const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)return stored==='en'?'en':'cn';const param=new URLSearchParams(location.search).get('lang');if(param==='cn'||param==='en')return param;const languages=navigator.languages;if(!languages||!languages.length)return 'cn';return languages.some(item=>/^zh(?:-|$)/i.test(item))?'cn':'en';}
function setLanguage(lang,persist=false){state.lang=lang;document.documentElement.lang=lang==='cn'?'zh-CN':'en';if(persist)localStorage.setItem('iThinkAir_UiLanguage',lang);document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=tr(node.dataset.i18n);});document.querySelectorAll('[data-i18n-placeholder]').forEach(node=>{node.placeholder=tr(node.dataset.i18nPlaceholder);});$('languageButton').textContent=lang==='cn'?'EN':'中文';renderAttachments('recordForm');renderAttachments('editForm');renderHistory();if(!state.polling&&!$('resultContent').classList.contains('hidden')&&state.currentResult)renderMarkdown($('resultContent'),state.currentResult);if(state.detailResult)renderMarkdown($('detailResult'),state.detailResult);fitNavigation();}
function fitNavigation(){const nav=$('navInner');const brand=$('brandButton');const links=$('navLinks');const lang=$('languageButton');const menu=$('menuButton');links.classList.remove('hidden');lang.classList.remove('hidden');const needed=brand.scrollWidth+links.scrollWidth+lang.scrollWidth+70;const compact=needed>nav.clientWidth;links.classList.toggle('hidden',compact);lang.classList.toggle('hidden',compact);menu.style.display=compact?'inline-flex':'none';if(!compact)closeMenu();}
function closeMenu(){state.menu=false;$('mobileMenu').classList.add('hidden');$('menuButton').setAttribute('aria-expanded','false');}
function toggleMenu(){state.menu=!state.menu;$('mobileMenu').classList.toggle('hidden',!state.menu);$('menuButton').setAttribute('aria-expanded',state.menu?'true':'false');}
function setPage(page,remember=true){if(page===state.page){closeMenu();return;}if(remember)state.stack.push({page:state.page,scroll:window.scrollY});state.page=page;document.querySelectorAll('.page').forEach(node=>node.classList.toggle('active',node.id==='page'+(page==='desk'?'Desk':'History')));document.querySelectorAll('[data-page]').forEach(node=>node.classList.toggle('active',node.dataset.page===page));closeMenu();window.scrollTo(0,state.scroll[page]||0);if(page==='history')refreshHistory();}
function closeTopModal(){if(!$('confirmOverlay').classList.contains('hidden')){closeConfirm();return true;}if(!$('detailOverlay').classList.contains('hidden')){closeDetail();return true;}return false;}
function airBack(){if(state.menu){closeMenu();return 'false';}if(closeTopModal())return 'false';if(state.stack.length){const target=state.stack.pop();state.scroll[state.page]=window.scrollY;setPage(target.page,false);window.scrollTo(0,target.scroll);return 'false';}return 'true';}
window.airBack=airBack;
function renderMarkdown(node,source){node.replaceChildren();if(!source){node.textContent=tr('resultMissing');return;}if(typeof marked==='undefined'||typeof DOMPurify==='undefined'){node.textContent=source;return;}const html=DOMPurify.sanitize(marked.parse(source,{gfm:true,breaks:true}));node.innerHTML=html;node.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';if(!raw)return;const url=/^https?:\/\//i.test(raw)?raw:fileUrl(raw);img.src=url;const anchor=document.createElement('a');anchor.href=url;anchor.download='';anchor.target='_blank';anchor.rel='noopener noreferrer';img.replaceWith(anchor);anchor.appendChild(img);});node.querySelectorAll('a').forEach(a=>{if(!a.hasAttribute('download')){a.target='_blank';a.rel='noopener noreferrer';}});}
function renderAttachments(prefix){const image=$(prefix+'_image').value;const file=$(prefix+'_file').value;const imageBox=$(prefix+'_imagePreview');const fileBox=$(prefix+'_filePreview');imageBox.replaceChildren();if(image){const img=document.createElement('img');img.src=fileUrl(image);img.alt=tr('image');imageBox.appendChild(img);const text=document.createElement('span');text.className='file-name';text.textContent=fileLabel(image);imageBox.appendChild(text);}else imageBox.textContent=tr('emptyImage');fileBox.replaceChildren();if(file){const icon=document.createElement('i');icon.className='fa-solid fa-file-lines';fileBox.appendChild(icon);const text=document.createElement('span');text.className='file-name';text.textContent=fileLabel(file);fileBox.appendChild(text);}else fileBox.textContent=tr('emptyFile');if(prefix==='editForm')renderFileDetail(file);}
function renderFileDetail(file){const row=$('detailDownload');const preview=$('detailHtmlPreview');row.replaceChildren();preview.replaceChildren();if(!file)return;const link=document.createElement('a');link.className='button';link.href=fileUrl(file);link.download=fileLabel(file);link.target='_blank';link.rel='noopener noreferrer';link.innerHTML='<i class="fa-solid fa-download"></i> '+escapeHtml(tr('download'));row.appendChild(link);if(htmlFile(file)){const frame=document.createElement('iframe');frame.className='html-preview';frame.src=fileUrl(file,true);frame.title=fileLabel(file);frame.setAttribute('sandbox','allow-scripts allow-same-origin');preview.appendChild(frame);$('detailOverlay').classList.add('markdown-modal');}else $('detailOverlay').classList.remove('markdown-modal');}
async function chooseAsset(prefix,field,type){try{const value=await callAppBridge({type});if(!value)return;$(prefix+'_'+field).value=String(value);renderAttachments(prefix);}catch(error){showToast(errorMessage(error));}}
function setBusy(busy){state.busy=busy;$('recordForm_submit').disabled=busy;for(const id of ['recordForm_camera','recordForm_chooseImage','recordForm_chooseFile'])$(id).disabled=busy;}
function waitSecond(){return new Promise(resolve=>setTimeout(resolve,1000));}
async function pollResult(token){const started=Date.now();while(state.polling&&token===state.pollToken&&Date.now()-started<1800000){try{const value=await callAppBridge({type:'轮询',data:FORM_TABLE,payload:'处理结果'});if(value&&String(value).trim()){const detail=await callAppBridge({type:'GetCellValue',data:FORM_TABLE,payload:'处理结果/1'});state.currentResult=String(detail||value);$('resultLoading').classList.add('hidden');$('resultContent').classList.remove('hidden');renderMarkdown($('resultContent'),state.currentResult);$('resultActions').classList.remove('hidden');state.polling=false;setBusy(false);return;}}catch(error){$('resultError').textContent=errorMessage(error);$('resultError').classList.remove('hidden');}await waitSecond();}if(token!==state.pollToken)return;state.polling=false;setBusy(false);$('resultLoading').classList.add('hidden');$('resultError').textContent=tr('timeout');$('resultError').classList.remove('hidden');$('resultActions').classList.remove('hidden');}
async function submitRecord(event){event.preventDefault();if(state.busy||state.polling)return;const content=$('recordForm_content').value.trim();if(!content){$('recordForm_content').focus();return;}setBusy(true);try{const values={'记录内容':content,'图片':$('recordForm_image').value,'文件':$('recordForm_file').value};await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(values)});state.currentRow=1;state.polling=true;state.pollToken++;$('resultEmpty').classList.add('hidden');$('resultContent').classList.add('hidden');$('resultError').classList.add('hidden');$('resultActions').classList.add('hidden');$('resultLoading').classList.remove('hidden');showToast(tr('submitted'));await pollResult(state.pollToken);}catch(error){state.polling=false;setBusy(false);$('resultLoading').classList.add('hidden');$('resultError').textContent=errorMessage(error);$('resultError').classList.remove('hidden');}}
function resetRecord(){if(state.polling)return;$('recordForm').reset();renderAttachments('recordForm');state.currentRow=0;state.currentResult='';$('resultContent').replaceChildren();$('resultContent').classList.add('hidden');$('resultError').classList.add('hidden');$('resultLoading').classList.add('hidden');$('resultActions').classList.add('hidden');$('resultEmpty').classList.remove('hidden');$('recordForm_content').focus();}
async function refreshHistory(){const status=$('historyStatus');status.textContent=tr('loading');try{const results=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS.join(',')})]);$('recordCount').textContent=String(results[0]||0);const rows=parseCSV(String(results[1]||''));state.history=rows.filter(row=>row.length&&row.some(value=>value!==''));state.summaries={};state.visible=Math.min(12,state.history.length);renderHistory();status.textContent=state.history.length?'':tr('emptyHistory');}catch(error){status.textContent=errorMessage(error);}}
function renderHistory(){const list=$('historyList');list.replaceChildren();for(let index=0;index<state.visible;index++){const row=state.history[index];if(!row)break;const number=index+1;const card=document.createElement('article');card.className='record-card';card.tabIndex=0;card.dataset.row=number;const media=document.createElement('div');media.className='record-media';if(row[1]){const img=document.createElement('img');img.src=fileUrl(row[1]);img.alt=tr('image');media.appendChild(img);}else media.innerHTML='<i class="fa-solid fa-note-sticky fa-xl"></i>';const main=document.createElement('div');main.className='record-main';const idx=document.createElement('div');idx.className='record-index';idx.textContent=tr('record')+' #'+number;const summary=document.createElement('div');summary.className='record-summary';summary.dataset.summaryRow=number;summary.textContent=state.summaries&&state.summaries[number]!==undefined?state.summaries[number]:(row[0]||'').slice(0,100);const meta=document.createElement('div');meta.className='record-meta';meta.textContent=row[2]?' '+tr('attachment'):'';main.append(idx,summary,meta);const actions=document.createElement('div');actions.className='record-actions';const detail=document.createElement('button');detail.type='button';detail.className='button';detail.innerHTML='<i class="fa-regular fa-pen-to-square"></i> '+escapeHtml(tr('details'));detail.addEventListener('click',event=>{event.stopPropagation();openDetail(number);});const del=document.createElement('button');del.type='button';del.className='button danger';del.innerHTML='<i class="fa-regular fa-trash-can"></i> '+escapeHtml(tr('delete'));del.addEventListener('click',event=>{event.stopPropagation();openConfirm(number);});actions.append(detail,del);card.append(media,main,actions);card.addEventListener('click',()=>openDetail(number));card.addEventListener('keydown',event=>{if(event.key==='Enter')openDetail(number);});list.appendChild(card);}const more=$('loadMoreButton');more.classList.toggle('hidden',state.visible>=state.history.length);loadSummaries();}
async function loadSummaries(){if(!state.summaries)state.summaries={};for(let number=1;number<=state.visible;number++){if(state.summaries[number]!==undefined)continue;try{const full=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'记录内容/'+number});state.summaries[number]=String(full||'').slice(0,100);const node=document.querySelector('[data-summary-row="'+number+'"]');if(node)node.textContent=state.summaries[number];}catch(error){state.summaries[number]=(state.history[number-1]?.[0]||'').slice(0,100);}}}
function openOverlay(id){$(id).classList.remove('hidden');document.body.style.overflow='hidden';}
function closeOverlay(id){$(id).classList.add('hidden');if($('detailOverlay').classList.contains('hidden')&&$('confirmOverlay').classList.contains('hidden'))document.body.style.overflow='';}
async function openDetail(row){state.editRow=row;$('detailResult').textContent=tr('loading');$('editForm').reset();renderAttachments('editForm');openOverlay('detailOverlay');try{const names=['记录内容','图片','文件','处理结果'];const values=[];for(const name of names){values.push(await callAppBridge({type:'GetCellValue',data:TABLE,payload:name+'/'+row}));}if(state.editRow!==row)return;$('editForm_content').value=String(values[0]||'');$('editForm_image').value=String(values[1]||'');$('editForm_file').value=String(values[2]||'');state.detailResult=String(values[3]||'');renderMarkdown($('detailResult'),state.detailResult);renderAttachments('editForm');}catch(error){$('detailResult').textContent=errorMessage(error);}}
function closeDetail(){state.editRow=0;closeOverlay('detailOverlay');}
async function saveEdit(event){event.preventDefault();if(!state.editRow)return;const row=state.editRow;const button=$('editForm_submit');button.disabled=true;try{for(const field of FIELDS){const input=field==='记录内容'?'editForm_content':field==='图片'?'editForm_image':'editForm_file';await callAppBridge({type:'SetCellValue',data:TABLE,payload:field+'/'+row+'/'+$(input).value});}closeDetail();showToast(tr('saved'));await refreshHistory();}catch(error){showToast(errorMessage(error));}finally{button.disabled=false;}}
function openConfirm(row){state.deleteRow=row;openOverlay('confirmOverlay');}
function closeConfirm(){state.deleteRow=0;closeOverlay('confirmOverlay');}
async function deleteRecord(){if(!state.deleteRow)return;const row=state.deleteRow;const button=$('confirmDelete');button.disabled=true;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});closeConfirm();showToast(tr('deleted'));await refreshHistory();}catch(error){showToast(errorMessage(error));}finally{button.disabled=false;}}
function focusVisible(event){const target=event.target;if(!target.matches('input,textarea,select'))return;setTimeout(()=>target.scrollIntoView({block:'center',behavior:'smooth'}),250);}
async function initialize(){setLanguage(languageFromEnvironment());try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light';}catch(error){document.documentElement.dataset.theme='light';}renderAttachments('recordForm');renderAttachments('editForm');fitNavigation();window.addEventListener('resize',()=>{fitNavigation();const active=document.activeElement;if(active&&active.matches('input,textarea,select'))active.scrollIntoView({block:'center'});});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center'}),100);});document.addEventListener('focusin',focusVisible);document.querySelectorAll('[data-page]').forEach(node=>node.addEventListener('click',()=>{state.scroll[state.page]=window.scrollY;setPage(node.dataset.page);}));$('brandButton').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);});$('languageButton').addEventListener('click',()=>setLanguage(state.lang==='cn'?'en':'cn',true));$('mobileCn').addEventListener('click',()=>{setLanguage('cn',true);closeMenu();});$('mobileEn').addEventListener('click',()=>{setLanguage('en',true);closeMenu();});$('menuButton').addEventListener('click',toggleMenu);document.addEventListener('click',event=>{if(state.menu&&!$('topbar').contains(event.target))closeMenu();});$('recordForm_camera').addEventListener('click',()=>chooseAsset('recordForm','image','CapturePhoto'));$('recordForm_chooseImage').addEventListener('click',()=>chooseAsset('recordForm','image','SelectImage'));$('recordForm_chooseFile').addEventListener('click',()=>chooseAsset('recordForm','file','SelectFile'));$('recordForm').addEventListener('submit',submitRecord);$('newRecordButton').addEventListener('click',resetRecord);$('editForm_camera').addEventListener('click',()=>chooseAsset('editForm','image','CapturePhoto'));$('editForm_chooseImage').addEventListener('click',()=>chooseAsset('editForm','image','SelectImage'));$('editForm_chooseFile').addEventListener('click',()=>chooseAsset('editForm','file','SelectFile'));$('editForm').addEventListener('submit',saveEdit);$('detailClose').addEventListener('click',closeDetail);$('detailCancel').addEventListener('click',closeDetail);$('detailOverlay').addEventListener('click',event=>{if(event.target===$('detailOverlay'))closeDetail();});$('confirmClose').addEventListener('click',closeConfirm);$('confirmCancel').addEventListener('click',closeConfirm);$('confirmOverlay').addEventListener('click',event=>{if(event.target===$('confirmOverlay'))closeConfirm();});$('confirmDelete').addEventListener('click',deleteRecord);$('loadMoreButton').addEventListener('click',()=>{state.visible=Math.min(state.history.length,state.visible+12);renderHistory();});}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
</script>
