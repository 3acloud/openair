  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("e97717e28990e246_智能文档处理")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {

        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));

    const video = document.createElement('video');

    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

      if(stored)return stored==='en'?'en':'cn';
      const langs=navigator.languages;
      if(!langs||!langs.length)return 'cn';
      return langs.some(x=>String(x).toLowerCase().startsWith('zh'))?'cn':'en';
    }
    function methodLabel(value){const index=METHODS.indexOf(value);return index>=0?t('method'+index):value;}
    function fillMethodSelect(select,all){
      const previous=select.value;
      select.replaceChildren();
      const first=document.createElement('option');first.value='';first.textContent=t(all?'allMethods':'selectMethod');select.append(first);
      for(let i=0;i<METHODS.length;i++){const option=document.createElement('option');option.value=METHODS[i];option.textContent=t('method'+i);select.append(option);}
      select.value=previous;
    }
    function applyLanguage(){
      document.documentElement.lang=state.language==='cn'?'zh-CN':'en';
      document.title=t('appName');
      document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
      document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.placeholder);});
      byId('langButton').textContent=state.language==='cn'?'EN':'中文';
      byId('mobileLangButton').textContent=state.language==='cn'?'EN':'中文';
      fillMethodSelect(byId('createForm_method'),false);fillMethodSelect(byId('methodFilter'),true);
      renderFiles('create');renderRecords();
    }
    function switchLanguage(){state.language=state.language==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',state.language);applyLanguage();}
    function closeMenu(){byId('mobileMenu').hidden=true;byId('menuButton').setAttribute('aria-expanded','false');}
    function updateNavigation(){
      const top=byId('topbar');const links=byId('navLinks');const menu=byId('menuButton');
      links.style.display='flex';
      const available=top.querySelector('.topbar-inner').clientWidth-byId('brand').offsetWidth-45;
      const compact=links.scrollWidth>available;
      links.style.display=compact?'none':'flex';menu.style.display=compact?'block':'none';
      if(!compact)closeMenu();
    }
    function openPage(page,recordHistory){
      if(page===state.page)return;
      if(recordHistory)state.history.push({page:state.page,scrollY:window.scrollY});
      state.page=page;
      byId('workspacePage').hidden=page!=='workspace';byId('historyPage').hidden=page!=='history';
      document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===page));
      closeMenu();window.scrollTo(0,0);
      if(page==='history')loadRecords();
    }
    function showModal(title,kind,wide){
      state.modalKind=kind;byId('modalTitle').textContent=title;byId('modalBody').replaceChildren();byId('modalFoot').replaceChildren();
      byId('modal').classList.toggle('wide',!!wide);byId('modalOverlay').classList.toggle('viewer',kind==='preview'||kind==='result');
      byId('modalOverlay').hidden=false;document.body.style.overflow='hidden';
    }
    function closeModal(){byId('modalOverlay').hidden=true;document.body.style.overflow='';state.modalKind='';}
    function addModalButton(label,handler,primary){const button=document.createElement('button');button.type='button';button.className='btn'+(primary?' primary':'');button.textContent=label;button.addEventListener('click',handler);byId('modalFoot').append(button);return button;}
    function renderFiles(mode){
      const list=byId(mode==='create'?'createFileList':'editForm_files');
      if(!list)return;list.replaceChildren();
      const files=mode==='create'?state.files:state.editFiles;
      const valueInput=byId(mode==='create'?'createForm_filesValue':'editForm_filesValue');
      if(valueInput)valueInput.value=files.join('\n');
      files.forEach((file,index)=>{
        const li=document.createElement('li');const span=document.createElement('span');span.className='filename';span.textContent=fileName(file);span.title=file;
        const preview=document.createElement('button');preview.className='btn';preview.type='button';preview.textContent=t('preview');preview.onclick=()=>previewFile(file);
        const remove=document.createElement('button');remove.className='btn danger';remove.type='button';remove.textContent=t('remove');remove.onclick=()=>{files.splice(index,1);renderFiles(mode);};
        li.append(span,preview,remove);list.append(li);
      });
    }
    async function chooseFile(mode){
      try{const response=await callAppBridge({type:'SelectFile'});const selected=splitFiles(response);const files=mode==='create'?state.files:state.editFiles;for(const file of selected){if(!files.includes(file))files.push(file);}renderFiles(mode);}
      catch(error){if(mode==='create')setStatus(t('selectFailed')+errText(error),'error');else alert(t('selectFailed')+errText(error));}
    }
    async function loadRecords(){
      if(state.loading)return;state.loading=true;byId('recordList').innerHTML='<div class="empty"><span class="spinner"></span></div>';
      try{
        const csv=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:'文档文件,处理方式,具体要求,处理结果'});
        state.records=parseCSV(String(csv||'')).map((row,index)=>({row:index+1,files:row[0]||'',method:row[1]||'',requirement:row[2]||'',result:row[3]||''}));
        state.visible=10;renderRecords();
      }catch(error){byId('recordList').innerHTML='<div class="empty">'+escapeHTML(t('failed')+errText(error))+'</div>';}
      finally{state.loading=false;}
    }
    function filteredRecords(){
      const query=byId('searchInput').value.trim().toLocaleLowerCase();const method=byId('methodFilter').value;
      return state.records.filter(record=>(!method||record.method===method)&&(!query||[record.files,record.method,methodLabel(record.method),record.requirement,record.result].some(value=>String(value).toLocaleLowerCase().includes(query))));
    }
    function renderRecords(){
      const list=byId('recordList');const records=filteredRecords();list.replaceChildren();
      byId('recordCount').textContent=records.length+' '+t('items');
      if(!records.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=state.records.length?t('noMatch'):t('empty');list.append(empty);}
      for(const record of records.slice(0,state.visible)){
        const article=document.createElement('article');article.className='record';
        const top=document.createElement('div');top.className='record-top';const title=document.createElement('h3');title.textContent=splitFiles(record.files).map(fileName).join(' · ')||t('unknown');const pill=document.createElement('span');pill.className='pill';pill.textContent=methodLabel(record.method);top.append(title,pill);
        const description=document.createElement('p');description.textContent=record.requirement||' ';const actions=document.createElement('div');actions.className='actions';
        for(const [key,handler] of [['detail',()=>showDetail(record.row)],['edit',()=>editRecord(record.row)],['delete',()=>deleteRecord(record.row)]]){
          const button=document.createElement('button');button.className='btn'+(key==='delete'?' danger':'');button.type='button';button.textContent=t(key);button.addEventListener('click',handler);actions.append(button);
        }
        article.append(top,description,actions);list.append(article);
      }
      byId('loadMoreButton').hidden=records.length<=state.visible;
    }
    async function getRecord(row){const fields=['文档文件','处理方式','具体要求','处理结果'];const data={};for(const field of fields){data[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row});}return data;}
    function renderMarkdown(text,container){
      if(window.marked&&window.DOMPurify){window.marked.setOptions({gfm:true,breaks:true});container.innerHTML=window.DOMPurify.sanitize(window.marked.parse(String(text||'')));}else{container.textContent=text;}
      container.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(src&&!/^(https?:|data:|blob:)/i.test(src))img.src=fileUrl(src,false);img.style.cursor='pointer';img.title=t('download');img.addEventListener('click',()=>{const anchor=document.createElement('a');anchor.href=img.src;anchor.download='';document.body.append(anchor);anchor.click();anchor.remove();});});
      container.querySelectorAll('a').forEach(anchor=>{anchor.target='_blank';anchor.rel='noopener noreferrer';});
    }
    async function showDetail(row){
      showModal(t('detail'),'detail',true);byId('modalBody').textContent=t('loading');
      try{
        const record=await getRecord(row);if(state.modalKind!=='detail')return;const body=byId('modalBody');body.replaceChildren();const dl=document.createElement('dl');dl.className='detail-grid';
        for(const [label,value] of [[t('documents'),record['文档文件']],[t('method'),methodLabel(record['处理方式'])],[t('requirement'),record['具体要求']]]){
          const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');
          if(label===t('documents')){for(const file of splitFiles(value)){const line=document.createElement('div');const link=document.createElement('a');link.href=fileUrl(file,true);link.target='_blank';link.rel='noopener noreferrer';link.textContent=fileName(file);line.append(link);dd.append(line);}}else dd.textContent=value||'—';dl.append(dt,dd);
        }
        body.append(dl);const result=document.createElement('section');result.className='result-box';const heading=document.createElement('h3');heading.textContent=t('result');result.append(heading);
        const content=document.createElement('div');content.className='markdown-body';if(record['处理结果'])renderMarkdown(record['处理结果'],content);else content.textContent=t('pending');result.append(content);body.append(result);
        addModalButton(t('edit'),()=>editRecord(row),false);addModalButton(t('close'),closeModal,false);
      }catch(error){byId('modalBody').textContent=t('failed')+errText(error);}
    }
    async function editRecord(row){
      showModal(t('edit'),'edit');state.currentRow=row;byId('modalBody').textContent=t('loading');
      try{
        const record=await getRecord(row);if(state.modalKind!=='edit'||state.currentRow!==row)return;state.editFiles=splitFiles(record['文档文件']);
        const form=document.createElement('form');form.id='editForm';form.innerHTML='<div class="field"><label>'+escapeHTML(t('documents'))+'</label><input id="editForm_filesValue" name="文档文件" type="hidden"><button class="btn" id="editForm_select" type="button"><i class="fa-solid fa-paperclip"></i> '+escapeHTML(t('selectFile'))+'</button><ul class="file-list" id="editForm_files"></ul></div><div class="field"><label for="editForm_method">'+escapeHTML(t('method'))+'</label><select class="control" id="editForm_method" name="处理方式" required></select></div><div class="field"><label for="editForm_requirement">'+escapeHTML(t('requirement'))+'</label><textarea class="control" id="editForm_requirement" name="具体要求"></textarea></div><div class="status" id="editForm_status" role="status"></div>';
        byId('modalBody').replaceChildren(form);fillMethodSelect(byId('editForm_method'),false);byId('editForm_method').value=record['处理方式'];byId('editForm_requirement').value=record['具体要求'];renderFiles('edit');byId('editForm_select').onclick=()=>chooseFile('edit');
        const save=addModalButton(t('save'),()=>form.requestSubmit(),true);addModalButton(t('cancel'),closeModal,false);
        form.onsubmit=async event=>{event.preventDefault();if(!state.editFiles.length){byId('editForm_status').textContent=t('noFiles');return;}save.disabled=true;byId('editForm_status').textContent=t('loading');
          try{for(const [field,value] of [['文档文件',state.editFiles.join('\n')],['处理方式',byId('editForm_method').value],['具体要求',byId('editForm_requirement').value]]){await callAppBridge({type:'SetCellValue',data:TABLE,payload:field+'/'+row+'/'+value});}closeModal();await loadRecords();setStatus(t('saved'),'success');}
          catch(error){byId('editForm_status').textContent=t('failed')+errText(error);}finally{save.disabled=false;}
        };
      }catch(error){byId('modalBody').textContent=t('failed')+errText(error);}
    }
    async function deleteRecord(row){if(!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});await loadRecords();setStatus(t('deleted'),'success');}catch(error){alert(t('failed')+errText(error));}}
    async function previewFile(file){
      const extension=fileName(file).split('.').pop().toLowerCase();const isHTML=['html','htm'].includes(extension);const isText=['txt','md','markdown','csv','json','xml','js','css'].includes(extension);
      showModal(fileName(file),'preview',true);const body=byId('modalBody');
      const open=addModalButton(t('openFile'),()=>window.open(fileUrl(file,true),'_blank','noopener'),false);
      const download=addModalButton(t('download'),()=>window.open(fileUrl(file,false),'_blank','noopener'),false);
      if(isHTML){const frame=document.createElement('iframe');frame.className='preview-frame';frame.src=fileUrl(file,true);frame.title=fileName(file);body.append(frame);}
      else if(isText){body.textContent=t('loading');try{const text=await callAppBridge({type:'ReadFile',data:file});if(state.modalKind!=='preview')return;body.replaceChildren();const element=document.createElement('div');element.className=extension==='md'||extension==='markdown'?'markdown-body':'preview-text';if(element.className==='markdown-body')renderMarkdown(text,element);else element.textContent=text;body.append(element);}catch(error){body.textContent=t('failed')+errText(error);}}
      else if(['png','jpg','jpeg','gif','webp','svg','bmp'].includes(extension)){const img=document.createElement('img');img.src=fileUrl(file,false);img.alt=fileName(file);img.style.maxWidth='100%';body.append(img);}
      else{body.textContent=t('fileUnavailable');}
    }
    function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
    async function pollResult(row,token){
      const deadline=Date.now()+1800000;
      while(Date.now()<deadline&&state.pollToken===token){
        await sleep(1000);if(state.pollToken!==token)return;
        try{const text=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'处理结果/'+row});if(String(text||'').trim()){state.polling=false;byId('createSubmit').disabled=false;setStatus(t('complete'),'success');showModal(t('result'),'result',true);const result=document.createElement('div');result.className='markdown-body';renderMarkdown(text,result);byId('modalBody').append(result);addModalButton(t('close'),closeModal,false);await loadRecords();return;}}
        catch(error){setStatus(t('failed')+errText(error),'error');}
      }
      if(state.pollToken===token){state.polling=false;byId('createSubmit').disabled=false;setStatus(t('timeout'),'error');}
    }
    async function submitTask(event){
      event.preventDefault();if(state.polling)return;if(!state.files.length){setStatus(t('noFiles'),'error');return;}
      const selectedMethod=byId('createForm_method').value;if(!selectedMethod)return;
      const documentFiles=state.files.slice();const requirement=byId('createForm_requirement').value;state.polling=true;byId('createSubmit').disabled=true;setStatus(t('processing'));
      try{
        const formData=JSON.stringify({'文档文件':documentFiles.join('\n'),'处理方式':selectedMethod,'具体要求':requirement});
        await callAppBridge({type:'SubmitRecord',data:'文档处理',payload:formData});
        state.files=[];renderFiles('create');byId('createForm').reset();setStatus(t('submitted'));const token=++state.pollToken;pollResult(1,token);
      }catch(error){state.polling=false;byId('createSubmit').disabled=false;setStatus(t('failed')+errText(error),'error');}
    }
    function airBack(){
      if(!byId('modalOverlay').hidden){closeModal();return 'false';}
      if(!byId('mobileMenu').hidden){closeMenu();return 'false';}
      if(state.history.length){const previous=state.history.pop();openPage(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scrollY));return 'false';}
      return 'true';
    }
    window.airBack=airBack;
    async function initialize(){
      state.language=detectLanguage();applyLanguage();
      byId('brand').onclick=()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false);};
      document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>openPage(button.dataset.page,true));
      byId('langButton').onclick=switchLanguage;byId('mobileLangButton').onclick=()=>{switchLanguage();closeMenu();};
      byId('menuButton').onclick=()=>{const menu=byId('mobileMenu');menu.hidden=!menu.hidden;byId('menuButton').setAttribute('aria-expanded',String(!menu.hidden));};
      document.addEventListener('pointerdown',event=>{if(!byId('mobileMenu').hidden&&!byId('topbar').contains(event.target))closeMenu();});
      byId('selectFilesButton').onclick=()=>chooseFile('create');byId('createForm').onsubmit=submitTask;
      byId('searchInput').oninput=()=>{state.visible=10;renderRecords();};byId('methodFilter').onchange=()=>{state.visible=10;renderRecords();};
      byId('refreshButton').onclick=loadRecords;byId('loadMoreButton').onclick=()=>{state.visible+=10;renderRecords();};
      byId('modalClose').onclick=closeModal;byId('modalOverlay').onclick=event=>{if(event.target===byId('modalOverlay'))closeModal();};
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!byId('modalOverlay').hidden)closeModal();else if(event.key==='Escape')closeMenu();});
      document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),300);});
      if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const focused=document.activeElement;if(focused&&focused.matches('input,textarea,select'))setTimeout(()=>focused.scrollIntoView({block:'center',behavior:'smooth'}),120);});
      window.addEventListener('resize',updateNavigation);requestAnimationFrame(updateNavigation);
      await loadRecords();
    }
    document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
  </script>
</body>
</html>
