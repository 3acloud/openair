<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("a1dd890fcb70426e_术语漫说科普")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

async function api(type,data,payload){const q={type};if(data!==undefined)q.data=data;if(payload!==undefined)q.payload=payload;return await callAppBridge(q)}async function csv(k,fields=C[k].fields){const result=await api('GetTableCSV',rawTable(k),fields.join(','));return parseCSV(String(result||'')).map((r,i)=>{const o={_row:i+1};fields.forEach((f,j)=>o[f]=r[j]||'');return o})}async function cell(k,f,row){return String(await api('GetCellValue',rawTable(k),f+'/'+row)||'')}
function markdown(s){if(!s)return '<p class="subtle">'+esc(tx('noPreview'))+'</p>';if(window.marked){let html=marked.parse(String(s));if(window.DOMPurify)html=DOMPurify.sanitize(html,{ADD_ATTR:['target']});return html}return '<p>'+esc(s).replace(/\n/g,'<br>')+'</p>'}function bindMarkdownImages(root){root.querySelectorAll('.markdown-body img').forEach(img=>{let src=img.getAttribute('src')||'';if(src&&!/^https?:|^data:/i.test(src))src=sourceUrl(src);img.src=src;img.title=tx('download');img.addEventListener('click',()=>window.open(src,'_blank','noopener'))})}

function empty(k,error=false){return '<div class="empty"><i class="fa-solid fa-book-open-reader"></i><p>'+esc(tx(error?'retry':'empty'))+'</p><button class="primary" data-act="'+(error?'reload':'new')+'" data-kind="'+k+'">'+esc(error?tx('loading'):tx('new'))+'</button></div>'}function cleanExcerpt(s,n){return String(s||'').replace(/[#*_`>\[\]!]/g,'').replace(/\s+/g,' ').slice(0,n)}
function cards(k){const list=$('list-'+k);if(!list)return;const rows=state.data[k]||[],f=state.filters[k]||{};const q=(f.q||'').trim().toLocaleLowerCase();const searchFields=k==='terms'?['术语名称','关键词']:k==='copy'?['文案标题','术语名称']:k==='comics'?['漫画标题','文案标题']:['音频标题','文案标题'];const filtered=rows.filter(r=>(!q||searchFields.some(x=>String(r[x]||'').toLocaleLowerCase().includes(q)))&&C[k].filters.every(x=>!f[x]||String(r[x]||'').includes(f[x])));list.innerHTML=filtered.length?filtered.slice(0,state.visible[k]).map(r=>card(k,r)).join(''):empty(k);$('more-'+k).classList.toggle('hide',filtered.length<=state.visible[k]);bindMarkdownImages(list)}

function formId(k){return 'form-'+k}function fieldId(k,f){return formId(k)+'-'+C[k].editable.indexOf(f)}async function openForm(k,row=0,prefill={}){state.currentRow=row;const c=C[k],isEdit=row>0;let values={...prefill};if(isEdit){for(const f of [...c.editable,'创建时间'])values[f]=await cell(k,f,row)}let options=[];if(k!=='terms')try{options=await associatedOptions(k)}catch(e){toast(String(e))}const title=(isEdit?tx('edit'):tx('new'))+' · '+tx(k);const fields=c.editable.map(f=>{const id=fieldId(k,f),val=values[f]||'',opts=c.options[f];let input;if(opts)input='<select id="'+id+'" name="'+attr(f)+'" required><option value=""></option>'+opts.map(o=>'<option value="'+attr(o)+'" '+(o===val?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';else if(f==='术语名称'&&k==='copy'||f==='文案标题'&&k!=='terms'&&k!=='copy'){const names=k==='copy'?['术语名称','所属领域','难度等级']:['文案标题','术语名称','目标受众'];input='<select id="'+id+'" name="'+attr(f)+'" required><option value=""></option>'+options.map(o=>{const v=o[f];return '<option value="'+attr(v)+'" '+(v===val?'selected':'')+'>'+esc(v+'（'+names.slice(1).map(x=>o[x]).filter(Boolean).join(' · ')+'）')+'</option>'}).join('')+'</select>'}else if(f==='原始释义')input='<textarea id="'+id+'" name="'+attr(f)+'" required>'+esc(val)+'</textarea>';else input='<input id="'+id+'" name="'+attr(f)+'" type="text" value="'+attr(val)+'" required>';return '<label class="form-field '+(f==='原始释义'?'full':'')+'" for="'+id+'">'+esc(field(f))+input+'</label>'}).join('');const html='<form id="'+formId(k)+'"><div class="form-grid">'+fields+'<input type="hidden" id="'+formId(k)+'-created" name="创建时间" value="'+attr(values['创建时间']||dateString())+'"></div>'+(k==='comics'||k==='audio'?'<div class="preview" id="'+formId(k)+'-preview">'+esc(tx('preview'))+'</div>':'')+'<div class="form-actions"><button type="button" class="ghost" data-act="close">'+esc(tx('cancel'))+'</button><button id="'+formId(k)+'-submit" class="primary" type="submit">'+esc(tx('save'))+'</button></div><div id="'+ async function saveForm(k,row){if(state.busy)return;const c=C[k],form=$(formId(k)),data={};for(const f of c.editable)data[f]=form.elements.namedItem(f).value.trim();data['创建时间']=row?form.elements.namedItem('创建时间').value:dateString();if(c.flow&&!row)data[c.flow]='';state.busy=true;const btn=$(formId(k)+'-submit'),status=$(formId(k)+'-status');btn.disabled=true;try{if(row){for(const f of c.editable)await api('SetCellValue',rawTable(k),f+'/'+row+'/'+data[f]);status.innerHTML='<div class="notice">'+esc(tx('done'))+'</div>';state.busy=false;closeModal();await load(k);homeIfNeeded()}else{await api('SubmitRecord',c.table,JSON.stringify(data));state.currentRow=1;if(c.flow){status.innerHTML='<div class="notice waiting"><i class="fa-solid fa-spinner fa-spin"></i>'+esc(tx(k==='copy'?'waitingCopy':k==='comics'?'waitingComic':'waitingAudio'))+'</div>';const value=await poll(k,1,c.flow);const reveal=Boolean(state.modal);state.busy=false;closeModal();await load(k);homeIfNeeded();if(value&&reveal)await detail(k,1)}else{state.busy=false;closeModal();await load(k);homeIfNeeded();await detail(k,1)}}}catch(e){status.innerHTML='<div class="notice error">'+esc(String(e))+'</div>';state.busy=false;btn.disabled=false}}
async function poll(k,row,f){const deadline=Date.now()+1800000;while(Date.now()<deadline){await new Promise(r=>setTimeout(r,1000));let v='';try{v=await cell(k,f,row)}catch(e){}if(v.trim())return v}toast(tx('timeout'));return ''}function homeIfNeeded(){if(state.page==='home')home()}
async function detail(k,row){state.currentRow=row;openModal(tx('details')+' · '+tx(k),'<div class="waiting"><i class="fa-solid fa-spinner fa-spin"></i>'+esc(tx('loading'))+'</div>',true);try{const c=C[k],data={};for(const f of [...c.editable,'创建时间',...(c.flow?[c.flow]:[])])data[f]=await cell(k,f,row);let html='<div class="detail-fields">'+[...c.editable,'创建时间'].filter(f=>f!=='原始释义').map(f=>'<div class="detail-row"><b>'+esc(field(f))+'</b>'+esc(data[f])+'</div>').join('')+'</div>';if(k==='terms')html+='<h3>'+esc(field('原始释义'))+'</h3><div class="markdown-body">'+markdown(data['原始释义'])+'</div>';if(k==='copy')html+='<h3>'+esc(field('生动解说'))+'</h3><div class="markdown-body">'+markdown(data['生动解说'])+'</div>';if(k==='comics'&&data['漫画图片'])html+='<img class="detail-image" src="'+attr(sourceUrl(data['漫画图片']))+'" alt="'+attr(data['漫画标题'])+'" data-act="download" data-kind="comics" data-row="'+row+'">';if(k==='audio'&&data['解说音频']){html+='<div id="detail-audio"></div><button class="secondary" data-act="play" data-kind="audio" data-row="'+row+'"><i class="fa-solid fa-play"></i>'+esc(tx('play'))+'</button>'}if(k==='comics'||k==='audio'){const linked=await linkedCopy(data['文案标题']);if(linked){const story=await cell('copy','生动解说',linked._row);html+='<h3>'+esc(field('生动解说'))+'</h3><div class="markdown-body">'+markdown(story)+'</div>'}}html+='<div class="form-actions">'+(k==='terms'?action(k,row,'routeCopy','createCopy','fa-wand-magic-sparkles','secondary'):k==='copy'?action(k,row,'routeComics','createComic','fa-palette','secondary')+action(k,row,'routeAudio','createAudio','fa-headphones','secondary'):k==='comics'||k==='audio'?action(k,row,'download','download','fa-download'):'')+action(k,row,'edit','edit','fa-pen','primary')+'</div>';$('modalBody').innerHTML=html;bindMarkdownImages($('modalBody'))}catch(e){$('modalBody').innerHTML='<div class="notice error">'+esc(String(e))+'</div>'}}
async function removeRecord(k,row){if(!confirm(tx('confirmDelete')))return;try{await api('DeleteRecord',rawTable(k),row.toString());toast(tx('done'));await load(k);homeIfNeeded()}catch(e){toast(String(e))}}
async function audioUrl(filename){const b64=await api('FileToBase64',filename);return String(b64).startsWith('data:')?b64:'data:audio/mpeg;base64,'+b64}async function playAudio(row){try{const f=await cell('audio','解说音频',row);if(!f){toast(tx('noPreview'));return}const el=$('detail-audio')||$('audio-player-'+row);if(!el)return;let player=el.querySelector('audio');if(!player){player=document.createElement('audio');player.controls=true;player.className='audio-player';el.appendChild(player);player.src=await audioUrl(f)}await player.play()}catch(e){toast(String(e))}}
async function downloadFile(k,row){try{const f=await cell(k,C[k].flow,row);if(!f){toast(tx('noPreview'));return}const a=document.createElement('a');a.href=sourceUrl(f);a.download=f;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}catch(e){toast(String(e))}}
async function route(k,row,target){const r=state.data[k]?.find(x=>x._row===row);let value=r?.[k==='terms'?'术语名称':'文案标题'];if(!value)value=await cell(k,k==='terms'?'术语名称':'文案标题',row);closeModal();showPage(target);const fieldName=target==='copy'?'术语名称':'文案标题';await openForm(target,0,{[fieldName]:value})}
async function viewCopyFromAudio(row){const title=await cell('audio','文案标题',row),r=await linkedCopy(title);if(r)await detail('copy',r._row);else toast(tx('noPreview'))}
function setLanguage(lang){state.lang=lang;document.documentElement.lang=lang==='en'?'en':'zh-CN';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch(e){}document.querySelectorAll('[data-i]').forEach(el=>el.textContent=tx(el.dataset.i));renderNav();if(state.page==='home')home();else{section(state.page);cards(state.page);decorate(state.page)}}
function focusVisible(e){if(!e.target.matches('input,textarea,select'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),280)}function handleViewport(){const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)}
async function initialize(){state.lang=initialLanguage();document.documentElement.lang=state.lang==='en'?'en':'zh-CN';try{state.mode=await api('模式');document.body.classList.toggle('dark',String(state.mode).trim()==='暗色')}catch(e){document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme:dark)').matches)}setLanguage(state.lang);showPage('home',false);$('brand').addEventListener('click',()=>{try{parent.closeFullHtml(false)}catch(e){}});$('hamburger').addEventListener('click',()=>{const menu=$('mobileMenu');menu.classList.toggle('open');$('hamburger').setAttribute('aria-expanded',menu.classList.contains('open')?'true':'false')});document.addEventListener('click',async e=>{if(!e.target.closest('#topbar'))closeMenu();const btn=e.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act,k=btn.dataset.kind,row=Number(btn.dataset.row||0);if(act==='page'){showPage(k);return}if(act==='lang'){setLanguage(state.lang==='en'?'cn':'en');closeMenu();return}try{if(act==='new'){if(state.page!==k)showPage(k);await openForm(k);return}if(act==='reload'){await load(k);return}if(act==='more'){state.visible[k]+=9;cards(k);decorate(k);return}if(act==='close'){closeModal();return}if(act==='detail'){await detail(k,row);return}if(act==='edit'){await openForm(k,row);return}if(act==='delete'){await removeRecord(k,row);return}if(act==='routeCopy'){await route(k,row,'copy');return}if(act==='routeComics'){await route(k,row,'comics');return}if(act==='routeAudio'){await route(k,row,'audio');return}if(act==='download'){await downloadFile(k,row);return}if(act==='play'){await playAudio(row);return}if(act==='viewCopy'){await viewCopyFromAudio(row);return}}catch(err){toast(String(err))}});document.addEventListener('input',e=>{const m=e.target.id.match(/^search-(terms|copy|comics|audio)$/);if(m){const k=m[1];state.filters[k]=state.filters[k]||{};state.filters[k].q=e.target.value;state.visible[k]=9;cards(k);decorate(k)}});document.addEventListener('change',e=>{const m=e.target.id.match(/^filter-(terms|copy|comics|audio)-(\d+)$/);if(m){const k=m[1],f=C[k].filters[Number(m[2])];state.filters[k]=state.filters[k]||{};state.filters[k][f]=e.target.value;state.visible[k]=9;cards(k);decorate(k)}});$('modalClose').addEventListener('click',closeModal);$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))closeModal()});document.addEventListener('focusin',focusVisible);window.visualViewport?.addEventListener('resize',handleViewport);window.addEventListener('resize',fitNav)}
function airBack(){if(state.modal){closeModal(true);return 'false'}if(state.history.length){const prev=state.history.pop();showPage(prev.page,false);setTimeout(()=>window.scrollTo(0,prev.scroll),100);return 'false'}return 'true'}window.airBack=airBack;
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
</script>
</body>
