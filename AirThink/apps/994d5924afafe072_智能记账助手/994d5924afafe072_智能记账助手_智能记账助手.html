<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("994d5924afafe072_智能记账助手")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");

}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {

}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {

}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {

                            i += 2; // 跳过两个双引号

                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function translate(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('app');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=t(el.dataset.ph));$('language').textContent=lang==='cn'?'EN':'中文';$('historySearch').ariaLabel=t('search');$('previous').ariaLabel=lang==='cn'?'上一行':'Previous row';$('next').ariaLabel=lang==='cn'?'下一行':'Next row';$('newEntry').ariaLabel=t('again');$('menuToggle').ariaLabel=lang==='cn'?'导航菜单':'Navigation menu';$('closeModal').ariaLabel=t('cancel');['homeChips','entryChips'].forEach(id=>{$(id).replaceChildren();t('examples').forEach(example=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=example;b.disabled=busy;b.onclick=()=>{showPage('entry');$('entryForm_command').value=example;controls();$('entryForm_command').focus()};$(id).append(b)})});render();renderResult();requestAnimationFrame(responsive)}
function responsive(){const nav=$('navigation');const compact=nav.classList.contains('compact');nav.classList.remove('compact');const inner=nav.firstElementChild;const need=$('brand').offsetWidth+$('navLinks').scrollWidth+92>inner.clientWidth;nav.classList.toggle('compact',need);if(!need||!compact)closeMenu()}
function closeMenu(){$('navigation').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false')}
function showPage(next,remember=true,scroll=0){if(next===page){closeMenu();return}if(remember)historyStack.push({page,y:window.scrollY});page=next;document.querySelectorAll('.page').forEach(el=>el.hidden=el.id!==page);document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);if(el.dataset.page===page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});closeMenu();window.scrollTo(0,scroll)}
window.airBack=function(){if(!$('modal').hidden){closeModal();return'false'}if($('navigation').classList.contains('open')){closeMenu();return'false'}if(historyStack.length){const previous=historyStack.pop();showPage(previous.page,false,previous.y);return'false'}return'true'};
function controls(){$('submitEntry').disabled=busy||!$('entryForm_command').value.trim();$('entryForm_command').disabled=busy;$('previous').disabled=busy||currentRow<=1;$('next').disabled=busy||currentRow>=count||count===0;$('newEntry').disabled=busy;$('historyNew').disabled=busy;$('position').textContent=currentRow+' / '+(loaded?count:'—');document.querySelectorAll('.chip').forEach(b=>b.disabled=busy)}
function renderResult(){const el=$('resultContent');$('resultCommand').hidden=!resultInstruction;$('resultCommand').textContent=resultInstruction;if(currentRow===0&&!busy){el.replaceChildren();const e=document.createElement('div');e.className='empty';e.textContent=t('warm');el.append(e)}else if(busy){el.replaceChildren();const e=document.createElement('div');e.className='empty busy';e.textContent=t('waiting');el.append(e)}else markdown(el,resultText);if(entryState)status('entryStatus',t(entryState),entryState==='timeout');controls()}
function resetEntry(){if(busy)return;$('entryForm_command').value='';resultText='';resultInstruction='';currentRow=0;entryState='';status('entryStatus','');renderResult();showPage('entry');$('entryForm_command').focus()}
function emptyNode(text,action=false){const div=document.createElement('div');div.className='card empty';const icon=document.createElement('i');icon.className='fa-solid fa-book-open';const p=document.createElement('p');p.textContent=text;div.append(icon,p);if(action){const b=document.createElement('button');b.textContent=t('go');b.className='primary';b.onclick=()=>showPage('entry');div.append(b)}return div}
function recordCard(record,recent){const card=document.createElement('article');card.className='card record';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',t('detail')+': '+record.command);const top=document.createElement('div');top.className='record-top';const icon=document.createElement('i');icon.className='fa-regular fa-file-lines';const title=document.createElement('h3');title.textContent=record.command;if(recent)title.className='clamp';top.append(icon,title);const summary=document.createElement('p');summary.textContent=record.summary===undefined?t('loading'):short(record.summary,recent?80:100)||t('pending');card.append(top,summary);card.onclick=()=>openRecord(record,'detail');card.onkeydown=e=>{if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openRecord(record,'detail')}};if(!recent){const actions=document.createElement('div');actions.className='actions';['detail','edit','delete'].forEach(action=>{const b=document.createElement('button');b.textContent=t(action);if(action==='delete')b.className='danger';b.disabled=busy&&action!=='detail';b.onclick=e=>{e.stopPropagation();openRecord(record,action)};actions.append(b)});card.append(actions)}return card}
function render(){controls();$('total').textContent=loaded?count:'—';$('latest').textContent=loaded?(rows.length?short(rows[0].latest??rows[0].command,30):t('none')):'—';$('latestButton').disabled=!rows.length;$('recentRecords').replaceChildren();$('historyRecords').replaceChildren();if(!loaded){$('recentRecords').append(emptyNode(t('loading')));$('historyRecords').append(emptyNode(t('loading')));return}rows.slice(0,5).forEach(r=>$('recentRecords').append(recordCard(r,true)));if(!rows.length)$('recentRecords').append(emptyNode(t('empty'),true));const key=$('historySearch').value.trim().toLocaleLowerCase();const filtered=rows.filter(r=>r.command.toLocaleLowerCase().includes(key));filtered.forEach(r=>$('historyRecords').append(recordCard(r,false)));$('matchCount').textContent=filtered.length+' '+t('matches');if(!filtered.length)$('historyRecords').append(emptyNode(rows.length?t('noMatch'):t('empty'),!rows.length))}
async function refresh(){const version=++refreshVersion;status('appStatus',t('loading'));try{const [csv,total]=await Promise.all([api('GetTableCSV','用户指令,执行结果'),api('GetRecordCount')]);if(version!==refreshVersion)return;const n=Number(total);if(!Number.isInteger(n)||n<0)throw new Error('Invalid record count');count=n;rows=parseCSV(csv).map((r,i)=>({command:r[0]||'',row:i+1}));loaded=true;render();for(let i=0;i<rows.length;i+=6){const batch=rows.slice(i,i+6);await Promise.all(batch.map(asyncRecordSummary));if(version!==refreshVersion)return;render()}if(rows.length){rows[0].latest=await api('GetCellValue','用户指令/1');if(version!==refreshVersion)return}render();status('appStatus','')}catch(e){if(version===refreshVersion){fail(e);if(!loaded){$('recentRecords').replaceChildren(emptyNode(t('error')+(e.message||e)));$('historyRecords').replaceChildren(emptyNode(t('error')+(e.message||e)))}}}}
async function asyncRecordSummary(record){const value=await api('GetCellValue','执行结果/'+record.row);record.summary=plain(value)}
async function resolveRow(record){const value=await api('GetRecordRow','用户指令/'+record.command);const row=Number(value);if(!Number.isInteger(row)||row<1)throw new Error(t('missing'));return row}
async function readRow(row){const command=await api('GetCellValue','用户指令/'+row);const result=await api('GetCellValue','执行结果/'+row);return{command,result}}
async function browse(delta){if(busy)return;const row=currentRow+delta;if(row<1||row>count)return;busy=true;controls();status('entryStatus',t('loading'));try{const record=await readRow(row);currentRow=row;resultInstruction=record.command;resultText=record.result;entryState='';status('entryStatus','')}catch(e){fail(e,'entryStatus')}finally{busy=false;renderResult()}}
function openModal(title,reading=false){lastFocus=document.activeElement;modalVersion++;$('modalTitle').textContent=title;$('modalBody').replaceChildren();status('modalStatus',t('loading'));$('modal').hidden=false;$('modal').classList.toggle('reading',reading);document.body.style.overflow='hidden';$('dialog').focus();return modalVersion}
function closeModal(){if(modalBusy)return;modalVersion++;$('modal').hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function appendMarkdown(parent,text){const div=document.createElement('div');div.className='markdown';markdown(div,text);parent.append(div)}
async function openRecord(record,action){if(busy&&action!=='detail'){status('appStatus',t('locked'));return}const token=openModal(t(action==='edit'?'editTitle':action==='delete'?'deleteTitle':'detail'),action==='detail');try{const row=await resolveRow(record);const value=await readRow(row);if(token!==modalVersion)return;status('modalStatus','');const body=$('modalBody');if(action==='detail'){const cmd=document.createElement('div');cmd.className='command';cmd.textContent=value.command;body.append(cmd);appendMarkdown(body,value.result);return}if(action==='delete'){const p=document.createElement('p');p.textContent=t('confirm');const cmd=document.createElement('div');cmd.className='command';cmd.textContent=value.command;const actions=document.createElement('div');actions.className='actions';const cancel=document.createElement('button');cancel.textContent=t('cancel');cancel.onclick=closeModal;const del=document.createElement('button');del.className='danger';del.textContent=t('delete');del.onclick=async()=>{modalBusy=true;del.disabled=true;cancel.disabled=true;try{const latestRow=await resolveRow(record);await api('DeleteRecord',latestRow.toString());modalBusy=false;closeModal();currentRow=0;resultText='';resultInstruction='';entryState='';renderResult();await refresh()}catch(e){fail(e,'modalStatus')}finally{modalBusy=false;del.disabled=false;cancel.disabled=false}};actions.append(cancel,del);body.append(p,cmd,actions);return}const form=document.createElement('form');form.id='editForm';const label=document.createElement('label');label.htmlFor='editForm_command';label.textContent=t('command');const input=document.createElement('textarea');input.id='editForm_command';input.name='用户指令';input.required=true;input.value=value.command;const previewLabel=document.createElement('p');previewLabel.className='hint';previewLabel.textContent=t('readonly');const preview=document.createElement('div');preview.id='editForm_result';preview.className='markdown';preview.setAttribute('aria-readonly','true');markdown(preview,value.result);const actions=document.createElement('div');actions.className='actions';const cancel=document.createElement('button');cancel.type='button';cancel.textContent=t('cancel');cancel.onclick=closeModal;const save=document.createElement('button');save.type='submit';save.className='primary';save.textContent=t('save');actions.append(cancel,save);form.append(label,input,previewLabel,preview,actions);body.append(form);form.onsubmit=async e=>{e.preventDefault();if(!input.value.trim()||modalBusy)return;modalBusy=true;save.disabled=true;cancel.disabled=true;try{const latestRow=await resolveRow(record);if(input.value.trim()!==value.command)await api('SetCellValue','用户指令/'+latestRow+'/'+input.value.trim());modalBusy=false;closeModal();if(currentRow===latestRow){resultInstruction=input.value.trim();renderResult()}await refresh()}catch(error){fail(error,'modalStatus')}finally{modalBusy=false;save.disabled=false;cancel.disabled=false}}}catch(e){if(token===modalVersion)fail(e,'modalStatus')}}
async function submit(e){e.preventDefault();const command=$('entryForm_command').value.trim();if(busy||!command)return;busy=true;entryState='';status('entryStatus',t('waiting'));controls();render();let timer;try{await api('SubmitRecord',JSON.stringify({'用户指令':command}),'记账任务');currentRow=1;resultInstruction=command;resultText='';renderResult();const deadline=Date.now()+1800000;const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(t('timeout'))),1800000)});const poll=async()=>{while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));const result=await api('GetCellValue','执行结果/'+currentRow);if(result.trim()){const instruction=await api('GetCellValue','用户指令/'+currentRow);return{result,instruction}}}throw new Error(t('timeout'))};const answer=await Promise.race([poll(),timeout]);resultText=answer.result;resultInstruction=answer.instruction;status('entryStatus','')}catch(error){fail(error,'entryStatus')}finally{clearTimeout(timer);busy=false;renderResult();await refresh()}}
async function initialize(){lang=language();translate();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){fail(e)}};$('menuToggle').onclick=()=>{const open=$('navigation').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('navigation').contains(e.target))closeMenu()});$('language').onclick=()=>{lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch{}closeMenu();translate()};$('start').onclick=()=>showPage('entry');$('allRecords').onclick=$('viewHistory').onclick=()=>showPage('history');$('latestButton').onclick=()=>{if(rows.length)openRecord(rows[0],'detail')};$('historyNew').onclick=$('newEntry').onclick=resetEntry;$('entryForm_command').oninput=controls;$('entryForm').onsubmit=submit;$('previous').onclick=()=>browse(-1);$('next').onclick=()=>browse(1);$('historySearch').oninput=render;$('refresh').onclick=refresh;$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden)closeModal();else closeMenu()}if(e.key==='Tab'&&!$('modal').hidden){const focusable=Array.from($('dialog').querySelectorAll('button,input,textarea,a[href],[tabindex="0"]')).filter(el=>!el.disabled);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('dialog'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});window.addEventListener('resize',responsive);const reveal=()=>{const el=document.activeElement;if(el&&/INPUT|TEXTAREA|SELECT/.test(el.tagName)){const keyboard=window.visualViewport?Math.max(0,window.innerHeight-window.visualViewport.height):300;document.documentElement.style.setProperty('--keyboard',keyboard+'px');setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),150)}};document.addEventListener('focusin',reveal);if(window.visualViewport)window.visualViewport.addEventListener('resize',reveal);await Promise.allSettled([callAppBridge({type:'模式'}).then(mode=>document.body.classList.toggle('dark',String(mode).trim()==='暗色')).catch(()=>document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches)),refresh()])}
(async () => { await initialize(); })();
</script>
