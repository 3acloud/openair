<style>

main{max-width:1160px;margin:0 auto;padding:46px 24px 120px}.page[hidden]{display:none!important}.page-heading{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{letter-spacing:.3em;color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase}.page-heading h1,.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.2;margin:10px 0 13px;font-weight:700;letter-spacing:.08em}.page-heading p,.hero p{color:var(--muted);margin:0;font-size:16px}.hero{text-align:center;min-height:440px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid var(--line);border-radius:16px;background:linear-gradient(125deg,transparent,rgba(179,144,91,.09),transparent),var(--sheet);box-shadow:var(--shadow);position:relative;overflow:hidden;padding:45px 24px}.hero:before,.hero:after{content:"";position:absolute;border:1px solid var(--line);border-radius:50%;width:280px;height:280px;opacity:.45}.hero:before{top:-170px;left:-100px}.hero:after{bottom:-210px;right:-65px;width:370px;height:370px}.hero .eyebrow,.hero h1,.hero p,.hero button{position:relative;z-index:1}.hero p{max-width:660px}.ornament{font-size:24px;letter-spacing:15px;color:var(--gold);margin-bottom:15px}.primary-button,.secondary-button,.danger-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:7px;padding:12px 19px;transition:transform .2s,box-shadow .2s,background .2s}.primary-button{border:1px solid var(--wood);background:var(--wood);color:#f9f1e2}.primary-button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(43,36,28,.25)}.secondary-button{border:1px solid var(--line);background:var(--sheet);color:var(--ink)}.secondary-button:hover{border-color:var(--accent);transform:translateY(-2px)}.danger-button{border:1px solid #ad584d;color:#ad584d;background:transparent}.danger-button:hover{background:rgba(173,88,77,.08)}.hero .primary-button{margin-top:34px;padding:15px 32px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0 34px}.stat-card,.panel,.letter-item{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat-card{padding:22px;display:flex;gap:18px;align-items:center}.stat-card i{color:var(--accent);background:rgba(172,139,93,.13);padding:15px;border-radius:50%;font-size:19px}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:29px;font-weight:bold;line-height:1.2}.panel{padding:27px;margin-bottom:26px}.section-title{font-size:22px;margin:0 0 19px;display:flex;align-items:center;gap:11px}.section-title i{color:var(--accent)}.letter-list{display:grid;gap:12px}.letter-item{width:100%;padding:17px 20px;display:flex;text-align:left;align-items:center;gap:17px;color:var(--ink);transition:transform .2s,box-shadow .2s}.letter-item:hover{transform:translateY(-2px);box-shadow:0 15px 30px rgba(55,42,28,.15)}.letter-icon{width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--accent)}.letter-copy{flex:1;min-width:0}.letter-copy strong{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.letter-copy small{color:var(--muted)}.letter-arrow{color:var(--accent)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:7px;font-weight:700;font-size:14px}.field input,.field select,.field textarea,.filter-bar input,.filter-bar select{width:100%;min-height:45px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:10px 13px;outline:0}.field textarea{resize:vertical;min-height:110px}.field input:focus,.field select:focus,.field textarea:focus,.filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(172,139,93,.15)}.field[hidden]{display:none}.file-row{display:flex;gap:10px}.file-row input{flex:1}.file-row button{white-space:nowrap}.form-actions{border-top:1px solid var(--line);margin-top:25px;padding-top:22px;display:flex;align-items:center;gap:16px}.message{min-height:24px;color:var(--accent)}.toggle-row{display:flex;align-items:center;gap:10px;min-height:45px}.toggle-row input{appearance:none;width:47px;height:26px;border-radius:50px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}.toggle-row input:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;transition:transform .2s}.toggle-row input:checked{background:var(--accent)}.toggle-row input:checked:after{transform:translateX(21px)}
.result-panel{border-color:var(--gold);background:linear-gradient(180deg,rgba(185,150,98,.08),transparent 90px),var(--sheet)}.waiting{display:flex;align-items:center;gap:12px;color:var(--muted)}.waiting i{color:var(--accent)}.markdown{font-family:system-ui,"Noto Serif SC",sans-serif;line-height:1.8;overflow-wrap:anywhere}.markdown h1,.markdown h2,.markdown h3,.markdown h4{font-family:"Noto Serif SC","Songti SC",serif;line-height:1.35;margin:1.3em 0 .6em}.markdown h1{font-size:1.8em}.markdown h2{font-size:1.45em}.markdown p{margin:.8em 0}.markdown blockquote{border-left:4px solid var(--gold);margin:1em 0;padding:.2em 1em;color:var(--muted);background:rgba(169,135,88,.08)}.markdown pre{overflow:auto;padding:16px;background:rgba(90,75,55,.12);border-radius:7px}.markdown code{font-family:Consolas,monospace}.markdown table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}.markdown th,.markdown td{border:1px solid var(--line);padding:7px 12px}.markdown img{max-width:100%;height:auto;border-radius:6px;cursor:pointer}.markdown a{overflow-wrap:anywhere}.markdown hr{border:0;border-top:1px solid var(--line)}

@media(max-width:720px){main{padding:28px 15px 160px}.nav-inner{padding:0 15px;min-height:60px}.brand{font-size:16px}.brand i{font-size:21px}.hero{min-height:350px}.stats{grid-template-columns:1fr;gap:10px}.stat-card{padding:15px}.stat-value{font-size:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-heading{flex-direction:column}.filter-bar{flex-direction:column}.filter-bar select{max-width:none}.panel{padding:19px}.file-row{flex-wrap:wrap}.file-row button{width:100%}.modal-backdrop{padding:0}.modal{width:100%;height:100dvh;max-height:100dvh;border:0;border-radius:0}.modal-body{padding-bottom:45vh}}

<body>
<header class="topbar" id="topbar">
  <div class="nav-inner" id="navInner">
    <button class="brand" id="brandButton" type="button"><i class="fa-solid fa-scroll" aria-hidden="true"></i><span data-i18n="appName">古文跨时空对话</span></button>
    <div class="nav-spacer"></div>
    <nav class="desktop-links" id="desktopLinks" aria-label="Main navigation">
      <button class="nav-link active" type="button" data-page="home" data-i18n="home">首页</button>
      <button class="nav-link" type="button" data-page="start" data-i18n="start">开启对话</button>
      <button class="nav-link" type="button" data-page="history" data-i18n="history">时光书简</button>
      <button class="language-button" id="desktopLanguage" type="button">English</button>
    </nav>
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <button class="nav-link active" type="button" data-page="home" data-i18n="home">首页</button>
    <button class="nav-link" type="button" data-page="start" data-i18n="start">开启对话</button>
    <button class="nav-link" type="button" data-page="history" data-i18n="history">时光书简</button>
    <button class="language-button" id="mobileLanguage" type="button">English</button>
  </div>
</header>
<main>
  <section class="page" id="homePage">
    <div class="hero">
      <div class="ornament" aria-hidden="true"> · </div>
      <div class="eyebrow" data-i18n="heroEyebrow">与千年文心相遇</div>
      <h1 data-i18n="appName">古文跨时空对话</h1>
      <p data-i18n="heroText">穿越千年的对话，沉浸式诗词解析，趣味背诵与写作引用，带你领略古文之美。</p>
      <button class="primary-button" id="heroStart" type="button"><i class="fa-solid fa-feather-pointed"></i><span data-i18n="heroButton">开始时空之旅</span></button>
    </div>
    <div class="stats">
      <div class="stat-card"><i class="fa-solid fa-book-open"></i><div><div class="stat-label" data-i18n="totalCount">总学习次数</div><div class="stat-value" id="totalValue">—</div></div></div>
      <div class="stat-card"><i class="fa-solid fa-comments"></i><div><div class="stat-label" data-i18n="dialogueCount">跨时空对话次数</div><div class="stat-value" id="dialogueValue">—</div></div></div>
      <div class="stat-card"><i class="fa-solid fa-leaf"></i><div><div class="stat-label" data-i18n="poetryCount">诗词理解与背诵次数</div><div class="stat-value" id="poetryValue">—</div></div></div>
    </div>
    <div class="panel"><h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i><span data-i18n="recent">最近学习足迹</span></h2><div class="letter-list" id="recentList"></div></div>
  </section>
  <section class="page" id="startPage" hidden>
    <div class="page-heading"><div><div class="eyebrow" data-i18n="journeyEyebrow">执笔 · 启程</div><h1 data-i18n="journeyTitle">开启学习之旅</h1><p data-i18n="journeyText">选择你的修行方式，与古人相遇。</p></div></div>
    <div class="panel"><h2 class="section-title"><i class="fa-solid fa-feather"></i><span data-i18n="newStudy">新建古文学习</span></h2>
      <form id="studyForm" novalidate>
        <div class="form-grid">
          <div class="field"><label for="studyForm_mode" data-i18n="mode">学习方式</label><select id="studyForm_mode" name="学习方式" required><option value="" data-i18n="chooseMode">请选择学习方式</option><option value="跨时空对话" data-mode-label="dialogue">跨时空对话</option><option value="诗词理解" data-mode-label="poetry">诗词理解</option><option value="游戏背诵" data-mode-label="game">游戏背诵</option><option value="写作引用" data-mode-label="writing">写作引用</option></select></div>
          <div class="field"><label for="studyForm_person" data-i18n="person">古人姓名</label><input id="studyForm_person" name="古人姓名" type="text" autocomplete="off"></div>
          <div class="field"><label for="studyForm_poem" data-i18n="poem">诗文名称</label><input id="studyForm_poem" name="诗文名称" type="text" autocomplete="off"></div>
          <div class="field full"><label for="studyForm_original" data-i18n="original">诗文原文</label><textarea id="studyForm_original" name="诗文原文" rows="4"></textarea></div>
          <div class="field full" id="questionField" hidden><label for="studyForm_question" data-i18n="question">学生问题</label><textarea id="studyForm_question" name="学生问题" rows="3"></textarea></div>
          <div class="field full" id="themeField" hidden><label for="studyForm_theme" data-i18n="theme">作文主题</label><input id="studyForm_theme" name="作文主题" type="text"></div>
          <div class="field" id="toneField" hidden><label for="studyForm_tone" data-i18n="tone">文章基调</label><select id="studyForm_tone" name="文章基调"><option value="" data-i18n="chooseTone">请选择文章基调</option><option value="温暖" data-tone-label="warm">温暖</option><option value="豁达" data-tone-label="open">豁达</option><option value="感伤" data-tone-label="sad">感伤</option><option value="激昂" data-tone-label="bold">激昂</option><option value="沉静" data-tone-label="calm">沉静</option></select></div>
          <div class="field" id="quantityField" hidden><label for="studyForm_quantity" data-i18n="quantity">题目数量</label><input id="studyForm_quantity" name="题目数量" type="number" min="1" step="1"></div>
          <div class="field" id="timedField" hidden><label for="studyForm_timed" data-i18n="timed">限时挑战</label><div class="toggle-row"><input id="studyForm_timed" name="限时挑战" type="checkbox" role="switch"><span id="timedLabel">否</span></div></div>
          <div class="field full"><label for="studyForm_file" data-i18n="material">学习材料文件</label><div class="file-row"><input id="studyForm_file" name="学习材料文件" type="text" readonly><button class="secondary-button" id="uploadButton" type="button"><i class="fa-solid fa-upload"></i><span data-i18n="upload">上传文件</span></button></div></div>
        </div>
        <div class="form-actions"><button class="primary-button" id="submitButton" type="submit"><i class="fa-solid fa-paper-plane"></i><span data-i18n="submit">提交开启</span></button><span class="message" id="formMessage" role="status"></span></div>
      </form>
    </div>
    <div class="panel result-panel" id="resultPanel" hidden><h2 class="section-title"><i class="fa-solid fa-envelope-open-text"></i><span data-i18n="waitingTitle">等待古人回信</span></h2><div class="waiting" id="waitingMessage"><i class="fa-solid fa-spinner fa-spin"></i><span data-i18n="waitingText">正在跨越时空长河与古人连线...</span></div><article class="markdown" id="resultMarkdown" hidden></article></div>
  </section>
  <section class="page" id="historyPage" hidden>
    <div class="page-heading"><div><div class="eyebrow" data-i18n="historyEyebrow">珍藏 · 回望</div><h1 data-i18n="history">时光书简</h1><p data-i18n="historyText">这里珍藏着你与古人交流的所有点滴。</p></div><button class="primary-button" id="newDialogue" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="newDialogue">开启新对话</span></button></div>
    <div class="panel"><div class="filter-bar"><input id="historySearch" type="search" data-placeholder="searchPlaceholder" placeholder="搜索古人姓名或诗文名称" aria-label="Search"><select id="historyFilter" aria-label="Filter"><option value="" data-i18n="allModes">全部学习方式</option><option value="跨时空对话" data-mode-label="dialogue">跨时空对话</option><option value="诗词理解" data-mode-label="poetry">诗词理解</option><option value="游戏背诵" data-mode-label="game">游戏背诵</option><option value="写作引用" data-mode-label="writing">写作引用</option></select></div><div class="table-scroll"><table class="history-table"><thead><tr><th data-i18n="mode">学习方式</th><th data-i18n="person">古人姓名</th><th data-i18n="poem">诗文名称</th><th data-i18n="actions">操作</th></tr></thead><tbody id="historyBody"></tbody></table></div><div id="historyEmpty" class="empty" hidden></div></div>
  </section>
</main>
<div class="modal-backdrop" id="detailBackdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-header"><h2 id="detailTitle" data-i18n="resultDetail">书简详情</h2><button class="icon-button" id="detailClose" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><div class="detail-meta" id="detailMeta"></div><article class="markdown" id="detailMarkdown"></article></div></div></div>
<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;

    `;
    
    // 创建取消按钮

    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

const MODE_KEYS = {'跨时空对话':'dialogue','诗词理解':'poetry','游戏背诵':'game','写作引用':'writing'};
let language = 'cn';
let page = 'home';
let pageHistory = [];
let rows = [];
let submitting = false;
let modalOpen = false;
let pollToken = 0;
const byId = id => document.getElementById(id);
const t = key => WORDS[language][key] || key;
function textNode(value){return document.createTextNode(value == null ? '' : String(value))}
function clear(el){el.replaceChildren()}
function localizedMode(value){return t(MODE_KEYS[value] || value)}
function initialLanguage(){
  const urlLanguage = new URLSearchParams(location.search).get('lang');
  if(urlLanguage === 'en' || urlLanguage === 'cn') return urlLanguage;
  const stored = localStorage.getItem('iThinkAir_UiLanguage');
  if(stored) return stored === 'en' ? 'en' : 'cn';
  const languages = navigator.languages;
  if(!languages || !languages.length) return 'cn';
  return languages.some(x => String(x).toLowerCase().startsWith('zh')) ? 'cn' : 'en';
}
function applyLanguage(){
  document.documentElement.lang = language === 'cn' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {el.textContent = t(el.dataset.i18n)});
  document.querySelectorAll('[data-placeholder]').forEach(el => {el.placeholder = t(el.dataset.placeholder)});
  document.querySelectorAll('[data-mode-label]').forEach(el => {el.textContent = t(el.dataset.modeLabel)});
  document.querySelectorAll('[data-tone-label]').forEach(el => {el.textContent = t(el.dataset.toneLabel)});
  byId('desktopLanguage').textContent = language === 'cn' ? 'English' : '中文';
  byId('mobileLanguage').textContent = language === 'cn' ? 'English' : '中文';
  byId('timedLabel').textContent = t(byId('studyForm_timed').checked ? 'yes' : 'no');
  renderRecent(); renderHistory();
  if(modalOpen && byId('detailBackdrop').dataset.row) renderDetailMeta(Number(byId('detailBackdrop').dataset.row));
  fitNavigation();
}
function toggleLanguage(){language = language === 'cn' ? 'en' : 'cn';localStorage.setItem('iThinkAir_UiLanguage',language);applyLanguage()}
function fitNavigation(){
  const nav = byId('navInner'), links = byId('desktopLinks');
  nav.classList.remove('compact');
  if(nav.scrollWidth > nav.clientWidth || nav.clientWidth - byId('brandButton').offsetWidth < links.scrollWidth + 44) nav.classList.add('compact');
  if(!nav.classList.contains('compact')) closeMenu();
}
function closeMenu(){byId('mobileMenu').classList.remove('open');byId('menuButton').setAttribute('aria-expanded','false')}
function showPage(next, remember = true, restoreY = 0){
  if(page !== next && remember) pageHistory.push({page:page,y:window.scrollY});
  page = next;
  ['home','start','history'].forEach(name => {byId(name+'Page').hidden = name !== next});
  document.querySelectorAll('[data-page]').forEach(button => button.classList.toggle('active',button.dataset.page === next));
  closeMenu();
  window.scrollTo(0,restoreY);
  if(next === 'start' && remember) resetForm();
  if(next === 'history') renderHistory();
}
function resetForm(){
  byId('studyForm').reset();
  byId('studyForm_file').value = '';
  byId('formMessage').textContent = '';
  updateFields();
}
function updateFields(){
  const mode = byId('studyForm_mode').value;
  const visibility = {questionField:mode === '跨时空对话' || mode === '诗词理解',themeField:mode === '写作引用',toneField:mode === '写作引用',quantityField:mode === '游戏背诵',timedField:mode === '游戏背诵'};
  Object.entries(visibility).forEach(([id,visible]) => {
    const field = byId(id);
    if(!visible && !field.hidden) field.querySelectorAll('input,select,textarea').forEach(input => {if(input.type === 'checkbox') input.checked = false; else input.value = ''});
    field.hidden = !visible;
  });
  byId('timedLabel').textContent = t(byId('studyForm_timed').checked ? 'yes' : 'no');
}
function readRows(csv){
  if(!csv || !String(csv).trim()) return [];
  return parseCSV(String(csv)).filter(row => row.some(cell => cell !== '')).map((row,index) => ({mode:row[0] || '',person:row[1] || '',poem:row[2] || '',row:index+1}));
}
async function refreshData(){
  const [count,historyCsv] = await Promise.all([
    callAppBridge({type:'GetRecordCount',data:TABLE}),
    callAppBridge({type:'GetTableCSV',data:TABLE,payload:'学习方式,古人姓名,诗文名称'})
  ]);
  rows = readRows(historyCsv);
  byId('totalValue').textContent = /^\d+$/.test(String(count).trim()) ? String(count).trim() : rows.length;
  byId('dialogueValue').textContent = rows.filter(r => r.mode === '跨时空对话').length;
  byId('poetryValue').textContent = rows.filter(r => r.mode === '诗词理解' || r.mode === '游戏背诵').length;
  renderRecent(); renderHistory();
}
function makeLetter(row){
  const button = document.createElement('button');
  button.type = 'button';button.className = 'letter-item';
  button.dataset.row = String(row.row);
  const icon = document.createElement('span');icon.className = 'letter-icon';icon.innerHTML = '<i class="fa-solid fa-scroll"></i>';
  const copy = document.createElement('span');copy.className = 'letter-copy';
  const title = document.createElement('strong');title.append(textNode(row.poem || row.person || localizedMode(row.mode)));
  const small = document.createElement('small');small.append(textNode([localizedMode(row.mode),row.person].filter(Boolean).join(' · ')));
  const arrow = document.createElement('span');arrow.className = 'letter-arrow';arrow.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
  copy.append(title,small);button.append(icon,copy,arrow);
  button.addEventListener('click',async () => {showPage('history');await openDetail(row.row)});
  return button;
}
function renderRecent(){
  const list = byId('recentList');clear(list);
  if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('empty');list.append(empty);return}
  rows.slice(0,5).forEach(row => list.append(makeLetter(row)));
}
function renderHistory(){
  const body=byId('historyBody');clear(body);
  const search=byId('historySearch').value.trim().toLocaleLowerCase();
  const mode=byId('historyFilter').value;
  const filtered=rows.filter(row => (!mode || row.mode === mode) && (!search || row.person.toLocaleLowerCase().includes(search) || row.poem.toLocaleLowerCase().includes(search)));
  byId('historyEmpty').hidden=filtered.length>0;
  byId('historyEmpty').textContent=t('empty');
  for(const row of filtered){
    const tr=document.createElement('tr');
    for(const value of [localizedMode(row.mode),row.person,row.poem]){
      const td=document.createElement('td');
      if(value === localizedMode(row.mode)){const span=document.createElement('span');span.className='badge';span.append(textNode(value));td.append(span)}
      else td.append(textNode(value));
      tr.append(td);
    }
    const td=document.createElement('td'), actions=document.createElement('div');actions.className='actions';
    const view=document.createElement('button');view.type='button';view.className='secondary-button';view.innerHTML='<i class="fa-solid fa-eye"></i> ';
    view.append(textNode(t('view')));view.addEventListener('click',() => openDetail(row.row));
    const remove=document.createElement('button');remove.type='button';remove.className='danger-button';remove.innerHTML='<i class="fa-solid fa-trash"></i> ';
    remove.append(textNode(t('remove')));remove.addEventListener('click',() => deleteRow(row.row));
    actions.append(view,remove);td.append(actions);tr.append(td);body.append(tr);
  }
}
function renderDetailMeta(rowNumber){
  const row=rows.find(r=>r.row===rowNumber);const meta=byId('detailMeta');clear(meta);
  if(!row)return;
  [localizedMode(row.mode),row.person,row.poem].filter(Boolean).forEach(value=>{const span=document.createElement('span');span.append(textNode(value));meta.append(span)});
}
function fileDownloadUrl(name){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(name)}
function renderMarkdown(target,source){
  if(window.marked && window.DOMPurify){
    const raw=marked.parse(String(source),{gfm:true,breaks:true});
    target.innerHTML=DOMPurify.sanitize(raw);
    target.querySelectorAll('img').forEach(img=>{
      const original=img.getAttribute('src') || '';
      if(!original || /^(javascript:|data:)/i.test(original))return;
      const filename=original.includes('/download/') ? decodeURIComponent(original.split('/download/').pop()) : original;
      const href=fileDownloadUrl(filename);
      img.src=href;
      const link=document.createElement('a');link.href=href;link.setAttribute('download','');link.title=filename;
      img.replaceWith(link);link.append(img);
    });
    target.querySelectorAll('a:not(:has(img))').forEach(link=>{link.target='_blank';link.rel='noopener noreferrer'});
  }else{
    target.textContent=String(source);
  }
}
async function openDetail(rowNumber){
  modalOpen=true;
  byId('detailBackdrop').hidden=false;
  byId('detailBackdrop').dataset.row=String(rowNumber);
  renderDetailMeta(rowNumber);
  byId('detailMarkdown').textContent=t('loading');
  document.body.style.overflow='hidden';
  try{
    const result=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'生成结果/'+rowNumber});
    if(modalOpen && byId('detailBackdrop').dataset.row===String(rowNumber)) renderMarkdown(byId('detailMarkdown'),result || t('resultPending'));
  }catch(error){if(modalOpen) byId('detailMarkdown').textContent=t('error')}
}
function closeDetail(){modalOpen=false;byId('detailBackdrop').hidden=true;delete byId('detailBackdrop').dataset.row;document.body.style.overflow=''}
async function deleteRow(rowNumber){
  if(!window.confirm(t('deleteConfirm')))return;
  try{
    await callAppBridge({type:'DeleteRecord',data:TABLE,payload:rowNumber.toString()});
    await refreshData();
  }catch(error){window.alert(t('deleteError'))}
}
function collectForm(){
  const data={};
  for(const element of byId('studyForm').elements){
    if(!element.name || element.closest('.field')?.hidden)continue;
    data[element.name]=element.type === 'checkbox' ? (element.checked ? '是':'否') : element.value.trim();
  }
  return data;
}
async function pollResult(token){
  const started=Date.now();
  while(token===pollToken && Date.now()-started<1800000){
    try{
      const value=await callAppBridge({type:'轮询',data:TABLE,payload:'生成结果'});
      if(token!==pollToken)return;
      if(String(value || '').trim()){
        const result=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'生成结果/1'});
        if(token!==pollToken)return;
        renderMarkdown(byId('resultMarkdown'),result || value);
        byId('resultMarkdown').hidden=false;
        byId('waitingMessage').hidden=true;
        break;
      }
    }catch(error){byId('formMessage').textContent=t('error');break}
    await new Promise(resolve=>setTimeout(resolve,1000));
  }
  if(token===pollToken){
    if(!byId('waitingMessage').hidden)byId('formMessage').textContent=t('timeout');
    byId('waitingMessage').hidden=true;
    submitting=false;byId('submitButton').disabled=false;
  }
}
async function submitStudy(event){
  event.preventDefault();
  if(submitting)return;
  const data=collectForm();
  if(!data['学习方式'] || !(data['古人姓名'] || data['诗文名称'])){byId('formMessage').textContent=t('required');return}
  submitting=true;byId('submitButton').disabled=true;byId('formMessage').textContent='';
  try{
    await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});
    byId('formMessage').textContent=t('success');
    byId('resultPanel').hidden=false;
    byId('waitingMessage').hidden=false;
    byId('resultMarkdown').hidden=true;clear(byId('resultMarkdown'));
    byId('resultPanel').scrollIntoView({behavior:'smooth',block:'start'});
    refreshData().catch(()=>{});
    pollResult(++pollToken);
  }catch(error){submitting=false;byId('submitButton').disabled=false;byId('formMessage').textContent=t('submitError')}
}
function ensureInputVisible(event){
  const target=event.target;
  if(!target.matches('input,select,textarea'))return;
  const adjust=()=>target.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(adjust,250);
}
function airBack(){
  if(modalOpen){closeDetail();return 'false'}
  if(byId('mobileMenu').classList.contains('open')){closeMenu();return 'false'}
  const previous=pageHistory.pop();
  if(previous){showPage(previous.page,false,previous.y);return 'false'}
  return 'true';
}
window.airBack=airBack;

  language=initialLanguage();applyLanguage();updateFields();
  byId('brandButton').addEventListener('click',()=>{if(window.parent && typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});
  byId('heroStart').addEventListener('click',()=>showPage('start'));
  byId('newDialogue').addEventListener('click',()=>showPage('start'));
  document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));
  byId('desktopLanguage').addEventListener('click',toggleLanguage);
  byId('mobileLanguage').addEventListener('click',()=>{toggleLanguage();closeMenu()});
  byId('menuButton').addEventListener('click',()=>{const menu=byId('mobileMenu');menu.classList.toggle('open');byId('menuButton').setAttribute('aria-expanded',String(menu.classList.contains('open')))});
  document.addEventListener('pointerdown',event=>{if(!byId('topbar').contains(event.target))closeMenu()});
  byId('studyForm_mode').addEventListener('change',updateFields);
  byId('studyForm_timed').addEventListener('change',updateFields);
  byId('studyForm').addEventListener('submit',submitStudy);
  byId('uploadButton').addEventListener('click',async()=>{try{const file=await callAppBridge({type:'SelectFile'});if(file)byId('studyForm_file').value=file}catch(error){byId('formMessage').textContent=t('fileError')}});
  byId('historySearch').addEventListener('input',renderHistory);
  byId('historyFilter').addEventListener('change',renderHistory);
  byId('detailClose').addEventListener('click',closeDetail);
  byId('detailBackdrop').addEventListener('click',event=>{if(event.target===byId('detailBackdrop'))closeDetail()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape' && modalOpen)closeDetail()});
  document.addEventListener('focusin',ensureInputVisible);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active && active.matches('input,select,textarea'))active.scrollIntoView({block:'center'})});
  new ResizeObserver(fitNavigation).observe(byId('navInner'));
  fitNavigation();
  try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.mode=String(mode).trim()==='暗色'?'dark':'light'}catch(error){document.documentElement.dataset.mode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  try{await refreshData()}catch(error){byId('recentList').textContent=t('error');byId('historyEmpty').hidden=false;byId('historyEmpty').textContent=t('error')}
}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })()});
