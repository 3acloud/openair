<style>

main{max-width:1320px;margin:auto;padding:112px 28px 96px}.page{animation:appear .25s ease}@keyframes appear{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-1px;line-height:1.25;margin-bottom:16px}h2{font-size:21px;line-height:1.4;margin-bottom:14px}h3{font-size:17px;margin-bottom:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--terra);font-weight:700;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:var(--card);color:var(--ink);text-decoration:none;transition:.18s}.btn:hover{transform:translateY(-2px)}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.primary:hover{background:#7e6fee}.btn.secondary{border-color:var(--terra);color:var(--terra)}.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.small{padding:6px 10px;font-size:12px}.btn.icon{padding:7px 12px}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:32px 0 18px}.section-head h2{margin:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:26px}.page-head h1{font-size:32px;margin-bottom:8px}.page-head p{margin-bottom:0}

o}.device-frame.phone{width:390px}.filter-panel{padding:20px;margin-bottom:24px}.search-line{display:flex;align-items:center;gap:14px;margin-bottom:18px}.search-input{flex:1;position:relative}.search-input i{position:absolute;top:17px;left:14px;color:var(--muted)}.search-input input{padding-left:40px}.filter-group{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}.filter-title{font-size:12px;color:var(--muted);width:68px}.filter-chip{background:var(--field);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px}.filter-chip.active{background:#6c5ce718;border-color:var(--purple);color:var(--purple)}.archive-count{font-size:12px;color:var(--muted);margin:0 0 16px}.load-more{display:flex;justify-content:center;margin-top:25px}

@media(max-width:760px){nav{padding:12px 18px;gap:12px;min-height:72px}.brand strong{font-size:19px}.brand svg{width:35px;height:35px}.brand small{font-size:10px}main{padding:98px 16px 180px}.home-top,.stats-bottom,.workshop{grid-template-columns:1fr}.starters{grid-template-columns:1fr 1fr}.brief-sheet{padding:26px}.intro{font-size:15px!important}.records{grid-template-columns:1fr 1fr;gap:12px}.record{padding:16px}.page-head h1{font-size:28px}.page-head .actions{width:100%}.brief-form,.lightbox{padding:20px}.modal-overlay{padding:16px}.modal{max-height:calc(100dvh - 32px)}.modal.result-modal{border-radius:0;height:100dvh;max-height:100dvh;width:100%;border:0}.modal-overlay:has(.result-modal){padding:0}.modal-body{padding:20px 18px 160px}.modal-head,.modal-footer{padding:15px 18px}.search-line{flex-wrap:wrap}.search-input{min-width:100%}.device-frame{height:560px}.device-frame.phone{max-width:100%}.device-stats{gap:12px}}

<body>
<div class="header-shell">
<nav id="top-nav" aria-label="主导航">
<button class="brand" id="brand-close" type="button">
<svg viewBox="0 0 44 44" fill="none" aria-hidden="true"><rect x="4" y="4" width="36" height="36" rx="10" stroke="currentColor" stroke-width="2"/><path d="M22 11v22M11 22h22" stroke="currentColor" stroke-width="1.5"/><rect x="15" y="15" width="14" height="14" rx="3" fill="#6C5CE7" stroke="currentColor"/><path d="M22 18v8M18 22h8" stroke="#fff" stroke-width="1.5"/></svg>
<span><strong data-i18n="brand">界面工坊</strong><small data-i18n="subtitle">AI界面设计</small></span>
</button>
<div id="desktop-nav" class="desktop-nav">
<button class="nav-tab active" data-page="home" data-i18n="home">首页</button><button class="nav-tab" data-page="studio" data-i18n="studio">设计台</button><button class="nav-tab" data-page="archive" data-i18n="archive">设计档案</button><button class="language" data-action="language">EN / 中文</button>
</div>
<button id="menu-toggle" class="menu-toggle" type="button" aria-controls="mobile-menu" aria-expanded="false" hidden><i class="fa-solid fa-bars" aria-hidden="true"></i><span class="sr-only" hidden data-i18n="menu">菜单</span></button>
<div id="mobile-menu" class="mobile-menu" hidden><button class="nav-tab active" data-page="home" data-i18n="home">首页</button><button class="nav-tab" data-page="studio" data-i18n="studio">设计台</button><button class="nav-tab" data-page="archive" data-i18n="archive">设计档案</button><button class="language" data-action="language">EN / 中文</button></div>
</nav>
</div>
<main>
<div id="global-error" class="global-error error" role="alert" hidden></div>
<section id="page-home" class="page" aria-labelledby="home-title">
<div class="home-top">
<article class="brief-sheet card">
<div class="eyebrow" data-i18n="eyebrow">把想法摊开 · 让界面生长</div><h1 id="home-title" data-i18n="brand">界面工坊</h1>
<p class="intro" data-i18n="intro">把设计需求交给智能体，收回设计说明、设计稿、原型、可运行界面或风格对比</p>
<button class="btn primary" data-action="new"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i><span data-i18n="start">开始一次设计</span></button>
<div class="starters" id="starters"></div>
</article>
<div class="stats-side">
<article class="total card"><div><span class="muted" data-i18n="total">全部设计</span><div class="total-number" id="total-count">—</div></div><i class="fa-regular fa-object-group" aria-hidden="true"></i></article>
<article class="stat-card card"><h3 data-i18n="taskDistribution">任务类型分布</h3><div id="task-stats"></div></article>
</div>
</div>
<div class="stats-bottom">
<article class="stat-card card"><h3 data-i18n="outputDistribution">交付形式分布</h3><div id="output-stats"></div></article>
<article class="stat-card card"><h3 data-i18n="coverage">设备覆盖</h3><p class="hint" data-i18n="coverageHint">同一张简报可以同时覆盖两种设备</p><div class="device-stats"><div class="device-stat"><i class="fa-solid fa-desktop"></i><strong id="desktop-count">—</strong><span data-i18n="desktop">桌面</span></div><div class="device-stat"><i class="fa-solid fa-mobile-screen"></i><strong id="phone-count">—</strong><span data-i18n="phone">手机</span></div></div></article>
</div>
<div class="section-head"><h2 data-i18n="recent">最近铺开的简报</h2><button class="btn small secondary" data-page="archive"><span data-i18n="allArchive">查看全部</span><i class="fa-solid fa-arrow-right"></i></button></div>
<div id="recent-records" class="records"><div class="loading" data-i18n="loading">正在读取简报…</div></div>
</section>
<section id="page-studio" class="page" aria-labelledby="studio-title" hidden>
<div class="page-head"><div><h1 id="studio-title" data-i18n="studio">设计台</h1><p id="studio-caption" class="muted"></p></div><div class="actions"><button class="btn secondary" data-action="new"><i class="fa-solid fa-plus"></i><span data-i18n="newBrief">新简报</span></button><button id="save-button" class="btn" data-action="save" disabled><i class="fa-regular fa-floppy-disk"></i><span data-i18n="save">保存修改</span></button><button id="regenerate-button" class="btn" data-action="regenerate"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="regenerate">再生成一版</span></button></div></div>
<div class="workshop">
<form id="brief-form" class="brief-form card">
<h2 data-i18n="brief">设计简报</h2>
<fieldset class="field"><legend><span data-i18n="task">任务类型</span> <span class="required">*</span></legend><div id="brief-form-task" class="segments"></div></fieldset>
<div class="field"><label for="brief-form-demand"><span data-i18n="demand">设计需求</span> <span class="required">*</span></label><textarea id="brief-form-demand" name="设计需求" rows="7" required data-placeholder="demandPlaceholder"></textarea><p class="hint" data-i18n="demandHint">讲清使用情境，智能体才能为你安排合适的层级与组件。</p></div>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});

              // 2. 上传文件到Flask服务端

            }

          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")

        if (request['type'] === "ExportFile")

        }

        {

        {

        {

        }

        {

        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {

            // 1. 根据类型选择相应的处理函数获取文件

            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("040cce5922f2602b_AI界面设计")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

    return result;
  }
  catch (error)
  {

  return ""

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

}}
function trapFocus(event){const modal=state.modals.at(-1)?.overlay;if(!modal)return;if(event.key==='Escape'){event.preventDefault();closeModal();return}if(event.key!=='Tab')return;const elements=Array.from(modal.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),textarea:not(:disabled),iframe,[tabindex="0"]')).filter(e=>e.getClientRects().length);if(!elements.length)return;const first=elements[0],last=elements.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}
function installKeyboard(){let baseline=window.visualViewport?.height||window.innerHeight;const update=()=>{const viewport=window.visualViewport;const focused=document.activeElement;const input=focused&&focused.matches('input:not([type=hidden]),textarea,select');const height=viewport?.height||window.innerHeight;if(!input)baseline=Math.max(baseline,height);const keyboard=input?Math.max(0,baseline-height):0;document.documentElement.style.setProperty('--keyboard-space',keyboard>80?(keyboard+120)+'px':'0px');if(input)setTimeout(()=>{focused.scrollIntoView({behavior:'smooth',block:'center'});const rect=focused.getBoundingClientRect(),bottom=(viewport?.offsetTop||0)+height;if(rect.bottom>bottom-30){const scroller=focused.closest('.modal-body');if(scroller)scroller.scrollTop+=rect.bottom-bottom+70;else window.scrollBy(0,rect.bottom-bottom+70)}},120)};window.visualViewport?.addEventListener('resize',update);window.visualViewport?.addEventListener('scroll',update);document.addEventListener('focusin',update);document.addEventListener('focusout',()=>setTimeout(update,150))}
async function initialize(){
state.lang=languageDefault();document.documentElement.lang=state.lang==='cn'?'zh-CN':'en';document.title=t('brand')+' · '+t('subtitle');applyTranslations();buildChoices();renderStarters();renderStatistics();renderStudioResult();renderFilters();renderStudioChrome();
$('menu-toggle').addEventListener('click',()=>{state.menu=!state.menu;$('mobile-menu').hidden=!state.menu;$('menu-toggle').setAttribute('aria-expanded',String(state.menu))});
$('brand-close').addEventListener('click',()=>{try{if(typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);else notify(t('unsupportedClose'))}catch(e){notify(errorMessage(e))}});
document.addEventListener('click',async event=>{if(state.menu&&!$('top-nav').contains(event.target))menuClose();if(event.target.closest('[data-stop]')){event.stopPropagation();return}const el=event.target.closest('[data-action],[data-page]');if(!el||el.disabled)return;event.stopPropagation();try{if(el.dataset.page){switchPage(el.dataset.page);return}await handleAction(el.dataset.action,el)}catch(e){if(el.closest('#brief-form')||['save','regenerate'].includes(el.dataset.action))showError(e,'form-error');else{notify(errorMessage(e));showError(e)}}});
$('brief-form').addEventListener('submit',async event=>{event.preventDefault();if(state.row!==0)return;try{await submitRecord(formRecord())}catch(e){showError(e,'form-error')}});
$('brief-form').addEventListener('change',renderStudioChrome);
$('archive-search').addEventListener('input',()=>{state.filter.query=$('archive-search').value.trim();state.limit=12;renderArchive().catch(showError)});
document.addEventListener('keydown',event=>{trapFocus(event);if(event.target.matches('.record')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();event.target.click()}});
document.addEventListener('error',event=>{if(event.target.tagName==='IMG'){event.target.style.display='none';const note=document.createElement('span');note.className='image-error';note.textContent=t('imageFailure');event.target.after(note)}},true);
new ResizeObserver(responsiveNav).observe($('top-nav'));responsiveNav();installKeyboard();
await Promise.allSettled([(async()=>{try{const mode=await api('模式');document.documentElement.dataset.theme=mode.trim()==='暗色'?'dark':'light'}catch(e){showError(e)}})(),refreshAll()]);
}
(async () => { await initialize(); })();
</script>
