<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("46acce26b122903d_堪舆子")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function defaultLang(){const p=new URLSearchParams(location.search).get('lang');if(p==='cn'||p==='en')return p;const s=localStorage.getItem('iThinkAir_UiLanguage');if(s)return s==='en'?'en':'cn';const a=navigator.languages;if(!a||!a.length)return 'cn';return a.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';}
function setLanguage(lang,persist=true){state.lang=lang;document.documentElement.lang=lang==='cn'?'zh-CN':'en';if(persist)localStorage.setItem('iThinkAir_UiLanguage',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));document.querySelectorAll('[data-page]').forEach(el=>el.textContent=t(el.dataset.page));$('langBtn').textContent=lang==='cn'?'EN':'中文';$('mobileLang').textContent=lang==='cn'?'English':'中文';fillFilters();renderAll();measureNav();}
function measureNav(){const bar=$('topbar'),links=$('navLinks'),lang=$('langBtn'),menu=$('menuBtn');bar.classList.remove('nav-compact');const available=bar.querySelector('.nav-inner').clientWidth;const needed=$('brand').offsetWidth+links.scrollWidth+lang.offsetWidth+menu.offsetWidth+58;bar.classList.toggle('nav-compact',needed>available);if(needed<=available)closeMenu();}

function navigate(page,remember=true){if(!['home','residents','ask','records'].includes(page))return;if(remember&&state.page!==page)state.history.push({page:state.page,y:window.scrollY});state.page=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='home')loadHome();if(page==='residents')loadResidents();if(page==='ask')loadAsk();if(page==='records')loadRecords();}
function airBack(){if($('modalBackdrop').classList.contains('open')){closeModal();return 'false';}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false';}if(state.history.length){const h=state.history.pop();navigate(h.page,false);setTimeout(()=>window.scrollTo(0,h.y),30);return 'false';}return 'true';}window.airBack=airBack;
async function bridge(req){return await callAppBridge(req);}
async function getRows(table,fields){const raw=await bridge({type:'GetTableCSV',data:table,payload:fields.join(',')});return parseCSV(String(raw||'')).map((r,i)=>({row:i+1,...Object.fromEntries(fields.map((f,j)=>[f,r[j]??'']))})).filter(r=>fields.some(f=>String(r[f]).trim()!==''));}
async function getCell(table,field,row){return String(await bridge({type:'GetCellValue',data:table,payload:field+'/'+row})??'');}
async function getCells(table,fields,row){const o={row};for(const f of fields)o[f]=await getCell(table,f,row);return o;}
function residentName(value){let v=String(value||'').trim();if(!v)return '';try{const x=JSON.parse(v);if(typeof x==='object'&&x){v=String(x['姓名']||x.value||x.name||v);}}catch(e){}const byRow=state.residents.find(r=>String(r.row)===v);return byRow?byRow['姓名']:v;}
function residentLabel(value){const name=residentName(value),r=state.residents.find(x=>x['姓名']===name);return name+(r&&r['性别']?' ('+r['性别']+')':'');}
function friendly(v){return esc(v||t('notAvailable'));}
function showError(where,e){const el=typeof where==='string'?$(where):where;if(el)el.textContent=t('error')+': '+String(e?.message||e);}
function dateNumber(s){const n=Date.parse(String(s||'').replace(' ','T'));return Number.isFinite(n)?n:-Infinity;}
async function refreshData(){const [res,con]=await Promise.all([getRows(TABLE_RES,RES_FIELDS),getRows(TABLE_CON,CON_FIELDS)]);state.residents=res;state.consults=con;}
async function loadHome(){try{await refreshData();const [resN,conN,types,readings]=await Promise.all([bridge({type:'GetRecordCount',data:TABLE_RES}),bridge({type:'GetRecordCount',data:TABLE_CON}),getRows(TABLE_CON,['咨询类型']),getRows(TABLE_CON,['咨询类型','堪舆批断'])]);const complete=readings.filter(r=>String(r['堪舆批断']).trim()).length;const nums=[Number(resN)||0,Number(conN)||0,types.filter(r=>r['咨询类型']==='阳宅分析').length,Math.max(0,(Number(conN)||0)-complete)+' / '+complete];$('stats').innerHTML=['residentCount','consultCount','houseCount','readingCount'].map((k,i)=>'<div class="paper stat lift"><i class="fa-solid '+['fa-users','fa-scroll','fa-house','fa-yin-yang'][i]+'"></i><small>'+esc(t(k))+'</small><strong>'+esc(nums[i])+'</strong></div>').join('');$('typeStrips').innerHTML=OPTIONS['咨询类型'].map(v=>'<span>'+esc(displayValue(v))+' · '+types.filter(r=>r['咨询类型']===v).length+'</span>').join('');const recent=[...state.consults].sort((a,b)=>dateNumber(b['入宅时间'])-dateNumber(a['入宅时间'])).slice(0,5);for(const r of recent)r.summary=await getCell(TABLE_CON,'咨询说明',r.row);$('recentList').innerHTML=recent.length?recent.map(r=>consultCard(r,true)).join(''):'<div class="paper empty">'+t('empty')+'</div>';}catch(e){showError('recentList',e);}}
function consultCard(r,recent=false){const image=r['户型图']?'<img class="thumb" src="'+esc(safeFile(r['户型图']))+'" alt="'+esc(t('image'))+'">':'';const tags=String(r['困扰事项']||'').split(/[,，、;]/).filter(Boolean).map(x=>'<span class="tag">'+esc(displayValue(x.trim()))+'</span>').join('');const actions=recent?'':'<div class="actions"><button class="btn small" data-action="reading" data-row="'+r.row+'">'+t('viewReading')+'</button><button class="btn secondary small" data-action="editConsult" data-row="'+r.row+'">'+t('edit')+'</button><button class="btn danger small" data-action="deleteConsult" data-row="'+r.row+'">'+t('delete')+'</button></div>';return '<article class="paper card lift" data-kind="'+(recent?'recent':'consult')+'" data-row="'+r.row+'"><div class="card-head"><span class="seal">'+friendly(displayValue(r['咨询类型']))+'</span>'+image+'</div><h3>'+friendly(residentLabel(r['宅主']))+'</h3><div class="meta"><span><i class="fa-solid fa-location-dot"></i> '+friendly(r['地点'])+'</span><span>'+friendly(displayValue(r['事项类型']))+'</span><span>'+friendly(displayValue(r['房屋朝向']))+'</span>'+(recent?'':'<span>'+friendly(r['入宅时间'])+'</span><span>'+friendly(r['期望时段'])+'</span>')+'</div><div class="tags">'+tags+'</div><p class="excerpt">'+friendly(String(r.summary??r['咨询说明']??'').slice(0,40))+'</p>'+actions+'</article>';}
async function loadResidents(){try{state.residents=await getRows(TABLE_RES,RES_FIELDS);renderResidents();}catch(e){showError('residentList',e);}}
function renderResidents(){const q=$('residentSearch').value.trim().toLowerCase(),g=$('residentGender').value;const rows=state.residents.filter(r=>(!q||r['姓名'].toLowerCase().includes(q))&&(!g||r['性别']===g));$('residentList').innerHTML=rows.length?rows.map(r=>'<article class="paper card lift resident-card '+(r['性别']==='女'?'female':'')+'" data-kind="resident" data-row="'+r.row+'"><h3>'+friendly(r['姓名'])+'</h3><div class="meta"><span>'+friendly(displayValue(r['性别']))+'</span><span>'+friendly(r['出生时间'])+'</span></div><div class="actions"><button class="btn small" data-action="residentDetail" data-row="'+r.row+'">'+t('viewDetail')+'</button><button class="btn secondary small" data-action="editResident" data-row="'+r.row+'">'+t('edit')+'</button><button class="btn danger small" data-action="deleteResident" data-row="'+r.row+'">'+t('delete')+'</button></div></article>').join(''):'<div class="paper empty">'+t('empty')+'</div>';}
async function loadAsk(){try{state.residents=await getRows(TABLE_RES,RES_FIELDS);$('noResidents').classList.toggle('show',state.residents.length===0);renderAskFields();}catch(e){showError('askStatus',e);}}
async function loadRecords(){try{await refreshData();await renderRecords();}catch(e){showError('recordList',e);}}
async function renderRecords(){const q=$('recordSearch').value.trim().toLowerCase(),v={咨询类型:$('filterType').value,事项类型:$('filterMatter').value,困扰事项:$('filterTrouble').value,房屋朝向:$('filterDirection').value};const rows=state.consults.filter(r=>(!q||[r['地点'],r['咨询说明'],residentName(r['宅主'])].some(x=>String(x||'').toLowerCase().includes(q)))&&Object.entries(v).every(([k,x])=>!x||(k==='困扰事项'?String(r[k]||'').includes(x):r[k]===x)));const jobs=[];for(const r of rows)jobs.push(getCell(TABLE_CON,'咨询说明',r.row));const summaries=await Promise.all(jobs);for(let i=0;i<rows.length;i++)rows[i].summary=summaries[i];$('recordList').innerHTML=rows.length?rows.map(r=>consultCard(r)).join(''):'<div class="paper empty">'+t('empty')+'</div>';}
function fillFilters(){const specs=[['residentGender','allGender','性别'],['filterType','allType','咨询类型'],['filterMatter','allMatter','事项类型'],['filterTrouble','allTrouble','困扰事项'],['filterDirection','allDirection','房屋朝向']];for(const [id,label,field] of specs){const el=$(id),old=el.value;el.innerHTML='<option value="">'+esc(t(label))+'</option>'+OPTIONS[field].map(x=>'<option value="'+esc(x)+'">'+esc(displayValue(x))+'</option>').join('');el.value=old;}}
function renderAll(){if($('stats').children.length){$('stats').querySelectorAll('small').forEach((x,i)=>x.textContent=t(['residentCount','consultCount','houseCount','readingCount'][i]));}if(state.page==='residents')renderResidents();if(state.page==='records')renderRecords().catch(e=>showError('recordList',e));if(state.page==='ask')renderAskFields();}
function fieldId(prefix,f){return prefix+'_'+CON_FIELDS.concat(RES_FIELDS).indexOf(f)+'_'+f;}
function formField(prefix,f,val='',editing=false){const id=fieldId(prefix,f),name=esc(f),label=esc(t(LABELS[f]||f));let html='';if(f==='困扰事项'){const chosen=String(val).split(/[,，、;]/).map(x=>x.trim());html='<div class="check-options">'+OPTIONS[f].map((x,i)=>'<label><input type="checkbox" name="'+name+'" id="'+id+'_'+i+'" value="'+esc(x)+'" '+(chosen.includes(x)?'checked':'')+'>'+esc(displayValue(x))+'</label>').join('')+'</div>';}else if(f==='户型图'){html='<input type="hidden" id="'+id+'" name="'+name+'" value="'+esc(val)+'"><img class="image-preview" id="'+id+'_preview" alt="'+esc(t('image'))+'"><div class="actions"><button type="button" class="btn secondary small" data-image-action="capture" data-target="'+esc(id)+'">'+t('capture')+'</button><button type="button" class="btn secondary small" data-image-action="select" data-target="'+esc(id)+'">'+t('chooseImage')+'</button><button type="button" class="btn secondary small" data-image-action="clear" data-target="'+esc(id)+'">'+t('clearImage')+'</button></div>';}else if(f==='咨询说明'){html='<textarea class="field" id="'+id+'" name="'+name+'">'+esc(val)+'</textarea>';}else if(OPTIONS[f]||f==='宅主'){let opts=f==='宅主'?state.residents.map(r=>({value:r['姓名'],text:r['姓名']+'（'+displayValue(r['性别']||'')+'）'})):OPTIONS[f].map(x=>({value:x,text:displayValue(x)}));html='<select class="field" id="'+id+'" name="'+name+'"><option value="">'+t('select')+'</option>'+opts.map(o=>'<option value="'+esc(o.value)+'" '+(String(val)===o.value||f==='宅主'&&residentName(val)===o.value?'selected':'')+'>'+esc(o.text)+'</option>').join('')+'</select>';}else{const typ=f==='入宅时间'?'date':f==='出生时间'?'datetime-local':'text';let value=String(val||'');if(typ==='datetime-local')value=value.replace(' ','T').slice(0,19);html='<input class="field" type="'+typ+'" '+(typ==='datetime-local'?'step="1" ':'')+'id="'+id+'" name="'+name+'" value="'+esc(value)+'">';}return '<div class="form-group '+(['咨询说明','户型图','困扰事项'].includes(f)?'wide':'')+'"><label for="'+id+'">'+label+(f==='咨询类型'||f==='宅主'?' *':'')+'</label>'+html+'</div>';}
function renderAskFields(){const form=$('askForm');if(state.polling)return;const values=readForm(form,CON_FIELDS);$('askFields').innerHTML=CON_FIELDS.map(f=>formField('askForm',f,values[f]||'')).join('');updateImagePreview(fieldId('askForm','户型图'));updateAskButton();}
function readForm(form,fields){const out={};for(const f of fields){if(f==='困扰事项')out[f]=[...form.querySelectorAll('[name="困扰事项"]:checked')].map(x=>x.value).join(',');else{const el=form.elements.namedItem(f);out[f]=el?el.value:'';}if(f==='出生时间'&&out[f])out[f]=out[f].replace('T',' ')+(out[f].length===16?':00':'');}return out;}
function updateAskButton(){const v=readForm($('askForm'),CON_FIELDS);$('askSubmit').disabled=state.polling||state.busy||!v['咨询类型']||!v['宅主'];$('askStatus').textContent=(!v['咨询类型']||!v['宅主'])?t('required'):'';}
function updateImagePreview(id){const input=$(id),img=$(id+'_preview');if(!input||!img)return;img.style.display=input.value?'block':'none';if(input.value)img.src=safeFile(input.value);else img.removeAttribute('src');}
async function imageAction(action,id){const el=$(id);if(!el)return;try{if(action==='clear')el.value='';else el.value=String(await bridge({type:action==='capture'?'CapturePhoto':'SelectImage'})||'');updateImagePreview(id);}catch(e){alert(t('error')+': '+String(e));}}
function openModal(title,html,kind,row=0,table=''){if(state.modalKind==='reading'&&state.pollTarget==='modal'){state.pollToken++;state.polling=false;state.pollTarget='';}state.modalKind=kind;state.modalRow=row;state.modalTable=table;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalBackdrop').classList.add('open');$('modalBackdrop').classList.toggle('markdown-modal',kind==='reading');$('modal').classList.toggle('wide',kind==='reading');document.body.style.overflow='hidden';setTimeout(()=>$('modalClose').focus(),0);}
function closeModal(){if(state.pollTarget==='modal'){state.pollToken++;state.polling=false;state.pollTarget='';}state.modalKind='';$('modalBackdrop').classList.remove('open','markdown-modal');document.body.style.overflow='';updateAskButton();}
async function residentDetail(row){const r=await getCells(TABLE_RES,RES_FIELDS,row);const body='<div class="details">'+RES_FIELDS.map(f=>'<div class="detail"><b>'+esc(t(LABELS[f]))+'</b>'+friendly(r[f])+'</div>').join('')+'</div><div class="modal-actions"><button class="btn secondary" data-action="editResident" data-row="'+row+'">'+t('edit')+'</button></div>';openModal(t('detailTitle'),body,'residentDetail',row,TABLE_RES);}
async function editForm(kind,row){const resident=kind==='resident',fields=resident?RES_FIELDS:CON_FIELDS,table=resident?TABLE_RES:TABLE_CON,prefix=resident?'residentEditForm':'consultEditForm';state.currentRow=row;if(!resident)state.residents=await getRows(TABLE_RES,RES_FIELDS);const values=row?await getCells(table,fields,row):{};const form='<form id="'+prefix+'" data-edit-kind="'+kind+'" data-row="'+row+'"><div class="form-grid">'+fields.map(f=>formField(prefix,f,values[f]||'')).join('')+'</div><div class="status" id="'+prefix+'_status" role="status"></div><div class="modal-actions"><button type="button" class="btn secondary" id="'+prefix+'_cancel">'+t('cancel')+'</button><button type="submit" class="btn">'+t(row?'save':'submit')+'</button></div></form>';openModal(t(resident?'residentForm':'editConsult'),form,'form',row,table);$(prefix+'_cancel').addEventListener('click',closeModal);if(!resident)updateImagePreview(fieldId(prefix,'户型图'));}
async function saveEdit(form){if(state.busy)return;const resident=form.dataset.editKind==='resident',row=Number(form.dataset.row),fields=resident?RES_FIELDS:CON_FIELDS,table=resident?TABLE_RES:TABLE_CON,formTable=resident?FORM_RES:FORM_CON,values=readForm(form,fields),status=$(form.id+'_status');if(!resident&&(!values['咨询类型']||!values['宅主'])){status.textContent=t('required');return;}state.busy=true;form.querySelector('[type="submit"]').disabled=true;try{if(row){for(const f of fields)await bridge({type:'SetCellValue',data:table,payload:f+'/'+row+'/'+values[f]});}else{await bridge({type:'SubmitRecord',data:formTable,payload:JSON.stringify(values)});state.currentRow=1;}closeModal();if(resident){await loadResidents();await loadAsk();}else{await loadRecords();await loadHome();}navigate(resident?'residents':'records');}catch(e){showError(status,e);}finally{state.busy=false;if(form.isConnected)form.querySelector('[type="submit"]').disabled=false;}}
async function deleteRow(kind,row){if(!confirm(t('confirmDelete')))return;const table=kind==='resident'?TABLE_RES:TABLE_CON;try{await bridge({type:'DeleteRecord',data:table,payload:row.toString()});if(kind==='resident'){await loadResidents();await loadAsk();}else{await loadRecords();await loadHome();}}catch(e){alert(t('error')+': '+String(e));}}
function detailHTML(r){const fields=CON_FIELDS.filter(f=>f!=='户型图');return '<div class="details">'+fields.map(f=>'<div class="detail"><b>'+esc(t(LABELS[f]))+'</b>'+friendly(f==='宅主'?residentLabel(r[f]):displayValue(r[f]))+'</div>').join('')+'</div>'+(r['户型图']?'<p><a href="'+esc(safeFile(r['户型图']))+'" target="_blank" download><img class="image-preview" style="display:block" src="'+esc(safeFile(r['户型图']))+'" alt="'+esc(t('image'))+'"></a></p>':'');}
function markdownHTML(text){if(!text)return '<p class="muted">'+t('notReady')+'</p>';let html=window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:true})):'<pre>'+esc(text)+'</pre>';const box=document.createElement('div');box.innerHTML=html;box.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(!/^https?:|^data:image\//i.test(src))img.src=safeFile(src);const a=document.createElement('a');a.href=img.src;a.target='_blank';a.download='';img.replaceWith(a);a.append(img);});return box.innerHTML;}
async function showReading(row){state.currentRow=row;const r=await getCells(TABLE_CON,ALL_CON_FIELDS,row);if(state.modalKind==='reading'&&state.modalRow!==row){state.pollToken++;state.polling=false;state.pollTarget='';}const count=Number(await bridge({type:'GetRecordCount',data:TABLE_CON}))||0;const nav='<div class="actions"><button class="btn secondary icon" data-action="prevReading" '+(row<=1?'disabled':'')+' title="'+t('previous')+'"><i class="fa-solid fa-chevron-left"></i></button><button class="btn secondary icon" data-action="nextReading" '+(row>=count?'disabled':'')+' title="'+t('next')+'"><i class="fa-solid fa-chevron-right"></i></button></div>';const body='<div class="scroll"><div class="scroll-header"><span class="seal">'+friendly(displayValue(r['咨询类型']))+'</span>'+nav+'</div><h3>'+t('summary')+'</h3>'+detailHTML(r)+'<h3>'+t('readingTitle')+'</h3><div class="markdown" id="modalReadingContent">'+markdownHTML(r['堪舆批断'])+'</div>'+(r['堪舆批断']?'':'<button class="btn" id="waitReading" data-action="waitReading">'+t('waitReading')+'</button>')+'</div><div class="modal-actions"><button class="btn secondary" data-action="editConsult" data-row="'+row+'">'+t('edit')+'</button></div>';openModal(t('recordDetail'),body,'reading',row,TABLE_CON);}
async function pollReading(row,target,button){const token=++state.pollToken;state.polling=true;state.pollTarget=target.id==='modalReadingContent'?'modal':'ask';if(button)button.disabled=true;target.textContent=t('waiting');const deadline=Date.now()+1800*1000;try{while(Date.now()<deadline&&token===state.pollToken){const value=await getCell(TABLE_CON,'堪舆批断',row);if(token!==state.pollToken)break;if(value.trim()){target.innerHTML=markdownHTML(value);if(button)button.remove();break;}await new Promise(resolve=>setTimeout(resolve,1000));}if(token===state.pollToken&&target.textContent===t('waiting'))target.textContent=t('timeout');}catch(e){if(token===state.pollToken)showError(target,e);}finally{if(token===state.pollToken){state.polling=false;state.pollTarget='';updateAskButton();if(button&&button.isConnected)button.disabled=false;}}}
async function submitAsk(ev){ev.preventDefault();if(state.polling||state.busy)return;const values=readForm($('askForm'),CON_FIELDS);if(!values['咨询类型']||!values['宅主']){updateAskButton();return;}state.busy=true;updateAskButton();try{await bridge({type:'SubmitRecord',data:FORM_CON,payload:JSON.stringify(values)});state.currentRow=1;$('readingArea').style.display='block';$('readingSummary').innerHTML='<span class="seal">'+esc(displayValue(values['咨询类型']))+'</span><p>'+esc(residentLabel(values['宅主']))+' · '+friendly(displayValue(values['房屋朝向']))+' · '+friendly(values['地点'])+'</p>';$('readingContent').textContent=t('waiting');$('readingArea').scrollIntoView({behavior:'smooth',block:'start'});state.busy=false;await pollReading(1,$('readingContent'),null);}catch(e){showError('askStatus',e);}finally{state.busy=false;updateAskButton();}}
function resetAsk(){state.pollToken++;state.polling=false;state.pollTarget='';state.currentRow=0;$('askForm').reset();$('readingArea').style.display='none';$('readingContent').innerHTML='';renderAskFields();window.scrollTo({top:0,behavior:'smooth'});}
function focusVisible(el){if(!matchMedia('(max-width:760px)').matches)return;setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),250);}
async function initialize(){state.lang=defaultLang();try{const m=await bridge({type:'模式'});document.body.classList.toggle('light',String(m).trim()==='亮色');}catch(e){}setLanguage(state.lang,false);$('brand').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false);});$('menuBtn').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open));});$('langBtn').addEventListener('click',()=>setLanguage(state.lang==='cn'?'en':'cn'));$('mobileLang').addEventListener('click',()=>{setLanguage(state.lang==='cn'?'en':'cn');closeMenu();});document.addEventListener('click',async ev=>{const go=ev.target.closest('[data-page],[data-go]');if(go){navigate(go.dataset.page||go.dataset.go);return;}const image=ev.target.closest('[data-image-action]');if(image){await imageAction(image.dataset.imageAction,image.dataset.target);return;}const act=ev.target.closest('[data-action]');if(act){ev.stopPropagation();const a=act.dataset.action,row=Number(act.dataset.row||state.modalRow);try{if(a==='residentDetail')await residentDetail(row);if(a==='editResident')await editForm('resident',row);if(a==='deleteResident')await deleteRow('resident',row);if(a==='reading')await showReading(row);if(a==='editConsult')await editForm('consult',row);if(a==='deleteConsult')await deleteRow('consult',row);if(a==='prevReading'&&row>1)await showReading(row-1);if(a==='nextReading')await showReading(row+1);if(a==='waitReading')await pollReading(row,$('modalReadingContent'),act);}catch(e){alert(t('error')+': '+String(e));}return;}const card=ev.target.closest('[data-kind][data-row]');if(card){const row=Number(card.dataset.row);try{if(card.dataset.kind==='resident')await residentDetail(row);else{if(card.dataset.kind==='recent'){navigate('records');await showReading(row);}else await editForm('consult',row);}}catch(e){alert(t('error')+': '+String(e));}return;}if(!$('topbar').contains(ev.target))closeMenu();});$('addResident').addEventListener('click',()=>editForm('resident',0).catch(e=>alert(String(e))));$('askAgain').addEventListener('click',resetAsk);$('askForm').addEventListener('submit',submitAsk);$('askForm').addEventListener('input',updateAskButton);$('askForm').addEventListener('change',updateAskButton);document.addEventListener('submit',ev=>{if(ev.target.matches('[data-edit-kind]')){ev.preventDefault();saveEdit(ev.target);}});$('residentSearch').addEventListener('input',renderResidents);$('residentGender').addEventListener('change',renderResidents);let searchTimer;for(const id of ['recordSearch','filterType','filterMatter','filterTrouble','filterDirection'])$(id).addEventListener(id==='recordSearch'?'input':'change',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderRecords().catch(e=>showError('recordList',e)),180);});$('modalClose').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',ev=>{if(ev.target===$('modalBackdrop'))closeModal();});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if($('modalBackdrop').classList.contains('open'))closeModal();else closeMenu();}});document.addEventListener('focusin',ev=>{if(ev.target.matches('input,textarea,select'))focusVisible(ev.target);});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const el=document.activeElement;if(el&&el.matches('input,textarea,select'))focusVisible(el);});window.addEventListener('resize',measureNav);if(window.ResizeObserver)new ResizeObserver(measureNav).observe($('topbar').querySelector('.nav-inner'));navigate('home',false);}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
</script>
