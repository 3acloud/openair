<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,

              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });

        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';

                const char = csvText[i];

                        i++;
                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符

                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const FIELD_KEYS = {知识点:'topic',学科:'subject',学段:'stage',触发场景:'scene',我的讲解:'explanation',我的例子:'example',为什么解释:'why',迁移回答:'transfer',是否参考AI答案:'usedAI',当前困惑:'confusion',评估报告:'evaluationReport'};
const STAGE_EN = {'小学':'Primary school','初中':'Middle school','高中':'High school','大学':'University','成人':'Adult'};
const SCENE_EN = {'自我验证':'Self check','错题攻克':'Review errors','考前自检':'Exam preparation','教别人前热身':'Before teaching','AI答案验证':'Check AI answer','亲子费曼日':'Parent-child learning'};
let lang = 'cn', currentPage = 'home', pageHistory = [], records = [], pollTimer = null, pollDeadline = 0, submitting = false, loadVersion = 0;
const $ = id => document.getElementById(id);
function tr(key){return (I18N[lang] && I18N[lang][key]) || key}
function labelFor(field){return tr(FIELD_KEYS[field] || field)}
function displayValue(field,value){if(field==='是否参考AI答案') return value==='是'||value==='true'||value==='True'||value==='1' ? tr('yes') : tr('no');if(lang==='en'&&field==='学段')return STAGE_EN[value]||value;if(lang==='en'&&field==='触发场景')return SCENE_EN[value]||value;return value||'—'}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function safeDownload(name){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(name)}
function showToast(message){const t=$('toast');t.textContent=message;t.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.hidden=true,4200)}
function detectLanguage(){const urlLang=new URLSearchParams(location.search).get('lang');if(urlLang==='cn'||urlLang==='en')return urlLang;const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored!==null&&stored!=='')return stored==='en'?'en':'cn';const list=navigator.languages;if(!list||!list.length)return 'cn';return list.some(x=>String(x).toLowerCase().startsWith('zh'))?'cn':'en'}
function setLanguage(next,save){lang=next;document.documentElement.lang=lang==='cn'?'zh-CN':'en';if(save)localStorage.setItem('iThinkAir_UiLanguage',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.placeholder));$('desktopLang').textContent=lang==='cn'?'中文 / EN':'EN / 中文';$('mobileLang').textContent=$('desktopLang').textContent;buildForm();buildFilters();renderRecords();renderRecent();renderStats();}
function toggleLanguage(){setLanguage(lang==='cn'?'en':'cn',true);closeMenu()}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false')}
function updateNavigation(){const bar=$('topbar');bar.classList.remove('nav-collapsed');const inner=bar.querySelector('.nav-inner');const brand=$('brand'), links=$('navLinks'), language=$('desktopLang');const needed=brand.scrollWidth+links.scrollWidth+language.scrollWidth+65;bar.classList.toggle('nav-collapsed',needed>inner.clientWidth);if(!bar.classList.contains('nav-collapsed'))closeMenu()}
function navigate(page,recordHistory=true){if(!['home','create','records'].includes(page))return;if(page!==currentPage){if(recordHistory)pageHistory.push({page:currentPage,scroll:window.scrollY});currentPage=page}document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'Page'));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='home')loadHome();if(page==='records')loadRecords()}
function airBack(){if(!$('detailBackdrop').hidden){closeDetail();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(pageHistory.length){const prior=pageHistory.pop();navigate(prior.page,false);requestAnimationFrame(()=>window.scrollTo(0,prior.scroll));return 'false'}return 'true'}
window.airBack=airBack;
function parseRows(csv){return parseCSV(String(csv||'')).filter(row=>row.some(cell=>cell!==''))}
async function getCSV(fields){const text=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:fields.join(',')});return parseRows(text)}
function renderDistribution(id,values){const box=$(id);box.innerHTML='';if(!values.length){box.className='';box.textContent=tr('empty');return}box.className='';const counts=new Map();values.forEach(value=>{const key=value||'—';counts.set(key,(counts.get(key)||0)+1)});const sorted=[...counts.entries()].sort((a,b)=>b[1]-a[1]);const max=sorted[0][1];sorted.slice(0,5).forEach(([name,count])=>{const row=document.createElement('div');row.className='mini-row';const n=document.createElement('span');n.className='mini-name';n.textContent=id==='stageChart'?displayValue('学段',name):displayValue('触发场景',name);const bar=document.createElement('span');bar.className='mini-bar';bar.style.width=Math.max(8,Math.round(count/max*70))+'px';const v=document.createElement('span');v.className='mini-value';v.textContent=count+' · '+Math.round(count/values.length*100)+'%';row.append(n,bar,v);box.append(row)})}
let homeData={stage:[],scene:[],recent:[]};
function renderStats(){renderDistribution('stageChart',homeData.stage);renderDistribution('sceneChart',homeData.scene)}
function renderRecent(){const box=$('recentList');box.innerHTML='';if(!homeData.recent.length){box.innerHTML='<div class="empty">'+escapeHtml(tr('empty'))+'</div>';return}homeData.recent.slice(0,5).forEach((row,index)=>{const btn=document.createElement('button');btn.type='button';btn.className='record-card';btn.innerHTML='<strong>'+escapeHtml(row[0]||'—')+'</strong><span class="chips">'+[1,2,3].map(i=>'<span class="chip">'+escapeHtml(displayValue(['','学科','学段','触发场景'][i],row[i]))+'</span>').join('')+'</span>';btn.addEventListener('click',()=>openDetail(index+1));box.append(btn)})}
async function loadHome(){const version=++loadVersion;$('totalCount').textContent='…';$('stageChart').textContent=tr('loading');$('sceneChart').textContent=tr('loading');$('recentList').innerHTML='<div class="loading">'+escapeHtml(tr('loading'))+'</div>';const results=await Promise.allSettled([callAppBridge({type:'GetRecordCount',data:TABLE}),getCSV(['学段']),getCSV(['触发场景']),getCSV(['知识点','学科','学段','触发场景'])]);if(version!==loadVersion)return;$('totalCount').textContent=results[0].status==='fulfilled'?(Number.parseInt(results[0].value,10)||0):'—';homeData.stage=results[1].status==='fulfilled'?results[1].value.map(r=>r[0]):[];homeData.scene=results[2].status==='fulfilled'?results[2].value.map(r=>r[0]):[];homeData.recent=results[3].status==='fulfilled'?results[3].value.slice(0,5):[];renderStats();renderRecent();if(results.some(x=>x.status==='rejected'))showToast(tr('loadError'))}
function buildForm(){const box=$('formFields');const existing={};box.querySelectorAll('[name]').forEach(el=>existing[el.name]=el.value);box.innerHTML='';const fields=[['知识点','text',true],['学科','text',true],['学段','select'],['触发场景','select'],['我的讲解','textarea'],['我的例子','textarea'],['为什么解释','textarea'],['迁移回答','textarea'],['是否参考AI答案','boolean'],['当前困惑','textarea']];fields.forEach(([field,type,required])=>{const wrapper=document.createElement('div');wrapper.className='field'+(type==='textarea'?' wide':'');const label=document.createElement('label');const id='validationForm_'+field;label.htmlFor=id;label.textContent=labelFor(field);let control;if(type==='textarea'){control=document.createElement('textarea');control.rows=4}else if(type==='select'||type==='boolean'){control=document.createElement('select');const options=type==='boolean'?['否','是']:(field==='学段'?STAGES:SCENES);if(type==='select'){const blank=document.createElement('option');blank.value='';blank.textContent=tr('select');control.append(blank)}options.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=displayValue(field,value);control.append(option)})}else{control=document.createElement('input');control.type='text'}control.id=id;control.name=field;if(required)control.required=true;if(existing[field]!==undefined)control.value=existing[field];wrapper.append(label,control);box.append(wrapper)})}
function formData(){const data={};FIELDS.forEach(field=>{const el=$('validationForm_'+field);data[field]=el.value.trim()});return data}
function setSubmitting(value){submitting=value;$('submitValidation').disabled=value;document.querySelectorAll('#validationForm input,#validationForm select,#validationForm textarea').forEach(el=>el.disabled=value)}
function markdownInto(element,text){if(!text){element.textContent=tr('reportPending');return}if(window.marked&&window.DOMPurify){const raw=marked.parse(text,{gfm:true,breaks:true});element.innerHTML=DOMPurify.sanitize(raw,{ADD_ATTR:['target']});element.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(src&&!/^https?:\/\//i.test(src)&&!src.startsWith('data:'))img.src=safeDownload(src);img.addEventListener('click',()=>{const a=document.createElement('a');a.href=img.src;a.download='';a.click()})});element.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'})}else{element.textContent=text}}
function clearPoll(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null}}
async function pollReport(){if(Date.now()>=pollDeadline){$('reportContent').textContent=tr('timeout');$('formStatus').textContent=tr('timeout');setSubmitting(false);return}try{const response=await callAppBridge({type:'轮询',data:FORM_TABLE,payload:'评估报告'});if(String(response||'').trim()){const box=$('reportContent');box.className='markdown-body';markdownInto(box,String(response));$('formStatus').textContent='';setSubmitting(false);loadHome();return}}catch(error){$('formStatus').textContent=String(error)}pollTimer=setTimeout(pollReport,1000)}
async function submitValidation(event){event.preventDefault();if(submitting)return;const data=formData();if(!data['知识点']||!data['学科']){showToast(tr('required'));return}setSubmitting(true);$('formStatus').textContent='';try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(data)});$('reportPanel').hidden=false;$('reportContent').className='wait';$('reportContent').innerHTML='<span class="spinner" aria-hidden="true"></span><span>'+escapeHtml(tr('wait'))+'</span>';$('formStatus').textContent=tr('saveSuccess');pollDeadline=Date.now()+1800000;clearPoll();pollReport();$('reportPanel').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){setSubmitting(false);showToast(tr('saveError')+': '+String(error))}}
function buildFilters(){const stage=$('stageFilter'),scene=$('sceneFilter');const oldStage=stage.value,oldScene=scene.value;stage.innerHTML='<option value="">'+escapeHtml(tr('allStages'))+'</option>';scene.innerHTML='<option value="">'+escapeHtml(tr('allScenes'))+'</option>';STAGES.forEach(value=>{const o=document.createElement('option');o.value=value;o.textContent=displayValue('学段',value);stage.append(o)});SCENES.forEach(value=>{const o=document.createElement('option');o.value=value;o.textContent=displayValue('触发场景',value);scene.append(o)});stage.value=oldStage;scene.value=oldScene}
async function loadRecords(){const body=$('recordsBody');body.innerHTML='<tr><td colspan="6" class="loading">'+escapeHtml(tr('loading'))+'</td></tr>';try{const rows=await getCSV(['知识点','学科','学段','触发场景','是否参考AI答案']);records=rows.map((row,index)=>({row:index+1,values:row}));renderRecords()}catch(error){body.innerHTML='<tr><td colspan="6" class="empty">'+escapeHtml(tr('loadError'))+'</td></tr>';showToast(tr('loadError')+': '+String(error))}}
function renderRecords(){const body=$('recordsBody');body.innerHTML='';const query=$('recordSearch').value.trim().toLocaleLowerCase();const stage=$('stageFilter').value,scene=$('sceneFilter').value;const filtered=records.filter(record=>{const r=record.values;return (!query||String(r[0]||'').toLocaleLowerCase().includes(query)||String(r[1]||'').toLocaleLowerCase().includes(query))&&(!stage||r[2]===stage)&&(!scene||r[3]===scene)});if(!filtered.length){body.innerHTML='<tr><td colspan="6" class="empty">'+escapeHtml(records.length?tr('noMatch'):tr('empty'))+'</td></tr>'}filtered.forEach(record=>{const trEl=document.createElement('tr');record.values.slice(0,5).forEach((value,i)=>{const td=document.createElement('td');td.textContent=displayValue(['知识点','学科','学段','触发场景','是否参考AI答案'][i],value);trEl.append(td)});const actions=document.createElement('td');actions.className='actions';const view=document.createElement('button');view.className='btn small secondary';view.type='button';view.innerHTML='<i class="fa-regular fa-eye"></i> '+escapeHtml(tr('view'));view.addEventListener('click',()=>openDetail(record.row));const del=document.createElement('button');del.className='btn small danger';del.type='button';del.innerHTML='<i class="fa-regular fa-trash-can"></i> '+escapeHtml(tr('delete'));del.addEventListener('click',()=>deleteRecord(record.row));actions.append(view,del);trEl.append(actions);body.append(trEl)});$('recordsStatus').textContent=filtered.length+' / '+records.length}
async function deleteRecord(row){if(!confirm(tr('deleteAsk')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});showToast(tr('deleteSuccess'));await loadRecords();loadHome()}catch(error){showToast(tr('deleteError')+': '+String(error))}}
async function openDetail(row){$('detailBackdrop').hidden=false;document.body.style.overflow='hidden';$('detailContent').innerHTML='<div class="loading">'+escapeHtml(tr('loading'))+'</div>';try{const values={};for(const field of DETAIL_FIELDS){values[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})}if($('detailBackdrop').hidden)return;const box=$('detailContent');box.innerHTML='';function section(title,fields){const h=document.createElement('h3');h.className='detail-section';h.textContent=title;box.append(h);const grid=document.createElement('dl');grid.className='detail-grid';fields.forEach(field=>{const item=document.createElement('div');item.className='detail-item'+(fields.length===1||['我的讲解','我的例子','为什么解释','迁移回答','当前困惑'].includes(field)?' wide':'');const dt=document.createElement('dt');dt.textContent=labelFor(field);const dd=document.createElement('dd');dd.textContent=displayValue(field,values[field]);item.append(dt,dd);grid.append(item)});box.append(grid)}section(tr('basicInfo'),FIELDS.slice(0,4));section(tr('myInput'),FIELDS.slice(4));const heading=document.createElement('h3');heading.className='detail-section';heading.textContent=tr('evaluationReport');box.append(heading);const report=document.createElement('div');report.className='report-detail markdown-body';markdownInto(report,values['评估报告']);box.append(report)}catch(error){$('detailContent').textContent=tr('detailError')+': '+String(error)}}
function closeDetail(){$('detailBackdrop').hidden=true;document.body.style.overflow=''}
function ensureInputVisible(){const active=document.activeElement;if(!active||!active.matches('input,textarea,select'))return;setTimeout(()=>active.scrollIntoView({behavior:'smooth',block:'center'}),180)}
async function initialize(){lang=detectLanguage();try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(error){document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches)}setLanguage(lang,false);document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.page)));$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('heroCreate').addEventListener('click',()=>navigate('create'));$('recordsCreate').addEventListener('click',()=>navigate('create'));$('goRecords').addEventListener('click',()=>navigate('records'));$('allRecords').addEventListener('click',()=>navigate('records'));$('desktopLang').addEventListener('click',toggleLanguage);$('mobileLang').addEventListener('click',toggleLanguage);$('menuBtn').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open))});document.addEventListener('click',event=>{if(!$('topbar').contains(event.target))closeMenu()});$('validationForm').addEventListener('submit',submitValidation);$('recordSearch').addEventListener('input',renderRecords);$('stageFilter').addEventListener('change',renderRecords);$('sceneFilter').addEventListener('change',renderRecords);$('detailClose').addEventListener('click',closeDetail);$('detailBackdrop').addEventListener('click',event=>{if(event.target===$('detailBackdrop'))closeDetail()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('detailBackdrop').hidden)closeDetail();else closeMenu()}});document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))ensureInputVisible()});if(window.visualViewport)visualViewport.addEventListener('resize',ensureInputVisible);window.addEventListener('resize',updateNavigation);if(window.ResizeObserver)new ResizeObserver(updateNavigation).observe($('topbar').querySelector('.nav-inner'));updateNavigation();await loadHome()}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',async()=>{await initialize()},{once:true})}else{(async()=>{await initialize()})()}
