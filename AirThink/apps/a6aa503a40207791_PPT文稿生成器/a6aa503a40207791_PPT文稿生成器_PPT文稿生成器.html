 name="主题色" required><option value="" data-i18n="selectOne">请选择</option><option value="墨水经典" data-i18n="colorInk">墨水经典</option><option value="靛蓝瓷" data-i18n="colorIndigo">靛蓝瓷</option><option value="森林墨" data-i18n="colorForest">森林墨</option><option value="牛皮纸" data-i18n="colorPaper">牛皮纸</option><option value="沙丘" data-i18n="colorDune">沙丘</option><option value="IKB蓝" data-i18n="colorIkb">IKB蓝</option><option value="柠檬黄" data-i18n="colorYellow">柠檬黄</option><option value="柠檬绿" data-i18n="colorGreen">柠檬绿</option><option value="安全橙" data-i18n="colorOrange">安全橙</option></select></div><div class="field wide"><label for="pptForm_constraints" data-i18n="constraints">硬约束</label><textarea id="pptForm_constraints" name="硬约束"></textarea></div></div><div class="form-actions"><button class="primary" id="submitPpt" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="generate">开始生成PPT文稿</span></button></div><p class="status" id="formStatus" role="status"></p></form></section><section class="panel progress" id="progressPanel" hidden><i class="fa-solid fa-spinner fa-spin"></i><h2 data-i18n="generating">正在生成</h2><p data-i18n="waitMessage">AI正在为您排版生成PPT并撰写演讲文稿，请耐心等待...</p><p id="pollStatus" role="status"></p></section><section class="panel" id="resultPanel" hidden><div class="result-head"><h2 data-i18n="result">生成结果</h2><button class="secondary" id="createAgain" type="button" data-i18n="createAgain">再次创建</button></div><article class="markdown-body" id="resultContent"></article></section></section>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {

    fileInput.style.display = 'none';

      } else {

    fileInput.addEventListener('cancel', () => {

    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    `;

    captureBtn.style.cssText = `

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

 cn:{appName:'PPT文稿生成器',home:'首页',create:'新建PPT',history:'生成历史',heroDesc:'输入演讲需求，一键智能生成专业PPT，附带内容阐述与展示说明，让您的演示更具说服力。',createNow:'立即创建PPT',totalCount:'总生成次数',businessCount:'商业发布场景数',internalCount:'内部分享场景数',recent:'最近生成',viewAll:'查看全部 →',createDesc:'请详细填写您的PPT演讲需求及相关素材要求',formTitle:'新建PPT生成请求',topic:'主题',style:'风格',audience:'受众',scene:'分享场景',minutes:'分享时长分钟',material:'原始素材说明',images:'图片截图要求',color:'主题色',constraints:'硬约束',selectOne:'请选择',generate:'开始生成PPT文稿',generating:'正在生成',waitMessage:'AI正在为您排版生成PPT并撰写演讲文稿，请耐心等待...',result:'生成结果',createAgain:'再次创建',historyDesc:'管理和回顾您生成过的所有PPT文稿',searchPlaceholder:'搜索主题或受众',allScenes:'全部分享场景',allColors:'全部主题色',actions:'操作',viewDocument:'查看文稿',delete:'删除',document:'PPT文稿',noRecords:'暂无记录',loading:'加载中...',loadFailed:'加载失败，请稍后重试',submitFailed:'提交失败，请重试',deleteFailed:'删除失败，请重试',emptyDocument:'文稿尚未生成',confirmDelete:'确定删除这条生成记录吗？',timeout:'生成超时，请到生成历史查看结果',styleMagazine:'电子杂志风',styleSwiss:'瑞士国际主义风',sceneInternal:'行业内部',sceneBusiness:'商业发布',scenePrivate:'私享会',sceneOffline:'线下分享',other:'其他',colorInk:'墨水经典',colorIndigo:'靛蓝瓷',colorForest:'森林墨',colorPaper:'牛皮纸',colorDune:'沙丘',colorIkb:'IKB蓝',colorYellow:'柠檬黄',colorGreen:'柠檬绿',colorOrange:'安全橙'},
 en:{appName:'PPT Presentation Generator',home:'Home',create:'New PPT',history:'History',heroDesc:'Describe your presentation needs and generate a polished PPT with speaker notes and presentation guidance.',createNow:'Create a PPT',totalCount:'Total generated',businessCount:'Business launches',internalCount:'Internal sharing',recent:'Recently generated',viewAll:'View all →',createDesc:'Describe your presentation needs and source materials in detail',formTitle:'New PPT request',topic:'Topic',style:'Style',audience:'Audience',scene:'Sharing scenario',minutes:'Duration in minutes',material:'Source material notes',images:'Image and screenshot requirements',color:'Theme color',constraints:'Hard constraints',selectOne:'Select an option',generate:'Generate PPT',generating:'Generating',waitMessage:'AI is creating your presentation and speaker notes. Please wait...',result:'Generated result',createAgain:'Create another',historyDesc:'Manage and revisit your generated presentations',searchPlaceholder:'Search topic or audience',allScenes:'All scenarios',allColors:'All colors',actions:'Actions',viewDocument:'View document',delete:'Delete',document:'PPT document',noRecords:'No records',loading:'Loading...',loadFailed:'Loading failed. Please try again.',submitFailed:'Submission failed. Please try again.',deleteFailed:'Deletion failed. Please try again.',emptyDocument:'This document is not ready yet',confirmDelete:'Delete this generated record?',timeout:'Generation timed out. Check History for the result.',styleMagazine:'Editorial magazine',styleSwiss:'Swiss International',sceneInternal:'Industry internal',sceneBusiness:'Business launch',scenePrivate:'Private event',sceneOffline:'In-person sharing',other:'Other',colorInk:'Classic ink',colorIndigo:'Indigo porcelain',colorForest:'Forest ink',colorPaper:'Kraft paper',colorDune:'Dune',colorIkb:'IKB blue',colorYellow:'Lemon yellow',colorGreen:'Lemon green',colorOrange:'Safety orange'}

let lang='cn',activePage='home',pageHistory=[],historyRows=[],polling=false,documentOpen=false,lastFocus=null;
function t(key){return dict[lang][key]||key}
function languageChoice(){const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)return stored==='en'?'en':'cn';const param=new URLSearchParams(location.search).get('lang');if(param==='en'||param==='cn')return param;const list=navigator.languages;if(!list||!list.length)return 'cn';return list.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function applyLanguage(next){lang=next;document.documentElement.lang=next==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.placeholder)});$('langToggle').textContent=lang==='cn'?'EN':'中文';$('mobileLang').textContent=lang==='cn'?'English':'中文';renderRecent();renderHistory();fitNav()}
function toggleLanguage(){const next=lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',next);applyLanguage(next);closeMenu()}
function fitNav(){const bar=$('topbar');bar.classList.remove('compact');const needed=document.querySelector('.brand').offsetWidth+document.querySelector('.nav-tabs').scrollWidth+$('langToggle').offsetWidth+100;bar.classList.toggle('compact',needed>window.innerWidth);if(!bar.classList.contains('compact'))closeMenu()}
function closeMenu(){$('mobileMenu').hidden=true;$('mobileMenu').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false')}
function toggleMenu(){const opening=$('mobileMenu').hidden;$('mobileMenu').hidden=!opening;$('mobileMenu').classList.toggle('open',opening);$('menuToggle').setAttribute('aria-expanded',String(opening))}
function navigate(page,record=true){if(!['home','create','history'].includes(page)||page===activePage){closeMenu();return}if(record)pageHistory.push({page:activePage,scroll:window.scrollY});activePage=page;for(const p of ['home','create','history'])$('page'+p[0].toUpperCase()+p.slice(1)).hidden=p!==page;document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='home')loadHome();if(page==='history')loadHistory()}
function airBack(){if(documentOpen){closeDocument();return 'false'}if(!$('mobileMenu').hidden){closeMenu();return 'false'}if(pageHistory.length){const entry=pageHistory.pop();navigate(entry.page,false);requestAnimationFrame(()=>window.scrollTo(0,entry.scroll));return 'false'}return 'true'}window.airBack=airBack;
function cleanRows(csv,width){return parseCSV(String(csv||'').replace(/^\uFEFF/,'')).filter(row=>row.some(cell=>String(cell).trim()!=='' )).map(row=>Array.from({length:width},(_,i)=>row[i]??''))}
function el(tag,textContent,className){const node=document.createElement(tag);if(textContent!==undefined)node.textContent=textContent;if(className)node.className=className;return node}
function showError(id,key){const node=$(id);node.textContent=t(key);node.classList.add('error')}
async function loadHome(){try{const results=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'分享场景'}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'主题,风格,分享场景,主题色'})]);$('totalCount').textContent=String(results[0]).trim();const scenes=cleanRows(results[1],1);$('businessCount').textContent=scenes.filter(r=>r[0]==='商业发布').length;$('internalCount').textContent=scenes.filter(r=>r[0]==='行业内部').length;window.recentRows=cleanRows(results[2],4).slice(0,5);renderRecent()}catch(e){$('recentList').replaceChildren(el('p',t('loadFailed'),'error'))}}
function renderRecent(){if(!window.recentRows)return;const list=$('recentList');list.replaceChildren();if(!window.recentRows.length){list.append(el('p',t('noRecords'),'empty'));return}window.recentRows.forEach((row,index)=>{const button=el('button',undefined,'record');button.type='button';const left=el('span');left.append(el('span',row[0]||'—','record-title'),el('span',[row[1],row[2],row[3]].filter(Boolean).join(' · '),'record-meta'));button.append(left,el('i',undefined,'fa-solid fa-arrow-up-right-from-square'));button.addEventListener('click',()=>openDocument(index+1,row[0]));list.append(button)})}
async function loadHistory(){const status=$('historyStatus');status.textContent=t('loading');status.classList.remove('error');try{const csv=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:fieldNames.join(',')});historyRows=cleanRows(csv,6).map((values,index)=>({values,row:index+1}));status.textContent='';renderHistory()}catch(e){showError('historyStatus','loadFailed')}}
function renderHistory(){const body=$('historyBody');body.replaceChildren();const q=$('historySearch').value.trim().toLocaleLowerCase(),scene=$('sceneFilter').value,color=$('colorFilter').value;const filtered=historyRows.filter(item=>{const v=item.values;return(!q||v[0].toLocaleLowerCase().includes(q)||v[2].toLocaleLowerCase().includes(q))&&(!scene||v[3]===scene)&&(!color||v[5]===color)});$('historyEmpty').hidden=filtered.length>0;for(const item of filtered){const tr=el('tr');for(const value of item.values)tr.append(el('td',value||'—'));const cell=el('td'),actions=el('div',undefined,'actions'),view=el('button',t('viewDocument'),'secondary'),del=el('button',t('delete'),'secondary');view.type=del.type='button';view.addEventListener('click',()=>openDocument(item.row,item.values[0]));del.addEventListener('click',()=>deleteRow(item.row));actions.append(view,del);cell.append(actions);tr.append(cell);body.append(tr)}}
function assetUrl(filename){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(filename)}
function renderMarkdown(container,source){if(!window.marked||!window.DOMPurify){container.textContent=source;return}const html=marked.parse(source,{gfm:true,breaks:true});container.innerHTML=DOMPurify.sanitize(html,{ADD_ATTR:['target','download']});container.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(/^https?:/i.test(href)){a.target='_blank';a.rel='noopener noreferrer'}else if(!/^(#|mailto:)/i.test(href)){a.href=assetUrl(href);a.target='_blank';a.rel='noopener noreferrer'}});container.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';const url=/^https?:|^data:/i.test(raw)?raw:assetUrl(raw);img.src=url;const link=el('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';if(!/^data:/i.test(url))link.download='';img.replaceWith(link);link.append(img)})}
async function openDocument(row,title){lastFocus=document.activeElement;documentOpen=true;$('documentTitle').textContent=title||t('document');$('documentContent').textContent=t('loading');$('documentOverlay').hidden=false;document.body.style.overflow='hidden';$('closeDocument').focus();try{const markdown=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'Markdown结果/'+row});if(documentOpen)renderMarkdown($('documentContent'),markdown||t('emptyDocument'))}catch(e){if(documentOpen)$('documentContent').textContent=t('loadFailed')}}
function closeDocument(){documentOpen=false;$('documentOverlay').hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
async function deleteRow(row){if(!window.confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});await Promise.all([loadHistory(),loadHome()])}catch(e){showError('historyStatus','deleteFailed')}}
function setCreateState(state){$('formPanel').hidden=state!=='form';$('progressPanel').hidden=state!=='progress';$('resultPanel').hidden=state!=='result';$('submitPpt').disabled=state==='progress'}
async function submitPpt(event){event.preventDefault();if(polling)return;const form=$('pptForm');if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form).entries());$('formStatus').textContent='';$('submitPpt').disabled=true;try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(data)});polling=true;setCreateState('progress');loadHome();await pollResult()}catch(e){showError('formStatus','submitFailed');$('submitPpt').disabled=false}}
async function pollResult(){const deadline=Date.now()+1800*1000;while(Date.now()<deadline){try{const result=await callAppBridge({type:'轮询',data:FORM_TABLE,payload:'Markdown结果'});if(String(result||'').trim()){renderMarkdown($('resultContent'),String(result));polling=false;setCreateState('result');return}}catch(e){$('pollStatus').textContent=String(e)}await new Promise(resolve=>setTimeout(resolve,1000))}polling=false;setCreateState('form');showError('formStatus','timeout')}
function resetCreate(){if(polling)return;$('pptForm').reset();$('formStatus').textContent='';$('pollStatus').textContent='';$('resultContent').replaceChildren();setCreateState('form');window.scrollTo(0,0)}
function handleInputFocus(event){if(!event.target.matches('input,textarea,select'))return;setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),250)}
async function initialize(){lang=languageChoice();applyLanguage(lang);try{const mode=await callAppBridge({type:'模式'});document.documentElement.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.page)));$('brandButton').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});$('langToggle').addEventListener('click',toggleLanguage);$('mobileLang').addEventListener('click',toggleLanguage);$('menuToggle').addEventListener('click',toggleMenu);document.addEventListener('pointerdown',event=>{if(!$('topbar').contains(event.target))closeMenu()});$('heroCreate').addEventListener('click',()=>navigate('create'));$('historyCreate').addEventListener('click',()=>navigate('create'));$('showAll').addEventListener('click',()=>navigate('history'));$('pptForm').addEventListener('submit',submitPpt);$('createAgain').addEventListener('click',resetCreate);$('historySearch').addEventListener('input',renderHistory);$('sceneFilter').addEventListener('change',renderHistory);$('colorFilter').addEventListener('change',renderHistory);$('closeDocument').addEventListener('click',closeDocument);$('documentOverlay').addEventListener('click',event=>{if(event.target===$('documentOverlay'))closeDocument()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(documentOpen)closeDocument();else closeMenu()}});document.addEventListener('focusin',handleInputFocus);if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(document.activeElement?.matches('input,textarea,select'))document.activeElement.scrollIntoView({block:'center'})});window.addEventListener('resize',fitNav);fitNav();await loadHome()}
document.addEventListener('DOMContentLoaded',()=>{(async () => {    await initialize();  })()});
</script>
