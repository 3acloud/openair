display:block;margin:0 auto 18px}.detail-section{border:1px solid var(--line);border-radius:13px;padding:17px;margin:13px 0;min-width:0}.detail-section h3{color:var(--blue2);margin-bottom:8px}.markdown{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;line-height:1.8}.markdown>*:first-child{margin-top:0}.markdown>*:last-child{margin-bottom:0}.markdown img{max-width:100%;height:auto}.markdown pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:12px;border-radius:9px}.markdown code{overflow-wrap:anywhere}.markdown table{display:block;min-width:0;width:100%;overflow-x:auto}.markdown .katex-display{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0}.markdown blockquote{border-left:4px solid var(--blue);padding-left:15px;margin-left:0;color:var(--muted)}.toast{position:fixed;z-index:3000;right:20px;bottom:20px;background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;max-width:min(430px,calc(100vw - 40px))}.toast.visible{display:block}

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {

    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择

      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);

}

    buttonContainer.style.cssText = `

    `;
    
    // 创建拍照按钮

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

const DICT={cn:{appName:'AI拍题辅导',home:'首页',solve:'拍题解析',records:'解析记录',heroDesc:'随手一拍难题秒解，提供详细步骤与知识点剖析，让学习更高效',start:'开始拍题',total:'累计解析题目数',month:'本月解析数',recent:'最近解析',viewAll:'查看全部',solveDesc:'上传或拍摄题目图片，选择对应学科，AI即刻为您深度解析',viewRecords:'查看解析记录',subject:'学科',chooseSubject:'请选择学科',questionImage:'题目图片',imageHint:'拍摄或选择题目图片',capture:'拍照上传',selectImage:'相册选择',analyze:'AI智能解析',recordsDesc:'浏览与复习您的专属错题本',newSolve:'新增解析',search:'搜索题目内容',allSubjects:'全部学科',question:'题目内容',knowledge:'涉及知识点',created:'创建时间',actions:'操作',detail:'解析详情',view:'查看详情',delete:'删除',steps:'解题步骤',answer:'最终答案',empty:'暂无解析记录',loading:'正在读取数据…',thinking:'AI正在疯狂思考中...',timeout:'解析等待超时，请稍后在解析记录查看。',failed:'操作失败',confirmDelete:'确定删除这条解析记录吗？',count:'条记录',noImage:'暂无图片',errorData:'数据读取失败',needImage:'请先选择题目图片',deleted:'已删除',readDetail:'正在读取详情…'},en:{appName:'AI Problem Solver',home:'Home',solve:'Solve',records:'History',heroDesc:'Snap a difficult question for detailed steps and key concepts.',start:'Start solving',total:'Questions solved',month:'This month',recent:'Recent solutions',viewAll:'View all',solveDesc:'Upload or capture a question, choose its subject, and get a detailed solution.',viewRecords:'View history',subject:'Subject',chooseSubject:'Choose a subject',questionImage:'Question image',imageHint:'Capture or choose a question image',capture:'Take photo',selectImage:'Choose image',analyze:'Analyze with AI',recordsDesc:'Review your personal collection of solved questions.',newSolve:'New solution',search:'Search question text',allSubjects:'All subjects',question:'Question',knowledge:'Key concepts',created:'Created',actions:'Actions',detail:'Solution details',view:'View',delete:'Delete',steps:'Solution steps',answer:'Final answer',empty:'No solutions yet',loading:'Loading data…',thinking:'AI is thinking...',timeout:'Analysis timed out. Check the history later.',failed:'Operation failed',confirmDelete:'Delete this solution?',count:'records',noImage:'No image',errorData:'Could not load data',needImage:'Choose a question image first',deleted:'Deleted',readDetail:'Loading details…'}};
let lang='cn',currentPage='home',historyStack=[],records=[],currentRow=0,imageName='',busy=false,toastTimer=0,loadPromise=null;
const $=id=>document.getElementById(id);
function tr(key){return DICT[lang][key]||key}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imageUrl(name){return 'https://www.ithinkair.com/Files/'+encodeURIComponent(String(name).trim())}
function downloadUrl(name){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(String(name).trim())}
function short(s,n){const v=String(s||'').replace(/\s+/g,' ').trim();return v.length>n?v.slice(0,n)+'…':v}
function pad(n){return String(n).padStart(2,'0')}
function dateTime(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function showToast(message){const el=$('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4500)}
function setStatus(message,error=false){$('solveStatus').textContent=message;$('solveStatus').classList.toggle('visible',!!message);$('solveStatus').classList.toggle('error',error)}
function subjectLabel(value){const i=SUBJECTS.indexOf(value);return lang==='en'&&i>=0?EN_SUBJECTS[i]:value}
function initialLanguage(){const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored!==null&&stored!=='')return stored==='en'?'en':'cn';const p=new URLSearchParams(location.search).get('lang');if(p==='en'||p==='cn')return p;const langs=navigator.languages;return !langs||!langs.length||langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function applyLanguage(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.i18nPlaceholder));$('desktopLanguage').textContent=$('mobileLanguage').textContent=lang==='cn'?'English':'中文';for(const id of ['solveSubject','subjectFilter']){const el=$(id),value=el.value;el.querySelectorAll('option[data-subject]').forEach(o=>o.textContent=subjectLabel(o.value));el.value=value}renderRecent();renderRecords();renderResults()}
function setLanguage(next){lang=next;localStorage.setItem('iThinkAir_UiLanguage',lang);applyLanguage();closeMenu();checkNavFit()}
function checkNavFit(){const bar=$('topbar'),links=$('navLinks'),inner=bar.querySelector('.nav-inner');bar.classList.remove('compact');if(links.getBoundingClientRect().right>inner.getBoundingClientRect().right+1||inner.scrollWidth>inner.clientWidth+1)bar.classList.add('compact');else closeMenu()}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}
function goPage(page,addHistory=true){if(!['home','solve','records'].includes(page)||page===currentPage){closeMenu();return}if(addHistory)historyStack.push({page:currentPage,y:scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='records'||page==='home')refreshData()}
function airBack(){if($('detailBackdrop').classList.contains('open')){closeDetail();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const last=historyStack.pop();goPage(last.page,false);requestAnimationFrame(()=>scrollTo(0,last.y));return 'false'}return 'true'}window.airBack=airBack;
function normalizeCsv(raw){if(typeof raw!=='string')raw=String(raw??'');let s=raw.replace(/^\uFEFF/,'').trim();if(s.startsWith('{')){try{const obj=JSON.parse(s);if(obj.error)throw Error(obj.error);if(typeof obj.data==='string')s=obj.data;else if(typeof obj.result==='string')s=obj.result;else if(typeof obj.csv==='string')s=obj.csv}catch(e){if(e instanceof SyntaxError){}else throw e}}return s}
async function fetchRows(fields){const raw=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:fields.join(',')});const csv=normalizeCsv(raw);return csv?parseCSV(csv):[]}
async function refreshData(){if(loadPromise)return loadPromise;loadPromise=(async()=>{try{const rows=await fetchRows(FIELDS);records=rows.filter(r=>r.some(v=>String(v).trim())).map((r,i)=>({row:i+1,subject:r[0]||'',question:r[1]||'',knowledge:r[2]||'',created:r[3]||'',image:r[4]||''}));renderRecent();renderRecords();const start=dateTime(new Date()).slice(0,7);$('monthCount').textContent=records.filter(r=>r.created.slice(0,7)===start).length;try{$('totalCount').textContent=String(await callAppBridge({type:'GetRecordCount',data:TABLE})).trim()}catch(e){$('totalCount').textContent=records.length}}catch(e){console.error(e);$('totalCount').textContent='—';$('monthCount').textContent='—';$('recentList').innerHTML='<div class="empty">'+esc(tr('errorData'))+'</div>';$('recordsBody').innerHTML='<tr><td colspan="5" class="empty">'+esc(tr('errorData'))+'</td></tr>';showToast(tr('errorData')+': '+String(e.message||e))}finally{loadPromise=null}})();return loadPromise}
function sortedRecords(){return [...records].sort((a,b)=>String(b.created).localeCompare(String(a.created))||a.row-b.row)}
function renderRecent(){const list=$('recentList');if(!list)return;const items=sortedRecords().slice(0,5);list.replaceChildren();if(!items.length){list.innerHTML='<div class="empty">'+esc(tr('empty'))+'</div>';return}for(const r of items){const button=document.createElement('button');button.type='button';button.className='recent-item';const im=r.image?'<img src="'+esc(imageUrl(r.image))+'" alt="" loading="lazy">':'<span class="recent-placeholder"><i class="fa-regular fa-image"></i></span>';button.innerHTML=im+'<span class="recent-body"><span class="recent-top"><span class="badge">'+esc(subjectLabel(r.subject))+'</span><time>'+esc(r.created)+'</time></span><span class="recent-title" title="'+esc(r.question)+'">'+esc(short(r.question,50)||'—')+'</span><span class="recent-sub" title="'+esc(r.knowledge)+'">'+esc(short(r.knowledge,50)||'—')+'</span></span>';button.addEventListener('click',()=>openDetail(r.row));list.appendChild(button)}}
function renderRecords(){const body=$('recordsBody');if(!body)return;const query=$('recordSearch').value.trim().toLocaleLowerCase(),subject=$('subjectFilter').value;const filtered=records.filter(r=>(!query||r.question.toLocaleLowerCase().includes(query))&&(!subject||r.subject===subject));$('recordsCount').textContent=filtered.length+' '+tr('count');body.replaceChildren();if(!filtered.length){body.innerHTML='<tr><td colspan="5" class="empty">'+esc(tr('empty'))+'</td></tr>';return}for(const r of filtered){const row=document.createElement('tr');row.innerHTML='<td><span class="badge">'+esc(subjectLabel(r.subject))+'</span></td><td title="'+esc(r.question)+'">'+esc(short(r.question,30)||'—')+'</td><td title="'+esc(r.knowledge)+'">'+esc(short(r.knowledge,20)||'—')+'</td><td>'+esc(r.created)+'</td><td><button class="button secondary" data-action="view" type="button">'+esc(tr('view'))+'</button><button class="button danger" data-action="delete" type="button">'+esc(tr('delete'))+'</button></td>';row.querySelector('[data-action="view"]').addEventListener('click',()=>openDetail(r.row));row.querySelector('[data-action="delete"]').addEventListener('click',()=>deleteRecord(r.row));body.appendChild(row)}}
function markdownHtml(value){let html=esc(value||'');if(window.marked){html=marked.parse(String(value||''),{gfm:true,breaks:true});if(window.DOMPurify)html=DOMPurify.sanitize(html)}return html}
function renderMarkdown(el,value){el.innerHTML=markdownHtml(value);el.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(!src)return;const a=document.createElement('a');a.href=src.startsWith('https://')?src:downloadUrl(src);a.download='';a.target='_blank';a.rel='noopener';img.parentNode.insertBefore(a,img);a.appendChild(img)});if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false,strict:false})}
function detailSection(title,value){const section=document.createElement('section');section.className='detail-section';section.innerHTML='<h3>'+esc(title)+'</h3><div class="markdown"></div>';renderMarkdown(section.querySelector('.markdown'),value);return section}
async function cell(field,row){return String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})??'')}
async function readDetails(row){const names=['题目图片','学科','创建时间','题目内容','涉及知识点','解题步骤','最终答案'];const values=await Promise.all(names.map(name=>cell(name,row)));return Object.fromEntries(names.map((name,i)=>[name,values[i]]))}
function showDetailData(d){const target=$('detailContent');target.replaceChildren();if(d['题目图片']){const img=document.createElement('img');img.className='detail-image';img.src=imageUrl(d['题目图片']);img.alt=tr('questionImage');target.appendChild(img)}const meta=document.createElement('div');meta.className='detail-meta';meta.innerHTML='<span class="badge">'+esc(subjectLabel(d['学科']))+'</span><time>'+esc(d['创建时间'])+'</time>';target.appendChild(meta);for(const [field,key] of [['题目内容','question'],['涉及知识点','knowledge'],['解题步骤','steps'],['最终答案','answer']])target.appendChild(detailSection(tr(key),d[field]));$('detailScroll').scrollTop=0}
async function openDetail(row){currentRow=row;$('detailContent').textContent=tr('readDetail');$('detailBackdrop').classList.add('open');$('detailScroll').scrollTop=0;try{const d=await readDetails(row);if($('detailBackdrop').classList.contains('open')&&currentRow===row)showDetailData(d)}catch(e){$('detailContent').textContent=tr('failed')+': '+String(e.message||e)}}
function closeDetail(){$('detailBackdrop').classList.remove('open')}
async function deleteRecord(row){if(!window.confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});showToast(tr('deleted'));await refreshData()}catch(e){showToast(tr('failed')+': '+String(e.message||e))}}
function renderResults(){const grid=$('resultGrid');if(!grid.classList.contains('visible'))return;for(const section of grid.querySelectorAll('[data-result-field]')){const key=section.dataset.resultField;section.querySelector('h3').textContent=tr(({题目内容:'question',涉及知识点:'knowledge',解题步骤:'steps',最终答案:'answer'})[key])}}
function showResults(d){const grid=$('resultGrid');grid.replaceChildren();for(const [field,key] of [['题目内容','question'],['涉及知识点','knowledge'],['解题步骤','steps'],['最终答案','answer']]){const section=document.createElement('section');section.className='card result-card';section.dataset.resultField=field;section.innerHTML='<h3>'+esc(tr(key))+'</h3><div class="markdown"></div>';renderMarkdown(section.querySelector('.markdown'),d[field]);grid.appendChild(section)}grid.classList.add('visible');setStatus('');grid.scrollIntoView({behavior:'smooth',block:'start'})}
function updateAnalyzeButton(){$('analyzeButton').disabled=busy||!$('solveSubject').value||!imageName;$('captureButton').disabled=busy;$('selectButton').disabled=busy;$('solveSubject').disabled=busy}
async function acquireImage(type){try{const filename=String(await callAppBridge({type})||'').trim();if(!filename)return;imageName=filename;$('imagePreview').src=imageUrl(filename);$('imageZone').classList.add('has-image');updateAnalyzeButton()}catch(e){showToast(tr('failed')+': '+String(e.message||e))}}
function nextRandomId(){return String(Date.now())+String(Math.floor(Math.random()*1000000)).padStart(6,'0')}
async function analyze(){if(busy||!$('solveSubject').value||!imageName)return;busy=true;updateAnalyzeButton();$('resultGrid').classList.remove('visible');setStatus(tr('thinking'));try{const data={'记录编号':nextRandomId(),'学科':$('solveSubject').value,'题目内容':'','涉及知识点':'','解题步骤':'','最终答案':'','题目图片':imageName,'创建时间':dateTime(new Date())};await callAppBridge({type:'SubmitRecord',data:SUBMIT_TABLE,payload:JSON.stringify(data)});currentRow=1;const deadline=Date.now()+1800000;let value='';while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));value=(await cell('题目内容',currentRow)).trim();if(value)break}if(!value)throw Error(tr('timeout'));const details=await readDetails(currentRow);showResults(details);await refreshData()}catch(e){setStatus(String(e.message||e),true)}finally{busy=false;updateAnalyzeButton()}}
function installKeyboardSupport(){document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,select,textarea'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)})}
async function initialize(){lang=initialLanguage();const mode=await callAppBridge({type:'模式'}).catch(()=> '亮色');document.body.classList.toggle('dark',String(mode).trim()==='暗色');for(let i=0;i<SUBJECTS.length;i++){for(const id of ['solveSubject','subjectFilter']){const option=document.createElement('option');option.value=SUBJECTS[i];option.dataset.subject='';$(id).appendChild(option)}}applyLanguage();document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>goPage(el.dataset.page)));$('startButton').addEventListener('click',()=>goPage('solve'));$('allRecordsButton').addEventListener('click',()=>goPage('records'));$('viewRecordsButton').addEventListener('click',()=>goPage('records'));$('newSolveButton').addEventListener('click',()=>goPage('solve'));$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('desktopLanguage').addEventListener('click',()=>setLanguage(lang==='cn'?'en':'cn'));$('mobileLanguage').addEventListener('click',()=>setLanguage(lang==='cn'?'en':'cn'));$('menuButton').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))});document.addEventListener('pointerdown',e=>{if(!$('topbar').contains(e.target))closeMenu()});window.addEventListener('resize',checkNavFit);if(window.ResizeObserver)new ResizeObserver(checkNavFit).observe($('navLinks'));checkNavFit();$('captureButton').addEventListener('click',()=>acquireImage('CapturePhoto'));$('selectButton').addEventListener('click',()=>acquireImage('SelectImage'));$('solveSubject').addEventListener('change',updateAnalyzeButton);$('analyzeButton').addEventListener('click',analyze);$('recordSearch').addEventListener('input',renderRecords);$('subjectFilter').addEventListener('change',renderRecords);$('detailClose').addEventListener('click',closeDetail);$('detailBackdrop').addEventListener('click',e=>{if(e.target===$('detailBackdrop'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});installKeyboardSupport();$('recentList').innerHTML='<div class="empty">'+esc(tr('loading'))+'</div>';await refreshData()}
document.addEventListener('DOMContentLoaded',()=>{(async () => {    await initialize();  })()});
</script>
</body>
