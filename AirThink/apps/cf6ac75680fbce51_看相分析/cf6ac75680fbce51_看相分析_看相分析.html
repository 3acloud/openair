  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

    function imageUrl(name){return FILE_BASE+encodeURIComponent(String(name||'').trim())}
    function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function markdown(text){const raw=window.marked?marked.parse(String(text||''),{gfm:true,breaks:true}):'<p>'+escapeHTML(text).replace(/\n/g,'<br>')+'</p>';return window.DOMPurify?DOMPurify.sanitize(raw,{ADD_ATTR:['download']}):raw}
    function markdownNode(text){const node=document.createElement('div');node.className='markdown-body';node.innerHTML=markdown(text);node.querySelectorAll('img').forEach(img=>{const source=img.getAttribute('src')||'';if(source&&!/^(https?:|data:|blob:)/i.test(source))img.src=imageUrl(source);img.title='Download';img.addEventListener('click',()=>{const a=document.createElement('a');a.href=img.src;a.download='';document.body.appendChild(a);a.click();a.remove()})});return node}
    function formatLocalDate(d,withTime=false){const p=n=>String(n).padStart(2,'0');const base=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());return withTime?base+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()):base}
    function toast(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),4000)}
    function setLanguage(lang){state.lang=lang==='en'?'en':'cn';document.documentElement.lang=state.lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.i18nPlaceholder));localStorage.setItem('iThinkAir_UiLanguage',state.lang);renderRecords();renderRecent();if(!state.image&&!state.busy)$('reportContent').textContent=tr('reportEmpty');updateNavFit()}
    function initialLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved!==null&&saved!=='')return saved==='en'?'en':'cn';const param=new URLSearchParams(location.search).get('lang');if(param==='cn'||param==='en')return param;const languages=navigator.languages;if(!languages||!languages.length)return 'cn';return languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
    function closeMenu(){$('mobilemenu').classList.add('hidden');$('hamburger').setAttribute('aria-expanded','false')}
    function updateNavFit(){const bar=$('topbar'),brand=$('brand'),links=$('navlinks'),lang=$('langbtn');links.classList.remove('hidden');lang.classList.remove('hidden');const needed=brand.scrollWidth+links.scrollWidth+lang.scrollWidth+80;const compact=window.innerWidth<700||needed>bar.clientWidth-25;bar.classList.toggle('compact',compact);links.classList.toggle('hidden',compact);lang.classList.toggle('hidden',compact);$('hamburger').style.display=compact?'block':'none';if(!compact)closeMenu()}
    function navigate(page,push=true){if(!['home','start','records'].includes(page))return;if(push&&page!==state.page)state.history.push({page:state.page,scroll:window.scrollY});state.page=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='home')refreshHome();if(page==='records')refreshRecords()}
    function airBack(){if(state.modal){closeDetail();return 'false'}if(!$('mobilemenu').classList.contains('hidden')){closeMenu();return 'false'}if(state.history.length){const entry=state.history.pop();navigate(entry.page,false);requestAnimationFrame(()=>window.scrollTo(0,entry.scroll));return 'false'}return 'true'}
    window.airBack=airBack;
    function parseRows(csv){return parseCSV(String(csv||'')).filter(row=>row.length>1||row[0])}
    async function getRecords(){const csv=await callAppBridge({type:'GetTableCSV',data:DATA_SOURCE,payload:'图片,分析报告'});state.records=parseRows(csv).map((row,index)=>({image:row[0]||'',report:row[1]||'',row:index+1}));return state.records}
    function thumb(name){if(name){const img=document.createElement('img');img.className='thumb';img.src=imageUrl(name);img.alt='';img.loading='lazy';return img}const span=document.createElement('span');span.className='thumb thumbplaceholder';span.innerHTML='<i class="fa-solid fa-yin-yang"></i>';return span}
    function summary(text,limit){return String(text||'').slice(0,limit)+(String(text||'').length>limit?'…':'')}
    function makeCard(record,recent){const card=document.createElement('article');card.className='card '+(recent?'listcard':'recordcard');const top=document.createElement('div');top.className=recent?'listbody':'recordtop';if(recent){card.appendChild(thumb(record.image));const body=document.createElement('div');body.className='listbody';body.appendChild(markdownNode(summary(record.report,80)||'…'));card.appendChild(body)}else{top.appendChild(thumb(record.image));const body=document.createElement('div');body.className='listbody';const title=document.createElement('h3');title.textContent='#'+record.row;body.appendChild(title);body.appendChild(markdownNode(summary(record.report,100)||'…'));top.appendChild(body);card.appendChild(top);const actions=document.createElement('div');actions.className='recordactions';const view=document.createElement('button');view.type='button';view.className='btn';view.textContent=tr('details');view.onclick=e=>{e.stopPropagation();openDetail(record)};const del=document.createElement('button');del.type='button';del.className='btn danger';del.textContent=tr('delete');del.onclick=e=>{e.stopPropagation();deleteRecord(record)};actions.append(view,del);card.appendChild(actions)}card.tabIndex=0;card.setAttribute('role','button');card.onclick=()=>openDetail(record);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(record)}};return card}
    function renderRecent(){const container=$('recentList');container.replaceChildren();const records=state.records.slice(0,4);if(!records.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=tr('empty');container.appendChild(empty)}else records.forEach(r=>container.appendChild(makeCard(r,true)))}
    function renderRecords(){const container=$('recordList');container.replaceChildren();const query=state.search.trim().toLocaleLowerCase();const list=state.records.filter(r=>r.report.toLocaleLowerCase().includes(query));$('recordStatus').textContent=list.length+' / '+state.records.length;const visible=list.slice(0,state.visible);if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=query?tr('noMatch'):tr('empty');container.appendChild(empty)}else visible.forEach(r=>container.appendChild(makeCard(r,false)));$('loadMore').classList.toggle('hidden',list.length<=state.visible)}
    async function refreshHome(){try{const [count]=await Promise.all([callAppBridge({type:'GetRecordCount',data:DATA_SOURCE}),getRecords()]);$('totalCount').textContent=String(count).trim()||state.records.length;renderRecent();await updateToday()}catch(e){toast(tr('failed')+': '+e.message)}}
    async function updateToday(){try{const csv=await callAppBridge({type:'GetTableCSV',data:DATA_SOURCE,payload:'创建日期'});const today=formatLocalDate(new Date());const dates=parseRows(csv).map(r=>r[0]);const valid=dates.filter(x=>/^\d{4}-\d{2}-\d{2}/.test(x));$('todayCount').textContent=valid.length?valid.filter(x=>x.startsWith(today)).length:'—';$('todayCount').title=valid.length?'':tr('todayUnknown')}catch(e){$('todayCount').textContent='—';$('todayCount').title=tr('todayUnknown')}}
    async function refreshRecords(){try{await getRecords();renderRecords()}catch(e){toast(tr('failed')+': '+e.message)}}
    function setImage(name){state.image=String(name||'').trim();const preview=$('preview');preview.replaceChildren();if(state.image){const img=document.createElement('img');img.src=imageUrl(state.image);img.alt='Selected image';preview.appendChild(img)}else preview.innerHTML='<i class="fa-solid fa-masks-theater"></i>';$('generateBtn').disabled=!state.image||state.busy;$('uploadHint').textContent=state.image?state.image:tr('uploadHint')}
    async function chooseImage(type){if(state.busy)return;try{const name=await callAppBridge({type});if(name)setImage(name);else toast(tr(type==='CapturePhoto'?'photoUnavailable':'selectUnavailable'))}catch(e){toast(tr('failed')+': '+e.message)}}
    function setBusy(value){state.busy=value;$('generateBtn').disabled=value||!state.image;$('captureBtn').disabled=value;$('selectBtn').disabled=value;$('clearBtn').disabled=value}
    async function generateReport(){if(!state.image||state.busy)return;setBusy(true);const image=state.image;const output=$('reportContent');output.className='waiting';output.innerHTML='<i class="fa-solid fa-yin-yang"></i><p></p>';output.querySelector('p').textContent=tr('waiting');navigate('start',false);try{await callAppBridge({type:'SubmitRecord',data:'看相分析',payload:JSON.stringify({'图片':image})});state.currentRow=1;await refreshRecords();await refreshHome();const token=++state.pollToken;const deadline=Date.now()+1800*1000;while(token===state.pollToken&&Date.now()<deadline){const text=String(await callAppBridge({type:'GetCellValue',data:DATA_SOURCE,payload:'分析报告/1'})||'').trim();if(text){output.className='';output.replaceChildren();const img=document.createElement('img');img.className='reportimage';img.src=imageUrl(image);img.alt='Analysis image';output.append(img,markdownNode(text));await refreshRecords();await refreshHome();return}await new Promise(resolve=>setTimeout(resolve,1000))}output.className='error';output.textContent=tr('timeout')}catch(e){output.className='error';output.textContent=tr('failed')+': '+e.message}finally{setBusy(false)}}
    async function openDetail(record){state.modal=true;$('detailOverlay').classList.remove('hidden');$('detailContent').textContent=tr('waiting');try{const report=await callAppBridge({type:'GetCellValue',data:DATA_SOURCE,payload:'分析报告/'+record.row});if(!state.modal)return;const content=$('detailContent');content.replaceChildren();if(record.image){const img=document.createElement('img');img.className='detailimage';img.src=imageUrl(record.image);img.alt='Analysis image';content.appendChild(img)}const body=document.createElement('div');body.className='detailreport';body.appendChild(markdownNode(report));content.appendChild(body)}catch(e){$('detailContent').textContent=tr('failed')+': '+e.message}}
    function closeDetail(){state.modal=false;$('detailOverlay').classList.add('hidden');$('detailContent').replaceChildren()}
    async function deleteRecord(record){if(!confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:DATA_SOURCE,payload:record.row.toString()});await refreshRecords();await refreshHome()}catch(e){toast(tr('failed')+': '+e.message)}}
    function setupKeyboard(){if(!window.visualViewport)return;const show=()=>{const active=document.activeElement;if(!active||!active.matches('input,textarea,select'))return;setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),180)};document.addEventListener('focusin',show);window.visualViewport.addEventListener('resize',show)}
    async function initialize(){setLanguage(initialLanguage());try{const mode=String(await callAppBridge({type:'模式'})).trim();document.documentElement.dataset.mode=mode==='亮色'?'light':'dark'}catch(e){document.documentElement.dataset.mode='dark'}document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.page)));$('brand').onclick=()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)};$('heroStart').onclick=()=>navigate('start');$('viewAll').onclick=()=>navigate('records');$('historyBtn').onclick=()=>navigate('records');$('newBtn').onclick=()=>navigate('start');$('langbtn').onclick=()=>setLanguage(state.lang==='cn'?'en':'cn');$('mobilelang').onclick=()=>{setLanguage(state.lang==='cn'?'en':'cn');closeMenu()};$('hamburger').onclick=()=>{const open=$('mobilemenu').classList.toggle('hidden');$('hamburger').setAttribute('aria-expanded',String(!open))};document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});$('captureBtn').onclick=()=>chooseImage('CapturePhoto');$('selectBtn').onclick=()=>chooseImage('SelectImage');$('clearBtn').onclick=()=>setImage('');$('generateBtn').onclick=generateReport;$('recordSearch').oninput=e=>{state.search=e.target.value;state.visible=12;renderRecords()};$('loadMore').onclick=()=>{state.visible+=12;renderRecords()};$('closeDetail').onclick=closeDetail;$('detailOverlay').onclick=e=>{if(e.target===$('detailOverlay'))closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});window.addEventListener('resize',updateNavFit);if(window.ResizeObserver)new ResizeObserver(updateNavFit).observe($('topbar'));setupKeyboard();updateNavFit();await refreshHome()}
    document.addEventListener('DOMContentLoaded',async () => { await initialize(); });
  </script>
</body>
