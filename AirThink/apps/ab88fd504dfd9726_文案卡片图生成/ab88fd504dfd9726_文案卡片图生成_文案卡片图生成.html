<style>

<body>
<header class="top"><nav id="navigation" aria-label="主导航">
<button class="brand" id="brand"><i class="fa-solid fa-note-sticky" aria-hidden="true"></i><span><strong data-i18n="app"></strong><small>COPY · CARD · STUDIO</small></span></button>
<div class="nav-links" id="nav-links">
<button data-page="home" data-i18n="home" class="active"></button><button data-page="studio" data-i18n="studio"></button><button data-page="gallery" data-i18n="gallery"></button>
<button id="language" class="language">中文 / EN</button>
<div class="mobile-language"><button data-lang="cn">中文</button><button data-lang="en">English</button></div>
</div>
<button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav-links"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
</nav></header>
<main id="main">
<div class="error-banner" id="load-error" role="alert" hidden><span id="load-error-text"></span><button class="btn small" id="retry" data-i18n="retry"></button></div>
<section id="page-home" data-view="home">

<div class="hero-art" aria-hidden="true"><div class="ornament"></div><div class="paper-art second"></div><div class="paper-art"></div><div class="paper-art front"><span class="vertical" data-i18n="artWords"></span><span class="seal" data-i18n="artSeal"></span></div><span class="art-caption" data-i18n="artCaption"></span></div></div>
<div class="style-grid" id="styles"></div>
<div class="stats">
<div class="stat"><i class="fa-regular fa-folder-open"></i><span id="stat-total" class="number">—</span><span class="label" data-i18n="total"></span></div>
<div class="stat"><i class="fa-regular fa-image"></i><span id="stat-poster" class="number">—</span><span class="label" data-i18n="posters"></span></div>
<div class="stat"><i class="fa-regular fa-newspaper"></i><span id="stat-cover" class="number">—</span><span class="label" data-i18n="covers"></span></div>
<div class="stat"><i class="fa-solid fa-palette"></i><span id="stat-red" class="number">—</span><span class="label" data-i18n="redCount"></span></div>
</div>
<div class="section-head"><div><h2><span data-i18n="recent"></span><span class="kicker">RECENT CREATIONS</span></h2></div><button class="btn subtle small" data-page="gallery"><span data-i18n="viewAll"></span><i class="fa-solid fa-arrow-right"></i></button></div>
<div id="recent-grid" class="work-grid"></div>
</section>
<section id="page-studio" data-view="studio" hidden>
<div class="page-head"><div><span class="eyebrow">THE CREATIVE DESK</span><h1 data-i18n="studio"></h1><p data-i18n="studioText"></p></div><button class="btn" data-page="gallery"><i class="fa-regular fa-images"></i><span data-i18n="gallery"></span></button></div>
<div class="studio-grid">
<form id="card-form" class="panel"><div class="panel-head"><h2><i class="fa-solid fa-pen-nib"></i><span data-i18n="formTitle"></span></h2><span class="badge" id="record-mode"></span></div>

<fieldset class="field"><legend data-i18n="type"></legend><div class="type-options" id="type-options"></div></fieldset>
<fieldset class="field"><legend data-i18n="platform"></legend><div class="segment" id="platform-options"></div></fieldset>
<div class="field"><label for="card-form-signature" data-i18n="signature"></label><input id="card-form-signature" name="底部署名" type="text" data-placeholder="signaturePlaceholder"><p class="hint" data-i18n="signatureHint"></p></div>
<div class="field"><label for="card-form-highlight"><span data-i18n="highlight"></span><span id="highlight-required" class="required" data-i18n="mustHighlight" hidden></span></label><input id="card-form-highlight" name="高亮词" type="text" data-placeholder="highlightPlaceholder"></div>

var url;
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)

          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',

        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);

        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**

 * @returns {Promise<string>} - 返回GUID文件名
 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function emptyMarkup(filtered=false){return '<div class="empty"><div class="ink"><i class="fa-solid fa-feather-pointed" aria-hidden="true"></i></div><h3>'+t(filtered?'noMatches':'empty')+'</h3><p>'+t('emptyHint')+'</p><button class="btn primary" '+(filtered?'data-clear':'data-new')+'>'+t(filtered?'clearFilters':'start')+'</button></div>'}
function cardMarkup(record,recent=false){
 const d=record.values,file=d['卡片图片'],summary=state.summaryCache.get(record.row);
 const snippet=summary===undefined?t('loading'):Array.from(summary).slice(0,recent?48:160).join('');
 const tags=['高亮词','作者','账号','底部署名'].filter(k=>d[k]).map(k=>'<span>'+esc(t(({高亮词:'highlight',作者:'author',账号:'account',底部署名:'signature'})[k]))+' · '+esc(d[k])+'</span>').join('');
 return '<article class="work-card" tabindex="0" role="button" aria-label="'+esc(t('details')+' · '+t(d['卡片类型']))+'" data-row="'+record.row+'"><div class="work-cover">'+(file?'<img loading="lazy" src="'+esc(fileURL(file))+'" alt="'+esc(t(d['卡片类型']))+'">':placeholder(t('noImage')))+'</div><div class="work-body"><div class="badges"><span class="badge">'+esc(t(d['卡片类型']))+'</span><span class="badge platform '+(d['平台']==='小红书'?'red':'')+'">'+esc(t(d['平台']))+'</span></div><p class="summary" data-summary="'+record.row+'" data-recent="'+recent+'">'+esc(snippet)+'</p><div class="metadata">'+tags+'</div>'+(recent?'':'<div class="work-actions"><button class="btn small" data-action="detail">'+t('details')+'</button><button class="btn small" data-action="edit">'+t('edit')+'</button><button class="btn small danger" data-action="delete">'+t('delete')+'</button><button class="btn small" data-action="download" '+(!file?'disabled':'')+'>'+t('download')+'</button></div>')+'</div></article>';
}
function renderHome(){
 if(!state.loaded){$('recent-grid').innerHTML=loadingMarkup();return}
 // The bridge returns newest records first: CSV index 0 is row 1. Preserve that order.
 $('recent-grid').innerHTML=state.records.length?state.records.slice(0,6).map(r=>cardMarkup(r,true)).join(''):emptyMarkup();
 requestSummaries(state.records.slice(0,6));updateLocks();
}
function filteredRecords(){
 const query=$('gallery-search').value.trim().toLocaleLowerCase(),type=$('gallery-type').value,platform=$('gallery-platform').value;
 return state.records.filter(r=>(!type||r.values['卡片类型']===type)&&(!platform||r.values['平台']===platform)&&(!query||['文案','高亮词','作者','账号','底部署名'].some(f=>r.values[f].toLocaleLowerCase().includes(query))));
}
function renderGallery(){
 if(!state.loaded){$('gallery-grid').innerHTML=loadingMarkup();return}
 const filtered=filteredRecords(),visible=filtered.slice(0,state.limit);
 $('gallery-count').textContent=t('shown')+' '+visible.length+t('of')+filtered.length+' '+t('results');
 $('gallery-grid').innerHTML=visible.length?visible.map(r=>cardMarkup(r)).join(''):emptyMarkup(state.records.length>0);
 $('load-more').hidden=visible.length>=filtered.length;
 requestSummaries(visible);updateLocks();
}
async function requestSummaries(records){
 const version=state.version;
 for(const record of records){
  if(state.summaryCache.has(record.row))continue;
  state.summaryCache.set(record.row,undefined);
  try{
   const value=String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'文案/'+record.row}));
   if(version!==state.version)return;
   state.summaryCache.set(record.row,value);
   document.querySelectorAll('[data-summary="'+record.row+'"]').forEach(el=>el.textContent=Array.from(value).slice(0,el.dataset.recent==='true'?48:160).join(''));
  }catch(error){
   if(version!==state.version)return;
   state.summaryCache.delete(record.row);
   document.querySelectorAll('[data-summary="'+record.row+'"]').forEach(el=>el.textContent=t('loadFailureTitle'));
  }
 }
}
async function refreshData(){
 const version=++state.version;state.summaryCache.clear();
 try{
  const results=await Promise.all([
   callAppBridge({type:'GetRecordCount',data:SOURCE}),
   callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'卡片类型'}),
   callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'平台'}),
   callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')})
  ]);
  if(version!==state.version)return;
  const count=Number(String(results[0]).trim());if(!Number.isInteger(count)||count<0||String(results[0]).trim()==='')throw new Error('GetRecordCount: '+results[0]);
  state.count=count;
  state.records=parseCSV(String(results[3])).map((row,index)=>({row:index+1,values:Object.fromEntries(FIELDS.map((field,i)=>[field,row[i]??'']))}));
  state.loaded=true;
  $('stat-total').textContent=count;
  const types=parseCSV(String(results[1])),platforms=parseCSV(String(results[2]));
  $('stat-poster').textContent=types.filter(r=>r[0]==='文字海报').length;
  $('stat-cover').textContent=types.filter(r=>r[0]==='公众号封面').length;
  $('stat-red').textContent=platforms.filter(r=>r[0]==='小红书').length;
  $('load-error').hidden=true;renderHome();renderGallery();updateForm();
 }catch(error){
  if(version!==state.version)return;
  $('load-error-text').textContent=t('loadFailed')+fault(error);$('load-error').hidden=false;
  if(!state.loaded){for(const id of ['recent-grid','gallery-grid'])$(id).innerHTML='<div class="empty">'+t('loadFailureTitle')+'</div>'}
 }
}
async function readRecord(row){
 const data={};
 for(const field of FIELDS)data[field]=String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row}));
 return data;
}
async function loadRecord(row){
 if(state.busy){toast(t('busy'));return}
 busy(true);
 try{
  const data=await readRecord(row);
  const count=Number(await callAppBridge({type:'GetRecordCount',data:SOURCE}));
  if(!Number.isInteger(count)||row<1||row>count)throw new Error(t('noRecords'));
  state.count=count;state.row=row;state.file=data['卡片图片'].trim();
  for(const field of EDIT_FIELDS)setControl(field,data[field]);
  updateForm();renderPreview();closeModal();navigate('studio');
 }catch(error){toast(t('operationFailed')+fault(error))}
 finally{busy(false);updateForm()}
}
function formPayload(){
 const values={};for(const field of EDIT_FIELDS)values[field]=controlValue(field);
 if(!values['文案'].trim()){$('card-form-copy').focus();throw new Error(t('copyRequired'))}
 if(values['卡片类型']==='公众号封面'&&!values['高亮词'].trim()){$('card-form-highlight').focus();throw new Error(t('highlightRequired'))}
 if(values['卡片类型']==='X风格帖子'&&(!values['作者'].trim()||!values['账号'].trim())){$('card-form-'+(!values['作者'].trim()?'author':'account')).focus();throw new Error(t('identityRequired'))}
 return values;
}
async function pollImage(row){
 const deadline=Date.now()+1800*1000;
 while(Date.now()<deadline){
  await new Promise(resolve=>setTimeout(resolve,Math.min(1000,Math.max(0,deadline-Date.now()))));
  const remaining=deadline-Date.now();if(remaining<=0)break;
  let timer;
  let result;
  try{
   result=await Promise.race([
    callAppBridge({type:'GetCellValue',data:SOURCE,payload:'卡片图片/'+row}),
    new Promise((resolve,reject)=>{timer=setTimeout(()=>reject(new Error(t('timeout'))),remaining)})
   ]);
  }finally{clearTimeout(timer)}
  const file=String(result??'').trim();
  if(file){checkMutation(file);return file}
 }
 throw new Error(t('timeout'));
}
async function submitCard(forceNew=false){
 if(state.busy)return;
 let payload;try{payload=formPayload()}catch(error){toast(fault(error));return}
 busy(true);let created=false;
 try{
  if(state.row>0&&!forceNew){
   const row=state.row;
   for(const field of EDIT_FIELDS)checkMutation(await callAppBridge({type:'SetCellValue',data:SOURCE,payload:field+'/'+row+'/'+payload[field]}));
   toast(t('saved'));await refreshData();
  }else{
   checkMutation(await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(payload)}));
   created=true;state.row=1;state.count++;state.file='';state.waiting=true;updateForm();renderPreview();
   state.file=await pollImage(1);state.waiting=false;renderPreview();toast(t('generated'));await refreshData();
  }
 }catch(error){
  toast((created?t('pollFailed')+'\n':t('operationFailed'))+fault(error));
  if(created)await refreshData();
 }finally{state.waiting=false;busy(false);updateForm();renderPreview()}
}
let lastFocus=null;
function showModal(title,body,footer='',kind='detail'){
 lastFocus=document.activeElement;state.modalToken++;
 $('modal-root').innerHTML='<div class="overlay '+(kind==='detail'?'detail-overlay':'')+'"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><header class="dialog-header"><h2 id="dialog-title">'+esc(title)+'</h2><button id="dialog-close" class="btn small" aria-label="'+esc(t('close'))+'"><i class="fa-solid fa-xmark"></i></button></header><div id="dialog-body" class="dialog-body">'+body+'</div>'+(footer?'<footer class="dialog-footer actions">'+footer+'</footer>':'')+'</section></div>';
 document.body.style.overflow='hidden';$('dialog-close').onclick=closeModal;
 $('modal-root').firstElementChild.onclick=e=>{if(e.target===e.currentTarget)closeModal()};
 $('dialog-close').focus();return state.modalToken;
}
function closeModal(){if(!$('modal-root').children.length)return;state.modalToken++;$('modal-root').replaceChildren();document.body.style.overflow='';state.detail=null;if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true})}
function markdownHTML(text){
 if(!window.markdownit||!window.DOMPurify)return '<p class="hint">'+t('markdownUnavailable')+'</p><pre>'+esc(text)+'</pre>';
 const md=window.markdownit({html:true,linkify:true,typographer:true,breaks:false});
 for(const plugin of [window.markdownitFootnote,window.markdownitTaskLists,window.markdownitDeflist])if(typeof plugin==='function')md.use(plugin);
 return DOMPurify.sanitize(md.render(text),{USE_PROFILES:{html:true},ADD_ATTR:['target'],FORBID_TAGS:['style','form','iframe','input'],FORBID_ATTR:['style']});
}
function prepareMarkdown(container){
 container.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});
 container.querySelectorAll('img').forEach(img=>{
  const original=img.getAttribute('src')||'';let download;
  if(!/^(https?:|data:|blob:)/i.test(original)){
   download=fileURL(original);img.src=download;
  }else{
   try{const parsed=new URL(original,location.href);const match=parsed.pathname.match(/\/(?:private|download)\/([^/]+)$/);download=match?fileURL(decodeURIComponent(match[1])):parsed.href}catch(e){return}
  }
  img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label',t('downloadOriginal'));
  const open=e=>{e.preventDefault();e.stopPropagation();window.open(download,'_blank','noopener')};
  img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')open(e)});
 });
}
async function showDetails(row){
 const token=showModal(t('detailTitle'),'<div class="preview-wait"><div class="ripple"></div>'+t('loadingDetails')+'</div>');
 try{
  const data=await readRecord(row);if(token!==state.modalToken)return;
  state.detail={row,data};const file=data['卡片图片'].trim();
  const labels={'卡片类型':'type','平台':'platform','底部署名':'signature','高亮词':'highlight','作者':'author','账号':'account','卡片图片':'image'};
  $('dialog-body').innerHTML='<div class="detail-grid"><div>'+(file?'<a href="'+esc(fileURL(file))+'" target="_blank" rel="noopener"><img class="detail-image" src="'+esc(fileURL(file))+'" alt="'+esc(t('preview'))+'"></a>':placeholder(t('noImage')))+'<dl class="detail-fields">'+FIELDS.slice(1).map(f=>'<dt>'+esc(t(labels[f]))+'</dt><dd>'+esc((f==='卡片类型'||f==='平台')?t(data[f]):data[f]||t('noValue'))+'</dd>').join('')+'</dl></div><div><h3>'+t('copy')+'</h3><div id="detail-markdown" class="markdown">'+markdownHTML(data['文案'])+'</div></div></div>';
  const footer=document.createElement('footer');footer.className='dialog-footer actions';
  footer.innerHTML='<button id="detail-edit" class="btn primary" '+(state.busy?'disabled':'')+'>'+t('goEdit')+'</button>'+(file?'<a class="btn" target="_blank" rel="noopener" href="'+esc(fileURL(file))+'">'+t('downloadOriginal')+'</a>':'');
  $('modal-root').querySelector('.dialog').append(footer);$('detail-edit').onclick=()=>loadRecord(row);prepareMarkdown($('detail-markdown'));
 }catch(error){if(token===state.modalToken)$('dialog-body').textContent=t('loadFailed')+fault(error)}
}
function confirmDelete(row){
 if(state.busy){toast(t('busy'));return}
 showModal(t('deleteTitle'),'<p>'+t('deleteText')+'</p>','<button id="delete-cancel" class="btn">'+t('cancel')+'</button><button id="delete-confirm" class="btn danger">'+t('delete')+'</button>','confirm');
 $('delete-cancel').onclick=closeModal;
 $('delete-confirm').onclick=async()=>{
  if(state.busy)return;busy(true);
  try{
   checkMutation(await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()}));
   if(state.row===row){state.row=0;state.file='';$('card-form').reset();for(const f of Object.keys(fieldIds))setControl(f,'');setControl('卡片类型',TYPES[0]);setControl('平台','小红书')}
   else if(state.row>row)state.row--;
   closeModal();await refreshData();renderPreview();toast(t('deleted'));
  }catch(error){toast(t('operationFailed')+fault(error))}
  finally{busy(false);updateForm()}
 };
}
function clearFilters(){$('gallery-search').value='';$('gallery-type').value='';$('gallery-platform').value='';state.limit=12;renderGallery()}
function bindEvents(){
 document.addEventListener('click',event=>{
  const page=event.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}
  const language=event.target.closest('[data-lang]');if(language){changeLanguage(language.dataset.lang);return}
  const newButton=event.target.closest('[data-new]');if(newButton){if(state.busy)return;resetStudio();navigate('studio');return}
  if(event.target.closest('[data-clear]')){clearFilters();return}
  if(!$('navigation').contains(event.target))closeMenu();
 });
 $('menu-toggle').onclick=()=>{const open=$('navigation').classList.toggle('menu-open');$('menu-toggle').setAttribute('aria-expanded',String(open))};
 $('language').onclick=()=>changeLanguage(state.lang==='en'?'cn':'en');
 $('brand').onclick=()=>{try{if(typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);else toast(t('noHost'))}catch(e){toast(t('noHost'))}};
 $('card-form').onsubmit=e=>{e.preventDefault();submitCard(false)};
 $('card-form').addEventListener('input',updateForm);$('card-form').addEventListener('change',updateForm);
 $('rerender').onclick=()=>submitCard(true);$('new-card').onclick=resetStudio;
 $('gallery-new').onclick=()=>{resetStudio();navigate('studio')};
 $('previous-record').onclick=()=>{if(state.row>1)loadRecord(state.row-1)};
 $('next-record').onclick=()=>{if(state.row>0&&state.row<state.count)loadRecord(state.row+1)};
 $('gallery-search').oninput=()=>{state.limit=12;renderGallery()};
 $('gallery-type').onchange=$('gallery-platform').onchange=()=>{state.limit=12;renderGallery()};
 $('load-more').onclick=()=>{state.limit+=12;renderGallery()};
 $('retry').onclick=$('gallery-refresh').onclick=()=>{if(!state.busy)refreshData()};
 for(const id of ['recent-grid','gallery-grid']){
  $(id).addEventListener('click',event=>{
   const card=event.target.closest('[data-row]');if(!card)return;
   const row=Number(card.dataset.row),action=event.target.closest('[data-action]')?.dataset.action||'detail';
   if(action==='edit')loadRecord(row);
   else if(action==='delete')confirmDelete(row);
   else if(action==='download'){const record=state.records.find(r=>r.row===row);if(record?.values['卡片图片'])window.open(fileURL(record.values['卡片图片']),'_blank','noopener')}
   else showDetails(row);
  });
  $(id).addEventListener('keydown',event=>{if(event.target.matches('.work-card')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();showDetails(Number(event.target.dataset.row))}});
 }
 document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if($('modal-root').children.length)closeModal();else closeMenu()}
  if(event.key==='Tab'&&$('modal-root').children.length){
   const focusables=Array.from($('modal-root').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),[tabindex="0"]')).filter(el=>el.getClientRects().length);
   const first=focusables[0],last=focusables[focusables.length-1];
   if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}
   else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}
  }
 });
 document.addEventListener('error',event=>{
  if(event.target.tagName==='IMG'){
   const img=event.target;if(img.dataset.failed)return;img.dataset.failed='true';
   const replacement=document.createElement('div');replacement.className='placeholder';replacement.textContent=t('imageFailed');img.replaceWith(replacement);
  }
 },true);
 const keyboardFocus=()=>{
  const focused=document.activeElement;
  if(focused?.matches('input,textarea,select')){
   const inset=window.visualViewport?Math.max(0,innerHeight-visualViewport.height-visualViewport.offsetTop):0;
   document.documentElement.style.setProperty('--keyboard',Math.max(inset,innerWidth<=760?260:0)+'px');
   setTimeout(()=>{if(document.activeElement===focused)focused.scrollIntoView({block:'center',behavior:'smooth'})},180);
  }else document.documentElement.style.setProperty('--keyboard','0px');
 };
 document.addEventListener('focusin',keyboardFocus);document.addEventListener('focusout',()=>setTimeout(keyboardFocus,100));
 window.visualViewport?.addEventListener('resize',keyboardFocus);
 window.addEventListener('resize',fitNavigation);if(window.ResizeObserver)new ResizeObserver(fitNavigation).observe($('navigation'));
}
async function initialize(){
 state.lang=initialLanguage();
 document.documentElement.dataset.theme=window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light';
 localize();bindEvents();
 const modeTask=(async()=>{try{const mode=String(await callAppBridge({type:'模式'})).trim();if(mode==='暗色'||mode==='亮色')document.documentElement.dataset.theme=mode==='暗色'?'dark':'light'}catch(error){toast(t('loadFailed')+fault(error))}})();
 await Promise.all([modeTask,refreshData()]);
 if(document.fonts?.ready)document.fonts.ready.then(fitNavigation);
}
(async () => { await initialize(); })();
</script>
</body>
