<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {

    fileInput.style.display = 'none';

      } else {

      document.body.removeChild(fileInput);
    });

    fileInput.addEventListener('cancel', () => {

    });

    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;

    `;

      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];

            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {

                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {

                            i++;
                        }

                        i++;
                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束

                            i++;
                        }

                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const I18N={cn:{appName:'宫格故事图生成',home:'首页',create:'生成故事',gallery:'故事图库',heroTag:'把想象装进画框',heroText:'输入故事主题与主角形象，一键为你生成专属的宫格手绘故事图与分格文案！',start:'开始创作',ourStories:'我们的故事',totalStories:'累计创作故事数',countNote:'每一篇都是独一无二的想象',recent:'最近创作',createTag:'开启一段新旅程',createLead:'告诉我们你的灵感，让绘本故事跃然纸上。',formTitle:'故事创作',theme:'故事主题',heroImage:'主角形象图片',selectImage:'选择图片',traits:'主角特征',panels:'宫格数量',auto:'AI推荐',four:'4宫格',six:'6宫格',nine:'9宫格',style:'手绘风格',doodle:'极简涂鸦风',watercolor:'水彩绘本风',sketch:'铅笔素描风',manga:'日系漫画风',retro:'复古连环画风',crayon:'儿童蜡笔画风',generate:'生成绘本故事',resultTitle:'你的绘本故事成品',resultEmpty:'故事即将从这里开始……',galleryTag:'你的故事收藏夹',galleryLead:'你过往创作的所有宫格故事都在这里珍藏',newStory:'新建故事',search:'搜索故事',createAgain:'再创一篇',viewStory:'查看绘本',delete:'删除',noStories:'还没有故事，开始创作吧！',waiting:'正在施展魔法绘制故事中，请稍候...',timeout:'生成超时，请稍后到故事图库查看。',confirmDelete:'确定删除这篇故事吗？',loadError:'加载失败',submitError:'提交失败',deleteError:'删除失败',story:'故事',imageError:'图片选择失败'},en:{appName:'Story Grid Studio',home:'Home',create:'Create Story',gallery:'Story Gallery',heroTag:'Frame your imagination',heroText:'Enter a story theme and a character image to create your own illustrated grid story with captions.',start:'Start Creating',ourStories:'Our stories',totalStories:'Stories Created',countNote:'Every story is a unique imagination',recent:'Recent Creations',createTag:'A new journey begins',createLead:'Share your idea and bring a picture book to life.',formTitle:'Story Creator',theme:'Story Theme',heroImage:'Character Image',selectImage:'Choose Image',traits:'Character Traits',panels:'Number of Panels',auto:'AI Recommended',four:'4 Panels',six:'6 Panels',nine:'9 Panels',style:'Illustration Style',doodle:'Minimal Doodle',watercolor:'Watercolor Picture Book',sketch:'Pencil Sketch',manga:'Japanese Manga',retro:'Vintage Comic',crayon:'Children’s Crayon',generate:'Generate Picture Book',resultTitle:'Your Picture Book',resultEmpty:'Your story begins here…',galleryTag:'Your story collection',galleryLead:'All your past grid stories are treasured here.',newStory:'New Story',search:'Search stories',createAgain:'Create Another',viewStory:'View Picture Book',delete:'Delete',noStories:'No stories yet. Create one!',waiting:'Drawing your story with a little magic. Please wait…',timeout:'Generation timed out. Check the gallery later.',confirmDelete:'Delete this story?',loadError:'Could not load data',submitError:'Could not submit',deleteError:'Could not delete',story:'Story',imageError:'Could not select image'}};
let language='cn',currentPage='home',currentRow=0,submitting=false,pollToken=0,storyRows=[],historyStack=[],modalOpen=false;
const el=id=>document.getElementById(id);const tr=key=>I18N[language][key]||key;
function chooseLanguage(){const p=new URLSearchParams(location.search).get('lang');if(p==='cn'||p==='en')return p;try{const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn'}catch(e){}const languages=navigator.languages;if(!languages||!languages.length)return 'cn';return languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function applyLanguage(){document.documentElement.lang=language==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=tr(node.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(node=>node.placeholder=tr(node.dataset.placeholder));el('langButton').textContent=language==='cn'?'EN':'中';el('mobileLangButton').textContent=language==='cn'?'English':'中文';renderRecent();renderGallery();if(!el('resultBody').querySelector('.markdown-body')&&!submitting)showResultEmpty()}
function toggleLanguage(){language=language==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',language)}catch(e){}applyLanguage();closeMenu();measureNav()}
function measureNav(){const links=el('navLinks'),brand=el('brand'),inner=el('topbar').querySelector('.nav-inner');links.style.display='flex';links.style.visibility='hidden';const available=inner.clientWidth-parseFloat(getComputedStyle(inner).paddingLeft)-parseFloat(getComputedStyle(inner).paddingRight);const needsMenu=brand.scrollWidth+links.scrollWidth+25>available;links.style.display=needsMenu?'none':'flex';links.style.visibility='';el('menuButton').style.display=needsMenu?'block':'none';if(!needsMenu)closeMenu()}
function closeMenu(){el('mobileMenu').classList.remove('open');el('menuButton').setAttribute('aria-expanded','false')}
function showPage(page,record=true){if(page===currentPage){closeMenu();return}if(record)historyStack.push({page:currentPage,scroll:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(node=>node.classList.toggle('active',node.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(node=>node.classList.toggle('active',node.dataset.page===page));el('createAgainButton').classList.toggle('show',page==='create');closeMenu();window.scrollTo(0,0);if(page==='home')loadHome();if(page==='gallery')loadGallery()}
function airBack(){if(modalOpen){closeDetail();return 'false'}if(el('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const previous=historyStack.pop();showPage(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false'}return 'true'}window.airBack=airBack;
function safeText(value){return String(value??'')}
function makeEmpty(){const box=document.createElement('div');box.className='empty';box.innerHTML='<i class="fa-solid fa-book-open"></i>';const span=document.createElement('span');span.textContent=tr('noStories');box.append(span);return box}
function showError(container,prefix,error){container.replaceChildren();const box=document.createElement('div');box.className='status error';box.textContent=tr(prefix)+': '+String(error?.message||error);container.append(box)}
function showResultEmpty(){el('resultBody').innerHTML='<div class="result-placeholder"><i class="fa-solid fa-book-open-reader"></i><span></span></div>';el('resultBody').querySelector('span').textContent=tr('resultEmpty')}
function fileUrl(name,kind='download'){const value=safeText(name).trim();if(!value)return '';if(/^https?:\/\//i.test(value))return value;return 'https://www.ithinkair.com:3031/'+kind+'/'+encodeURIComponent(value)}
function renderMarkdown(target,markdown){target.replaceChildren();const content=document.createElement('div');content.className='markdown-body';if(window.markdownit){const md=window.markdownit({html:!!window.DOMPurify,linkify:true,typographer:true,breaks:true});const rendered=md.render(safeText(markdown));content.innerHTML=window.DOMPurify?DOMPurify.sanitize(rendered):rendered}else{content.style.whiteSpace='pre-wrap';content.textContent=safeText(markdown)}content.querySelectorAll('img').forEach(img=>{const original=img.getAttribute('src')||'';const url=fileUrl(original);img.src=url;img.loading='lazy';const a=document.createElement('a');a.href=url;a.setAttribute('download','');a.target='_blank';a.rel='noopener noreferrer';img.replaceWith(a);a.append(img)});content.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});target.append(content)}
function openDetail(title,markdown){el('detailTitle').textContent=title||tr('viewStory');renderMarkdown(el('detailBody'),markdown);el('detailLayer').classList.add('open');modalOpen=true;document.body.style.overflow='hidden';el('detailScroll').scrollTop=0;el('closeDetailButton').focus()}
function closeDetail(){el('detailLayer').classList.remove('open');modalOpen=false;document.body.style.overflow=''}
async function viewStory(row,title){openDetail(title||tr('viewStory'),tr('waiting'));try{const text=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'故事图成品/'+row});if(modalOpen)renderMarkdown(el('detailBody'),text)}catch(e){if(modalOpen)showError(el('detailBody'),'loadError',e)}}
function getRows(csv){return parseCSV(safeText(csv)).filter(row=>row.some(cell=>safeText(cell).trim()!==''))}
async function loadHome(){try{const [count,csv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:'故事主题,宫格数量,手绘风格'})]);el('storyCount').textContent=safeText(count).trim()||'0';const rows=getRows(csv);const recent=rows.map((values,index)=>({values,row:index+1})).slice(-3).reverse();renderRecent(recent)}catch(e){el('storyCount').textContent='—';showError(el('recentList'),'loadError',e)}}
let recentRows=[];function renderRecent(rows){if(rows)recentRows=rows;const list=el('recentList');list.replaceChildren();if(!recentRows.length){list.append(makeEmpty());return}for(const item of recentRows){const button=document.createElement('button');button.type='button';button.className='recent-item';const title=document.createElement('span');title.className='recent-title';title.textContent=item.values[0]||tr('story');const pills=document.createElement('span');pills.className='pill-row';for(const value of [item.values[2],item.values[1]])if(value){const pill=document.createElement('span');pill.className='pill';pill.textContent=value;pills.append(pill)}button.append(title,pills);button.addEventListener('click',()=>viewStory(item.row,item.values[0]));list.append(button)}}
async function loadGallery(){const list=el('galleryList');list.innerHTML='<div class="status"><i class="fa-solid fa-spinner fa-spin"></i></div>';try{const csv=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:'故事主题,主角特征,宫格数量,手绘风格'});storyRows=getRows(csv).map((values,index)=>({values,row:index+1}));renderGallery()}catch(e){showError(list,'loadError',e)}}
function renderGallery(){const list=el('galleryList');list.replaceChildren();const q=el('gallerySearch').value.trim().toLocaleLowerCase();const filtered=storyRows.filter(item=>item.values.some(value=>safeText(value).toLocaleLowerCase().includes(q)));if(!filtered.length){list.append(makeEmpty());return}for(const item of filtered){const [theme,traits,panels,style]=item.values;const card=document.createElement('article');card.className='story-card';const mark=document.createElement('i');mark.className='fa-solid fa-book-open story-card-mark';const title=document.createElement('h3');title.textContent=theme||tr('story');const desc=document.createElement('p');desc.textContent=traits||' ';const pills=document.createElement('div');pills.className='pill-row';for(const value of [panels,style])if(value){const pill=document.createElement('span');pill.className='pill';pill.textContent=value;pills.append(pill)}const actions=document.createElement('div');actions.className='story-actions';const view=document.createElement('button');view.type='button';view.className='button small ghost';view.innerHTML='<i class="fa-regular fa-eye"></i> ';view.append(document.createTextNode(tr('viewStory')));view.addEventListener('click',()=>viewStory(item.row,theme));const del=document.createElement('button');del.type='button';del.className='button small danger';del.innerHTML='<i class="fa-regular fa-trash-can"></i> ';del.append(document.createTextNode(tr('delete')));del.addEventListener('click',()=>deleteStory(item.row));actions.append(view,del);card.append(mark,title,desc,pills,actions);list.append(card)}}
async function deleteStory(row){if(!window.confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});await loadGallery();if(currentRow===row)currentRow=0}catch(e){window.alert(tr('deleteError')+': '+String(e?.message||e))}}
function setWaiting(){el('resultBody').replaceChildren();const status=document.createElement('div');status.className='status';status.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ';status.append(document.createTextNode(tr('waiting')));el('resultBody').append(status)}
async function pollResult(token){const started=Date.now();while(token===pollToken&&Date.now()-started<1800000){try{const result=await callAppBridge({type:'轮询',data:'故事生成',payload:'故事图成品'});if(token!==pollToken)return;if(safeText(result).trim()){renderMarkdown(el('resultBody'),result);submitting=false;el('submitButton').disabled=false;loadHome();return}}catch(e){if(token===pollToken){showError(el('resultBody'),'loadError',e);submitting=false;el('submitButton').disabled=false}return}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken){el('resultBody').innerHTML='<div class="status error"></div>';el('resultBody').firstChild.textContent=tr('timeout');submitting=false;el('submitButton').disabled=false}}
async function submitStory(event){event.preventDefault();if(submitting)return;const form=el('storyForm');if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form).entries());submitting=true;el('submitButton').disabled=true;setWaiting();try{await callAppBridge({type:'SubmitRecord',data:'故事生成',payload:JSON.stringify(data)});currentRow=1;pollResult(++pollToken)}catch(e){showError(el('resultBody'),'submitError',e);submitting=false;el('submitButton').disabled=false}}
function resetStory(){if(submitting)return;el('storyForm').reset();el('imagePreview').style.display='none';el('imagePreview').removeAttribute('src');currentRow=0;showResultEmpty();el('storyForm_theme').focus();window.scrollTo({top:0,behavior:'smooth'})}
async function selectImage(){try{const filename=await callAppBridge({type:'SelectImage'});if(!filename)return;el('storyForm_image').value=filename;const img=el('imagePreview');img.src=fileUrl(filename,'private');img.style.display='block'}catch(e){window.alert(tr('imageError')+': '+String(e?.message||e))}}
async function initialize(){language=chooseLanguage();applyLanguage();try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.mode=safeText(mode).trim()==='暗色'?'dark':'light'}catch(e){document.documentElement.dataset.mode='light'}el('brand').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));el('startButton').addEventListener('click',()=>showPage('create'));el('newStoryButton').addEventListener('click',()=>{showPage('create');resetStory()});el('createAgainButton').addEventListener('click',resetStory);el('storyForm').addEventListener('submit',submitStory);el('selectImageButton').addEventListener('click',selectImage);el('gallerySearch').addEventListener('input',renderGallery);el('langButton').addEventListener('click',toggleLanguage);el('mobileLangButton').addEventListener('click',toggleLanguage);el('menuButton').addEventListener('click',event=>{event.stopPropagation();const open=el('mobileMenu').classList.toggle('open');el('menuButton').setAttribute('aria-expanded',String(open))});document.addEventListener('click',event=>{if(!el('topbar').contains(event.target))closeMenu()});el('closeDetailButton').addEventListener('click',closeDetail);el('detailLayer').addEventListener('click',event=>{if(event.target===el('detailLayer'))closeDetail()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(modalOpen)closeDetail();else closeMenu()}});const ro=new ResizeObserver(measureNav);ro.observe(el('topbar'));window.addEventListener('resize',measureNav);measureNav();document.addEventListener('focusin',event=>{if(!event.target.matches('input,select,textarea'))return;setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,select,textarea'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),80)});await loadHome()}
document.addEventListener('DOMContentLoaded',()=>{(async () => {    await initialize();  })();});
</script>
