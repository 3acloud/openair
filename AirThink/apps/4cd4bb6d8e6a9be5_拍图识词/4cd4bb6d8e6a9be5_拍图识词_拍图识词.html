<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {

}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));

    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';

    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function renderReview(){const rows=reviewRows();if(!rows.length){$('reviewContent').innerHTML=empty(tr('noReview'));return;}state.reviewIndex%=rows.length;const b=rows[state.reviewIndex],r=linked(b);$('reviewContent').innerHTML='<div class="review-card"><div class="muted">'+(state.reviewIndex+1)+' / '+rows.length+'</div><div class="word">'+esc(r['英文单词'])+'</div><div class="phonetic">'+esc(r['音标'])+'</div><p '+(state.reviewShown?'':'hidden')+'>'+esc(r._summary||r['中文释义'])+'</p><div class="review-controls">'+action('reveal','showMeaning','eye',b._row)+action('know','know','check',b._row,true)+action('practice','again','repeat',b._row,true)+action('next','next','arrow-right',b._row)+'</div></div>';updateBusy();}
function mdText(value){return String(value??'');}
function renderLearning(container,r){container.replaceChildren();if(!window.marked||!window.DOMPurify){container.textContent=tr('markdownMissing');return;}const title=document.createElement('h1');title.textContent=r['识别标题']||'';container.append(title);if(r['拍照图片']){const p=document.createElement('p');p.className='original';const a=document.createElement('a');a.href=download(r['拍照图片']);a.target='_blank';a.rel='noopener';a.download='';const img=document.createElement('img');img.src=a.href;img.alt=r['物体名称']||fl('拍照图片');a.append(img);p.append(a);container.append(p);}const word=document.createElement('h2');word.textContent=r['英文单词']||'';container.append(word);const meta=document.createElement('p');meta.textContent=(r['音标']||'')+' · '+(r['词性']||'');container.append(meta);const object=document.createElement('p');object.textContent=fl('物体名称')+': '+(r['物体名称']||'');container.append(object);for(const f of ['中文释义','英文例句','例句翻译','记忆提示']){const h=document.createElement('h3');h.textContent=fl(f);container.append(h);const body=document.createElement(f==='记忆提示'?'blockquote':'div');body.innerHTML=DOMPurify.sanitize(marked.parse(mdText(r[f]),{gfm:true,breaks:true}),{USE_PROFILES:{html:true}});container.append(body);}container.querySelectorAll('img').forEach(img=>{if(img.closest('a'))return;const src=img.getAttribute('src')||'';const a=document.createElement('a');let file=src;if(/^https?:\/\//i.test(src)){try{file=decodeURIComponent(new URL(src).pathname.split('/').pop());}catch(e){return;}}if(!file||/^(data|javascript):/i.test(file))return;a.href=download(file);a.target='_blank';a.rel='noopener';a.download='';if(!/^https?:\/\//i.test(src))img.src=a.href;img.replaceWith(a);a.append(img);});container.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer';});}
async function detailRecord(row){const root=modal(tr('details'),true),body=root.querySelector('.dialog-body');body.textContent=tr('loading');try{const r=await cells(R_SOURCE,RF,row);if(!root.isConnected)return;body.classList.add('markdown-body');renderLearning(body,r);}catch(e){body.textContent=tr('error');showError(e);}}
async function detailBook(row){const root=modal(tr('details'),true),body=root.querySelector('.dialog-body');body.textContent=tr('loading');try{const b=await cells(B_SOURCE,BF,row),r=linked(b);body.replaceChildren();if(r){const full=await cells(R_SOURCE,RF,r._row);const card=document.createElement('article');card.className='markdown-body';renderLearning(card,full);body.append(card);}else{const p=document.createElement('p');p.textContent=tr('missing');body.append(p);}const meta=document.createElement('p');meta.textContent=[fl(b['分类']),fl(b['掌握状态']),tr('favorite')+': '+fl(b['是否收藏']),tr('reviews')+': '+b['复习次数']].join(' · ');body.append(meta);const play=document.createElement('button');play.className='btn';play.textContent=tr('play');const audio=document.createElement('audio');audio.controls=true;audio.preload='none';body.append(play,audio);play.onclick=()=>guard(()=>playAudio(row,audio));if(b['单词发音'])await prepareAudio(audio,b['单词发音']);else{const p=document.createElement('p');p.className='muted';p.textContent=tr('audioPending');body.append(p);}}catch(e){body.textContent=tr('error');showError(e);}}
const audioCache=new Map();
async function prepareAudio(audio,file){let b64=audioCache.get(file);if(!b64){b64=textValue(await callAppBridge({type:'FileToBase64',data:file}));if(b64)audioCache.set(file,b64);}audio.src=download(file);audio.onerror=()=>{if(b64&&!audio.src.startsWith('data:')){audio.src=b64.startsWith('data:')?b64:'data:audio/mpeg;base64,'+b64;audio.load();}else toast(tr('audioError'));};}
async function playAudio(row,target=$('globalAudio')){const file=textValue(await callAppBridge({type:'GetCellValue',data:B_SOURCE,payload:'单词发音/'+row}));if(!file){toast(tr('audioPending'));return;}document.querySelectorAll('audio').forEach(a=>{if(a!==target)a.pause();});if(target===$('globalAudio'))$('audioDock').hidden=false;await prepareAudio(target,file);try{await target.play();}catch(e){toast(tr('audioError'));}}
function updateBusy(){const busy=state.writing||!!state.job;document.querySelectorAll('[data-write]').forEach(b=>b.disabled=busy);$('generateButton').disabled=busy||!state.image;$('jobbar').hidden=!state.job;if(state.job){$('jobText').textContent=state.job.error?(tr('resumeHint')+' '+state.job.error):tr(state.job.kind==='recognition'?'waitImage':'waitAudio');$('resumeJob').hidden=state.jobRunning;$('jobIcon').className=state.jobRunning?'fa-solid fa-spinner fa-spin':'fa-solid fa-clock';}}
async function guard(fn){try{await fn();}catch(e){showError(e);}}
async function write(fn){if(state.writing||state.job){toast(tr('busy'));return;}state.writing=true;updateBusy();try{await fn();}finally{state.writing=false;updateBusy();}}
async function poll(tableName,field){const end=Date.now()+1800000;while(Date.now()<end){await new Promise(resolve=>setTimeout(resolve,Math.min(1000,end-Date.now())));if(Date.now()>=end)break;let timer;try{const value=await Promise.race([callAppBridge({type:'轮询',data:tableName,payload:field}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(tr('timeout'))),end-Date.now());})]);if(textValue(value))return value;}finally{clearTimeout(timer);}}throw new Error(tr('timeout'));}
async function finishJob(){if(!state.job||state.jobRunning)return;state.jobRunning=true;state.job.error='';updateBusy();const job=state.job;try{await poll(job.kind==='recognition'?'识物记录':'单词本',job.kind==='recognition'?'识别标题':'单词发音');if(job.kind==='recognition'){const fields=['识别标题','物体名称','英文单词','音标','词性','中文释义','英文例句','例句翻译','记忆提示','拍照图片'];state.result=await cells(R_SOURCE,fields,1);state.currentRow=1;renderLearning($('learningCard'),state.result);$('learningCard').hidden=false;$('resultPlaceholder').hidden=true;$('resultActions').hidden=false;toast(tr('done'));}else{const file=textValue(await callAppBridge({type:'GetCellValue',data:B_SOURCE,payload:'单词发音/1'}));if(!file)throw new Error(tr('audioPending'));await prepareAudio($('globalAudio'),file);$('audioDock').hidden=false;if(job.modal?.isConnected){const body=job.modal.querySelector('.dialog-body');body.replaceChildren();const p=document.createElement('p');p.textContent=tr('added');const audio=document.createElement('audio');audio.controls=true;await prepareAudio(audio,file);body.append(p,audio);}toast(tr('added'));}state.job=null;try{await reload();}catch(e){toast(tr('refreshError'));}}catch(e){job.error=String(e?.message||e);}finally{state.jobRunning=false;updateBusy();}}
async function choosePhoto(type){await write(async()=>{const file=textValue(await callAppBridge({type}));if(!file)return;state.image=file;$('captureForm_image').value=file;$('capturePreview').src=download(file);$('capturePreview').alt=fl('拍照图片');$('capturePreview').hidden=false;$('cameraPlaceholder').hidden=true;state.result=null;state.currentRow=0;$('learningCard').hidden=true;$('resultActions').hidden=true;$('resultPlaceholder').hidden=false;});}
function resetCapture(){if(state.job||state.writing)return;state.image='';state.result=null;state.currentRow=0;$('captureForm').reset();$('capturePreview').hidden=true;$('capturePreview').removeAttribute('src');$('cameraPlaceholder').hidden=false;$('learningCard').hidden=true;$('learningCard').replaceChildren();$('resultActions').hidden=true;$('resultPlaceholder').hidden=false;updateBusy();}
async function recognize(){if(!state.image){toast(tr('chooseFirst'));return;}await write(async()=>{const data={};RF.forEach(f=>data[f]='');data['拍照图片']=state.image;data['识别时间']=localDate();await callAppBridge({type:'SubmitRecord',data:'识物记录',payload:JSON.stringify(data)});state.currentRow=1;state.job={kind:'recognition'};await finishJob();});}
function fieldHTML(id,field,value,type='text',readonly=false){const fid=id+'_'+field;return '<div class="field'+(type==='textarea'||field==='拍照图片'?' full':'')+'"><label for="'+fid+'">'+esc(fl(field))+'</label>'+(type==='textarea'?'<textarea id="'+fid+'" name="'+esc(field)+'">'+esc(value)+'</textarea>':'<input id="'+fid+'" name="'+esc(field)+'" type="'+type+'" value="'+esc(value)+'"'+(readonly?' readonly':'')+(type==='number'?' min="0" step="1"':'')+(type==='datetime-local'?' step="1"':'')+'>')+'</div>';}
function selectHTML(id,field,options,value,required=false){const fid=id+'_'+field;return '<div class="field"><label for="'+fid+'">'+esc(fl(field))+'</label><select id="'+fid+'" name="'+esc(field)+'"'+(required?' required':'')+'>'+options.map(o=>option(typeof o==='string'?o:o.value,typeof o==='string'?fl(o):o.label,value)).join('')+'</select></div>';}
function formActions(){return '<div class="form-actions"><button class="btn secondary" type="button" data-cancel>'+esc(tr('cancel'))+'</button><button class="btn" type="submit" data-write>'+esc(tr('save'))+'</button></div><p class="form-hint" role="status" data-form-status></p>';}
function dateInput(value){return String(value||'').replace(' ','T');}
function dateOutput(value){const v=value.replace('T',' ');return v.length===16?v+':00':v;}
async function editRecord(row){if(state.job||state.writing){toast(tr('busy'));return;}const root=modal(tr('editRecord')),body=root.querySelector('.dialog-body');body.textContent=tr('loading');const r=await cells(R_SOURCE,RF,row);if(!root.isConnected)return;state.currentRow=row;const id='recordForm'+modal.serial;body.innerHTML='<form id="'+id+'"><div class="form-grid">'+RF.map(f=>fieldHTML(id,f,f==='识别时间'?dateInput(r[f]):r[f],f==='识别时间'?'datetime-local':['中文释义','英文例句','例句翻译','记忆提示'].includes(f)?'textarea':'text',f==='拍照图片')).join('')+'</div><p class="form-hint">'+esc(tr('photoFieldHint'))+'</p><img class="form-preview" data-edit-preview alt="'+esc(fl('拍照图片'))+'"><div class="button-row"><button class="btn secondary small" type="button" data-photo="SelectImage" data-write>'+esc(tr('choosePhoto'))+'</button><button class="btn secondary small" type="button" data-photo="CapturePhoto" data-write>'+esc(tr('takePhoto'))+'</button></div>'+formActions()+'</form>';const form=$(id),image=body.querySelector('[data-edit-preview]');if(r['拍照图片'])image.src=download(r['拍照图片']);else image.hidden=true;form.querySelector('[data-cancel]').onclick=()=>closeModal(root);form.querySelectorAll('[data-photo]').forEach(btn=>btn.onclick=()=>guard(()=>write(async()=>{const file=textValue(await callAppBridge({type:btn.dataset.photo}));if(file){form.elements.namedItem('拍照图片').value=file;image.src=download(file);image.hidden=false;}})));form.onsubmit=e=>{e.preventDefault();guard(()=>write(async()=>{const values=new FormData(form);const status=form.querySelector('[data-form-status]');status.textContent=tr('loading');try{for(const f of RF)await setCell(R_SOURCE,row,f,f==='识别时间'?dateOutput(values.get(f)):values.get(f));closeModal(root);toast(tr('saved'));await reload();}catch(error){status.textContent=tr('error');throw error;}}));};updateBusy();}
async function bookForm(row=0,title=''){if(state.job||state.writing){toast(tr('busy'));return;}const root=modal(tr(row?'editBook':'addBook')),body=root.querySelector('.dialog-body');body.textContent=tr('loading');const b=row?await cells(B_SOURCE,BF,row):{'识别标题':title,'分类':'其他','掌握状态':'未学习','是否收藏':'否','加入时间':localDate(),'复习次数':'0','单词发音':''};const choices=await table(R_SOURCE,['识别标题','物体名称','英文单词']);if(!root.isConnected)return;state.currentRow=row;const id='bookForm'+modal.serial;const values=[{value:'',label:tr('chooseRecord')}];const seen=new Set();for(const r of choices){if(!r['识别标题']||seen.has(r['识别标题']))continue;seen.add(r['识别标题']);values.push({value:r['识别标题'],label:r['识别标题']+' · '+r['英文单词']});}if(b['识别标题']&&!seen.has(b['识别标题']))values.push({value:b['识别标题'],label:b['识别标题']});const titleHTML=title&&!row?fieldHTML(id,'识别标题',title,'text',true):selectHTML(id,'识别标题',values,b['识别标题'],true);body.innerHTML='<form id="'+id+'"><div class="form-grid">'+titleHTML+selectHTML(id,'分类',CATEGORIES,b['分类'])+selectHTML(id,'掌握状态',STATES,b['掌握状态'])+selectHTML(id,'是否收藏',['否','是'],b['是否收藏'])+fieldHTML(id,'加入时间',dateInput(b['加入时间']),'datetime-local')+fieldHTML(id,'复习次数',b['复习次数'],'number')+'</div><input id="'+id+'_audio" name="单词发音" type="hidden" value="'+esc(b['单词发音'])+'"><p class="form-hint">'+esc(tr('generatedAudio'))+'</p>'+formActions()+'</form>';const form=$(id);form.elements.namedItem('加入时间').required=true;form.elements.namedItem('复习次数').required=true;form.querySelector('[data-cancel]').onclick=()=>closeModal(root);form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;guard(()=>write(async()=>{const data=Object.fromEntries(new FormData(form));data['加入时间']=dateOutput(data['加入时间']);data['是否收藏']=data['是否收藏']==='是'?'是':'否';const status=form.querySelector('[data-form-status]');status.textContent=tr('loading');if(row){for(const f of BF)await setCell(B_SOURCE,row,f,data[f]);closeModal(root);toast(tr('saved'));await reload();}else{data['单词发音']='';await callAppBridge({type:'SubmitRecord',data:'单词本',payload:JSON.stringify(data)});state.currentRow=1;state.job={kind:'audio',modal:root};status.textContent=tr('waitAudio');await finishJob();}}));};updateBusy();}
function confirmDelete(source,row){if(state.job||state.writing){toast(tr('busy'));return;}const root=modal(tr('deleteTitle')),body=root.querySelector('.dialog-body');body.innerHTML='<p>'+esc(tr('confirmDelete'))+'</p><div class="form-actions"><button class="btn secondary" data-cancel>'+esc(tr('cancel'))+'</button><button class="btn danger" data-confirm data-write>'+esc(tr('delete'))+'</button></div>';body.querySelector('[data-cancel]').onclick=()=>closeModal(root);body.querySelector('[data-confirm]').onclick=()=>guard(()=>write(async()=>{await callAppBridge({type:'DeleteRecord',data:source,payload:row.toString()});state.currentRow=0;closeModal(root);toast(tr('deleted'));await reload();}));}
async function updateBook(row,operation){await write(async()=>{if(operation==='favorite'){const old=await callAppBridge({type:'GetCellValue',data:B_SOURCE,payload:'是否收藏/'+row});await setCell(B_SOURCE,row,'是否收藏',old==='是'?'否':'是');}else if(operation==='mastery'){const old=await callAppBridge({type:'GetCellValue',data:B_SOURCE,payload:'掌握状态/'+row});await setCell(B_SOURCE,row,'掌握状态',STATES[(STATES.indexOf(old)+1)%STATES.length]);}else{const count=await callAppBridge({type:'GetCellValue',data:B_SOURCE,payload:'复习次数/'+row}),old=await callAppBridge({type:'GetCellValue',data:B_SOURCE,payload:'掌握状态/'+row});await setCell(B_SOURCE,row,'复习次数',Math.max(0,parseInt(count,10)||0)+1);const status=operation==='know'?'已掌握':operation==='practice'?'学习中':old==='未学习'?'学习中':old;if(status!==old)await setCell(B_SOURCE,row,'掌握状态',status);if(operation==='know'||operation==='practice'){state.reviewIndex++;state.reviewShown=false;}}await reload();});}
async function dispatch(actionName,row,target){if(actionName==='detailR')return detailRecord(row);if(actionName==='editR')return editRecord(row);if(actionName==='deleteR')return confirmDelete(R_SOURCE,row);if(actionName==='addR'){const title=await callAppBridge({type:'GetCellValue',data:R_SOURCE,payload:'识别标题/'+row});return bookForm(0,title);}if(actionName==='detailB')return detailBook(row);if(actionName==='editB')return bookForm(row);if(actionName==='deleteB')return confirmDelete(B_SOURCE,row);if(actionName==='play')return playAudio(row);if(actionName==='flip'){const card=target.closest('.book-card');card.classList.toggle('flipped');target.setAttribute('aria-pressed',String(card.classList.contains('flipped')));return;}if(actionName==='reveal'){state.reviewShown=true;renderReview();return;}if(actionName==='next'){state.reviewIndex++;state.reviewShown=false;renderReview();return;}if(['favorite','mastery','reviewOnce','know','practice'].includes(actionName))return updateBook(row,actionName);}
function keyboardVisibility(){const vv=window.visualViewport;const gap=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0;document.documentElement.style.setProperty('--keyboard',gap+'px');const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100);}
async function initialize(){state.lang=getLanguage();translate();$('brandButton').onclick=()=>{try{if(typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);}catch(e){showError(e);}};$('menuButton').onclick=()=>{const show=$('mobileMenu').hidden;$('mobileMenu').hidden=!show;$('menuButton').setAttribute('aria-expanded',String(show));};$('languageButton').onclick=toggleLanguage;
document.addEventListener('click',e=>{const lang=e.target.closest('[data-language]');if(lang){toggleLanguage();return;}const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return;}if(!$('navigation').contains(e.target))closeMenu();const btn=e.target.closest('[data-action]');if(btn){guard(()=>dispatch(btn.dataset.action,Number(btn.dataset.row),btn));return;}const record=e.target.closest('[data-edit-row]');if(record&&!e.target.closest('button,a'))guard(()=>editRecord(Number(record.dataset.editRow)));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modals.length){e.preventDefault();closeModal(state.modals.at(-1));}else closeMenu();}const top=state.modals.at(-1);if(top&&e.key==='Tab'){const elements=Array.from(top.querySelectorAll('button,input,select,textarea,a[href],audio[controls],[tabindex="0"]')).filter(el=>!el.disabled&&el.type!=='hidden'&&el.getClientRects().length);if(!elements.length)return;const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-edit-row]')){e.preventDefault();guard(()=>editRecord(Number(e.target.dataset.editRow)));}});
$('capturePhoto').onclick=()=>guard(()=>choosePhoto('CapturePhoto'));$('selectPhoto').onclick=()=>guard(()=>choosePhoto('SelectImage'));$('captureForm').onsubmit=e=>{e.preventDefault();guard(recognize);};$('resetCapture').onclick=resetCapture;$('addResult').onclick=()=>guard(()=>bookForm(0,state.result?.['识别标题']||''));$('addFromRecords').onclick=()=>guard(()=>bookForm());$('resumeJob').onclick=()=>guard(finishJob);$('reloadButton').onclick=()=>guard(reload);$('moreRecords').onclick=()=>{state.limitR+=12;renderRecords();};$('moreBook').onclick=()=>{state.limitB+=12;renderBook();};['recordSearch','partFilter','dateFrom','dateTo'].forEach(id=>$(id).addEventListener('input',()=>{state.limitR=12;renderRecords();}));['bookSearch','categoryFilter','masteryFilter','favoriteFilter'].forEach(id=>$(id).addEventListener('input',()=>{state.limitB=12;state.reviewIndex=0;state.reviewShown=false;renderBook();renderReview();}));$('reviewScope').onchange=()=>{state.reviewIndex=0;state.reviewShown=false;renderReview();};$('closeAudio').onclick=()=>{$('globalAudio').pause();$('audioDock').hidden=true;};$('globalAudio').onerror=()=>toast(tr('audioError'));document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))keyboardVisibility();});window.addEventListener('resize',scheduleNav);window.visualViewport?.addEventListener('resize',keyboardVisibility);document.fonts?.ready.then(scheduleNav);
const theme=callAppBridge({type:'模式'}).then(mode=>{document.documentElement.dataset.theme=textValue(mode)==='暗色'?'dark':'light';}).catch(()=>{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';});await Promise.allSettled([theme,reload()]);}
