<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {

    container.style.cssText = `

      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

let lang='cn',theme='light',currentPage='home',currentRow=0,seedRows=[],taskRows=[],pollState=null,toastTimer=0,modalKind='',modalRow=0,modalDataset='',historyStack=[],loading=false;
const $=id=>document.getElementById(id);const tr=key=>translations[lang][key]||key;const displayType=v=>lang==='en'?(typeEn[v]||v):v;const displayField=v=>lang==='en'?(fieldEn[v]||v):v;

function friendlyDate(v){if(!v)return '';const m=String(v).match(/^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d):(\d\d))?/);if(!m)return String(v);return lang==='cn'?`${m[1]}年${Number(m[2])}月${Number(m[3])}日${m[4]?` ${m[4]}:${m[5]}`:''}`:`${m[1]}-${m[2]}-${m[3]}${m[4]?` ${m[4]}:${m[5]}`:''}`}

function makeMarkdownLinksDownload(root){root.querySelectorAll('img').forEach(img=>{img.title=tr('export');img.addEventListener('click',()=>{const a=document.createElement('a');a.href=img.currentSrc||img.src;a.download='';a.target='_blank';a.rel='noopener';a.click()})});root.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'})}

function csvObjects(csv,fields){return parseCSV(String(csv||'')).filter(row=>row.some(cell=>cell!=='' )).map((row,i)=>{const out={_row:i+1};fields.forEach((field,j)=>out[field]=row[j]??'');return out})}
function dateKey(value){const ms=Date.parse(String(value||'').replace(' ','T'));return Number.isFinite(ms)?ms:0}
async function getCell(source,field,row){return await callAppBridge({type:'GetCellValue',data:source,payload:`${field}/${row}`})}
async function loadData(){if(loading)return;loading=true;clearError();try{const [seedCsv,taskCsv,seedCount,taskCount]=await Promise.all([callAppBridge({type:'GetTableCSV',data:SEED_SOURCE,payload:SEED_FIELDS.join(',')}),callAppBridge({type:'GetTableCSV',data:TASK_SOURCE,payload:TASK_FIELDS.join(',')}),callAppBridge({type:'GetRecordCount',data:SEED_SOURCE}),callAppBridge({type:'GetRecordCount',data:TASK_SOURCE})]);seedRows=csvObjects(seedCsv,SEED_FIELDS);taskRows=csvObjects(taskCsv,TASK_FIELDS);renderAll(seedCount,taskCount)}catch(e){showError(e);renderAll()}finally{loading=false}}
function sortedSeeds(){return [...seedRows].sort((a,b)=>dateKey(b['记录时间'])-dateKey(a['记录时间']))}

function statCard(icon,value,label){return `<div class="stat"><i class="fa-solid ${icon}"></i><strong>${escapeHtml(value)}</strong><small>${escapeHtml(label)}</small></div>`}
function renderStats(seedCount,taskCount){const today=new Date(),start=new Date(today.getFullYear(),today.getMonth(),today.getDate());start.setDate(start.getDate()-(start.getDay()+6)%7);const weekly=seedRows.filter(x=>dateKey(x['记录时间'])>=start.getTime()).length;const counts={};seedRows.forEach(x=>{if(x['类型'])counts[x['类型']]=(counts[x['类型']]||0)+1});const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||tr('none');$('stats').innerHTML=statCard('fa-seedling',Number(seedCount)||seedRows.length,tr('totalSeeds'))+statCard('fa-calendar-week',weekly,tr('weekSeeds'))+statCard('fa-face-smile',displayType(top),tr('topType'))+statCard('fa-book-open',Number(taskCount)||taskRows.length,tr('storyCount'))}

function taskCard(item,home=false){const row=item._row,summary=String(item['生成结果']||'').slice(0,home?100:120);return `<article class="item-card" role="button" tabindex="0" data-open="task" data-row="${row}"><div class="card-top"><span class="badge"><i class="fa-solid fa-sparkles"></i> ${escapeHtml(displayType(item['生成类型']))}</span></div><h3>${escapeHtml(item['任务标题']||tr('untitled'))}</h3><p class="muted">${escapeHtml(friendlyDate(item['开始日期']))} – ${escapeHtml(friendlyDate(item['结束日期']))}</p><div class="card-content markdown-body">${summary?markdown(summary):`<span class="muted">${tr('pending')}</span>`}</div>${home?'':`<div class="actions"><button type="button" data-action="view-task" data-row="${row}"><i class="fa-solid fa-book-open"></i> ${tr('read')}</button><button type="button" data-action="edit-task" data-row="${row}"><i class="fa-solid fa-pen"></i> ${tr('edit')}</button><button type="button" data-action="delete-task" data-row="${row}"><i class="fa-solid fa-trash"></i> ${tr('delete')}</button><button type="button" data-action="regen-task" data-row="${row}"><i class="fa-solid fa-rotate"></i> ${tr('regenerate')}</button></div>`}</article>`}
function renderAll(seedCount,taskCount){renderStats(seedCount,taskCount);$('homeSeeds').innerHTML=sortedSeeds().slice(0,6).map(x=>seedCard(x,true)).join('')||emptyHtml();$('homeTasks').innerHTML=sortedTasks().slice(0,3).map(x=>taskCard(x,true)).join('')||emptyHtml();renderSeedCards();renderTaskCards();document.querySelectorAll('.markdown-body').forEach(makeMarkdownLinksDownload)}
function renderFilterOptions(){const seedType=$('seedType'),taskType=$('taskType');const oldSeed=seedType.value,oldTask=taskType.value;seedType.innerHTML=`<option value="">${tr('all')}</option>`+SEED_TYPES.map(x=>`<option value="${x}">${displayType(x)}</option>`).join('');taskType.innerHTML=`<option value="">${tr('all')}</option>`+TASK_TYPES.map(x=>`<option value="${x}">${displayType(x)}</option>`).join('');seedType.value=oldSeed;taskType.value=oldTask;const checked=new Set([...$('seedMoodFilter').querySelectorAll('input:checked')].map(x=>x.value));$('seedMoodFilter').innerHTML=MOODS.map(x=>`<label class="choice"><input type="checkbox" value="${x}" ${checked.has(x)?'checked':''}>${escapeHtml(displayType(x))}</label>`).join('')}

function formField(formId,name,input){return `<div class="field ${name==='内容'?'full':''}"><label for="${formId}_${name}">${escapeHtml(displayField(name))}</label>${input}</div>`}

async function submitTask(event){event.preventDefault();if(pollState)return;const form=event.currentTarget,row=modalRow,button=form.querySelector('[type=submit]');const values={'任务标题':$('taskForm_任务标题').value.trim()||suggestedTitle(),'开始日期':$('taskForm_开始日期').value,'结束日期':$('taskForm_结束日期').value,'生成类型':$('taskForm_生成类型').value};if(!values['开始日期']||!values['结束日期']||values['开始日期']>values['结束日期']){showToast(tr('needDates'));return}button.disabled=true;try{if(row){for(const field of TASK_FIELDS.slice(0,4))await callAppBridge({type:'SetCellValue',data:TASK_SOURCE,payload:`${field}/${row}/${values[field]}`});closeDialog();showToast(tr('saved'));await loadData()}else{await callAppBridge({type:'SubmitRecord',data:'生成任务',payload:JSON.stringify(values)});currentRow=1;closeDialog();navigate('tasks');await loadData();startPolling(1,values)}}catch(e){showToast(`${tr('failed')}: ${e.message||e}`)}finally{button.disabled=false}}
function detailField(label,value,full=false){return `<div class="detail-field ${full?'full':''}"><span>${escapeHtml(displayField(label))}</span><strong>${escapeHtml(value||'—')}</strong></div>`}
async function viewSeed(row){currentRow=row;openDialog(tr('details'),`<div class="waiting"><span class="spinner"></span>${tr('loading')}</div>`,'detail',row,SEED_SOURCE);try{const data={};for(const field of SEED_FIELDS){data[field]=await getCell(SEED_SOURCE,field,row);if(modalKind!=='detail'||modalRow!==row)return}const html=`<div class="detail-grid">${detailField('类型',displayType(data['类型']))}${detailField('情绪',data['情绪'].split(/[,，]/).map(displayType).join(', '))}${detailField('记录时间',friendlyDate(data['记录时间']))}${detailField('地点',data['地点'])}${detailField('标签',data['标签'],true)}</div><h3>${escapeHtml(displayField('内容'))}</h3><div class="markdown-body">${markdown(data['内容'])}</div><div class="form-actions"><button type="button" class="primary" data-action="edit-seed" data-row="${row}"><i class="fa-solid fa-pen"></i>${tr('edit')}</button></div>`;$('dialogBody').innerHTML=html;makeMarkdownLinksDownload($('dialogBody'))}catch(e){$('dialogBody').textContent=`${tr('failed')}: ${e.message||e}`}}
async function countSeedsInRange(start,end){return seedRows.filter(x=>String(x['记录时间']).slice(0,10)>=start&&String(x['记录时间']).slice(0,10)<=end).length}
function resultHtml(data){const content=data['生成结果']||'';const number=seedRows.filter(x=>String(x['记录时间']).slice(0,10)>=data['开始日期']&&String(x['记录时间']).slice(0,10)<=data['结束日期']).length;return `<h2>${escapeHtml(data['任务标题']||tr('untitled'))} · ${escapeHtml(displayType(data['生成类型']))}</h2>${content&&content!=='生成中'?`<div class="markdown-body">${markdown(content)}</div>`:`<div class="waiting"><span class="spinner"></span>${tr('extracting')}</div>`}<div class="card-meta"><span>${escapeHtml(tr('range'))}: ${escapeHtml(friendlyDate(data['开始日期']))} – ${escapeHtml(friendlyDate(data['结束日期']))}</span><span>${escapeHtml(tr('basedOn').replace('{n}',number))}</span></div>`}
function showResultPanel(data){$('resultPanel').hidden=false;$('resultPanel').innerHTML=resultHtml(data);makeMarkdownLinksDownload($('resultPanel'))}
async function viewTask(row){currentRow=row;openDialog(tr('read'),`<div class="waiting"><span class="spinner"></span>${tr('loading')}</div>`,'reader',row,TASK_SOURCE);try{const data={};for(const field of TASK_FIELDS){data[field]=await getCell(TASK_SOURCE,field,row);if(modalKind!=='reader'||modalRow!==row)return}const html=`<div class="reader-tools"><button type="button" class="soft-button" data-action="copy-task" data-row="${row}"><i class="fa-solid fa-copy"></i>${tr('copy')}</button><button type="button" class="soft-button" data-action="export-task" data-row="${row}"><i class="fa-solid fa-download"></i>${tr('export')}</button><button type="button" class="soft-button" data-action="edit-task" data-row="${row}"><i class="fa-solid fa-pen"></i>${tr('edit')}</button></div>${resultHtml(data)}`;$('dialogBody').innerHTML=html;makeMarkdownLinksDownload($('dialogBody'));showResultPanel(data)}catch(e){$('dialogBody').textContent=`${tr('failed')}: ${e.message||e}`}}
async function deleteRecord(kind,row){if(!confirm(tr('confirmDelete')))return;const source=kind==='seed'?SEED_SOURCE:TASK_SOURCE;try{await callAppBridge({type:'DeleteRecord',data:source,payload:row.toString()});if(kind==='task')$('resultPanel').hidden=true;showToast(tr('deleted'));await loadData()}catch(e){showToast(`${tr('failed')}: ${e.message||e}`)}}
async function regenerate(row){if(pollState||!confirm(tr('confirmRegenerate')))return;try{const values={};for(const field of TASK_FIELDS.slice(0,4))values[field]=await getCell(TASK_SOURCE,field,row);await callAppBridge({type:'SetCellValue',data:TASK_SOURCE,payload:`生成结果/${row}/`});await callAppBridge({type:'SubmitRecord',data:'生成任务',payload:JSON.stringify(values)});currentRow=1;await loadData();startPolling(1,values)}catch(e){showToast(`${tr('failed')}: ${e.message||e}`)}}
function startPolling(row,values){if(pollState)return;const deadline=Date.now()+1800000;pollState={row,deadline,values};openDialog(tr('tasks'),`<div class="waiting"><span class="spinner"></span>${tr('waiting')}</div>`,'waiting',row,TASK_SOURCE);showResultPanel({...values,'生成结果':''});pollOnce()}
async function pollOnce(){const state=pollState;if(!state)return;try{const result=await getCell(TASK_SOURCE,'生成结果',state.row);if(pollState!==state)return;if(result&&String(result).trim()&&String(result).trim()!=='生成中'){pollState=null;closeDialog();showResultPanel({...state.values,'生成结果':result});await loadData();$('resultPanel').scrollIntoView({behavior:'smooth',block:'start'});return}}catch(e){if(Date.now()>=state.deadline)showToast(`${tr('failed')}: ${e.message||e}`)}if(Date.now()>=state.deadline){pollState=null;closeDialog();showToast(tr('pollTimeout'));await loadData();return}setTimeout(pollOnce,1000)}
async function copyTask(row){try{const text=await getCell(TASK_SOURCE,'生成结果',row);await navigator.clipboard.writeText(text);showToast(tr('copied'))}catch(e){showToast(`${tr('failed')}: ${e.message||e}`)}}
async function exportTask(row){try{const title=await getCell(TASK_SOURCE,'任务标题',row),body=await getCell(TASK_SOURCE,'生成结果',row);const safe=String(title||'memory').replace(/[\\/:*?"<>|]/g,'_').slice(0,70);const filename=`${safe}-${Date.now()}.md`;await callAppBridge({type:'WriteFile',data:filename,payload:body});const a=document.createElement('a');a.href=`https://www.ithinkair.com:3031/download/${encodeURIComponent(filename)}`;a.download=filename;a.rel='noopener';a.click()}catch(e){showToast(`${tr('failed')}: ${e.message||e}`)}}
function handleKeyboard(event){const target=event.target;if(!target.matches('input,textarea,select'))return;setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}),250)}
async function initialize(){lang=getLanguage();try{const mode=await callAppBridge({type:'模式'});theme=String(mode).trim()==='暗色'?'dark':'light'}catch(e){theme=window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=theme;setLanguage(lang);updateNav();new ResizeObserver(updateNav).observe($('topbar').querySelector('.nav-inner'));await loadData()}
document.addEventListener('click',async event=>{const pageButton=event.target.closest('[data-page]');if(pageButton){navigate(pageButton.dataset.page);return}const action=event.target.closest('[data-action]');if(action){event.stopPropagation();const row=Number(action.dataset.row);switch(action.dataset.action){case 'close':closeDialog();break;case 'edit-seed':await openSeedForm(row);break;case 'delete-seed':await deleteRecord('seed',row);break;case 'view-seed':await viewSeed(row);break;case 'view-task':await viewTask(row);break;case 'edit-task':await openTaskForm(row);break;case 'delete-task':await deleteRecord('task',row);break;case 'regen-task':await regenerate(row);break;case 'copy-task':await copyTask(row);break;case 'export-task':await exportTask(row);break}return}const card=event.target.closest('[data-open]');if(card){if(card.dataset.open==='seed')await viewSeed(Number(card.dataset.row));else await viewTask(Number(card.dataset.row));return}if(!event.target.closest('#topbar'))closeMenu()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if($('overlay').classList.contains('open'))closeDialog();else closeMenu()}if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-open]')){event.preventDefault();event.target.click()}});
document.addEventListener('focusin',handleKeyboard);
$('overlay').addEventListener('click',event=>{if(event.target===$('overlay'))closeDialog()});$('dialogClose').addEventListener('click',closeDialog);
$('menuButton').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))});$('desktopLang').addEventListener('click',switchLanguage);$('mobileLang').addEventListener('click',switchLanguage);
$('brand').addEventListener('click',()=>{try{parent.closeFullHtml(false)}catch(e){navigate('home')}});$('quickAdd').addEventListener('click',()=>{navigate('seeds');openSeedForm()});$('addSeed').addEventListener('click',()=>openSeedForm());$('addTask').addEventListener('click',()=>openTaskForm());
for(const id of ['seedSearch','seedType','seedFrom','seedTo'])$(id).addEventListener('input',renderSeedCards);$('seedMoodFilter').addEventListener('change',renderSeedCards);for(const id of ['taskSearch','taskType','taskFrom','taskTo'])$(id).addEventListener('input',renderTaskCards);
$('dialogBody').addEventListener('submit',event=>{if(event.target.id==='seedForm')submitSeed(event);if(event.target.id==='taskForm')submitTask(event)});$('dialogBody').addEventListener('input',event=>{if(['taskForm_生成类型','taskForm_开始日期','taskForm_结束日期'].includes(event.target.id))updateSuggestedTitle();if(event.target.id==='taskForm_任务标题')event.target.dataset.custom='true'});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const focused=document.activeElement;if(focused?.matches('input,textarea,select'))setTimeout(()=>focused.scrollIntoView({behavior:'smooth',block:'center'}),100)});
document.addEventListener('DOMContentLoaded',()=>{(async () => {    await initialize();  })();});
</script>
</body>
</html>
