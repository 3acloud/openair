<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("f702f90ff5a864b5_读书笔记整理")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端

      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function translate(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.title=t('app');document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));$('language').textContent=lang==='en'?'中文':'EN';$('mobileLanguage').textContent=lang==='en'?'切换中文':'Switch to English';$('hamburger').ariaLabel=lang==='en'?'Navigation menu':'导航菜单';$('search').ariaLabel=t('search');$('genreFilter').ariaLabel=t('体裁');$('purposeFilter').ariaLabel=t('整理用途');let g=$('genreFilter').value,p=$('purposeFilter').value;$('genreFilter').innerHTML=options(GENRES,'allGenres');$('purposeFilter').innerHTML=options(PURPOSES,'allPurposes');$('genreFilter').value=g;$('purposeFilter').value=p;buildForms();renderCards();renderStats();renderResult();updateControls();requestAnimationFrame(measureNav)}

async function renderMarkdown(target,source){target.className='markdown';if(!window.marked||!window.DOMPurify){target.textContent=t('markdownMissing')+'\n\n'+source;return}target.innerHTML=DOMPurify.sanitize(marked.parse(source,{gfm:true,breaks:false}));target.querySelectorAll('table').forEach(table=>{const wrapper=document.createElement('div');wrapper.className='table-scroll';table.replaceWith(wrapper);wrapper.append(table)});target.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';const file=raw.startsWith('http://' + window.location.hostname + ':3130/download/')?decodeURIComponent(raw.split('/download/')[1]):raw;const href=/^https?:\/\//i.test(raw)?raw:'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(file);if(!/^https?:\/\//i.test(raw))img.src=href;const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener noreferrer';img.replaceWith(a);a.append(img)});target.querySelectorAll('a').forEach(a=>{a.rel='noopener noreferrer';a.target='_blank'});if(window.mermaid){const nodes=[];target.querySelectorAll('code.language-mermaid').forEach(code=>{const div=document.createElement('div');div.className='mermaid';div.textContent=code.textContent;code.parentNode.replaceWith(div);nodes.push(div)});if(nodes.length)try{await mermaid.run({nodes,suppressErrors:true})}catch{} }}
function renderResult(){const el=$('result');el.className='';if(resultStatus==='waiting')el.innerHTML='<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><p>'+esc(t('waiting'))+'</p></div>';else if(resultStatus==='timeout')el.innerHTML=emptyMarkup('timeout');else if(resultText)renderMarkdown(el,resultText).catch(error);else el.innerHTML=emptyMarkup(currentRow?'noResult':'emptyResult')}
let statsData=null;
function renderStats(){const counts=statsData||[null,null,null,null,null,null];$('stats').innerHTML=['total',...GENRES.slice(0,3)].map((label,i)=>'<div class="stat"><i class="fa-solid '+['fa-layer-group','fa-seedling','fa-feather','fa-graduation-cap'][i]+'"></i><span class="meta">'+esc(t(label))+'</span><strong>'+ (counts[i]??'—')+'</strong></div>').join('');$('usages').innerHTML=['citation','revision'].map((k,i)=>'<div class="usage"><span>'+esc(t(k))+'</span><strong>'+(counts[i+4]??'—')+'</strong></div>').join('')}
function card(record,recent){const v=record.values;const color=['#1f5947','#813d4b','#404e82','#8d8171'][Math.max(0,GENRES.indexOf(v[2]))];return '<article class="note" tabindex="0" role="button" data-row="'+record.row+'" style="--spine:'+color+'" aria-label="'+esc(t('detail')+' '+(v[0]||t('untitled')))+'"><span class="badge">'+esc(t(v[3]||PURPOSES[4]))+'</span><h3>'+esc(v[0]||t('untitled'))+'</h3><div class="meta">'+esc(t(v[2]||GENRES[3]))+' · '+esc(v[4]||t(recent?'rangeAll':'rangeExcerpt'))+'</div><p class="excerpt">'+esc(Array.from(record.summary||'').slice(0,recent?80:100).join(''))+((record.summary||'').length>(recent?80:100)?'…':'')+'</p>'+(recent?'':'<div class="actions">'+['detail','edit','remove','redo'].map(a=>'<button data-action="'+a+'" data-row="'+record.row+'">'+esc(t(a))+'</button>').join('')+'</div>')+'</article>'}
function renderCards(){$('recentCards').innerHTML=rows.length?rows.slice(0,5).map(r=>card(r,true)).join(''):emptyMarkup('emptyShelf',true);const query=$('search').value.trim().toLocaleLowerCase(),g=$('genreFilter').value,p=$('purposeFilter').value;const filtered=rows.filter(r=>(!g||r.values[2]===g)&&(!p||r.values[3]===p)&&(!query||[r.values[0],r.values[1],r.values[4]].some(s=>String(s||'').toLocaleLowerCase().includes(query))));$('shelfCount').textContent=filtered.length+' '+t('records');$('shelfCards').innerHTML=filtered.length?filtered.map(r=>card(r,false)).join(''):emptyMarkup(rows.length?'noMatch':'emptyShelf',!rows.length)}
async function refresh(){const version=++refreshVersion;const results=await Promise.all([api('GetRecordCount'),api('GetTableCSV',SOURCE,'体裁'),api('GetTableCSV',SOURCE,'整理用途'),api('GetTableCSV',SOURCE,FIELDS.join(','))]);const count=Number(results[0]);if(!Number.isInteger(count)||count<0)throw new Error('Invalid record count');const genres=parseCSV(results[1]),purposes=parseCSV(results[2]);const loaded=parseCSV(results[3]).map((values,index)=>({values,row:index+1,summary:''}));let cursor=0;async function worker(){while(cursor<loaded.length){const item=loaded[cursor++];item.summary=String(await api('GetCellValue',SOURCE,'书籍内容/'+item.row))}}await Promise.all(Array.from({length:Math.min(6,loaded.length)},()=>worker()));if(version!==refreshVersion)return;recordCount=count;rows=loaded;statsData=[count,...GENRES.slice(0,3).map(g=>genres.filter(r=>r[0]===g).length),...['论文引用','考试复习'].map(p=>purposes.filter(r=>r[0]===p).length)];renderStats();renderCards();updateControls()}
async function readRecord(row){const value={};for(const field of ALL)value[field]=String(await api('GetCellValue',SOURCE,field+'/'+row));return value}
async function loadRecord(row){if(busy||loadingRecord)return;loadingRecord=true;updateControls();try{const count=Number(await api('GetRecordCount'));if(row<1||row>count)return;const value=await readRecord(row);recordCount=count;currentRow=row;fill('createForm',value);resultText=value['结构化笔记'];resultStatus='ready';renderResult()}finally{loadingRecord=false;updateControls()}}
function openModal(title,reader=false){const overlay=document.createElement('div');overlay.className='overlay'+(reader?' reader':'');overlay.innerHTML='<section class="modal" role="dialog" aria-modal="true" tabindex="-1"><div class="modal-heading"><h2></h2><button class="modal-close" aria-label="'+esc(t('close'))+'">×</button></div><div class="modal-body"></div></section>';overlay.querySelector('h2').textContent=title;const previous=document.activeElement;const entry={overlay,previous,locked:false};modals.push(entry);$('dialogs').append(overlay);document.body.style.overflow='hidden';overlay.querySelector('.modal-close').onclick=()=>closeModal();overlay.addEventListener('click',e=>{if(e.target===overlay&&modals.at(-1)===entry)closeModal()});overlay.querySelector('.modal').focus();return entry}
function closeModal(){const entry=modals.at(-1);if(!entry||entry.locked)return;modals.pop();entry.overlay.remove();document.body.style.overflow=modals.length?'hidden':'';entry.previous?.focus()}
window.airBack=function(){if(modals.length){closeModal();return 'false'}if(!$('mobileMenu').hidden){closeMenu();return 'false'}if(historyStack.length){const prev=historyStack.pop();navigate(prev.page,false,prev.scroll);return 'false'}return 'true'};
async function details(row){const entry=openModal(t('loading'),true);try{const v=await readRecord(row);if(!entry.overlay.isConnected)return;if(!busy)currentRow=row;entry.row=row;entry.overlay.querySelector('h2').textContent=v[FIELDS[0]]||t('untitled');const body=entry.overlay.querySelector('.modal-body');body.innerHTML='<p class="muted">'+esc(t(v['体裁']))+' · '+esc(t(v['整理用途']))+' · '+esc(v['章节范围']||t('rangeAll'))+'</p><details><summary>'+esc(t('source'))+'</summary><pre class="source"></pre></details><h2>'+esc(t('result'))+'</h2><div class="detail-markdown"></div><div class="actions">'+['edit','remove','close'].map(a=>'<button data-detail-action="'+a+'">'+esc(t(a))+'</button>').join('')+'</div>';body.querySelector('.source').textContent=v['书籍内容'];const md=body.querySelector('.detail-markdown');if(v['结构化笔记'])await renderMarkdown(md,v['结构化笔记']);else md.textContent=t('noResult');body.addEventListener('click',e=>{const action=e.target.closest('[data-detail-action]')?.dataset.detailAction;if(action==='close')closeModal();if(action==='edit')editRecord(row);if(action==='remove')deleteRecord(row)});updateControls()}catch(e){closeModal();error(e)}}
async function editRecord(row){if(busy){announce(t('busy'));return}const entry=openModal(t('editTitle'));entry.row=row;const body=entry.overlay.querySelector('.modal-body');body.textContent=t('loading');try{const values=await readRecord(row);if(!entry.overlay.isConnected)return;currentRow=row;body.innerHTML='<p class="muted">'+esc(t('editHint'))+'</p><form id="editForm">'+formMarkup('editForm')+'<div class="form-actions"><button type="submit" class="primary">'+esc(t('save'))+'</button><button type="button" id="editCancel">'+esc(t('cancel'))+'</button></div></form>';fill('editForm',values);$('editCancel').onclick=closeModal;$('editForm').onsubmit=async e=>{e.preventDefault();const value=formValue('editForm');if(!value['书籍内容'].trim())return;entry.locked=true;body.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=true);try{for(const field of FIELDS)await api('SetCellValue',SOURCE,field+'/'+row+'/'+value[field]);entry.locked=false;closeModal();while(modals.length)closeModal();await refresh();if(currentRow===row){fill('createForm',value);resultText=String(await api('GetCellValue',SOURCE,'结构化笔记/'+row));resultStatus='ready';renderResult()}announce(t('saved'));await details(row)}catch(e){entry.locked=false;body.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=false);announce(t('partial')+' '+(e.message||e))}}}catch(e){closeModal();error(e)}}
async function deleteRecord(row){if(busy){announce(t('busy'));return}const entry=openModal(t('remove'));const body=entry.overlay.querySelector('.modal-body');body.innerHTML='<p>'+esc(t('confirmDelete'))+'</p><div class="form-actions"><button class="primary" id="confirmDelete">'+esc(t('remove'))+'</button><button id="cancelDelete">'+esc(t('cancel'))+'</button></div>';$('cancelDelete').onclick=closeModal;$('confirmDelete').onclick=async()=>{entry.locked=true;$('confirmDelete').disabled=true;try{await api('DeleteRecord',SOURCE,row.toString());entry.locked=false;while(modals.length)closeModal();resetForm();await refresh();announce(t('deleted'))}catch(e){entry.locked=false;$('confirmDelete').disabled=false;error(e)}}}
async function redo(row){if(busy){announce(t('busy'));return}const v=await readRecord(row);resetForm();fill('createForm',v);updateControls();navigate('organize')}
async function submit(e){e.preventDefault();if(busy||!$('createForm_1').value.trim())return;const data=formValue('createForm');busy=true;updateControls();try{await api('SubmitRecord','读书笔记',JSON.stringify(data));currentRow=1;resultText='';resultStatus='waiting';renderResult();updateControls();refresh().catch(error);const deadline=Date.now()+1800000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));const remaining=deadline-Date.now();if(remaining<=0)break;let timer;let text;try{text=String(await Promise.race([api('GetCellValue',SOURCE,'结构化笔记/'+currentRow),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(t('timeout'))),remaining)})]))}finally{clearTimeout(timer)}if(text.trim()){resultText=text;resultStatus='ready';renderResult();await refresh();return}}resultStatus='timeout';renderResult()}catch(e){resultStatus='ready';renderResult();error(e)}finally{busy=false;updateControls()}}
async function initialize(){lang=initialLanguage();translate();navigate('home',false);document.querySelectorAll('[data-page="home"]').forEach(b=>b.classList.add('active'));$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){error(e)}};const switchLanguage=()=>{lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch{}closeMenu();translate()};$('language').onclick=switchLanguage;$('mobileLanguage').onclick=switchLanguage;$('hamburger').onclick=()=>{$('mobileMenu').hidden=!$('mobileMenu').hidden;$('hamburger').setAttribute('aria-expanded',String(!$('mobileMenu').hidden))};document.addEventListener('click',e=>{if(!$('nav').contains(e.target))closeMenu();const pageButton=e.target.closest('[data-page]');if(pageButton)navigate(pageButton.dataset.page);if(e.target.closest('[data-new]'))newNote();const action=e.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);({detail:details,edit:editRecord,remove:deleteRecord,redo})[action.dataset.action](row).catch(error);return}const card=e.target.closest('.note[data-row]');if(card)details(Number(card.dataset.row)).catch(error)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modals.length)closeModal();else closeMenu()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.note')){e.preventDefault();details(Number(e.target.dataset.row)).catch(error)}if(e.key==='Tab'&&modals.length){const overlay=modals.at(-1).overlay;const focusable=[...overlay.querySelectorAll('button,input,textarea,select,a[href],summary,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||!focusable.includes(document.activeElement))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});$('createForm').onsubmit=submit;$('createForm').addEventListener('input',updateControls);$('clear').onclick=resetForm;$('previous').onclick=()=>loadRecord(currentRow-1).catch(error);$('next').onclick=()=>loadRecord(currentRow+1).catch(error);$('search').oninput=renderCards;$('genreFilter').onchange=renderCards;$('purposeFilter').onchange=renderCards;window.addEventListener('resize',measureNav);
const revealInput=()=>{const active=document.activeElement;if(!active?.matches('input,textarea,select'))return;const keyboard=window.visualViewport?Math.max(0,window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop):0;const container=active.closest('.modal')||document.querySelector('main');container.style.paddingBottom=Math.max(window.innerWidth<600?160:40,keyboard+80)+'px';setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)};document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(revealInput,250)});window.visualViewport?.addEventListener('resize',revealInput);
try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light'}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}if(window.mermaid)mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:document.documentElement.dataset.theme==='dark'?'dark':'neutral'});try{await refresh()}catch(e){error(e);for(const id of ['recentCards','shelfCards'])$(id).innerHTML='<div class="empty"><p>'+esc(t('failed'))+'</p><button class="reload">'+esc(t('retry'))+'</button></div>';document.querySelectorAll('.reload').forEach(b=>b.onclick=()=>refresh().catch(error))}}
