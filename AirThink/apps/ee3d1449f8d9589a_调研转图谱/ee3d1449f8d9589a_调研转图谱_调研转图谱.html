<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    `;
    
    // 创建拍照按钮

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

async function showDetail(row,refresh=false){if(!row)return;detailRow=row;currentRow=row;$('detailOverlay').classList.remove('hidden');$('detailTitle').textContent=t('loading');$('detailContent').innerHTML='<p>'+esc(t('loading'))+'</p>';try{const r=await getRecord(row);if(detailRow!==row||$('detailOverlay').classList.contains('hidden'))return;const file=r['图谱文件'];$('detailTitle').textContent=r['研究主题']||'—';let cells=EDITABLE.map(f=>'<div class="detail-cell"><span>'+esc(t(({研究主题:'topic',可视化工具:'tool',布局方向:'layout',调研深度:'depth',附参考资料:'refs'})[f]))+'</span><strong>'+esc(r[f]||'—')+'</strong></div>').join('');$('detailContent').innerHTML='<div class="detail-grid">'+cells+'</div><div class="detail-cell"><span>'+esc(t('file'))+'</span><strong>'+esc(validFile(file)?t('ready'):t('missing'))+'</strong></div>'+(validFile(file)?'<div class="drawer-actions"><button class="btn" id="detailOpen">'+esc(t('open'))+'</button><button class="btn" id="detailDownload">'+esc(t('download'))+'</button></div><iframe class="pdf-frame" title="PDF" src="'+esc(fileUrl(file,'private'))+'"></iframe>':'')+'<details class="details-accordion"><summary>'+esc(t('summary'))+'</summary><div class="markdown-wrap markdown-body">'+renderMarkdown(validFile(file)?'':file)+'</div></details><div class="drawer-actions"><button class="btn" id="detailEdit">'+icon('pen')+' '+esc(t('edit'))+'</button></div><div class="pager"><button class="btn small" id="prevRecord" '+(row<=1?'disabled':'')+'>&lt;</button><span>'+esc(t('record').replace('{n}',row).replace('{total}',recordCount))+'</span><button class="btn small" id="nextRecord" '+(row>=recordCount?'disabled':'')+'>&gt;</button></div>';if(validFile(file)){$('detailOpen').onclick=()=>openFile(file);$('detailDownload').onclick=()=>downloadFile(file)}$('detailEdit').onclick=()=>showEdit(row);$('prevRecord').onclick=()=>showDetail(row-1);$('nextRecord').onclick=()=>showDetail(row+1)}catch(err){$('detailContent').innerHTML='<div class="error-banner">'+esc(String(err))+'</div>'}}
async function showEdit(row){editRow=row;currentRow=row;$('editOverlay').classList.remove('hidden');$('editError').textContent='';$('saveEdit').disabled=true;try{const r=await getRecord(row);if(editRow!==row)return;$('editForm_topic').value=r['研究主题'];$('editForm_tool').value=r['可视化工具']||'graphviz';$('editForm_layout').value=r['布局方向']||'TB';$('editForm_depth').value=r['调研深度']||'deep';$('editForm_refs').value=r['附参考资料']==='是'?'是':'否';$('editFile').textContent=validFile(r['图谱文件'])?t('ready'):t('missing');$('saveEdit').disabled=false}catch(err){$('editError').textContent=String(err)}}
async function saveEdit(e){e.preventDefault();const row=editRow;if(!row)return;const data={'研究主题':$('editForm_topic').value.trim(),'可视化工具':$('editForm_tool').value,'布局方向':$('editForm_layout').value,'调研深度':$('editForm_depth').value,'附参考资料':$('editForm_refs').value};if(!data['研究主题']){$('editError').textContent=t('topicRequired');return}$('saveEdit').disabled=true;try{for(const field of EDITABLE)await bridge('SetCellValue',SOURCE,field+'/'+row+'/'+data[field]);$('editOverlay').classList.add('hidden');notify(t('saved'));await Promise.all([loadLibrary(),loadHome()]);if(!$('detailOverlay').classList.contains('hidden'))showDetail(row)}catch(err){$('editError').textContent=String(err)}finally{$('saveEdit').disabled=false}}
function askDelete(row){deleteRow=row;const r=records.find(x=>x.row===row);$('confirmText').textContent=t('deleteAsk').replace('{topic}',r?.['研究主题']||'');$('confirmOverlay').classList.remove('hidden')}
async function deleteRecord(){if(!deleteRow)return;$('confirmDelete').disabled=true;try{await bridge('DeleteRecord',SOURCE,deleteRow.toString());$('confirmOverlay').classList.add('hidden');$('detailOverlay').classList.add('hidden');notify(t('deleted'));await Promise.all([loadLibrary(),loadHome()])}catch(err){notify(String(err))}finally{$('confirmDelete').disabled=false;deleteRow=0}}
function bind(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));$('brandClose').onclick=()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)};$('menuButton').onclick=()=>{const menu=$('mobileMenu');menu.classList.toggle('hidden');$('menuButton').setAttribute('aria-expanded',String(!menu.classList.contains('hidden')))};document.addEventListener('click',e=>{if(!$('topNav').contains(e.target))closeMenu()});$('langButton').onclick=$('menuLang').onclick=()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu()};$('heroStart').onclick=()=>showPage('create');$('homeAll').onclick=$('createToLibrary').onclick=()=>showPage('library');$('libraryToCreate').onclick=()=>showPage('create');$('researchForm_topic').oninput=validateForm;$('researchForm').onsubmit=submitResearch;$('againButton').onclick=resetCreate;$('refsSwitch').onclick=()=>{choices.refs=choices.refs==='是'?'否':'是';renderChoices()};for(const name of ['tool','layout','depth'])$(name+'Choices').onclick=e=>{const b=e.target.closest('[data-choice]');if(b){choices[name]=b.dataset.value;renderChoices()}};$('searchInput').oninput=renderLibrary;$('sortSelect').onchange=renderLibrary;$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filters[b.dataset.filter]=b.dataset.value;renderFilters();renderLibrary()}};for(const grid of [$('recentGrid'),$('libraryGrid')])grid.onclick=e=>{const b=e.target.closest('[data-action]');if(b){const row=Number(b.dataset.row);if(b.dataset.action==='start')showPage('create');else if(b.dataset.action==='detail')showDetail(row);else if(b.dataset.action==='edit')showEdit(row);else if(b.dataset.action==='delete')askDelete(row);else{const r=records.find(x=>x.row===row);if(r){if(b.dataset.action==='open')openFile(r['图谱文件']);if(b.dataset.action==='download')downloadFile(r['图谱文件'])}}return}const card=e.target.closest('[data-row]');if(card)showDetail(Number(card.dataset.row))};$('closeDetail').onclick=()=>$('detailOverlay').classList.add('hidden');$('closeEdit').onclick=()=>$('editOverlay').classList.add('hidden');$('cancelDelete').onclick=()=>$('confirmOverlay').classList.add('hidden');$('confirmDelete').onclick=deleteRecord;$('editForm').onsubmit=saveEdit;for(const id of ['detailOverlay','editOverlay','confirmOverlay'])$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).classList.add('hidden')});document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const el=document.activeElement;if(el&&el.matches('input,textarea,select'))setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),100)})}
function updateKeyboardSpace(){const v=window.visualViewport;const gap=v?Math.max(0,window.innerHeight-v.height-v.offsetTop):0;document.documentElement.style.setProperty('--keyboard-space',gap+'px')}
async function initialize(){lang=getLanguage();bind();if(window.visualViewport)window.visualViewport.addEventListener('resize',updateKeyboardSpace);window.addEventListener('resize',updateKeyboardSpace);updateKeyboardSpace();setLanguage(lang);renderPreview();validateForm();try{setMode(await bridge('模式'))}catch(e){setMode('暗色')}await loadHome()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});else (async () => { await initialize(); })();
</script>
</body>
