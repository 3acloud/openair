<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

 cn:{appName:'梦境解析助手',home:'首页',record:'记录梦境',library:'梦境库',heroText:'记录你的梦境，探索潜意识，促进自我成长',start:'开始记录梦境',total:'总梦境数',today:'今日记录',types:'类型分布',recent:'最近梦境',viewAll:'查看全部',recordSub:'详细记录梦境内容并获取深度解析',content:'梦境内容',dreamType:'梦境类型',emotions:'情绪',nightmare:'噩梦',good:'美梦',neutral:'中性',other:'其他',recordAnalyze:'记录并解析',clear:'清空表单',analysisResult:'解析结果',librarySub:'浏览和管理所有梦境记录与解析',addDream:'添加梦境',search:'搜索梦境内容',searchPlaceholder:'输入关键词',all:'全部',fromDate:'开始日期',toDate:'结束日期',contentSummary:'梦境摘要',recordDate:'记录日期',status:'解析状态',actions:'操作',analyzed:'已解析',pending:'未解析',view:'查看解析',edit:'编辑',delete:'删除',noDreams:'暂无梦境记录',noResults:'没有符合条件的梦境',loading:'正在加载...',analyzing:'正在解析您的梦境，请稍候...',completed:'解析完成',timeout:'解析等待超时，请稍后在梦境库查看。',save:'保存修改',close:'关闭',readOnly:'梦境内容不可编辑；若需修改，请删除后重新记录。',deleteConfirm:'确定删除这条梦境记录吗？',saved:'修改已保存',saveFailed:'保存失败',submitFailed:'提交失败',loadFailed:'加载失败',emptyContent:'请输入梦境内容',detail:'梦境详情',none:'暂无解析结果',todayLabel:'今天',language:'English'},
 en:{appName:'Dream Insight',home:'Home',record:'Record Dream',library:'Dream Library',heroText:'Record your dreams, explore your subconscious, and grow through reflection',start:'Start Recording',total:'Total Dreams',today:'Recorded Today',types:'Dream Types',recent:'Recent Dreams',viewAll:'View All',recordSub:'Describe your dream and receive a thoughtful analysis',content:'Dream Content',dreamType:'Dream Type',emotions:'Emotions',nightmare:'Nightmare',good:'Pleasant',neutral:'Neutral',other:'Other',recordAnalyze:'Record & Analyze',clear:'Clear Form',analysisResult:'Analysis',librarySub:'Browse and manage your dreams and analyses',addDream:'Add Dream',search:'Search Dream Content',searchPlaceholder:'Enter keywords',all:'All',fromDate:'From',toDate:'To',contentSummary:'Dream Summary',recordDate:'Recorded At',status:'Analysis Status',actions:'Actions',analyzed:'Analyzed',pending:'Pending',view:'View Analysis',edit:'Edit',delete:'Delete',noDreams:'No dreams recorded yet',noResults:'No matching dreams',loading:'Loading...',analyzing:'Analyzing your dream, please wait...',completed:'Analysis complete',timeout:'Analysis timed out. Check the Dream Library later.',save:'Save Changes',close:'Close',readOnly:'Dream content is read only. Delete and record again to change it.',deleteConfirm:'Delete this dream?',saved:'Changes saved',saveFailed:'Could not save',submitFailed:'Could not submit',loadFailed:'Could not load data',emptyContent:'Please enter your dream',detail:'Dream Details',none:'No analysis yet',todayLabel:'Today',language:'中文'}
};
let lang = 'cn', currentPage = 'home', pageHistory = [], currentRow = 0, dreams = [], sortKey = 'date', sortAsc = false, submitting = false, modalOpen = false, keyboardExtra = 0;
const $ = id => document.getElementById(id);
function tr(key){return I18N[lang][key] || key}
function esc(value){return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localDateTime(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function localeDefault(){let saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn';let urlLang=new URLSearchParams(location.search).get('lang');if(urlLang==='cn'||urlLang==='en')return urlLang;const list=navigator.languages;if(!list||!list.length)return 'cn';return list.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function setLanguage(next){lang=next;document.documentElement.lang=next==='cn'?'zh-CN':'en';localStorage.setItem('iThinkAir_UiLanguage',next);document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=tr(el.dataset.placeholder)});$('languageButton').textContent=next==='cn'?'EN':'中文';$('mobileLanguageButton').textContent=tr('language');renderEmotionChoices('recordForm_emotions','recordForm',selectedEmotions('recordForm_emotions'));renderStats();renderRecent();renderLibrary();updateNav();requestAnimationFrame(adjustNav)}
function selectedEmotions(containerId){return [...$(containerId).querySelectorAll('input:checked')].map(x=>x.value)}
function renderEmotionChoices(containerId,prefix,selected=[]){const box=$(containerId);box.innerHTML=EMOTIONS.map((e,i)=>'<label class="tag-option"><input type="checkbox" id="'+prefix+'_emotion_'+i+'" name="情绪" value="'+esc(e)+'" '+(selected.includes(e)?'checked':'')+'><span>'+esc(tr({快乐:'happy',悲伤:'sad',恐惧:'fear',愤怒:'anger',平静:'calm',其他:'other'}[e])||e)+'</span></label>').join('');}
I18N.cn.happy='快乐';I18N.cn.sad='悲伤';I18N.cn.fear='恐惧';I18N.cn.anger='愤怒';I18N.cn.calm='平静';I18N.en.happy='Happy';I18N.en.sad='Sad';I18N.en.fear='Fear';I18N.en.anger='Anger';I18N.en.calm='Calm';
function typeLabel(t){return tr({噩梦:'nightmare',美梦:'good',中性:'neutral',其他:'other'}[t]||'other')}
function typeIcon(t){return {'噩梦':'fa-cloud-bolt','美梦':'fa-star','中性':'fa-moon','其他':'fa-cloud'}[t]||'fa-cloud'}
function safeRows(text){return text?parseCSV(String(text).replace(/^\uFEFF/,'')):[]}
function showStatus(message,kind=''){const el=$('recordStatus');el.textContent=message;el.className='status '+kind}
function showPage(page,push=true){if(!['home','record','library'].includes(page))return;if(push&&page!==currentPage)pageHistory.push({page:currentPage,y:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));updateNav();closeMenu();window.scrollTo(0,0);if(page==='home')loadHome();if(page==='library')loadLibrary()}
function updateNav(){document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===currentPage))}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}
function adjustNav(){const nav=$('nav');nav.classList.remove('compact');if(window.innerWidth<=760)return;const inner=nav.querySelector('.nav-inner');if(inner.scrollWidth>inner.clientWidth+2)nav.classList.add('compact')}
function openModal(html,wide=true,markdown=false){$('modalBox').classList.toggle('wide',wide);$('modalBox').innerHTML=html;$('modalLayer').classList.add('open');$('modalLayer').classList.toggle('markdown-modal',markdown);$('modalLayer').setAttribute('aria-hidden','false');modalOpen=true;document.body.style.overflow='hidden'}
function closeModal(){$('modalLayer').classList.remove('open','markdown-modal');$('modalLayer').setAttribute('aria-hidden','true');$('modalBox').innerHTML='';modalOpen=false;document.body.style.overflow=''}
function modalHeader(title){return '<div class="modal-head"><h2>'+esc(title)+'</h2><button type="button" class="icon-button" id="modalClose" aria-label="'+esc(tr('close'))+'"><i class="fa-solid fa-xmark"></i></button></div>'}
function bindModalClose(){$('modalClose').addEventListener('click',closeModal)}
function markdownInto(el,source){if(window.marked){const raw=marked.parse(String(source||''),{gfm:true,breaks:true});el.innerHTML=window.DOMPurify?DOMPurify.sanitize(raw):'<pre>'+esc(source)+'</pre>'}else el.innerHTML='<pre>'+esc(source)+'</pre>';el.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(!src)return;const href=/^(https?:|data:)/i.test(src)?src:'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);img.src=href;const a=document.createElement('a');a.href=href;a.download='';img.parentNode.insertBefore(a,img);a.appendChild(img)})}
async function loadHome(){try{const [countText,dateText,typeText,recentText]=await Promise.all([
 callAppBridge({type:'GetRecordCount',data:SOURCE}),
 callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'记录日期'}),
 callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'梦境类型'}),
 callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'梦境内容,梦境类型,记录日期'})
]);$('totalCount').textContent=String(parseInt(countText,10)||0);const today=localDateTime().slice(0,10);$('todayCount').textContent=safeRows(dateText).filter(r=>(r[0]||'').slice(0,10)===today).length;window.typeTotals={噩梦:0,美梦:0,中性:0,其他:0};safeRows(typeText).forEach(r=>{const t=TYPES.includes(r[0])?r[0]:'其他';window.typeTotals[t]++});renderStats();const rows=safeRows(recentText).map((r,i)=>({row:i+1,content:r[0]||'',type:r[1]||'其他',date:r[2]||''}));rows.sort((a,b)=>b.date.localeCompare(a.date)||a.row-b.row);window.recentItems=[];for(const item of rows.slice(0,3)){const [content,mood]=await Promise.all([callAppBridge({type:'GetCellValue',data:SOURCE,payload:'梦境内容/'+item.row}),callAppBridge({type:'GetCellValue',data:SOURCE,payload:'情绪/'+item.row})]);item.content=content||'';item.mood=String(mood||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean).slice(0,3);window.recentItems.push(item)}renderRecent()}catch(e){$('recentDreams').innerHTML='<div class="empty">'+esc(tr('loadFailed'))+'</div>';console.error(e)}}
function renderStats(){if(!window.typeTotals)return;$('typeCounts').innerHTML=TYPES.map((t,i)=>'<span><i class="dot dot-'+['nightmare','good','neutral','other'][i]+'"></i>'+esc(typeLabel(t))+': '+window.typeTotals[t]+'</span>').join('')}
function renderRecent(){const items=window.recentItems;if(!items)return;$('recentDreams').innerHTML=items.length?items.map(d=>'<button type="button" class="recent-item" data-row="'+d.row+'"><div class="recent-top"><span><i class="fa-solid '+typeIcon(d.type)+'"></i> '+esc(typeLabel(d.type))+'</span><span>'+esc(d.date.slice(0,10))+'</span></div><div class="recent-title">'+esc(d.content.slice(0,40))+(d.content.length>40?'…':'')+'</div><div class="chip-row">'+d.mood.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div></button>').join(''):'<div class="empty">'+esc(tr('noDreams'))+'</div>'}
async function loadLibrary(){const body=$('libraryBody');body.innerHTML='<tr><td colspan="6" class="empty">'+esc(tr('loading'))+'</td></tr>';try{const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'梦境内容,梦境类型,情绪,记录日期'});const rows=safeRows(csv);dreams=[];for(let i=0;i<rows.length;i++){const r=rows[i];const [content,analysis]=await Promise.all([callAppBridge({type:'GetCellValue',data:SOURCE,payload:'梦境内容/'+(i+1)}),callAppBridge({type:'GetCellValue',data:SOURCE,payload:'解析结果/'+(i+1)})]);dreams.push({row:i+1,content:String(content||''),type:r[1]||'其他',mood:r[2]||'',date:r[3]||'',analysis:String(analysis||'')})}renderLibrary()}catch(e){body.innerHTML='<tr><td colspan="6" class="empty">'+esc(tr('loadFailed'))+'</td></tr>';console.error(e)}}
function renderLibrary(){const body=$('libraryBody');const q=$('searchInput').value.trim().toLocaleLowerCase();const t=$('typeFilter').value;const from=$('dateFrom').value;const to=$('dateTo').value;let found=dreams.filter(d=>d.content.toLocaleLowerCase().includes(q)&&(!t||d.type===t)&&(!from||d.date.slice(0,10)>=from)&&(!to||d.date.slice(0,10)<=to));found.sort((a,b)=>{const av=sortKey==='content'?a.content:sortKey==='type'?a.type:a.date;const bv=sortKey==='content'?b.content:sortKey==='type'?b.type:b.date;return (sortAsc?1:-1)*(av.localeCompare(bv,'zh-CN')||a.row-b.row)});body.innerHTML=found.map(d=>'<tr data-row="'+d.row+'"><td class="summary-cell">'+esc(d.content.slice(0,30))+(d.content.length>30?'…':'')+'</td><td><i class="fa-solid '+typeIcon(d.type)+'"></i> '+esc(typeLabel(d.type))+'</td><td><div class="chip-row">'+String(d.mood).split(/[,，]/).map(x=>x.trim()).filter(Boolean).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div></td><td>'+esc(d.date)+'</td><td><span class="chip">'+esc(tr(d.analysis.trim()?'analyzed':'pending'))+'</span></td><td><div class="row-actions"><button type="button" data-action="view" data-row="'+d.row+'" title="'+esc(tr('view'))+'"><i class="fa-regular fa-eye"></i></button><button type="button" data-action="edit" data-row="'+d.row+'" title="'+esc(tr('edit'))+'"><i class="fa-solid fa-pen"></i></button><button type="button" data-action="delete" data-row="'+d.row+'" title="'+esc(tr('delete'))+'"><i class="fa-solid fa-trash"></i></button></div></td></tr>').join('');$('libraryEmpty').hidden=found.length>0;$('libraryEmpty').textContent=tr(dreams.length?'noResults':'noDreams')}
async function showDetail(row){try{const fields=['梦境内容','梦境类型','情绪','记录日期','解析结果'];const values=[];for(const field of fields)values.push(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row}));const [content,type,mood,date,analysis]=values;openModal(modalHeader(tr('detail'))+'<div class="detail-meta"><span><i class="fa-solid '+typeIcon(type)+'"></i> '+esc(typeLabel(type))+'</span><span>'+esc(date)+'</span></div><div class="chip-row">'+String(mood||'').split(/[,，]/).filter(Boolean).map(x=>'<span class="chip">'+esc(x.trim())+'</span>').join('')+'</div><div class="detail-section"><h3>'+esc(tr('content'))+'</h3><div class="detail-content">'+esc(content)+'</div></div><div class="detail-section"><h3>'+esc(tr('analysisResult'))+'</h3><div class="markdown-body" id="detailMarkdown"></div></div>',true,true);bindModalClose();if(analysis)markdownInto($('detailMarkdown'),analysis);else $('detailMarkdown').textContent=tr('none')}catch(e){alert(tr('loadFailed'));console.error(e)}}
async function showEdit(row){try{currentRow=row;const fields=['记录ID','梦境内容','记录日期','梦境类型','情绪'];const v={};for(const field of fields)v[field]=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row});openModal(modalHeader(tr('edit'))+'<form id="editForm"><div class="field"><label for="editForm_id">ID</label><input id="editForm_id" name="记录ID" readonly></div><div class="field"><label for="editForm_date">'+esc(tr('recordDate'))+'</label><input id="editForm_date" name="记录日期" readonly></div><div class="field"><label for="editForm_content">'+esc(tr('content'))+'</label><textarea id="editForm_content" name="梦境内容" readonly></textarea><small>'+esc(tr('readOnly'))+'</small></div><div class="field"><label for="editForm_type">'+esc(tr('dreamType'))+'</label><select id="editForm_type" name="梦境类型">'+TYPES.map(t=>'<option value="'+esc(t)+'">'+esc(typeLabel(t))+'</option>').join('')+'</select></div><div class="field"><span class="label">'+esc(tr('emotions'))+'</span><div class="tag-options" id="editForm_emotions"></div></div><button type="submit" class="btn btn-primary" id="editForm_submit">'+esc(tr('save'))+'</button></form>',false,false);bindModalClose();$('editForm_id').value=v['记录ID']||'';$('editForm_date').value=v['记录日期']||'';$('editForm_content').value=v['梦境内容']||'';$('editForm_type').value=v['梦境类型']||'其他';renderEmotionChoices('editForm_emotions','editForm',String(v['情绪']||'').split(/[,，]/).map(x=>x.trim()));$('editForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('editForm_submit');btn.disabled=true;try{await callAppBridge({type:'SetCellValue',data:SOURCE,payload:'梦境类型/'+row+'/'+$('editForm_type').value});await callAppBridge({type:'SetCellValue',data:SOURCE,payload:'情绪/'+row+'/'+selectedEmotions('editForm_emotions').join(',')});closeModal();await Promise.all([loadLibrary(),loadHome()])}catch(err){alert(tr('saveFailed'));console.error(err)}finally{btn.disabled=false}})}catch(e){alert(tr('loadFailed'));console.error(e)}}
async function deleteDream(row){if(!confirm(tr('deleteConfirm')))return;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row)currentRow=0;else if(currentRow>row)currentRow--;await Promise.all([loadLibrary(),loadHome()])}catch(e){alert(tr('saveFailed'));console.error(e)}}
function clearRecord(){if(submitting)return;$('recordForm').reset();$('recordForm_id').value='';$('recordForm_date').value='';renderEmotionChoices('recordForm_emotions','recordForm',[]);$('recordResult').innerHTML='';$('resultCard').classList.remove('visible');showStatus('');currentRow=0}
async function pollAnalysis(){const started=Date.now();while(Date.now()-started<1800000){await new Promise(resolve=>setTimeout(resolve,1000));const result=await callAppBridge({type:'轮询',data:TABLE,payload:'解析结果'});if(String(result||'').trim())return String(result)}throw new Error('poll-timeout')}
async function submitDream(e){e.preventDefault();if(submitting)return;const content=$('recordForm_content').value.trim();if(!content){showStatus(tr('emptyContent'),'error');return}submitting=true;$('recordSubmit').disabled=true;const id=String(Math.floor(Math.random()*900000000000)+100000000000);$('recordForm_id').value=id;$('recordForm_date').value=localDateTime();const payload={'记录ID':id,'梦境内容':content,'记录日期':$('recordForm_date').value,'梦境类型':$('recordForm_type').value,'情绪':selectedEmotions('recordForm_emotions').join(','),'解析结果':''};try{showStatus(tr('analyzing'));await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(payload)});currentRow=1;await Promise.all([loadHome(),loadLibrary()]);const result=await pollAnalysis();$('resultCard').classList.add('visible');markdownInto($('recordResult'),result);showStatus(tr('completed'),'success');await Promise.all([loadHome(),loadLibrary()])}catch(err){showStatus(err.message==='poll-timeout'?tr('timeout'):tr(currentRow===1?'loadFailed':'submitFailed'),'error');console.error(err)}finally{submitting=false;$('recordSubmit').disabled=false}}
function airBack(){if(modalOpen){closeModal();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(pageHistory.length){const prev=pageHistory.pop();showPage(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.y));return 'false'}return 'true'}
window.airBack=airBack;
function ensureVisible(e){const target=e.target;if(!target.matches('input,textarea,select'))return;setTimeout(()=>target.scrollIntoView({block:'center',behavior:'smooth'}),250)}
async function initialize(){lang=localeDefault();setLanguage(lang);try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('light',String(mode).trim()==='亮色')}catch(e){console.error(e)}
 $('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});
 document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));
 $('startRecord').addEventListener('click',()=>showPage('record'));$('addDream').addEventListener('click',()=>showPage('record'));$('viewAll').addEventListener('click',()=>showPage('library'));
 $('languageButton').addEventListener('click',()=>setLanguage(lang==='cn'?'en':'cn'));$('mobileLanguageButton').addEventListener('click',()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu()});
 $('menuButton').addEventListener('click',e=>{e.stopPropagation();const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))});
 document.addEventListener('click',e=>{if(!$('nav').contains(e.target))closeMenu()});window.addEventListener('resize',adjustNav);new ResizeObserver(adjustNav).observe($('navLinks'));adjustNav();
 $('recordForm').addEventListener('submit',submitDream);$('clearForm').addEventListener('click',clearRecord);
 $('recentDreams').addEventListener('click',e=>{const item=e.target.closest('[data-row]');if(item)showDetail(Number(item.dataset.row))});
 ['searchInput','typeFilter','dateFrom','dateTo'].forEach(id=>$(id).addEventListener('input',renderLibrary));
 document.querySelectorAll('[data-sort]').forEach(el=>el.addEventListener('click',()=>{const key=el.dataset.sort;if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=key!=='date'}renderLibrary()}));
 $('libraryBody').addEventListener('click',e=>{const action=e.target.closest('[data-action]');const row=e.target.closest('tr[data-row]');if(!row)return;const number=Number(row.dataset.row);if(action){e.stopPropagation();if(action.dataset.action==='view')showDetail(number);if(action.dataset.action==='edit')showEdit(number);if(action.dataset.action==='delete')deleteDream(number)}else showDetail(number)});
 $('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalOpen)closeModal();else closeMenu()}});
 document.addEventListener('focusin',ensureVisible);if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const height=Math.max(0,window.innerHeight-window.visualViewport.height);keyboardExtra=height;$('modalBox').style.paddingBottom=height>100?(height+80)+'px':'';if(document.activeElement&&document.activeElement.matches('input,textarea,select'))ensureVisible({target:document.activeElement})});
 await loadHome();
}
(async () => { await initialize(); })();
</script>
