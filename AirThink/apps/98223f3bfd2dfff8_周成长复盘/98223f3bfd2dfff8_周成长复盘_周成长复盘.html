<script>
/* Exact bridge code follows. */
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("98223f3bfd2dfff8_周成长复盘")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);

  }
}

function PauseRecordVoiceA() {

}

/**

 */
function ContinueRecordVoiceA() {

    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {

function empty(key){return `<div class="empty"><i class="fa-solid fa-seedling"></i>${esc(t(key))}</div>`}
function badge(m){const i=moods.indexOf(m),cls=['joy','confused','power','tired','calm','other'][i]||'other';return m?`<span class="badge ${cls}">${esc(state.lang==='cn'?m:(moodEn[m]||m))}</span>`:''}
function short(s,n){s=String(s||'');return esc(s.length>n?s.slice(0,n)+'…':s)}
const summaryCache=new Map(),summaryPending=new Set();
function summaryHTML(kind,row,field,n){const key=kind+'|'+row+'|'+field;const value=summaryCache.get(key);return `<span data-summary="${esc(key)}" data-limit="${n}">${value===undefined?'…':short(value,n)}</span>`}
async function loadSummaries(){const keys=[...new Set([...document.querySelectorAll('[data-summary]')].map(e=>e.dataset.summary))];for(const key of keys){if(summaryCache.has(key)||summaryPending.has(key))continue;summaryPending.add(key);const [kind,row,field]=key.split('|');cell(kind==='e'?TABLE.e:TABLE.r,field,Number(row)).then(value=>{summaryCache.set(key,value);document.querySelectorAll('[data-summary]').forEach(e=>{if(e.dataset.summary===key){const n=Number(e.dataset.limit);e.textContent=String(value||'').slice(0,n)+(String(value||'').length>n?'…':'')}})}).catch(()=>{}).finally(()=>summaryPending.delete(key))}}
function field(obj,name){return obj[name]||''}
function rows(csv,fields){return parseCSV(String(csv||'')).filter(r=>r.some(x=>x!=='' )).map((r,i)=>{const o={_row:i+1};fields.forEach((f,j)=>o[f]=r[j]||'');return o})}
async function getRows(table,fields){return rows(await callAppBridge({type:'GetTableCSV',data:table,payload:fields.join(',')}),fields)}
async function cell(table,name,row){return await callAppBridge({type:'GetCellValue',data:table,payload:`${name}/${row}`})}
async function fullRecord(table,fields,row){const o={};for(const f of fields)o[f]=await cell(table,f,row);return o}
async function refresh(){try{const [e,r]=await Promise.all([getRows(TABLE.e,EF),getRows(TABLE.r,RF)]);summaryCache.clear();state.e=e.sort((a,b)=>(b['记录日期']||'').localeCompare(a['记录日期']||'')||a._row-b._row);state.r=r.sort((a,b)=>(b['结束日期']||'').localeCompare(a['结束日期']||'')||a._row-b._row);await renderStats();await updateReportStatus()}catch(err){toast(t('error')+': '+err.message)}}
async function renderStats(){try{const [ec,rc,dates,moodDates]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE.e}),callAppBridge({type:'GetRecordCount',data:TABLE.r}),getRows(TABLE.e,['记录日期']),getRows(TABLE.e,['情绪感受','记录日期'])]);const week=monday(),count=dates.filter(x=>mondayOf(x['记录日期'])===week).length;const counts={};moodDates.filter(x=>mondayOf(x['记录日期'])===week).forEach(x=>{const m=x['情绪感受'];if(m)counts[m]=(counts[m]||0)+1});const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];const items=[['fa-book-open',t('totalE'),ec],['fa-seedling',t('totalR'),rc],['fa-calendar-week',t('weekE'),count],['fa-heart',t('weekMood'),top?badge(top):esc(t('none'))]];$('stats').innerHTML=items.map(x=>`<div class="stat"><i class="fa-solid ${x[0]}"></i><strong>${x[2]}</strong><span>${esc(x[1])}</span></div>`).join('')}catch(err){toast(t('error')+': '+err.message)}}
function evidenceCard(o,recent=false){return `<article class="card clickable" data-kind="e" data-row="${o._row}" tabindex="0"><h3>${esc(o['证据标题']||t('none'))}${badge(o['情绪感受'])}</h3><div class="meta"><i class="fa-regular fa-calendar"></i> ${esc(o['记录日期'])} ${o['证据文件']?'<i class="fa-solid fa-paperclip" title="File"></i>':''}</div><p>${summaryHTML('e',o._row,'学习内容',recent?80:100)}</p><p>${summaryHTML('e',o._row,'个人反思',recent?50:60)}</p>${recent?'':`<div class="actions"><button class="mini" data-act="edit" data-kind="e" data-row="${o._row}">${esc(t('edit'))}</button><button class="mini" data-act="delete" data-kind="e" data-row="${o._row}">${esc(t('delete'))}</button><button class="mini" data-act="view" data-kind="e" data-row="${o._row}">${esc(t('details'))}</button></div>`}</article>`}
function reviewCard(o,recent=false){const status=o._status?`<span class="badge ${o._status==='ready'?'power':'other'}">${esc(t(o._status==='ready'?'created':'pending'))}</span>`:'';return `<article class="card clickable" data-kind="r" data-row="${o._row}" tabindex="0"><h3>${esc(o['复盘标题']||t('none'))} ${status}</h3><div class="meta"><i class="fa-regular fa-calendar"></i> ${esc(o['开始日期'])} ${esc(t('to'))} ${esc(o['结束日期'])}</div><p>${summaryHTML('r',o._row,'补充说明',recent?60:80)}</p>${recent?'':`<div class="actions"><button class="mini" data-act="view" data-kind="r" data-row="${o._row}">${esc(t('report'))}</button><button class="mini" data-act="edit" data-kind="r" data-row="${o._row}">${esc(t('edit'))}</button><button class="mini" data-act="delete" data-kind="r" data-row="${o._row}">${esc(t('delete'))}</button></div>`}</article>`}
function renderAll(){const eSearch=$('eSearch').value.toLocaleLowerCase(),eMood=$('eMood').value,eFrom=$('eFrom').value,eTo=$('eTo').value;const er=state.e.filter(o=>(!eSearch||['证据标题','学习内容','个人反思'].some(f=>field(o,f).toLocaleLowerCase().includes(eSearch)))&&(!eMood||field(o,'情绪感受')===eMood)&&(!eFrom||field(o,'记录日期')>=eFrom)&&(!eTo||field(o,'记录日期')<=eTo));$('eList').innerHTML=er.length?er.slice(0,state.eVisible).map(o=>evidenceCard(o)).join(''):empty(state.e.length?'noMatch':'emptyE');$('eMore').classList.toggle('hidden',er.length<=state.eVisible);const rSearch=$('rSearch').value.toLocaleLowerCase(),rFrom=$('rFrom').value,rTo=$('rTo').value;const rr=state.r.filter(o=>(!rSearch||['复盘标题','补充说明'].some(f=>field(o,f).toLocaleLowerCase().includes(rSearch)))&&(!rFrom||field(o,'开始日期')>=rFrom)&&(!rTo||field(o,'结束日期')<=rTo));$('rList').innerHTML=rr.length?rr.slice(0,state.rVisible).map(o=>reviewCard(o)).join(''):empty(state.r.length?'noMatch':'emptyR');$('rMore').classList.toggle('hidden',rr.length<=state.rVisible);$('recentEvidenceList').innerHTML=state.e.length?state.e.slice(0,5).map(o=>evidenceCard(o,true)).join(''):empty('emptyE');$('recentReviewList').innerHTML=state.r.length?state.r.slice(0,3).map(o=>reviewCard(o,true)).join(''):empty('emptyR');loadSummaries()}
async function updateReportStatus(){for(const o of state.r){try{o._status=(await cell(TABLE.r,'成长复盘报告',o._row)).trim()?'ready':'pending'}catch{o._status='pending'}}renderAll()}
function navigate(page,remember=true){if(page===state.page&&document.getElementById('page-'+page).classList.contains('active'))return;if(remember)state.history.push({page:state.page,y:window.scrollY});state.page=page;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page));$('mobileMenu').classList.remove('open');window.scrollTo(0,0)}
function showModal(title,html,footer='',wide=false,reading=false){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalFoot').innerHTML=footer;$('modalFoot').style.display=footer?'flex':'none';$('modal').classList.toggle('wide',wide);$('overlay').classList.toggle('reading',reading);$('overlay').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){if(state.polling&&state.modalKind==='poll')return;$('overlay').classList.remove('open','reading');document.body.style.overflow='';state.modalKind=''}
function md(content){if(typeof marked==='undefined'||typeof DOMPurify==='undefined')return '<pre>'+esc(content)+'</pre>';const raw=marked.parse(String(content||''),{gfm:true,breaks:true});const holder=document.createElement('div');holder.innerHTML=DOMPurify.sanitize(raw);holder.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(src&&!/^https?:|^data:/i.test(src))img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);img.dataset.download=img.src;img.title=t('download')});return `<div class="markdown-body">${holder.innerHTML}</div>`}
function fileLink(name,kind){return `https://www.ithinkair.com:3031/${kind}/${encodeURIComponent(name)}`}
async function viewEvidence(row){state.currentRow=row;try{const o=await fullRecord(TABLE.e,EF,row);let html=`<div class="detail-row"><strong>${esc(t('dateE'))}</strong>${esc(o['记录日期'])} ${badge(o['情绪感受'])}</div><div class="detail-row"><strong>${esc(t('learn'))}</strong>${md(o['学习内容'])}</div><div class="detail-row"><strong>${esc(t('reflect'))}</strong>${md(o['个人反思'])}</div>`;if(o['证据文件'])html+=`<div class="detail-row"><strong>${esc(t('file'))}</strong><div class="actions"><a class="btn ghost" target="_blank" rel="noopener" href="${esc(fileLink(o['证据文件'],'private'))}">${esc(t('open'))}</a><a class="btn ghost" download href="${esc(fileLink(o['证据文件'],'download'))}">${esc(t('download'))}</a></div></div>`;state.modalKind='detail';state.modalRow=row;showModal(o['证据标题']||t('details'),html,'',true,true)}catch(err){toast(t('error')+': '+err.message)}}
async function viewReport(row){state.currentRow=row;state.modalRow=row;state.modalKind='report';showModal(t('report'),`<div id="reportContent">${esc(t('reportWait'))}</div>`,`<button class="btn ghost" id="refreshReport">${esc(t('refresh'))}</button>`,true,true);await refreshReport()}
async function refreshReport(){try{const content=await cell(TABLE.r,'成长复盘报告',state.modalRow);$('reportContent').innerHTML=content.trim()?md(content):esc(t('reportWait'));const o=state.r.find(x=>x._row===state.modalRow);if(o)o._status=content.trim()?'ready':'pending';renderAll()}catch(err){toast(t('error')+': '+err.message)}}
function formField(formId,key,label,value,type='text',full=false){const id=formId+'_'+key;const safe=esc(value||'');const control=type==='textarea'?`<textarea id="${id}" name="${esc(key)}">${safe}</textarea>`:type==='select'?`<select id="${id}" name="${esc(key)}"><option value="">${esc(t('chooseMood'))}</option>${moods.map(m=>`<option value="${esc(m)}" ${m===value?'selected':''}>${esc(state.lang==='cn'?m:moodEn[m])}</option>`).join('')}</select>`:type==='file'?`<div class="file-row"><input id="${id}" name="${esc(key)}" value="${safe}" readonly><button type="button" class="mini" id="${formId}_selectFile">${esc(t('selectFile'))}</button></div>`:`<input id="${id}" name="${esc(key)}" type="${type}" value="${safe}">`;return `<div class="field ${full?'full':''}"><label for="${id}">${esc(label)}</label>${control}</div>`}
async function openForm(kind,row=0){if(state.polling)return;state.currentRow=row;state.modalKind='form';state.modalRow=row;const formId=kind==='e'?'evidenceForm':'reviewForm';let values={};try{if(row)values=await fullRecord(kind==='e'?TABLE.e:TABLE.r,kind==='e'?EF:RF,row)}catch(err){toast(t('error')+': '+err.message);return}let html='';if(kind==='e'){html=formField(formId,'证据标题',t('titleE'),values['证据标题'])+formField(formId,'记录日期',t('dateE'),values['记录日期']||nowString(),'date')+formField(formId,'学习内容',t('learn'),values['学习内容'],'textarea',true)+formField(formId,'个人反思',t('reflect'),values['个人反思'],'textarea',true)+formField(formId,'情绪感受',t('mood'),values['情绪感受'],'select')+formField(formId,'证据文件',t('file'),values['证据文件'],'file');html+=`<input type="hidden" id="${formId}_创建时间" name="创建时间" value="${esc(values['创建时间']||nowString(new Date(),true))}">`}else{html=formField(formId,'复盘标题',t('titleR'),values['复盘标题'])+formField(formId,'开始日期',t('start'),values['开始日期']||monday(),'date')+formField(formId,'结束日期',t('end'),values['结束日期']||nowString(),'date')+formField(formId,'补充说明',t('note'),values['补充说明'],'textarea',true)}showModal((row?t('edit'):(kind==='e'?t('addEvidence'):t('addReview'))),`<form id="${formId}" class="form-grid">${html}</form>`,`<button class="btn ghost" id="cancelForm">${esc(t('cancel'))}</button><button class="btn" id="submitForm">${esc(t('save'))}</button>`);$('submitForm').onclick=()=>submitForm(kind,row,formId);$('cancelForm').onclick=closeModal;if(kind==='e')$(formId+'_selectFile').onclick=async()=>{try{const file=await callAppBridge({type:'SelectFile'});if(file)$(formId+'_证据文件').value=file}catch(err){toast(t('error')+': '+err.message)}};else if(!row){const a=$(formId+'_开始日期'),b=$(formId+'_结束日期'),title=$(formId+'_复盘标题');const suggest=()=>{if(!title.dataset.touched)title.value=`${a.value} ${t('to')} ${b.value} ${state.lang==='cn'?'成长复盘':'Growth Review'}`};title.addEventListener('input',()=>title.dataset.touched='1');a.addEventListener('change',suggest);b.addEventListener('change',suggest);suggest()}}
async function submitForm(kind,row,formId){const fields=kind==='e'?EF:RF,table=kind==='e'?TABLE.e:TABLE.r;const data={};for(const f of fields)data[f]=$(formId+'_'+f).value.trim();if(!(kind==='e'?data['证据标题']:data['复盘标题'])){toast(t('required'));return}if(kind==='r'&&data['结束日期']<data['开始日期']){toast(t('dateError'));return}const button=$('submitForm');button.disabled=true;try{if(row){for(const f of fields)await callAppBridge({type:'SetCellValue',data:table,payload:`${f}/${row}/${data[f]}`})}else{await callAppBridge({type:'SubmitRecord',data:table,payload:JSON.stringify(data)});state.currentRow=1}closeModal();await refresh();if(kind==='r'&&!row){await pollReport(1)}else if(kind==='r')await updateReportStatus()}catch(err){toast(t('error')+': '+err.message)}finally{button.disabled=false}}
async function pollReport(row){state.polling=true;state.modalKind='poll';state.modalRow=row;showModal(t('report'),`<div id="reportContent"><i class="fa-solid fa-seedling"></i> ${esc(t('wait'))}</div>`,'',true,true);const token=++state.pollToken;const deadline=Date.now()+1800000;try{while(Date.now()<deadline&&token===state.pollToken){const content=await cell(TABLE.r,'成长复盘报告',row);if(content&&content.trim()){state.polling=false;state.modalKind='report';$('reportContent').innerHTML=md(content);$('modalFoot').style.display='flex';$('modalFoot').innerHTML=`<button class="btn ghost" id="refreshReport">${esc(t('refresh'))}</button>`;await refresh();await updateReportStatus();return}await new Promise(resolve=>setTimeout(resolve,1000))}state.polling=false;state.modalKind='report';$('reportContent').textContent=t('timeout');$('modalFoot').style.display='flex';$('modalFoot').innerHTML=`<button class="btn ghost" id="refreshReport">${esc(t('refresh'))}</button>`;await refresh()}catch(err){state.polling=false;state.modalKind='report';toast(t('error')+': '+err.message)}}
async function deleteItem(kind,row){if(!confirm(t(kind==='e'?'confirmE':'confirmR')))return;try{await callAppBridge({type:'DeleteRecord',data:kind==='e'?TABLE.e:TABLE.r,payload:row.toString()});await refresh();if(kind==='r')await updateReportStatus()}catch(err){toast(t('error')+': '+err.message)}}
function airBack(){if($('overlay').classList.contains('open')){if(state.polling)return 'false';closeModal();return 'false'}if($('mobileMenu').classList.contains('open')){$('mobileMenu').classList.remove('open');return 'false'}if(state.history.length){const prev=state.history.pop();navigate(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.y));return 'false'}return 'true'}window.airBack=airBack;
function bind(){document.querySelectorAll('[data-page]').forEach(e=>e.addEventListener('click',()=>navigate(e.dataset.page)));$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch{}};$('menuBtn').onclick=e=>{e.stopPropagation();$('mobileMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))$('mobileMenu').classList.remove('open')});$('langBtn').onclick=()=>setLanguage(state.lang==='cn'?'en':'cn');$('mobileLang').onclick=()=>setLanguage(state.lang==='cn'?'en':'cn');$('homeAddEvidence').onclick=()=>{navigate('evidence');openForm('e')};$('homeAddReview').onclick=()=>{navigate('reviews');openForm('r')};$('addEvidence').onclick=()=>openForm('e');$('addReview').onclick=()=>openForm('r');for(const id of ['eSearch','eMood','eFrom','eTo','rSearch','rFrom','rTo'])$(id).addEventListener('input',()=>{state.eVisible=8;state.rVisible=8;renderAll()});$('eClear').onclick=()=>{for(const id of ['eSearch','eMood','eFrom','eTo'])$(id).value='';renderAll()};$('rClear').onclick=()=>{for(const id of ['rSearch','rFrom','rTo'])$(id).value='';renderAll()};$('eMore').onclick=()=>{state.eVisible+=8;renderAll()};$('rMore').onclick=()=>{state.rVisible+=8;renderAll()};$('modalClose').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('click',async e=>{const act=e.target.closest('[data-act]');if(act){e.stopPropagation();const kind=act.dataset.kind,row=Number(act.dataset.row);if(act.dataset.act==='edit')await openForm(kind,row);if(act.dataset.act==='delete')await deleteItem(kind,row);if(act.dataset.act==='view')await (kind==='e'?viewEvidence(row):viewReport(row));return}const card=e.target.closest('.card.clickable');if(card)await(card.dataset.kind==='e'?viewEvidence(Number(card.dataset.row)):viewReport(Number(card.dataset.row)));if(e.target.id==='refreshReport')await refreshReport();if(e.target.closest('.markdown-body img')){const img=e.target.closest('img');const a=document.createElement('a');a.href=img.dataset.download||img.src;a.download='';a.click()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack();if(e.key==='Enter'&&e.target.matches('.card.clickable'))e.target.click()});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),320)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)})}
async function initialize(){state.lang=initialLanguage();bind();applyLanguage();navigate('home',false);try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch{}await refresh()}
document.addEventListener('DOMContentLoaded',()=>{(async () => {    await initialize();  })();});
</script></body></html>
