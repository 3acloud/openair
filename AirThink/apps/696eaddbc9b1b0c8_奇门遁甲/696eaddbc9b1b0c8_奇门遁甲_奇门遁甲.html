<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("696eaddbc9b1b0c8_奇门遁甲")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {

        if (err.name === 'AbortError') return;

      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {

        if (!file.type.startsWith('image/')) {

        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });

    fileInput.addEventListener('cancel', () => {

      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

let lang='cn',page='home',historyStack=[],records=[],count=0,currentRow=0,currentData=null,resultText='',detailRow=0,detailData=null,detailText='',busy=false,waiting=false,detailWaiting=false,limit=12,refreshId=0,noticeTimer,deleteRow=0,lastFocus=null;
const pollers={main:null,detail:null};let mainState='empty',detailState='empty';
function t(k){return messages[lang][k]||k}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function localTime(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function language(){try{const s=localStorage.getItem('iThinkAir_UiLanguage');if(s)return s==='en'?'en':'cn'}catch(e){}const q=new URLSearchParams(location.search).get('lang');if(q==='cn'||q==='en')return q;const l=navigator.languages;return !l||!l.length||l.some(v=>/^zh\b/i.test(v))?'cn':'en'}
function translate(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('app');document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));$('menuButton').ariaLabel=lang==='cn'?'导航菜单':'Navigation menu';$('closeDetail').ariaLabel=lang==='cn'?'关闭':'Close';$('previousButton').ariaLabel=lang==='cn'?'上一条记录':'Previous record';$('nextButton').ariaLabel=lang==='cn'?'下一条记录':'Next record';renderLists();renderResult();renderDetail();requestAnimationFrame(fitNav)}
function fitNav(){const nav=$('navigation');if(!nav.classList.contains('compact')){if(nav.scrollWidth>nav.clientWidth||$('brand').offsetWidth+$('navLinks').scrollWidth+100>nav.clientWidth)nav.classList.add('compact')}else{nav.classList.remove('compact');if($('brand').offsetWidth+$('navLinks').scrollWidth+100>nav.clientWidth)nav.classList.add('compact');else closeMenu()}}
function closeMenu(){$('navigation').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}
function showPage(next,remember=true){closeMenu();if(next!==page){if(remember)historyStack.push({page,scroll:window.scrollY});page=next;window.scrollTo(0,0)}document.querySelectorAll('.page').forEach(e=>e.hidden=e.id!=='page-'+page);document.querySelectorAll('[data-page]').forEach(e=>{e.classList.toggle('active',e.dataset.page===page);if(e.closest('nav'))e.setAttribute('aria-current',e.dataset.page===page?'page':'false')})}
function openOverlay(id){lastFocus=document.activeElement;$(id).hidden=false;document.body.style.overflow='hidden';$(id).querySelector('.dialog').focus()}
function closeOverlay(id){$(id).hidden=true;if(id==='detailOverlay'){stopPoll('detail');detailWaiting=false}if($('detailOverlay').hidden&&$('confirmOverlay').hidden)document.body.style.overflow='';lastFocus?.focus()}
window.airBack=function(){if(!$('confirmOverlay').hidden){closeOverlay('confirmOverlay');return 'false'}if(!$('detailOverlay').hidden){closeOverlay('detailOverlay');return 'false'}if($('navigation').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const prev=historyStack.pop();showPage(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.scroll));return 'false'}return 'true'};
async function api(type,payload,data=SOURCE){const req={type,data};if(payload!==undefined)req.payload=payload;return await callAppBridge(req)}
async function readRecord(row){const data={};for(const field of [...FIELDS,'解盘结果'])data[field]=await api('GetCellValue',field+'/'+row);return data}
async function refreshAll(){const version=++refreshId;const results=await Promise.all([api('GetTableCSV',FIELDS.join(',')),api('GetRecordCount'),api('GetTableCSV','输出偏好')]);const rows=parseCSV(results[0]);const next=rows.map((r,i)=>({row:i+1,data:Object.fromEntries(FIELDS.map((f,j)=>[f,r[j]||'']))}));for(const record of next){record.data['当前进展']=await api('GetCellValue','当前进展/'+record.row);if(version!==refreshId)return}if(version!==refreshId)return;records=next;count=Number(results[1]);if(!Number.isFinite(count))throw new Error(t('readFailed'));const prefs=parseCSV(results[2]);$('statTotal').textContent=count;$('statDirect').textContent=prefs.filter(r=>r[0]==='直接结论').length;$('statDetailed').textContent=prefs.filter(r=>r[0]==='详细讲解').length;renderLists();controls()}
async function refreshSafe(){try{await refreshAll()}catch(e){notify(t('failed')+String(e.message||e))}}
function card(record,recent){const d=record.data;const summary=Array.from(d['当前进展']);return '<article class="record" tabindex="0" role="button" data-row="'+record.row+'" data-recent="'+recent+'" aria-label="'+esc(t('details')+': '+d['事项'])+'"><span class="badge">'+esc(valueLabel(d['历法']))+'</span><h3>'+esc(d['事项'])+'</h3><div class="subline">'+esc([d['起局时间'],d['所在城市'],d['判断目标']].filter(Boolean).join(' · '))+'</div>'+(!recent?'<p class="muted">'+esc(summary.slice(0,40).join('')+(summary.length>40?'…':''))+'</p>':'')+'<footer>'+(!recent?'<div class="actions"><button data-action="view">'+esc(t('details'))+'</button><button data-action="edit">'+esc(t('edit'))+'</button><button data-action="delete" class="danger">'+esc(t('delete'))+'</button></div>':'<span></span>')+'<span class="badge '+(d['输出偏好']==='直接结论'?'solid':'outline')+'">'+esc(valueLabel(d['输出偏好']))+'</span></footer></article>'}
function renderLists(){const q=$('searchInput').value.trim().toLocaleLowerCase(),cal=$('calendarFilter').value,pref=$('preferenceFilter').value;const filtered=records.filter(r=>(!q||['事项','所在城市','判断目标'].some(f=>r.data[f].toLocaleLowerCase().includes(q)))&&(!cal||r.data['历法']===cal)&&(!pref||r.data['输出偏好']===pref));$('recentList').innerHTML=records.slice(0,5).map(r=>card(r,true)).join('')||'<p class="muted">'+t('empty')+'</p>';$('archiveList').innerHTML=filtered.slice(0,limit).map(r=>card(r,false)).join('')||'<p class="muted">'+t(records.length?'noMatch':'empty')+'</p>';$('archiveCount').textContent=filtered.length+' '+t('count');$('moreButton').hidden=filtered.length<=limit}
function getForm(){return Object.fromEntries(FIELDS.map(f=>[f,String(new FormData($('castForm')).get(f)||'').trim()]))}
function fillForm(d){for(const f of FIELDS){const elements=$('castForm').querySelectorAll('[name="'+f+'"]');elements.forEach(e=>{if(e.type==='radio')e.checked=e.value===d[f];else e.value=d[f]||''})}controls()}
function controls(){const valid=['事项','所在城市','判断目标'].every(f=>getForm()[f]);$('submitButton').disabled=busy||waiting||!valid;$('saveButton').disabled=busy||waiting||currentRow<1||!valid;$('deleteButton').disabled=busy||waiting||currentRow<1;$('previousButton').disabled=busy||waiting||currentRow<=1;$('nextButton').disabled=busy||waiting||currentRow<1||currentRow>=count;$('copyButton').disabled=!resultText||waiting;$('clearButton').disabled=busy||waiting;$('againButton').hidden=!resultText;$('againButton').disabled=busy||waiting;$('detailEdit').disabled=busy||waiting;for(const e of $('castForm').elements)if(e.tagName!=='BUTTON')e.disabled=busy||waiting}
function info(d){const labels=['matter','time','calendar','city','target','progress','preference'];return FIELDS.map((f,i)=>'<div><b>'+esc(t(labels[i]))+'：</b>'+esc(valueLabel(d[f]||'—'))+'</div>').join('')}
function markdown(el,text){el.className='markdown';if(!window.marked||!window.DOMPurify){el.textContent=t('unavailable')+'\n\n'+text;return}el.innerHTML=DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:true}));el.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='tablewrap';table.replaceWith(wrap);wrap.append(table)});el.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';let file=raw;try{const u=new URL(raw,location.href);if(/^https?:/.test(raw))file=decodeURIComponent(u.pathname.split('/').pop())}catch(e){}const url='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(file);img.src=url;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=file;img.replaceWith(a);a.append(img)});el.querySelectorAll('a').forEach(a=>{a.rel='noopener noreferrer';a.target='_blank'})}
function stateBody(el,state,text){if(state==='ready'){markdown(el,text);return}el.className='empty';const key=state==='waiting'?'waiting':state==='loading'?'loading':state==='timeout'?'timeout':state==='error'?'readFailed':'emptyResult';el.innerHTML='<i aria-hidden="true" class="fa-solid fa-table-cells '+(state==='waiting'?'spin':'')+'"></i><p>'+esc(t(key))+'</p>'}
function renderResult(){$('resultInfo').hidden=!currentData;if(currentData)$('resultInfo').innerHTML=info(currentData);stateBody($('resultBody'),mainState,resultText);controls()}
function renderDetail(){if(detailData)$('detailInfo').innerHTML=info(detailData);stateBody($('detailBody'),detailState,detailText)}
function stopPoll(key){const p=pollers[key];if(p){p.cancelled=true;clearTimeout(p.timer);clearTimeout(p.deadline)}pollers[key]=null}
function startPoll(key,row){stopPoll(key);const p={cancelled:false,timer:null,deadline:null};pollers[key]=p;if(key==='main'){waiting=true;mainState='waiting';renderResult()}else{detailWaiting=true;detailState='waiting';renderDetail()}const finish=(state,text='')=>{if(p.cancelled)return;stopPoll(key);if(key==='main'){waiting=false;mainState=state;resultText=text;renderResult()}else{detailWaiting=false;detailState=state;detailText=text;renderDetail()}};p.deadline=setTimeout(()=>finish('timeout'),1800000);const tick=async()=>{if(p.cancelled)return;const start=Date.now();try{const text=await api('GetCellValue','解盘结果/'+row);if(p.cancelled)return;if(String(text).trim()){finish('ready',text);await refreshSafe();return}}catch(e){if(!p.cancelled)notify(t('failed')+String(e.message||e))}if(!p.cancelled)p.timer=setTimeout(tick,Math.max(0,1000-(Date.now()-start)))};p.timer=setTimeout(tick,1000)}
function resetForm(){stopPoll('main');waiting=false;currentRow=0;currentData=null;resultText='';mainState='empty';$('castForm').reset();renderResult()}
async function loadRow(row){if(busy||waiting){notify(t('busy'));return}busy=true;mainState='loading';renderResult();try{const d=await readRecord(row);currentRow=row;currentData=d;resultText=d['解盘结果'];fillForm(d);mainState=resultText.trim()?'ready':'waiting';if(!resultText.trim())startPoll('main',row)}catch(e){mainState='error';notify(t('failed')+String(e.message||e))}finally{busy=false;renderResult()}}
async function viewDetail(row){if(busy||waiting){notify(t('busy'));return}busy=true;controls();detailRow=row;detailData=null;detailText='';detailState='loading';$('detailInfo').innerHTML='';openOverlay('detailOverlay');renderDetail();try{const d=await readRecord(row);if($('detailOverlay').hidden)return;detailData=d;detailText=d['解盘结果'];detailState=detailText.trim()?'ready':'waiting';if(!detailText.trim())startPoll('detail',row);renderDetail()}catch(e){detailState='error';renderDetail();notify(t('failed')+String(e.message||e))}finally{busy=false;controls()}}
async function submit(event){event.preventDefault();if(busy||waiting)return;const d=getForm();if(!['事项','所在城市','判断目标'].every(f=>d[f]))return;if(d['历法']==='现在'&&!d['起局时间'])d['起局时间']=localTime();busy=true;controls();try{await api('SubmitRecord',JSON.stringify(d),'奇门排盘');currentRow=1;currentData=d;resultText='';fillForm(d);startPoll('main',1);await refreshSafe()}catch(e){notify(t('failed')+String(e.message||e))}finally{busy=false;controls()}}
async function save(){if(busy||waiting||currentRow<1)return;busy=true;controls();const d=getForm();if(d['历法']==='现在'&&!d['起局时间'])d['起局时间']=localTime();try{for(const field of FIELDS)await api('SetCellValue',field+'/'+currentRow+'/'+d[field]);currentData=d;fillForm(d);renderResult();notify(t('saved'));await refreshSafe()}catch(e){notify(t('partial')+' '+String(e.message||e))}finally{busy=false;controls()}}
function askDelete(row){if(busy||waiting){notify(t('busy'));return}deleteRow=row;openOverlay('confirmOverlay')}
async function remove(){if(busy)return;busy=true;$('confirmDelete').disabled=true;controls();try{await api('DeleteRecord',deleteRow.toString());stopPoll('detail');closeOverlay('confirmOverlay');if(!$('detailOverlay').hidden)closeOverlay('detailOverlay');resetForm();await refreshSafe();notify(t('deleted'))}catch(e){notify(t('failed')+String(e.message||e))}finally{busy=false;$('confirmDelete').disabled=false;controls()}}
async function copy(){if(!resultText)return;try{const div=document.createElement('div');markdown(div,resultText);const text=div.innerText||div.textContent;try{await navigator.clipboard.writeText(text)}catch(e){const input=document.createElement('textarea');input.value=text;input.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();if(!ok)throw new Error('Clipboard unavailable')}notify(t('copied'))}catch(e){notify(t('failed')+String(e.message||e))}}
async function initialize(){
lang=language();translate();showPage('home',false);
document.querySelectorAll('[data-page]').forEach(e=>e.addEventListener('click',()=>showPage(e.dataset.page)));
$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){notify(t('failed')+String(e.message||e))}};
$('menuButton').onclick=()=>{const on=$('navigation').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(on))};
document.addEventListener('click',e=>{if(!$('navigation').contains(e.target))closeMenu()});
$('languageButton').onclick=()=>{lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch(e){}closeMenu();translate()};
$('startButton').onclick=()=>showPage('cast');
$('newButton').onclick=()=>{if(busy||waiting){notify(t('busy'));return}resetForm();showPage('cast')};

$('previousButton').onclick=()=>loadRow(currentRow-1);$('nextButton').onclick=()=>loadRow(currentRow+1);$('saveButton').onclick=save;$('deleteButton').onclick=()=>askDelete(currentRow);$('copyButton').onclick=copy;
$('confirmDelete').onclick=remove;$('cancelDelete').onclick=()=>{if(!busy)closeOverlay('confirmOverlay')};$('closeDetail').onclick=()=>closeOverlay('detailOverlay');
$('detailEdit').onclick=async()=>{if(busy||waiting){notify(t('busy'));return}const row=detailRow;closeOverlay('detailOverlay');showPage('cast');await loadRow(row)};
for(const id of ['detailOverlay','confirmOverlay'])$(id).addEventListener('click',e=>{if(e.target===$(id)&&!(id==='confirmOverlay'&&busy))closeOverlay(id)});
document.addEventListener('keydown',e=>{const overlay=!$('confirmOverlay').hidden?$('confirmOverlay'):!$('detailOverlay').hidden?$('detailOverlay'):null;if(e.key==='Escape'){if(!busy)window.airBack();return}if(e.key==='Tab'&&overlay){const nodes=[...overlay.querySelectorAll('button,input,textarea,select,a[href]')].filter(n=>!n.disabled&&!n.hidden);const first=nodes[0],last=nodes[nodes.length-1];if(!nodes.includes(document.activeElement)){e.preventDefault();first?.focus()}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
