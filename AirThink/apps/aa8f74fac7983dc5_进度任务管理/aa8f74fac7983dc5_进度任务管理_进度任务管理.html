<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("aa8f74fac7983dc5_进度任务管理")
        },
        body: JSON.stringify(request)

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {

  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));

    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

let lang='cn',currentPage='home',historyStack=[],modalOpen=false,modalKind='',busy=false,records=[],boardRecords=[],currentFormRow=0,loadToken=0;
const $=id=>document.getElementById(id), t=k=>I18N[lang][k]||k;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(d,time=true){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`+(time?` ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`:'');}
function pct(v){return Math.min(100,Math.max(0,Number(v)||0));}
function statusLabel(s){return t(({待办:'todo',进行中:'active',阻塞:'blockedStatus',已完成:'done',已取消:'cancelled'})[s]||s);}
function priorityLabel(s){return t(({高:'high',中:'medium',低:'low'})[s]||s);}
function statusClass(s){return ({待办:'todo',进行中:'active',阻塞:'blocked',已完成:'done',已取消:'cancelled'})[s]||'todo';}
function priorityClass(s){return ({高:'high',中:'medium',低:'low'})[s]||'low';}
function csvRecords(text,fields){return parseCSV(String(text||'')).filter(row=>row.some(v=>v!=='' )).map((row,index)=>{const item={_row:index+1};fields.forEach((field,i)=>item[field]=row[i]||'');return item;});}
async function getCSV(fields){return csvRecords(await callAppBridge({type:'GetTableCSV',data:TABLE,payload:fields.join(',')}),fields);}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false');}
function showPage(page,remember=true){if(!['home','board','tasks','stats'].includes(page)||page===currentPage)return;if(remember)historyStack.push({page:currentPage,y:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='stats')renderStats();}
function airBack(){if(modalOpen){closeModal();return 'false';}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false';}if(historyStack.length){const prev=historyStack.pop();showPage(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.y));return 'false';}return 'true';}window.airBack=airBack;
function openModal(title,body,foot='',kind=''){modalOpen=true;modalKind=kind;$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialogFoot').innerHTML=foot;$('overlay').classList.add('open');$('overlay').classList.toggle('markdown-overlay',kind==='markdown');document.body.style.overflow='hidden';}
function closeModal(){if(busy)return;modalOpen=false;modalKind='';$('overlay').classList.remove('open','markdown-overlay');document.body.style.overflow='';}
function renderText(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('desktopLang').textContent=lang==='cn'?'EN':'中文';const priority=$('priorityFilter').value,status=$('statusFilter').value;$('priorityFilter').innerHTML='<option value="">'+t('allPriority')+'</option>'+PRIORITIES.map(v=>`<option value="${v}">${priorityLabel(v)}</option>`).join('');$('statusFilter').innerHTML='<option value="">'+t('allStatus')+'</option>'+STATUSES.map(v=>`<option value="${v}">${statusLabel(v)}</option>`).join('');$('priorityFilter').value=priority;$('statusFilter').value=status;renderHome();renderBoard();renderTable();if(currentPage==='stats')renderStats();}
function renderHome(){const recent=[...records].sort((a,b)=>String(b['开始时间']).localeCompare(String(a['开始时间']))).slice(0,5);$('recentList').innerHTML=recent.length?recent.map(r=>`<button class="recent-item" data-action="detail" data-row="${r._row}"><div><div class="recent-name">${esc(r['任务内容'])}</div><div class="recent-meta"><span>${esc(r['开始时间'])}</span><span>${pct(r['进度'])}%</span></div></div><div><span class="badge ${priorityClass(r['优先级'])}">${priorityLabel(r['优先级'])}</span> <span class="badge ${statusClass(r['状态'])}">${statusLabel(r['状态'])}</span></div></button>`).join(''):`<div class="empty">${t('empty')}</div>`;}
function renderBoard(){const groups=STATUSES.slice(0,4);$('boardColumns').innerHTML=groups.map(s=>{const items=boardRecords.filter(r=>r['状态']===s);return `<section class="board-column"><h2>${statusLabel(s)} <span>${items.length}</span></h2><div class="board-items">${items.length?items.map(r=>`<button class="board-task" data-action="detail" data-row="${r._row}"><h3>${esc(r['任务内容'])}</h3><span class="badge ${priorityClass(r['优先级'])}">${priorityLabel(r['优先级'])}</span><div class="progress ${statusClass(s)}"><b style="width:${pct(r['进度'])}%"></b></div><div class="meta">${pct(r['进度'])}% · ${esc(r['开始时间'])}</div>${s==='阻塞'&&r['阻塞原因']?`<div class="block-reason"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(r['阻塞原因'])}</div>`:''}</button>`).join(''):`<div class="empty">${t('empty')}</div>`}</div></section>`;}).join('');}
function renderTable(){const search=$('searchInput').value.trim().toLocaleLowerCase(),pri=$('priorityFilter').value,status=$('statusFilter').value;const shown=records.filter(r=>String(r['任务内容']).toLocaleLowerCase().includes(search)&&(!pri||r['优先级']===pri)&&(!status||r['状态']===status));$('taskTableBody').innerHTML=shown.length?shown.map(r=>`<tr><td>${esc(r['任务内容'])}</td><td><span class="badge ${priorityClass(r['优先级'])}">${priorityLabel(r['优先级'])}</span></td><td><span class="badge ${statusClass(r['状态'])}">${statusLabel(r['状态'])}</span></td><td><div>${pct(r['进度'])}%</div><div class="progress ${statusClass(r['状态'])}"><b style="width:${pct(r['进度'])}%"></b></div></td><td>${esc(r['开始时间'])}</td><td>${esc(r['完成时间'])}</td><td><div class="row-actions"><button class="btn ghost small" data-action="edit" data-row="${r._row}">${t('edit')}</button><button class="btn danger small" data-action="delete" data-row="${r._row}">${t('delete')}</button><button class="btn ghost small" data-action="report" data-row="${r._row}">${t('report')}</button></div></td></tr>`).join(''):`<tr><td colspan="7" class="empty">${t('empty')}</td></tr>`;}
function renderStats(){if(!window.Highcharts){$('statusChart').textContent=t('error');$('priorityChart').textContent=t('error');return;}const dark=document.documentElement.dataset.theme==='dark',text=dark?'#eef4ff':'#172b48',bg=dark?'#17253a':'#fff';const count=(list,field,values)=>values.map(v=>({name:field==='状态'?statusLabel(v):priorityLabel(v),y:list.filter(r=>r[field]===v).length}));const common={credits:{enabled:false},chart:{backgroundColor:bg,style:{fontFamily:'system-ui'}},title:{text:null},legend:{itemStyle:{color:text}},accessibility:{enabled:false}};Highcharts.chart('statusChart',{...common,chart:{...common.chart,type:'pie'},tooltip:{pointFormat:'<b>{point.y}</b>'},series:[{name:t('status'),data:count(records,'状态',STATUSES),colors:['#96a8c1','#2867cf','#dc5260','#28a574','#798799']}]});Highcharts.chart('priorityChart',{...common,chart:{...common.chart,type:'column'},xAxis:{categories:PRIORITIES.map(priorityLabel),labels:{style:{color:text}}},yAxis:{title:{text:null},min:0,allowDecimals:false,labels:{style:{color:text}}},legend:{enabled:false},series:[{name:t('priority'),data:count(records,'优先级',PRIORITIES).map(x=>x.y),color:'#3672d6'}]});const ranking=records.filter(r=>r['状态']==='进行中').sort((a,b)=>pct(b['进度'])-pct(a['进度']));$('progressRank').innerHTML=ranking.length?ranking.map(r=>`<div class="rank-row"><span class="rank-name" title="${esc(r['任务内容'])}">${esc(r['任务内容'])}</span><div class="progress"><b style="width:${pct(r['进度'])}%"></b></div><strong>${pct(r['进度'])}%</strong></div>`).join(''):`<div class="empty">${t('empty')}</div>`;}
async function refresh(){const token=++loadToken;try{const [total,statusRows,list,board]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),getCSV(['状态']),getCSV(LIST_FIELDS),getCSV(BOARD_FIELDS)]);if(token!==loadToken)return;records=list;boardRecords=board;$('statTotal').textContent=String(total).trim();$('statActive').textContent=statusRows.filter(r=>r['状态']==='进行中').length;$('statBlocked').textContent=statusRows.filter(r=>r['状态']==='阻塞').length;$('statDone').textContent=statusRows.filter(r=>r['状态']==='已完成').length;renderText();}catch(e){openModal(t('error'),`<div class="error">${esc(e.message||e)}</div>`,`<button class="btn ghost" data-action="close">${t('cancel')}</button>`);}}
function fieldLabel(field){return ({'任务内容':'content','优先级':'priority','状态':'status','开始时间':'start','完成时间':'finish','进度':'progress','备注':'notes','阻塞原因':'reason','等待中':'waitingField'})[field]||field;}
function formHtml(){return `<form id="taskForm" class="form-grid">${FIELDS.map((field,i)=>{const id=`taskForm_field_${i}`,label=t(fieldLabel(field));let control;if(field==='优先级'||field==='状态'){const values=field==='优先级'?PRIORITIES:STATUSES;control=`<select id="${id}" name="${field}">${values.map(v=>`<option value="${v}">${field==='优先级'?priorityLabel(v):statusLabel(v)}</option>`).join('')}</select>`;}else if(field==='任务内容'||field==='备注'||field==='阻塞原因'||field==='等待中'){control=`<textarea id="${id}" name="${field}" ${field==='任务内容'?'required':''}></textarea>`;}else{control=`<input id="${id}" name="${field}" type="${field==='进度'?'number':'datetime-local'}" ${field==='进度'?'min="0" max="100" step="1"':''}>`;}return `<div class="field ${['任务内容','备注','阻塞原因','等待中'].includes(field)?'wide':''}"><label for="${id}">${esc(label)}</label>${control}</div>`;}).join('')}</form>`;}
function openForm(row=0){if(busy)return;currentFormRow=row;openModal(row?t('editTask'):t('newTask'),formHtml(),`<button class="btn ghost" data-action="close">${t('cancel')}</button><button class="btn primary" id="submitTask" data-action="submit">${t('save')}</button>`,'form');if(row){$('submitTask').disabled=true;loadForm(row);}else{$('taskForm_field_3').value=fmtDate(new Date()).replace(' ','T');$('taskForm_field_5').value='0';}}
async function loadForm(row){try{for(let i=0;i<FIELDS.length;i++){const field=FIELDS[i],value=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`${field}/${row}`});const input=$(`taskForm_field_${i}`);if(!input||!modalOpen)return;input.value=(field==='开始时间'||field==='完成时间')?String(value||'').replace(' ','T').slice(0,19):String(value||'');}$('submitTask').disabled=false;}catch(e){$('dialogBody').insertAdjacentHTML('afterbegin',`<div class="error">${esc(e.message||e)}</div>`);}}
function formData(){const data={};FIELDS.forEach((field,i)=>{let value=$(`taskForm_field_${i}`).value.trim();if(field==='开始时间'||field==='完成时间')value=value?value.replace('T',' ')+(value.length===16?':00':''):'';data[field]=value;});return data;}
async function submitForm(){if(busy||!$('taskForm').reportValidity())return;const data=formData();if(!data['任务内容']){alert(t('required'));return;}busy=true;$('submitTask').disabled=true;try{if(currentFormRow){for(const field of FIELDS)await callAppBridge({type:'SetCellValue',data:TABLE,payload:`${field}/${currentFormRow}/${data[field]}`});busy=false;closeModal();await refresh();}else{await callAppBridge({type:'SubmitRecord',data:WRITE_TABLE,payload:JSON.stringify(data)});openModal(t('reportResult'),`<div class="waiting"><span class="spinner"></span>${t('loading')}</div>`,'','markdown');await refresh();await pollReport();}}catch(e){busy=false;$('submitTask')&&($('submitTask').disabled=false);$('dialogBody').insertAdjacentHTML('afterbegin',`<div class="error">${esc(e.message||e)}</div>`);}}
async function pollReport(){const end=Date.now()+1800000;while(Date.now()<end){await new Promise(resolve=>setTimeout(resolve,1000));try{const result=await callAppBridge({type:'轮询',data:WRITE_TABLE,payload:'任务处理'});if(String(result||'').trim()){busy=false;showMarkdown(t('reportResult'),result);await refresh();return;}}catch(e){busy=false;openModal(t('error'),`<div class="error">${esc(e.message||e)}</div>`,`<button class="btn ghost" data-action="close">${t('cancel')}</button>`);return;}}busy=false;openModal(t('reportResult'),`<div class="error">${t('timeout')}</div>`,`<button class="btn ghost" data-action="close">${t('cancel')}</button>`,'markdown');await refresh();}
function markdownHtml(content){if(!window.marked||!window.DOMPurify)return `<pre>${esc(content)}</pre>`;return DOMPurify.sanitize(marked.parse(String(content)),{ADD_ATTR:['target']});}
function showMarkdown(title,content){openModal(title,`<article class="markdown-body" id="markdownContent">${markdownHtml(content||t('noReport'))}</article>`,`<button class="btn ghost" data-action="close">${t('cancel')}</button>`,'markdown');prepareMarkdownImages();}
async function showReport(row){openModal(t('reportResult'),`<div class="waiting"><span class="spinner"></span></div>`,'','markdown');try{const report=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`任务处理/${row}`});showMarkdown(t('reportResult'),report);}catch(e){openModal(t('error'),`<div class="error">${esc(e.message||e)}</div>`,'','markdown');}}
async function showDetail(row){openModal(t('details'),`<div class="waiting"><span class="spinner"></span></div>`,'');try{const values={};for(const field of FIELDS)values[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`${field}/${row}`});const report=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`任务处理/${row}`});const cells=FIELDS.map(field=>`<div class="detail-cell"><strong>${esc(t(fieldLabel(field)))}</strong><span>${esc(values[field])}</span></div>`).join('');$('dialogBody').innerHTML=`<div class="detail-grid">${cells}</div><h3 class="report-title">${t('reportResult')}</h3><article class="markdown-body" id="markdownContent">${markdownHtml(report||t('noReport'))}</article>`;$('dialogFoot').innerHTML=`<button class="btn ghost" data-action="close">${t('cancel')}</button><button class="btn primary" data-action="edit" data-row="${row}">${t('edit')}</button>`;$('markdownContent').querySelectorAll('img').forEach(img=>img.addEventListener('click',()=>{const name=(img.getAttribute('src')||'').split('/').pop();if(name)window.open('http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(decodeURIComponent(name)),'_blank');}));}catch(e){$('dialogBody').innerHTML=`<div class="error">${esc(e.message||e)}</div>`;}}
async function deleteTask(row){if(busy||!confirm(t('confirmDelete')))return;busy=true;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});busy=false;await refresh();}catch(e){busy=false;openModal(t('error'),`<div class="error">${esc(e.message||e)}</div>`);}}
function updateNavLayout(){$('topbar').classList.remove('compact');const width=$('brand').offsetWidth+$('desktopNav').scrollWidth+$('desktopLang').offsetWidth+100;$('topbar').classList.toggle('compact',width>window.innerWidth);if(!$('topbar').classList.contains('compact')&&window.innerWidth>760)closeMenu();}
function prepareMarkdownImages(){const root=$('markdownContent');if(!root)return;root.querySelectorAll('img').forEach(img=>{let src=img.getAttribute('src')||'';if(src&&!/^(?:https?:|data:|blob:)/i.test(src)){src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);img.src=src;}img.addEventListener('click',()=>{const name=(img.getAttribute('src')||'').split('/').pop();if(name)window.open('http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(decodeURIComponent(name)),'_blank');});});}
function languageDefault(){const url=new URLSearchParams(location.search).get('lang');if(url==='cn'||url==='en')return url;const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn';const languages=navigator.languages;if(!languages||!languages.length)return 'cn';return languages.some(v=>/^zh(?:-|$)/i.test(v))?'cn':'en';}
async function initialize(){lang=languageDefault();renderText();document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){showPage(nav.dataset.page);return;}const langBtn=e.target.closest('[data-lang]');if(langBtn){lang=langBtn.dataset.lang;localStorage.setItem('iThinkAir_UiLanguage',lang);closeMenu();renderText();return;}const action=e.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);switch(action.dataset.action){case'new':openForm();break;case'edit':openForm(row);break;case'delete':await deleteTask(row);break;case'report':await showReport(row);break;case'detail':await showDetail(row);break;case'submit':await submitForm();break;case'close':closeModal();break;}return;}if($('mobileMenu').classList.contains('open')&&!e.target.closest('#mobileMenu')&&!e.target.closest('#menuButton'))closeMenu();});$('desktopLang').addEventListener('click',()=>{lang=lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',lang);renderText();});$('menuButton').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open));});$('brand').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false);});$('closeDialog').addEventListener('click',closeModal);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal();});$('searchInput').addEventListener('input',renderTable);$('priorityFilter').addEventListener('change',renderTable);$('statusFilter').addEventListener('change',renderTable);document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack();});document.addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250);});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,select,textarea'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100);});try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}await refresh();}
document.addEventListener('DOMContentLoaded', () => { (async () => { await initialize(); updateNavLayout(); })(); window.addEventListener('resize',updateNavLayout); document.addEventListener('click',()=>setTimeout(updateNavLayout,0),true); });
</script>
