te-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.recent-item{display:block;width:100%;text-align:left;color:var(--ink);padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}.recent-item:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(26,62,110,.16)}.recent-item h3{font-size:18px;line-height:1.4;margin:10px 0 17px;overflow-wrap:anywhere}.recent-meta{display:flex;flex-wrap:wrap;gap:7px}.tag{background:var(--soft);color:var(--blue2);border-radius:7px;padding:3px 8px;font-size:12px}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;background:var(--surface)}.form-card{padding:27px;max-width:970px}.form-card h2{margin:0 0 20px;font-size:21px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{min-width:0}.field.wide{grid-column:1/-1}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;min-height:45px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:9px 12px}.file-row{display:flex;gap:9px}.file-row input{flex:1;min-width:0}.form-actions{margin-top:24px}.notice{margin-top:20px;padding:16px 18px;border-radius:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}.notice.error{background:#fff0f1;color:#ad2840;border-color:#f1c5ce}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #a8c8f8;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite;vertical-align:-4px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.preview-card{margin-top:23px;padding:22px}.preview-card h2{margin:0 0 15px}.preview-frame{display:block;width:100%;height:min(70vh,690px);min-height:380px;border:1px solid var(--line);border-radius:12px;background:#fff}.preview-actions{display:flex;justify-content:flex-end;margin-top:17px}. <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';

        method: 'POST',

async function exportFileA(title, url) {

    }

            }
          }]

        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案

    const objectUrl = URL.createObjectURL(blob);

    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);

    setTimeout(() => {
      document.body.removeChild(link);

    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    buttonContainer.style.cssText = `

    `;
    
    // 创建拍照按钮

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function defaultLanguage(){try{const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored) return stored==='en'?'en':'cn'}catch(e){}const param=new URLSearchParams(location.search).get('lang');if(param==='cn'||param==='en')return param;const langs=navigator.languages;if(!langs||!langs.length)return 'cn';return langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function applyLanguage(next){language=next;document.documentElement.lang=next==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});byId('desktopLangButton').textContent=next==='cn'?'EN':'中文';byId('mobileLangButton').textContent=next==='cn'?'English':'中文';renderRecent();renderHistory()}
function toggleLanguage(){const next=language==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',next)}catch(e){}applyLanguage(next);closeMenu()}
function closeMenu(){byId('mobileMenu').classList.remove('open');byId('menuButton').setAttribute('aria-expanded','false')}
function showPage(page,record=true){if(!['home','generator','history'].includes(page))return;if(record&&page!==currentPage)historyStack.push({page:currentPage,scroll:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='home')return loadHome();if(page==='history')return loadHistory()}
function showToast(message){const el=byId('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4500)}
function safeError(error){return error instanceof Error?error.message:String(error)}
function parseRows(csv){return parseCSV(String(csv||'').replace(/^\uFEFF/,''))}
let recentRows=[], historyRows=[];
function renderRecent(){const grid=byId('recentGrid');grid.replaceChildren();if(!recentRows.length){const e=document.createElement('div');e.className='empty';e.textContent=tr('empty');grid.append(e);return}recentRows.slice(0,6).forEach((row,i)=>{const button=document.createElement('button');button.type='button';button.className='recent-item';const eyebrow=document.createElement('div');eyebrow.className='eyebrow';eyebrow.textContent='#'+String(i+1).padStart(2,'0');const title=document.createElement('h3');title.textContent=row[0]||'—';const meta=document.createElement('div');meta.className='recent-meta';[row[1],row[2],row[3]?`${row[3]} ${tr('pages')}`:''].filter(Boolean).forEach(value=>{const tag=document.createElement('span');tag.className='tag';tag.textContent=value;meta.append(tag)});button.append(eyebrow,title,meta);button.addEventListener('click',async()=>{await showPage('history');const target=byId('history-row-'+(i+1));target?.scrollIntoView({block:'center',behavior:'smooth'});target?.focus()});grid.append(button)})}
async function loadHome(){try{const [count,csv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'主题,展示风格,受众,页数'})]);byId('totalCount').textContent=String(count).trim()||'0';recentRows=parseRows(csv);renderRecent()}catch(e){byId('totalCount').textContent='—';recentRows=[];renderRecent();showToast(tr('failed')+': '+safeError(e))}}
function renderHistory(){const body=byId('historyBody');body.replaceChildren();if(!historyRows.length){const row=document.createElement('tr');const cell=document.createElement('td');cell.colSpan=7;cell.className='muted';cell.style.textAlign='center';cell.textContent=tr('empty');row.append(cell);body.append(row);return}historyRows.forEach((values,index)=>{const rowNumber=index+1;const row=document.createElement('tr');row.id='history-row-'+rowNumber;row.tabIndex=-1;for(let i=0;i<6;i++){const cell=document.createElement('td');cell.textContent=values[i]||'—';row.append(cell)}const actions=document.createElement('td');const wrap=document.createElement('div');wrap.className='row-actions';const preview=document.createElement('button');preview.className='secondary';preview.type='button';preview.innerHTML='<i class="fa-solid fa-play"></i> ';preview.append(document.createTextNode(tr('preview')));preview.addEventListener('click',()=>openHistoryPreview(rowNumber,values[0]));const del=document.createElement('button');del.className='danger';del.type='button';del.innerHTML='<i class="fa-solid fa-trash"></i> ';del.append(document.createTextNode(tr('delete')));del.addEventListener('click',()=>deleteHistoryRow(rowNumber));wrap.append(preview,del);actions.append(wrap);row.append(actions);body.append(row)})}
async function loadHistory(){byId('historyStatus').textContent=tr('loading');try{const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'主题,受众,页数,展示风格,音色,语速'});historyRows=parseRows(csv);renderHistory();byId('historyStatus').textContent=''}catch(e){byId('historyStatus').textContent=tr('failed')+': '+safeError(e)}}
function fileURL(filename){return 'http://' + window.location.hostname + ':3130/private/'+encodeURIComponent(String(filename).trim())}
async function openHistoryPreview(row,title){try{const filename=String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'HTML文件/'+row})).trim();if(!filename){showToast(tr('missingFile'));return}byId('modalTitle').textContent=title?`${tr('preview')} · ${title}`:tr('preview');byId('modalFrame').src=fileURL(filename);byId('previewModal').hidden=false;document.body.style.overflow='hidden';byId('closeModalButton').focus()}catch(e){showToast(tr('failed')+': '+safeError(e))}}
function closeModal(){byId('previewModal').hidden=true;byId('modalFrame').src='about:blank';document.body.style.overflow=''}
async function deleteHistoryRow(row){if(!window.confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});showToast(tr('deleted'));await loadHistory()}catch(e){showToast(tr('failed')+': '+safeError(e))}}
function updateWaiting(message,isError=false){const el=byId('generationStatus');el.hidden=false;el.classList.toggle('error',isError);el.innerHTML='';if(!isError){const spin=document.createElement('span');spin.className='spinner';el.append(spin)}el.append(document.createTextNode(message))}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function pollGeneratedFile(token){const deadline=Date.now()+1800*1000;while(token===pollToken&&Date.now()<deadline){await delay(1000);if(token!==pollToken)return;try{const result=String(await callAppBridge({type:'轮询',data:TABLE,payload:'HTML文件'})).trim();if(result){const filename=String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'HTML文件/1'})).trim();if(!filename){throw new Error(tr('missingFile'))}currentRow=1;byId('resultFrame').src=fileURL(filename);byId('resultPanel').hidden=false;byId('generationStatus').hidden=true;byId('resultPanel').scrollIntoView({behavior:'smooth',block:'start'});await loadHome();return}}catch(e){updateWaiting(tr('failed')+': '+safeError(e),true);return}}if(token===pollToken)updateWaiting(tr('timeout'),true)}
async function submitGeneration(event){event.preventDefault();if(polling)return;const form=byId('generateForm');if(!form.reportValidity())return;const data={};new FormData(form).forEach((value,key)=>{data[key]=String(value)});polling=true;byId('submitButton').disabled=true;byId('resultPanel').hidden=true;byId('resultFrame').src='about:blank';updateWaiting(tr('waiting'));try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});currentRow=1;updateWaiting(tr('waiting'));await pollGeneratedFile(++pollToken)}catch(e){updateWaiting(tr('failed')+': '+safeError(e),true)}finally{polling=false;byId('submitButton').disabled=false}}
function resetGeneration(){if(polling)return;pollToken++;currentRow=0;byId('generateForm').reset();byId('resultPanel').hidden=true;byId('resultFrame').src='about:blank';byId('generationStatus').hidden=true;window.scrollTo({top:0,behavior:'smooth'});byId('generateForm-topic').focus()}
function airBack(){if(!byId('previewModal').hidden){closeModal();return 'false'}if(byId('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const item=historyStack.pop();showPage(item.page,false);requestAnimationFrame(()=>window.scrollTo(0,item.scroll));return 'false'}return 'true'}
window.airBack=airBack;
async function initialize(){language=defaultLanguage();applyLanguage(language);try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){document.body.classList.toggle('dark',window.matchMedia?.('(prefers-color-scheme: dark)').matches||false)}document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));byId('brandButton').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});byId('startButton').addEventListener('click',()=>showPage('generator'));byId('viewHistoryButton').addEventListener('click',()=>showPage('history'));byId('desktopLangButton').addEventListener('click',toggleLanguage);byId('mobileLangButton').addEventListener('click',toggleLanguage);byId('menuButton').addEventListener('click',()=>{const open=byId('mobileMenu').classList.toggle('open');byId('menuButton').setAttribute('aria-expanded',String(open))});document.addEventListener('pointerdown',event=>{if(!byId('topbar').contains(event.target))closeMenu()});byId('selectMaterialButton').addEventListener('click',async()=>{try{const name=await callAppBridge({type:'SelectFile'});if(name)byId('generateForm-material').value=String(name)}catch(e){showToast(tr('selectFailed')+': '+safeError(e))}});byId('generateForm').addEventListener('submit',submitGeneration);byId('createAgainButton').addEventListener('click',resetGeneration);byId('closeModalButton').addEventListener('click',closeModal);byId('previewModal').addEventListener('pointerdown',event=>{if(event.target===byId('previewModal'))closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!byId('previewModal').hidden)closeModal();else closeMenu()}});document.addEventListener('focusin',event=>{if(event.target.matches('input,select,textarea'))setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active?.matches('input,select,textarea'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),120)})}await loadHome()}
document.addEventListener('DOMContentLoaded',async()=>{await (async () => {    await initialize();  })()});
</script>
</body>
</html>
