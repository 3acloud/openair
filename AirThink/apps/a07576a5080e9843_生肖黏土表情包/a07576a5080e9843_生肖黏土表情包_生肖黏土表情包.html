<script>
var url;
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("a07576a5080e9843_生肖黏土表情包")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function updateControls(){const locked=state.busy||state.polling;document.querySelectorAll('#clayForm input').forEach(n=>{n.disabled=locked});$('submitButton').disabled=locked||!formValid();$('saveButton').disabled=locked||state.row<1||!formValid();$('previousButton').disabled=locked||state.row<=1;$('nextButton').disabled=locked||state.count===null||state.row>=state.count;document.querySelectorAll('[data-action="new"]').forEach(n=>{n.disabled=locked});$('rowIndicator').textContent=state.row+' / '+(state.count===null?'—':state.count);$('takeToStudio').disabled=locked;$('retryButton').disabled=locked||state.loading;document.querySelectorAll('[data-card-action]').forEach(n=>{n.disabled=locked})}
function emptyHTML(key,button=false){return '<div class="empty"><i class="fa-solid fa-box-open" aria-hidden="true"></i><p>'+t(key)+'</p>'+(button?'<button class="btn primary" data-action="new">'+t('start')+'</button>':'')+'</div>'}
function cardHTML(record,recent){const values=record.values;return '<article class="set-card" tabindex="0" role="button" data-row="'+record.row+'" data-recent="'+recent+'" aria-label="'+escapeHTML(t('view')+' · '+optionText(values[1]))+'"><div class="card-top"><div class="tags">'+splitZodiac(values[0]).map(z=>'<span class="tag">'+escapeHTML(optionText(z))+'</span>').join('')+'</div><span class="count-badge">'+escapeHTML(values[3])+' '+t('sheets')+'</span></div><h3>'+escapeHTML(optionText(values[1])||t('unknown'))+'</h3><p>'+escapeHTML(optionText(values[2])||t('unknown'))+'</p><div class="card-footer"><button class="btn small" data-card-action="view" data-row="'+record.row+'"><i class="fa-solid fa-eye"></i>'+t('view')+'</button>'+(recent?'':'<button class="btn small" data-card-action="edit" data-row="'+record.row+'"><i class="fa-solid fa-sliders"></i>'+t('edit')+'</button><button class="btn small danger" data-card-action="delete" data-row="'+record.row+'"><i class="fa-regular fa-trash-can"></i>'+t('remove')+'</button>')+'</div></article>'}
function like(value,part){return String(value).toLocaleLowerCase().includes(String(part).toLocaleLowerCase())}
function filteredRecords(){const query=$('gallerySearch').value.trim().toLocaleLowerCase(),z=$('zodiacFilter').value,j=$('jobFilter').value,s=$('sceneFilter').value,c=$('countFilter').value;const list=state.records.filter(r=>{const a=r.values;const search=[a[0],a[1],...splitZodiac(a[0]).map(optionText),optionText(a[1])].join(' ').toLocaleLowerCase();return (!query||like(search,query))&&(!z||like(a[0],z))&&(!j||a[1]===j)&&(!s||a[2]===s)&&(!c||a[3]===c)});return list.sort((a,b)=>$('sortFilter').value==='old'?b.row-a.row:a.row-b.row)}
function renderLists(){if(!state.loaded){$('recentGrid').innerHTML=emptyHTML(state.notice?'loadError':'loading');$('galleryGrid').innerHTML=emptyHTML(state.notice?'loadError':'loading');$('galleryMeta').textContent='';return}$('totalStat').textContent=state.count;$('sixteenStat').textContent=state.records.filter(r=>r.values[3]==='16').length;$('twentyFourStat').textContent=state.records.filter(r=>r.values[3]==='24').length;$('recentGrid').innerHTML=state.records.length?state.records.slice(0,6).map(r=>cardHTML(r,true)).join(''):emptyHTML('emptyGallery',true);const filtered=filteredRecords();$('galleryMeta').textContent=filtered.length+' / '+state.records.length+' '+t('found');$('galleryGrid').innerHTML=filtered.length?filtered.map(r=>cardHTML(r,false)).join(''):state.records.length?emptyHTML('noResults')+'<div><button class="btn" data-action="clear">'+t('clear')+'</button></div>':emptyHTML('emptyGallery',true);updateControls()}
async function request(type,payload,data=SOURCE){const req={type,data};if(payload!==undefined)req.payload=String(payload);const result=await callAppBridge(req);if(typeof result==='string'&&/^\s*(?:Error:|错误[:：]|失败[:：])/.test(result))throw new Error(result);return result}
async function refreshData(){state.loading=true;updateControls();try{const results=await Promise.all([request('GetTableCSV',FIELDS.join(',')),request('GetRecordCount')]);const count=Number(String(results[1]).trim());if(!String(results[1]).trim()||!Number.isInteger(count)||count<0)throw new Error('Invalid record count');const rows=parseCSV(String(results[0]??''));state.records=rows.map((values,index)=>({row:index+1,values:FIELDS.map((_,i)=>String(values[i]??''))}));state.count=count;state.loaded=true;notice('');renderLists();return true}catch(error){console.error(error);notice('loadError');renderLists();return false}finally{state.loading=false;updateControls()}}
function fileDownloadURL(file){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(file)}
function resolveImageURL(raw){const value=String(raw||'').trim();if(/^https?:\/\//i.test(value))return value;if(/^data:image\/(?:png|jpeg|gif|webp|avif);base64,/i.test(value))return value;if(/^(?:javascript|vbscript|data):/i.test(value))return '';if(value.startsWith('/download/'))return 'https://www.ithinkair.com:3031'+value;return fileDownloadURL(value)}
function renderMarkdown(element,text){if(!window.marked||!window.DOMPurify){element.textContent=t('markdownError');return}element.innerHTML=DOMPurify.sanitize(marked.parse(String(text),{gfm:true,breaks:true}),{ADD_TAGS:['details','summary'],FORBID_TAGS:['script','iframe','style','form'],FORBID_ATTR:['style']});element.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';const imageURL=resolveImageURL(raw);if(!imageURL){img.remove();return}img.src=imageURL;img.loading='lazy';img.alt=img.alt||t('formTitle');img.dataset.download=imageURL;img.tabIndex=0;img.setAttribute('role','link');img.title=state.lang==='en'?'Download image':'点击下载图片';img.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();window.open(imageURL,'_blank','noopener')}})});element.querySelectorAll('a').forEach(a=>{a.setAttribute('rel','noopener noreferrer');a.target='_blank'})}
function renderWall(){const content=$('wallContent'),box=$('wallState');content.hidden=state.wall!=='ready';box.hidden=state.wall==='ready';if(state.wall==='ready'){renderMarkdown(content,state.markdown);return}const key=({empty:'emptyWall',loading:'loading',waiting:'baking',pending:'pending',error:'pollError',timeout:'timeout'})[state.wall]||'emptyWall';const sub=state.wall==='waiting'?'waiting':state.wall==='empty'?'emptyWallSub':state.wall==='pending'?'pendingSub':null;box.innerHTML='<div class="wall-empty '+(state.wall==='waiting'?'waiting':'')+'"><div class="clay-blob"><i class="fa-solid '+(state.wall==='waiting'?'fa-hourglass-half':'fa-paw')+'"></i></div><h3>'+t(key)+'</h3>'+(sub?'<p>'+t(sub)+'</p>':'')+(['error','timeout','pending'].includes(state.wall)?'<button class="btn" data-action="reload-row">'+t('retry')+'</button>':'')+'</div>'}
function renderDetail(){const body=$('detailBody');if(state.detailStatus==='ready')renderMarkdown(body,state.detailMarkdown);else body.innerHTML=emptyHTML(state.detailStatus==='error'?'loadError':state.detailStatus==='pending'?'pending':'loading')}
function openModal(id){if(state.modalStack.some(m=>m.id===id))return;state.modalStack.push({id,focus:document.activeElement});$(id).hidden=false;document.body.style.overflow='hidden';$(id).querySelector('.dialog').focus();syncInert()}
function syncInert(){const top=state.modalStack.at(-1)?.id;$('main').inert=!!top;document.querySelector('.top-shell').inert=!!top;for(const id of ['detailOverlay','confirmOverlay'])$(id).inert=!!top&&id!==top}
function closeModal(){const modal=state.modalStack.pop();if(!modal)return;$(modal.id).hidden=true;if(modal.id==='detailOverlay')state.detailToken++;document.body.style.overflow=state.modalStack.length?'hidden':'';syncInert();if(modal.focus?.isConnected)modal.focus.focus()}
window.airBack=function(){if(state.modalStack.length){closeModal();return'false'}if(!$('mobileNav').hidden){closeMenu();return'false'}const previous=state.history.pop();if(previous){showPage(previous.page,false,previous.scroll);return'false'}return'true'};
function newSet(){if(state.busy||state.polling){toast('busy');return}state.readToken++;state.row=0;state.markdown='';state.wall='empty';fillForm(defaults());renderWall();showPage('studio');updateControls()}
async function loadRow(row){if(state.busy||state.polling){toast('busy');return}if(row<1)return;const token=++state.readToken;state.busy=true;state.wall='loading';renderWall();updateControls();try{const count=Number(await request('GetRecordCount'));if(!Number.isInteger(count)||count<0||row>count)throw new Error('Record no longer exists');const values={};for(const field of [...FIELDS,'表情包']){values[field]=String(await request('GetCellValue',field+'/'+row)??'')}if(token!==state.readToken)return;state.count=count;state.row=row;fillForm(values);state.markdown=values['表情包'];state.wall=state.markdown.trim()?'ready':'pending';renderWall()}catch(error){console.error(error);state.wall='error';renderWall();toast('loadError')}finally{state.busy=false;updateControls()}}
async function openDetail(row){if(state.busy||state.polling){toast('busy');return}const token=++state.detailToken;state.detailRow=row;state.detailStatus='loading';state.detailMarkdown='';openModal('detailOverlay');renderDetail();await loadRow(row);if(token!==state.detailToken)return;state.detailMarkdown=state.markdown;state.detailStatus=state.wall==='error'?'error':state.detailMarkdown.trim()?'ready':'pending';renderDetail()}
function invalidateLists(){state.loaded=false;state.records=[];state.count=null;['totalStat','sixteenStat','twentyFourStat'].forEach(id=>{$(id).textContent='—'});renderLists()}
async function bake(event){event.preventDefault();if(state.busy||state.polling||!formValid())return;state.busy=true;updateControls();try{await request('SubmitRecord',JSON.stringify(getForm()),TABLE);state.row=1;state.markdown='';state.wall='waiting';state.polling=true;invalidateLists();renderWall();pollForResult();refreshData()}catch(error){console.error(error);toast('opError')}finally{state.busy=false;updateControls()}}
async function pollForResult(){const deadline=Date.now()+1800000;let timeoutId;const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(new Error('POLL_TIMEOUT')),1800000)});try{while(Date.now()<deadline){await Promise.race([new Promise(resolve=>setTimeout(resolve,1000)),timeout]);const result=await Promise.race([request('轮询','表情包',TABLE),timeout]);if(String(result??'').trim()){const text=String(await Promise.race([request('GetCellValue','表情包/1'),timeout])??'');if(!text.trim())continue;state.markdown=text;state.wall='ready';renderWall();toast('generated');await refreshData();return}}state.wall='timeout';renderWall()}catch(error){console.error(error);state.wall=error.message==='POLL_TIMEOUT'?'timeout':'error';renderWall()}finally{clearTimeout(timeoutId);state.polling=false;updateControls()}}
async function saveMolds(){if(state.busy||state.polling||state.row<1||!formValid())return;const row=state.row,values=getForm();state.busy=true;updateControls();try{for(const field of FIELDS)await request('SetCellValue',field+'/'+row+'/'+values[field]);toast('saved');if(!await refreshData())toast('refreshFailed')}catch(error){console.error(error);toast('partialSave')}finally{state.busy=false;updateControls()}}
function askDelete(row){if(state.busy||state.polling){toast('busy');return}state.deleteRow=row;openModal('confirmOverlay')}
async function deleteSet(){if(state.busy||state.polling)return;const row=state.deleteRow;state.busy=true;$('confirmDelete').disabled=true;$('cancelDelete').disabled=true;$('confirmClose').disabled=true;updateControls();try{await request('DeleteRecord',row.toString());if(state.row===row){state.row=0;state.markdown='';state.wall='empty';fillForm(defaults());renderWall()}else if(state.row>row)state.row--;invalidateLists();closeModal();toast('deleted');if(!await refreshData())toast('refreshFailed')}catch(error){console.error(error);toast('opError')}finally{state.busy=false;$('confirmDelete').disabled=false;$('cancelDelete').disabled=false;$('confirmClose').disabled=false;updateControls()}}
async function handleCards(event){const target=event.target.closest('[data-card-action]'),card=event.target.closest('.set-card');if(!card)return;if(state.busy||state.polling){toast('busy');return}const row=Number(card.dataset.row),action=target?.dataset.cardAction;if(action==='delete'){askDelete(row);return}if(action==='edit'||card.dataset.recent==='true'){showPage('studio');await loadRow(row)}else await openDetail(row)}
function bindEvents(){document.querySelectorAll('[data-page]').forEach(n=>n.addEventListener('click',()=>showPage(n.dataset.page)));$('brand').addEventListener('click',()=>{try{if(typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);else toast('noBridgeClose')}catch{toast('noBridgeClose')}});$('menuButton').addEventListener('click',()=>{const open=$('mobileNav').hidden;$('mobileNav').hidden=!open;$('menuButton').setAttribute('aria-expanded',String(open))});document.addEventListener('click',event=>{if(!$('navbar').contains(event.target))closeMenu();const action=event.target.closest('[data-action]')?.dataset.action;if(action==='new')newSet();if(action==='clear'){['gallerySearch','zodiacFilter','jobFilter','sceneFilter','countFilter'].forEach(id=>{$(id).value=''});renderLists()}if(action==='reload-row'&&state.row>0)loadRow(state.row);const img=event.target.closest('.markdown img');if(img){event.preventDefault();if(img.dataset.download)window.open(img.dataset.download,'_blank','noopener');return}const anchor=event.target.closest('.markdown a');if(anchor){const href=anchor.getAttribute('href');if(href?.startsWith('#')){const scope=anchor.closest('.markdown');const target=[...scope.querySelectorAll('[id]')].find(n=>n.id===href.slice(1));if(target){event.preventDefault();target.scrollIntoView({block:'start'})}}else if(href&&/^https?:/i.test(anchor.href)){event.preventDefault();callAppBridge({type:'链接',data:anchor.href}).catch(()=>toast('opError'))}}});$('languageButton').addEventListener('click',toggleLanguage);$('mobileLanguageButton').addEventListener('click',toggleLanguage);$('clayForm').addEventListener('change',updateControls);$('clayForm').addEventListener('submit',bake);$('saveButton').addEventListener('click',saveMolds);$('previousButton').addEventListener('click',()=>loadRow(state.row-1));$('nextButton').addEventListener('click',()=>loadRow(state.row+1));$('retryButton').addEventListener('click',refreshData);['recentGrid','galleryGrid'].forEach(id=>{$(id).addEventListener('click',handleCards);$(id).addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.classList.contains('set-card')){event.preventDefault();event.target.click()}})});['gallerySearch','zodiacFilter','jobFilter','sceneFilter','countFilter','sortFilter'].forEach(id=>$(id).addEventListener(id==='gallerySearch'?'input':'change',renderLists));['detailClose','confirmClose','cancelDelete'].forEach(id=>$(id).addEventListener('click',closeModal));['detailOverlay','confirmOverlay'].forEach(id=>$(id).addEventListener('click',event=>{if(event.target===$(id))closeModal()}));$('confirmDelete').addEventListener('click',deleteSet);$('takeToStudio').addEventListener('click',async()=>{const row=state.detailRow;closeModal();showPage('studio');await loadRow(row)});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.modalStack.length)closeModal();else closeMenu()}if(event.key==='Tab'&&state.modalStack.length){const modal=$(state.modalStack.at(-1).id),items=[...modal.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),[tabindex="0"]')].filter(n=>n.getClientRects().length);if(!items.length){event.preventDefault();return}const first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===modal.querySelector('.dialog'))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===modal.querySelector('.dialog'))){event.preventDefault();first.focus()}}});window.addEventListener('resize',fitNavigation);const keyboardAdjust=()=>{const viewport=window.visualViewport,keyboard=viewport?Math.max(0,window.innerHeight-viewport.height-viewport.offsetTop):0;document.documentElement.style.setProperty('--keyboard-space',keyboard>80?keyboard+100+'px':'0px');const active=document.activeElement;if(active?.matches('input,select,textarea')&&window.innerWidth<761)setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),120)};window.visualViewport?.addEventListener('resize',keyboardAdjust);document.addEventListener('focusin',event=>{if(event.target.matches('input,select,textarea'))keyboardAdjust()})}
async function initialize(){state.lang=initialLanguage();document.documentElement.dataset.theme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';bindEvents();applyLanguage();const modeTask=callAppBridge({type:'模式'}).then(mode=>{document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light'}).catch(error=>console.error(error));await Promise.allSettled([modeTask,refreshData()])}
(async () => { await initialize(); })();
</script>
