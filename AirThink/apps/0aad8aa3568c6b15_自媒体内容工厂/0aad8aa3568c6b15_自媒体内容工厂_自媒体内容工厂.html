.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.searchbar{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.searchbar .search-wrap{position:relative;flex:1;min-width:180px}.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.searchbar input{padding-left:40px}.searchbar select{width:190px}.asset-card .card-top{display:flex;align-items:start;justify-content:space-between;gap:10px}.asset-card .card-title{margin-bottom:8px}.asset-card .card-foot{margin:13px 0}.card-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px;border-top:1px solid var(--line)}.card-actions button{font-size:12px}.card-actions .delete-btn{color:#ff8099}.empty-list{grid-column:1/-1;text-align:center;padding:55px 22px;color:var(--muted)}.empty-list i{font-size:27px;color:var(--accent);margin-bottom:12px}.list-message{grid-column:1/-1;text-align:center;padding:35px;color:var(--muted)}.pagination{display:flex;align-items:center;justify-content:center;gap:15px;margin:26px 0 0;color:var(--muted);font-size:13px}

:8px 12px}.markdown hr{border:0;border-top:1px solid var(--line)}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:0;min-height:0}.hero-art{min-height:285px}.orb{width:210px}.orbit{width:340px}.create-grid{grid-template-columns:1fr}.result-panel{min-height:400px}.result-body,.result-empty,.result-wait{min-height:320px}}@media(max-width:650px){.shell{width:min(100% - 30px,1240px)}.topbar{height:66px}.brand{font-size:15px}.brand-icon{width:35px;height:35px}main{padding-top:66px}.page{padding:34px 0 170px}.hero h1{font-size:43px}.lead{font-size:15px}.hero-art{min-height:250px}.stats,.recent-grid,.asset-grid{grid-template-columns:1fr}.stats{margin-bottom:42px}.section-head,.page-head{align-items:start}.panel{padding:20px}.check-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar,.searchbar{align-items:stretch;flex-direction:column}.searchbar select{width:100%}.modal-layer{padding:14px}.modal{max-height:calc(100dvh - 28px);padding:19px 18px 130px}.modal-fields{grid-template-columns:1fr}.modal.wide{padding-bottom:140px}.modal-layer.markdown-modal,.modal-layer.html-modal{padding:0}.markdown-modal .modal,.html-modal .modal{max-height:100dvh;height:100dvh;width:100vw;border-radius:0;border:0}.art-card.a{left:0}.art-card.b{right:0}}

<main>
<section class="page active" id="page-home"><div class="shell"><div class="hero"><div><span class="eyebrow"><i class="fa-solid fa-sparkles"></i><span data-i18n="heroEyebrow">灵感，即刻成篇</span></span><h1 data-i18n-html="heroTitle">你的全平台<br><span class="gradient-text">自媒体爆款制造机</span></h1><p class="lead" data-i18n="heroSub">输入一个灵感，一键生成适配抖音、小红书、微信公众号等多平台的专属优质内容。</p><div class="hero-actions"><button class="primary big" id="startCreate"><span data-i18n="startCreate">开始创作</span><i class="fa-solid fa-arrow-right"></i></button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="orb"></div><div class="art-card a"><i class="fa-solid fa-lightbulb"></i><span data-i18n="artIdea">一个灵感</span></div><div class="art-card b"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="artMagic">多平台内容</span></div><div class="art-card c"><i class="fa-solid fa-pen-nib"></i><span data-i18n="artCreate">无限创意</span></div></div></div><div class="stats"><div class="glass stat"><div class="stat-top"><span data-i18n="totalCount">总创作篇数</span><i class="fa-solid fa-layer-group"></i></div><div class="stat-value" id="totalCount">—</div><div class="stat-note" data-i18n="totalNote">已累计生成的内容</div></div><div class="glass stat"><div class="stat-top"><span data-i18n="favoriteStyle">风格偏好统计</span><i class="fa-solid fa-chart-simple"></i></div><div class="stat-value" id="favoriteStyle">—</div><div class="stat-note" data-i18n="styleNote">最常使用的内容风格</div></div></div><div class="section-head"><div><h2 data-i18n="recentTitle">最近创作</h2><p data-i18n="recentSub">每一次灵感，都值得被珍藏。</p></div><button class="ghost" id="viewAll"><span data-i18n="viewAll">查看全部</span><i class="fa-solid fa-arrow-right"></i></button></div><div class="recent-grid" id="recentGrid"><div class="glass list-message" data-i18n="loading">正在加载...</div></div></div></section>
<section class="page" id="page-create"><div class="shell"><div class="page-head"><div><span class="eyebrow"><i class="fa-solid fa-wand-magic-sparkles"></i> AI STUDIO</span><h1 data-i18n="create">创作中心</h1><p data-i18n="createSub">设定参数，让AI为你打造爆款内容。</p></div></div><div class="create-grid"><div class="glass panel"><div class="panel-head"><h2 data-i18n="configTitle">内容生成</h2><i class="fa-solid fa-sliders" style="color:var(--accent)"></i></div><form id="createForm"><div id="createFields"></div><div class="form-actions"><button class="primary" id="generateBtn" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="generate">一键生成多平台内容</span></button><button class="ghost" id="resetBtn" type="button"><i class="fa-solid fa-rotate-left"></i><span data-i18n="clearNew">清空并新建</span></button></div><p class="status" id="createStatus" role="status"></p></form></div><div class="glass panel result-panel"><div class="panel-head"><h2 data-i18n="resultTitle">生成结果</h2><i class="fa-solid fa-sparkles" style="color:var(--pink)"></i></div><div class="result-body" id="resultBody"></div></div></div></div></section>
<section class="page" id="page-library"><div class="shell"><div class="page-head"><div><span class="eyebrow"><i class="fa-solid fa-box-archive"></i> CONTENT LIBRARY</span><h1 data-i18n="library">内容资产库</h1><p data-i18n="librarySub">管理和回顾你所有的创作结晶。</p></div><button class="primary" id="goCreate"><i class="fa-solid fa-plus"></i><span data-i18n="goCreate">去创作</span></button></div><div class="toolbar"><div class="searchbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" data-placeholder="searchPlaceholder" placeholder="搜索内容主题" aria-label="Search topic"></div><select id="styleFilter" aria-label="Filter style"></select></div><button class="ghost" id="refreshLibrary"><i class="fa-solid fa-arrows-rotate"></i><span data-i18n="refresh">刷新</span></button></div><div class="asset-grid" id="assetGrid"><div class="glass list-message" data-i18n="loading">正在加载...</div></div><div class="pagination" id="pagination" hidden><button class="ghost" id="prevPage"><i class="fa-solid fa-chevron-left"></i></button><span id="pageIndicator"></span><button class="ghost" id="nextPage"><i class="fa-solid fa-chevron-right"></i></button></div></div></section>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))

        // 检查请求类型是否在支持的映射中

          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录

          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("0aad8aa3568c6b15_自媒体内容工厂")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

async function loadLibrary(){const grid=$('assetGrid');grid.innerHTML=`<div class="glass list-message"><div class="spinner" style="margin:0 auto 12px"></div>${tr('loading')}</div>`;try{const csv=await bridge('GetTableCSV',DATA_SOURCE,LIBRARY_FIELDS.join(','));records=getRows(csv).map((r,i)=>({row:i+1,topic:r[0]||'',style:r[1]||'',platform:r[2]||'',audience:r[3]||'',reference:r[4]||''}));renderLibrary();}catch(e){grid.innerHTML=`<div class="glass list-message">${tr('loadError')}${esc(e)}</div>`;}}
function filteredRecords(){const query=$('searchInput').value.trim().toLocaleLowerCase(),style=$('styleFilter').value;return records.filter(r=>(!query||r.topic.toLocaleLowerCase().includes(query))&&(!style||r.style===style));}
function renderLibrary(){const grid=$('assetGrid');if(!grid)return;const list=filteredRecords(),perPage=12,pages=Math.max(1,Math.ceil(list.length/perPage));libraryPage=Math.min(Math.max(1,libraryPage),pages);const visible=list.slice((libraryPage-1)*perPage,libraryPage*perPage);grid.innerHTML=visible.length?visible.map(r=>`<article class="glass asset-card"><div class="card-top"><div class="card-title">${esc(r.topic||tr('untitled'))}</div><span class="chip">${esc(r.style||tr('unknown'))}</span></div><div class="chips">${platformChips(r.platform)}</div><div class="card-foot"><i class="fa-solid fa-users"></i> ${esc(r.audience||tr('unknown'))}</div><div class="card-actions"><button class="ghost" type="button" data-action="detail" data-row="${r.row}"><i class="fa-regular fa-eye"></i> ${tr('detail')}</button><button class="ghost" type="button" data-action="edit" data-row="${r.row}"><i class="fa-solid fa-pen"></i> ${tr('edit')}</button><button class="ghost delete-btn" type="button" data-action="delete" data-row="${r.row}"><i class="fa-regular fa-trash-can"></i> ${tr('remove')}</button></div></article>`).join(''):`<div class="glass empty-list"><i class="fa-solid fa-box-open"></i><h3>${tr(records.length?'noMatch':'noData')}</h3>${records.length?'':`<p>${tr('noDataSub')}</p>`}</div>`;$('pagination').hidden=pages<=1;$('pageIndicator').textContent=lang==='cn'?`第 ${libraryPage} / ${pages} 页`:`Page ${libraryPage} of ${pages}`;$('prevPage').disabled=libraryPage===1;$('nextPage').disabled=libraryPage===pages;}
async function resolveRow(record){try{const result=await bridge('GetRecordRow',DATA_SOURCE,`内容主题/${record.topic}`);const row=Number(String(result).trim());if(Number.isInteger(row)&&row>0&&row===record.row)return row;}catch(e){}return record.row;}
async function showDetail(rowNumber){const record=records.find(r=>r.row===rowNumber);if(!record)return;const row=await resolveRow(record);$('detailTitle').textContent=record.topic||tr('untitled');$('detailMeta').innerHTML=`<span class="chip">${esc(record.style||tr('unknown'))}</span>${platformChips(record.platform)}<span class="chip"><i class="fa-solid fa-users"></i>&nbsp;${esc(record.audience||tr('unknown'))}</span>`;$('detailFile').innerHTML=record.reference?`<p class="detail-file"><i class="fa-solid fa-paperclip"></i> ${tr('file')}: <a href="${esc(fileUrl(record.reference))}" target="_blank" rel="noopener">${esc(record.reference)}</a></p>`:'';$('detailMarkdown').textContent=tr('loadingDetail');$('detailLayer').classList.add('markdown-modal');modalOpen('detailLayer');try{const content=await bridge('GetCellValue',DATA_SOURCE,`生成内容/${row}`);if(!$('detailLayer').classList.contains('open'))return;$('detailMarkdown').innerHTML=renderMarkdown(content||tr('noContent'));decorateMarkdown($('detailMarkdown'));}catch(e){$('detailMarkdown').textContent=tr('loadError')+String(e);}}
async function showEdit(rowNumber){const record=records.find(r=>r.row===rowNumber);if(!record)return;const row=await resolveRow(record);editRow=row;setStatus('editStatus',tr('loading'));$('saveEdit').disabled=true;modalOpen('editLayer');try{const values={};for(const field of FORM_FIELDS){values[field]=await bridge('GetCellValue',DATA_SOURCE,`${field}/${row}`);}if(!$('editLayer').classList.contains('open'))return;fillForm('editForm',values);setStatus('editStatus','');}catch(e){setStatus('editStatus',tr('loadError')+String(e),true);}finally{$('saveEdit').disabled=false;}}
async function saveEdit(event){event.preventDefault();if(!editRow)return;const data=collectForm('editForm');if(!data['内容主题']){setStatus('editStatus',tr('requiredTopic'),true);return;}$('saveEdit').disabled=true;setStatus('editStatus',tr('loading'));try{for(const field of FORM_FIELDS){await bridge('SetCellValue',DATA_SOURCE,`${field}/${editRow}/${data[field]}`);}setStatus('editStatus',tr('saveSuccess'));await Promise.all([loadLibrary(),loadHome()]);modalClose('editLayer');}catch(e){setStatus('editStatus',tr('saveError')+String(e),true);}finally{$('saveEdit').disabled=false;}}
async function askDelete(rowNumber){const record=records.find(r=>r.row===rowNumber);if(!record)return;deleteRow=await resolveRow(record);setStatus('deleteStatus','');modalOpen('deleteLayer');}
async function confirmDelete(){if(!deleteRow)return;$('confirmDelete').disabled=true;try{await bridge('DeleteRecord',DATA_SOURCE,deleteRow.toString());modalClose('deleteLayer');deleteRow=null;await Promise.all([loadLibrary(),loadHome()]);}catch(e){setStatus('deleteStatus',tr('deleteError')+String(e),true);}finally{$('confirmDelete').disabled=false;}}
function bindEvents(){$('brand').addEventListener('click',e=>{e.preventDefault();if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false);});document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>openPage(el.dataset.page)));$('startCreate').addEventListener('click',()=>openPage('create'));$('goCreate').addEventListener('click',()=>openPage('create'));$('viewAll').addEventListener('click',()=>openPage('library'));$('desktopLang').addEventListener('click',switchLang);$('mobileLang').addEventListener('click',switchLang);$('menuBtn').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open));});document.addEventListener('click',e=>{if(!e.target.closest('#topbar'))closeMenu();const fileBtn=e.target.closest('[data-select-file]');if(fileBtn)chooseFile(fileBtn.dataset.selectFile);const close=e.target.closest('[data-close]');if(close)modalClose(close.dataset.close);});document.querySelectorAll('.modal-layer').forEach(layer=>layer.addEventListener('click',e=>{if(e.target===layer)modalClose(layer.id);}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalStack.length)modalClose();else closeMenu();}});$('createForm').addEventListener('submit',submitCreate);$('resetBtn').addEventListener('click',resetCreate);$('editForm').addEventListener('submit',saveEdit);$('confirmDelete').addEventListener('click',confirmDelete);$('searchInput').addEventListener('input',()=>{libraryPage=1;renderLibrary();});$('styleFilter').addEventListener('change',()=>{libraryPage=1;renderLibrary();});$('refreshLibrary').addEventListener('click',loadLibrary);$('prevPage').addEventListener('click',()=>{libraryPage--;renderLibrary();$('page-library').scrollIntoView();});$('nextPage').addEventListener('click',()=>{libraryPage++;renderLibrary();$('page-library').scrollIntoView();});$('assetGrid').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const row=Number(btn.dataset.row);if(btn.dataset.action==='detail')showDetail(row).catch(err=>alert(tr('loadError')+err));if(btn.dataset.action==='edit')showEdit(row).catch(err=>alert(tr('loadError')+err));if(btn.dataset.action==='delete')askDelete(row).catch(err=>alert(tr('loadError')+err));});$('recentGrid').addEventListener('click',e=>{const card=e.target.closest('[data-recent-row]');if(!card)return;const row=Number(card.dataset.recentRow);openPage('library',{skipLoad:true});loadLibrary().then(()=>showDetail(row));});$('recentGrid').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const card=e.target.closest('[data-recent-row]');if(card){e.preventDefault();card.click();}}});window.addEventListener('resize',measureNav);if(window.ResizeObserver)new ResizeObserver(measureNav).observe($('topbar'));document.addEventListener('focusin',e=>{if(!e.target.matches('input,textarea,select'))return;const target=e.target;setTimeout(()=>target.scrollIntoView({block:'center',behavior:'smooth'}),280);});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const target=document.activeElement;if(target&&target.matches('input,textarea,select'))setTimeout(()=>target.scrollIntoView({block:'center',behavior:'smooth'}),100);});}
async function initialize(){bindEvents();lang=readLang();setLang(lang);try{const mode=String(await bridge('模式')).trim();document.body.classList.toggle('light',mode==='亮色');}catch(e){}await loadHome();}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize();})();},{once:true});}else{(async()=>{await initialize();})();}
</script>
</body>
</html>
