  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {

                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {

                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);

                            i++;
                        }

                        i++;

                }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {

        }

      cn:{appName:'今日话题解读器',home:'首页',create:'新建解读',history:'历史报告',heroDescription:'抓取主流平台热搜，快速生成热点速览、事件脉络、多方观点和趋势判断的解读报告。',newTopic:'新建话题解读',overview:'数据概览',totalReports:'总解读报告数',recent:'最近解读',allReports:'全部报告',createDescription:'设置解读场景与关键词，AI即刻为您生成专属话题报告',scene:'解读场景',chooseScene:'请选择解读场景',daily:'今日热点日报',specific:'指定热搜解读',compare:'对比昨日热搜',keyword:'话题关键词',keywordPlaceholder:'请输入话题关键词（可选）',platform:'数据平台',date:'解读日期',weibo:'微博',zhihu:'知乎',baidu:'百度',douyin:'抖音',toutiao:'今日头条',generate:'生成解读报告',generatedReport:'生成结果',historyDescription:'浏览所有过往的话题解读报告',fullReport:'完整报告',view:'查看完整报告',delete:'删除',loading:'正在加载…',generating:'报告生成中，AI正在抓取数据并分析，请稍候…',timeout:'生成超时，请稍后在历史报告中查看。',empty:'暂无解读报告',noKeyword:'未指定关键词',noPlatform:'未选择平台',error:'加载失败',confirmDelete:'确定删除这条解读报告吗？',deleteFailed:'删除失败',submitFailed:'提交失败',reportEmpty:'报告内容为空',reset:'新建一份解读',requiredPlatform:'请至少选择一个数据平台',today:'今日',bilibili:'B站'},
      en:{appName:'Today’s Topic Decoder',home:'Home',create:'New Analysis',history:'Report History',heroDescription:'Explore trending topics across major platforms and create concise reports with an overview, timeline, perspectives, and outlook.',newTopic:'New Topic Analysis',overview:'Overview',totalReports:'Total reports',recent:'Recent analyses',allReports:'All reports',createDescription:'Choose a scenario and keywords to generate a topic report with AI.',scene:'Analysis scenario',chooseScene:'Choose a scenario',daily:'Daily trends briefing',specific:'Specific trending topic',compare:'Compare with yesterday',keyword:'Topic keywords',keywordPlaceholder:'Enter topic keywords (optional)',platform:'Platforms',date:'Analysis date',weibo:'Weibo',zhihu:'Zhihu',baidu:'Baidu',douyin:'Douyin',toutiao:'Toutiao',generate:'Generate report',generatedReport:'Generated report',historyDescription:'Browse all previous topic reports.',fullReport:'Full report',view:'View full report',delete:'Delete',loading:'Loading…',generating:'Generating report. AI is collecting and analyzing data. Please wait…',timeout:'Generation timed out. Check Report History later.',empty:'No reports yet',noKeyword:'No specific keywords',noPlatform:'No platform selected',error:'Could not load data',confirmDelete:'Delete this report?',deleteFailed:'Could not delete report',submitFailed:'Could not submit report',reportEmpty:'The report is empty',reset:'Start another analysis',requiredPlatform:'Select at least one platform',today:'Today',bilibili:'Bilibili'}
    };
    let language='cn',currentPage='home',pageHistory=[],pageScroll={home:0,create:0,history:0},records=[],currentRow=0,polling=false,modalOpen=false,pollToken=0,modalToken=0;
    const $=id=>document.getElementById(id);
    function t(key){return dict[language][key]||key}
    function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function formatDate(date){const pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`}
    function chooseLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved){return saved==='en'?'en':'cn'}const urlLang=new URLSearchParams(location.search).get('lang');if(urlLang==='en'||urlLang==='cn')return urlLang;const list=navigator.languages;if(!list||!list.length)return 'cn';return list.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
    function applyLanguage(next){language=next;document.documentElement.lang=next==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});$('langSwitch').textContent=next==='cn'?'EN':'中文';$('mobileLangSwitch').textContent=next==='cn'?'English':'中文';document.title=t('appName');renderLists();if(polling)setStatus(t('generating'));requestAnimationFrame(checkNav)}
    function switchLanguage(){const next=language==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',next);applyLanguage(next);closeMenu()}
    function checkNav(){const inner=document.querySelector('.nav-inner');document.body.classList.remove('compact-nav');const compact=inner.scrollWidth>inner.clientWidth||window.innerWidth<560;document.body.classList.toggle('compact-nav',compact);if(!compact)closeMenu()}
    function closeMenu(){$('mobileMenu').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false')}
    function setPage(page,push=true,restore=null){if(!['home','create','history'].includes(page))return;if(page===currentPage&&restore===null){closeMenu();return}if(push)pageHistory.push({page:currentPage,scroll:window.scrollY});pageScroll[currentPage]=window.scrollY;currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===`page-${page}`));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));$('newFloatingButton').classList.toggle('visible',page==='create');closeMenu();requestAnimationFrame(()=>window.scrollTo(0,restore??pageScroll[page]??0));if(page==='home')refreshHome();if(page==='history')refreshRecords()}
    function airBack(){if(modalOpen){closeModal();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(pageHistory.length){const entry=pageHistory.pop();setPage(entry.page,false,entry.scroll);return 'false'}return 'true'}
    window.airBack=airBack;
    function makeRecords(csv){return parseCSV(String(csv||'')).filter(row=>row.some(cell=>cell!=='' )).map((row,index)=>({row:index+1,scene:row[0]||'',keyword:row[1]||'',platform:row[2]||'',date:row[3]||''}))}
    function sortedRecords(){return [...records].sort((a,b)=>{const d=(Date.parse(b.date)||0)-(Date.parse(a.date)||0);return d||a.row-b.row})}
    function cardHTML(record,withActions){const platforms=record.platform.split(/[,，;；、\n]+/).map(x=>x.trim()).filter(Boolean);return `<article class="card report-card ${withActions?'':'card-click'}" data-row="${record.row}" ${withActions?'':'tabindex="0" role="button"'}><div class="meta"><span class="badge">${escapeHTML(record.scene||t('scene'))}</span></div><h3>${escapeHTML(record.keyword||t('noKeyword'))}</h3><div class="platforms">${platforms.length?platforms.map(x=>`<span class="badge">${escapeHTML(x)}</span>`).join(''):`<span class="badge">${t('noPlatform')}</span>`}</div><div class="report-date"><i class="fa-regular fa-calendar"></i> ${escapeHTML(record.date)}</div>${withActions?`<div class="card-actions"><button class="btn btn-primary" type="button" data-action="view" data-row="${record.row}"><i class="fa-regular fa-eye"></i> ${t('view')}</button><button class="btn btn-danger" type="button" data-action="delete" data-row="${record.row}"><i class="fa-regular fa-trash-can"></i> ${t('delete')}</button></div>`:''}</article>`}
    function renderLists(){const sorted=sortedRecords();$('recentGrid').innerHTML=sorted.length?sorted.slice(0,5).map(r=>cardHTML(r,false)).join(''):`<div class="empty"><i class="fa-regular fa-folder-open"></i><p>${t('empty')}</p></div>`;$('historyGrid').innerHTML=sorted.length?sorted.map(r=>cardHTML(r,true)).join(''):`<div class="empty"><i class="fa-regular fa-folder-open"></i><p>${t('empty')}</p></div>`}
    async function refreshRecords(){try{const csv=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS});records=makeRecords(csv);renderLists()}catch(error){$('recentGrid').innerHTML=`<div class="empty">${t('error')}: ${escapeHTML(error.message||error)}</div>`;$('historyGrid').innerHTML=`<div class="empty">${t('error')}: ${escapeHTML(error.message||error)}</div>`}}
    async function refreshCount(){try{const count=await callAppBridge({type:'GetRecordCount',data:TABLE});const n=Number(String(count).trim());$('reportCount').textContent=Number.isFinite(n)?n:String(count)}catch(error){$('reportCount').textContent='—'}}
    async function refreshHome(){await Promise.all([refreshCount(),refreshRecords()])}
    function setStatus(message,error=false){$('generationStatus').classList.add('visible');$('generationStatus').classList.toggle('error',error);$('statusSpinner').style.display=error?'none':'';$('statusText').textContent=message}
    function clearStatus(){$('generationStatus').classList.remove('visible','error')}
    function setPolling(active){polling=active;$('submitButton').disabled=active;Array.from($('createForm').elements).forEach(el=>{el.disabled=active});$('newFloatingButton').disabled=active}
    function resetForm(){if(polling)return;pollToken++;currentRow=0;$('createForm').reset();$('createForm_date').value=formatDate(new Date());$('resultCard').classList.remove('visible');$('resultMarkdown').replaceChildren();clearStatus();window.scrollTo({top:0,behavior:'smooth'})}
    function downloadImageURL(value){if(/^https?:\/\//i.test(value))return value;return `https://www.ithinkair.com:3031/download/${encodeURIComponent(value)}`}
    function renderMarkdown(element,source){const value=String(source||'');if(!window.marked||!window.DOMPurify){element.textContent=value;return}marked.setOptions({gfm:true,breaks:true});element.innerHTML=DOMPurify.sanitize(marked.parse(value),{USE_PROFILES:{html:true}});element.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';if(!raw)return;const link=document.createElement('a');const target=downloadImageURL(raw);img.src=target;link.href=target;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('download','');img.replaceWith(link);link.appendChild(img)});element.querySelectorAll('a').forEach(a=>{if(!a.hasAttribute('target')){a.target='_blank';a.rel='noopener noreferrer'}})}
    async function pollReport(row,token){const end=Date.now()+1800000;while(Date.now()<end&&token===pollToken){const value=await callAppBridge({type:'轮询',data:FORM_TABLE,payload:'话题报告'});if(token!==pollToken)return;if(String(value||'').trim()){const report=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`话题报告/${row}`});if(token!==pollToken)return;renderMarkdown($('resultMarkdown'),report||value);$('resultCard').classList.add('visible');clearStatus();setPolling(false);await refreshHome();$('resultCard').scrollIntoView({behavior:'smooth',block:'start'});return}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken){setStatus(t('timeout'),true);setPolling(false);await refreshHome()}}
    async function submitReport(event){event.preventDefault();if(polling)return;const selected=Array.from(document.querySelectorAll('#createForm_platforms input:checked')).map(el=>el.value);if(!selected.length){setStatus(t('requiredPlatform'),true);return}const data={'解读场景':$('createForm_scene').value,'话题关键词':$('createForm_keyword').value.trim(),'数据平台':selected.join(','),'解读日期':$('createForm_date').value};if(!data['解读场景']||!data['解读日期']){$('createForm').reportValidity();return}setPolling(true);setStatus(t('generating'));$('resultCard').classList.remove('visible');const token=++pollToken;try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(data)});currentRow=1;await pollReport(currentRow,token)}catch(error){if(token===pollToken){setStatus(`${t('submitFailed')}: ${error.message||error}`,true);setPolling(false)}}}
    async function showReport(row){const token=++modalToken;modalOpen=true;$('reportModal').classList.add('open');document.body.style.overflow='hidden';$('modalMarkdown').innerHTML=`<p class="load-line">${t('loading')}</p>`;try{const report=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`话题报告/${row}`});if(modalOpen&&token===modalToken)renderMarkdown($('modalMarkdown'),report||t('reportEmpty'))}catch(error){if(modalOpen&&token===modalToken)$('modalMarkdown').innerHTML=`<p class="modal-error">${escapeHTML(error.message||error)}</p>`}}
    function closeModal(){modalToken++;modalOpen=false;$('reportModal').classList.remove('open');document.body.style.overflow=''}
    async function deleteReport(row){if(!window.confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});await refreshHome()}catch(error){window.alert(`${t('deleteFailed')}: ${error.message||error}`)}}
    function handleGridClick(event){const action=event.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);if(action.dataset.action==='view')showReport(row);if(action.dataset.action==='delete')deleteReport(row);return}const card=event.target.closest('.card-click');if(card)showReport(Number(card.dataset.row))}
    function setupKeyboardVisibility(){const focusHandler=event=>{if(!event.target.matches('input,select,textarea'))return;const target=event.target;const scroll=()=>target.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(scroll,250);setTimeout(scroll,550)};document.addEventListener('focusin',focusHandler);if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,select,textarea'))active.scrollIntoView({behavior:'smooth',block:'center'})})}}
    async function initialize(){
      language=chooseLanguage();applyLanguage(language);
      try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light'}catch(error){document.documentElement.dataset.theme='light'}
      $('createForm_date').value=formatDate(new Date());
      document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>setPage(button.dataset.page)));
      document.querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>setPage(button.dataset.go)));
      $('brandButton').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});
      $('langSwitch').addEventListener('click',switchLanguage);$('mobileLangSwitch').addEventListener('click',switchLanguage);
      $('menuToggle').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open))});
      document.addEventListener('click',event=>{if(!event.target.closest('#appHeader'))closeMenu()});
      window.addEventListener('resize',checkNav);checkNav();
      $('createForm').addEventListener('submit',submitReport);$('newFloatingButton').addEventListener('click',resetForm);
      $('recentGrid').addEventListener('click',handleGridClick);$('historyGrid').addEventListener('click',handleGridClick);
      $('recentGrid').addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.classList.contains('card-click')){event.preventDefault();showReport(Number(event.target.dataset.row))}});
      $('modalClose').addEventListener('click',closeModal);$('reportModal').addEventListener('click',event=>{if(event.target===$('reportModal'))closeModal()});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(modalOpen)closeModal();else closeMenu()}});
      setupKeyboardVisibility();await refreshHome();
    }
    document.addEventListener('DOMContentLoaded', () => { (async () => { await initialize(); })(); });
  </script>
</body>
