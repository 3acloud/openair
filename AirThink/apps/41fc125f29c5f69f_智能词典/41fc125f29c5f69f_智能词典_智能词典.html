  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串

      }

      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {

    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {

                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {

                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);

                        }

                        i++;

                }

            // 处理最后一行

        }

    function fitNav(){const inner=el('navInner'),tabs=el('navTabs'),langs=el('langSwitch'),menu=el('menuTrigger');tabs.style.display='flex';langs.style.display='flex';menu.style.display='none';const needed=el('brandButton').offsetWidth+tabs.scrollWidth+langs.scrollWidth+80;const narrow=inner.clientWidth<needed;if(narrow){tabs.style.display='none';langs.style.display='none';menu.style.display='block';}else closeMenu();}
    function closeMenu(){el('mobileMenu').classList.remove('open');el('mobileMenu').setAttribute('aria-hidden','true');el('menuTrigger').setAttribute('aria-expanded','false');}
    function toggleMenu(){const open=!el('mobileMenu').classList.contains('open');el('mobileMenu').classList.toggle('open',open);el('mobileMenu').setAttribute('aria-hidden',String(!open));el('menuTrigger').setAttribute('aria-expanded',String(open));}
    function showPage(page,addHistory=true,restoreY=0){if(page!==state.page&&addHistory)state.navHistory.push({page:state.page,y:window.scrollY});state.page=page;el('lookupPage').hidden=page!=='lookup';el('historyPage').hidden=page!=='history';document.querySelectorAll('[data-page]').forEach(node=>node.classList.toggle('active',node.dataset.page===page));closeMenu();requestAnimationFrame(()=>window.scrollTo({top:restoreY,behavior:addHistory?'smooth':'instant'}));if(page==='history')refreshHistory();}

    function updateBrowser(){el('browserBar').hidden=state.currentRow===0;el('recordPosition').textContent=state.currentRow?`${state.currentRow} / ${state.count}`:'—';el('prevRecord').disabled=state.busy||state.currentRow<=1;el('nextRecord').disabled=state.busy||state.currentRow===0||state.currentRow>=state.count;}
    function markdownHTML(markdown){if(!window.marked||!window.DOMPurify)return '<p class="feedback error">'+escapeHTML(t('libraryError'))+'</p>';const rendered=marked.parse(safeText(markdown),{gfm:true,breaks:true});const holder=document.createElement('div');holder.innerHTML=DOMPurify.sanitize(rendered,{USE_PROFILES:{html:true}});holder.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-scroll';table.replaceWith(wrap);wrap.appendChild(table)});holder.querySelectorAll('img').forEach(img=>{let src=img.getAttribute('src')||'';if(!/^(https?:|data:|blob:)/i.test(src)&&src&&!src.startsWith('/'))src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);if(!/^https:\/\//i.test(src)){img.remove();return}img.src=src;const link=document.createElement('a');link.href=src;link.download='';link.target='_blank';link.rel='noopener noreferrer';img.replaceWith(link);link.appendChild(img)});holder.querySelectorAll('a').forEach(link=>{const href=link.getAttribute('href')||'';if(!/^https:\/\//i.test(href)){link.removeAttribute('href');return}link.target='_blank';link.rel='noopener noreferrer'});return holder.innerHTML;}
    function renderResult(mode='ready',message=''){el('resultEmpty').hidden=!!state.currentRow;el('resultContent').hidden=!state.currentRow;if(!state.currentRow){updateBrowser();return}el('resultQuery').textContent=state.query;el('copyResult').hidden=!state.result||mode!=='ready';el('queryAgain').hidden=mode==='loading';const body=el('resultBody');if(mode==='loading'){body.innerHTML='<div class="loading-state"><i class="fa-solid fa-book-open loading-book"></i><p>'+escapeHTML(t('waiting'))+'</p></div>'}else if(mode==='error'){body.innerHTML='<div class="loading-state"><p>'+escapeHTML(message||t('loadError'))+'</p><button class="btn primary" id="retryResult" type="button"><i class="fa-solid fa-rotate-right"></i>'+escapeHTML(t('retry'))+'</button></div>';el('retryResult').addEventListener('click',()=>pollResult(state.currentRow))}else if(state.result){body.innerHTML='<div class="markdown">'+markdownHTML(state.result)+'</div>'}else{body.innerHTML='<div class="loading-state"><p>'+escapeHTML(t('noResult'))+'</p><button class="btn primary" id="retryResult" type="button">'+escapeHTML(t('retry'))+'</button></div>';el('retryResult').addEventListener('click',()=>pollResult(state.currentRow))}updateBrowser();}
    async function getCount(){const raw=await callAppBridge({type:'GetRecordCount',data:SOURCE});const n=Number(safeText(raw).trim());if(!Number.isFinite(n)||n<0)throw new Error('Invalid record count');state.count=n;el('recordCount').textContent=String(n);updateBrowser();return n;}
    async function submitQuery(content){const query=safeText(content).trim();if(!query){setFeedback(t('emptyInput'),'error');el('queryForm_queryContent').focus();return}if(state.busy)return;state.pollToken++;state.busy=true;state.query=query;state.result='';setFeedback('');updateSubmit();let submitted=false;try{await callAppBridge({type:'SubmitRecord',data:'词典查询',payload:JSON.stringify({'查询内容':query})});submitted=true;state.currentRow=1;el('queryForm_queryContent').value=query;renderResult('loading');getCount().catch(()=>{});state.historyVersion++;await pollResult(1)}catch(error){state.busy=false;updateSubmit();if(submitted)renderResult('error',t('loadError')+' '+errorText(error));else setFeedback(t('submitError')+' '+errorText(error),'error')}}
    async function pollResult(row){const token=++state.pollToken;state.busy=true;updateSubmit();renderResult('loading');const deadline=Date.now()+1800000;while(token===state.pollToken&&Date.now()<deadline){try{const result=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'查询结果/'+row});if(token!==state.pollToken)return;if(safeText(result).trim()){state.result=safeText(result);state.busy=false;updateSubmit();renderResult();state.historyVersion++;return}}catch(error){if(token!==state.pollToken)return;state.busy=false;updateSubmit();renderResult('error',t('loadError')+' '+errorText(error));return}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===state.pollToken){state.busy=false;updateSubmit();renderResult('error',t('timeout'))}}

    function plainSummary(markdown){const text=safeText(markdown).replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[`*_>#|~\[\]]/g,' ').replace(/\s+/g,' ').trim();return text.length>155?text.slice(0,155)+'…':text}
    async function refreshHistory(){const version=++state.historyVersion;el('historyList').innerHTML='<div class="card history-empty"><i class="fa-solid fa-spinner fa-spin"></i><p>'+escapeHTML(t('loading'))+'</p></div>';try{const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'查询内容,查询结果'});if(version!==state.historyVersion)return;const rows=parseCSV(safeText(csv).replace(/^\uFEFF/,''));state.records=rows.map((cols,index)=>({row:index+1,query:safeText(cols[0]),result:'',summaryLoading:true}));renderHistory();await getCount();let next=0;const workers=[];for(let worker=0;worker<Math.min(4,state.records.length);worker++){workers.push((async()=>{while(next<state.records.length&&version===state.historyVersion){const record=state.records[next++];try{record.result=safeText(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'查询结果/'+record.row}))}catch(error){record.result=''}record.summaryLoading=false;if(version===state.historyVersion)renderHistory()}})())}await Promise.all(workers)}catch(error){if(version===state.historyVersion)el('historyList').innerHTML='<div class="card history-empty"><p>'+escapeHTML(t('loadError')+' '+errorText(error))+'</p><button class="btn" id="retryHistory" type="button">'+escapeHTML(t('retry'))+'</button></div>';el('retryHistory')?.addEventListener('click',refreshHistory)}}
    function renderHistory(){const list=el('historyList');if(!list)return;const term=el('historySearch').value.trim().toLocaleLowerCase();const records=state.records.filter(record=>record.query.toLocaleLowerCase().includes(term));if(el('historySort').value==='oldest')records.reverse();if(!records.length){list.innerHTML='<div class="card history-empty"><i class="fa-regular fa-folder-open"></i><p>'+escapeHTML(state.records.length?t('noMatch'):t('noRecords'))+'</p>'+(state.records.length?'':'<button class="btn primary" id="firstQuery" type="button">'+escapeHTML(t('firstQuery'))+'</button>')+'</div>';el('firstQuery')?.addEventListener('click',()=>newQuery());return}list.innerHTML='';for(const record of records){const card=document.createElement('article');card.className='card history-item';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',t('details')+': '+record.query);card.innerHTML='<div class="history-item-top"><h3>'+escapeHTML(record.query)+'</h3><span class="row-number">'+escapeHTML(t('row'))+' '+record.row+'</span></div><p class="history-summary">'+escapeHTML(record.summaryLoading?t('loading'):(plainSummary(record.result)||t('noResult')))+'</p><div class="history-actions"><button class="btn small" data-action="view" type="button"><i class="fa-regular fa-eye"></i>'+escapeHTML(t('view'))+'</button><button class="btn small" data-action="again" type="button"><i class="fa-solid fa-rotate-right"></i>'+escapeHTML(t('searchAgain'))+'</button><button class="btn small danger" data-action="delete" type="button"><i class="fa-regular fa-trash-can"></i>'+escapeHTML(t('delete'))+'</button></div>';card.addEventListener('click',()=>openDetail(record.row));card.addEventListener('keydown',event=>{if(event.target===card&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openDetail(record.row)}});card.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();const action=button.datase     async function openDetail(row){state.detailRow=row;el('detailOverlay').hidden=false;el('detailContent').innerHTML='<p>'+escapeHTML(t('loading'))+'</p>';el('detailClose').focus();try{const query=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'查询内容/'+row});const result=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'查询结果/'+row});if(state.detailRow!==row||el('detailOverlay').hidden)return;el('detailContent').innerHTML='<div class="query-label">'+escapeHTML(t('queryLabel'))+'</div><div class="query-value">'+escapeHTML(query)+'</div><hr><div class="markdown">'+(safeText(result).trim()?markdownHTML(result):escapeHTML(t('noResult')))+'</div>'}catch(error){el('detailContent').textContent=t('loadError')+' '+errorText(error)}}

lay'))closeDetail()});el('confirmClose').addEventListener('click',closeDelete);el('cancelDelete').addEventListener('click',closeDelete);el('confirmOverlay').addEventListener('click',event=>{if(event.target===el('confirmOverlay'))closeDelete()});el('confirmDelete').addEventListener('click',confirmDelete);document.addEventListener('keydown',event=>{if(event.key==='Escape')airBack()});document.addEventListener('focusin',event=>keepInputVisible(event.target));window.visualViewport?.addEventListener('resize',()=>{const active=document.activeElement;if(active)keepInputVisible(active)});try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=safeText(mode).trim()==='暗色'?'dark':'light'}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}try{await getCount()}catch(e){el('recordCount').textContent='—'}fitNav()}
