ius:16px;box-shadow:var(--shadow)}.stat{padding:1.3rem;border-top:4px solid var(--gold);transition:transform .16s}.stat:nth-child(2){border-color:var(--red)}.stat:nth-child(3){border-color:var(--green)}.stat:nth-child(4){border-color:#6f76a4}.stat:hover{transform:translateY(-4px)}.stat strong{display:block;font:700 2rem Georgia,serif}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem}.book-card{overflow:hidden;cursor:pointer;transition:transform .16s,box-shadow .16s}.cover{aspect-ratio:2/3;width:100%;object-fit:cover;display:block;background:linear-gradient(130deg,#766146,#d7c6a3);border-right:9px solid #0002}.cover-wrap{position:relative}.cover-placeholder{display:flex;align-items:center;justify-content:center;font:700 5rem Georgia,serif;color:#704c37;text-shadow:1px 2px #fff5}.book-card .body,.cat-card{padding:1.15rem}.book-card .body{display:grid;gap:.4rem}.book-card p{margin:0}.book-title{font-size:1.35rem;font-weight:bold}.badge{display:inline-block;padding:.15rem .55rem;border-radius:50px;background:#c6a35a33;color:var(--ink);font-size:.78rem;width:max-content}.badge.done{background:#35775e33}.card-actions{display:flex;flex-wrap:wrap;gap:.4rem;border-top:1px solid var(--line);padding-top:.7rem}.card-actions button{padding:.32rem .55rem;font-size:.82rem}.empty{padding:3rem;text-align:center;border:1px dashed var(--line);border-radius:18px;background:var(--card)}.empty i{font-size:3rem;color:var(--gold)}.toolbar{margin:1.2rem 0}.toolbar input{flex:2;min-width:190px}.toolbar select{flex:1;min-width:130px}.chips{display:flex;gap:.45rem;overflow:auto;padding:.5rem 0 1rem}.chips button{white-space:nowrap}.chips button.active{background:var(--gold);color:#16151c}.panel{padding:1.35rem;margin:1.2rem 0}.work-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:1.5rem}.steps{position:sticky;top:calc(var(--navh) + 18px);align-self:start;display:grid;gap:.4rem}.steps button{text-align:left;border-left:4px solid var(--line <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录

async function exportFileA(title, url) {

    const response = await fetch(url);
    if (!response.ok) {

    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {

          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案

        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**

const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {

    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      border-radius: 50px;
      font-size: 16px;

    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {

                            i++;
                        }
                    } else {

                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function parseOutlineChapters(md){let lines=String(md||'').split(/\r?\n/),found=[],current=null,inCatalog=false;const heading=/^\s*(?:#{1,6}\s*|[-*]\s*|\d+[.、]\s*)?(?:第\s*([一二三四五六七八九十百零〇两\d]+)\s*[章节回篇]|chapter\s*(\d+))\s*[：:.、\-—]?\s*(.+)?/i;for(let line of lines){if(/章节目录|目录规划|chapter\s*(?:list|outline)/i.test(line))inCatalog=true;let m=line.match(heading),numbered=inCatalog?line.match(/^\s*(?:[-*]\s*)?(\d{1,3})[.、)）]\s*(.+)/):null;if(m||numbered){if(current)found.push(current);let title=m?(m[3]||line.replace(/^#+\s*/,'')):numbered[2];current={章节标题:title.replace(/\*\*/g,'').trim(),本章要点:''}}else if(current&&line.trim()&&!/^#{1,3}\s/.test(line))current.本章要点+=(current.本章要点?'\n':'')+line.trim()}if(current)found.push(current);return found.filter(x=>x.章节标题)}

async function createBook(ev){ev.preventDefault();if(busy)return;const form=ev.target;if(!form.reportValidity())return;busy=true;$('createBookSubmit').disabled=true;let data={书籍编号:randomId(),一句话:form.elements['一句话'].value.trim(),分类名称:form.elements['分类名称'].value,写作风格:form.elements['写作风格'].value,目标篇幅:form.elements['目标篇幅'].value,完结状态:'创作中',创建时间:fmtDate(new Date()),书名:''};if(!data.一句话){toast('请填写一句话');busy=false;return}try{await submit('书籍',data);workBook=data;maxStep=1;workStep=1;progress(1,'生成书名','策划编辑正在为这部作品起名…');let title=await poll('书籍','书名',1,'策划编辑正在为这部作品起名…');data.书名=title;progress(2,'生成大纲','结构编辑正在搭建全书骨架…');await submit('书籍大纲',{书籍编号:data.书籍编号,大纲内容:''});let outline=await poll('书籍大纲','大纲内容',1,'结构编辑正在搭建全书骨架…');progress(3,'生成封面','封面设计师正在绘制书籍封面…');await submit('书籍封面',{书籍编号:data.书籍编号,封面图片:''});let cover=await poll('书籍封面','封面图片',1,'封面设计师正在绘制书籍封面…');await refresh();let b=books.find(x=>x.书籍编号===data.书籍编号)||data;progress(4,'创作完成预览','正在拆章成书…',`<div class="preview">${coverMarkup(b)}<div><h3>${esc(title)}</h3><p>${esc(data.一句话)}</p><p>${esc([data.写作风格,data.目标篇幅,data.分类名称].join(' · '))}</p><p>${esc(outline.slice(0,120))}</p></div></div>`);busy=false;await continueBook(b)}catch(e){toast(e.message||String(e));$('progressMessage').textContent=(e.message||String(e))+' · 请重试';$('progressActions').innerHTML=`<button data-action="retryWork">重试</button>`}finally{busy=false;$('createBookSubmit').disabled=!cats.length}}
function resetWork(){workBook=null;workResults={};currentRow=0;workStep=0;maxStep=0;$('createBookForm').reset();$('workProgress').hidden=true;$('workFormPanel').hidden=false;renderSteps();go('workshop')}

 $('chapterList').innerHTML=list.length?list.map(c=>{let a=audios.find(x=>x.章节编号===c.章节编号);return `<article class="chapter-card"><div class="row"><span class="badge">${esc(c.章节序号)}</span><h3>${esc(c.章节标题)}</h3>${a?.朗读音频?'<i class="fa-solid fa-volume-high"></i>':''}</div><p class="muted">${esc((c.本章要点||'').slice(0,90))}</p><div class="card-actions"><button data-action="readChapter" data-id="${attr(c.章节编号)}">${tx('readChapter')}</button>${a?.朗读音频?'':`<button data-action="generateVoice" data-id="${attr(c.章节编号)}">${tx('voice')}</button>`}<button data-action="editChapter" data-id="${attr(c.章节编号)}">${tx('edit')}</button><button class="danger" data-action="deleteChapter" data-id="${attr(c.章节编号)}">${tx('delete')}</button></div></article>`}).join(''):`<div class="empty"><i class="fa-solid fa-feather"></i><h3>暂无章节</h3><button data-action="addChapter">根据大纲写下第一章</button></div>`;

async function showChapter(id,scroll=true){let c=chapters.find(x=>x.章节编号===id);if(!c)return;currentChapter=c;currentRow=await recordRow('章节','章节编号',id);let list=chapters.filter(x=>x.书籍编号===c.书籍编号).sort((a,b)=>Number(a.章节序号)-Number(b.章节序号)),i=list.findIndex(x=>x.章节编号===id);$('detailPage').classList.add('reading');$('reader').classList.add('active');$('readerTitle').textContent=`${currentBook.书名} · ${lang==='cn'?'第'+c.章节序号+'章':'Chapter '+c.章节序号} · ${c.章节标题}`;$('readerBody').textContent=tx('loading');$('readerAudio').innerHTML='';$('readerNav').innerHTML=`${i>0?`<button data-action="readChapter" data-id="${attr(list[i-1].章节编号)}">← ${tx('prev')} · ${esc(list[i-1].章节标题)}</button>`:''}<button data-action="returnDirectory">${tx('returnDirectory')}</button>${i<list.length-1?`<button class="next" data-action="readChapter" data-id="${attr(list[i+1].章节编号)}">${tx('next')} · ${esc(list[i+1].章节标题)} →</button>`:''}`;if(scroll)scrollTarget($('reader'));try{let body=await cell('章节','章节正文',currentRow);mdInto($('readerBody'),body||'正文正在赶来，或请稍后重试');let a=audios.find(x=>x.章节编号===id);if(a?.朗读音频)$('readerAudio').innerHTML=`<audio controls preload="none" src="${attr(fileUrl(a.朗读音频))}"></audio>`}catch(e){$('readerBody').textContent=tx('retry')}}

async function editBook(id){let b=books.find(x=>x.书籍编号===id),row=await recordRow('书籍','书籍编号',id);currentRow=row;let fields=['一句话','分类名称','写作风格','目标篇幅','完结状态','书名','创建时间'];let v={};for(let f of fields)v[f]=await cell('书籍',f,row);openModal(tx('edit')+' · '+(b.书名||''),`<form id="editBookForm"><input type="hidden" id="editBookForm_书籍编号" name="书籍编号" value="${attr(id)}"><input type="hidden" id="editBookForm_创建时间" name="创建时间" value="${attr(v.创建时间)}"><div class="form-grid"><div class="span-2"><label for="editBookForm_一句话">一句话</label><textarea id="editBookForm_一句话" name="一句话" required>${esc(v.一句话)}</textarea></div>${selectField('editBookForm','分类名称',cats.map(x=>x.分类名称),v.分类名称)}${selectField('editBookForm','写作风格',styles,v.写作风格)}${selectField('editBookForm','目标篇幅',lengths,v.目标篇幅)}${selectField('editBookForm','完结状态',statuses,v.完结状态)}<div class="span-2"><label>书名</label><div class="markdown-body" id="editBookTitle"></div></div></div><div class="actions"><button class="primary" type="submit">${tx('save')}</button><button type="button" data-action="closeModal">${tx('cancel')}</button></div></form>`);mdInto($('editBookTitle'),v.书名);$('editBookForm').onsubmit=async e=>{e.preventDefault();let f=e.target;try{for(let k of ['一句话','分类名称','写作风格','目标篇幅','完结状态'])await put('书籍',k,row,f.elements[k].value);closeModal();await refresh();currentBook=books.find(x=>x.书籍编号===id)||null;toast('已保存')}catch(x){toast(x.message||String(x))}}}
async function bookDetails(id){let b=books.find(x=>x.书籍编号===id),o=outlines.find(x=>x.书籍编号===id),c=covers.find(x=>x.书籍编号===id),outline='',cover='';if(o)outline=await cell('书籍大纲','大纲内容',await recordRow('书籍大纲','书籍编号',id));if(c)cover=await cell('书籍封面','封面图片',await recordRow('书籍封面','书籍编号',id));openModal(b.书名||tx('details'),`<div class="preview">${cover?`<img class="cover" src="${attr(fileUrl(cover))}" alt="">`:coverMarkup(b)}<div><p>${esc(b.一句话)}</p><p>${esc([b.分类名称,b.写作风格,b.目标篇幅,b.完结状态].join(' · '))}</p></div></div><h3>${tx('outline')}</h3><div class="markdown-body" id="detailOutline"></div>`, 'markdown-modal');mdInto($('detailOutline'),outline||'大纲生成中…')}
async function deleteBook(id){if(!confirm('确定删除这部作品及所有章节、朗读、大纲和封面？'))return;try{let related=chapters.filter(x=>x.书籍编号===id);for(let ch of related){for(let a of audios.filter(x=>x.章节编号===ch.章节编号))await del('章节朗读',await recordRow('章节朗读','章节编号',a.章节编号));await del('章节',await recordRow('章节','章节编号',ch.章节编号))}for(let x of covers.filter(x=>x.书籍编号===id))await del('书籍封面',await recordRow('书籍封面','书籍编号',id));for(let x of outlines.filter(x=>x.书籍编号===id))await del('书籍大纲',await recordRow('书籍大纲','书籍编号',id));await del('书籍',await recordRow('书籍','书籍编号',id));if(currentBook?.书籍编号===id){currentBook=null;go('shelf')}await refresh();toast('已删除')}catch(e){toast(e.message||String(e))}}

async function chapterForm(id=''){if(!currentBook)return;let c=chapters.find(x=>x.章节编号===id),row=c?await recordRow('章节','章节编号',id):0;currentRow=row;let v=c?{}:{章节编号:randomId(),书籍编号:currentBook.书籍编号,章节序号:String(Math.max(0,...chapters.filter(x=>x.书籍编号===currentBook.书籍编号).map(x=>Number(x.章节序号)||0))+1),章节标题:'',本章要点:''};if(c)for(let f of F.chapters)v[f]=await cell('章节',f,row);openModal(c?tx('edit'):tx('addChapter'),`<form id="chapterForm"><input type="hidden" id="chapterForm_章节编号" name="章节编号" value="${attr(v.章节编号)}"><input type="hidden" id="chapterForm_书籍编号" name="书籍编号" value="${attr(v.书籍编号)}"><div class="form-grid">${inputField('chapterForm','章节序号',v.章节序号,'number','required min="1"')}${inputField('chapterForm','章节标题',v.章节标题,'text','required')}<div class="span-2"><label for="chapterForm_本章要点">本章要点</label><textarea id="chapterForm_本章要点" name="本章要点" required>${esc(v.本章要点)}</textarea></div>${c?'<div class="span-2"><label>章节正文</label><div class="markdown-body" id="chapterEditBody"></div></div>':''}</div><div class="actions"><button class="primary">${tx('save')}</button><button type="button" data-action="closeModal">${tx('cancel')}</button></div></form>`);if(c)mdInto($('chapterEditBody'),await cell('章节','章节正文',row));$('chapterForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(busy)return;busy=true;try{if(row){for(let f of ['章节序号','章节标题','本章要点'])await put('章节',f,row,d[f]);closeModal();await refresh();renderDetail()}else{closeModal();await createChapter(currentBook,d);await refresh();renderDetail()}toast('已保存')}catch(x){toast(x.message||String(x))}finally{busy=false}}}

async function exportPdf(id){let b=books.find(x=>x.书籍编号===id);if(!window.html2pdf){toast('PDF 工具加载失败');return}toast('正在整理全书 PDF…');let box=document.createElement('div');box.style.cssText='position:fixed;left:-20000px;width:794px;background:#fffaf0;color:#2c2a32;padding:45px;font-family:Georgia,serif;z-index:-1';let c=covers.find(x=>x.书籍编号===id);let cover=c?.封面图片?`<img src="${attr(fileUrl(c.封面图片))}" crossorigin="anonymous" style="max-height:620px;max-width:100%;display:block;margin:auto">`:'';let o=outlines.find(x=>x.书籍编号===id),outline=o?await cell('书籍大纲','大纲内容',await recordRow('书籍大纲','书籍编号',id)):'';box.innerHTML=`<section style="min-height:950px;text-align:center;page-break-after:always">${cover}<h1>${esc(b.书名)}</h1><p>${esc(b.一句话)}</p></section><section style="page-break-after:always"><h1>全书大纲</h1><div class="markdown-body">${markdown(outline)}</div></section>`;for(let ch of chapters.filter(x=>x.书籍编号===id).sort((a,z)=>Number(a.章节序号)-Number(z.章节序号))){let body=await cell('章节','章节正文',await recordRow('章节','章节编号',ch.章节编号));let section=document.createElement('section');section.style.cssText='page-break-before:always';section.innerHTML=`<h1>第${esc(ch.章节序号)}章 · ${esc(ch.章节标题)}</h1><div class="markdown-body">${markdown(body)}</div>`;box.appendChild(section)}document.body.appendChild(box);try{await Promise.all([...box.querySelectorAll('img')].map(img=>new Promise(r=>{if(img.complete)return r();img.onload=r;img.onerror=r})));await html2pdf().set({margin:0,filename:(b.书名||'一句话成书')+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'px',format:[794,1123],orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(box).save()}catch(e){toast(e.message||String(e))}finally{box.remove()}}
async function action(a,id){try{if(a==='read')await openBook(id);else if(a==='bookDetail')await bookDetails(id);else if(a==='editBook')await editBook(id);else if(a==='deleteBook')await deleteBook(id);else if(a==='toggleStatus')await toggleStatus(id);else if(a==='categoryBooks'){$('shelfCategory').value=id;go('shelf')}else if(a==='editCategory')await categoryForm(id);else if(a==='deleteCategory')await deleteCategory(id);else if(a==='addChapter')await chapterForm();else if(a==='readChapter')await showChapter(id);else if(a==='returnDirectory'){$('detailPage').classList.remove('reading');currentChapter=null;$('reader').classList.remove('active');requestAnimationFrame(()=>scrollTarget($('directory')))}else if(a==='editChapter')await chapterForm(id);else if(a==='deleteChapter')await deleteChapter(id);else if(a==='generateVoice')await voiceChapter(id);else if(a==='continueBook'){let b=books.find(x=>x.书籍编号===id);workBook=b;go('workshop');await continueBook(b)}else if(a==='continueWork'&&workBook)await continueBook(workBook);else if(a==='retryWork'&&workBook)await continueBook(workBook);else if(a==='openWorkBook'&&workBook)await openBook(workBook.书籍编号);else if(a==='resetWork')resetWork();else if(a==='exportPdf')await exportPdf(id);else if(a==='closeModal')closeModal()}catch(e){toast(e.message||String(e))}}
function bind(){document.addEventListener('click',e=>{let goEl=e.target.closest('[data-go]');if(goEl){go(goEl.dataset.go);return}let ac=e.target.closest('[data-action]');if(ac){e.stopPropagation();action(ac.dataset.action,ac.dataset.id);return}let chip=e.target.closest('[data-filter-category]');if(chip){$('shelfCategory').value=chip.dataset.filterCategory;renderShelf();return}let card=e.target.closest('[data-book]');if(card){openBook(card.dataset.book);return}let cat=e.target.closest('[data-category]');if(cat){categoryForm(cat.dataset.category);return}let step=e.target.closest('[data-step]');if(step){showWorkStep(Number(step.dataset.step)).catch(x=>toast(x.message||String(x)));return}});$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){}};$('menuToggle').onclick=()=>$('mobileMenu').classList.toggle('open');$('langButton').onclick=()=>setLang(lang==='cn'?'en':'cn',true);$('closeModal').onclick=closeModal;$('modalLayer').onclick=e=>{if(e.target===$('modalLayer'))closeModal()};document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))$('mobileMenu').classList.remove('open')});$('createBookForm').onsubmit=createBook;$('addCategory').onclick=()=>categoryForm();$('addChapter').onclick=()=>chapterForm();['shelfSearch','shelfCategory','shelfStyle','shelfLength','shelfStatus'].forEach(id=>$(id).addEventListener(id==='shelfSearch'?'input':'change',renderShelf));$('categorySearch').addEventListener('input',renderCats);window.addEventListener('resize',renderNav);document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'instant'}),350)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{let a=document.activeElement;if(a?.matches('input,textarea,select'))setTimeout(()=>a.scrollIntoView({block:'center',behavior:'instant'}),120)})}
async function initialize(){bind();let ls=localStorage.getItem('iThinkAir_UiLanguage');let q=new URLSearchParams(location.search).get('lang');let detected=ls?(ls==='en'?'en':'cn'):q==='cn'?'cn':q==='en'?'en':!navigator.languages?.length?'cn':navigator.languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';setLang(detected);try{let mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}await refresh()}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })()});
</script></body></html>
