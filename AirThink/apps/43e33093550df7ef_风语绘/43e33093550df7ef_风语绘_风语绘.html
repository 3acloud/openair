  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));

    });

      cn:{appName:'风语绘',home:'首页',create:'开始创作',gallery:'插画图库',heroEyebrow:'让灵感随风生长',heroText:'将你的情绪与文案，化作绝美的竖版插画卡片',startNow:'立即开始创作',totalCreated:'累计创作卡片',recentWorks:'最近作品',recentDesc:'收藏每一次心动的画面',viewAll:'查看全部',createEyebrow:'CREATE WITH THE WIND',createTitle:'开始创作',createDesc:'写下此刻的心情，让灵感化作画面',formTitle:'创作插画卡片',mood:'主题情绪',copy:'上图文案',style:'风格偏好',customStyle:'自定义风格',cute:'萌系需求',requirements:'画面要求',generate:'生成专属插画',previewTitle:'结果预览',previewEmpty:'在这里遇见你的情绪插画...',downloadCard:'下载卡片',galleryEyebrow:'YOUR CREATIVE MOMENTS',galleryTitle:'插画图库',galleryDesc:'回顾你创作的每一瞬情绪记录',detailEyebrow:'ARTWORK DETAILS',detailTitle:'作品详情',download:'下载',empty:'还没有作品，去创作第一张吧',loading:'正在读取作品...',working:'风之精灵正在为你绘制中，请稍候...',failed:'操作失败，请稍后重试',timeout:'等待超时，请稍后到图库查看',deleted:'作品已删除',confirmDelete:'确定删除这张作品吗？',pending:'绘制中',noImage:'尚未生成图片',custom:'自定义',saving:'正在提交...',created:'已提交，正在等待插画生成',styleValues:['自动选择','浮光速写','月影绘本','植语水彩','星穹漫影','原神风','自定义'],cuteValues:['无','二次元萌妹','不够香','还不够香','要更香','要超级香']},
      en:{appName:'Wind & Whim',home:'Home',create:'Create',gallery:'Gallery',heroEyebrow:'LET IDEAS GROW WITH THE WIND',heroText:'Turn your mood and words into beautiful portrait illustration cards',startNow:'Start creating',totalCreated:'Illustrations created',recentWorks:'Recent works',recentDesc:'A gallery of fleeting moments',viewAll:'View all',createEyebrow:'CREATE WITH THE WIND',createTitle:'Start creating',createDesc:'Write what you feel and let inspiration take shape',formTitle:'Create an illustration card',mood:'Mood or theme',copy:'Words on image',style:'Art style',customStyle:'Custom style',cute:'Cute style',requirements:'Visual requirements',generate:'Generate my illustration',previewTitle:'Preview',previewEmpty:'Your illustration will appear here...',downloadCard:'Download card',galleryEyebrow:'YOUR CREATIVE MOMENTS',galleryTitle:'Gallery',galleryDesc:'Revisit every mood you have turned into art',detailEyebrow:'ARTWORK DETAILS',detailTitle:'Artwork details',download:'Download',empty:'No works yet. Create your first one.',loading:'Loading artworks...',working:'The wind spirit is painting for you. Please wait...',failed:'Something went wrong. Please try again.',timeout:'Timed out. Check the gallery later.',deleted:'Artwork deleted',confirmDelete:'Delete this artwork?',pending:'Creating',noImage:'Image not ready',custom:'Custom',saving:'Submitting...',created:'Submitted. Waiting for the illustration',styleValues:['Auto select','Glowing sketch','Moonlit storybook','Botanical watercolor','Starry anime','Genshin style','Custom'],cuteValues:['None','Anime girl','A little more','Even more','Extra cute','Super cute']}
    };
    let language = 'cn', currentPage = 'home', pageHistory = [], galleryRows = [], recentRows = [], pollActive = false, toastTimer;
    const $ = id => document.getElementById(id);
    const t = key => I18N[language][key] || key;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const imageUrl = name => 'http://' + window.location.hostname + ':3130/private/' + encodeURIComponent(name);
    const downloadUrl = name => 'http://' + window.location.hostname + ':3130/download/' + encodeURIComponent(name);
    const short = (value,n) => String(value || '').length > n ? String(value).slice(0,n) + '…' : String(value || '');
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4000)}
    function chooseLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved!==null && saved!=='')return saved==='en'?'en':'cn';const param=new URLSearchParams(location.search).get('lang');if(param==='cn'||param==='en')return param;const langs=navigator.languages;if(!langs||!langs.length)return 'cn';return langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
    function translate(){document.documentElement.lang=language==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});$('langButton').textContent=language==='cn'?'EN':'中文';$('mobileLangButton').textContent=language==='cn'?'English':'中文';populateSelect('createForm_style',STYLE_VALUES,t('styleValues'));populateSelect('createForm_cute',CUTE_VALUES,t('cuteValues'));renderRecent();renderGallery();fitNav()}
    function populateSelect(id,values,labels){const el=$(id),selected=el.value;el.innerHTML=values.map((v,i)=>'<option value="'+esc(v)+'">'+esc(labels[i])+'</option>').join('');el.value=values.includes(selected)?selected:values[0]}
    function toggleLanguage(){language=language==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',language);translate();closeMenu()}
    function fitNav(){const nav=$('navLinks'),lang=$('langButton'),menu=$('menuButton'),brand=$('brandButton'),shell=document.querySelector('.nav-shell');nav.style.display='flex';lang.style.display='block';menu.style.display='none';const needed=brand.offsetWidth+nav.scrollWidth+lang.offsetWidth+85;if(needed>shell.clientWidth){nav.style.display='none';lang.style.display='none';menu.style.display='block'}else closeMenu()}
    function closeMenu(){$('mobileMenu').classList.remove('open');$('menuScrim').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}
    function toggleMenu(){const open=$('mobileMenu').classList.toggle('open');$('menuScrim').classList.toggle('open',open);$('menuButton').setAttribute('aria-expanded',String(open))}
    function showPage(page,record=true){if(!['home','create','gallery'].includes(page))return;if(page!==currentPage){if(record)pageHistory.push({page:currentPage,scroll:window.scrollY});$('page-'+currentPage).classList.remove('active');currentPage=page;$('page-'+page).classList.add('active');window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();if(page==='home')loadHome();if(page==='gallery')loadGallery()}
    function emptyMarkup(message){return '<div class="empty-state"><i class="fa-solid fa-feather-pointed"></i>'+esc(message)+'</div>'}
    function parseRows(text){return text?parseCSV(String(text)).filter(row=>row.some(cell=>String(cell).trim()!=='')):[]}
    async function loadHome(){try{const [count,csv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:TABLE}),callAppBridge({type:'GetTableCSV',data:TABLE,payload:RECENT_FIELDS})]);$('totalCount').textContent=String(count).trim()||'0';recentRows=parseRows(csv).slice(0,4);renderRecent()}catch(e){$('totalCount').textContent='—';$('recentGrid').innerHTML=emptyMarkup(t('failed'))}}
    function renderRecent(){const grid=$('recentGrid');if(!recentRows.length){grid.innerHTML=emptyMarkup(t('empty'));return}grid.innerHTML=recentRows.map((r,i)=>'<button class="art-card" type="button" data-recent="'+i+'"><div class="art-thumb">'+(r[2]?'<img src="'+esc(imageUrl(r[2]))+'" alt="'+esc(r[0])+'" loading="lazy">':'<span class="art-placeholder"><i class="fa-solid fa-paintbrush"></i>'+esc(t('pending'))+'</span>')+'</div><div class="art-caption"><strong>'+esc(r[0]||'—')+'</strong><small>'+esc(short(r[1],38))+'</small></div></button>').join('')}
    async function loadGallery(){const grid=$('galleryGrid');grid.innerHTML=emptyMarkup(t('loading'));try{const csv=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:GALLERY_FIELDS});galleryRows=parseRows(csv);renderGallery()}catch(e){grid.innerHTML=emptyMarkup(t('failed'))}}
    function renderGallery(){const grid=$('galleryGrid');if(!galleryRows.length){grid.innerHTML=emptyMarkup(t('empty'));return}grid.innerHTML=galleryRows.map((r,i)=>'<article class="art-card gallery-card" tabindex="0" role="button" data-gallery="'+i+'" aria-label="'+esc(r[0]||t('detailTitle'))+'"><button class="delete-button" type="button" data-delete="'+i+'" aria-label="Delete"><i class="fa-solid fa-trash-can"></i></button><div class="art-thumb">'+(r[5]?'<img src="'+esc(imageUrl(r[5]))+'" alt="'+esc(r[0])+'" loading="lazy">':'<span class="art-placeholder"><i class="fa-solid fa-paintbrush"></i>'+esc(t('pending'))+'</span>')+'</div><div class="card-overlay"><strong>'+esc(r[0]||'—')+'</strong><small>'+esc(short(r[1],20))+'</small><span class="tag">'+esc(r[2]||'—')+'</span></div><div class="mobile-caption"><strong>'+esc(r[0]||'—')+'</strong><small>'+esc(short(r[1],20))+'</small></div></article>').join('')}
    async function openDetail(row){const layer=$('detailLayer');layer.classList.add('open');document.body.style.overflow='hidden';$('detailArt').innerHTML=emptyMarkup(t('loading'));$('detailFields').innerHTML='';$('detailDownload').hidden=true;try{const values=[];for(const field of DETAIL_FIELDS){values.push(await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row}))}if(!layer.classList.contains('open'))return;const image=values[5];$('detailArt').innerHTML=image?'<img src="'+esc(imageUrl(image))+'" alt="'+esc(values[0])+'">':emptyMarkup(t('noImage'));$('detailFields').innerHTML=DETAIL_FIELDS.slice(0,5).map((field,i)=>'<div class="detail-item"><dt>'+esc(t(['mood','copy','style','cute','requirements'][i]))+'</dt><dd>'+esc(values[i]||'—')+'</dd></div>').join('');$('detailDownload').hidden=!image;if(image)$('detailDownload').href=downloadUrl(image)}catch(e){$('detailArt').innerHTML=emptyMarkup(t('failed'))}}
    function closeDetail(){$('detailLayer').classList.remove('open');document.body.style.overflow=''}
    async function removeArtwork(index){if(!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:(index+1).toString()});toast(t('deleted'));await loadGallery()}catch(e){toast(t('failed'))}}
    function updateCustomStyle(){const custom=$('createForm_style').value==='自定义';$('customStyleField').hidden=!custom;$('createForm_customStyle').required=custom;if(!custom)$('createForm_customStyle').value=''}
    function setPreview(state,name){const frame=$('previewFrame'),message=$('previewMessage'),download=$('previewDownload');frame.innerHTML='';if(state==='ready'&&name){const img=document.createElement('img');img.src=imageUrl(name);img.alt=t('previewTitle');frame.appendChild(img);download.href=downloadUrl(name);download.hidden=false}else{frame.appendChild(message);message.className='preview-message'+(state==='loading'?' preview-loading':'');message.querySelector('i').className=state==='loading'?'fa-solid fa-feather-pointed':'fa-solid fa-feather';message.querySelector('span').textContent=state==='loading'?t('working'):t('previewEmpty');download.hidden=true}}
    async function handleSubmit(event){event.preventDefault();if(pollActive)return;const form=$('createForm');if(!form.reportValidity())return;const data={};for(const el of form.elements){if(el.name && !(el.name==='自定义风格'&&$('customStyleField').hidden))data[el.name]=el.value}pollActive=true;$('submitButton').disabled=true;$('formStatus').textContent=t('saving');setPreview('loading');try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});$('formStatus').textContent=t('created');await loadHome();const start=Date.now();while(Date.now()-start<1800000){await new Promise(resolve=>setTimeout(resolve,1000));let result='';try{result=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'生成结果/1'})}catch(e){}if(String(result||'').trim()){setPreview('ready',String(result).trim());$('formStatus').textContent='';await loadHome();break}}if(Date.now()-start>=1800000){$('formStatus').textContent=t('timeout');toast(t('timeout'))}}catch(e){setPreview('empty');$('formStatus').textContent=t('failed');toast(t('failed'))}finally{pollActive=false;$('submitButton').disabled=false}}
    function airBack(){if($('detailLayer').classList.contains('open')){closeDetail();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(pageHistory.length){const prev=pageHistory.pop();showPage(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.scroll));return 'false'}return 'true'}
    window.airBack=airBack;
    async function initialize(){language=chooseLanguage();translate();try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light'}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}$('brandButton').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));$('startButton').addEventListener('click',()=>showPage('create'));$('viewAllButton').addEventListener('click',()=>showPage('gallery'));$('langButton').addEventListener('click',toggleLanguage);$('mobileLangButton').addEventListener('click',toggleLanguage);$('menuButton').addEventListener('click',toggleMenu);$('menuScrim').addEventListener('click',closeMenu);$('createForm_style').addEventListener('change',updateCustomStyle);$('createForm').addEventListener('submit',handleSubmit);$('recentGrid').addEventListener('click',event=>{const card=event.target.closest('[data-recent]');if(card)openDetail(Number(card.dataset.recent)+1)});$('galleryGrid').addEventListener('click',event=>{const del=event.target.closest('[data-delete]');if(del){event.stopPropagation();removeArtwork(Number(del.dataset.delete));return}const card=event.target.closest('[data-gallery]');if(card)openDetail(Number(card.dataset.gallery)+1)});$('galleryGrid').addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-gallery]')){event.preventDefault();openDetail(Number(event.target.dataset.gallery)+1)}});$('detailClose').addEventListener('click',closeDetail);$('detailLayer').addEventListener('click',event=>{if(event.target===$('detailLayer'))closeDetail()});document.addEventListener('keydown',event=>{if(event.key==='Escape')airBack()});document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)});new ResizeObserver(fitNav).observe(document.querySelector('.nav-shell'));await loadHome()}
    document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
  </script>
