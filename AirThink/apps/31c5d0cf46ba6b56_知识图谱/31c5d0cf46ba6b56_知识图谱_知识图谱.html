<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        }

function detectLanguage(){

 if(stored)return stored==='en'?'en':'cn';
 const query=new URLSearchParams(location.search).get('lang');if(query==='cn'||query==='en')return query;
 try{const ls=navigator.languages;if(!ls||!ls.length)return 'cn';return Array.from(ls).some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';}catch(e){return 'cn';}

function fitNav(){

 const nav=$('navbar'),links=$('nav-links');nav.classList.remove('compact');
 const needed=$('brand').getBoundingClientRect().width+links.scrollWidth+84;
 nav.classList.toggle('compact',needed>$('nav-inner').clientWidth);

};

async function refreshData(){
 const serial=++refreshSerial;$('refresh').disabled=true;
 try{
 const result=await Promise.all([api('GetRecordCount'),api('GetTableCSV','画面尺寸'),api('GetTableCSV','版面模板'),api('GetTableCSV',FIELDS.join(','))]);
 if(serial!==refreshSerial)return;
 const count=Number(String(result[0]).trim());if(!Number.isInteger(count)||count<0)throw Error(t('记录数格式无效','Invalid record count'));
 const nextRecords=parseCSV(String(result[3]||'')).map((values,index)=>{const r={row:index+1};FIELDS.forEach((f,i)=>r[f]=values[i]||'');return r;});
 recordCount=count;records=nextRecords;sizeCounts={mobile:0,desktop:0};distribution={};
 for(const row of parseCSV(String(result[1]||''))){if(row[0]==='手机一屏')sizeCounts.mobile++;if(row[0]==='默认版')sizeCounts.desktop++;}
 for(const row of parseCSV(String(result[2]||'')))distribution[row[0]]=(distribution[row[0]]||0)+1;
 loaded=true;$('load-error').hidden=true;renderHome();renderArchive();renderPager();
 }catch(error){if(serial!==refreshSerial)return;$('load-error').hidden=false;$('load-error').textContent=t('数据加载失败，请点击典藏页刷新按钮重试。','Data could not be loaded. Use Refresh in the collection to retry.')+' '+errorText(error);notify(errorText(error));}
 finally{if(serial===refreshSerial)$('refresh').disabled=false;}
}

function syncSubmit(){$('forge-submit').disabled=generating||mutation||!$('forge-form-subject').value.trim();$('forge-fields').disabled=generating||mutation;renderPager();}
async function pollGraph(){
 const token=++pollToken,deadline=Date.now()+1800000;stageStatus='waiting';stageError='';
 try{
 while(token===pollToken&&Date.now()<deadline){
 const start=Date.now();let timeout;
 const file=await Promise.race([api('GetCellValue','图谱文件/1'),new Promise((_,reject)=>timeout=setTimeout(()=>reject(new Error('POLL_TIMEOUT')),Math.max(1,deadline-Date.now())))]).finally(()=>clearTimeout(timeout));
 if(token!==pollToken)return;
 if(String(file||'').trim()){stageRecord['图谱文件']=String(file).trim();stageStatus='complete';break;}
 await new Promise(resolve=>setTimeout(resolve,Math.min(Math.max(0,1000-(Date.now()-start)),Math.max(0,deadline-Date.now()))));
 }
 if(stageStatus==='waiting')stageStatus='timeout';
 }catch(error){stageStatus=error.message==='POLL_TIMEOUT'?'timeout':'error';if(stageStatus==='error')stageError=errorText(error);}
 finally{if(token===pollToken){generating=false;syncSubmit();renderStage();await refreshData();}}
}
async function submitForge(event){
 event.preventDefault();if(generating||mutation)return;const values=formValues('forge-form');if(!values['主题'])return;
 mutation=true;syncSubmit();
 try{await api('SubmitRecord',JSON.stringify(values),'知识图谱');currentRow=1;stageRecord={...values,row:1,'图谱文件':''};generating=true;stageStatus='waiting';mutation=false;syncSubmit();renderStage();void refreshData();void pollGraph();}
 catch(error){notify(errorText(error));}
 finally{mutation=false;syncSubmit();}
}
function resetForge(){if(generating||mutation)return;pollToken++;currentRow=0;stageRecord=null;stageStatus='idle';stageError='';$('forge-form').reset();$('forge-form-file').value='';$('generation-stage').hidden=true;$('stage-content').replaceChildren();$('stage-tools').replaceChildren();$('stage-summary').replaceChildren();$('forge-form-wrap').hidden=false;syncSubmit();window.scrollTo(0,0);}
async function historyStep(delta){
 if(generating||mutation||historyBusy)return;const row=currentRow+delta;if(row<1||row>recordCount)return;
 historyBusy=true;renderPager();
 try{const r=await readRecord(row);currentRow=row;stageRecord=r;stageStatus='idle';stageError='';renderStage();}
 catch(error){notify(errorText(error));}finally{historyBusy=false;renderPager();}
}
function openModal(kind,title,narrow=false){
 const prior=document.activeElement,el=document.createElement('div');el.className='overlay '+kind;el.style.zIndex=String(2100+modalStack.length*10);const id='dialog-'+(++modalSerial);
 el.innerHTML='<div class="dialog '+(narrow?'narrow':'')+'" role="dialog" aria-modal="true" aria-labelledby="'+id+'-title" tabindex="-1"><div class="dialog-header"><h2 id="'+id+'-title">'+esc(title)+'</h2><button class="icon-btn" data-action="close-modal" aria-label="'+t('关闭','Close')+'"><i class="fa-solid fa-xmark"></i></button></div><div class="dialog-content"></div></div>';
 const modal={el,id,kind,prior,busy:false,record:null};if(modalStack.length)modalStack[modalStack.length-1].el.inert=true;
 modalStack.push(modal);$('modal-root').append(el);document.body.classList.add('modal-open');
 el.addEventListener('click',e=>{if(e.target===el&&!modal.busy)closeModal(modal);});
 requestAnimationFrame(()=>el.querySelector('[role="dialog"]').focus());return modal;
}
function closeModal(modal,force=false){
 if(modal.busy&&!force)return;const index=modalStack.indexOf(modal);if(index<0)return;
 for(const item of modalStack.splice(index))item.el.remove();
 const top=modalStack[modalStack.length-1];if(top)top.el.inert=false;else document.body.classList.remove('modal-open');
 if(modal.prior?.isConnected)modal.prior.focus({preventScroll:true});
}
function setModalBusy(modal,value){modal.busy=value;modal.el.querySelectorAll('button,input,textarea,select,fieldset').forEach(el=>el.disabled=value);}

 const redundant=modal.el.querySelector('.dialog-footer [data-action="preview"]');if(redundant)redundant.remove();

async function editRecord(row){
 if(generating||mutation){notify(t('请等待当前锻造或保存完成。','Wait for the current generation or save to finish.'));return;}
 const modal=openModal('edit',t('编辑知识图谱','Edit knowledge atlas'));modal.row=row;modal.el.querySelector('.dialog-content').innerHTML='<div class="loading">'+t('正在读取字段…','Loading fields…')+'</div>';
 try{
 const r=await readRecord(row,false);if(!modal.el.isConnected)return;modal.record=r;currentRow=row;renderPager();
 const id=modal.id+'-form';modal.formId=id;modal.el.querySelector('.dialog-content').innerHTML='<form id="'+id+'">'+forms(id)+'<p class="hint">'+txt('保存只更新记录，不会重新生成星图。如需重新生成，可用相同主题再锻造一份。','Saving updates the record without regenerating the atlas. To regenerate, forge a new copy with this subject.')+'</p><div class="dialog-footer"><button type="button" class="btn" data-action="reforge" data-form="'+id+'">'+txt('用此主题重新锻造','Forge a new copy')+'</button><button type="button" class="btn" data-action="close-modal">'+txt('取消','Cancel')+'</button><button class="btn primary" type="submit">'+txt('保存修改','Save changes')+'</button></div></form>';
 translate(modal.el);fillForm(id,r);$(id).addEventListener('submit',async event=>{
 event.preventDefault();if(mutation||generating||modal.busy)return;const values=formValues(id);if(!values['主题'])return;
 mutation=true;setModalBusy(modal,true);syncSubmit();let complete=false;
 try{for(const field of FIELDS)await api('SetCellValue',field+'/'+row+'/'+values[field]);complete=true;notify(t('已保存修改','Changes saved'));}
 catch(error){notify(t('保存未完成，部分字段可能已更新；请核对后重试。','Save incomplete; some fields may have changed. Review and retry.')+' '+errorText(error));}
 finally{mutation=false;setModalBusy(modal,false);syncSubmit();await refreshData();}
 if(complete){closeModal(modal);const parent=modalStack[modalStack.length-1];if(parent?.kind==='preview'&&parent.record?.row===row){try{parent.record=await readRecord(row);if(parent.el.isConnected)previewBody(parent);}catch(error){notify(errorText(error));}}if(stageRecord?.row===row){stageRecord={...stageRecord,...values};renderStage();}}
 });
 }catch(error){if(modal.el.isConnected)modal.el.querySelector('.dialog-content').textContent=errorText(error);}
}
function deleteRecord(row){
 if(generating||mutation){notify(t('请等待当前锻造或保存完成。','Wait for the current generation or save to finish.'));return;}
 const modal=openModal('confirm',t('移除星图','Remove atlas'),true);
 modal.el.querySelector('.dialog-content').innerHTML='<p>'+t('将这张星图从典藏中移除？','Remove this atlas from the collection?')+'</p><div class="dialog-footer"><button class="btn" data-action="close-modal">'+t('取消','Cancel')+'</button><button class="btn danger" id="'+modal.id+'-confirm">'+t('确认删除','Delete atlas')+'</button></div>';
 $(modal.id+'-confirm').addEventListener('click',async()=>{
 if(mutation||generating)return;mutation=true;setModalBusy(modal,true);syncSubmit();
 try{await api('DeleteRecord',row.toString());setModalBusy(modal,false);while(modalStack.length)closeModal(modalStack[modalStack.length-1]);mutation=false;resetForge();await refreshData();notify(t('星图已移除','Atlas removed'));}
 catch(error){notify(errorText(error));}finally{mutation=false;setModalBusy(modal,false);syncSubmit();}
 });
}
async function chooseFile(button){
 const input=$(button.dataset.form+'-file');button.disabled=true;
 try{const filename=await callAppBridge({type:'SelectFile'});if(filename&&input.isConnected)input.value=String(filename);}
 catch(error){notify(errorText(error));}finally{button.disabled=false;}
}
function changeLanguage(){
 lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang);}catch(e){}
 document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('知识星图工坊','Knowledge Atlas');
 translate();renderNav();renderFilters();renderHome();renderArchive();renderStage();renderPager();
 for(const modal of modalStack){if(modal.kind==='preview'&&modal.record)previewBody(modal);}
 closeMenu();
}
async function handleClick(event){
 const button=event.target.closest('[data-action],[data-page]');if(!button)return;if(button.disabled)return;
 const action=button.dataset.action;
 try{
 if(button.dataset.page){navigate(button.dataset.page);return;}
 if(action==='language'){changeLanguage();return;}
 if(action==='preview'){await preview(Number(button.dataset.row));return;}
 if(action==='edit'){await editRecord(Number(button.dataset.row));return;}
 if(action==='delete'){deleteRecord(Number(button.dataset.row));return;}
 if(action==='select-file'){await chooseFile(button);return;}
 if(action==='clear-file'){$(button.dataset.form+'-file').value='';return;}
 if(action==='close-modal'){const top=modalStack[modalStack.length-1];if(top&&!top.busy)closeModal(top);return;}
 if(action==='layout-filter'){$('filter-layout').value=button.dataset.value;limit=12;renderArchive();navigate('archive');return;}
 if(action==='reset-filters'){$('archive-search').value='';$('filter-layout').value='';$('filter-size').value='';limit=12;renderArchive();return;}
 if(action==='reforge'){
 if(generating||mutation)return;const values=formValues(button.dataset.form);
 while(modalStack.length)closeModal(modalStack[modalStack.length-1]);resetForge();fillForm('forge-form',values);syncSubmit();navigate('forge');
 }
 }catch(error){notify(errorText(error));}
}
function keyboardSupport(event){
 if(event.key==='Escape'){if(modalStack.length){const top=modalStack[modalStack.length-1];if(!top.busy)closeModal(top);}else closeMenu();return;}
 if(event.key==='Tab'&&modalStack.length){
 const top=modalStack[modalStack.length-1],els=Array.from(top.el.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),textarea:not(:disabled),select:not(:disabled),iframe,[tabindex="0"]')).filter(el=>el.getClientRects().length);
 if(!els.length){event.preventDefault();return;}const first=els[0],last=els[els.length-1];
 if(event.shiftKey&&(document.activeElement===first||!els.includes(document.activeElement))){last.focus();event.preventDefault();}
 else if(!event.shiftKey&&(document.activeElement===last||!els.includes(document.activeElement))){first.focus();event.preventDefault();}
 }
 if((event.key==='Enter'||event.key===' ')&&event.target.matches('article[data-action],tr[data-action]')){event.preventDefault();event.target.click();}
}
function keepInputVisible(){
 const active=document.activeElement;if(!active||!active.matches('input:not([type=radio]),textarea,select'))return;
 const viewport=window.visualViewport;const keyboard=Math.max(0,window.innerHeight-(viewport?viewport.height:window.innerHeight));
 const content=active.closest('.dialog-content');if(content)content.style.paddingBottom=Math.max(180,keyboard+100)+'px';
 else $('page-forge').style.paddingBottom=Math.max(0,keyboard+80)+'px';
 setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),150);
}
async function initialize(){
 lang=detectLanguage();document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('知识星图工坊','Knowledge Atlas');
 $('forge-fields').innerHTML=forms('forge-form');translate();renderNav();renderFilters();renderHome();renderArchive();syncSubmit();
 document.addEventListener('click',handleClick);document.addEventListener('keydown',keyboardSupport);
 document.addEventListener('click',event=>{if(!$('navbar').contains(event.target))closeMenu();});
 $('menu-toggle').addEventListener('click',()=>{$('mobile-menu').hidden=!$('mobile-menu').hidden;$('menu-toggle').setAttribute('aria-expanded',String(!$('mobile-menu').hidden));});
 $('brand').addEventListener('click',()=>{try{parent.closeFullHtml(false);}catch(error){notify(errorText(error));}});
 $('forge-form').addEventListener('submit',submitForge);$('forge-form-subject').addEventListener('input',syncSubmit);
 $('forge-again').addEventListener('click',resetForge);$('history-prev').addEventListener('click',()=>historyStep(-1));$('history-next').addEventListener('click',()=>historyStep(1));
 for(const id of ['archive-search','filter-layout','filter-size'])$(id).addEventListener(id==='archive-search'?'input':'change',()=>{limit=12;renderArchive();});
 $('view-cards').addEventListener('click',()=>{view='cards';renderArchive();});$('view-table').addEventListener('click',()=>{view='table';renderArchive();});
 $('show-more').addEventListener('click',()=>{limit+=12;renderArchive();});$('refresh').addEventListener('click',refreshData);
 window.addEventListener('resize',fitNav);if(window.ResizeObserver)new ResizeObserver(fitNav).observe($('brand'));
 document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))keepInputVisible();});
 if(window.visualViewport)window.visualViewport.addEventListener('resize',keepInputVisible);
 await Promise.allSettled([refreshData(),(async()=>{try{const mode=String(await callAppBridge({type:'模式'})).trim();document.documentElement.dataset.theme=mode==='亮色'?'light':'dark';}catch(error){notify(t('未能获取外观模式，已使用深空主题。','Could not read appearance mode. Using the deep-space theme.'));}})()]);
}
(async () => { await initialize(); })();
</script>
</body>
