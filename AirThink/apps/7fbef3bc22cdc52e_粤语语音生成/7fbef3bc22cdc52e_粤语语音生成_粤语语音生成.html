<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    buttonContainer.style.cssText = `

    `;
    
    // 创建拍照按钮

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

  en: {appName:'Cantonese Voice',brandDescription:'Turn your text into natural Cantonese speech and MP3 audio.',generateNav:'Generate',historyNav:'History',switchLanguage:'中文',generateTitle:'Create Cantonese speech',generateLead:'Give your words a natural Cantonese voice.',formTitle:'Voice generation',inputText:'Your text',inputPlaceholder:'Enter Mandarin or Cantonese text...',tone:'Tone',voice:'Speaker',normal:'Natural',slow:'Slow',fast:'Fast',angry:'Expressive',generateButton:'Generate Cantonese audio',resultTitle:'Your audio is ready',downloadVoice:'Download audio',generateAgain:'Create another',historyTitle:'Generation history',historyLead:'Browse, play and manage your Cantonese audio',totalCount:'Total generations',allRecords:'All recordings',refresh:'Refresh',fullText:'Full text',waiting:'AI is generating your Cantonese audio. Please wait...',timeout:'Generation timed out. Check History for the result.',submitFailed:'Submission failed',loadFailed:'Could not load records. Please retry.',empty:'No recordings yet',viewFull:'View full text',delete:'Delete',confirmDelete:'Delete this recording?',deleteFailed:'Could not delete the recording',notReady:'Audio is still being generated',missingText:'Enter some text.',playUnavailable:'Audio is not ready to play',toneTag:'Tone',voiceTag:'Speaker'}
};
const state = {lang:'cn',theme:'dark',page:'generate',history:[],currentRow:0,polling:false,pollToken:0,resultFile:'',records:[],menuOpen:false};
const el = id => document.getElementById(id);
const t = key => i18n[state.lang][key] || key;
function preferredLanguage(){
  try { const saved = localStorage.getItem('iThinkAir_UiLanguage'); if(saved) return saved === 'en' ? 'en' : 'cn'; } catch(e){}
  const urlLang = new URLSearchParams(location.search).get('lang');
  if(urlLang === 'cn' || urlLang === 'en') return urlLang;
  const langs = navigator.languages;
  if(!langs || !langs.length) return 'cn';
  return langs.some(lang => /^zh(?:-|$)/i.test(lang)) ? 'cn' : 'en';
}
function setLanguage(lang){
  state.lang = lang;
  document.documentElement.lang = lang === 'cn' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(node => {node.textContent = t(node.dataset.i18n);});
  document.querySelectorAll('[data-i18n-placeholder]').forEach(node => {node.placeholder = t(node.dataset.i18nPlaceholder);});
  el('desktopLanguage').textContent = lang === 'cn' ? 'EN' : '中文';
  try {localStorage.setItem('iThinkAir_UiLanguage',lang);} catch(e){}
  if(state.polling) showStatus(t('waiting'));
  if(state.page === 'history') renderHistory();
  updateMenuLayout();
}
async function loadTheme(){
  try { const response = String(await callAppBridge({type:'模式'})).trim(); state.theme = response === '亮色' ? 'light' : 'dark'; }
  catch(e) { state.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  document.documentElement.dataset.theme = state.theme;
}
function updateMenuLayout(){
  const nav = el('siteNav'), desktop = el('desktopNav'), menu = el('menuButton');
  const inner = nav.querySelector('.nav-inner');
  desktop.classList.remove('hidden');
  menu.style.display = 'none';
  const shouldCollapse = inner.scrollWidth > inner.clientWidth || window.innerWidth < 650;
  if(shouldCollapse){desktop.classList.add('hidden');menu.style.display = 'block';}
  else closeMenu();
}
function closeMenu(){state.menuOpen=false;el('mobileMenu').classList.add('hidden');el('menuButton').setAttribute('aria-expanded','false');}
function toggleMenu(){state.menuOpen=!state.menuOpen;el('mobileMenu').classList.toggle('hidden',!state.menuOpen);el('menuButton').setAttribute('aria-expanded',String(state.menuOpen));}
function switchPage(page,remember=true){
  if(page !== 'generate' && page !== 'history') return;
  if(page === state.page){closeMenu();return;}
  if(remember) state.history.push({page:state.page,scrollY:window.scrollY});
  state.page=page;
  document.querySelectorAll('.page').forEach(node=>node.classList.toggle('active',node.id === page+'Page'));
  document.querySelectorAll('.nav-tab').forEach(node=>node.classList.toggle('active',node.dataset.page===page));
  closeMenu(); window.scrollTo(0,0);
  if(page==='history') loadHistory();
}
function showStatus(message,isError=false){const node=el('formStatus');node.textContent=message;node.classList.toggle('error',isError);node.classList.toggle('hidden',!message);}
function setBusy(busy){state.polling=busy;el('submitVoice').disabled=busy;el('voiceForm_inputText').disabled=busy;el('voiceForm').querySelectorAll('input').forEach(input=>input.disabled=busy);}
function audioUrl(filename,base=PRIVATE_BASE){return base+encodeURIComponent(filename);}
function downloadFile(filename){
  if(!filename)return;
  const link=document.createElement('a');link.href=audioUrl(filename,DOWNLOAD_BASE);link.download=filename;link.rel='noopener';document.body.appendChild(link);link.click();link.remove();
}
function showResult(filename){
  state.resultFile=filename;
  const player=el('resultAudio');player.src=audioUrl(filename);player.load();
  el('resultFilename').textContent=filename;
  el('audioResult').classList.remove('hidden');
  el('audioResult').scrollIntoView({behavior:'smooth',block:'nearest'});
  player.play().catch(()=>{});
}
async function pollForAudio(token){
  const started=Date.now();
  while(token===state.pollToken && Date.now()-started<1800000){
    await new Promise(resolve=>setTimeout(resolve,1000));
    if(token!==state.pollToken) return;
    try{
      const response=String(await callAppBridge({type:'轮询',data:FORM_TABLE,payload:'语音文件'})).trim();
      if(response){
        const filename=String(await callAppBridge({type:'GetCellValue',data:FORM_TABLE,payload:'语音文件/'+state.currentRow})).trim();
        if(filename){showResult(filename);showStatus('');setBusy(false);return;}
      }
    }catch(e){console.error(e);}
  }
  if(token===state.pollToken){showStatus(t('timeout'),true);setBusy(false);}
}
async function submitVoice(event){
  event.preventDefault();
  if(state.polling)return;
  const text=el('voiceForm_inputText').value.trim();
  if(!text){showStatus(t('missingText'),true);el('voiceForm_inputText').focus();return;}
  const tone=el('voiceForm').querySelector('input[name="语气"]:checked').value;
  const voice=el('voiceForm').querySelector('input[name="发音人"]:checked').value;
  setBusy(true);showStatus(t('waiting'));el('audioResult').classList.add('hidden');
  try{
    await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify({'输入文字':text,'语气':tone,'发音人':voice})});
    state.currentRow=1;
    const token=++state.pollToken;
    await pollForAudio(token);
  }catch(e){showStatus(t('submitFailed')+': '+String(e),true);setBusy(false);}
}
function resetGeneration(){
  state.pollToken++;state.currentRow=0;state.resultFile='';setBusy(false);
  el('voiceForm').reset();el('resultAudio').pause();el('resultAudio').removeAttribute('src');
  el('audioResult').classList.add('hidden');showStatus('');
  el('voiceForm_inputText').focus();
}
function textPreview(value){return Array.from(value).length>40?Array.from(value).slice(0,40).join('')+'…':value;}
function createButton(cls,icon,label,handler){
  const button=document.createElement('button');button.type='button';button.className=cls;
  const i=document.createElement('i');i.className='fa-solid '+icon;i.setAttribute('aria-hidden','true');
  button.append(i,document.createTextNode(' '+label));button.addEventListener('click',handler);return button;
}
function renderHistory(){
  const grid=el('historyGrid');grid.replaceChildren();
  if(!state.records.length){const empty=document.createElement('div');empty.className='glass empty';empty.innerHTML='<i class="fa-solid fa-headphones" aria-hidden="true"></i>';empty.append(document.createTextNode(t('empty')));grid.append(empty);return;}
  state.records.forEach(record=>{
    const card=document.createElement('article');card.className='glass history-card';
    const text=document.createElement('p');text.textContent=textPreview(record.text);
    const tags=document.createElement('div');tags.className='tags';
    for(const [value,label,extra] of [[record.tone,t('toneTag'),''],[record.voice,t('voiceTag'),' voice']]){
      const tag=document.createElement('span');tag.className='tag'+extra;tag.textContent=label+': '+value;tags.append(tag);
    }
    card.append(text,tags);
    if(record.file){const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=audioUrl(record.file);audio.setAttribute('aria-label',record.text);card.append(audio);}
    else{const pending=document.createElement('div');pending.className='status';pending.textContent=t('notReady');card.append(pending);}
    const actions=document.createElement('div');actions.className='card-actions';
    actions.append(createButton('secondary-button','fa-expand',t('viewFull'),()=>showDetail(record)));
    actions.append(createButton('danger-button','fa-trash-can',t('delete'),()=>deleteRecord(record)));
    card.append(actions);grid.append(card);
  });
}
async function loadHistory(){
  const grid=el('historyGrid');grid.replaceChildren();
  const loading=document.createElement('div');loading.className='glass empty';loading.textContent='…';grid.append(loading);
  try{
    const [count,csv]=await Promise.all([
      callAppBridge({type:'GetRecordCount',data:TABLE}),
      callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS})
    ]);
    el('totalCount').textContent=String(count).trim()||'0';
    state.records=parseCSV(String(csv)).filter(row=>row.some(cell=>String(cell).trim())).map((row,index)=>({
      row:index+1,text:row[0]||'',tone:row[1]||'',voice:row[2]||'',file:row[3]||''
    }));
    renderHistory();
  }catch(e){grid.replaceChildren();const error=document.createElement('div');error.className='glass empty';error.textContent=t('loadFailed');grid.append(error);console.error(e);}
}
async function showDetail(record){
  try{el('detailText').textContent=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'输入文字/'+record.row});}
  catch(e){el('detailText').textContent=record.text;}
  el('detailBackdrop').classList.remove('hidden');el('closeDetail').focus();
}
function closeDetail(){el('detailBackdrop').classList.add('hidden');}
async function deleteRecord(record){
  if(!window.confirm(t('confirmDelete')))return;
  try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:record.row.toString()});await loadHistory();}
  catch(e){window.alert(t('deleteFailed')+': '+String(e));}
}
function airBack(){
  if(!el('detailBackdrop').classList.contains('hidden')){closeDetail();return 'false';}
  if(state.menuOpen){closeMenu();return 'false';}
  if(state.history.length){const previous=state.history.pop();switchPage(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scrollY));return 'false';}
  return 'true';
}
window.airBack=airBack;
function keepFocusedInputVisible(){
  const active=document.activeElement;
  if(!active || !active.matches('input,textarea,select'))return;
  setTimeout(()=>active.scrollIntoView({behavior:'smooth',block:'center'}),180);
}
async function initialize(){
  state.lang=preferredLanguage();setLanguage(state.lang);
  await loadTheme();
  document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>switchPage(button.dataset.page)));
  el('desktopLanguage').addEventListener('click',()=>setLanguage(state.lang==='cn'?'en':'cn'));
  el('mobileLanguage').addEventListener('click',()=>{setLanguage(state.lang==='cn'?'en':'cn');closeMenu();});
  el('menuButton').addEventListener('click',toggleMenu);
  document.addEventListener('click',event=>{if(state.menuOpen && !el('siteNav').contains(event.target))closeMenu();});
  el('brandButton').addEventListener('click',()=>{if(parent && typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);});
  el('voiceForm').addEventListener('submit',submitVoice);
  el('generateAgain').addEventListener('click',resetGeneration);
  el('downloadResult').addEventListener('click',()=>downloadFile(state.resultFile));
  el('refreshHistory').addEventListener('click',loadHistory);
  el('closeDetail').addEventListener('click',closeDetail);
  el('detailBackdrop').addEventListener('click',event=>{if(event.target===el('detailBackdrop'))closeDetail();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!el('detailBackdrop').classList.contains('hidden'))closeDetail();else closeMenu();}});
  document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))keepFocusedInputVisible();});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',keepFocusedInputVisible);
  window.addEventListener('resize',updateMenuLayout);
  if(window.ResizeObserver)new ResizeObserver(updateMenuLayout).observe(el('siteNav'));
  updateMenuLayout();
}
document.addEventListener('DOMContentLoaded', () => { (async () => { await initialize(); })(); });
</script>
