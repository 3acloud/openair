<script>
var url;
// 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("fd38d936d86d98dd_紫微斗数大师")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));

    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

let lang='cn',page='home',currentRow=0,recordCount=0,records=[],topics=[],dataReady=false,loadError='',busy=false,polling=false,resultText='',statusKey='',detailRow=0,detailData=null,limit=12,toastTimer,confirmResolve;

function openModal(id){const item={id,focus:document.activeElement};modalStack.push(item);$(id).hidden=false;document.body.style.overflow='hidden';$(id).querySelector('.dialog').focus()}

function updateImage(){const value=field('命盘图片').value.trim();$('imagePreview').hidden=!value;$('imagePlaceholder').hidden=!!value;if(value)$('imagePreview').src=fileURL(value);else $('imagePreview').removeAttribute('src');const correction=field('咨询主题').value==='校对现有盘';$('imageArea').classList.toggle('highlight',correction);$('imageHint').textContent=t(correction?'correctionHint':'uploadHint');$('imagePreview').alt=t('image')}
function values(){return Object.fromEntries(FIELDS.map(name=>[name,field(name).value]))}

function resetChart(){if(busy||polling){notify(t('busy'));return false}currentRow=0;resultText='';statusKey='';fill({'咨询主题':'整体命盘','历法':'公历','排盘口径':DEFAULT_SCOPE});renderResult();return true}
function updateControls(){const locked=busy||polling;$('formFields').disabled=locked;$('submitReading').disabled=locked||!field('出生日期').value||!field('性别').value;$('saveChanges').disabled=locked||currentRow<1||!field('出生日期').value||!field('性别').value;$('previousRow').disabled=locked||currentRow<=1;$('nextRow').disabled=locked||currentRow>=recordCount||recordCount===0;$('newChart').disabled=locked;$('archiveNew').disabled=locked;$('refresh').disabled=locked;$('rowIndicator').textContent=currentRow+' / '+recordCount;$('resultStatus').textContent=statusKey?t(statusKey):'';document.querySelectorAll('[data-action="edit"],[data-action="delete"]').forEach(e=>e.disabled=locked);$('detailEdit').disabled=locked;$('detailDelete').disabled=locked}
function markdown(element,text){
 element.replaceChildren();
 if(!window.marked||!window.DOMPurify){element.textContent=t('mdMissing')+'\n\n'+text;return}
 element.innerHTML=DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:false}));
 element.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';const path=/^https?:\/\//i.test(raw)?raw:fileURL(raw);img.src=path;img.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();const a=document.createElement('a');a.href=path;a.target='_blank';a.rel='noopener';a.download='';a.click()})});
 element.querySelectorAll('a').forEach(a=>{a.rel='noopener noreferrer';a.addEventListener('click',event=>{event.preventDefault();run(()=>api('链接',a.href))})});
}
function renderResult(){$('resultContent').hidden=!resultText;$('resultEmpty').hidden=!!resultText;$('resultEmpty').textContent=t(currentRow?'noResult':'initial');if(resultText)markdown($('resultContent'),resultText);updateControls()}
function card(record,archive=false){const d=record.data;
 return '<article class="record" tabindex="0" role="button" data-row="'+record.row+'" aria-label="'+esc(t('details'))+'"><div class="record-main">'+(d['命盘图片']?'<img class="thumb" loading="lazy" src="'+fileURL(d['命盘图片'])+'" alt="'+esc(t('image'))+'">':'')+'<div class="record-copy"><span class="tag">'+esc(label(d['咨询主题']))+'</span><h3>'+esc(d['出生日期']||'—')+' · '+esc(d['出生时间']||'—')+'</h3><p>'+esc(label(d['性别'])||'—')+' · '+esc(label(d['历法'])||'—')+' · '+esc(d['出生地']||'—')+'</p><p>'+esc(archive?d['排盘口径']:record.summary||'—')+'</p></div></div>'+(archive?'<div class="record-actions"><button data-action="detail">'+esc(t('details'))+'</button><button data-action="edit">'+esc(t('edit'))+'</button><button data-action="delete" class="danger">'+esc(t('delete'))+'</button></div>':'')+'</article>';
}
function filtered(){const q=$('search').value.trim().toLocaleLowerCase();return records.filter(r=>{const d=r.data;return (!q||['出生地','排盘口径','出生时间'].some(f=>(d[f]||'').toLocaleLowerCase().includes(q)))&&(!$('filterTopic').value||d['咨询主题']===$('filterTopic').value)&&(!$('filterCalendar').value||d['历法']===$('filterCalendar').value)&&(!$('filterGender').value||d['性别']===$('filterGender').value)})}
function renderLists(){
 const metrics=[['total','fa-star',dataReady?recordCount:'—'],['career','fa-briefcase',dataReady?topics.filter(v=>v==='事业').length:'—'],['love','fa-heart',dataReady?topics.filter(v=>v==='感情').length:'—'],['wealth','fa-coins',dataReady?topics.filter(v=>v==='财运').length:'—']];
 $('statistics').innerHTML=metrics.map(([key,icon,n])=>'<div class="stat"><i class="fa-solid '+icon+'"></i><div><strong>'+esc(n)+'</strong><span>'+esc(t(key))+'</span></div></div>').join('');

async function refreshData(){
 const results=await Promise.all([api('GetRecordCount'),api('GetTableCSV',SOURCE,FIELDS.join(',')),api('GetTableCSV',SOURCE,'咨询主题')]);
 const count=Number(results[0]);if(!Number.isFinite(count)||count<0)throw Error(t('unavailable'));
 const loaded=parseCSV(results[1]).map((row,index)=>({row:index+1,data:Object.fromEntries(FIELDS.map((f,i)=>[f,row[i]||'']))}));
 // New records are inserted at row 1; preserve physical row numbers when showing the newest five.
 for(const record of loaded.slice(0,5)){const full=await api('GetCellValue',SOURCE,'排盘口径/'+record.row);record.summary=full.length>75?full.slice(0,75)+'…':full}
 recordCount=count;records=loaded;topics=parseCSV(results[2]).map(r=>r[0]);dataReady=true;loadError='';renderLists();
}
async function readRecord(row){const data={};for(const name of [...FIELDS,'解盘结果'])data[name]=await api('GetCellValue',SOURCE,name+'/'+row);return data}
async function loadRecord(row){if(busy||polling)return;busy=true;updateControls();try{const data=await readRecord(row);recordCount=Number(await api('GetRecordCount'));currentRow=row;fill(data);resultText=data['解盘结果'];statusKey='';renderResult();navigate('chart')}finally{busy=false;updateControls()}}
function renderDetail(data){$('detailBody').innerHTML='<div class="detail-fields">'+FIELDS.map(f=>'<div class="detail-field"><small>'+esc(label(f))+'</small>'+esc(label(data[f])||'—')+'</div>').join('')+'</div>'+(data['命盘图片']?'<a href="'+fileURL(data['命盘图片'])+'" target="_blank" rel="noopener"><img class="detail-image" src="'+fileURL(data['命盘图片'])+'" alt="'+esc(t('image'))+'"></a>':'')+'<h3>'+esc(t('result'))+'</h3><article id="detailMarkdown" class="markdown"></article>';markdown($('detailMarkdown'),data['解盘结果']||t('noResult'))}
async function showDetail(row){if(busy)return;detailRow=row;detailData=null;$('detailBody').textContent=t('loading');openModal('detailModal');try{const data=await readRecord(row);if(detailRow===row&&!$('detailModal').hidden){detailData=data;renderDetail(data)}}catch(e){if(!$('detailModal').hidden)$('detailBody').textContent=t('error')+String(e);throw e}}
function confirmDeletion(){return new Promise(resolve=>{confirmResolve=resolve;openModal('confirmModal')})}
async function deleteRecord(row){
 if(busy||polling)return;if(!await confirmDeletion())return;busy=true;updateControls();
 try{await api('DeleteRecord',SOURCE,row.toString());if(!$('detailModal').hidden)closeModal('detailModal');if(currentRow===row){currentRow=0;resultText='';fill({'咨询主题':'整体命盘','历法':'公历','排盘口径':DEFAULT_SCOPE});renderResult()}else if(currentRow>row)currentRow--;await refreshData();notify(t('removed'))}finally{busy=false;updateControls()}
}
async function saveRecord(){if(busy||polling||!$('chartForm').reportValidity())return;busy=true;updateControls();try{const data=values();for(const name of FIELDS)await api('SetCellValue',SOURCE,name+'/'+currentRow+'/'+data[name]);await refreshData();notify(t('saved'))}catch(e){notify(t('partial'));throw e}finally{busy=false;updateControls()}}
async function pollResult(){
 polling=true;statusKey='waiting';renderResult();const deadline=Date.now()+1800000;
 try{
 while(Date.now()<deadline){
  await new Promise(resolve=>setTimeout(resolve,1000));
  const remaining=deadline-Date.now();if(remaining<=0)break;
  let timer;
  const value=await Promise.race([(async()=>{const ready=await api('轮询',TABLE,'解盘结果');if(!String(ready).trim())return '';const result=await api('GetCellValue',SOURCE,'解盘结果/'+currentRow);return String(result).trim()?result:ready})(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error(t('timeout'))),remaining)})]).finally(()=>clearTimeout(timer));
  if(String(value).trim()){resultText=value;statusKey='';renderResult();return}
 }
 statusKey='timeout';
 }finally{polling=false;updateControls()}
}
async function submitRecord(event){
 event.preventDefault();if(busy||polling||!$('chartForm').reportValidity())return;busy=true;updateControls();
 try{await api('SubmitRecord',TABLE,JSON.stringify(values()));currentRow=1;resultText='';statusKey='waiting';renderResult();
 // Keep the form locked while the data refresh and server-side reading are in progress.
 polling=true;try{await refreshData()}catch(e){notify(t('error')+String(e))}busy=false;await pollResult();
 }catch(e){statusKey='';notify(t('error')+String(e))}finally{busy=false;polling=false;updateControls()}
}

async function initialize(){
 try{const saved=localStorage.getItem('iThinkAir_UiLanguage'),parameter=new URLSearchParams(location.search).get('lang');lang=saved?(saved==='en'?'en':'cn'):parameter==='cn'||parameter==='en'?parameter:!navigator.languages||!navigator.languages.length||navigator.languages.some(l=>/^zh(?:-|$)/i.test(l))?'cn':'en'}catch{lang='cn'}

 document.querySelectorAll('[data-page]').forEach(e=>e.addEventListener('click',()=>navigate(e.dataset.page)));
 document.querySelectorAll('.language').forEach(e=>e.addEventListener('click',()=>{lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch{}setLanguage();renderResult();closeMenu()}));

 ['search','filterTopic','filterCalendar','filterGender'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{limit=12;renderLists()}));

 $('confirmCancel').addEventListener('click',()=>closeModal('confirmModal'));$('confirmDelete').addEventListener('click',()=>{const resolve=confirmResolve;confirmResolve=null;closeModal('confirmModal');resolve?.(true)});

 document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(modalStack.length)closeModal(modalStack[modalStack.length-1].id);else closeMenu()}if(event.key==='Tab'&&modalStack.length){const dialog=$(modalStack[modalStack.length-1].id);const nodes=Array.from(dialog.querySelectorAll('button:not(:disabled),a[href],input,select,textarea,[tabindex="0"]')).filter(e=>e.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(!first){event.preventDefault();return}if(event.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('dialog'))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement.classList.contains('dialog'))){event.preventDefault();first.focus()}}});
 function keepVisible(){const element=document.activeElement;if(!element?.matches('input:not([type=hidden]),select,textarea'))return;const keyboard=window.visualViewport?Math.max(0,innerHeight-visualViewport.height):320;document.documentElement.style.setProperty('--keyboard-space',Math.max(320,keyboard+100)+'px');document.body.classList.add('keyboard-open');setTimeout(()=>element.scrollIntoView({block:'center',behavior:'smooth'}),150)}
