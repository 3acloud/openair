0%;overflow-x:auto;border-collapse:collapse}.markdown th,.markdown td{padding:7px 10px;border:1px solid var(--line);white-space:nowrap}.markdown th{background:var(--accent-soft)}.markdown img{max-width:100%;height:auto;cursor:pointer;border-radius:6px}.markdown hr{border:0;border-top:1px solid var(--line);margin:22px 0}.markdown input[type=checkbox]{accent-color:var(--accent)}

  </nav></header>
  <main>
    <section id="homePage" class="page active"><div class="hero"><span class="eyebrow"><i class="fa-solid fa-graduation-cap"></i><span data-i18n="eyebrow">为教师而设计</span></span><h1 data-i18n="appName">中小学试卷生成器</h1><p data-i18n="homeIntro">按学科、年级、知识点、题型与难度智能出题，生成规范试卷和参考答案，贴合课程标准，便于组卷考试</p><div class="hero-actions"><button id="startCompose" class="btn btn-large" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="start">开始智能组卷</span></button></div></div><div id="homeStatus" class="status hidden" role="status"></div><div class="stats"><div class="stat"><i class="fa-solid fa-layer-group stat-icon"></i><div class="stat-label" data-i18n="totalPapers">总试卷数</div><div id="totalCount" class="stat-value">—</div></div><div class="stat"><i class="fa-solid fa-school stat-icon"></i><div class="stat-label" data-i18n="primaryPapers">小学试卷数</div><div id="primaryCount" class="stat-value">—</div></div><div class="stat"><i class="fa-solid fa-building-columns stat-icon"></i><div class="stat-label" data-i18n="middlePapers">初中试卷数</div><div id="middleCount" class="stat-value">—</div></div><div class="stat"><i class="fa-solid fa-fire stat-icon"></i><div class="stat-label" data-i18n="hardPapers">困难试卷数</div><div id="hardCount" class="stat-value">—</div></div></div><div class="section-head"><h2 data-i18n="subjectDistribution">学科分布</h2></div><div id="subjectGrid" class="subject-grid"></div><div class="section-head"><h2 data-i18n="recentPapers">最近组卷</h2><button id="allPapers" class="btn btn-outline btn-small" type="button"><span data-i18n="viewAll">查看全部</span><i class="fa-solid fa-arrow-right"></i></button></div><div id="recentList" class="recent-list"></div></section>
    <section id="composePage" class="page"><div class="page-head"><div><span class="eyebrow" data-i18n="paperStudio">PAPER STUDIO</span><h1 data-i18n="compose">智能组卷</h1><p data-i18n="composeIntro">填写组卷条件，一键生成规范试卷与参考答案</p></div><button id="toLibrary" class="btn btn-outline" type="button"><i class="fa-solid fa-box-archive"></i><span data-i18n="viewLibrary">查看试卷库</span></button></div><div class="compose-grid"><div class="paper"><h2 class="panel-title"><i class="fa-solid fa-pen-to-square"></i><span data-i18n="newPaper">新建试卷</span></h2><form id="newPaperForm" novalidate></form><div class="form-note" data-i18n="formNote">试卷标题如“七年级上学期期中数学测试”；知识点可填写多个，用顿号分隔；题量可写“选择题10、填空题5、解答题4”等；考试时长单位为分钟。</div><div class="form-actions"><button id="generateButton" class="btn" type="button" disabled><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="generate">生成试卷</span></button><button id="clearButton" class="btn btn-ghost" type="button" data-i18n="clearAll">清空重填</button></div></div><div id="previewPanel" class="paper preview-panel"><div class="preview-head"><h2 class="panel-title" style="margin:0"><i class="fa-regular fa-file-lines"></i><span data-i18n="preview">生成预览</span></h2><div class="preview-actions"><button id="printPreview" class="btn btn-outline btn-small hidden" type="button"><i class="fa-solid fa-print"></i><span data-i18n="printPreview">打印预览</span></button><button id="regenerateButton" class="btn btn-ghost btn-small hidden" type="button"><i class="fa-solid fa-rotate"></i><span data-i18n="another">再出一份</span></button></div></div><div id="previewBody" class="preview-placeholder"><i class="fa-regular fa-file-lines"></i><p data-i18n="previewEmpty">填写左侧组卷条件后点击「生成试卷」，规范试卷将在这里呈现</p></div></div></div></section>
    <section id="libraryPage" class="page"><div class="page-head"><div><span class="eyebrow" data-i18n="paperArchive">PAPER ARCHIVE</span><h1 data-i18n="library">试卷库</h1><p data-i18n="libraryIntro">浏览、检索和管理全部已生成试卷</p></div><button id="newFromLibrary" class="btn" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="newPaper">新建试卷</span></button></div><div id="libraryStatus" class="status hidden" role="status"></div><div class="paper toolbar"><div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="librarySearch" class="control" type="search" data-placeholder="searchPlaceholder" aria-label="Search"></div><select id="subjectFilter" class="control" aria-label="Subject"></select><select id="gradeFilter" class="control" aria-label="Grade"></select><select id="difficultyFilter" class="control" aria-label="Difficulty"></select><select id="typeFilter" class="control" aria-label="Question type"></select></div><p id="libraryCount" class="library-count"></p><div id="libraryGrid" class="library-grid"></div></section>
  </main>

  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时

                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';

    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);

  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**
 * 上传文件到Flask服务端
 * @param {File} file - 要上传的文件
 * @returns {Promise<string>} - 返回GUID文件名
 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

    function renderMarkdown(raw){const text=String(raw||'');if(!window.marked||!window.DOMPurify)return `<pre>${safe(text)}</pre>`;const html=window.marked.parse(text,{gfm:true,breaks:true});return window.DOMPurify.sanitize(html,{ADD_ATTR:['target','download']})}
    function normalizeMarkdownImages(container){container.querySelectorAll('img').forEach(img=>{const original=img.getAttribute('src')||'';if(!original)return;const filename=original.startsWith('http://' + window.location.hostname + ':3130/download/')?decodeURIComponent(original.split('/').pop()):original.includes('://')?decodeURIComponent(new URL(original,location.href).pathname.split('/').pop()):decodeURIComponent(original.split('/').pop());const target='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(filename);img.src=target;img.title=language==='cn'?'点击下载图片':'Download image';img.tabIndex=0;const download=()=>{const link=document.createElement('a');link.href=target;link.download=filename;document.body.append(link);link.click();link.remove()};img.addEventListener('click',download);img.addEventListener('keydown',event=>{if(event.key==='Enter')download()})})}
    function renderPreview(){const body=$('previewBody');$('printPreview').classList.toggle('hidden',previewState!=='done');$('regenerateButton').classList.toggle('hidden',previewState!=='done');if(previewState==='waiting'){body.className='preview-placeholder';body.innerHTML=`<div class="spinner" aria-hidden="true"></div><p>${t('wait')}</p>`;return}if(previewState==='error'){body.className='preview-placeholder';body.innerHTML=`<i class="fa-solid fa-circle-exclamation"></i><p role="alert">${safe(previewMessage)}</p>`;return}if(previewState==='done'){const data=readForm($('newPaperForm'));body.className='';body.innerHTML=`<h3 class="preview-paper-title">${safe(data['试卷标题'])}</h3><div class="summary-strip">${badge(data['学科'],'subject')}${badge(data['年级'])}${badge(data['难度'],difficultyClass(data['难度']))}<span class="badge"><i class="fa-regular fa-clock"></i>&nbsp;${safe(data['考试时长']||t('noValue'))}${t('minutes')}</span></div><div class="markdown">${renderMarkdown(generatedMarkdown)}</div>`;normalizeMarkdownImages(body);return}body.className='preview-placeholder';body.innerHTML=`<i class="fa-regular fa-file-lines"></i><p>${t('previewEmpty')}</p>`}
    async function generatePaper(){const data=readForm($('newPaperForm'));if(generationActive||!validForm(data))return;setGenerationActive(true);currentRow=0;generatedMarkdown='';previewMessage='';previewState='waiting';renderPreview();try{await callAppBridge({type:'SubmitRecord',data:FORM_TABLE,payload:JSON.stringify(data)});currentRow=1;await refreshData();const deadline=Date.now()+1800*1000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));const content=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'试卷内容/'+currentRow});if(String(content||'').trim()){generatedMarkdown=String(content);previewState='done';renderPreview();await refreshData();return}}previewMessage=t('timeout');previewState='error';renderPreview()}catch(error){previewMessage=`${t('generateError')}: ${error.message||error}`;previewState='error';renderPreview()}finally{setGenerationActive(false)}}
    function clearCompose(keepConditions=false){if(generationActive)return;if(!keepConditions)$('newPaperForm').reset();currentRow=0;generatedMarkdown='';previewMessage='';previewState='empty';renderPreview();updateGenerateButton()}
    function createModal(html,wide=false,markdown=false){const overlay=document.createElement('div');overlay.className=`overlay${markdown?' markdown-overlay':''}`;overlay.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;overlay.addEventListener('pointerdown',event=>{if(event.target===overlay)closeModal(overlay)});$('overlayRoot').append(overlay);modalStack.push(overlay);document.body.style.overflow='hidden';return overlay}
    function closeModal(target){const overlay=target||modalStack[modalStack.length-1];if(!overlay)return;const index=modalStack.indexOf(overlay);if(index!==-1)modalStack.splice(index,1);overlay.remove();detailToken++;if(!modalStack.length)document.body.style.overflow=''}
    async function readDetails(row){const result={};for(const field of [...FIELDS,'试卷内容'])result[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`${field}/${row}`});return result}
    async function openDetails(row){currentRow=row;const token=++detailToken;const overlay=createModal(`<div class="modal-head"><h2>${t('details')}</h2><button class="icon-button" type="button" data-modal-close aria-label="${t('close')}"><i class="fa-solid fa-xmark"></i></button></div><div class="status">${t('loadingDetail')}</div>`,true,true);try{const values=await readDetails(row);if(token!==detailToken||!overlay.isConnected)return;const detailItems=FIELD_CONFIG.map(field=>`<div class="detail-item"><dt>${safe(t(field.label))}</dt><dd>${safe(field.options?optionName(values[field.key]):values[field.key]||t('noValue'))}</dd></div>`).join('');const modal=overlay.querySelector('.modal');modal.innerHTML=`<div class="modal-head"><h2>${safe(values['试卷标题']||t('details'))}</h2><button class="icon-button" type="button" data-modal-close aria-label="${t('close')}"><i class="fa-solid fa-xmark"></i></button></div><dl class="detail-grid">${detailItems}</dl><div class="detail-content"><div class="section-head"><h2>${t('paperContent')}</h2></div><div class="markdown">${values['试卷内容']?renderMarkdown(values['试卷内容']):`<p>${t('contentEmpty')}</p>`}</div></div><div class="modal-actions"><button class="btn btn-outline btn-small" type="button" data-detail-print><i class="fa-solid fa-print"></i>${t('print')}</button><button class="btn btn-ghost btn-small" type="button" data-detail-edit data-row="${row}">${t('edit')}</button></div>`;normalizeMarkdownImages(modal)}catch(error){if(overlay.isConnected)overlay.querySelector('.status').textContent=`${t('detailError')}: ${error.message||error}`}}
    async function openEdit(row){currentRow=row;const overlay=createModal(`<div class="modal-head"><h2>${t('editPaper')}</h2><button class="icon-button" type="button" data-modal-close aria-label="${t('close')}"><i class="fa-solid fa-xmark"></i></button></div><div class="status">${t('loadingDetail')}</div>`);try{const values={};for(const field of FIELDS)values[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:`${field}/${row}`});if(!overlay.isConnected)return;overlay.querySelector('.modal').innerHTML=`<div class="modal-head"><h2>${t('editPaper')}</h2><button class="icon-button" type="button" data-modal-close aria-label="${t('close')}"><i class="fa-solid fa-xmark"></i></button></div><form id="editPaperForm" novalidate></form><div id="editStatus" class="status hidden"></div><div class="modal-actions"><button id="saveEdit" class="btn" type="button">${t('save')}</button><button class="btn btn-outline" type="button" data-modal-close>${t('cancel')}</button></div>`;renderForm('editPaperForm',values);$('saveEdit').addEventListener('click',async()=>{const data=readForm($('editPaperForm'));if(!validForm(data)){showStatus('editStatus',t('requiredHint'),true);return}const save=$('saveEdit');save.disabled=true;save.textContent=t('working');try{for(const field of FIELDS)await callAppBridge({type:'SetCellValue',data:TABLE,payload:`${field}/${row}/${data[field]}`});await refreshData();closeModal(overlay);showStatus('libraryStatus',t('saveSuccess'))}catch(error){showStatus('editStatus',`${t('saveError')}: ${error.message||error}`,true);save.disabled=false;save.textContent=t('save')}})}catch(error){if(overlay.isConnected)overlay.querySelector('.status').textContent=`${t('detailError')}: ${error.message||error}`}}
    function confirmDelete(row){currentRow=row;const overlay=createModal(`<div class="modal-head"><h2>${t('deleteTitle')}</h2><button class="icon-button" type="button" data-modal-close aria-label="${t('close')}"><i class="fa-solid fa-xmark"></i></button></div><p>${t('deleteConfirm')}</p><div id="deleteStatus" class="status hidden"></div><div class="modal-actions"><button id="confirmDelete" class="btn btn-danger" type="button">${t('delete')}</button><button class="btn btn-outline" type="button" data-modal-close>${t('cancel')}</button></div>`);overlay.querySelector('#confirmDelete').addEventListener('click',async()=>{const button=overlay.querySelector('#confirmDelete');button.disabled=true;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});currentRow=0;await refreshData();closeModal(overlay);showStatus('libraryStatus',t('deleteSuccess'))}catch(error){showStatus('deleteStatus',`${t('deleteError')}: ${error.message||error}`,true);button.disabled=false}})}
    function printContent(element){$('printRoot').innerHTML=element.innerHTML;$('printRoot').classList.remove('hidden');const cleanup=()=>{$('printRoot').classList.add('hidden');$('printRoot').innerHTML='';window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);window.print()}
    function focusVisible(input){if(window.innerWidth>750||!input.matches('input,select,textarea'))return;const scroll=()=>{input.scrollIntoView({block:'center',behavior:'smooth'});const modal=input.closest('.modal');if(modal)modal.style.paddingBottom='max(180px,40vh)'};setTimeout(scroll,180);if(window.visualViewport)setTimeout(scroll,350)}
    async function initialize(){language=detectLanguage();document.documentElement.lang=language==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.placeholder)});$('langButton').textContent=language==='cn'?'EN':'中文';$('menuLanguage').textContent=t('language');document.title=t('appName');renderForm('newPaperForm');renderFilters();renderHome();renderLibrary();renderPreview();adjustNavigation();try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light'}catch(error){document.documentElement.dataset.theme=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}await refreshData()}
    document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>switchPage(button.dataset.page)));$('brandButton').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});$('menuButton').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))});$('langButton').addEventListener('click',()=>setLanguage(language==='cn'?'en':'cn'));$('menuLanguage').addEventListener('click',()=>setLanguage(language==='cn'?'en':'cn'));document.addEventListener('pointerdown',event=>{if(!$('mainNav').contains(event.target))closeMobileMenu()});$('startCompose').addEventListener('click',()=>switchPage('compose'));$('allPapers').addEventListener('click',()=>switchPage('library'));$('toLibrary').addEventListener('click',()=>switchPage('library'));$('newFromLibrary').addEventListener('click',()=>switchPage('compose'));$('newPaperForm').addEventListener('input',updateGenerateButton);$('newPaperForm').addEventListener('change',updateGenerateButton);$('generateButton').addEventListener('click',generatePaper);$('clearButton').addEventListener('click',()=>clearCompose(false));$('regenerateButton').addEventListener('click',()=>clearCompose(true));$('printPreview').addEventListener('click',()=>printContent($('previewBody')));for(const id of ['librarySearch','subjectFilter','gradeFilter','difficultyFilter','typeFilter'])$(id).addEventListener(id==='librarySearch'?'input':'change',renderLibrary);$('recentList').addEventListener('click',event=>{const card=event.target.closest('[data-row]');if(card)openDetails(Number(card.dataset.row))});$('recentList').addEventListener('keydown',event=>{if(event.key==='Enter'){const card=event.target.closest('[data-row]');if(card)openDetails(Number(card.dataset.row))}});$('libraryGrid').addEventListener('click',event=>{const card=event.target.closest('[data-row]');if(!card)return;const row=Number(card.dataset.row),action=event.target.closest('[data-action]')?.dataset.action;if(action==='edit')openEdit(row);else if(action==='delete')confirmDelete(row);else openDetails(row)});$('libraryGrid').addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('.card-main'))openDetails(Number(event.target.closest('[data-row]').dataset.row))});$('overlayRoot').addEventListener('click',event=>{const close=event.target.closest('[data-modal-close]');if(close){closeModal(close.closest('.overlay'));return}const print=event.target.closest('[data-detail-print]');if(print){printContent(print.closest('.modal').querySelector('.detail-content'));return}const edit=event.target.closest('[data-detail-edit]');if(edit){const row=Number(edit.dataset.row);closeModal(edit.closest('.overlay'));openEdit(row)}});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(modalStack.length)closeModal();else closeMobileMenu()}});document.addEventListener('focusin',event=>focusVisible(event.target));if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,select,textarea'))focusVisible(active)});window.addEventListener('resize',adjustNavigation);if(window.ResizeObserver)new ResizeObserver(adjustNavigation).observe($('mainNav'));(async () => {    await initialize();  })()});
  </script>
