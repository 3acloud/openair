*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}input,select,textarea{box-sizing:border-box}button{cursor:pointer}button:disabled{cursor:wait;opacity:.62}button:focus-visible,input:focus-visible{outline:3px solid rgba(52,120,246,.32);outline-offset:2px}

.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;white-space:nowrap;font-weight:800;font-size:18px}.brand-icon,.hero-icon{display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 10px 28px rgba(65,105,236,.26)}.brand-icon{width:38px;height:38px;border-radius:12px;font-size:17px}.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}.icon-button,.language-button{height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:650}.icon-button:hover,.language-button:hover{border-color:var(--blue);color:var(--blue)}.history-button{position:relative}.history-button span{white-space:nowrap}.lang-toggle{display:flex;gap:6px}.language-button{padding:0 11px}.language-button.active{background:rgba(52,120,246,.1);border-color:var(--blue);color:var(--blue)}.menu-button{display:none;width:42px;padding:0}.mobile-menu{display:none;position:absolute;top:100%;right:16px;width:min(270px,calc(100vw - 32px));padding:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:0 0 17px 17px}.mobile-menu.open{display:block}.mobile-menu button{width:100%;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:none;color:var(--ink);border:0;border-radius:9px;text-align:left}.mobile-menu button:hover{background:rgba(52,120,246,.1)}

.result{display:none;height:calc(100dvh - 72px);flex-direction:column}.result.active{display:flex}.initial.hidden{display:none}.result-search{display:flex;align-items:center;gap:20px;padding:16px clamp(16px,3vw,48px);background:var(--surface);border-bottom:1px solid var(--line)}.result-search .section-label{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}.result-search .search-form{height:56px;max-width:980px;box-shadow:none;border-radius:15px}.result-search .search-icon{font-size:16px;margin-left:13px}.result-search .primary-button{height:42px;border-radius:10px;padding:0 19px}.result-body{position:relative;flex:1;min-height:0;background:var(--surface)}.result-frame{width:100%;height:100%;border:0;background:var(--surface)}.state-panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;background:var(--bg);overflow:auto}.state-panel[hidden]{display:none}.state-card{width:min(620px,100%);padding:45px 34px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.state-orb{height:64px;width:64px;display:grid;place-items:center;margin:auto auto 24px;border-radius:19px;color:#fff;font-size:25px;background:linear-gradient(135deg,var(--blue),var(--blue2));animation:pulse 1.7s ease-in-out infinite}.state-card h2{margin:0 0 13px;font-size:23px}.state-card p{margin:0;color:var(--muted);line-height:1.7;overflow-wrap:anywhere}.progress-track{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:28px 0 22px}.progress-bar{height:100%;width:36%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--blue2));animation:progress 2.2s ease-in-out infinite}.skeleton{display:grid;gap:11px;text-align:left}.skeleton span{height:13px;border-radius:7px;background:linear-gradient(90deg,var(--line),rgba(130,165,230,.24),var(--line));background-size:200% 100%;animation:shimmer 1.6s linear infinite}.skeleton span:nth-child(2){width:86%}.skeleton span:nth-child(3){width:65%}.state-card .retry{margin-top:25px}.retry[hidden]{display:none}
.drawer-overlay{position:fixed;inset:0;z-index:1100;background:var(--veil);opacity:0;pointer-events:none;transition:opacity .25s}.drawer-overlay.open{opacity:1;pointer-events:auto}.drawer{position:fixed;z-index:1101;inset:0 0 0 auto;width:min(450px,100vw);display:flex;flex-direction:column;background:var(--surface);box-shadow:-20px 0 60px rgba(0,0,0,.15);transform:translateX(102%);transition:transform .3s ease}.drawer.open{transform:translateX(0)}.drawer-header{display:flex;align-items:center;gap:12px;padding:26px 24px 20px;border-bottom:1px solid var(--line)}.drawer-header h2{font-size:25px;margin:0}.count{margin-left:auto;padding:7px 10px;border-radius:999px;background:rgba(52,120,246,.12);color:var(--blue);font-size:12px;font-weight:800;white-space:nowrap}.close-button{border:0;background:transparent;color:var(--muted);font-size:21px;width:34px;height:34px;border-radius:8px}.close-button:hover{background:var(--line);color:var(--ink)}.drawer-list{flex:1;min-height:0;overflow:auto;padding:22px 20px 80px;display:flex;flex-direction:column;gap:13px}.history-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface);box-shadow:0 4px 16px rgba(40,64,106,.04)}.history-title{font-size:16px;font-weight:750;line-height:1.4;overflow-wrap:anywhere}.history-date{margin:10px 0 17px;color:var(--muted);font-size:13px}.history-actions{display:flex;justify-content:flex-end;gap:9px}.small-button{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface);color:var(--ink);font-weight:650;font-size:13px}.small-button:hover{border-color:var(--blue);color:var(--blue)}.small-button.view{background:rgba(52,120,246,.09);color:var(--blue);border-color:transparent}.small-button.delete:hover{border-color:#e35d68;color:#d94b59}.empty{text-align:center;color:var(--muted);padding:75px 20px;line-height:1.7}.empty i{display:block;font-size:31px;margin-bottom:15px;color:var(--blue)}.toast{position:fixed;z-index:1300;left:50%;bottom:28px;transform:translate(-50%,20px);max-width:min(90vw,540px);padding:12px 18px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(52,120,246,.1)}}@keyframes progress{0%{transform:translateX(-120%)}100%{transform:translateX(300%)}}@keyframes shimmer{to{background-position-x:-200%}}
@media(max-width:720px){.topbar{height:62px;padding:0 16px;gap:8px}.brand{font-size:15px}.brand-icon{width:34px;height:34px}.top-actions{gap:7px}.history-button span,.lang-toggle{display:none}.history-button{width:42px;padding:0}.menu-button{display:inline-flex}.page{padding-top:62px}.initial{min-height:calc(100dvh - 62px);padding:34px 16px 18vh}.hero-icon{width:70px;height:70px;font-size:29px;border-radius:21px;margin-bottom:24px}.hero p{margin-bottom:31px}.search-form{height:64px;border-radius:16px;padding:6px;gap:2px}.search-icon{margin-left:10px}.search-input{font-size:14px;padding:0 5px}.primary-button{height:50px;padding:0 15px;font-size:13px}.primary-button i{margin-right:4px}.result{height:calc(100dvh - 62px)}.result-search{padding:11px 12px}.result-search .section-label{display:none}.result-search .search-form{width:100%;height:52px}.result-search .primary-button{padding:0 12px;font-size:12px}.state-card{padding:30px 20px}.drawer-header{padding-top:max(20px,env(safe-area-inset-top))}.drawer-list{padding-bottom:200px}}
</style>

<body>
<header class="topbar" id="topbar">
  <a class="brand" id="brand" href="#" aria-label="Close"><span class="brand-icon"><i class="fa-solid fa-newspaper"></i></span><span data-i18n="brand">新闻智能搜索</span></a>
  <div class="top-actions"><div class="lang-toggle" id="langToggle"><button class="language-button" id="langCn" type="button">中文</button><button class="language-button" id="langEn" type="button">EN</button></div><button class="icon-button history-button" id="historyButton" type="button" aria-label="历史搜索记录"><i class="fa-solid fa-clock-rotate-left"></i><span data-i18n="historySearch">历史搜索记录</span></button><button class="icon-button menu-button" id="menuButton" type="button" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button></div>
  <div class="mobile-menu" id="mobileMenu"><button type="button" id="mobileHistory"><i class="fa-solid fa-clock-rotate-left"></i><span data-i18n="historySearch">历史搜索记录</span></button><button type="button" id="mobileCn"><i class="fa-solid fa-language"></i>中文</button><button type="button" id="mobileEn"><i class="fa-solid fa-language"></i>English</button></div>
</header>
<main class="page" id="page">
  <section class="initial" id="initialView"><div class="hero"><div class="hero-icon"><i class="fa-solid fa-globe"></i></div><h1 data-i18n="title">新闻智能搜索页</h1><p data-i18n="subtitle">输入感兴趣的主题，AI智能体将为您全网检索新闻并生成专属聚合页面</p><form class="search-form" id="searchForm" autocomplete="off"><i class="fa-solid fa-magnifying-glass search-icon"></i><input class="search-input" id="searchForm_topic" name="搜索主题" type="search" required maxlength="300" data-placeholder="placeholder"><button class="primary-button" id="searchForm_submit" type="submit"><i class="fa-solid fa-sparkles"></i><span data-i18n="search">AI 搜索</span></button></form><div class="hint" data-i18n="hint">搜索结果将生成独立的新闻阅读页面</div></div></section>
  <section class="result" id="resultView"><div class="result-search"><span class="section-label" data-i18n="newSearch">新建搜索</span><form class="search-form" id="resultSearchForm" autocomplete="off"><i class="fa-solid fa-magnifying-glass search-icon"></i><input class="search-input" id="resultSearchForm_topic" name="搜索主题" type="search" required maxlength="300" data-placeholder="placeholder"><button class="primary-button" id="resultSearchForm_submit" type="submit"><i class="fa-solid fa-sparkles"></i><span data-i18n="search">AI 搜索</span></button></form></div><div class="result-body"><iframe class="result-frame" id="resultFrame" title="News result" referrerpolicy="no-referrer"></iframe><div class="state-panel" id="statePanel" hidden><div class="state-card"><div class="state-orb" id="stateOrb"><i class="fa-solid fa-wand-magic-sparkles"></i></div><h2 id="stateTitle"></h2><p id="stateText"></p><div class="progress-track" id="progressTrack"><div class="progress-bar"></div></div><div class="skeleton" id="skeleton"><span></span><span></span><span></span></div><button class="small-button retry" id="retryButton" type="button" hidden></button></div></div></div></section>
</main>
<div class="drawer-overlay" id="drawerOverlay"></div><aside class="drawer" id="historyDrawer" aria-hidden="true"><div class="drawer-header"><h2 data-i18n="history">历史记录</h2><span class="count" id="historyCount">0</span><button class="close-button" id="closeDrawer" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="drawer-list" id="historyList"></div></aside><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("685d62030fff69fa_新闻搜索页")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {

      if (file) {

        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function hideState(){$('statePanel').hidden=true;}
function setBusy(value){busy=value;$('searchForm_submit').disabled=value;$('resultSearchForm_submit').disabled=value;}
function fileUrl(filename){return 'http://' + window.location.hostname + ':3130/private/'+encodeURIComponent(filename);}
function openFile(filename,key='',remember=true){if(!filename){showToast(t('missing'));return;}if(remember&&currentView==='result')viewHistory.push(snapshot());switchView('result',remember);currentFile=filename;currentRecordKey=key;$('resultFrame').src=fileUrl(filename);showState(t('loadingResult'),'', 'loading');closeDrawer();}
function openDrawer(){closeMenu();drawerOpen=true;$('historyDrawer').classList.add('open');$('drawerOverlay').classList.add('open');$('historyDrawer').setAttribute('aria-hidden','false');refreshHistory();}
function closeDrawer(){drawerOpen=false;$('historyDrawer').classList.remove('open');$('drawerOverlay').classList.remove('open');$('historyDrawer').setAttribute('aria-hidden','true');}
function closeMenu(){menuOpen=false;$('mobileMenu').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false');}
function renderHistory(){const container=$('historyList');container.replaceChildren();if(!historyItems.length){container.innerHTML=`<div class="empty"><i class="fa-regular fa-folder-open"></i>${escapeHtml(t('empty'))}</div>`;return;}for(const item of historyItems){const card=document.createElement('article');card.className='history-card';card.innerHTML=`<div class="history-title">${escapeHtml(item.topic)}</div><div class="history-date"><i class="fa-regular fa-clock"></i> ${escapeHtml(displayDate(item.time))}</div><div class="history-actions"><button class="small-button view" type="button"><i class="fa-regular fa-eye"></i> ${escapeHtml(t('view'))}</button><button class="small-button delete" type="button"><i class="fa-regular fa-trash-can"></i> ${escapeHtml(t('delete'))}</button></div>`;card.querySelector('.view').addEventListener('click',()=>openFile(item.file,historyKey(item)));card.querySelector('.delete').addEventListener('click',()=>deleteHistory(item));container.append(card);}}
async function refreshHistory(){if(!historyItems.length)$('historyList').innerHTML=`<div class="empty">${escapeHtml(t('loading'))}</div>`;try{const [csv,count]=await Promise.all([callAppBridge({type:'GetTableCSV',data:TABLE,payload:'搜索主题,搜索时间,结果页面'}),callAppBridge({type:'GetRecordCount',data:TABLE})]);historyItems=parseCSV(String(csv||'')).map((row,index)=>({topic:row[0]||'',time:row[1]||'',file:row[2]||'',row:index+1}));historyItems.sort((a,b)=>{const ta=Date.parse(a.time.replace(' ','T'))||0,tb=Date.parse(b.time.replace(' ','T'))||0;return tb-ta||a.row-b.row;});const countValue=Number.parseInt(count,10);$('historyCount').textContent=t('total',{count:Number.isFinite(countValue)?countValue:historyItems.length});renderHistory();}catch(error){$('historyList').innerHTML=`<div class="empty">${escapeHtml(t('error',{message:error.message||error}))}</div>`;}}
async function deleteHistory(item){if(!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:item.row.toString()});if(currentRecordKey===historyKey(item)||currentFile&&currentFile===item.file){pollingId++;setBusy(false);currentFile='';currentRecordKey='';$('resultFrame').removeAttribute('src');showState(t('deleted'),t('deletedDetail'),'error');}await refreshHistory();}catch(error){showToast(t('error',{message:error.message||error}));}}
async function pollForFile(topic,token){const start=Date.now();while(token===pollingId&&Date.now()-start<1800000){try{const file=String(await callAppBridge({type:'轮询',data:'搜索记录',payload:'结果页面'})||'').trim();if(token!==pollingId)return;if(file){setBusy(false);openFile(file,topic+'\u0000'+''+'\u0000'+file,false);refreshHistory();return;}}catch(error){if(token!==pollingId)return;showToast(t('error',{message:error.message||error}));}await new Promise(resolve=>setTimeout(resolve,1000));}if(token===pollingId){setBusy(false);showState(t('timedOut'),t('timedOutDetail'),'error');refreshHistory();}}
async function submitSearch(event){event.preventDefault();if(busy)return;const input=event.currentTarget.querySelector('[name="搜索主题"]');const topic=input.value.trim();if(!topic){input.focus();return;}setBusy(true);try{await callAppBridge({type:'SubmitRecord',data:'搜索记录',payload:JSON.stringify({'搜索主题':topic,'搜索时间':formatLocalDate(new Date())})});pollingId++;currentFile='';currentRecordKey='';$('resultFrame').removeAttribute('src');switchView('result');$('resultSearchForm_topic').value=topic;showState(t('searching'),t('waiting',{topic}));closeDrawer();pollForFile(topic,pollingId);}catch(error){setBusy(false);showToast(t('error',{message:error.message||error}));}}
function airBack(){if(drawerOpen){closeDrawer();return 'false';}if(menuOpen){closeMenu();return 'false';}if(viewHistory.length){pollingId++;setBusy(false);const previous=viewHistory.pop();switchView(previous.view,false);currentFile=previous.file;currentRecordKey=previous.key;if(previous.file){$('resultFrame').src=fileUrl(previous.file);hideState();}else{$('resultFrame').removeAttribute('src');}requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false';}return 'true';}
window.airBack=airBack;
function focusInputVisible(event){const target=event.target;if(!target.matches('input,textarea,select'))return;setTimeout(()=>target.scrollIntoView({block:'center',behavior:'smooth'}),280);}
async function initialize(){language=detectLanguage();applyLanguage(language);
  $('brand').addEventListener('click',event=>{event.preventDefault();if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false);});$('searchForm').addEventListener('submit',submitSearch);$('resultSearchForm').addEventListener('submit',submitSearch);$('historyButton').addEventListener('click',openDrawer);$('mobileHistory').addEventListener('click',openDrawer);$('closeDrawer').addEventListener('click',closeDrawer);$('drawerOverlay').addEventListener('click',closeDrawer);$('menuButton').addEventListener('click',()=>{menuOpen=!menuOpen;$('mobileMenu').classList.toggle('open',menuOpen);$('menuButton').setAttribute('aria-expanded',String(menuOpen));});$('langCn').addEventListener('click',()=>setLanguage('cn'));$('langEn').addEventListener('click',()=>setLanguage('en'));$('mobileCn').addEventListener('click',()=>setLanguage('cn'));$('mobileEn').addEventListener('click',()=>setLanguage('en'));$('retryButton').addEventListener('click',()=>{$('resultSearchForm_topic').focus();});$('resultFrame').addEventListener('load',()=>{if(currentFile)hideState();});$('resultFrame').addEventListener('error',()=>showState(t('viewFailed'),t('viewFailedDetail'),'error'));document.addEventListener('pointerdown',event=>{if(menuOpen&&!$('topbar').contains(event.target))closeMenu();});document.addEventListener('focusin',focusInputVisible);document.addEventListener('keydown',event=>{if(event.key==='Escape')airBack();});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))active.scrollIntoView({block:'center',behavior:'smooth'});});try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light';}catch{document.documentElement.dataset.theme='light';}}
(async () => { await initialize(); })();
</script>
