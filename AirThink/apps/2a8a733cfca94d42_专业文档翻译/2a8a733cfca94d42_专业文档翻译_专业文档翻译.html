<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {

    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function chooseLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn';const p=new URLSearchParams(location.search).get('lang');if(p==='cn'||p==='en')return p;try{if(!navigator.languages)return 'cn';return navigator.languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}catch{return 'cn'}}

function animateNumber(node,target){const end=Math.max(0,Number(target)||0);const start=performance.now();function tick(now){const p=Math.min(1,(now-start)/550);node.textContent=String(Math.round(end*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}

async function refreshRecords(){el('taskGrid').innerHTML='<div class="empty">'+t('loading')+'</div>';try{const values=await Promise.all([csv(FIELD_NAMES),callAppBridge({type:'GetRecordCount',data:TABLE})]);state.records=values[0].map((r,i)=>({row:i+1,file:r[0]||'',domain:r[1]||'',direction:r[2]||'',translation:r[3]||''}));state.total=parseInt(values[1],10)||0;renderDomainFilter();renderRecords();if(state.pendingDetailRow){const row=state.pendingDetailRow;state.pendingDetailRow=0;await showDetail(row)}}catch(e){el('taskGrid').innerHTML='<div class="empty">'+esc(t('failed',{message:e.message||e}))+'</div>'}}
function renderDomainFilter(){const s=el('domainFilter'),old=s.value,domains=[...new Set(state.records.map(r=>r.domain).filter(Boolean))].sort((a,b)=>a.localeCompare(b));s.innerHTML='<option value="">'+t('allDomains')+'</option>'+domains.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');s.value=domains.includes(old)?old:''}
function renderRecords(){if(!el('taskGrid'))return;const q=el('searchInput').value.trim().toLocaleLowerCase(),domain=el('domainFilter').value,status=el('statusFilter').value,sort=el('sortSelect').value;let rows=state.records.filter(r=>(!q||(r.domain+' '+r.direction).toLocaleLowerCase().includes(q))&&(!domain||r.domain===domain)&&(!status||(status==='done'?!!r.translation:!r.translation)));if(sort==='domain')rows.sort((a,b)=>a.domain.localeCompare(b.domain)||a.row-b.row);el('taskGrid').innerHTML=rows.length?rows.map(r=>'<article class="task-card" data-row="'+r.row+'" tabindex="0"><div class="task-top"><span class="badge domain">'+esc(r.domain||'—')+'</span><span class="badge '+(r.translation?'done':'busy')+'">'+t(r.translation?'done':'busy')+'</span></div><h3>'+esc(r.direction||'—')+'</h3><p>'+t('taskNo')+' #'+r.row+'</p><div class="task-file"><i class="fa-regular fa-file-lines"></i> '+esc(fileName(r.file)||'—')+'</div><div class="task-actions"><button class="btn small" type="button" data-action="detail" data-row="'+r.row+'">'+t('details')+'</button><button class="btn small" type="button" data-action="download" data-row="'+r.row+'" '+(r.translation?'':'disabled')+'>'+t('downloadTranslation')+'</button><button class="btn small danger" type="button" data-action="delete" data-row="'+r.row+'">'+t('delete')+'</button></div></article>').join(''):'<div class="empty">'+t('empty')+'</div>';el('listFooter').textContent=t('totalAndFiltered',{total:state.total,filtered:rows.length});el('taskGrid').querySelectorAll('.task-card').forEach(card=>{card.addEventListener('click',e=>{if(!e.target.closest('button'))showDetail(Number(card.dataset.row))});card.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target===card)showDetail(Number(card.dataset.row))})});el('taskGrid').querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const row=Number(b.dataset.row),r=state.records.find(x=>x.row===row);if(b.dataset.action==='detail')showDetail(row); async function getDetails(row){const o={row};for(const f of FIELD_NAMES)o[f]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:f+'/'+row});return o}
function detailCell(label,value){return '<div class="detail-cell"><span>'+esc(label)+'</span><strong>'+esc(value||'—')+'</strong></div>'}
async function showDetail(row){state.currentRow=row;const layer=openModal('<div class="modal-head"><h2>'+t('details')+'</h2><button class="icon-button" type="button" data-close aria-label="'+t('close')+'"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body">'+t('loading')+'</div>','wide');try{const d=await getDetails(row);if(!layer.isConnected)return;const body=layer.querySelector('.modal-body');body.innerHTML='<div class="detail-grid">'+detailCell(t('taskNo'),'#'+row)+detailCell(t('domain'),d['专业领域'])+detailCell(t('direction'),d['细分方向'])+detailCell(t('file'),fileName(d['翻译文件']))+detailCell(t('translatedFile'),fileName(d['译文文件'])||t('fileMissing'))+'</div><div class="modal-actions" id="detailActions"></div><div id="detailMarkdown"></div>';const actions=body.querySelector('#detailActions');if(d['翻译文件'])actions.appendChild(linkButton(t('downloadOriginal'),DOWNLOAD,d['翻译文件']));if(d['译文文件']){actions.appendChild(linkButton(t('downloadTranslation'),DOWNLOAD,d['译文文件']));const preview=document.createElement('button');preview.type='button';preview.className='btn small';preview.textContent=t('preview');preview.onclick=()=>openPreview(d['译文文件']);actions.appendChild(preview);if(isMarkdown(d['译文文件'])){const md=document.createElement('button');md.type='button';md.className='btn small';md.textContent=t('markdownPreview');md.onclick=()=>openMarkdown(d['译文文件']);actions.appendChild(md);await renderMarkdownFile(d['译文文件'],body.querySelector('#detailMarkdown'))}}const edit=document.createElement('button');edit.type='button';edit.className='btn primary small';edit.textContent=t('edit');edit.onclick=()=>showEdit(row);actions.appendChild(edit)}catch(e){layer.querySelector('.modal-body').textContent=t('failed',{message:e.message||e})}}
function linkButton(label,base,file){const a=document.createElement('a');a.className='btn small';a.href=fileUrl(base,file);a.target='_blank';a.rel='noopener';a.textContent=label;return a}

function markdownHtml(text){if(!window.marked)return '<pre>'+esc(text)+'</pre>';let html=marked.parse(String(text||''));if(window.DOMPurify)html=DOMPurify.sanitize(html);else return '<pre>'+esc(text)+'</pre>';return html}

async function pollTranslation(token,original){const started=Date.now();while(token===state.pollToken&&Date.now()-started<1800000){await new Promise(resolve=>setTimeout(resolve,1000));if(token!==state.pollToken)break;try{const value=String(await callAppBridge({type:'轮询',data:'翻译任务',payload:'译文文件'})||'').trim();if(value){state.polling=false;el('submitStatus').textContent=t('success');showResult(original,value);updateSubmit();await refreshAll();return}}catch(e){el('submitStatus').textContent=t('failed',{message:e.message||e})}}if(token===state.pollToken){state.polling=false;el('submitStatus').textContent=t('timeout');updateSubmit();await refreshAll()}}
async function submitCreate(e){e.preventDefault();if(state.polling)return;if(!el('createForm_file').value||!el('createForm_domain').value.trim()||!el('createForm_direction').value.trim()){el('submitStatus').textContent=t('selectRequired');return}state.polling=true;updateSubmit();el('submitStatus').innerHTML='<span class="spinner"></span> '+t('working');const original=el('createForm_file').value;const payload={'翻译文件':original,'专业领域':el('createForm_domain').value.trim(),'细分方向':el('createForm_direction').value.trim()};try{await callAppBridge({type:'SubmitRecord',data:'翻译任务',payload:JSON.stringify(payload)});state.currentRow=1;el('submitStatus').innerHTML='<span class="spinner"></span> '+t('waiting');await refreshAll();const token=++state.pollToken;pollTranslation(token,original)}catch(error){state.polling=false;el('submitStatus').textContent=t('submitFailed',{message:error.message||error});updateSubmit()}}
function ensureInputVisible(target){if(!target.matches('input,textarea,select'))return;setTimeout(()=>{target.scrollIntoView({block:'center',behavior:'smooth'})},250)}
async function initialize(){state.lang=chooseLanguage();try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.mode=String(mode).trim()==='亮色'?'light':'dark'}catch{document.documentElement.dataset.mode='dark'}applyLanguage();fitNavigation();window.addEventListener('resize',fitNavigation);if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a)ensureInputVisible(a)});document.addEventListener('focusin',e=>ensureInputVisible(e.target));el('brand').onclick=e=>{e.preventDefault();if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)};document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));el('menuButton').onclick=toggleMenu;document.addEventListener('click',e=>{if(!el('nav').contains(e.target))closeMenu()});el('langButton').onclick=toggleLanguage;el('mobileLang').onclick=toggleLanguage;el('selectFileButton').onclick=async()=>{try{const file=await callAppBridge({type:'SelectFile'});if(file)setFile(String(file))}catch(e){el('submitStatus').textContent=String(e.message||e)}};el('clearFileButton').onclick=()=>setFile('');for(const id of ['createForm_domain','createForm_direction'])el(id).addEventListener('input',updateSubmit);el('createForm').addEventListener('submit',submitCreate);el('againButton').onclick=()=>{resetCreate();window.scrollTo({top:0,behavior:'smooth'})};for(const id of ['searchInput','domainFilter','statusFilter','sortSelect'])el(id).addEventListener(id==='searchInput'?'input':'change',renderRecords);await refreshAll()}
document.addEventListener('DOMContentLoaded',async()=>{await initialize()});
</script>
</body>
