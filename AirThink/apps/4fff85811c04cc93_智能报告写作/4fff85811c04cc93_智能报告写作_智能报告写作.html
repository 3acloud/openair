eat(3,minmax(0,1fr));gap:8px}.type-choice{background:var(--field);border:1px solid var(--line);border-top:3px solid var(--tone);border-radius:10px;padding:12px 8px;text-align:left;min-height:81px;color:var(--text)}.type-choice:hover,.type-choice.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--shadow)}.type-choice strong{display:block;color:var(--ink);font-size:13px}.type-choice small{display:block;font-size:11px;color:var(--muted);line-height:1.3;margin-top:5px}.attachment-row{display:flex;gap:8px;flex-wrap:wrap}.attachment-name{font-size:12px;color:var(--muted);word-break:break-all;margin-top:8px}.form-footer{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.help-text{color:var(--muted);font-size:12px;line-height:1.6;margin:13px 0 0}.canvas{min-height:620px;background:linear-gradient(135deg,var(--paper),var(--bg));}.canvas-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 21px;border-bottom:1px solid var(--line)}.canvas-title{display:flex;gap:9px;align-items:center;min-width:0}.canvas-title strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink)}.canvas-body{padding:32px clamp(20px,3vw,46px) 65px;min-height:510px}.empty-state{text-align:center;padding:65px 20px;color:var(--muted)}.empty-state i{display:block;font-size:52px;color:var(--gold);margin-bottom:15px}.empty-state h3{font-family:'Noto Serif SC',serif;color:var(--ink);font-size:20px}.empty-state p{line-height:1.7}.canvas-foot{display:flex;gap:12px;flex-wrap:wrap;padding:12px 25px;border-top:1px solid var(--line)}.loading-ink{width:54px;height:54px;border-radius:50%;margin:12px auto 24px;background:radial-gradient(circle,#0f2744 8%,rgba(15,39,68,.22) 45%,transparent 72%);animation:ink 1.5s ease-in-out infinite}@keyframes ink{50%{transform:scale(1.35);opacity:.52}}.searchbar{display:flex;align-items:center;gap:11px;background:var(--field);border:1px solid var(--line);border-radius:11px;padding-left:14px <main>
  <section class="page active" id="page-home">
    <div class="hero"><div class="eyebrow">MOYAN · RESEARCH STUDIO</div><h1 class="serif" data-i18n="heroTitle">墨研工坊 · 智能报告写作</h1><p data-i18n="heroText">围绕研究主题与读者用途，结合参考资料生成专业报告，覆盖学术、咨询deck、调查、研报、论文与科普六种原型</p><button class="btn btn-primary" id="startButton" type="button"><i class="fa-solid fa-feather-pointed"></i><span data-i18n="start">开始撰写报告</span></button></div>
    <div class="prototype-strip" id="prototypeStrip"></div>
    <section class="section stats-grid"><div class="stat-card"><div class="label" data-i18n="totalReports">总报告数</div><div class="number" id="totalCount">0</div></div><div class="stat-card"><div class="label" data-i18n="typeCounts">各原型篇数</div><div class="type-stats" id="typeStats"></div></div></section>
    <section class="section"><div class="section-head"><h2 class="serif" data-i18n="recent">最近报告</h2><button class="btn btn-outline btn-small" id="viewAllButton" type="button"><span data-i18n="viewAll">查看全部</span><i class="fa-solid fa-arrow-right"></i></button></div><div class="recent-grid" id="recentGrid"></div></section>
  </section>
  <section class="page" id="page-studio">
    <div class="page-heading"><div><div class="eyebrow">WRITING WORKSHOP</div><h1 class="serif" data-i18n="studio">撰写工坊</h1><p data-i18n="studioIntro">明确原型与核心问题，提交后由智能体检索证据、撰写正文并生成图表链接</p></div><div class="button-row"><button class="btn btn-outline" id="studioLibraryButton" type="button" data-i18n="library">报告库</button><button class="btn btn-primary" id="newReportButton" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="newOne">新开一份</span></button></div></div>
    <div class="work-grid"><section class="paper-card"><div class="panel-heading"><h2 data-i18n="brief">研究简报</h2><i class="fa-solid fa-pen-nib" style="color:var(--gold)"></i></div><form class="form-body" id="reportForm" novalidate>
      <div class="field"><label class="required" for="reportForm_topic" data-i18n="topic">研究主题</label><textarea id="reportForm_topic" name="研究主题" class="long" data-placeholder="topicPlaceholder"></textarea></div>
      <div class="field"><label class="required" for="reportForm_audience" data-i18n="audience">读者与用途</label><textarea id="reportForm_audience" name="读者与用途" data-placeholder="audiencePlaceholder"></textarea></div>
      <div class="field"><span class="field-legend required" data-i18n="prototype">报告原型</span><input type="hidden" id="reportForm_prototype" name="报告原型"><div class="form-types" id="formTypes" role="radiogroup"></div></div>
      <div class="field"><label for="reportForm_requirements" data-i18n="requirements">补充要求</label><textarea id="reportForm_requirements" name="补充要求" class="long" data-placeholder="requirementsPlaceholder"></textarea></div>
      <div class="field"><label for="reportForm_file" data-i18n="reference">参考文件</label><input id="reportForm_file" name="参考文件" type="text" readonly><div class="attachment-name" id="fileName"></div><div class="attachment-row" style="margin-top:9px"><button class="btn btn-soft btn-small" id="selectFileButton" type="button"><i class="fa-solid fa-paperclip"></i><span data-i18n="selectFile">选择参考文件</span></button><button class="btn btn-soft btn-small" id="clearFileButton" type="button" data-i18n="clearFile">清除附件</button><a class="btn btn-outline btn-small hidden" id="formDownload" target="_blank" rel="noopener" data-i18n="download">下载</a><a class="btn btn-outline btn-small hidden" id="formPreview" target="_blank" rel="noopener" data-i18n="preview">预览</a></div></div>
      <div class="form-footer"><button class="btn btn-primary" id="generateButton" type="submit" disabled><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="generate">生成报告</span></button><button class="btn btn-outline" id="saveButton" type="button" disabled><i class="fa-solid fa-floppy-disk"></i><span data-i18n="save">保存修改</span></button></div><p class="help-text" data-i18n="formHint">指令流字段「报告成果」不可手工填写；重新生成请点「生成报告」走新建</p>
    </form></section>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)

        // 检查请求类型是否在支持的映射中

          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("4fff85811c04cc93_智能报告写作")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

async function generate(event){event.preventDefault();if(busy)return;const data=formData();if(!data['研究主题']||!data['读者与用途']||!data['报告原型']){toast(tr('needFields'));return}busy=true;updateButtons();$('canvasBody').innerHTML=`<div class="empty-state"><div class="loading-ink"></div><h3>${escapeHTML(tr('waitingMessage'))}</h3></div>`;try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});currentRow=1;toast(tr('submitted'));await refreshData();pollToken++;await pollResult(1,pollToken)}catch(error){busy=false;updateButtons();errorToast(error)}}
async function saveChanges(){if(busy||currentRow<1)return;busy=true;updateButtons();const data=formData();try{for(const field of FIELDS)await callAppBridge({type:'SetCellValue',data:SOURCE,payload:`${field}/${currentRow}/${data[field]}`});toast(tr('saved'));await refreshData();updateButtons()}catch(error){errorToast(error)}finally{busy=false;updateButtons()}}
async function deleteReport(row){if(!window.confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row){currentRow=0;fillForm(Object.fromEntries(FIELDS.map(f=>[f,''])));renderEmptyCanvas()}else if(currentRow>row)currentRow--;await refreshData();toast(tr('deleted'))}catch(error){errorToast(error)}}
function bindEvents(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));$('brandButton').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});$('menuToggle').addEventListener('click',()=>{const menu=$('mobileMenu');menu.classList.toggle('hidden');$('menuToggle').setAttribute('aria-expanded',String(!menu.classList.contains('hidden')))});document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});$('languageButton').addEventListener('click',()=>setLanguage(lang==='cn'?'en':'cn'));$('mobileLanguageButton').addEventListener('click',()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu()});$('startButton').addEventListener('click',newReport);$('newReportButton').addEventListener('click',newReport);$('libraryNewButton').addEventListener('click',newReport);$('viewAllButton').addEventListener('click',()=>showPage('library'));$('studioLibraryButton').addEventListener('click',()=>showPage('library'));$('formTypes').addEventListener('click',e=>{const choice=e.target.closest('[data-type]');if(!choice)return;$('reportForm_prototype').value=choice.dataset.type;renderTypes();updateButtons()});for(const id of ['reportForm_topic','reportForm_audience','reportForm_requirements'])$(id).addEventListener('input',updateButtons);$('selectFileButton').addEventListener('click',async()=>{try{const name=await callAppBridge({type:'SelectFile'});if(name)setFile(String(name))}catch(error){errorToast(error)}});$('clearFileButton').addEventListener('click',()=>setFile(''));$('reportForm').addEventListener('submit',generate);$('saveButton').addEventListener('click',saveChanges);$('previousButton').addEventListener('click',()=>loadRecord(currentRow-1));$('nextButton').addEventListener('click',()=>loadRecord(currentRow+1));$('librarySearch').addEventListener('input',renderLibrary);$('libraryFilters').addEventListener('click',e=>{const chip=e.target.closest('[data-filter]');if(!chip)return;filterType=chip.dataset.filter;renderLibrary()});for(const grid of [$('recentGrid'),$('libraryGrid')])grid.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action,row=Number(button.dataset.row);if(action==='new')newReport();else if(action==='open'||action==='edit')await loadRecord(row);else if(action==='view')await openDetail(row);else if(action==='delete')await deleteReport(row)});$('detailClose').addEventListener('click',closeDetail);$('detailOverlay').addEventListener('click',e=>{if(e.target===$('detailOverlay'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('detailOverlay').classList.contains('hidden'))closeDetail();else closeMenu()}});const ensureVisible=e=>{if(!e.target.matches('input,textarea,select'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)};document.addEventListener('focusin',ensureVisible);if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const input=document.activeElement;if(input&&input.matches('input,textarea,select'))setTimeout(()=>input.scrollIntoView({block:'center',behavior:'smooth'}),120)})}
async function initialize(){bindEvents();setLanguage(detectLanguage());renderEmptyCanvas();updateButtons();try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(error){console.warn(error)}try{await refreshData()}catch(error){errorToast(error)}}
document.addEventListener('DOMContentLoaded',async()=>{(async () => {    await initialize();  })();});
</script>
</body>
</html>
