<script>

        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("60f36935115eb781_四季森林番茄钟")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");

function PauseRecordVoiceA() {

}

/**

 */
function ContinueRecordVoiceA() {

  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

            const rows = [];

            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {

                            i += 2; // 跳过两个双引号

                            i++;
                        }
                    } else {

                        i++;
                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

ue;$('formSave').disabled=true;try{if(row){for(const [f] of schemas[t])await setCell(t,f,row,obj[f]);}else await submit(t,obj);closeModal();await reload();notify(state.lang==='cn'?'已保存':'Saved')}catch(e){notify(String(e))}finally{state.busy=false;if($('formSave'))$('formSave').disabled=false}}}
async function showDetail(t,row){let obj={};for(const [f] of schemas[t])obj[f]=await cell(t,f,row);let extra=t==='专注树木'?speciesOf(obj['树种名称']):null;let html='<dl class="detail">'+Object.entries(obj).map(([f,v])=>`<dt>${esc(f)}</dt><dd>${esc(friendly(v))}</dd>`).join('')+(extra?`<dt>树种描述</dt><dd>${esc(extra['树种描述'])}</dd>`:'')+'</dl><div class="form-actions"><button data-edit="'+esc(t)+':'+row+'">'+L('edit')+'</button></div>';openModal(t,html,true)}
async function deleteRow(t,row){if(!confirm(state.lang==='cn'?'确定删除此记录？':'Delete this record?'))return;try{await api({type:'DeleteRecord',data:src(t),payload:row.toString()});await reload();notify(state.lang==='cn'?'已删除':'Deleted')}catch(e){notify(String(e))}}
async function showUnlock(row){let s=rows('树种信息').find(x=>x._row===row);if(!s)return;let list=rows('树种解锁记录').filter(x=>x['树种名称']===s['树种名称']);openModal(s['树种名称']+' · '+L('unlock'),`<div class="toolbar"><button class="primary" data-unlock-new="${esc(s['树种名称'])}">${L('add')}</button></div>${list.map(x=>`<div class="list-row"><span>${esc(friendly(x['解锁时间']))} · ${esc(x['解锁时累计分钟'])} ${L('minute')} · ${esc(x['是否已解锁'])}</span><span><button data-edit="树种解锁记录:${x._row}">${L('edit')}</button><button class="danger" data-delete="树种解锁记录:${x._row}">${L('del')}</button></span></div>`).join('')||`<div class="empty">${L('empty')}</div>`}`)}
async function startTimer(){if(state.treeRow)return;let s=speciesOf(state.selectedSpecies);if(!s||!unlocked(s)){notify(state.lang==='cn'?'请选择已解锁树种':'Choose an unlocked tree');return}let o=initial('专注树木');o['开始时间']=dateStr(new Date(),true);state.busy=true;try{await submit('专注树木',o);state.treeRow=1;state.treeId=o['树木编号'];state.remaining=state.duration*60;state.elapsed=0;state.interrupts=0;state.awaySeconds=0;state.lastStage='种子';state.paused=false;state.timer=setInterval(tick,1000);await reload()}finally{state.busy=false}}
async function tick(){if(state.paused||!state.treeRow)return;state.remaining=Math.max(0,state.remaining-1);state.elapsed++;let p=state.elapsed/(state.duration*60),stage=['种子','破土','幼苗','小树','成树','开花结果'][Math.min(5,Math.floor(p*6))];if(stage!==state.lastStage){state.lastStage=stage;try{await setCell('专注树木','生长阶段',state.treeRow,stage)}catch(e){notify(String(e))}}renderFocus();if(state.remaining<=0)await endTimer(true)}
async function pauseTimer(){if(!state.treeRow)return;state.paused=true;await setCell('专注树木','完成状态',state.treeRow,'已暂停');renderFocus()}
async function resumeTimer(){if(!state.treeRow)return;state.paused=false;await setCell('专注树木','完成状态',state.treeRow,'进行中');renderFocus()}
async function endTimer(done){if(!state.treeRow||state.busy)return;state.busy=true;if(!done)state.interrupts++;clearInterval(state.timer);state.timer=null;let row=state.treeRow,actual=Math.min(state.duration,Math.floor(state.elapsed/60)),fruits=done?(actual>=60?3:actual>=45?2:actual>=25?1:0):0,status=done?'已完成':'已枯萎',details=`${state.selectedSpecies} · 计划${state.duration}分钟 · 实际${actual}分钟 · ${status} · 打断${state.interrupts}次 · ${season()} · ${done?'愿每一分钟都开花结果。':'下一次继续生长。'}`;try{for(const [f,v] of Object.entries({'结束时间':dateStr(new Date(),true),'实际专注分钟':actual,'生长阶段':done?'开花结果':'枯萎','完成状态':status,'打断次数':state.interrupts,'离开应用秒数':state.awaySeconds,'收集果实数量':fruits,'当日专注详情':details}))await setCell('专注树木',f,row,v);if(done){await updateDaily(actual,fruits,false);await submit('果实徽章',{'徽章名称':season()+'日'+state.selectedSpecies+(fruits?'果实':'花朵'),'树木编号':state.treeId,'获得时间':dateStr(new Date(),true),'徽章类型':fruits?'果实':'花朵','徽章描述':details});await checkUnlock()}else await updateDaily(0,0,true);state.treeRow=0;state.remaining=state.duration*60;await reload();notify(done?(state.lang==='cn'?'专注完成！':'Focus complete!'):(state.lang==='cn'?'已放弃':'Abandoned'))}catch(e){notify(String(e))}finally{state.busy=false;renderFocus()}}
async function updateDaily(minutes,fruits,withered){let today=dateStr(),raw=await api({type:'GetRecordRow',data:src('专注统计'),payload:'统计日期/'+today}),row=Number(raw)||0,all=rows('专注统计'),prev=all.slice().sort((a,b)=>String(b['统计日期']).localeCompare(String(a['统计日期'])))[0],yesterday=dateStr(new Date(Date.now()-86400000)),streak=prev?.['统计日期']===today?num(prev['连续专注天数']):prev?.['统计日期']===yesterday?num(prev['连续专注天数'])+1:1;if(row>0){let old={};for(const f of ['总专注分钟','完成树木数量','枯萎树木数量','累计果实数量'])old[f]=num(await cell('专注统计',f,row));for(const [f,v] of Object.entries({'总专注分钟':old['总专注分钟']+minutes,'完成树木数量':old['完成树木数量']+(withered?0:1),'枯萎树木数量':old['枯萎树木数量']+(withered?1:0),'连续专注天数':streak,'累计果实数量':old['累计果实数量']+fruits,'最后专注时间':dateStr(new Date(),true)}))await setCell('专注统计',f,row,v)}else await submit('专注统计',{'统计编号':randomId(),'统计日期':today,'总专注分钟':minutes,'完成树木数量':withered?0:1,'枯萎树木数量':withered?1:0,'连续专注天数':streak,'累计果实数量':num(prev?.['累计果实数量'])+fruits,'最后专注时间':dateStr(new Date(),true)})}
async function checkUnlock(){let total=totalMinutes()+Math.floor(state.elapsed/60);for(const s of rows('树种信息')){if(s['是否默认解锁']==='是'||unlocked(s)||total<num(s['解锁所需累计分钟']))continue;await submit('树种解锁记录',{'解锁编号':randomId(),'树种名称':s['树种名称'],'解锁时间':dateStr(new Date(),true),'解锁时累计分钟':total,'是否已解锁':'是'})}}
function parseShare(raw){let o=JSON.parse(raw);if(!o||typeof o!=='object')throw Error('JSON format error');let trees=o.trees||o['专注树木'];let statistics=o.statistics||o['专注统计'];if(!Array.isArray(trees)||!Array.isArray(statistics))throw Error('JSON format error');return {o,trees,statistics}}
async function importShare(row=0){try{let file=await api({type:'SelectFile'});if(!file)return;let raw=await api({type:'ReadFile',data:file}),p=parseShare(raw),prefill={'森林树木数量':String(p.trees.length),'森林累计分钟':String(p.statistics.reduce((a,x)=>a+num(x['总专注分钟']),0)),'森林数据JSON':raw,'最后同步时间':dateStr(new Date(),true)};if(row){for(const [f,v] of Object.entries(prefill))await setCell('好友森林',f,row,v);await reload();notify(state.lang==='cn'?'同步完成':'Synced')}else await openForm('好友森林',0,prefill)}catch(e){notify((state.lang==='cn'?'导入JSON格式错误或读取失败：':'Import error: ')+String(e))}}
async function exportShare(){try{let o={app:'四季森林番茄钟',version:1,exportedAt:dateStr(new Date(),true),trees:rows('专注树木').map(({_row,...x})=>x),statistics:rows('专注统计').map(({_row,...x})=>x),badges:rows('果实徽章').map(({_row,...x})=>x),species:rows('树种信息').map(({_row,...x})=>x)},name='forest-share-'+randomId()+'.json';await api({type:'WriteFile',data:name,payload:JSON.stringify(o,null,2)});await api({type:'ExportFile',data:name,payload:'我的四季森林分享'});notify(state.lang==='cn'?'分享文件已生成':'Share file generated')}catch(e){notify(String(e))}}
function friendPreview(row){let r=rows('好友森林').find(x=>x._row===row);if(!r)return;try{let p=parseShare(r['森林数据JSON']);openModal(r['好友昵称'],`<p>${esc(r['森林树木数量'])}  · ${esc(r['森林累计分钟'])} ${L('minute')}</p><div class="forest">${p.trees.map(x=>`<div class="tree"><div class="art">${treeArt((p.o.species||[]).find(s=>s['树种名称']===x['树种名称']))}</div><strong>${esc(x['树种名称'])}</strong><small>${esc(x['季节'])} · ${esc(x['完成状态'])}</small></div>`).join('')}</div>`,true)}catch(e){notify('JSON: '+String(e))}}
async function showBadge(row){let b=rows('果实徽章').find(x=>x._row===row);if(!b)return;let r=rows('专注树木').find(x=>x['树木编号']===b['树木编号']);if(r)await showDetail('专注树木',r._row);else notify(state.lang==='cn'?'关联树木不存在':'Linked tree not found')}
document.addEventListener('click',async e=>{let x=e.target.closest('[data-go],[data-new],[data-edit],[data-delete],[data-detail],[data-duration],[data-spec],[data-timer],[data-unlock],[data-unlock-new],[data-friend],[data-sync],[data-badge],[data-sort]');if(!x)return;e.stopPropagation();try{if(x.dataset.go)go(x.dataset.go);else if(x.dataset.new)await openForm(x.dataset.new);else if(x.dataset.edit){let [t,r]=x.dataset.edit.split(':');await openForm(t,Number(r))}else if(x.dataset.delete){let [t,r]=x.dataset.delete.split(':');await deleteRow(t,Number(r))}else if(x.dataset.detail){let [t,r]=x.dataset.detail.split(':');await showDetail(t,Number(r))}else if(x.dataset.duration){state.duration=Number(x.dataset.duration);state.remaining=state.duration*60;renderFocus()}else if(x.dataset.spec){let s=speciesOf(x.dataset.spec);if(s&&unlocked(s)&&!state.treeRow){state.selectedSpecies=x.dataset.spec;renderFocus()}}else if(x.dataset.timer){let a=x.dataset.timer;if(a==='start')await startTimer();if(a==='pause')await pauseTimer();if(a==='resume')await resumeTimer();if(a==='abandon')await endTimer(false);if(a==='finish')await endTimer(true)}else if(x.dataset.unlock)await showUnlock(Number(x.dataset.unlock));else if(x.dataset.unlockNew)await openForm('树种解锁记录',0,{'树种名称':x.dataset.unlockNew});else if(x.dataset.friend)friendPreview(Number(x.dataset.friend));else if(x.dataset.sync)await importShare(Number(x.dataset.sync));else if(x.dataset.badge)await showBadge(Number(x.dataset.badge));else if(x.dataset.sort){let [t,f]=x.dataset.sort.split(':'),s=state.sort[t];state.sort[t]={field:f,dir:s?.field===f?-s.dir:1};renderAll()}}catch(err){notify(String(err))}});
function bind(){for(const id of ['treeSearch','seasonFilter','statusFilter','speciesFilter'])$(id).addEventListener(id==='treeSearch'?'input':'change',renderForest);for(const id of ['speciesSearch','typeFilter','defaultFilter','unlockFilter'])$(id).addEventListener(id==='speciesSearch'?'input':'change',renderSpecies);$('speciesView').onclick=()=>{state.speciesTable=!state.speciesTable;renderSpecies()};$('rangeFilter').onchange=renderStats;$('badgeFilter').onchange=renderBadges;$('exportShare').onclick=exportShare;$('importShare').onclick=()=>importShare();$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){notify(String(e))}};$('menuButton').onclick=e=>{e.stopPropagation();$('mobileMenu').classList.toggle('open')};$('langToggle').onclick=toggleLang;$('mobileMenu').addEventListener('click',e=>{if(e.target.closest('#mobileLang'))toggleLang()});document.addEventListener('click',e=>{if(!e.target.closest('#mobileMenu,#menuButton'))$('mobileMenu').classList.remove('open')});$('modalClose').onclick=closeModal;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),260)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{let e=document.activeElement;if(e&&e.matches('input,textarea,select'))setTimeout(()=>e.scrollIntoView({block:'center'}),100)});document.addEventListener('visibilitychange',async()=>{if(!state.treeRow)return;if(document.hidden){state.awayStart=Date.now();state.interrupts++;await setCell('专注树木','打断次数',state.treeRow,state.interrupts);if(state.interrupts>3)notify(state.lang==='cn'?'打断超过3次，树木可能枯萎':'More than 3 interruptions may wither the tree')}else if(state.awayStart){state.awaySeconds+=Math.floor((Date.now()-state.awayStart)/1000);state.awayStart=0;await setCell('专注树木','离开应用秒数',state.treeRow,state.awaySeconds)}})}
function toggleLang(){state.lang=state.lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',state.lang);translate()}
async function initialize(){state.lang=defaultLang();try{let mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',mode==='暗色')}catch(e){}bind();translate();await reload();if(!rows('树种信息').length)notify(state.lang==='cn'?'请先添加树种':'Add a species to start')}
document.addEventListener('DOMContentLoaded',async()=>{await initialize()});
</script></body></html>
