<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("4ae49260ec7cfcd1_美食创作助手")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**

 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const TYPES=['指定菜品','推荐菜品','一周选题'];const TYPE_KEYS=['specified','recommended','weekly'];const ICONS=['fa-utensils','fa-lightbulb','fa-calendar-days'];const els={};let lang='cn',page='home',historyStack=[],currentRow=0,recordCount=0,records=[],currentType='',busy=false,pollToken=0,detailRecord=null,toastTimer=0;
const byId=id=>document.getElementById(id);const tr=key=>I18N[lang][key]||key;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chooseLanguage(){const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved!==null&&saved!=='')return saved==='en'?'en':'cn';const p=new URLSearchParams(location.search).get('lang');if(p==='cn'||p==='en')return p;try{const list=navigator.languages;if(!list||!list.length)return 'cn';return list.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}catch(e){return 'cn'}}
function setLanguage(value){lang=value;localStorage.setItem('iThinkAir_UiLanguage',lang);document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr(x.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(x=>x.placeholder=tr(x.dataset.placeholder));byId('creationForm_dish').placeholder=lang==='cn'?'例如：番茄牛腩':'e.g. tomato beef stew';byId('creationForm_feedback').placeholder=lang==='cn'?'选第 2 道，按家常暖胃方向写初稿；或第 3 步火候再写具体一点':'Choose dish 2 and draft a warm home-style version; explain step 3 in more detail';byId('detailForm_feedback').placeholder=byId('creationForm_feedback').placeholder;renderTypes();renderFilter();renderQuick();renderStats();renderCards();renderFormState();renderEmptyIfNeeded();updateNav();}
function toast(msg){const e=byId('toast');e.textContent=msg;e.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hide'),3500)}
function fitNav(){const nav=byId('topNav').querySelector('nav'),tabs=byId('navTabs'),langEl=byId('langToggle'),hamb=byId('hamburger');tabs.classList.remove('hide');langEl.classList.remove('hide');hamb.style.display='none';const needed=byId('brandButton').scrollWidth+tabs.scrollWidth+langEl.scrollWidth+95;if(needed>nav.clientWidth){tabs.classList.add('hide');langEl.classList.add('hide');hamb.style.display='block'}else closeMenu()}
function closeMenu(){byId('mobileMenu').classList.add('hide');byId('hamburger').setAttribute('aria-expanded','false')}
function updateNav(){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));}
function showPage(name,push=true){if(name===page){closeMenu();return}if(push)historyStack.push({page:page,y:window.scrollY});page=name;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===name+'Page'));updateNav();closeMenu();window.scrollTo(0,0);if(name==='library')refreshData();if(name==='home')refreshData()}
function airBack(){if(!byId('detailOverlay').classList.contains('hide')){closeDetail();return 'false'}if(!byId('mobileMenu').classList.contains('hide')){closeMenu();return 'false'}if(historyStack.length){const last=historyStack.pop();showPage(last.page,false);requestAnimationFrame(()=>window.scrollTo(0,last.y));return 'false'}return 'true'}window.airBack=airBack;
function renderTypes(){byId('typeCards').innerHTML=TYPES.map((type,i)=>'<button class="type-card '+(currentType===type?'selected':'')+'" type="button" data-type="'+escapeHTML(type)+'"><i class="fa-solid '+ICONS[i]+'"></i>'+escapeHTML(tr(TYPE_KEYS[i]))+'</button>').join('')}
function selectType(type){currentType=type;renderTypes();renderFormState()}
function renderFormState(){const visible=currentType==='一周选题'?['目标人群','主题场景','文案方向','确认与修改意见']:FIELDS.slice(1);document.querySelectorAll('#creationForm [data-field]').forEach(x=>x.classList.toggle('hide',!visible.includes(x.dataset.field)));byId('typeHint').textContent=currentType?tr('hint'+TYPE_KEYS[TYPES.indexOf(currentType)].charAt(0).toUpperCase()+TYPE_KEYS[TYPES.indexOf(currentType)].slice(1)):tr('empty');byId('flowText').textContent=currentType?tr('flow'+TYPE_KEYS[TYPES.indexOf(currentType)].charAt(0).toUpperCase()+TYPE_KEYS[TYPES.indexOf(currentType)].slice(1)):tr('empty');const d=formData();const valid=!!currentType&&(!!d['确认与修改意见'].trim()||(currentType==='指定菜品'?!!d['菜名'].trim():!!(d['目标人群'].trim()||d['主题场景'].trim())));byId('createButton').disabled=busy||!valid;byId('reviseButton').disabled=busy||currentRow<1||!valid;byId('saveButton').disabled=busy||currentRow<1;byId('prevButton').disabled=busy||currentRow<=1;byId('nextButton').disabled=busy||currentRow>=recordCount;byId('rowIndicator').textContent=currentRow+' / '+recordCount}
function formData(){const f=byId('creationForm');const data={'创作类型':currentType};for(const field of FIELDS.slice(1)){const el=f.elements.namedItem(field);data[field]=el&&(!el.closest('.field')?.classList.contains('hide'))?el.value:''}return data}
function clearStudio(type=''){pollToken++;currentRow=0;byId('creationForm').reset();selectType(type);renderResult('');renderFormState()}
function renderEmptyIfNeeded(){if(!currentRow&&!busy)renderResult('')}
function renderResult(content){const box=byId('resultArea');if(!content){box.innerHTML='<div class="empty"><i class="fa-solid fa-bowl-rice"></i>'+escapeHTML(tr('empty'))+'</div>';return}renderMarkdown(box,content)}
function normalizeImage(src){if(/^(https?:|data:|blob:|\/)/i.test(src))return src;return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src)}
function markdownText(content){return String(content||'').replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,alt,url)=>'!['+alt+']('+normalizeImage(url.trim())+')')}
function renderMarkdown(box,content){const source=markdownText(content);if(window.marked&&window.DOMPurify){const raw=marked.parse(source,{gfm:true,breaks:true});box.innerHTML=DOMPurify.sanitize(raw,{ADD_ATTR:['download','target']})}else{box.innerHTML='<pre style="white-space:pre-wrap">'+escapeHTML(content)+'</pre>'}box.querySelectorAll('img').forEach(img=>{const a=document.createElement('a');a.href=img.src;a.download='';a.target='_blank';img.parentNode.insertBefore(a,img);a.appendChild(img)})}
function firstImage(text){const m=String(text||'').match(/!\[[^\]]*\]\(([^)]+)\)/);return m?normalizeImage(m[1].trim()):''}
async function bridge(req){return await callAppBridge(req)}
async function getRows(){const csv=await bridge({type:'GetTableCSV',data:TABLE,payload:FIELDS.join(',')});return parseCSV(String(csv||'')).filter(row=>row.some(v=>v!==''&&v!==undefined)).map((row,i)=>({row:i+1,values:Object.fromEntries(FIELDS.map((f,j)=>[f,row[j]||''])),image:''}))}
async function refreshData(){try{const [count,rows]=await Promise.all([bridge({type:'GetRecordCount',data:TABLE}),getRows()]);recordCount=Number(count)||rows.length;records=rows;renderStats();renderCards();renderFormState();loadCovers(rows.slice(0,Math.max(5,rows.length)))}catch(e){toast(tr('failed')+': '+e.message)}}
function renderStats(){const counts=[recordCount,...TYPES.map(t=>records.filter(r=>r.values['创作类型']===t).length)];byId('stats').innerHTML=['countAll','countSpecified','countRecommended','countWeekly'].map((k,i)=>'<div class="stat"><span>'+escapeHTML(tr(k))+'</span><strong>'+counts[i]+'</strong></div>').join('')}
function renderQuick(){byId('quickGrid').innerHTML=TYPES.map((t,i)=>'<button class="quick" type="button" data-quick="'+escapeHTML(t)+'"><i class="fa-solid '+ICONS[i]+'"></i><h3>'+escapeHTML(tr(TYPE_KEYS[i]))+'</h3><p class="muted">'+escapeHTML(tr('quick'+TYPE_KEYS[i].charAt(0).toUpperCase()+TYPE_KEYS[i].slice(1)))+'</p></button>').join('')}
function renderFilter(){const f=byId('typeFilter'),old=f.value;f.innerHTML='<option value="">'+escapeHTML(tr('all'))+'</option>'+TYPES.map((t,i)=>'<option value="'+escapeHTML(t)+'">'+escapeHTML(tr(TYPE_KEYS[i]))+'</option>').join('');f.value=old}
function titleFor(r){return r.values['菜名']||r.values['主题场景']||tr('untitled')}
function cardHTML(r,recent){const v=r.values,typeIndex=TYPES.indexOf(v['创作类型']),icon=ICONS[typeIndex]||'fa-bowl-food',typeText=typeIndex>=0?tr(TYPE_KEYS[typeIndex]):v['创作类型'];return '<article class="work-card" data-row="'+r.row+'" tabindex="0"><div class="cover">'+(r.image?'<img src="'+escapeHTML(r.image)+'" alt="">':'<i class="fa-solid '+icon+'"></i>')+'</div><div class="work-body"><span class="badge">'+escapeHTML(typeText)+'</span><h3>'+escapeHTML(titleFor(r))+'</h3><p>'+escapeHTML(v['目标人群'])+(v['主题场景']?' · '+escapeHTML(v['主题场景']):'')+'</p><p>'+escapeHTML(v['文案方向'])+'</p>'+(!recent?'<p>'+escapeHTML(v['确认与修改意见'])+'</p>':'')+'</div><div class="work-actions"><button class="button" type="button" data-action="view" data-row="'+r.row+'">'+escapeHTML(tr('view'))+'</button><button class="button" type="button" data-action="continue" data-row="'+r.row+'">'+escapeHTML(tr('continue'))+'</button>'+(!recent?'<button class="button danger" type="button" data-action="delete" data-row="'+r.row+'">'+escapeHTML(tr('delete'))+'</button>':'')+'</div></article>'}
function renderCards(){byId('recentGrid').innerHTML=records.length?records.slice(0,5).map(r=>cardHTML(r,true)).join(''):'<p class="muted">'+escapeHTML(tr('noWorks'))+'</p>';const q=byId('searchInput').value.trim().toLocaleLowerCase(),type=byId('typeFilter').value;const filtered=records.filter(r=>(!type||r.values['创作类型']===type)&&(!q||FIELDS.slice(1).some(f=>r.values[f].toLocaleLowerCase().includes(q))));byId('libraryGrid').innerHTML=filtered.length?filtered.map(r=>cardHTML(r,false)).join(''):'<p class="muted">'+escapeHTML(tr('noWorks'))+'</p>'}
async function resolveRow(r){const v=r.values;const key=['菜名','主题场景','确认与修改意见'].find(k=>v[k]);if(!key)return r.row;try{const found=Number(await bridge({type:'GetRecordRow',data:TABLE,payload:key+'/'+v[key]}));return found>0?found:r.row}catch(e){return r.row}}
async function loadCovers(items){for(const r of items){if(!records.includes(r))continue;try{const row=await resolveRow(r);const content=await bridge({type:'GetCellValue',data:TABLE,payload:'创作结果/'+row});r.image=firstImage(content)}catch(e){} }renderCards()}
async function loadRecord(row){if(row<1)return;pollToken++;busy=false;currentRow=row;const data={};for(const field of FIELDS){data[field]=await bridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})}selectType(data['创作类型']);for(const field of FIELDS.slice(1)){byId('creationForm').elements.namedItem(field).value=data[field]||''}const result=await bridge({type:'GetCellValue',data:TABLE,payload:'创作结果/'+row});renderResult(result);renderFormState()}
async function submitNew(data){busy=true;renderFormState();try{await bridge({type:'SubmitRecord',data:SUBMIT_TABLE,payload:JSON.stringify(data)});currentRow=1;recordCount++;renderResult('');byId('resultArea').textContent=tr('waiting');renderFormState();showPage('studio');pollResult(++pollToken);refreshData()}catch(e){busy=false;renderFormState();toast(tr('failed')+': '+e.message)}}
async function pollResult(token){const deadline=Date.now()+1800000;while(token===pollToken&&Date.now()<deadline){try{const text=await bridge({type:'GetCellValue',data:TABLE,payload:'创作结果/'+currentRow});if(token!==pollToken)return;if(String(text||'').trim()){renderResult(text);busy=false;renderFormState();refreshData();return}}catch(e){}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken){busy=false;renderFormState();toast(tr('timeout'))}}
async function saveChanges(){if(currentRow<1||busy)return;busy=true;renderFormState();try{const data=formData();for(const field of FIELDS){await bridge({type:'SetCellValue',data:TABLE,payload:field+'/'+currentRow+'/'+data[field]})}toast(tr('saved'));refreshData()}catch(e){toast(tr('failed')+': '+e.message)}finally{busy=false;renderFormState()}}
async function openDetail(row){const r=records.find(x=>x.row===row);if(!r)return;detailRecord=r;byId('detailOverlay').classList.remove('hide');byId('detailBadge').textContent=tr(TYPE_KEYS[TYPES.indexOf(r.values['创作类型'])]||'all');byId('detailTitle').textContent=titleFor(r);byId('detailContent').textContent=tr('waiting');byId('detailForm_feedback').value=r.values['确认与修改意见']||'';try{const actual=await resolveRow(r),content=await bridge({type:'GetCellValue',data:TABLE,payload:'创作结果/'+actual});if(detailRecord===r)renderMarkdown(byId('detailContent'),content||'')}catch(e){toast(tr('failed')+': '+e.message)}}
function closeDetail(){byId('detailOverlay').classList.add('hide');detailRecord=null}
async function deleteWork(row){if(!confirm(tr('confirmDelete')))return;const r=records.find(x=>x.row===row);try{const actual=r?await resolveRow(r):row;await bridge({type:'DeleteRecord',data:TABLE,payload:actual.toString()});if(currentRow===actual)clearStudio();toast(tr('deleted'));await refreshData()}catch(e){toast(tr('failed')+': '+e.message)}}
function ensureInputVisible(e){if(!e.target.matches('input,textarea,select'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)}
async function initialize(){lang=chooseLanguage();try{const mode=await bridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches)}setLanguage(lang);fitNav();new ResizeObserver(fitNav).observe(byId('topNav'));document.addEventListener('click',async e=>{const pageButton=e.target.closest('[data-page]');if(pageButton){showPage(pageButton.dataset.page);return}const quick=e.target.closest('[data-quick]');if(quick){clearStudio(quick.dataset.quick);showPage('studio');return}const type=e.target.closest('[data-type]');if(type){selectType(type.dataset.type);return}const langButton=e.target.closest('[data-lang]');if(langButton){setLanguage(langButton.dataset.lang);closeMenu();fitNav();return}const action=e.target.closest('[data-action]');if(action){e.stopPropagation();const row=Number(action.dataset.row);if(action.dataset.action==='view')await openDetail(row);if(action.dataset.action==='continue'){await loadRecord(row);showPage('studio')}if(action.dataset.action==='delete')await deleteWork(row);return}const card=e.target.closest('.work-card');if(card){await loadRecord(Number(card.dataset.row));showPage('studio');return}if(!e.target.closest('#topNav'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!byId('detailOverlay').classList.contains('hide'))closeDetail();else closeMenu()}if(e.key==='Enter'&&e.target.matches('.work-card')){loadRecord(Number(e.target.dataset.row)).then(()=>showPage('studio'))}});byId('brandButton').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});byId('hamburger').addEventListener('click',()=>{const menu=byId('mobileMenu');menu.classList.toggle('hide');byId('hamburger').setAttribute('aria-expanded',String(!menu.classList.contains('hide')))});byId('langToggle').addEventListener('click',()=>{setLanguage(lang==='cn'?'en':'cn');fitNav()});for(const id of ['startButton','newPlateButton','libraryCreateButton'])byId(id).addEventListener('click',()=>{clearStudio();showPage('studio')});byId('creationForm').addEventListener('input',renderFormState);byId('creationForm').addEventListener('submit',e=>{e.preventDefault();const d=formData();if(byId('createButton').disabled){toast(tr('typeRequired'));return}submitNew(d)});byId('saveButton').addEventListener('click',saveChanges);byId('reviseButton').addEventListener('click',()=>{if(!byId('reviseButton').disabled)submitNew(formData())});byId('prevButton').addEventListener('click',()=>loadRecord(currentRow-1));byId('nextButton').addEventListener('click',()=>loadRecord(currentRow+1));byId('searchInput').addEventListener('input',renderCards);byId('typeFilter').addEventListener('change',renderCards);byId('detailCloseButton').addEventListener('click',closeDetail);byId('detailOverlay').addEventListener('click',e=>{if(e.target===byId('detailOverlay'))closeDetail()});byId('detailReviseButton').addEventListener('click',()=>{if(!detailRecord)return;const d={...detailRecord.values,'确认与修改意见':byId('detailForm_feedback').value};closeDetail();submitNew(d)});document.addEventListener('focusin',ensureInputVisible);if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))ensureInputVisible({target:active})});renderFormState();await refreshData()}
const resetStudio=clearStudio;
clearStudio=function(type=''){busy=false;resetStudio(type)};
document.addEventListener('DOMContentLoaded',()=>{(async () => {    await initialize();  })();});
</script></body></html>
