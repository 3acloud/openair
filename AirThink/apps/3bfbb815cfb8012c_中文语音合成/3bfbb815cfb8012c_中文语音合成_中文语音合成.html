sk" type="submit"><i class="fa-solid fa-play"></i> <span data-i18n="generate">开始生成语音</span></button></div></form><div class="result" id="resultPanel" hidden><div class="status" id="resultStatus"></div><div id="resultContent"></div></div></div></div></section>
<section class="page" id="voicesPage" hidden><div class="section-heading stack"><div><h1 data-i18n="voices">声音配置库</h1><p data-i18n="voicesIntro">管理和维护可用的发音人声音及风格配置。</p></div><button class="primary" id="addVoice" type="button"><i class="fa-solid fa-plus"></i> <span data-i18n="addVoice">添加声音配置</span></button></div><div class="toolbar"><input id="voiceSearch" type="search" data-placeholder="voiceSearch" placeholder="搜索声音全名或风格"></div><div class="card table-scroll"><table><thead><tr><th data-i18n="voiceShort">声音简称</th><th data-i18n="voiceFull">声音全名</th><th data-i18n="gender">性别</th><th data-i18n="region">地区</th><th data-i18n="style">风格</th><th data-i18n="isDefault">是否默认</th><th data-i18n="actions">操作</th></tr></thead><tbody id="voicesBody"></tbody></table></div></section>

<div class="overlay" id="voiceOverlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="voiceDialogTitle"><div class="dialog-head"><h2 id="voiceDialogTitle"></h2><button class="dialog-close" type="button" data-close="voiceOverlay" aria-label="Close">&times;</button></div><div class="dialog-body"><form id="voiceForm"><div class="form-grid"><div class="field"><label for="voiceForm_short" data-i18n="voiceShort">声音简称</label><input id="voiceForm_short" name="声音简称" required></div><div class="field"><label for="voiceForm_full" data-i18n="voiceFull">声音全名</label><input id="voiceForm_full" name="声音全名" required></div><div class="field"><label for="voiceForm_gender" data-i18n="gender">性别</label><select id="voiceForm_gender" name="性别"><option value="男" data-i18n="male">男</option><option value="女" data-i18n="female">女</option></select></div><div class="field"><label for="voiceForm_region" data-i18n="region">地区</label><select id="voiceForm_region" name="地区"><option value="普通话" data-i18n="mandarin">普通话</option><option value="台湾" data-i18n="taiwan">台湾</option><option value="香港" data-i18n="hongkong">香港</option></select></div><div class="field wide"><label for="voiceForm_style" data-i18n="style">风格</label><input id="voiceForm_style" name="风格"></div><div class="field wide"><label for="voiceForm_default" data-i18n="isDefault">是否默认</label><div class="switch-row"><input id="voiceForm_default" name="是否默认" type="checkbox"><span data-i18n="defaultHint">设为默认声音</span></div></div></div><div class="form-actions"><button class="primary" id="saveVoice" type="submit" data-i18n="save">保存</button><button class="secondary" type="button" data-close="voiceOverlay" data-i18n="cancel">取消</button></div></form></div></div></div>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    `;

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

const i18n={cn:{appName:'中文语音合成',home:'首页',studio:'合成工作台',voices:'声音配置库',history:'历史记录',heroTitle:'中文语音合成系统',heroText:'将输入的中文文本或文本文件转换为语音文件，支持定制声音、语速、音调等，便于制作朗读、通知、播报和音频素材。',start:'开始合成',voiceCount:'声音模型数',taskCount:'合成任务数',recent:'最新合成任务',taskName:'任务名称',voiceShort:'声音简称',format:'输出格式',created:'创建时间',studioIntro:'输入想要合成的文本或上传文本文件，调整参数并生成专属语音。',synthesisTask:'语音合成任务',inputText:'输入文本',textPriority:'输入文本优先于文本文件',textFile:'文本文件',selectTextFile:'选择文本文件',speed:'语速',pitch:'音调',autoplay:'是否自动播放',autoplayHint:'生成后播放',note:'备注',generate:'开始生成语音',voicesIntro:'管理和维护可用的发音人声音及风格配置。',addVoice:'添加声音配置',voiceSearch:'搜索声音全名或风格',voiceFull:'声音全名',gender:'性别',region:'地区',style:'风格',isDefault:'是否默认',actions:'操作',male:'男',female:'女',mandarin:'普通话',taiwan:'台湾',hongkong:'香港',defaultHint:'设为默认声音',save:'保存',cancel:'取消',historyIntro:'查看所有的历史合成记录与生成的音频。',historySearch:'搜索任务名称或备注',allFormats:'全部格式',taskDetail:'任务详情',edit:'编辑',delete:'删除',details:'查看详情',empty:'暂无数据',loading:'正在加载…',waiting:'语音合成中，请稍候...',timeout:'合成超时，请稍后到历史记录查看。',completed:'语音合成完成',audio:'语音文件',download:'下载语音',noAudio:'暂无语音文件',confirmDelete:'确定删除这条记录吗？',saved:'已保存',deleted:'已删除',failed:'操作失败',needInput:'请输入文本或选择文本文件',yes:'是',no:'否',addVoiceTitle:'添加声音配置',editVoiceTitle:'编辑声音配置'},en:{appName:'Chinese Text to Speech',home:'Home',studio:'Studio',voices:'Voice Library',history:'History',heroTitle:'Chinese Text to Speech',heroText:'Convert Chinese text or a text file to speech. Customize the voice, speed and pitch for reading, announcements and audio content.',start:'Start synthesis',voiceCount:'Voice models',taskCount:'Synthesis tasks',recent:'Recent tasks',taskName:'Task name',voiceShort:'Voice ID',format:'Format',created:'Created',studioIntro:'Enter text or choose a text file, adjust settings, and generate speech.',synthesisTask:'Synthesis task',inputText:'Input text',textPriority:'Text entered here takes priority over the file',textFile:'Text file',selectTextFile:'Choose text file',speed:'Speed',pitch:'Pitch',autoplay:'Autoplay',autoplayHint:'Play when ready',note:'Notes',generate:'Generate speech',voicesIntro:'Manage available voices and styles.',addVoice:'Add voice',voiceSearch:'Search voice name or style',voiceFull:'Voice name',gender:'Gender',region:'Region',style:'Style',isDefault:'Default',actions:'Actions',male:'Male',female:'Female',mandarin:'Mandarin',taiwan:'Taiwan',hongkong:'Hong Kong',defaultHint:'Set as default voice',save:'Save',cancel:'Cancel',historyIntro:'View past synthesis tasks and generated audio.',historySearch:'Search task name or notes',allFormats:'All formats',taskDetail:'Task details',edit:'Edit',delete:'Delete',details:'Details',empty:'No records yet',loading:'Loading…',waiting:'Synthesizing speech, please wait...',timeout:'Synthesis timed out. Check History later.',completed:'Speech is ready',audio:'Audio file',download:'Download audio',noAudio:'No audio file yet',confirmDelete:'Delete this record?',saved:'Saved',deleted:'Deleted',failed:'Operation failed',needInput:'Enter text or choose a text file',yes:'Yes',no:'No',addVoiceTitle:'Add voice',editVoiceTitle:'Edit voice'}};
let lang='cn',page='home',pageHistory=[],voiceRows=[],historyRows=[],editingVoiceRow=0,polling=false,toastTimer,keyboardTarget;
const $=id=>document.getElementById(id),t=key=>i18n[lang][key]||key;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bridge=async(type,data,payload)=>callAppBridge({type,...(data!==undefined?{data}:{}),...(payload!==undefined?{payload}: {})});
function showToast(message){const el=$('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function dateTimeNow(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function languageDefault(){const q=new URLSearchParams(location.search).get('lang');if(q==='cn'||q==='en')return q;const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn';const langs=navigator.languages;if(!langs||!langs.length)return'cn';return langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function applyLanguage(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('langButton').textContent=lang==='cn'?'EN':'中文';$('mobileLang').textContent=lang==='cn'?'English':'中文';renderVoices();renderHistory();refreshNav()}
function switchLanguage(){lang=lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',lang);applyLanguage();closeMenu()}
function closeMenu(){$('mobileMenu').hidden=true;$('menuButton').setAttribute('aria-expanded','false')}
function refreshNav(){const nav=$('navLinks'),menu=$('menuButton'),langBtn=$('langButton');nav.style.display='flex';langBtn.style.display='';menu.style.display='none';const over=$('brand').offsetWidth+nav.scrollWidth+langBtn.offsetWidth+85>$('topbar').clientWidth;if(over){nav.style.display='none';langBtn.style.display='none';menu.style.display='block'}else closeMenu()}
function navigate(next,record=true){if(next===page)return;if(record)pageHistory.push({page,scroll:window.scrollY});page=next;document.querySelectorAll('.page').forEach(el=>el.hidden=el.id!==`${next}Page`);document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===next));closeMenu();window.scrollTo(0,0);if(next==='home')loadHome();if(next==='voices')loadVoices();if(next==='history')loadHistory();if(next==='studio')loadVoiceOptions()}
function closeOverlay(id){$(id).hidden=true;document.body.style.overflow=''}
function openOverlay(id){$(id).hidden=false;document.body.style.overflow='hidden'}
function airBack(){const overlays=['detailOverlay','voiceOverlay'];for(const id of overlays){if(!$(id).hidden){closeOverlay(id);return'false'}}if(pageHistory.length){const prev=pageHistory.pop();navigate(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.scroll));return'false'}return'true'}
window.airBack=airBack;
async function csvRows(table,fields){const raw=await bridge('GetTableCSV',table,fields.join(','));return raw?parseCSV(String(raw)).map((cells,i)=>({row:i+1,values:Object.fromEntries(fields.map((f,j)=>[f,cells[j]??'']))})):[]}
function emptyRow(cols){return `<tr><td colspan="${cols}" class="empty">${esc(t('empty'))}</td></tr>`}
async function loadHome(){try{const [vc,tc,rows]=await Promise.all([bridge('GetRecordCount',VOICE_TABLE),bridge('GetRecordCount',TASK_TABLE),csvRows(TASK_TABLE,['任务名称','声音简称','输出格式','创建时间'])]);$('voiceCount').textContent=vc;$('taskCount').textContent=tc;const recent=rows.sort((a,b)=>String(b.values['创建时间']).localeCompare(String(a.values['创建时间']))).slice(0,5);$('recentBody').innerHTML=recent.length?recent.map(({row,values:v})=>`<tr class="clickable" data-row="${row}"><td>${esc(v['任务名称'])}</td><td>${esc(v['声音简称'])}</td><td>${esc(v['输出格式'])}</td><td>${esc(v['创建时间'])}</td></tr>`).join(''):emptyRow(4)}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}
async function loadVoiceOptions(){try{const rows=await csvRows(VOICE_TABLE,['声音简称','声音全名','性别']);const sel=$('taskForm_voice'),old=sel.value;sel.innerHTML=rows.map(({values:v})=>`<option value="${esc(v['声音简称'])}">${esc(v['声音全名'])} (${esc(v['性别'])})</option>`).join('');if(rows.some(x=>x.values['声音简称']===old))sel.value=old}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}
async function loadVoices(){try{voiceRows=await csvRows(VOICE_TABLE,voiceFields);renderVoices()}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}
function renderVoices(){const body=$('voicesBody');if(!body)return;const q=$('voiceSearch').value.trim().toLocaleLowerCase();const rows=voiceRows.filter(({values:v})=>[v['声音全名'],v['风格']].some(x=>String(x).toLocaleLowerCase().includes(q)));body.innerHTML=rows.length?rows.map(({row,values:v})=>`<tr><td>${esc(v['声音简称'])}</td><td>${esc(v['声音全名'])}</td><td>${esc(v['性别'])}</td><td>${esc(v['地区'])}</td><td>${esc(v['风格'])}</td><td>${esc(v['是否默认']==='是'?t('yes'):t('no'))}</td><td><div class="actions"><button class="secondary" type="button" data-edit-voice="${row}">${esc(t('edit'))}</button><button class="danger" type="button" data-delete-voice="${row}">${esc(t('delete'))}</button></div></td></tr>`).join(''):emptyRow(7)}
async function openVoiceForm(row=0){editingVoiceRow=row;$('voiceForm').reset();$('voiceDialogTitle').textContent=t(row?'editVoiceTitle':'addVoiceTitle');openOverlay('voiceOverlay');if(row){try{for(const field of voiceFields){const value=await bridge('GetCellValue',VOICE_TABLE,`${field}/${row}`);const control=$('voiceForm').elements.namedItem(field);if(control.type==='checkbox')control.checked=value==='是';else control.value=value}}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}}
async function saveVoice(ev){ev.preventDefault();const btn=$('saveVoice');btn.disabled=true;try{const data={};for(const field of voiceFields){const c=$('voiceForm').elements.namedItem(field);data[field]=c.type==='checkbox'?(c.checked?'是':'否'):c.value}if(editingVoiceRow){const original=voiceRows.find(x=>x.row===editingVoiceRow);let row=editingVoiceRow;if(original){const found=await bridge('GetRecordRow',VOICE_TABLE,`声音简称/${original.values['声音简称']}`);if(Number(found)>0)row=Number(found)}for(const field of voiceFields)await bridge('SetCellValue',VOICE_TABLE,`${field}/${row}/${data[field]}`)}else await bridge('SubmitRecord',VOICE_TABLE,JSON.stringify(data));closeOverlay('voiceOverlay');showToast(t('saved'));await loadVoices();await loadVoiceOptions();await loadHome()}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}finally{btn.disabled=false}}
async function deleteVoice(row){if(!confirm(t('confirmDelete')))return;try{await bridge('DeleteRecord',VOICE_TABLE,row.toString());showToast(t('deleted'));await loadVoices();await loadVoiceOptions();await loadHome()}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}
async function loadHistory(){try{historyRows=await csvRows(TASK_TABLE,['任务名称','声音简称','输出格式','是否自动播放','创建时间','备注']);renderHistory()}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}
function renderHistory(){const list=$('historyList');if(!list)return;const q=$('historySearch').value.trim().toLocaleLowerCase(),fmt=$('historyFormat').value;const rows=historyRows.filter(({values:v})=>(!fmt||v['输出格式']===fmt)&&[v['任务名称'],v['备注']].some(x=>String(x).toLocaleLowerCase().includes(q)));list.innerHTML=rows.length?rows.map(({row,values:v})=>`<article class="card history-item"><div><h3>${esc(v['任务名称'])}</h3><div class="history-meta"><span>${esc(v['声音简称'])}</span><span class="pill">${esc(v['输出格式'])}</span><span>${esc(t('autoplay'))}: ${esc(v['是否自动播放']==='是'?t('yes'):t('no'))}</span><span>${esc(v['创建时间'])}</span></div></div><div class="actions"><button class="secondary" type="button" data-detail="${row}">${esc(t('details'))}</button><button class="danger" type="button" data-delete-task="${row}">${esc(t('delete'))}</button></div></article>`).join(''):`<div class="card empty">${esc(t('empty'))}</div>`}
async function deleteTask(row){if(!confirm(t('confirmDelete')))return;try{await bridge('DeleteRecord',TASK_TABLE,row.toString());showToast(t('deleted'));await loadHistory();await loadHome()}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}
function markdownHTML(content){const raw=window.marked?marked.parse(String(content||''),{gfm:true,breaks:true}):`<p>${esc(content)}</p>`;return window.DOMPurify?DOMPurify.sanitize(raw,{ADD_ATTR:['download']}) :raw}
function downloadUrl(filename){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(filename)}
async function audioElement(filename,autoplay=false){const ext=filename.toLowerCase().endsWith('.ogg')?'ogg':'mpeg';const b64=await bridge('FileToBase64',filename);const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=`data:audio/${ext};base64,${String(b64).replace(/^data:[^,]+,/,'')}`;audio.className='audio-box';if(autoplay)audio.autoplay=true;return audio}
function decorateMarkdownImages(root){root.querySelectorAll('img').forEach(img=>{const source=img.getAttribute('src')||'';if(source&&!/^(https?:|data:)/i.test(source))img.src=downloadUrl(source);const link=document.createElement('a');link.href=img.src;link.download='';link.target='_blank';img.parentNode.insertBefore(link,img);link.appendChild(img)})}
async function showAudio(root,filename,autoplay=false){root.innerHTML=markdownHTML(`[${t('download')}](${downloadUrl(filename)})`);decorateMarkdownImages(root);try{root.appendChild(await audioElement(filename,autoplay))}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}}
async function showDetail(row){openOverlay('detailOverlay');$('detailBody').innerHTML=`<p class="muted">${esc(t('loading'))}</p>`;try{const fields=['任务名称','声音简称','输出格式','是否自动播放','创建时间','备注','输入文本','语音文件'];const values={};for(const field of fields)values[field]=await bridge('GetCellValue',TASK_TABLE,`${field}/${row}`);const grid=document.createElement('div');grid.className='detail-grid';for(const [field,key] of [['任务名称','taskName'],['声音简称','voiceShort'],['输出格式','format'],['是否自动播放','autoplay'],['创建时间','created'],['备注','note']]){const label=document.createElement('div');label.className='detail-label';label.textContent=t(key);const val=document.createElement('div');val.textContent=field==='是否自动播放'?(values[field]==='是'?t('yes'):t('no')):values[field];grid.append(label,val)}const body=$('detailBody');body.replaceChildren(grid);const textTitle=document.createElement('h3');textTitle.textContent=t('inputText');body.append(textTitle);const textBox=document.createElement('div');textBox.className='markdown-body';textBox.innerHTML=markdownHTML(values['输入文本']);body.append(textBox);decorateMarkdownImages(textBox);const audioTitle=document.createElement('h3');audioTitle.textContent=t('audio');body.append(audioTitle);const audioBox=document.createElement('div');audioBox.className='markdown-body';body.append(audioBox);if(values['语音文件'])await showAudio(audioBox,values['语音文件']);else audioBox.textContent=t('noAudio')}catch(e){$('detailBody').innerHTML=`<p class="error">${esc(t('failed'))}: ${esc(e.message||e)}</p>`}}
async function pollAudio(){const panel=$('resultPanel'),status=$('resultStatus'),content=$('resultContent');panel.hidden=false;status.textContent=t('waiting');content.replaceChildren();polling=true;$('submitTask').disabled=true;const start=Date.now();try{while(Date.now()-start<1800000){const value=await bridge('轮询','语音合成任务','语音文件');if(String(value||'').trim()){const file=await bridge('GetCellValue',TASK_TABLE,'语音文件/1');status.textContent=t('completed');if(file)await showAudio(content,file,$('taskForm_autoplay').checked);else content.innerHTML=markdownHTML(value);await loadHome();await loadHistory();return}await new Promise(resolve=>setTimeout(resolve,1000))}status.textContent=t('timeout')}catch(e){status.textContent=`${t('failed')}: ${e.message||e}`}finally{polling=false;$('submitTask').disabled=false}}
async function submitTask(ev){ev.preventDefault();if(polling)return;const form=$('taskForm');if(!form.elements.namedItem('输入文本').value.trim()&&!form.elements.namedItem('文本文件').value.trim()){showToast(t('needInput'));return}const data={};for(const field of taskFields){const c=form.elements.namedItem(field);data[field]=field==='创建时间'?dateTimeNow():c.type==='checkbox'?(c.checked?'是':'否'):c.value}try{$('submitTask').disabled=true;await bridge('SubmitRecord',TASK_TABLE,JSON.stringify(data));pollAudio()}catch(e){$('submitTask').disabled=false;showToast(`${t('failed')}: ${e.message||e}`)}}
function setupKeyboard(){document.addEventListener('focusin',e=>{if(!e.target.matches('input,textarea,select'))return;keyboardTarget=e.target;setTimeout(()=>keyboardTarget?.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(keyboardTarget&&document.activeElement===keyboardTarget)setTimeout(()=>keyboardTarget.scrollIntoView({block:'center',behavior:'smooth'}),100)})}
async function initialize(){lang=languageDefault();try{const mode=await bridge('模式');document.documentElement.dataset.mode=String(mode).trim()==='暗色'?'dark':'light'}catch(e){document.documentElement.dataset.mode='light'}applyLanguage();document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));$('startButton').addEventListener('click',()=>navigate('studio'));$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('langButton').addEventListener('click',switchLanguage);$('mobileLang').addEventListener('click',switchLanguage);$('menuButton').addEventListener('click',()=>{const m=$('mobileMenu');m.hidden=!m.hidden;$('menuButton').setAttribute('aria-expanded',String(!m.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('#topbar'))closeMenu();const c=e.target.closest('[data-close]');if(c)closeOverlay(c.dataset.close)});for(const id of ['voiceOverlay','detailOverlay'])$(id).addEventListener('click',e=>{if(e.target===$(id))closeOverlay(id)});$('recentBody').addEventListener('click',e=>{const row=e.target.closest('[data-row]')?.dataset.row;if(row)showDetail(Number(row))});$('voicesBody').addEventListener('click',e=>{const edit=e.target.closest('[data-edit-voice]'),del=e.target.closest('[data-delete-voice]');if(edit)openVoiceForm(Number(edit.dataset.editVoice));if(del)deleteVoice(Number(del.dataset.deleteVoice))});$('historyList').addEventListener('click',e=>{const detail=e.target.closest('[data-detail]'),del=e.target.closest('[data-delete-task]');if(detail)showDetail(Number(detail.dataset.detail));if(del)deleteTask(Number(del.dataset.deleteTask))});$('addVoice').addEventListener('click',()=>openVoiceForm());$('voiceForm').addEventListener('submit',saveVoice);$('taskForm').addEventListener('submit',submitTask);$('selectTextFile').addEventListener('click',async()=>{try{const file=await bridge('SelectFile');if(file)$('taskForm_file').value=file}catch(e){showToast(`${t('failed')}: ${e.message||e}`)}});$('voiceSearch').addEventListener('input',renderVoices);$('historySearch').addEventListener('input',renderHistory);$('historyFormat').addEventListener('change',renderHistory);window.addEventListener('resize',refreshNav);setupKeyboard();document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page==='home'));await loadHome();await loadVoiceOptions()}
document.addEventListener('DOMContentLoaded',async () => { await initialize(); });
</script>
