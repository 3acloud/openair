<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

          reject(new Error('无法启动摄像头: ' + e.message));

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';

                const char = csvText[i];
                
                if (inQuotes) {

                            i++;
                        }

                        i++;
                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符

                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function markdown(target,text){if(!window.marked||!window.DOMPurify){target.textContent=text;notify(t('unavailable'));return}target.innerHTML=DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:false}),{USE_PROFILES:{html:true}});target.querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';let filename=raw;if(/^https?:/i.test(raw)){try{const parsed=new URL(raw);if(parsed.origin==='https://www.ithinkair.com:3031')filename=decodeURIComponent(parsed.pathname.replace(/^\/(download|private)\//,''));else {img.removeAttribute('src');img.alt=img.alt||raw;return}}catch{img.removeAttribute('src');return}}if(!filename||/^(data|javascript|blob):/i.test(filename)){img.removeAttribute('src');return}const address='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(filename);img.src=address;img.loading='lazy';const anchor=document.createElement('a');anchor.href=address;anchor.target='_blank';anchor.rel='noopener noreferrer';anchor.dataset.download='true';if(img.parentElement.tagName==='A'){img.parentElement.replaceWith(img)}img.replaceWith(anchor);anchor.append(img)});target.querySelectorAll('a').forEach(link=>{if(link.dataset.download)return;const href=link.getAttribute('href')||'';if(href.startsWith('#'))return;if(!/^https?:\/\//i.test(href)){link.removeAttribute('href');return}link.addEventListener('click',event=>{event.preventDefault();run(()=>callAppBridge({type:'链接',data:href}))})});target.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-scroll';table.replaceWith(wrap);wrap.append(table)})}
function renderOutput(){$('essaySubject').textContent=formRow?savedMeta[0]:t('idle');$('essayGenre').hidden=!formRow||!savedMeta[1];$('essayGenre').textContent=genreText(savedMeta[1]);if(polling){$('essayBody').innerHTML='<div class="loading-line" role="status"><i class="fa-solid fa-pen-nib" aria-hidden="true"></i><p>'+esc(t('waiting'))+'</p></div>'}else if(essay.trim())markdown($('essayBody'),essay);else $('essayBody').innerHTML='<div class="idle"><i class="fa-solid fa-book-open" aria-hidden="true"></i><p>'+esc(t(formRow?'emptyEssay':'idleBody'))+'</p></div>'}

function renderLists(){const counts=GENRES.map(g=>genreRows.filter(row=>row[0]===g).length);$('stats').innerHTML=[t('total'),...GENRES.map(genreText)].map((label,i)=>'<div class="stat"><span class="eyebrow">'+String(i+1).padStart(2,'0')+'</span><strong class="stat-value">'+(loaded?(i===0?recordCount:counts[i-1]):'—')+'</strong><span class="stat-label">'+esc(label)+'</span></div>').join('');if(!loaded){$('recentCards').innerHTML=emptyMarkup('loading',false);$('libraryCards').innerHTML=emptyMarkup('loading',false);return}$('recentCards').innerHTML=records.slice(0,5).map(record=>cardMarkup(record,true)).join('')||emptyMarkup('empty',true);const query=$('librarySearch').value.trim().toLocaleLowerCase(),genre=$('libraryGenre').value;const filtered=records.filter(record=>record.subject.toLocaleLowerCase().includes(query)&&(!genre||record.genre===genre));$('libraryCount').textContent=filtered.length+' '+t('count');$('libraryCards').innerHTML=filtered.slice(0,limit).map(record=>cardMarkup(record,false)).join('')||emptyMarkup(records.length?'noMatch':'empty',!records.length);$('loadMore').hidden=filtered.length<=limit;updateControls()}
async function cell(field,row){return String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row})??'')}
async function refreshData(){const version=++refreshVersion;const values=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'题材类型'}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')})]);const count=Number(values[0]);if(!Number.isInteger(count)||count<0)throw new Error('Invalid GetRecordCount response');const rows=parseCSV(String(values[2]??'')),next=[];for(let i=0;i<rows.length;i++){const observation=await cell('现场见闻',i+1);const reflection=await cell('个人感悟',i+1);next.push({row:i+1,subject:rows[i][0]||'',genre:rows[i][1]||'',observation,reflection})}if(version!==refreshVersion)return;recordCount=count;genreRows=parseCSV(String(values[1]??''));records=next;loaded=true;$('errorNotice').hidden=true;renderLists();updateControls()}

async function readRecord(row){if(busy||polling){notify(t('busy'));return}busy=true;updateControls();try{const subject=await cell('写作对象',row),genre=await cell('题材类型',row),text=await cell('散文',row);currentRow=row;showReader(text,subject,genre,false)}finally{busy=false;updateControls()}}
function showReader(text,subject,genre,onlyBody){$('readerHeading').hidden=onlyBody;$('readerSpacer').hidden=!onlyBody;$('readerTitle').textContent=subject;$('readerGenre').textContent=genreText(genre);$('readerGenre').dataset.value=genre;$('readerGenre').hidden=!genre;if(text.trim())markdown($('readerBody'),text);else $('readerBody').textContent=t('emptyEssay');openModal('readerOverlay')}
async function pollEssay(){const start=Date.now(),targetRow=formRow;let active=true;polling=true;essay='';renderOutput();updateControls();let timer;const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(t('timeout'))),1800000)});try{const work=async()=>{while(active&&Date.now()-start<1800000){await new Promise(resolve=>setTimeout(resolve,1000));if(!active)return;const result=String(await callAppBridge({type:'轮询',data:'散文写作',payload:'散文'})??'');if(!active)return;if(result.trim()){const complete=await cell('散文',targetRow);if(!active)return;if(complete.trim()){essay=complete;return}}}if(active)throw new Error(t('timeout'))};await Promise.race([work(),timeout]);notify(t('ready'))}finally{active=false;clearTimeout(timer);polling=false;renderOutput();updateControls()}}
async function submitDraft(event){event.preventDefault();if(busy||polling||!Object.values(formData()).every(Boolean))return;const data=formData(),isNew=formRow===0;busy=true;updateControls();let updated=0;try{if(isNew){await callAppBridge({type:'SubmitRecord',data:'散文写作',payload:JSON.stringify(data)});currentRow=1;formRow=1;recordCount++;essay=''}else{currentRow=formRow;for(const field of FIELDS){await callAppBridge({type:'SetCellValue',data:SOURCE,payload:field+'/'+formRow+'/'+data[field]});updated++}}savedMeta=[data['写作对象'],data['题材类型']];cleanForm=JSON.stringify(data);notify(t(isNew?'submitted':'saved'));if(isNew){const refresh=refreshSafely();await pollEssay();await refresh}else{essay=await cell('散文',formRow);renderOutput();await refreshSafely()}}catch(error){report(error);if(!isNew&&updated)notify(t('partial'))}finally{busy=false;updateControls()}}
async function askDelete(row){if(busy||polling){notify(t('busy'));return}const record=records.find(item=>item.row===row);if(!record)return;pendingDelete=row;$('confirmText').textContent=t('deleteHint')+record.subject;openModal('confirmOverlay')}
async function deleteRecord(){if(busy||polling||pendingDelete===null)return;const row=pendingDelete;busy=true;updateControls();try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});closeModal();if(formRow===row){formRow=0;$('draftForm').reset();essay='';savedMeta=['',''];cleanForm=JSON.stringify(formData())}else if(formRow>row)formRow--;if(currentRow===row)currentRow=0;else if(currentRow>row)currentRow--;renderOutput();notify(t('deleted'));await refreshSafely()}finally{busy=false;updateControls()}}
async function copyEssay(){const text=$('essayBody').innerText;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.append(area);area.focus();area.select();const ok=document.execCommand('copy');area.remove();$('copyEssay').focus();if(!ok)throw new Error('copy')}notify(t('copied'))}catch{notify(t('copyFailed'))}}
async function initialize(){lang=initialLanguage();cleanForm=JSON.stringify(formData());translate();document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',toggleLanguage));$('menuToggle').addEventListener('click',()=>{const open=$('mobileMenu').hidden;$('mobileMenu').hidden=!open;$('menuToggle').setAttribute('aria-expanded',String(open))});document.addEventListener('click',event=>{if(!$('topNav').contains(event.target))closeMenu();const pageButton=event.target.closest('[data-page]');if(pageButton)showPage(pageButton.dataset.page);if(event.target.closest('[data-new]'))resetDraft();const card=event.target.closest('.manuscript');if(card){const action=event.target.closest('[data-card-action]')?.dataset.cardAction;const row=Number(card.dataset.row);run(()=>action==='delete'?askDelete(row):(action==='edit'||card.dataset.recent==='true')?loadRecord(row):readRecord(row))}});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(modalStack.length)closeModal();else closeMenu()}if(event.target.classList.contains('manuscript')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();event.target.click()}if(event.key==='Tab'&&modalStack.length){const overlay=$(modalStack[modalStack.length-1].id),items=Array.from(overlay.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')).filter(el=>el.getClientRects().length);const first=items[0],last=items[items.length-1];if(!first){event.preventDefault();return}if(event.shiftKey&&(document.activeElement===first||document.activeElement===overlay.querySelector('.dialog'))){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});$('draftForm').addEventListener('input',updateControls);$('draftForm').addEventListener('change',updateControls);$('draftForm').addEventListener('submit',event=>run(()=>submitDraft(event)));$('librarySearc
