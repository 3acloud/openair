*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;background-image:linear-gradient(#a8906610 1px,transparent 1px),linear-gradient(90deg,#a8906610 1px,transparent 1px);background-size:40px 40px}button,input,select,textarea{font:inherit}input,select,textarea{box-sizing:border-box;width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}textarea{resize:vertical;min-height:185px}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 16px;background:var(--card);color:var(--text);transition:transform .18s,border-color .18s}button:hover{border-color:var(--gold)}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:#1B3A4B;color:#fff;border-color:#1B3A4B}.outline{border-color:var(--coral);color:var(--coral)}.icon{padding:8px 11px}.nav-shell{position:fixed;inset:0 0 auto;z-index:1001}nav{position:relative;z-index:1001;background:#12232E;color:#fff;box-shadow:0 3px 12px #0002}.nav-inner{max-width:1400px;margin:auto;padding:0 5%;min-height:76px;display:flex;align-items:center;gap:26px}.brand{white-space:nowrap;border:0;background:none;color:#fff;display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;padding:0}.brand i{color:var(--gold);font-size:26px}.nav-links{margin-left:auto;display:flex;gap:24px;white-space:nowrap;align-items:center}.nav-links button{background:none;color:#c3cdd0;border:0;border-radius:0;padding:24px 2px}.nav-links button.active{color:#fff;box-shadow:inset 0 -3px var(--gold)}#menuButton{display:none;margin-left:auto;background:none;color:white}.compact #menuButton{display:block}.compact .nav-links{display:none}.compact.open .nav-links{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:#12232E;padding:10px 5% 20px;align-items:stretch}.compact.open .nav-links button{text-align:left;padding:12px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--coral);font-weight:700;text-transform:uppercase}.wrap{max-width:1320px;margin:auto;padding:108px 32px 100px}section[hidden],[hidden]{display:none!important}h1,h2,h3,p{margin-top:0}h1{line-height:1.2;letter-spacing:-1px}h1{font-size:clamp(30px,4vw,52px)}h2{font-size:23px}h3{font-size:17px}p{color:var(--muted)}.hero{text-align:center;padding:35px 16px 42px;position:relative}.hero:before,.hero:after{content:"+";position:absolute;color:var(--gold);font-size:30px;top:20px}.hero:before{left:0}.hero:after{right:0}.hero h1{margin:18px 0}.hero p{max-width:620px;margin:0 auto 25px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hero .actions{justify-content:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}.panel,.stat,.work{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.panel{padding:24px;margin-bottom:24px}.stat{padding:22px;display:flex;justify-content:space-between;align-items:center}.stat strong{font-size:32px;display:block;line-height:1.3}.stat span{color:var(--muted);font-size:12px}.stat i{font-size:23px;color:var(--gold)}.stat:hover,.work:hover{transform:translateY(-3px);border-color:var(--gold)}.stat,.work{transition:.2s}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 18px}.section-head h2{margin:0}.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 0 10px}.strip button{white-space:nowrap;background:var(--soft)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.work{overflow:hidden;cursor:pointer;min-width:0}.thumb{height:190px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}.thumb img{width:100%;height:100%;object-fit:contain}.thumb i{font-s n{position:absolute;right:0;top:0;padding:0 5px}.preview-panel{position:sticky;top:100px}.board{aspect-ratio:1;background:var(--soft);border:1px dashed var(--line);border-radius:10px;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;min-width:0}.board>.result-image{width:100%;height:100%;object-fit:contain;cursor:zoom-in}.placeholder{text-align:center;position:relative;padding:25px;z-index:1}.placeholder i{display:block;font-size:42px;color:var(--gold);margin-bottom:20px}.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,1fr);opacity:.17;overflow:hidden}.mosaic img{width:100%;height:100%;object-fit:cover}.loading{background:linear-gradient(120deg,#1b3a4b20,#e85d4c30,#c9a22720);background-size:250% 250%;animation:shimmer 3s infinite}.spin{animation:spin 3s linear infinite}@keyframes shimmer{50%{background-position:100% 100%}}@keyframes spin{to{transform:rotate(360deg)}}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}.table-scroll{overflow-x:auto;max-width:100%;background:var(--card);border-radius:12px;border:1px solid var(--line)}table{border-collapse:collapse;min-width:1020px;width:100%;font-size:12px}th,td{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--soft)}tr:hover td{background:var(--soft)}tbody tr{cursor:pointer}td:first-child{max-width:220px}td img{width:36px;height:36px;object-fit:cover}.empty{padding:55px 20px;text-align:center;grid-column:1/-1;background:var(--card);border:1px dashed var(--line);border-radius:12px}.empty i{display:block;font-size:45px;color:var(--gold);margin-bottom:18px}.empty p{margin:10px}.overlay{position:fixed;inset:0;z-index:1100;background:#071118b0;display:flex;align-items:center;justify-content:center;padding:28px}.dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(1120px,100%);max-height:calc(100dvh - 56px);overflow:auto;padding:24px;box-shadow:0 20px 90px #0005}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.detail-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px}.detail-grid img{max-width:100%}.markdown{line-height:1.85;overflow-wrap:anywhere;text-align:left;width:100%;padding:18px}.markdown h1,.markdown h2{border-bottom:1px solid var(--line);padding-bottom:10px}.markdown pre{overflow:auto;background:var(--soft);padding:16px;border-radius:8px}.markdown code{background:var(--soft);padding:2px 4px}.markdown blockquote{border-left:3px solid var(--gold);margin-left:0;padding-left:18px;color:var(--muted)}.markdown img{max-width:100%;cursor:pointer}.markdown table{min-width:0;display:block;overflow:auto}.markdown a{color:var(--coral)}.zoom-dialog{width:min(1400px,100%)}.zoom-dialog img{max-width:100%;display:block;margin:auto}.html-frame{width:100%;height:70dvh;border:0;background:white}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:2000;max-width:90vw;background:#12232E;color:white;border:1px solid var(--gold);padding:12px 20px;border-radius:10px}footer{text-align:center;color:var(--muted);font-size:11px;letter-spacing:2px;margin-top:50px}.error{color:var(--coral)}fieldset{border:0;padding:0;margin:0;min-width:0}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters input{grid-column:1/-1}.studio-grid{grid-template-columns:1fr}.preview-panel{position:static}.chips{grid-template-columns:repeat(4,minmax(0,1fr))}}

<script>
var url;

        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `

      gap: 20px;
    `;
    
    // 创建拍照按钮

    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function openLink(href){const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}
async function deleteRecord(row){if(busy)return;if(!await confirmAction(t('confirmDelete')))return;busy=true;updateButtons();try{await api('DeleteRecord',SOURCE,String(row));closeAll();if(editRow===row){editRow=0;result='';resultRow=0}else if(editRow>row)editRow--;if(resultRow===row){resultRow=0;result=''}else if(resultRow>row)resultRow--;currentRow=0;await loadData();renderPreview()}finally{busy=false;updateButtons()}}
async function generate(){if(busy)return;if(recording!=='idle'){notify(t('voiceFirst'));return}const payload=getForm();if(!payload.内容.trim()){notify(t('emptyContent'));return}busy=true;result='';statusKey='generating';updateButtons();renderPreview();try{await api('SubmitRecord','信息图',JSON.stringify(payload));currentRow=resultRow=1;editRow=0;cache.clear();const deadline=Date.now()+1800000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1500));const remaining=deadline-Date.now();if(remaining<=0)break;let timer;const v=await Promise.race([api('GetCellValue',SOURCE,'信息图/'+resultRow),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error(t('timeout'))),remaining)})]).finally(()=>clearTimeout(timer));if(v.trim()){result=v.trim();statusKey='done';break}}if(!result)statusKey='timeout'}catch(e){statusKey=e.message===t('timeout')?'timeout':'failed';notify(t(statusKey)+': '+(e.message||e))}finally{busy=false;renderPreview();updateButtons();await loadData()}}
async function saveRecord(){if(busy||!editRow)return;busy=true;updateButtons();let saved=false;try{const payload=getForm();for(const f of FIELDS)await api('SetCellValue',SOURCE,f+'/'+editRow+'/'+payload[f]);saved=true;notify(t('saved'))}finally{busy=false;updateButtons();await loadData();if(!saved)notify(t('failed'))}}
async function handleVoice(action){if(voiceBusy||busy)return;voiceBusy=true;renderVoice();try{const v=await api(action);if(action==='StartRecordVoice'||action==='ContinueRecordVoice')recording='recording';else if(action==='PauseRecordVoice')recording='paused';else{recording='idle';if(action==='FinishRecordVoice'&&v.trim()){appendFile('素材文件',v.trim());$('voiceNotice').hidden=false}}}finally{voiceBusy=false;renderVoice();updateButtons()}}
function appendFile(key,value){const list=splitFiles(field(key).value);if(!list.includes(value))list.push(value);field(key).value=list.join(',');renderFiles();renderPreview()}
function keyboardFocus(){const el=document.activeElement;if(!el||!el.matches('input,textarea,select'))return;setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),200)}
async function initialize(){
try{const stored=localStorage.getItem('iThinkAir_UiLanguage'),param=new URLSearchParams(location.search).get('lang');lang=stored?(stored==='en'?'en':'cn'):(param==='en'||param==='cn'?param:(!navigator.languages?.length||navigator.languages.some(v=>/^zh/i.test(v))?'cn':'en'))}catch{lang=!navigator.languages?.length||navigator.languages.some(v=>/^zh/i.test(v))?'cn':'en'}
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';refreshLanguage();updateButtons();
$('brand').onclick=()=>run(async()=>{if(recording!=='idle'){notify(t('voiceFirst'));return}if(typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});
$('menuButton').onclick=()=>{const open=$('navigation').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))};
$('languageButton').onclick=()=>{lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch{}closeMenu();refreshLanguage()};
document.addEventListener('click',e=>{const el=e.target.closest('button,a,[data-record],.result-image,.markdown img');if(!e.target.closest('#navigation'))closeMenu();if(!el)return;run(async()=>{
if(el.matches('.markdown img')){e.preventDefault();const src=el.getAttribute('src')||'';if(/^https?:\/\//i.test(src))openLink(src.includes('/private/')?src.replace('/private/','/download/'):src);else if(src&&!src.startsWith('data:'))openLink(fileURL(src));return}
if(el.matches('.result-image')){const m=openModal('<div class="dialog-head"><button data-dismiss>'+t('close')+'</button></div><img src="'+esc(el.src)+'" alt="'+esc(t('preview'))+'">',true);m.querySelector('.dialog').classList.add('zoom-dialog');m.querySelector('[data-dismiss]').onclick=()=>closeModal();return}
if(el.dataset.page||el.dataset.go){navigate(el.dataset.page||el.dataset.go);return}
if(el.hasAttribute('data-empty-new')){makeNew();return}
if(el.hasAttribute('data-reload')){await loadData();return}
if(el.dataset.inspire){if(busy)return;field('布局').value=OPTIONS.布局[Number(el.dataset.inspire)];renderChoices();navigate('studio');return}
if(el.dataset.choice){if(busy)return;field(el.dataset.choice).value=el.dataset.value;renderChoices();renderPreview();return}
if(el.dataset.pick){if(busy)return;el.disabled=true;try{const v=await api(el.dataset.pick);if(v.trim())appendFile(el.dataset.pick==='SelectFile'?'素材文件':'参考图片',v.trim())}finally{el.disabled=false}return}
if(el.dataset.remove){const key=el.dataset.remove,list=splitFiles(field(key).value);list.splice(Number(el.dataset.index),1);field(key).value=list.join(',');renderFiles();renderPreview();return}
if(el.dataset.voice){await handleVoice(el.dataset.voice);return}
if(el.dataset.result){const a=el.dataset.result;if(a==='remix'){editRow=currentRow=resultRow=0;result='';statusKey='';updateButtons();renderPreview()}else if(a==='detail')await showDetail(resultRow);else await downloadRecord(resultRow,a==='open'?'private':'download');return}
if(el.dataset.action){const row=Number(el.dataset.row);if(el.dataset.action==='view')await showDetail(row);else if(el.dataset.action==='edit')await editRecord(row);else if(el.dataset.action==='delete')await deleteRecord(row);else if(el.dataset.action==='download')await downloadRecord(row);else if(el.dataset.action==='retry'){cache.delete(row);await hydrateVisible(epoch)}return}
if(el.dataset.record)await showDetail(Number(el.dataset.record));
})});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){const img=e.target;img.hidden=true;if(img.parentElement.classList.contains('thumb')){const icon=document.createElement('i');icon.className='fa-solid fa-palette';img.parentElement.append(icon)}}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalStack.length)closeModal();else closeMenu()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-record]')){e.preventDefault();run(()=>showDetail(Number(e.target.dataset.record)))}if(e.key==='Tab'&&modalStack.length){const m=modalStack[modalStack.length-1],focus=[...m.querySelectorAll('button:not(:disabled),a[href],input,select,textarea,[tabindex="0"]')].filter(n=>n.offsetParent!==null);if(focus.length){const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===m.querySelector('.dialog'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
$('studioForm').onsubmit=e=>{e.preventDefault();run(generate)};field('内容').oninput=updateButtons;$('saveButton').onclick=()=>run(saveRecord);$('clearButton').onclick=resetForm;$('newButton').onclick=makeNew;$('refreshButton').onclick=()=>run(loadData);
$('gallerySearch').oninput=()=>{limit=12;renderLists()};for(const key of KEYS)$('filter-'+key).onchange=()=>{limit=12;renderLists()};$('cardView').onclick=()=>{view='cards';renderLists()};$('tableView').onclick=()=>{view='table';renderLists()};$('moreButton').onclick=()=>{limit+=12;renderLists()};
window.addEventListener('resize',fitNav);document.addEventListener('focusin',keyboardFocus);window.visualViewport?.addEventListener('resize',()=>{const inset=Math.max(0,window.innerHeight-window.visualViewport.height);document.documentElement.style.setProperty('--keyboard',inset+'px');keyboardFocus()});
const modeTask=api('模式').then(mode=>{document.documentElement.dataset.theme=mode.trim()==='暗色'?'dark':'light'}).catch(()=>{});await Promise.all([modeTask,loadData()]);
}
(async () => { await initialize(); })();
</script>
</body>
</html>
