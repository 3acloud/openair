        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**
 * 上传文件到Flask服务端
 * @param {File} file - 要上传的文件
 * @returns {Promise<string>} - 返回GUID文件名
 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function formValues(form){const data={};for(const field of FIELDS){data[field]=field==='兴趣偏好'?Array.from(form.querySelectorAll('input[name="兴趣偏好"]:checked'),el=>el.value).join(','):form.elements.namedItem(field).value.trim();}return data;}

function validate(form){if(!form.reportValidity())return null;const data=formValues(form);if(!data['目的地']||!Number.isInteger(+data['天数'])||+data['天数']<1||!localDate(data['出发日期'])){notify(t('请填写有效的目的地、天数和出发日期。','Enter a destination, valid day count and departure date.'));return null;}if(!data['兴趣偏好']){notify(t('请至少选择一项兴趣偏好。','Choose at least one interest.'));form.querySelector('input[name="兴趣偏好"]').focus();return null;}if(data['返回日期']&&(!localDate(data['返回日期'])||data['返回日期']<data['出发日期'])){notify(t('返回日期不能早于出发日期。','Return date must not be before departure.'));return null;}return data;}

async function refreshData(){if(loadPromise)return loadPromise;loadPromise=(async()=>{const results=await Promise.allSettled([request('GetTableCSV',SOURCE,FIELDS.join(',')),request('GetRecordCount',SOURCE),request('GetTableCSV',SOURCE,'出发日期')]);let errors=[];if(results[0].status==='fulfilled'){records=parseCSV(results[0].value).map((row,i)=>({row:i+1,values:Object.fromEntries(FIELDS.map((field,j)=>[field,row[j]??'']))}));loaded=true;loadFailed=false;}else{loadFailed=true;errors.push(errorText(results[0].reason));}if(results[1].status==='fulfilled'&&/^\d+$/.test(results[1].value.trim()))$('stat-total').textContent=results[1].value.trim();else{$('stat-total').textContent='—';errors.push(t('总行程数加载失败','Trip count unavailable'));}if(results[2].status==='fulfilled'){const today=dateString(new Date()),month=today.slice(0,7),dates=parseCSV(results[2].value).map(row=>row[0].slice(0,10)).filter(v=>localDate(v));$('stat-upcoming').textContent=dates.filter(v=>v>=today).length;$('stat-month').textContent=dates.filter(v=>v.slice(0,7)===month).length;}else{errors.push(errorText(results[2].reason));$('stat-upcoming').textContent='—';$('stat-month').textContent='—';}$('load-error').hidden=!errors.length;$('load-error-text').textContent=t('数据未完全加载：','Some data could not be loaded: ')+errors.join(' · ');renderLists();})();try{await loadPromise;}finally{loadPromise=null;}}

async function showDetails(row){if(mutating||reading)return;reading=true;updateControls();const body=document.createElement('div');body.className='muted';body.textContent=t('正在读取行程详情…','Loading trip details…');const modal=openModal(t('行程详情','Journey details'),body,{large:true,detail:true});try{currentRow=row;const values=await readRecord(row);if(!modal.overlay.isConnected)return;modal.overlay.querySelector('h2').textContent=values['目的地']||t('行程详情','Journey details');body.className='';body.innerHTML=`<dl class="summary">${FIELDS.map(f=>`<div><dt>${esc(label(f))}</dt><dd>${esc(f==='兴趣偏好'?preferenceValues(values[f]).map(label).join(' · '):label(values[f]))||'—'}</dd></div>`).join('')}</dl><article class="markdown"></article><div class="dialog-actions"><button class="btn secondary" data-close-detail>${t('关闭','Close')}</button><button class="btn" data-regenerate data-mutates><i class="fa-solid fa-wand-magic-sparkles"></i>${t('重新生成行程','Regenerate itinerary')}</button></div>`;const article=body.querySelector('.markdown');if(values['行程方案'].trim())renderMarkdown(article,values['行程方案']);else article.textContent=t('行程方案尚未生成，可稍后重新打开详情查看。','The itinerary is not ready yet. Reopen this journey later to check.');body.querySelector('[data-close-detail]').onclick=()=>closeModal();body.querySelector('[data-regenerate]').onclick=()=>{if(busy||mutating)return;closeAllModals();navigate('plan');$('plan-fields').innerHTML=formMarkup('plan-form',values);void generateTrip(Object.fromEntries(FIELDS.map(f=>[f,values[f]])));};}catch(e){body.textContent=t('读取失败：','Unable to load: ')+errorText(e);}finally{reading=false;updateControls();}}
async function editRecord(row){if(busy||mutating||reading)return;reading=true;updateControls();const body=document.createElement('div');body.textContent=t('正在读取当前记录…','Loading the current record…');const modal=openModal(t('编辑行程','Edit journey'),body);try{currentRow=row;const values=await readRecord(row,false);if(!modal.overlay.isConnected)return;body.innerHTML=`<form id="edit-form"><div class="form-grid">${formMarkup('edit-form',values)}</div><p class="form-note">${t('保存仅更新旅行偏好；如需更新 AI 方案，请在详情中重新生成行程。','Saving updates your preferences. Regenerate from trip details to create an updated AI itinerary.')}</p><p class="form-note" id="edit-error" role="alert"></p><div class="dialog-actions"><button type="button" class="btn secondary" id="edit-cancel">${t('取消','Cancel')}</button><button type="submit" class="btn" id="edit-save" data-mutates>${t('保存更改','Save changes')}</button></div></form>`;const form=$('edit-form');bindForm(form);$('edit-cancel').onclick=()=>closeModal();form.onsubmit=async e=>{e.preventDefault();if(busy||mutating)return;const data=validate(form);if(!data)return;mutating=true;modal.locked=true;updateControls();Array.from(form.elements).forEach(el=>el.disabled=true);let saved=0;try{for(const f of FIELDS){await request('SetCellValue',SOURCE,`${f}/${row}/${data[f]}`);saved++;}modal.locked=false;closeModal();notify(t('行程已更新','Journey updated'));}catch(err){$('edit-error').textContent=t(`保存失败（已更新 ${saved} 个字段），可重试：`,`Save failed (${saved} fields updated). You may retry: `)+errorText(err);}finally{modal.locked=false;mutating=false;if(form.isConnected)Array.from(form.elements).forEach(el=>el.disabled=false);await refreshData();updateControls();}};}catch(e){body.textContent=t('读取失败：','Unable to load: ')+errorText(e);}finally{reading=false;updateControls();}}
function confirmDelete(row){if(busy||mutating||reading)return;const rec=records.find(r=>r.row===row);if(!rec)return;const body=document.createElement('div');body.innerHTML=`<p>${esc(t(`确认删除这条去往「${rec.values['目的地']}」的行程吗？`,`Delete this journey to “${rec.values['目的地']}”?`))}</p><p class="form-note">${t('删除后无法恢复。','This cannot be undone.')}</p><div class="dialog-actions"><button class="btn secondary" data-cancel>${t('取消','Cancel')}</button><button class="btn danger" data-confirm>${t('确认删除','Delete journey')}</button></div>`;const modal=openModal(t('删除行程','Delete journey'),body);body.querySelector('[data-cancel]').onclick=()=>closeModal();body.querySelector('[data-confirm]').onclick=async()=>{if(busy||mutating)return;mutating=true;modal.locked=true;body.querySelector('[data-confirm]').disabled=true;updateControls();try{await request('DeleteRecord',SOURCE,row.toString());currentRow=0;modal.locked=false;closeModal();notify(t('行程已删除','Journey deleted'));await refreshData();}catch(e){notify(t('删除失败：','Delete failed: ')+errorText(e));}finally{modal.locked=false;mutating=false;if(body.isConnected)body.querySelector('[data-confirm]').disabled=false;updateControls();}};}
async function pollPlan(row){const deadline=Date.now()+1800000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));let timer;const remaining=deadline-Date.now();if(remaining<=0)break;try{const text=await Promise.race([request('GetCellValue',SOURCE,`行程方案/${row}`),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(t('生成等待已超时（30 分钟），稍后可在我的行程中查看。','Generation timed out after 30 minutes. Check My trips later.'))),remaining);})]);if(text.trim())return text;}finally{clearTimeout(timer);}}throw new Error(t('生成等待已超时（30 分钟），稍后可在我的行程中查看。','Generation timed out after 30 minutes. Check My trips later.'));}
async function generateTrip(values){if(busy||mutating)return;busy=true;planMarkdown='';generationError='';generationState='submitting';$('download-area').replaceChildren();renderGeneration();let submitted=false;try{await request('SubmitRecord',TABLE,JSON.stringify(values));currentRow=1;submitted=true;generationState='polling';void refreshData();planMarkdown=await pollPlan(1);generationState='complete';}catch(e){generationState='error';generationError=(submitted?t('计划已保存，','Your trip was saved. '):t('提交未确认，请先查看我的行程再重试，以免重复创建。','Submission was not confirmed. Check My trips before retrying to avoid duplicates. '))+errorText(e);if(!submitted)currentRow=0;}finally{busy=false;renderGeneration();void refreshData();}}
async function downloadPlan(){if(!planMarkdown)return;const button=$('download-plan');button.disabled=true;try{const response=(await request('WriteFile','行程方案.md',planMarkdown)).trim();let filename=response||'行程方案.md';try{const parsed=JSON.parse(response);if(typeof parsed==='string')filename=parsed;else if(parsed&&typeof parsed==='object')filename=parsed.filename||parsed.fileName||parsed.data||'行程方案.md';}catch(e){}if(['true','ok','success','成功'].includes(String(filename).toLowerCase()))filename='行程方案.md';const a=document.createElement('a');a.className='download-link';a.textContent=t('点击下载行程方案.md','Download itinerary.md');a.href='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(String(filename));a.target='_blank';a.rel='noopener';a.download='行程方案.md';$('download-area').replaceChildren(a);a.click();}catch(e){notify(t('下载失败：','Download failed: ')+errorText(e));}finally{updateControls();}}
function setupFilters(){for(const [id,field] of [['filter-style','旅行风格'],['filter-diet','饮食限制']]){const prev=$(id).value;$(id).innerHTML=`<option value="">${t('全部','All')}</option>`+OPTIONS[field].map(v=>`<option value="${v}">${label(v)}</option>`).join('');$(id).value=prev;}}
function switchLanguage(){const values=formValues($('plan-form'));lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang);}catch(e){}document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('云途 · 旅行规划器','Cloudway · Travel Planner');translate();$('plan-fields').innerHTML=formMarkup('plan-form',values);setupFilters();renderLists();renderGeneration();closeMenu();fitNav();}
function handleFocus(e){if(!e.target.matches('input,select,textarea'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300);}
async function initialize(){lang=getLanguage();document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('云途 · 旅行规划器','Cloudway · Travel Planner');translate();$('plan-fields').innerHTML=formMarkup('plan-form');setupFilters();bindForm($('plan-form'));renderLists();$('brand').onclick=()=>{try{parent.closeFullHtml(false);}catch(e){notify(t('请在应用内使用关闭功能。','Open this page in the app to close it.'));}};$('menu-toggle').onclick=()=>{const open=$('mobile-menu').hidden;$('mobile-menu').hidden=!open;$('menu-toggle').setAttribute('aria-expanded',String(open));};document.querySelectorAll('[data-language]').forEach(b=>b.onclick=switchLanguage);document.addEventListener('click',e=>{if(!$('top-nav').contains(e.target))closeMenu();const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return;}const details=e.target.closest('[data-detail]');if(details){void showDetails(+details.dataset.detail);return;}const edit=e.target.closest('[data-edit]');if(edit){void editRecord(+edit.dataset.edit);return;}const del=e.target.closest('[data-delete]');if(del)confirmDelete(+del.dataset.delete);});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modals.length)closeModal();else closeMenu();}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.trip-body')){e.preventDefault();void showDetails(+e.target.dataset.detail);}if(e.key==='Tab'&&modals.length){const all=Array.from(modals.at(-1).overlay.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),[tabindex="0"]')).filter(el=>el.getClientRects().length),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});$('plan-form').onsubmit=e=>{e.preventDefault();if(busy||mutating)return;const data=validate($('plan-form'));if(data)void generateTrip(data);};$('reset-plan').onclick=()=>{if(busy||mutating)return;$('plan-fields').innerHTML=formMarkup('plan-form');planMarkdown='';currentRow=0;generationState='';generationError='';$('plan-result').replaceChildren();$('download-area').replaceChildren();renderGeneration();};$('download-plan').onclick=()=>void downloadPlan();$('retry').onclick=()=>void refreshData();for(const id of ['trip-search','filter-style','filter-diet','filter-from','filter-to'])$(id).addEventListener('input',()=>{visibleCount=12;renderLists();});$('clear-filters').onclick=()=>{for(const id of ['trip-search','filter-style','filter-diet','filter-from','filter-to'])$(id).value='';visibleCount=12;renderLists();};$('load-more').onclick=()=>{visibleCount+=12;renderLists();};window.addEventListener('resize',fitNav);if(window.ResizeObserver)new ResizeObserver(fitNav).observe($('brand'));fitNav();document.addEventListener('focusin',handleFocus);if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const extra=Math.max(0,window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop);document.documentElement.style.setProperty('--keyboard',extra+'px');if(extra>100&&document.activeElement.matches('input,select,textarea'))document.activeElement.scrollIntoView({block:'center',behavior:'smooth'});});const modeTask=(async()=>{try{const mode=(await request('模式')).trim();document.documentElement.dataset.theme=mode.includes('暗色')?'dark':'light';}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';notify(t('无法读取应用模式，已使用系统主题。','App theme unavailable; using your system theme.'));}})();await Promise.allSettled([modeTask,refreshData()]);}
(async () => { await initialize(); })();
</script>
