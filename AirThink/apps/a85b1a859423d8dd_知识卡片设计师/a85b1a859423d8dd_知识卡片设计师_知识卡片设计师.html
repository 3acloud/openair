<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("a85b1a859423d8dd_知识卡片设计师")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

  }

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function translate(){document.documentElement.lang=lang==='cn'?'zh-CN':'en';document.title=t('app');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));const chosen=$('createForm').querySelector('input[name="内容类型"]:checked')?.value;$('createForm_types').innerHTML=renderChoices('createForm',chosen);const filter=$('filter').value;$('filter').innerHTML='<option value="">'+t('all')+'</option>'+TYPES.map(v=>'<option value="'+v+'">'+t(v)+'</option>').join('');$('filter').value=filter;updateFile();renderStats();renderLists();renderPreview();if(busy)$('generationStatus').textContent=t('waiting');updateControls();requestAnimationFrame(fitNav)}
function changeLanguage(){lang=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',lang)}catch{}closeMenu();translate()}
function fitNav(){const nav=$('nav'),links=$('navlinks');nav.classList.remove('compact');if($('brand').offsetWidth+links.scrollWidth+90>nav.clientWidth)nav.classList.add('compact');if(!nav.classList.contains('compact'))closeMenu()}
function closeMenu(){$('mobilemenu').hidden=true;$('hamburger').setAttribute('aria-expanded','false')}
function navigate(next,record=true){closeMenu();if(next===page)return;if(record)historyStack.push({page,scroll:window.scrollY});page=next;document.querySelectorAll('.page').forEach(el=>el.hidden=el.id!==page);document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));window.scrollTo(0,0)}
window.airBack=function(){if(!$('overlay').hidden){if(mutating)return 'false';closeDialog();return 'false'}if(!$('mobilemenu').hidden){closeMenu();return 'false'}if(historyStack.length){const previous=historyStack.pop();navigate(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false'}return 'true'};
function renderStats(){const labels=['total',...TYPES];$('stats').innerHTML=labels.map((label,i)=>'<div class="stat"><span class="muted">'+esc(t(label))+'</span><strong>'+(statsData?(i?statsData[label]:total):'—')+'</strong></div>').join('')}
function recordHTML(r,recent=false){return '<article class="record"><div class="record-body" tabindex="0" role="button" data-action="detail" data-row="'+r.row+'">'+badge(r['内容类型'])+'<h3>'+esc(r['主题'])+'</h3>'+(r['资料文件']?'<a class="file" href="'+fileURL(r['资料文件'],'private')+'" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-paperclip"></i> '+esc(r['资料文件'])+'</a>':'')+'<p class="excerpt">'+esc((r.summary||'').slice(0,recent?80:100))+((r.summary||'').length>(recent?80:100)?'…':'')+'</p></div>'+(!recent?'<div class="actions">'+['detail','edit','delete'].map(a=>'<button data-action="'+a+'" data-row="'+r.row+'" '+(busy?'disabled':'')+'>'+esc(t(a))+'</button>').join('')+'</div>':'')+'</article>'}
function renderLists(){const query=$('search').value.trim().toLocaleLowerCase(),type=$('filter').value;const filtered=records.filter(r=>r['主题'].toLocaleLowerCase().includes(query)&&(!type||r['内容类型']===type));$('recent').innerHTML=records.slice(0,5).map(r=>recordHTML(r,true)).join('')||empty(t(loaded?'empty':'loading'));$('cards').innerHTML=filtered.map(r=>recordHTML(r)).join('')||empty(t(loaded?(records.length?'noResults':'empty'):'loading'));$('resultCount').textContent=loaded?filtered.length+' '+t('count'):''}
async function refreshData(){const results=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'内容类型'}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')})]);const count=Number(results[0]);if(!Number.isInteger(count)||count<0)throw new Error(t('retry'));const nextRecords=parseCSV(results[2]).map((values,index)=>{const r={row:index+1};FIELDS.forEach((f,i)=>r[f]=values[i]||'');return r});for(let start=0;start<nextRecords.length;start+=6){await Promise.all(nextRecords.slice(start,start+6).map(r=>callAppBridge({type:'GetCellValue',data:SOURCE,payload:'知识卡片/'+r.row}).then(value=>{r.summary=value})))}total=count;records=nextRecords;statsData=Object.fromEntries(TYPES.map(v=>[v,0]));for(const row of parseCSV(results[1]))if(TYPES.includes(row[0]))statsData[row[0]]++;loaded=true;renderStats();renderLists();updateControls()}
async function getRecord(row){const r={row};for(const field of FIELDS)r[field]=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row});return r}
function updateFile(){$('createForm_filename').textContent=$('createForm_file').value||t('noFile');$('clearFile').disabled=busy||!$('createForm_file').value}
function updateControls(){for(const el of $('createForm').elements)el.disabled=busy;$('generate').disabled=busy||!$('createForm_topic').value.trim()||!$('createForm').querySelector('input[name="内容类型"]:checked');$('prev').disabled=busy||currentRow<=1;$('next').disabled=busy||currentRow>=total;$('newCard').disabled=busy;$('libraryNew').disabled=busy;$('refresh').disabled=busy;$('rowIndicator').textContent=currentRow+' / '+total;updateFile()}
function renderPreview(){$('previewTopic').textContent=preview?.['主题']||'';$('previewType').textContent=preview?t(preview['内容类型']):'';$('previewType').dataset.type=preview?.['内容类型']||'';$('previewContent').className='';if(!currentRow)$('previewContent').innerHTML=empty(t('emptyPreview'));else if(busy)$('previewContent').innerHTML=empty(t('waiting'));else renderMarkdown($('previewContent'),preview?.['知识卡片']||'');updateControls()}
function resetCard(){if(busy){toast(t('busy'));return}currentRow=0;preview=null;$('createForm').reset();$('createForm_file').value='';$('generationStatus').textContent='';renderPreview()}
async function step(delta){if(busy)return;const row=currentRow+delta;if(row<1||row>total)return;$('prev').disabled=$('next').disabled=true;try{preview=await getRecord(row);currentRow=row;renderPreview()}finally{updateControls()}}
async function generate(event){event.preventDefault();if(busy||!$('createForm').reportValidity())return;const values={'主题':$('createForm_topic').value.trim(),'内容类型':$('createForm').querySelector('input[name="内容类型"]:checked').value,'资料文件':$('createForm_file').value};if(!values['主题'])return;busy=true;updateControls();renderLists();$('generationStatus').textContent=t('submitting');try{await callAppBridge({type:'SubmitRecord',data:'卡片设计',payload:JSON.stringify(values)});currentRow=1;preview={...values,'知识卡片':''};total++;renderPreview();$('generationStatus').textContent=t('waiting');const deadline=Date.now()+1800000;let content='';while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,Math.min(1000,Math.max(0,deadline-Date.now()))));const remaining=deadline-Date.now();if(remaining<=0)break;let timer;try{content=await Promise.race([callAppBridge({type:'GetCellValue',data:SOURCE,payload:'知识卡片/'+currentRow}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(t('timeout'))),remaining)})])}finally{clearTimeout(timer)}if(String(content).trim())break}if(!String(content).trim())throw new Error(t('timeout'));preview['知识卡片']=content;$('generationStatus').textContent=t('done');await refreshData()}catch(e){$('generationStatus').textContent=t('error')+(e.message||e);toast(t('error')+(e.message||e))}finally{busy=false;renderPreview();renderLists()}}
function openDialog(title,reader=false){previousFocus=document.activeElement;$('dialogTitle').textContent=title;$('dialogBody').innerHTML=empty(t('loading'));$('overlay').classList.toggle('reader',reader);$('overlay').hidden=false;document.body.style.overflow='hidden';$('closeDialog').focus()}
function closeDialog(){if(mutating)return;modalToken++;$('overlay').hidden=true;document.body.style.overflow='';previousFocus?.focus()}
function fileLinks(file){return file?'<p class="file">'+esc(file)+'</p><p><a href="'+fileURL(file,'private')+'" target="_blank" rel="noopener noreferrer">'+t('open')+'</a> · <a href="'+fileURL(file)+'" target="_blank" rel="noopener noreferrer">'+t('download')+'</a></p>':''}
async function details(row,edit=false){if(busy){toast(t('busy'));return}const token=++modalToken;dialogRow=row;openDialog(t(edit?'editTitle':'detail'),!edit);try{const r=await getRecord(row);if(token!==modalToken)return;currentRow=row;preview=r;renderPreview();if(!edit){$('dialogTitle').textContent=r['主题'];$('dialogBody').innerHTML=badge(r['内容类型'])+fileLinks(r['资料文件'])+'<div id="detailMarkdown"></div><button id="detailEdit">'+t('edit')+'</button>';renderMarkdown($('detailMarkdown'),r['知识卡片']);$('detailEdit').onclick=()=>safe(()=>details(row,true));return}$('dialogBody').innerHTML='<form id="editForm"><div class="field"><label for="editForm_topic">'+t('topic')+'</label><input id="editForm_topic" name="主题" required value="'+esc(r['主题'])+'"></div><fieldset class="field"><legend>'+t('type')+'</legend><div class="choices">'+renderChoices('editForm',r['内容类型'])+'</div></fieldset><div class="field"><label for="editForm_file">'+t('material')+'</label><input id="editForm_file" name="资料文件" readonly value="'+esc(r['资料文件'])+'"><p><button type="button" id="editForm_choose">'+t('choose')+'</button> <button type="button" id="editForm_clear">'+t('clear')+'</button></p></div><label>'+t('readonly')+'</label><div id="editForm_markdown"></div><button class="primary" type="submit">'+t('save')+'</button> <button id="editForm_cancel" type="button">'+t('cancel')+'</button></form>';renderMarkdown($('editForm_markdown'),r['知识卡片']);$('editForm_choose').onclick=()=>safe(async()=>{const file=await callAppBridge({type:'SelectFile'});if(file&&token===modalToken)$('editForm_file').value=file});$('editForm_clear').onclick=()=>$('editForm_file').value='';$('editForm_cancel').onclick=closeDialog;$('editForm').onsubmit=e=>{e.preventDefault();safe(()=>saveEdit(row))}}catch(e){if(token===modalToken)$('dialogBody').textContent=t('error')+(e.message||e)}}
async function saveEdit(row){if(mutating||!$('editForm').reportValidity())return;const values={'主题':$('editForm_topic').value.trim(),'内容类型':$('editForm').querySelector('[name="内容类型"]:checked').value,'资料文件':$('editForm_file').value};if(!values['主题'])return;mutating=true;for(const el of $('editForm').elements)el.disabled=true;$('closeDialog').disabled=true;try{for(const field of ['主题','内容类型','资料文件'])await callAppBridge({type:'SetCellValue',data:SOURCE,payload:field+'/'+row+'/'+values[field]});preview={...preview,...values};renderPreview();await refreshData();mutating=false;closeDialog();toast(t('saved'))}finally{mutating=false;$('closeDialog').disabled=false;if($('editForm'))for(const el of $('editForm').elements)el.disabled=false}}
function confirmDelete(row){if(busy)return;openDialog(t('delete'));$('dialogBody').innerHTML='<p>'+t('confirm')+'</p><button id="confirmDelete" class="danger">'+t('delete')+'</button> <button id="cancelDelete">'+t('cancel')+'</button>';$('cancelDelete').onclick=closeDialog;$('confirmDelete').onclick=()=>safe(async()=>{if(mutating)return;mutating=true;$('confirmDelete').disabled=true;$('closeDialog').disabled=true;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row){currentRow=0;preview=null}else if(currentRow>row)currentRow--;await refreshData();renderPreview();mutating=false;closeDialog();toast(t('deleted'))}finally{mutating=false;$('closeDialog').disabled=false;if($('confirmDelete'))$('confirmDelete').disabled=false}})}
async function initialize(){try{const langs=navigator.languages;lang=!langs||!langs.length||langs.some(v=>/^zh(?:-|$)/i.test(v))?'cn':'en';const param=new URLSearchParams(location.search).get('lang');if(param==='cn'||param==='en')lang=param;const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)lang=stored==='en'?'en':'cn'}catch{}translate();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll('[data-page="home"]').forEach(b=>b.classList.add('active'));$('brand').onclick=()=>safe(async()=>parent.closeFullHtml(false));$('language').onclick=$('mobilelanguage').onclick=changeLanguage;$('hamburger').onclick=()=>{const show=$('mobilemenu').hidden;$('mobilemenu').hidden=!show;$('hamburger').setAttribute('aria-expanded',String(show))};document.addEventListener('click',e=>{if(!$('nav').contains(e.target))closeMenu()});window.addEventListener('resize',fitNav);new ResizeObserver(fitNav).observe($('brand'));$('createForm').addEventListener('input',updateControls);$('createForm').addEventListener('change',updateControls);$('createForm').onsubmit=generate;$('chooseFile').onclick=()=>safe(async()=>{const file=await callAppBridge({type:'SelectFile'});if(file)$('createForm_file').value=file;updateFile()});$('clearFile').onclick=()=>{$('createForm_file').value='';updateFile()};$('newCard').onclick=resetCard;$('libraryNew').onclick=()=>{resetCard();navigate('studio')};$('prev').onclick=()=>safe(()=>step(-1));$('next').onclick=()=>safe(()=>step(1));$('search').oninput=renderLists;$('filter').onchange=renderLists;$('refresh').onclick=()=>safe(async()=>{$('refresh').disabled=true;try{await refreshData();$('status').hidden=true}finally{updateControls()}});for(const id of ['recent','cards']){$(id).onclick=e=>{if(e.target.closest('a'))return;const action=e.target.closest('[data-action]');if(!action)return;const row=Number(action.dataset.row);if(action.dataset.action==='delete')confirmDelete(row);else safe(()=>details(row,action.dataset.action==='edit'))};$(id).onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.record-body')){e.preventDefault();e.target.click()}}}$('closeDialog').onclick=closeDialog;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();closeMenu()}if(e.key==='Tab'&&!$('overlay').hidden){const nodes=[...$('overlay').querySelectorAll('button:not(:disabled),a,input:not(:disabled),[tabindex="0"]')].filter(el=>el.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});const reveal=()=>{const el=document.activeElement;if(el&&el.matches('input,select,textarea'))setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),200)};document.addEventListener('focusin',reveal);if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const height=Math.max(0,window.innerHeight-visualViewport.height);document.body.classList.toggle('keyboard',height>120);document.body.style.setProperty('--keyboard',height+'px');reveal()});await Promise.all([safe(async()=>{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}),(async()=>{try{await refreshData()}catch(e){$('status').hidden=false;$('status').textContent=t('retry')+' '+(e.message||e)}})()])}
(async () => { await initialize(); })();
</script></body></html>
