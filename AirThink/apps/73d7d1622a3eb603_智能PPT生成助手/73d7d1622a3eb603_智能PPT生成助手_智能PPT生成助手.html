  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

      cn:{appName:'智能PPT生成助手',home:'首页',styles:'风格配置',tasks:'生成任务库',heroDescription:'通过AI一键提炼文本或文档，快速生成排版美观的PPT文件，大幅提升工作效率',quickCreate:'快速创建PPT',totalTasks:'累计生成任务数',styleCount:'可用风格配置数',recentTasks:'最近生成任务',styleTitle:'PPT风格配置',styleDescription:'管理和自定义各种PPT的排版风格及适用场景',newStyle:'新增风格',styleList:'风格列表',styleName:'风格名称',scenario:'适用场景',styleDetails:'风格详细描述',actions:'操作',taskTitle:'生成任务库',taskDescription:'上传您的文档或输入大纲，由AI智能体为您提取要点并生成高质量演示文稿',newTask:'创建生成任务',taskList:'生成任务列表',taskName:'任务标题',targetStyle:'目标风格',createdAt:'创建时间',cancel:'取消',save:'保存',edit:'编辑',delete:'删除',viewResult:'查看PPT结果',styleForm:'配置PPT风格',taskForm:'创建PPT任务',inputText:'输入文本',sourceFile:'源文档文件',requirements:'自定义要求',selectFile:'选择文件',selectOption:'请选择',empty:'暂无记录',loading:'加载中…',loadFailed:'加载失败',saveSuccess:'保存成功',deleteSuccess:'删除成功',saveFailed:'保存失败',deleteConfirm:'确定删除这条记录吗？',result:'生成的演示文稿',generating:'正在生成演示文稿',waiting:'AI 正在处理，请稍候…',timeout:'等待生成超时，请稍后从任务库查看结果。',noResult:'尚无生成结果',error:'发生错误',recordMissing:'无法定位记录，请刷新后重试',close:'关闭'},
      en:{appName:'AI PPT Generator',home:'Home',styles:'Styles',tasks:'Task Library',heroDescription:'Turn text or documents into polished presentations with AI in one step.',quickCreate:'Create a PPT',totalTasks:'Total generation tasks',styleCount:'Available styles',recentTasks:'Recent tasks',styleTitle:'PPT Styles',styleDescription:'Manage presentation styles and their ideal use cases.',newStyle:'Add Style',styleList:'Style List',styleName:'Style Name',scenario:'Use Case',styleDetails:'Style Description',actions:'Actions',taskTitle:'Task Library',taskDescription:'Upload a document or enter an outline, and let AI create a polished presentation.',newTask:'Create Task',taskList:'Generation Tasks',taskName:'Task Title',targetStyle:'Target Style',createdAt:'Created',cancel:'Cancel',save:'Save',edit:'Edit',delete:'Delete',viewResult:'View PPT Result',styleForm:'Configure PPT Style',taskForm:'Create PPT Task',inputText:'Input Text',sourceFile:'Source Document',requirements:'Custom Requirements',selectFile:'Choose File',selectOption:'Select',empty:'No records yet',loading:'Loading…',loadFailed:'Could not load data',saveSuccess:'Saved',deleteSuccess:'Deleted',saveFailed:'Save failed',deleteConfirm:'Delete this record?',result:'Generated Presentation',generating:'Generating presentation',waiting:'AI is processing your task…',timeout:'Generation timed out. Check the task library later.',noResult:'No result is available yet',error:'Error',recordMissing:'Could not locate this record. Refresh and try again.',close:'Close'}
    };
    let language = 'cn', activePage = 'home', formMode = null, formRow = 0, formType = '';
    let styles = [], tasks = [], availableStyleNames = [], pageHistory = [], pendingPoll = null, toastTimer = null;
    const byId = id => document.getElementById(id);
    const t = key => (WORDS[language] && WORDS[language][key]) || WORDS.cn[key] || key;
    function escapeHTML(value){return String(value == null ? '' : value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function localDateTime(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
    function csvRows(value){return parseCSV(String(value || '')).filter(row=>row.some(cell=>String(cell).trim()!==''));}
    function notify(message){const el=byId('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500);}
    function determineLanguage(){
      const stored=localStorage.getItem('iThinkAir_UiLanguage');
      if(stored!==null && stored!=='')return stored==='en'?'en':'cn';
      const urlLang=new URLSearchParams(location.search).get('lang');
      if(urlLang==='en'||urlLang==='cn')return urlLang;
      if(!navigator.languages || !navigator.languages.length)return 'cn';
      return navigator.languages.some(code=>/^zh(?:-|$)/i.test(code))?'cn':'en';
    }
    function applyLanguage(){
      document.documentElement.lang=language==='cn'?'zh-CN':'en';
      document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
      byId('languageButton').textContent=language==='cn'?'EN':'中文';
      byId('mobileLanguageButton').textContent=language==='cn'?'English':'中文';
      document.title=t('appName');
      renderStyles();renderTasks();renderRecent();updateNav();fitNavigation();
    }
    function toggleLanguage(){language=language==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',language);applyLanguage();closeMenu();}
    function fitNavigation(){
      const bar=byId('topbar'),inner=bar.querySelector('.top-inner');
      bar.classList.remove('compact');
      const needed=byId('brand').getBoundingClientRect().width+byId('topTabs').getBoundingClientRect().width+byId('languageButton').getBoundingClientRect().width+55;
      bar.classList.toggle('compact',needed>inner.clientWidth);
      if(!bar.classList.contains('compact'))closeMenu();
    }
    function closeMenu(){byId('mobileMenu').classList.remove('open');byId('menuButton').setAttribute('aria-expanded','false');}
    function updateNav(){document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===activePage));}
    function showPage(page,addHistory=true){
      if(!['home','styles','tasks'].includes(page))return;
      if(page!==activePage){if(addHistory)pageHistory.push({page:activePage,scroll:window.scrollY});activePage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));window.scrollTo(0,0);updateNav();}
      closeMenu();
    }
    function openLayer(id){byId(id).classList.add('open');document.body.style.overflow='hidden';}
    function closeLayer(id){byId(id).classList.remove('open');if(!document.querySelector('.modal-layer.open'))document.body.style.overflow='';}
    function airBack(){
      if(byId('resultLayer').classList.contains('open')){closeLayer('resultLayer');return 'false';}
      if(byId('formLayer').classList.contains('open')){closeLayer('formLayer');return 'false';}
      if(byId('mobileMenu').classList.contains('open')){closeMenu();return 'false';}
      if(pageHistory.length){const last=pageHistory.pop();showPage(last.page,false);requestAnimationFrame(()=>window.scrollTo(0,last.scroll));return 'false';}
      return 'true';
    }
    window.airBack=airBack;
    function bridgeError(error){notify(t('error')+': '+String(error));}
    async function loadCounts(){
      try{const values=await Promise.all([callAppBridge({type:'GetRecordCount',data:TASK_TABLE}),callAppBridge({type:'GetRecordCount',data:STYLE_TABLE})]);byId('taskCount').textContent=String(values[0]).trim();byId('styleCount').textContent=String(values[1]).trim();}catch(error){byId('taskCount').textContent='—';byId('styleCount').textContent='—';bridgeError(error);}
    }
    async function loadStyles(){
      byId('styleStatus').textContent=t('loading');
      try{styles=csvRows(await callAppBridge({type:'GetTableCSV',data:STYLE_TABLE,payload:STYLE_FIELDS.join(',')})).map((row,index)=>({row:index+1,name:row[0]||'',scenario:row[1]||'',details:row[2]||''}));availableStyleNames=styles.map(item=>item.name);renderStyles();byId('styleStatus').textContent='';}
      catch(error){byId('styleStatus').textContent=t('loadFailed')+': '+String(error);}
    }
    async function loadTasks(){
      byId('taskStatus').textContent=t('loading');
      try{tasks=csvRows(await callAppBridge({type:'GetTableCSV',data:TASK_TABLE,payload:TASK_FIELDS.join(',')})).map((row,index)=>({row:index+1,title:row[0]||'',style:row[1]||'',created:row[2]||''}));renderTasks();renderRecent();byId('taskStatus').textContent='';}
      catch(error){byId('taskStatus').textContent=t('loadFailed')+': '+String(error);}
    }
    function renderStyles(){
      const body=byId('styleTableBody');body.innerHTML='';
      if(!styles.length){body.innerHTML='<tr><td colspan="4" class="empty">'+escapeHTML(t('empty'))+'</td></tr>';return;}
      styles.forEach(item=>{
        const tr=document.createElement('tr');tr.dataset.row=String(item.row);
        tr.innerHTML='<td><strong>'+escapeHTML(item.name)+'</strong></td><td>'+escapeHTML(item.scenario)+'</td><td><span class="truncate">'+escapeHTML(item.details)+'</span></td><td><div class="row-actions"><button type="button" data-action="edit-style" data-row="'+item.row+'"><i class="fa-solid fa-pen"></i> '+escapeHTML(t('edit'))+'</button><button class="delete" type="button" data-action="delete-style" data-row="'+item.row+'"><i class="fa-solid fa-trash"></i> '+escapeHTML(t('delete'))+'</button></div></td>';body.appendChild(tr);
      });
    }
    function renderTasks(){
      const body=byId('taskTableBody');body.innerHTML='';
      if(!tasks.length){body.innerHTML='<tr><td colspan="4" class="empty">'+escapeHTML(t('empty'))+'</td></tr>';return;}
      tasks.forEach(item=>{
        const tr=document.createElement('tr');tr.dataset.row=String(item.row);
        tr.innerHTML='<td><strong>'+escapeHTML(item.title)+'</strong></td><td>'+escapeHTML(item.style)+'</td><td>'+escapeHTML(item.created)+'</td><td><div class="row-actions"><button type="button" data-action="view-result" data-row="'+item.row+'"><i class="fa-solid fa-eye"></i> '+escapeHTML(t('viewResult'))+'</button><button class="delete" type="button" data-action="delete-task" data-row="'+item.row+'"><i class="fa-solid fa-trash"></i> '+escapeHTML(t('delete'))+'</button></div></td>';body.appendChild(tr);
      });
    }
    function renderRecent(){
      const grid=byId('recentGrid');grid.innerHTML='';
      const recent=tasks.slice().sort((a,b)=>String(b.created).localeCompare(String(a.created))).slice(0,4);
      if(!recent.length){grid.innerHTML='<div class="empty">'+escapeHTML(t('empty'))+'</div>';return;}
      recent.forEach(item=>{const card=document.createElement('button');card.type='button';card.className='recent-card';card.dataset.row=String(item.row);card.innerHTML='<i class="fa-solid fa-file-powerpoint icon"></i><h3>'+escapeHTML(item.title)+'</h3><small>'+escapeHTML(item.style)+'</small><small>'+escapeHTML(item.created)+'</small>';grid.appendChild(card);});
    }
    function fieldId(name){return 'recordForm_'+(formType==='style'?'style_':'task_')+name;}
    function addField(container,name,kind){
      if(kind==='hidden'){const input=document.createElement('input');input.type='hidden';input.id=fieldId(name);input.name=name;input.value=localDateTime();container.appendChild(input);return;}
      const wrapper=document.createElement('div');wrapper.className='field';
      const label=document.createElement('label');label.htmlFor=fieldId(name);label.textContent=t({风格名称:'styleName',适用场景:'scenario',风格详细描述:'styleDetails',任务标题:'taskName',输入文本:'inputText',源文档文件:'sourceFile',目标风格:'targetStyle',自定义要求:'requirements'}[name]);
      wrapper.appendChild(label);let control;
      if(kind==='textarea'){control=document.createElement('textarea');control.rows=name==='输入文本'?6:4;}
      else if(kind==='select'||kind==='style'){control=document.createElement('select');const opt=document.createElement('option');opt.value='';opt.textContent=t('selectOption');control.appendChild(opt);const options=kind==='select'?['商务汇报','极简风','学术报告','创意设计','项目总结']:availableStyleNames;options.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;control.appendChild(option);});}
      else{control=document.createElement('input');control.type='text';}
      control.id=fieldId(name);control.name=name;if(name==='风格名称'||name==='任务标题')control.required=true;
      if(kind==='file'){control.readOnly=true;const pick=document.createElement('div');pick.className='file-pick';pick.appendChild(control);const button=document.createElement('button');button.type='button';button.className='secondary';button.textContent=t('selectFile');button.addEventListener('click',async()=>{try{const file=await callAppBridge({type:'SelectFile'});if(file)control.value=String(file);}catch(error){bridgeError(error);}});pick.appendChild(button);wrapper.appendChild(pick);}
      else wrapper.appendChild(control);
      container.appendChild(wrapper);
    }
    async function openForm(type,row=0){
      if(type==='task' && pendingPoll){notify(t('waiting'));return;}
      formType=type;formRow=row;formMode=row?'edit':'new';
      const form=byId('recordForm');form.reset();const fields=byId('formFields');fields.innerHTML='';
      byId('formTitle').textContent=t(type==='style'?'styleForm':'taskForm');
      if(type==='task'){try{const rows=csvRows(await callAppBridge({type:'GetTableCSV',data:STYLE_TABLE,payload:'风格名称'}));availableStyleNames=rows.map(item=>item[0]||'');}catch(error){bridgeError(error);}}
      FORM_FIELDS[type].forEach(def=>addField(fields,def[0],def[1]));
      if(row){
        const table=type==='style'?STYLE_TABLE:TASK_TABLE;
        const names=FORM_FIELDS[type].map(def=>def[0]);
        try{for(const name of names){const value=await callAppBridge({type:'GetCellValue',data:table,payload:name+'/'+row});byId(fieldId(name)).value=String(value==null?'':value);}}
        catch(error){bridgeError(error);return;}
      }
      openLayer('formLayer');setTimeout(()=>{const first=fields.querySelector('input:not([type=hidden]),textarea,select');if(first)first.focus({preventScroll:true});},50);
    }
    async function submitForm(event){
      event.preventDefault();const button=byId('saveButton');if(button.disabled || (formType==='task' && pendingPoll))return;button.disabled=true;
      const table=formType==='style'?STYLE_TABLE:TASK_TABLE;
      const data={};FORM_FIELDS[formType].forEach(def=>{data[def[0]]=byId(fieldId(def[0])).value;});
      try{
        if(formMode==='new'){await callAppBridge({type:'SubmitRecord',data:table,payload:JSON.stringify(data)});}
        else{for(const name of Object.keys(data)){await callAppBridge({type:'SetCellValue',data:table,payload:name+'/'+formRow+'/'+data[name]});}}
        closeLayer('formLayer');notify(t('saveSuccess'));
        if(formType==='style'){await Promise.all([loadStyles(),loadCounts()]);}
        else{await Promise.all([loadTasks(),loadCounts()]);if(formMode==='new')startPoll(1);}
      }catch(error){notify(t('saveFailed')+': '+String(error));}
      finally{button.disabled=false;}
    }
    async function deleteRow(type,row){
      if(type==='task' && pendingPoll){notify(t('waiting'));return;}
      if(!window.confirm(t('deleteConfirm')))return;
      const table=type==='style'?STYLE_TABLE:TASK_TABLE;
      try{await callAppBridge({type:'DeleteRecord',data:table,payload:row.toString()});notify(t('deleteSuccess'));if(type==='style')await loadStyles();else await loadTasks();await loadCounts();}
      catch(error){notify(t('error')+': '+String(error));}
    }
    function downloadUrl(filename){return 'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(filename);}
    function decorateMarkdown(markdown){
      let html;
      if(window.marked && window.DOMPurify){html=DOMPurify.sanitize(marked.parse(String(markdown||''),{gfm:true,breaks:true}));}
      else{html='<pre>'+escapeHTML(markdown)+'</pre>';}
      const wrap=document.createElement('div');wrap.innerHTML=html;
      wrap.querySelectorAll('a').forEach(link=>{
        const href=link.getAttribute('href')||'';
        if(!href || href.startsWith('#'))return;
        if(!/^(https?:|data:|\/)/i.test(href))link.href=downloadUrl(href);
        if(link.href.startsWith('http://' + window.location.hostname + ':3130/download/'))link.setAttribute('download','');
        link.target='_blank';link.rel='noopener noreferrer';
      });
      wrap.querySelectorAll('img').forEach(img=>{
        const source=img.getAttribute('src')||'';
        if(source && !/^(https?:|data:|\/)/i.test(source))img.src=downloadUrl(source);
        const anchor=document.createElement('a');anchor.href=img.src;anchor.download='';anchor.target='_blank';anchor.rel='noopener noreferrer';img.parentNode.insertBefore(anchor,img);anchor.appendChild(img);
      });
      return wrap.innerHTML;
    }
    function showResult(content,title){
      byId('resultTitle').textContent=title||t('result');
      byId('resultContent').innerHTML=decorateMarkdown(content||t('noResult'));
      openLayer('resultLayer');
    }
    async function viewResult(row){
      try{const content=await callAppBridge({type:'GetCellValue',data:TASK_TABLE,payload:'生成的演示文稿/'+row});const item=tasks.find(task=>task.row===row);showResult(content,item?item.title:t('result'));}
      catch(error){bridgeError(error);}
    }
    async function startPoll(row){
      if(pendingPoll)return;
      const poll={start:Date.now(),row:row,timer:null};pendingPoll=poll;
      byId('resultTitle').textContent=t('generating');
      byId('resultContent').innerHTML='<div class="result-loading"><i class="fa-solid fa-spinner fa-spin"></i><h3>'+escapeHTML(t('generating'))+'</h3><p>'+escapeHTML(t('waiting'))+'</p></div>';
      openLayer('resultLayer');
      async function tick(){
        if(pendingPoll!==poll)return;
        if(Date.now()-poll.start>=1800000){pendingPoll=null;byId('resultContent').textContent=t('timeout');return;}
        try{
          const result=String(await callAppBridge({type:'轮询',data:'演示文稿生成任务',payload:'生成的演示文稿'})||'');
          if(result.trim()){pendingPoll=null;showResult(result,t('result'));await loadTasks();return;}
        }catch(error){byId('resultContent').textContent=t('error')+': '+String(error);}
        poll.timer=setTimeout(tick,1000);
      }
      tick();
    }
    function wireEvents(){
      byId('brand').addEventListener('click',()=>{try{parent.closeFullHtml(false);}catch(error){bridgeError(error);}});
      document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));
      byId('menuButton').addEventListener('click',event=>{event.stopPropagation();const menu=byId('mobileMenu');menu.classList.toggle('open');byId('menuButton').setAttribute('aria-expanded',String(menu.classList.contains('open')));});
      document.addEventListener('click',event=>{if(!byId('topbar').contains(event.target))closeMenu();});
      byId('languageButton').addEventListener('click',toggleLanguage);byId('mobileLanguageButton').addEventListener('click',toggleLanguage);
      byId('quickCreateButton').addEventListener('click',()=>{showPage('tasks');openForm('task');});
      byId('newStyleButton').addEventListener('click',()=>openForm('style'));
      byId('newTaskButton').addEventListener('click',()=>openForm('task'));
      byId('recordForm').addEventListener('submit',submitForm);
      document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>closeLayer(button.dataset.close)));
      document.querySelectorAll('.modal-layer').forEach(layer=>layer.addEventListener('click',event=>{if(event.target===layer)closeLayer(layer.id);}));
      document.addEventListener('keydown',event=>{if(event.key==='Escape')airBack();});
      byId('styleTableBody').addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);if(action.dataset.action==='edit-style')openForm('style',row);else deleteRow('style',row);return;}const tr=event.target.closest('tr[data-row]');if(tr)tr.classList.toggle('selected');});
      byId('taskTableBody').addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);if(action.dataset.action==='view-result')viewResult(row);else deleteRow('task',row);return;}const tr=event.target.closest('tr[data-row]');if(tr)tr.classList.toggle('selected');});
      byId('recentGrid').addEventListener('click',event=>{const card=event.target.closest('[data-row]');if(card){showPage('tasks');const row=Number(card.dataset.row);const tr=byId('taskTableBody').querySelector('tr[data-row="'+row+'"]');if(tr)tr.classList.add('selected');viewResult(row);}});
      window.addEventListener('resize',fitNavigation);
      if(window.ResizeObserver)new ResizeObserver(fitNavigation).observe(document.querySelector('.top-inner'));
      document.addEventListener('focusin',event=>{if(!event.target.matches('input,textarea,select'))return;setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),300);});
      if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const focused=document.activeElement;if(focused&&focused.matches('input,textarea,select'))setTimeout(()=>focused.scrollIntoView({block:'center',behavior:'smooth'}),120);});
    }
    async function initialize(){
      language=determineLanguage();wireEvents();applyLanguage();
      try{const mode=String(await callAppBridge({type:'模式'})).trim();document.documentElement.dataset.theme=mode==='暗色'?'dark':'light';}
      catch(error){document.documentElement.dataset.theme='light';}
      await Promise.all([loadCounts(),loadStyles(),loadTasks()]);
    }
    (async () => { await initialize(); })();
  </script>
</body>
