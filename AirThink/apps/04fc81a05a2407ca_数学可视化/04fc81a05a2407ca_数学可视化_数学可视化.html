<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {

async function exportFileA(title, url) {

    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**

const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

        function parseCSV(csvText) {

                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);

                        i++;

const COLORS=['#75aaff','#b99aff','#67e3ef','#ffab65','#71d6a0','#ff8eaa','#ffcf72'];
const ICONS=['fa-draw-polygon','fa-cube','fa-chart-line','fa-person-walking-arrow-right','fa-ruler-combined','fa-square-root-variable','fa-arrow-trend-up'];
const EN_TYPES=['Plane geometry','Solid geometry','Functions','Moving points','Analytic geometry','Equations','Vectors'];
const I18N={cn:{brand:'看见数学',home:'首页',create:'创建可视化',workshop:'可视化工坊',hero:'看见<span>数学</span>',heroSub:'把题目变成可拖拽、可调节的交互世界，让几何动起来、让函数会呼吸',heroCta:'把这道题变成可视化',total:'题目总数',generated:'已生成可视化数',types:'题型覆盖数',distribution:'题型分布',recent:'最近可视化',createDesc:'写下题目、选好类型，可选配题目图片，后台将生成可交互的 HTML 数学世界',goWorkshop:'前往工坊',questionForm:'可视化题目',question:'题目',questionType:'题目类型',questionImage:'题目图片',selectImage:'从相册选择',capture:'拍摄题目',generate:'生成交互可视化',stage:'可视化舞台',fullscreen:'全屏',newWindow:'新窗口打开',stageEmpty:'提交后，这里将上演你的数学',another:'再做一题',viewWorkshop:'在工坊中查看',workshopDesc:'浏览、预览和管理所有已生成的数学可视化',newVisual:'新建可视化',search:'搜索题目全文',detail:'可视化详情',editTitle:'编辑可视化题目',save:'保存修改',confirmDelete:'删除这道题？',deleteWarn:'删除后无法恢复。',delete:'删除',cancel:'取消',loadMore:'查看更多',all:'全部',open:'打开可视化',edit:'编辑',empty:'暂无题目',waiting:'正在把题目绘制成可拖拽的数学世界，请稍候…',pending:'可视化正在生成或尚未生成',backCreate:'前往创建页',remove:'清除图片',error:'操作失败',timeout:'生成超时，请稍后到工坊查看',success:'已保存',noFile:'尚无可视化文件'},en:{brand:'See Mathematics',home:'Home',create:'Create visual',workshop:'Visual workshop',hero:'See <span>Mathematics</span>',heroSub:'Turn problems into draggable, adjustable worlds. Make geometry move and functions breathe.',heroCta:'Visualize a problem',total:'Total problems',generated:'Visuals generated',types:'Types covered',distribution:'Problem types',recent:'Recent visuals',createDesc:'Enter a problem, choose its type, and optionally add a picture. An interactive HTML world will be generated.',goWorkshop:'Go to workshop',questionForm:'Visual problem',question:'Problem',questionType:'Problem type',questionImage:'Problem image',selectImage:'Choose image',capture:'Take photo',generate:'Generate interactive visual',stage:'Visual stage',fullscreen:'Fullscreen',newWindow:'Open in new window',stageEmpty:'Submit a problem to see mathematics come alive',another:'Create another',viewWorkshop:'View in workshop',workshopDesc:'Browse, preview, and manage generated mathematical visuals',newVisual:'New visual',search:'Search full problem text',detail:'Visual details',editTitle:'Edit visual problem',save:'Save changes',confirmDelete:'Delete this problem?',deleteWarn:'This cannot be undone.',delete:'Delete',cancel:'Cancel',loadMore:'Show more',all:'All',open:'Open visual',edit:'Edit',empty:'No problems yet',waiting:'Drawing your problem into a draggable mathematical world…',pending:'Visual generation is in progress or has not started',backCreate:'Go to create page',remove:'Remove image',error:'Operation failed',timeout:'Generation timed out. Check the workshop later.',success:'Saved',noFile:'No visual file yet'}};
let lang='cn',page='home',rows=[],currentRow=0,editRow=0,deleteRow=0,submitting=false,visibleCount=12,pollToken=0,toastTimer=0,historyStack=[];
const $=id=>document.getElementById(id),t=key=>I18N[lang][key]||key;
function getLanguage(){const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)return stored==='en'?'en':'cn';const url=new URLSearchParams(location.search).get('lang');if(url==='cn'||url==='en')return url;const list=navigator.languages;if(!list||!list.length)return'cn';return list.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function setLanguage(next){lang=next;document.documentElement.lang=lang==='cn'?'zh-CN':'en';localStorage.setItem('iThinkAir_UiLanguage',lang);document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));$('langButton').textContent=lang==='cn'?'EN':'中文';$('mobileLang').textContent=lang==='cn'?'English':'中文';renderChoices('createForm');renderChoices('editForm');renderFilter();renderAll()}
function badge(type){const i=TYPES.indexOf(type);const b=document.createElement('span');b.className='badge';b.style.setProperty('--tag',COLORS[i]||'#aab7d6');b.textContent=i<0?type:(lang==='cn'?type:EN_TYPES[i]);return b}
function asset(name,kind='download'){return 'https://www.ithinkair.com:3031/'+kind+'/'+encodeURIComponent(name)}
function toast(message){const e=$('toast');e.textContent=message;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),4000)}
function error(e){toast(t('error')+': '+String(e?.message||e))}
function setPage(next,remember=true){if(next===page)return;if(remember)historyStack.push({page,scroll:scrollY});page=next;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id===next+'Page'));document.querySelectorAll('.navlinks [data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===next));closeMenu();scrollTo(0,0);if(next==='home'||next==='workshop')refresh().catch(error)}
function closeMenu(){$('mobileMenu').classList.remove('open');$('hamburger').setAttribute('aria-expanded','false')}
function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden'}
function closeModal(id){$(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.style.overflow=''}
function airBack(){const open=[...document.querySelectorAll('.overlay.open')].pop();if(open){closeModal(open.id);return'false'}if(historyStack.length){const h=historyStack.pop();setPage(h.page,false);requestAnimationFrame(()=>scrollTo(0,h.scroll));return'false'}return'true'}window.airBack=airBack;
function countTypes(){const counts=Object.fromEntries(TYPES.map(x=>[x,0]));for(const r of rows)if(r.type in counts)counts[r.type]++;return counts}
function card(r,compact=false){const el=document.createElement('article');el.className='glass hover item';const thumb=document.createElement('div');thumb.className='thumb';if(r.image){const im=document.createElement('img');im.src=asset(r.image);im.alt='';im.loading='lazy';thumb.append(im)}else{const i=document.createElement('i');i.className='fa-solid '+(ICONS[TYPES.indexOf(r.type)]||'fa-draw-polygon');thumb.append(i)}el.append(thumb);const body=document.createElement('div');body.className='item-body';body.append(badge(r.type));const title=document.createElement('div');title.className='item-title';title.textContent=r.question.length>(compact?60:80)?r.question.slice(0,compact?60:80)+'…':r.question;body.append(title);const actions=document.createElement('div');actions.className='item-actions';const open=document.createElement('button');open.type='button';open.className='btn small outline';open.textContent=t('open');open.addEventListener('click',e=>{e.stopPropagation();showDetail(r.row)});actions.append(open);if(!compact){const edit=document.createElement('button');edit.type='button';edit.className='btn small';edit.textContent=t('edit');edit.addEventListener('click',e=>{e.stopPropagation();showEdit(r.row)});const del=document.createElement('button');del.type='button';del.className='btn small danger';del.textContent=t('delete');del.addEventListener('click',e=>{e.stopPropagation();deleteRow=r.row;openModal('confirmOverlay')});actions.append(edit,del)}body.append(actions);el.append(body);el.addEventListener('click',()=>compact?showDetail(r.row):showEdit(r.row));return el}
function renderHome(){const d=$('typeDistribution');d.replaceChildren();const counts=countTypes();for(const x of TYPES){const b=badge(x);b.append(' · '+counts[x]);d.append(b)}$('typeCount').textContent=Object.values(counts).filter(x=>x>0).length;const recent=$('recentList');recent.replaceChildren();const list=rows.slice(0,5);if(!list.length)recent.textContent=t('empty');else for(const r of list)recent.append(card(r,true))}
function renderWorkshop(){const query=$('searchInput').value.trim().toLocaleLowerCase();const type=$('typeFilter').value;const filtered=rows.filter(r=>r.question.toLocaleLowerCase().includes(query)&&(!type||r.type===type));const list=$('workshopList');list.replaceChildren();if(!filtered.length)list.innerHTML='<div class="empty">'+t('empty')+'</div>';else for(const r of filtered.slice(0,visibleCount))list.append(card(r));$('loadMoreWrap').hidden=filtered.length<=visibleCount}
function renderAll(){renderHome();renderWorkshop()}
function renderFilter(){const el=$('typeFilter'),v=el.value;el.replaceChildren();for(const x of ['',...TYPES]){const o=document.createElement('option');o.value=x;o.textContent=x?(lang==='cn'?x:EN_TYPES[TYPES.indexOf(x)]):t('all');el.append(o)}el.value=v}
function renderChoices(prefix){const host=$(prefix+'_typeChoices'),input=$(prefix+'_type');host.replaceChildren();for(const x of TYPES){const b=document.createElement('button');b.type='button';b.className='choice'+(input.value===x?' selected':'');b.textContent=lang==='cn'?x:EN_TYPES[TYPES.indexOf(x)];b.addEventListener('click',()=>{input.value=x;renderChoices(prefix);updateSubmit()});host.append(b)}}
function imagePreview(prefix){const val=$(prefix+'_image').value,host=$(prefix==='createForm'?'createPreview':'editPreview');host.replaceChildren();if(!val)return;const box=document.createElement('div');box.className='image-preview';const im=document.createElement('img');im.src=asset(val);im.alt=t('questionImage');const clear=document.createElement('button');clear.type='button';clear.className='btn small';clear.textContent=t('remove');clear.addEventListener('click',()=>{$(prefix+'_image').value='';imagePreview(prefix)});box.append(im,clear);host.append(box)}
async function chooseImage(prefix,mode){try{const name=await callAppBridge({type:mode});if(name){$(prefix+'_image').value=name;imagePreview(prefix)}}catch(e){error(e)}}
function updateSubmit(){$('createSubmit').disabled=submitting||!$('createForm_question').value.trim()||!$('createForm_type').value}
function markdown(el,value){const html=window.marked?marked.parse(value||''):String(value||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('\n','<br>');el.innerHTML=window.DOMPurify?DOMPurify.sanitize(html):html;el.querySelectorAll('img').forEach(im=>{im.title='Download';im.addEventListener('click',()=>{const a=document.createElement('a');a.href=im.src;a.download='';a.click()})})}
function noteFile(el,value){el.replaceChildren();if(!value)return;const label=document.createElement('span');label.textContent=(lang==='cn'?'可视化文件':'Visual file')+' · ';el.append(label);const code=document.createElement('code');code.textContent=value;el.append(code)}
function isHtmlFilename(value){return /\.html?(?:$|[?#])/i.test(value.trim())||/^[a-f0-9]{8}-[a-f0-9-]{20,}(?:\.html?)?$/i.test(value.trim())}
function stageFile(host,value){host.replaceChildren();if(!value){const div=document.createElement('div');div.className='stage-placeholder';div.textContent=t('pending');host.append(div);return}if(isHtmlFilename(value)){const frame=document.createElement('iframe');frame.src=asset(value,'private');frame.title=t('stage');frame.allowFullscreen=true;host.append(frame)}else{const div=document.createElement('div');div.className='markdown-body';div.style.padding='22px';markdown(div,value);host.append(div)}}
async function getCell(field,row){return await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row})}
async function showDetail(row){currentRow=row;openModal('detailOverlay');$('detailQuestion').textContent='…';$('detailStage').textContent='…';try{const question=await getCell('题目',row);const type=await getCell('题目类型',row);const image=await getCell('题目图片',row);const file=await getCell('可视化文件',row);$('detailType').replaceChildren(badge(type));markdown($('detailQuestion'),question);const box=$('detailImage');box.replaceChildren();if(image){const im=document.createElement('img');im.src=asset(image);im.alt=t('questionImage');box.append(im)}stageFile($('detailStage'),file);noteFile($('detailFileNote'),file);if(!file){const b=document.createElement('button');b.className='btn outline';b.textContent=t('backCreate');b.addEventListener('click',()=>{closeModal('detailOverlay');setPage('create')});$('detailStage').append(b)}}catch(e){error(e)}}
async function showEdit(row){editRow=row;currentRow=row;openModal('editOverlay');$('editSubmit').disabled=true;try{$('editForm_question').value=await getCell('题目',row);$('editForm_type').value=await getCell('题目类型',row);$('editForm_image').value=await getCell('题目图片',row);renderChoices('editForm');imagePreview('editForm')}catch(e){error(e)}finally{$('editSubmit').disabled=false}}
async function saveEdit(e){e.preventDefault();if(!$('editForm_question').value.trim()||!$('editForm_type').value)return;const b=$('editSubmit');b.disabled=true;try{const fields=[['题目',$('editForm_question').value.trim()],['题目类型',$('editForm_type').value],['题目图片',$('editForm_image').value]];for(const [name,value] of fields)await callAppBridge({type:'SetCellValue',data:TABLE,payload:name+'/'+editRow+'/'+value});closeModal('editOverlay');toast(t('success'));await refresh()}catch(err){error(err)}finally{b.disabled=false}}
async function removeRecord(){const b=$('confirmDeleteButton');b.disabled=true;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:deleteRow.toString()});closeModal('confirmOverlay');await refresh()}catch(e){error(e)}finally{b.disabled=false}}
async function refresh(){const csv=await callAppBridge({type:'GetTableCSV',data:TABLE,payload:'题目,题目类型,题目图片'});rows=parseCSV(csv||'').filter(r=>r.length>=3).map((r,i)=>({row:i+1,question:r[0]||'',type:r[1]||'',image:r[2]||''}));renderAll();const n=await callAppBridge({type:'GetRecordCount',data:TABLE});$('totalCount').textContent=n||'0';let generated=0;for(const r of rows){const v=await getCell('可视化文件',r.row);if(v&&v.trim())generated++}$('generatedCount').textContent=generated}
async function pollGenerated(){const token=++pollToken,start=Date.now();$('createStage').classList.add('waiting');$('createStage').textContent=t('waiting');$('createStatus').textContent=t('waiting');while(token===pollToken&&Date.now()-start<1800000){try{const value=await getCell('可视化文件',currentRow);if(value&&value.trim()){stageFile($('createStage'),value);$('createStage').classList.remove('waiting');noteFile($('createFileNote'),value);$('createStatus').textContent='';$('afterCreate').hidden=false;const html=isHtmlFilename(value);$('stageFullscreen').hidden=!html;$('stageNewWindow').hidden=!html;$('stageNewWindow').onclick=()=>window.open(asset(value,'private'),'_blank','noopener');$('stageFullscreen').onclick=()=>{const f=$('createStage').querySelector('iframe');if(f)f.requestFullscreen?.()};submitting=false;updateSubmit();refresh().catch(error);return}}catch(e){error(e);break}await new Promise(resolve=>setTimeout(resolve,1000))}if(token===pollToken){$('createStatus').textContent=t('timeout');$('createStage').classList.remove('waiting');submitting=false;updateSubmit()}}
async function submitCreate(e){e.preventDefault();if(submitting||!$('createForm_question').value.trim()||!$('createForm_type').value)return;submitting=true;updateSubmit();$('createStatus').textContent=t('waiting');try{const data={'题目':$('createForm_question').value.trim(),'题目类型':$('createForm_type').value,'题目图片':$('createForm_image').value};await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});currentRow=1;pollGenerated()}catch(err){submitting=false;updateSubmit();$('createStatus').textContent='';error(err)}}
function resetCreate(){pollToken++;currentRow=0;submitting=false;$('createForm').reset();$('createForm_type').value='';$('createForm_image').value='';renderChoices('createForm');imagePreview('createForm');$('createStage').classList.remove('waiting');$('createStage').innerHTML='<div class="stage-placeholder"><i class="fa-solid fa-draw-polygon"></i><span>'+t('stageEmpty')+'</span></div>';$('createFileNote').replaceChildren();$('createStatus').textContent='';$('afterCreate').hidden=true;$('stageFullscreen').hidden=true;$('stageNewWindow').hidden=true;updateSubmit()}
function mobileInputCare(){document.addEventListener('focusin',e=>{if(!e.target.matches('input,textarea,select'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const e=document.activeElement;if(e?.matches?.('input,textarea,select'))setTimeout(()=>e.scrollIntoView({block:'center',behavior:'smooth'}),100)})}
async function initialize(){try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.mode=String(mode).trim()==='亮色'?'light':'dark'}catch(_){document.documentElement.dataset.mode='dark'}lang=getLanguage();setLanguage(lang);$('brand').addEventListener('click',()=>{try{parent.closeFullHtml(false)}catch(_){}});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('langButton').addEventListener('click',()=>setLanguage(lang==='cn'?'en':'cn'));$('mobileLang').addEventListener('click',()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu()});$('hamburger').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('hamburger').setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});$('createForm_question').addEventListener('input',updateSubmit);$('createForm').addEventListener('submit',submitCreate);$('editForm').addEventListener('submit',saveEdit);$('createSelect').addEventListener('click',()=>chooseImage('createForm','SelectImage'));$('createCapture').addEventListener('click',()=>chooseImage('createForm','CapturePhoto'));$('editSelect').addEventListener('click',()=>chooseImage('editForm','SelectImage'));$('editCapture').addEventListener('click',()=>chooseImage('editForm','CapturePhoto'));$('createAgain').addEventListener('click',resetCreate);$('searchInput').addEventListener('input',()=>{visibleCount=12;renderWorkshop()});$('typeFilter').addEventListener('change',()=>{visibleCount=12;renderWorkshop()});$('loadMore').addEventListener('click',()=>{visibleCount+=12;renderWorkshop()});$('confirmDeleteButton').addEventListener('click',removeRecord);mobileInputCare();try{await refresh()}catch(e){error(e)}}
document.addEventListener('DOMContentLoaded', () => { (async () => { await initialize(); })(); });
</script>
</body>
