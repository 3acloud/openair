<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("6a3c27bfc4e89115_中考真题检索")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function rows(text){return parseCSV(String(text||''))}
function filenameUrl(name,kind){return 'https://www.ithinkair.com:3031/'+kind+'/'+encodeURIComponent(String(name)).replace(/%2F/gi,'/')}
function isHtml(name){return /\.html?(?:$|[?#])/i.test(name)}
function setLanguage(lang){language=lang==='en'?'en':'cn';document.documentElement.lang=language==='en'?'en':'zh-CN';localStorage.setItem('iThinkAir_UiLanguage',language);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('langButton').textContent=language==='cn'?'EN':'中文';$('mobileLang').textContent=language==='cn'?'English':'中文';$('searchForm_city').placeholder=language==='cn'?'例如：北京市、杭州市、成都市':'e.g. Beijing, Hangzhou';$('searchForm_year').placeholder=language==='cn'?'例如：2024':'e.g. 2024';$('recordQuery').placeholder=t('query');fillSelects();renderRecent();renderRecords();if(currentRow>0)renderCurrentRecord();updateSubmit();fitNavigation()}
function fillSelects(){const subject=$('searchForm_subject').value,version=$('searchForm_version').value,filterS=$('filterSubject').value,filterY=$('filterYear').value,filterV=$('filterVersion').value;const option=(v,label)=>`<option value="${safe(v)}">${safe(label)}</option>`;$('searchForm_subject').innerHTML=option('',t('allSubjects'))+SUBJECTS.map(s=>option(s,subjectName(s))).join('');$('searchForm_version').innerHTML=option('',t('allVersions'))+['含答案','原卷版'].map(s=>option(s,versionName(s))).join('');$('filterSubject').innerHTML=option('',t('allSubjects'))+SUBJECTS.map(s=>option(s,subjectName(s))).join('');$('filterYear').innerHTML=option('',t('allYears'))+[...new Set(records.map(r=>r.year).filter(Boolean))].sort((a,b)=>Number(b)-Number(a)).map(y=>option(y,y)).join('');$('filterVersion').innerHTML=option('',t('allVersions'))+['含答案','原卷版'].map(s=>option(s,versionName(s))).join('');$('searchForm_subject').value=subject;$('searchForm_version').value=version;$('filterSubject').value=filterS;$('filterYear').value=filterY;$('filterVersion').value=filterV}
function fitNavigation(){const nav=$('topbar').querySelector('.nav-inner'),links=$('navLinks'),lang=$('langButton'),hamb=$('hamburger');links.style.display='flex';lang.style.display='block';hamb.style.display='none';const over=nav.scrollWidth>nav.clientWidth+1;if(over){links.style.display='none';lang.style.display='none';hamb.style.display='block'}else closeMenu()}
function closeMenu(){$('mobileMenu').classList.remove('open');$('hamburger').setAttribute('aria-expanded','false')}
function showPage(next,remember=true){if(next===page){closeMenu();return}if(remember)historyStack.push({page,scroll:window.scrollY});document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+next));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===next));page=next;closeMenu();window.scrollTo(0,0);if(next==='home')refreshHome();if(next==='records')refreshRecords()}
function airBack(){if(modalOpen){closeModal();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const prev=historyStack.pop();showPage(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.scroll));return 'false'}return 'true'}window.airBack=airBack;
function cardHTML(r,actions=false){const color=COLORS[r.subject]||'#ae4b42';return `<article class="paper-card" style="--subject:${color}" data-row="${r.row}" ${actions?'tabindex="0" role="button"':''}><span class="subject-bar"></span><div class="card-top"><span class="subject">${safe(subjectName(r.subject))}</span><span class="year">${safe(r.year)}</span></div><div class="city">${safe(r.city)}</div><div class="badges"><span class="badge">${safe(versionName(r.version))}</span>${r.file?`<span class="badge ready">${safe(t('ready'))}</span>`:''}</div>${actions?`<div class="actions"><button class="btn small" data-action="detail" type="button">${safe(t('detail'))}</button><button class="btn small" data-action="download" type="button">${safe(t('download'))}</button><button class="btn small" data-action="edit" type="button">${safe(t('edit'))}</button><button class="btn small" data-action="delete" type="button">${safe(t('delete'))}</button></div>`:''}</article>`}
function renderRecent(){$('recentList').innerHTML=records.length?records.slice(0,5).map(r=>cardHTML(r)).join(''):`<div class="empty">${safe(t('empty'))}</div>`}
function renderRecords(){const q=$('recordQuery').value.trim().toLocaleLowerCase(),s=$('filterSubject').value,y=$('filterYear').value,v=$('filterVersion').value;const list=records.filter(r=>(!q||(r.city+' '+r.subject+' '+subjectName(r.subject)).toLocaleLowerCase().includes(q))&&(!s||r.subject===s)&&(!y||r.year===y)&&(!v||r.version===v));$('recordsList').innerHTML=list.length?list.map(r=>cardHTML(r,true)).join(''):`<div class="empty">${safe(records.length?t('noMatch'):t('empty'))}</div>`}
async function loadRecords(){const csv=await bridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')});records=rows(csv).filter(r=>r.length>=2).map((r,i)=>({row:i+1,city:r[0]||'',subject:r[1]||'',year:r[2]||'',version:r[3]||'',file:r[4]||''}));fillSelects();renderRecent();renderRecords()}
async function refreshHome(){try{const [count,answerCsv,subjectCsv,recentCsv]=await Promise.all([bridge({type:'GetRecordCount',data:SOURCE}),bridge({type:'GetTableCSV',data:SOURCE,payload:'是否含答案'}),bridge({type:'GetTableCSV',data:SOURCE,payload:'科目'}),bridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')})]);recordCount=Number(count)||0;$('totalCount').textContent=recordCount;$('answerCount').textContent=rows(answerCsv).filter(r=>r[0]==='含答案').length;$('subjectCount').textContent=new Set(rows(subjectCsv).map(r=>r[0]).filter(Boolean)).size;records=rows(recentCsv).filter(r=>r.length>=2).map((r,i)=>({row:i+1,city:r[0]||'',subject:r[1]||'',year:r[2]||'',version:r[3]||'',file:r[4]||''}));renderRecent();fillSelects()}catch(e){$('recentList').innerHTML=`<div class="empty">${safe(t('error'))}: ${safe(e.message||e)}</div>`}}
async function refreshRecords(){try{await loadRecords();recordCount=Number(await bridge({type:'GetRecordCount',data:SOURCE}))||records.length}catch(e){$('recordsList').innerHTML=`<div class="empty">${safe(t('error'))}: ${safe(e.message||e)}</div>`}}
function formValues(){return {'省份城市':$('searchForm_city').value.trim(),'科目':$('searchForm_subject').value,'年份':$('searchForm_year').value.trim(),'是否含答案':$('searchForm_version').value}}
function validValues(v){return v['省份城市']&&v['科目']&&v['年份']&&v['是否含答案']&&Number.isInteger(Number(v['年份']))&&Number(v['年份'])>=1900&&Number(v['年份'])<=2100}
function updateSubmit(){const valid=!!validValues(formValues());$('submitSearch').disabled=!valid||polling;$('submitSearch').textContent=editMode?t('save'):t('submit');$('formHint').textContent=editMode?'':t('formHint')}
function clearSearch(){pollToken++;polling=false;editMode=false;currentRow=0;$('searchForm').reset();$('resultSection').classList.add('hidden');$('resultContent').innerHTML='';$('editFileArea').classList.add('hidden');$('editFileArea').innerHTML='';updatePager();updateSubmit()}
function statusHTML(message,error=false){return `<div class="status ${error?'error':''}">${error?'':`<span class="loading"><i class="fa-solid fa-spinner"></i></span> `}${safe(message)}</div>`}
function updatePager(){$('recordPosition').textContent=currentRow?t('record').replace('{row}',currentRow).replace('{total}',recordCount):'';$('previousRecord').disabled=polling||currentRow<=1;$('nextRecord').disabled=polling||currentRow>=recordCount}
async function getDetails(row){const values={row};for(const field of FIELDS){values[field]=await bridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row})}return {row,city:values['省份城市']||'',subject:values['科目']||'',year:values['年份']||'',version:values['是否含答案']||'',file:values['真题文件']||''}}
function populateForm(r){$('searchForm_city').value=r.city;$('searchForm_subject').value=r.subject;$('searchForm_year').value=r.year;$('searchForm_version').value=r.version;updateSubmit()}
async function readPaper(name){if(!name)return '';return await bridge({type:'ReadFile',data:name})}
function markdownHTML(text){if(!window.marked||!window.DOMPurify)return `<p>${safe(t('missingLibrary'))}</p>`;const renderer=new marked.Renderer();renderer.image=function(token){const href=typeof token==='object'?token.href:token,alt=typeof token==='object'?token.text:'';let src=String(href||'');if(!/^(https?:|data:|blob:)/i.test(src))src=filenameUrl(src,'download');const clean=DOMPurify.sanitize(src,{ALLOWED_TAGS:[],ALLOWED_ATTR:[]});return `<a href="${safe(clean)}" download target="_blank" rel="noopener"><img src="${safe(clean)}" alt="${safe(alt)}"></a>`};const html=marked.parse(String(text||''),{gfm:true,breaks:true,renderer});return DOMPurify.sanitize(html,{ADD_ATTR:['download','target','rel']})}
function fileButtons(name){if(!name)return '';return `<div class="file-actions"><a class="btn primary" href="${safe(filenameUrl(name,'download'))}" download target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> ${safe(t('download'))}</a><a class="btn ink" href="${safe(filenameUrl(name,'private'))}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${safe(t('open'))}</a></div>`}
async function contentHTML(name){if(!name)return `<div class="status">${safe(t('noFile'))}</div>`;if(isHtml(name))return `<iframe class="html-frame" title="${safe(t('fileContent'))}" src="${safe(filenameUrl(name,'private'))}" loading="lazy"></iframe>`;try{const content=await readPaper(name);return `<div class="markdown-body">${markdownHTML(content)}</div>`}catch(e){return `<div class="status error">${safe(t('readError'))}</div>`}}
async function renderCurrentRecord(r){if(!r){r=await getDetails(currentRow)}$('resultSection').classList.remove('hidden');updatePager();const target=$('resultContent');target.innerHTML=`<div class="result-paper"><h3 class="result-title">${safe(r.city)} · ${safe(r.year)} · ${safe(subjectName(r.subject))} · ${safe(versionName(r.version))}</h3>${fileButtons(r.file)}<div id="resultFileContent">${r.file?statusHTML(t('loading')):`<div class="status">${safe(t('noFile'))}</div>`}</div></div>`;if(r.file)$('resultFileContent').innerHTML=await contentHTML(r.file)}
async function navigateRecord(direction){const next=currentRow+direction;if(next<1||next>recordCount||polling)return;currentRow=next;editMode=false;updateSubmit();$('resultContent').innerHTML=statusHTML(t('loading'));try{const r=await getDetails(next);populateForm(r);await renderCurrentRecord(r)}catch(e){$('resultContent').innerHTML=statusHTML(String(e.message||e),true)}}
async function pollFile(row,token){const deadline=Date.now()+1800000;while(token===pollToken&&Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1000));if(token!==pollToken)break;try{const name=String(await bridge({type:'GetCellValue',data:SOURCE,payload:'真题文件/'+row})||'').trim();if(name){polling=false;const r=await getDetails(row);updatePager();updateSubmit();if(currentRow===row)await renderCurrentRecord(r);await refreshHome();return}}catch(e){if(token===pollToken)$('resultContent').innerHTML=statusHTML(String(e.message||e),true)}}if(token===pollToken){polling=false;updatePager();updateSubmit();$('resultContent').innerHTML=statusHTML(t('timeout'),true)}}
async function submitForm(event){event.preventDefault();if(polling)return;const values=formValues();if(!validValues(values)){alert(t('required'));return}const button=$('submitSearch');button.disabled=true;try{if(editMode&&currentRow>0){for(const field of FIELDS.slice(0,4)){await bridge({type:'SetCellValue',data:SOURCE,payload:field+'/'+currentRow+'/'+values[field]})}editMode=false;await refreshHome();const r=await getDetails(currentRow);await renderCurrentRecord(r);$('formHint').textContent=t('saved')}else{await bridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(values)});currentRow=1;polling=true;const token=++pollToken;$('resultSection').classList.remove('hidden');$('resultContent').innerHTML=statusHTML(t('waiting'));recordCount=Number(await bridge({type:'GetRecordCount',data:SOURCE}))||1;updatePager();updateSubmit();pollFile(1,token)}}catch(e){$('formHint').textContent=t('saveError')+' '+String(e.message||e);$('resultContent').innerHTML=statusHTML(String(e.message||e),true);polling=false}finally{updateSubmit()}}
async function openDetail(row){currentRow=row;lastFocus=document.activeElement;const layer=$('modalLayer');layer.innerHTML=`<div class="modal-backdrop full-mobile" id="detailBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-header"><h2 id="detailTitle">${safe(t('detail'))}</h2><button class="btn icon" id="closeDetail" type="button" aria-label="${safe(t('close'))}"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="detailBody">${statusHTML(t('loading'))}</div></div></div>`;modalOpen=true;updatePager();$('closeDetail').onclick=closeModal;$('detailBackdrop').onclick=e=>{if(e.target.id==='detailBackdrop')closeModal()};try{const r=await getDetails(row);if(!modalOpen)return;const pairs=[['city',r.city],['subject',subjectName(r.subject)],['year',r.year],['version',versionName(r.version)],['file',r.file]];let html=`<div class="detail-grid">${pairs.map(([key,value])=>`<div class="detail-item"><small>${safe(t(key))}</small><strong>${safe(value||'—')}</strong></div>`).join('')}</div>${fileButtons(r.file)}<h3>${safe(t('fileContent'))}</h3><div id="detailFileContent">${r.file?statusHTML(t('loading')):`<div class="status">${safe(t('noFile'))}</div>`}</div>`;$('detailBody').innerHTML=html;if(r.file)$('detailFileContent').innerHTML=await contentHTML(r.file)}catch(e){if(modalOpen)$('detailBody').innerHTML=statusHTML(String(e.message||e),true)}}
function closeModal(){modalOpen=false;$('modalLayer').innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
async function editRecord(row){currentRow=row;editMode=true;showPage('search');$('resultSection').classList.remove('hidden');$('resultContent').innerHTML=statusHTML(t('loading'));try{const r=await getDetails(row);populateForm(r);$('editFileArea').classList.remove('hidden');$('editFileArea').innerHTML=r.file?fileButtons(r.file):`<div class="status">${safe(t('noFile'))}</div>`;await renderCurrentRecord(r)}catch(e){$('resultContent').innerHTML=statusHTML(String(e.message||e),true)}}
async function deleteRecord(row){if(!confirm(t('confirmDelete')))return;try{await bridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row)clearSearch();await refreshHome();await refreshRecords()}catch(e){alert(t('error')+': '+String(e.message||e))}}
function downloadRecord(row){const r=records.find(x=>x.row===row);if(r&&r.file)window.open(filenameUrl(r.file,'download'),'_blank','noopener');else alert(t('noFile'))}
function determineLanguage(){try{const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)return saved==='en'?'en':'cn'}catch(e){}const query=new URLSearchParams(location.search).get('lang');if(query==='cn'||query==='en')return query;const languages=navigator.languages;if(!languages||!languages.length)return 'cn';return languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
async function getMode(){try{const mode=await bridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches)}}
function keepInputVisible(){const active=document.activeElement;if(!active||!active.matches('input,select,textarea'))return;setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),180)}
async function initialize(){setLanguage(determineLanguage());document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));$('brand').onclick=()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)};$('hamburger').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('hamburger').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});$('langButton').onclick=()=>setLanguage(language==='cn'?'en':'cn');$('mobileLang').onclick=()=>{setLanguage(language==='cn'?'en':'cn');closeMenu()};$('heroSearch').onclick=()=>showPage('search');$('allRecords').onclick=()=>showPage('records');$('goRecords').onclick=()=>showPage('records');$('recordsNew').onclick=()=>{clearSearch();showPage('search')};$('newSearch').onclick=()=>clearSearch();$('previousRecord').onclick=()=>navigateRecord(-1);$('nextRecord').onclick=()=>navigateRecord(1);$('searchForm').addEventListener('input',updateSubmit);$('searchForm').addEventListener('change',updateSubmit);$('searchForm').addEventListener('submit',submitForm);['recordQuery','filterSubject','filterYear','filterVersion'].forEach(id=>$(id).addEventListener(id==='recordQuery'?'input':'change',renderRecords));$('recentList').addEventListener('click',e=>{const card=e.target.closest('[data-row]');if(card)openDetail(Number(card.dataset.row))});$('recordsList').addEventListener('click',e=>{const card=e.target.closest('[data-row]');if(!card)return;const row=Number(card.dataset.row),action=e.target.closest('[data-action]')?.dataset.action;if(action==='detail')openDetail(row);else if(action==='download')downloadRecord(row);else if(action==='delete')deleteRecord(row);else editRecord(row)});$('recordsList').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.paper-card')){e.preventDefault();editRecord(Number(e.target.dataset.row))}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalOpen)closeModal();else closeMenu()}});document.addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))keepInputVisible()});if(window.visualViewport)visualViewport.addEventListener('resize',keepInputVisible);window.addEventListener('resize',fitNavigation);if(window.ResizeObserver)new ResizeObserver(fitNavigation).observe($('topbar'));fitNavigation();getMode();await refreshHome()}
document.addEventListener('DOMContentLoaded', () => { (async () => { await initialize(); })(); });
</script>
</body>
</html>
