<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("7a78c7f2a014787d_四柱八字命理分析")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

function PauseRecordVoiceA() {

}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {

    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;

  VoiceRecorderState.audioChunks = [];

}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {

    fileInput.style.display = 'none';

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

                        i++;

                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;

                        }

                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

        }

function fieldsHTML(prefix,values={}){return FIELDS.map((f,i)=>{const id=prefix+'-field'+i,required=['姓名','阳历生日','出生时辰','性别'].includes(f),v=values[f]||'';let input;
if(f==='性别')input='<fieldset><legend>'+t(f)+' <span class="required">*</span></legend><div class="radios">'+['男','女'].map((g,j)=>'<label for="'+id+'-'+j+'"><input id="'+id+'-'+j+'" name="'+f+'" type="radio" value="'+g+'" '+(v===g?'checked':'')+' required>'+t(g)+'</label>').join('')+'</div></fieldset>';
else{input='<label for="'+id+'">'+t(f)+(required?' <span class="required">*</span>':'')+'</label>';if(f==='出生时辰')input+='<select id="'+id+'" name="'+f+'" required><option value="">'+t('choose')+'</option>'+HOURS.map(h=>'<option value="'+h+'" '+(v===h?'selected':'')+'>'+hourLabel(h)+'</option>').join('')+'</select>';else input+='<input id="'+id+'" name="'+f+'" type="'+(f==='阳历生日'?'date':'text')+'" value="'+esc(v)+'" '+(required?'required ':'')+(f==='农历生日'?'placeholder="'+esc(t('lunarHint'))+'"':'')+'>'; }
return '<div class="field '+(f==='出生地'?'full':'')+'">'+input+'</div>'}).join('')}
function syncForm(){const ok=valid(formValues('birthForm'));$('submitBirth').disabled=!ok||busy||recordLoading;$('birthHint').textContent=t(busy?'waiting':ok?'ready':'required');for(const el of $('birthForm').elements)if(el.id!=='submitBirth')el.disabled=busy;syncButtons()}
function syncButtons(){$('previous').disabled=busy||recordLoading||currentRow<=1;$('next').disabled=busy||recordLoading||currentRow<1||currentRow>=recordCount;$('newChart').disabled=busy||recordLoading;$('archiveNew').disabled=busy||recordLoading;$('rowLabel').textContent=currentRow?currentRow+' / '+recordCount:''}
function summaryHTML(data){return '<dl class="summary">'+FIELDS.map(f=>'<dt>'+t(f)+'</dt><dd>'+esc(f==='性别'?t(data[f]||'—'):f==='出生时辰'?hourLabel(data[f]||'—'):data[f]||'—')+'</dd>').join('')+'</dl>'}
function markdown(el,text){if(!text){el.innerHTML='<div class="empty"><i class="fa-solid fa-yin-yang"></i>'+t(currentRow?'noAnalysis':'emptyResult')+'</div>';return}
if(!window.markdownit||!window.DOMPurify){el.textContent=t('unavailable')+'\n\n'+text;return}
const md=window.markdownit({html:false,linkify:true,typographer:true,breaks:true});el.innerHTML=DOMPurify.sanitize(md.render(text));
el.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-scroll';table.before(wrap);wrap.append(table)});
el.querySelectorAll('img').forEach(img=>{const original=img.getAttribute('src')||'';let name=original;try{if(/^https?:/i.test(original))name=decodeURIComponent(new URL(original).pathname.split('/').pop())}catch{}const url='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(name);img.src=url;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';img.replaceWith(a);a.append(img)});
el.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'})
}
function renderResult(){$('resultSummary').innerHTML=currentData?summaryHTML(currentData):'';$('resultStatus').textContent=statusKey?t(statusKey):'';$('resultStatus').classList.toggle('loading',busy);markdown($('result'),analysis);syncButtons()}
function cardHTML(r){const d=r.data;return '<article class="card" tabindex="0" role="button" data-row="'+r.row+'" aria-label="'+esc(t('detail')+' '+d['姓名'])+'"><div class="card-top"><h3>'+esc(d['姓名']||'—')+'</h3><span class="seal '+(d['性别']==='女'?'female':'')+'">'+esc(t(d['性别']||'—'))+'</span></div><dl>'+['曾用名','阳历生日','农历生日','出生地'].map(f=>'<dt>'+t(f)+'</dt><dd>'+esc(d[f]||'—')+'</dd>').join('')+'</dl><div class="card-bottom"><span class="gold">'+esc(hourLabel(d['出生时辰']||'—'))+'</span><div class="actions"><button data-action="detail">'+t('detail')+'</button><button data-action="edit">'+t('edit')+'</button><button data-action="delete">'+t('delete')+'</button></div></div></article>'}
function renderLists(){$('recent').innerHTML=records.slice(0,5).map(cardHTML).join('')||'<div class="empty">'+t('empty')+'</div>';const q=$('search').value.trim().toLocaleLowerCase(),g=$('genderFilter').value,h=$('hourFilter').value;const matched=records.filter(r=>(!q||['姓名','曾用名','出生地'].some(f=>r.data[f].toLocaleLowerCase().includes(q)))&&(!g||r.data['性别']===g)&&(!h||r.data['出生时辰']===h));$('archiveCards').innerHTML=matched.slice(0,limit).map(cardHTML).join('')||'<div class="empty">'+t(records.length?'noMatch':'empty')+'</div>';$('matchCount').textContent=matched.length+' '+t('matched');$('more').hidden=matched.length<=limit}
async function refresh(){const token=++loadToken;$('loadStatus').textContent=t('loading');try{const [csv,count,gender]=await Promise.all([api('GetTableCSV',SOURCE,FIELDS.join(',')),api('GetRecordCount'),api('GetTableCSV',SOURCE,'性别')]);if(token!==loadToken)return;const n=Number(count);if(!Number.isInteger(n)||n<0)throw new Error('Invalid record count');records=parseCSV(csv).map((row,i)=>({row:i+1,data:Object.fromEntries(FIELDS.map((f,j)=>[f,row[j]||'']))}));recordCount=n;const genders=parseCSV(gender);$('total').textContent=n;$('male').textContent=genders.filter(r=>r[0]==='男').length;$('female').textContent=genders.filter(r=>r[0]==='女').length;$('loadStatus').textContent='';renderLists();syncButtons()}catch(e){$('loadStatus').textContent=t('loadError');error(e)}}
function closeMenu(){$('mobileMenu').hidden=true;$('menuButton').setAttribute('aria-expanded','false')}
function layoutNav(){const nav=$('nav');nav.classList.remove('compact');if(nav.scrollWidth>nav.clientWidth||window.innerWidth<660)nav.classList.add('compact');if(!nav.classList.contains('compact'))closeMenu()}
function navigate(next,save=true,scroll=0){closeMenu();if(next===page)return;if(save)historyStack.push({page,scroll:window.scrollY});page=next;for(const p of ['home','chart','archive'])$('page-'+p).hidden=p!==next;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===next));window.scrollTo(0,scroll)}
function resetChart(){if(busy||recordLoading)return;currentRow=0;currentData=null;analysis='';statusKey='';$('birthFields').innerHTML=fieldsHTML('birthForm');syncForm();renderResult()}
async function readRecord(row){const data={};for(const f of FIELDS)data[f]=await api('GetCellValue',SOURCE,f+'/'+row);const text=await api('GetCellValue',SOURCE,'命理分析/'+row);return {data,text}}
async function loadChart(row){if(busy||recordLoading)return;recordLoading=true;syncForm();try{const r=await readRecord(row);currentRow=row;currentData=r.data;analysis=r.text;statusKey='';$('birthFields').innerHTML=fieldsHTML('birthForm',r.data);renderResult()}finally{recordLoading=false;syncForm()}}
function openModal(kind,title){if(modalBusy)return false;lastFocus=document.activeElement;modalKind=kind;$('modal').classList.toggle('reading',kind==='detail');$('dialog').classList.toggle('small',kind==='delete');$('dialogTitle').textContent=title;$('dialogBody').innerHTML='';$('dialogFoot').innerHTML='';$('modal').hidden=false;document.body.style.overflow='hidden';$('closeModal').focus();return true}
function closeModal(){if(modalBusy){toast(t('busy'));return false}++detailToken;$('modal').hidden=true;modalKind='';document.body.style.overflow='';lastFocus?.focus();return true}
function footButton(key,fn,primary=false){const b=document.createElement('button');b.textContent=t(key);if(primary)b.className='primary';b.onclick=async()=>{try{await fn()}catch(e){error(e)}};$('dialogFoot').append(b);return b}
async function showRecord(row,kind='detail'){if(busy||recordLoading||modalBusy){toast(t('busy'));return}currentRow=row;syncButtons();if(!openModal(kind,t(kind==='edit'?'editTitle':'detailTitle')))return;const token=++detailToken;$('dialogBody').textContent=t('loading');try{const r=await readRecord(row);if(token!==detailToken||$('modal').hidden)return;
if(kind==='detail'){$('dialogBody').innerHTML=summaryHTML(r.data)+'<article id="detailReading" class="markdown"></article>';markdown($('detailReading'),r.text);footButton('goChart',async()=>{closeModal();navigate('chart');await loadChart(row)});footButton('close',closeModal)}
else{$('dialogBody').innerHTML='<form id="editForm"><div class="form-grid">'+fieldsHTML('editForm',r.data)+'</div><p class="hint">'+t('required')+'</p><button class="primary" id="editForm-save" type="submit">'+t('save')+'</button></form>';$('editForm').addEventListener('submit',async e=>{e.preventDefault();const v=formValues('editForm');if(!valid(v)||modalBusy)return;modalBusy=true;for(const el of $('editForm').elements)el.disabled=true;try{for(const f of FIELDS)await api('SetCellValue',SOURCE,f+'/'+row+'/'+v[f]);modalBusy=false;closeModal();if(currentRow===row){currentData=v;analysis=r.text;renderResult()}toast(t('saved'));await refresh()}catch(e){modalBusy=false;for(const el of $('editForm').elements)el.disabled=false;error(e);toast(t('partial'))}});footButton('cancel',closeModal)}
}catch(e){if(token===detailToken)$('dialogBody').textContent=t('error')+(e.message||e)}}
function deleteRecord(row){if(busy||recordLoading||modalBusy){toast(t('busy'));return}if(!openModal('delete',t('deleteTitle')))return;$('dialogBody').textContent=t('deleteText');footButton('cancel',closeModal);const b=footButton('confirm',async()=>{modalBusy=true;b.disabled=true;try{await api('DeleteRecord',SOURCE,row.toString());modalBusy=false;closeModal();resetChart();await refresh();toast(t('deleted'))}catch(e){modalBusy=false;b.disabled=false;error(e)}},true)}
async function poll(){const token=++pollToken,deadline=Date.now()+1800000;while(token===pollToken){if(Date.now()>=deadline)throw new Error(t('timeout'));await new Promise(resolve=>setTimeout(resolve,1000));const remaining=deadline-Date.now();if(remaining<=0)throw new Error(t('timeout'));let timer;const text=await Promise.race([api('GetCellValue',SOURCE,'命理分析/'+currentRow),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(t('timeout'))),remaining)})]).finally(()=>clearTimeout(timer));if(token!==pollToken)return;if(String(text).trim()){analysis=text;statusKey='';return}}}
async function submitBirth(e){e.preventDefault();const data=formValues('birthForm');if(busy||!valid(data))return;busy=true;statusKey='waiting';syncForm();renderResult();try{await api('SubmitRecord','八字命盘',JSON.stringify(data));currentRow=1;currentData=data;analysis='';recordCount=Math.max(1,recordCount+1);renderResult();await poll();await refresh()}catch(e){statusKey='';error(e);if(currentRow===1&&currentData===data)statusKey='noAnalysis'}finally{busy=false;syncForm();renderResult()}}
function setLanguage(next,persist=true){const values=formValues('birthForm'),editValues=$('editForm')?formValues('editForm'):null;language=next;if(persist)try{localStorage.setItem('iThinkAir_UiLanguage',next)}catch{}document.documentElement.lang=next==='cn'?'zh-CN':'en';document.title=t('title');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('birthFields').innerHTML=fieldsHTML('birthForm',values);const g=$('genderFilter').value,h=$('hourFilter').value;$('genderFilter').innerHTML='<option value="">'+t('allGender')+'</option>'+['男','女'].map(v=>'<option value="'+v+'">'+t(v)+'</option>').join('');$('genderFilter').value=g;$('hourFilter').innerHTML='<option value="">'+t('allHour')+'</option>'+HOURS.map(v=>'<option value="'+v+'">'+hourLabel(v)+'</option>').join('');$('hourFilter').value=h;$('search').placeholder=t('search');$('search').ariaLabel=t('search');$('genderFilter').ariaLabel=t('allGender');$('hourFilter').ariaLabel=t('allHour');syncForm();renderResult();renderLists();requestAnimationFrame(layoutNav)}
window.airBack=function(){if(!$('modal').hidden){closeModal();return 'false'}if(!$('mobileMenu').hidden){closeMenu();return 'false'}const prior=historyStack.pop();if(!prior)return 'true';navigate(prior.page,false,prior.scroll);return 'false'};
async function initialize(){let lang='cn';try{if(navigator.languages?.length)lang=navigator.languages.some(l=>/^zh(?:-|$)/i.test(l))?'cn':'en'}catch{}const param=new URLSearchParams(location.search).get('lang');if(param==='cn'||param==='en')lang=param;try{const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)lang=saved==='en'?'en':'cn'}catch{}
$('birthFields').innerHTML=fieldsHTML('birthForm');setLanguage(lang,false);document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));$('tabs').querySelector('[data-page=home]').classList.add('active');$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){error(e)}};
$('language').onclick=$('mobileLanguage').onclick=()=>{setLanguage(language==='cn'?'en':'cn');closeMenu()};$('menuButton').onclick=()=>{const open=$('mobileMenu').hidden;$('mobileMenu').hidden=!open;$('menuButton').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('nav').contains(e.target))closeMenu()});window.addEventListener('resize',layoutNav);if(window.ResizeObserver)new ResizeObserver(layoutNav).observe($('nav'));document.fonts?.ready.then(layoutNav);
$('birthForm').addEventListener('input',syncForm);$('birthForm').addEventListener('change',syncForm);$('birthForm').addEventListener('submit',submitBirth);$('newChart').onclick=resetChart;$('archiveNew').onclick=()=>{resetChart();navigate('chart')};$('previous').onclick=()=>loadChart(currentRow-1).catch(error);$('next').onclick=()=>loadChart(currentRow+1).catch(error);$('refresh').onclick=refresh;for(const id of ['search','genderFilter','hourFilter'])$(id).addEventListener('input',()=>{limit=12;renderLists()});$('more').onclick=()=>{limit+=12;renderLists()};
for(const id of ['recent','archiveCards']){$(id).addEventListener('click',e=>{const card=e.target.closest('[data-row]');if(!card)return;const row=Number(card.dataset.row),action=e.target.closest('[data-action]')?.dataset.action;if(action==='delete')deleteRecord(row);else showRecord(row,action==='edit'?'edit':'detail').catch(error)});$(id).addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();showRecord(Number(e.target.dataset.row)).catch(error)}})}
$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden)closeModal();else closeMenu()}if(e.key==='Tab'&&!$('modal').hidden){const items=Array.from($('dialog').querySelectorAll('button,input,select,textarea,a[href]')).filter(el=>!el.disabled&&el.offsetParent!==null);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
const focusInput=()=>{const active=document.activeElement;if(active?.matches('input,select,textarea'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),160)};
document.addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))focusInput()});window.visualViewport?.addEventListener('resize',()=>{const gap=Math.max(0,window.innerHeight-window.visualViewport.height);document.documentElement.style.setProperty('--keyboard-space',gap>80?Math.max(gap,260)+'px':'0px');focusInput()});
try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='亮色'?'light':'dark'}catch(e){document.documentElement.dataset.theme=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';error(e)}await refresh();
}
(async () => { await initialize(); })();
</script></body></html>
