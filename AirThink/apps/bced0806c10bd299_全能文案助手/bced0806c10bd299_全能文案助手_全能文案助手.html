-radius:15px;font-size:1.3rem}.stat-card .label{color:var(--muted);font-size:.9rem}.stat-card strong{display:block;font-size:1.8rem;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:17px}.record-card{padding:20px;min-width:0;display:flex;flex-direction:column;gap:13px;transition:transform .18s,box-shadow .18s}.record-card:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(79,61,153,.17)}.record-card h3{font-size:1.13rem;line-height:1.5;margin:0;overflow-wrap:anywhere}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{font-size:.75rem;font-weight:600;color:var(--accent);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:5px 9px;overflow-wrap:anywhere}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}.card-actions .button{font-size:.87rem;min-height:36px;padding:7px 11px}.recent-card{width:100%;text-align:left;border:1px solid var(--line);color:var(--text);cursor:pointer}.empty{padding:38px;text-align:center;color:var(--muted);line-height:1.6}.empty i{display:block;color:var(--accent);font-size:1.9rem;margin-bottom:10px}.form-card{padding:clamp(20px,4vw,34px)}.form-card h2{margin:0 0 24px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px}.field{min-width:0}.field.full{grid-column:1/-1}.field label,.field legend{display:block;font-weight:700;font-size:.92rem;margin:0 0 8px}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);padding:10px 12px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(112,72,232,.14)}fieldset.field{border:0;padding:0;margin:0}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;background:var(--surface2);padding:7px 10px;cursor:pointer;font-size:.87rem}.check input{width:auto;min-height:0;accent-color:var(--accent);margin:0}.form-actions{margin-top:25px}.status{padding:17px 20px;line-height:1.6}.status.waiting{color:var(--accent)}.status.error{color:var(--danger)}.result-card{margin-top:20px;padding:22px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.result-head h2{margin:0}.markdown-body{background:transparent!important;color:var(--text)!important;overflow-wrap:anywhere}.markdown-body pre{overflow:auto}.markdown-body img{max-width:100%}.library-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.library-top .page-heading{margin-bottom:20px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.toolbar input,.toolbar select{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:9px 11px;min-width:0}.toolbar input{flex:2 1 220px}.toolbar select{flex:1 1 150px}.load-more{display:block;margin:23px auto 0}

  <script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {

                            i++;
                        }

                        i++;
                    }
                } else {

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

      en:{appName:'All-in-One Copy Assistant',home:'Home',create:'New Creation',library:'Copy Library',heroDesc:'Create high-quality original copy for every scenario in one step.',start:'Start Creating',total:'Total Creations',recent:'Recent Creations',viewAll:'View All',createDesc:'Tell us what you need and let AI craft your content.',newCopy:'New Copy',copyType:'Copy Type',topic:'Topic',platform:'Target Platform',audience:'Audience',core:'Key Message',tone:'Tone',words:'Word Count',generate:'Generate Copy',generatedResult:'Generated Result',reset:'Clear & Reset',libraryDesc:'View and manage all your generated copy.',search:'Search topic, type, or platform',allTypes:'All Types',allPlatforms:'All Platforms',allTones:'All Tones',loadMore:'Load More',detail:'Copy Details',close:'Close',delete:'Delete',empty:'No copy yet. Start creating.',loading:'Loading…',waiting:'AI is crafting your copy. Please wait...',pollTitle:'Generating Copy',noResult:'No content yet',confirmDelete:'Delete this copy?',deleted:'Deleted',deleteError:'Delete failed',loadError:'Could not load data',submitError:'Submission failed',pollError:'Could not get the result',timeout:'Generation timed out. Check the library later.',select:'Select',result:'Copy Result'}
    };
    const TYPE_EN = ['Xiaohongshu Post','Douyin Script','WeChat Article','Moments Promotion','Weibo Copy','Product Description','Brand Story','Tagline','Marketing Email','Sales Script','Work Summary','Performance Report','Job Pitch','Project Proposal','Meeting Minutes','Short Story','Screenplay','Poem or Lyrics'];
    const PLATFORM_EN = ['Xiaohongshu','Douyin','WeChat Official Account','WeChat Moments','Weibo','Product Page','Email','In-person Speech','Other'];
    const TONE_EN = ['Informative','Casual','Professional','Warm','Humorous','Premium','Storytelling','Conversion-focused','Formal'];
    let language = 'cn';
    let currentPage = 'home';
    let pageHistory = [];
    let records = [];
    let recentRecords = [];
    let visibleCount = 12;
    let polling = false;
    let toastTimer;
    const $ = id => document.getElementById(id);
    const t = key => I18N[language][key] || key;
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function displayOption(value, group){const list=group==='type'?COPY_TYPES:group==='platform'?PLATFORMS:TONES;const translated=group==='type'?TYPE_EN:group==='platform'?PLATFORM_EN:TONE_EN;const i=list.indexOf(value);return language==='en' && i>=0?translated[i]:value;}
    function initialLanguage(){const query=new URLSearchParams(location.search).get('lang');if(query==='cn'||query==='en')return query;const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored!==null&&stored!=='')return stored==='en'?'en':'cn';const languages=navigator.languages;if(!languages||!languages.length)return 'cn';return languages.some(code=>/^zh(?:-|$)/i.test(code))?'cn':'en';}
    function fillSelect(select, values, group, placeholder, includeAll=false){const previous=select.value;select.innerHTML='';const first=document.createElement('option');first.value='';first.textContent=t(placeholder);select.appendChild(first);for(const value of values){const option=document.createElement('option');option.value=value;option.textContent=displayOption(value,group);select.appendChild(option)}select.value=values.includes(previous)?previous:'';if(!includeAll)first.disabled=true;}
    function updateLanguage(){document.documentElement.lang=language==='cn'?'zh-CN':'en';document.title=t('appName');document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.placeholder)});$('languageButton').textContent=language==='cn'?'EN':'中';$('mobileLanguageButton').textContent=language==='cn'?'English':'中文';fillSelect($('createForm_copyType'),COPY_TYPES,'type','select');fillSelect($('createForm_platform'),PLATFORMS,'platform','select');fillSelect($('typeFilter'),COPY_TYPES,'type','allTypes',true);fillSelect($('platformFilter'),PLATFORMS,'platform','allPlatforms',true);fillSelect($('toneFilter'),TONES,'tone','allTones',true);$('toneChecks').innerHTML=TONES.map((tone,i)=>`<label class="check"><input type="checkbox" name="风格调性" value="${escapeHTML(tone)}"><span>${escapeHTML(language==='en'?TONE_EN[i]:tone)}</span></label>`).join('');renderRecent();renderLibrary();}
    function toggleLanguage(){const chosen=Array.from(document.querySelectorAll('#toneChecks input:checked')).map(input=>input.value);language=language==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',language);updateLanguage();document.querySelectorAll('#toneChecks input').forEach(input=>{input.checked=chosen.includes(input.value)});closeMenu();}
    function closeMenu(){$('mobileMenu').classList.remove('open');$('mobileMenu').hidden=true;$('menuButton').setAttribute('aria-expanded','false')}
    function toggleMenu(){const willOpen=$('mobileMenu').hidden;$('mobileMenu').hidden=!willOpen;$('mobileMenu').classList.toggle('open',willOpen);$('menuButton').setAttribute('aria-expanded',String(willOpen))}
    function navigate(page,addHistory=true){if(!['home','create','library'].includes(page))return;if(currentPage!==page){if(addHistory)pageHistory.push({page:currentPage,scroll:window.scrollY});document.querySelectorAll('.page').forEach(el=>{el.hidden=el.id!==page+'Page'});currentPage=page;document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));window.scrollTo(0,0)}closeMenu();if(page==='home')loadHome();if(page==='library')loadLibrary();}
    function showToast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').hidden=true},4500)}
    function showStatus(message,kind='waiting'){$('generationStatus').textContent=message;$('generationStatus').className='status surface '+kind;$('generationStatus').hidden=false}
    function hideStatus(){$('generationStatus').hidden=true}
    async function getRows(fields){const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:fields});return parseCSV(String(csv||''))}
    async function loadHome(){try{const [count,rows]=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),getRows('主题,文案类型,目标平台,字数要求')]);$('totalCount').textContent=String(count??'—');const recent=rows.slice(0,5).map((row,index)=>({row:index+1,topic:row[0]||'',type:row[1]||'',platform:row[2]||'',words:row[3]||''}));renderRecent(recent)}catch(error){$('totalCount').textContent='—';$('recentGrid').innerHTML=`<div class="empty surface">${escapeHTML(t('loadError'))}: ${escapeHTML(error.message||error)}</div>`}}
    function cardTags(record,full=false){const items=[['type',record.type],['platform',record.platform],['words',record.words]];if(full)items.splice(2,0,['tone',record.tone]);return items.filter(item=>item[1]).map(([key,value])=>`<span class="tag">${escapeHTML(t(key))}: ${escapeHTML(key==='type'||key==='platform'?displayOption(value,key):key==='tone'?value.split(/[,，、]/).map(v=>displayOption(v.trim(),'tone')).join(', '):value)}</span>`).join('')}
    function renderRecent(items){if(items)recentRecords=items;const grid=$('recentGrid');if(!recentRecords.length){grid.innerHTML=`<div class="empty surface"><i class="fa-regular fa-file-lines"></i>${escapeHTML(t('empty'))}</div>`;return}grid.innerHTML=recentRecords.map(r=>`<button class="record-card recent-card surface" type="button" data-row="${r.row}"><h3>${escapeHTML(r.topic||'—')}</h3><div class="tags">${cardTags(r)}</div></button>`).join('')}
    async function loadLibrary(){try{const rows=await getRows('主题,文案类型,目标平台,风格调性,字数要求');records=rows.map((row,index)=>({row:index+1,topic:row[0]||'',type:row[1]||'',platform:row[2]||'',tone:row[3]||'',words:row[4]||''}));visibleCount=12;renderLibrary()}catch(error){$('libraryGrid').innerHTML=`<div class="empty surface">${escapeHTML(t('loadError'))}: ${escapeHTML(error.message||error)}</div>`;$('loadMoreButton').hidden=true}}
    function renderLibrary(){const grid=$('libraryGrid');const term=$('searchInput').value.trim().toLocaleLowerCase();const type=$('typeFilter').value;const platform=$('platformFilter').value;const tone=$('toneFilter').value;const filtered=records.filter(r=>(!term||[r.topic,r.type,r.platform,r.tone,r.words].some(v=>String(v).toLocaleLowerCase().includes(term)))&&(!type||r.type===type)&&(!platform||r.platform===platform)&&(!tone||r.tone.includes(tone)));if(!filtered.length){grid.innerHTML=`<div class="empty surface"><i class="fa-regular fa-folder-open"></i>${escapeHTML(t('empty'))}</div>`}else{grid.innerHTML=filtered.slice(0,visibleCount).map(r=>`<article class="record-card surface"><h3>${escapeHTML(r.topic||'—')}</h3><div class="tags">${cardTags(r,true)}</div><div class="card-actions"><button class="button" type="button" data-action="detail" data-row="${r.row}"><i class="fa-regular fa-eye"></i>${escapeHTML(t('detail'))}</button><button class="button danger" type="button" data-action="delete" data-row="${r.row}"><i class="fa-regular fa-trash-can"></i>${escapeHTML(t('delete'))}</button></div></article>`).join('')}$('loadMoreButton').hidden=filtered.length<=visibleCount}
    function renderMarkdown(target,source){let html;if(window.marked&&window.DOMPurify){marked.setOptions({gfm:true,breaks:true});html=DOMPurify.sanitize(marked.parse(String(source||'')),{ADD_ATTR:['target']})}else{html='<pre>'+escapeHTML(source||'')+'</pre>'}target.innerHTML=html;target.querySelectorAll('img').forEach(img=>{const original=img.getAttribute('src')||'';if(!original)return;const file=original.startsWith('http://' + window.location.hostname + ':3130/download/')?original.slice('http://' + window.location.hostname + ':3130/download/'.length):original;if(!/^(https?:|data:|blob:)/i.test(file))img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(file);const a=document.createElement('a');a.href=img.src;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('download','');img.parentNode.insertBefore(a,img);a.appendChild(img)})}
    async function openDetail(row){const overlay=$('detailOverlay');overlay.hidden=false;document.body.style.overflow='hidden';$('detailBody').innerHTML=`<div class="empty">${escapeHTML(t('loading'))}</div>`;try{const fields=['主题','文案类型','目标平台','目标受众','核心信息','风格调性','字数要求'];const values=[];for(const field of fields){values.push(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row}))}const result=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'文案结果/'+row});if(overlay.hidden)return;const meta=document.createElement('div');meta.className='detail-meta';for(let i=0;i<fields.length;i++){if(!values[i])continue;const item=document.createElement('div');item.className='meta-item';const label=document.createElement('span');label.textContent=t(['topic','copyType','platform','audience','core','tone','words'][i]);const content=document.createElement('strong');content.textContent=String(values[i]);item.append(label,content);meta.appendChild(item)}const section=document.createElement('section');section.className='detail-content';const heading=document.createElement('h3');heading.textContent=t('result');const article=document.createElement('article');article.className='markdown-body';renderMarkdown(article,result||t('noResult'));section.append(heading,article);$('detailBody').replaceChildren(meta,section)}catch(error){$('detailBody').innerHTML=`<div class="empty">${escapeHTML(t('loadError'))}: ${escapeHTML(error.message||error)}</div>`}}
    function closeDetail(){$('detailOverlay').hidden=true;document.body.style.overflow=''}
    async function deleteRecord(row){if(!window.confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});showToast(t('deleted'));await Promise.all([loadLibrary(),loadHome()])}catch(error){showToast(t('deleteError')+': '+(error.message||error))}}
    function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
    async function pollResult(){const deadline=Date.now()+1800*1000;while(Date.now()<deadline){try{const value=await callAppBridge({type:'轮询',data:TABLE,payload:'文案结果'});if(String(value||'').trim()){hideStatus();$('resultCard').hidden=false;renderMarkdown($('resultMarkdown'),value);$('resultCard').scrollIntoView({behavior:'smooth',block:'start'});return}}catch(error){showStatus(t('pollError')+': '+(error.message||error),'error');return}await sleep(1000)}showStatus(t('timeout'),'error')}
    async function submitCreation(event){event.preventDefault();if(polling)return;const form=$('createForm');if(!form.reportValidity())return;const data={'文案类型':$('createForm_copyType').value,'主题':$('createForm_topic').value.trim(),'目标平台':$('createForm_platform').value,'目标受众':$('createForm_audience').value.trim(),'核心信息':$('createForm_core').value.trim(),'风格调性':Array.from(form.querySelectorAll('input[name="风格调性"]:checked')).map(input=>input.value).join(','),'字数要求':$('createForm_words').value};polling=true;$('submitButton').disabled=true;$('resultCard').hidden=true;showStatus(t('pollTitle')+' · '+t('waiting'));try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});await pollResult();await Promise.all([loadHome(),loadLibrary()])}catch(error){showStatus(t('submitError')+': '+(error.message||error),'error')}finally{polling=false;$('submitButton').disabled=false}}
    function resetCreation(){if(polling)return;$('createForm').reset();$('resultMarkdown').innerHTML='';$('resultCard').hidden=true;hideStatus();window.scrollTo({top:0,behavior:'smooth'})}
    function airBack(){if(!$('detailOverlay').hidden){closeDetail();return 'false'}if(!$('mobileMenu').hidden){closeMenu();return 'false'}if(pageHistory.length){const state=pageHistory.pop();navigate(state.page,false);requestAnimationFrame(()=>window.scrollTo(0,state.scroll));return 'false'}return 'true'}
    function setupKeyboardVisibility(){document.addEventListener('focusin',event=>{if(!event.target.matches('input,textarea,select'))return;setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),180)});if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)})}}
    async function initialize(){language=initialLanguage();updateLanguage();try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.theme=String(mode).trim()==='暗色'?'dark':'light'}catch(error){document.documentElement.dataset.theme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}$('brandButton').addEventListener('click',()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)});$('menuButton').addEventListener('click',toggleMenu);$('languageButton').addEventListener('click',toggleLanguage);$('mobileLanguageButton').addEventListener('click',toggleLanguage);document.addEventListener('click',event=>{const target=event.target.closest('[data-page]');if(target)navigate(target.dataset.page);else if(!$('topbar').contains(event.target))closeMenu()});$('startButton').addEventListener('click',()=>navigate('create'));$('allRecordsButton').addEventListener('click',()=>navigate('library'));$('newFromLibraryButton').addEventListener('click',()=>navigate('create'));$('createForm').addEventListener('submit',submitCreation);$('resetButton').addEventListener('click',resetCreation);$('recentGrid').addEventListener('click',event=>{const card=event.target.closest('[data-row]');if(card)openDetail(Number(card.dataset.row))});$('libraryGrid').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const row=Number(button.dataset.row);if(button.dataset.action==='detail')openDetail(row);if(button.dataset.action==='delete')deleteRecord(row)});for(const id of ['searchInput','typeFilter','platformFilter','toneFilter'])$(id).addEventListener(id==='searchInput'?'input':'change',()=>{visibleCount=12;renderLibrary()});$('loadMoreButton').addEventListener('click',()=>{visibleCount+=12;renderLibrary()});$('detailCloseX').addEventListener('click',closeDetail);$('detailCloseButton').addEventListener('click',closeDetail);$('detailOverlay').addEventListener('click',event=>{if(event.target===$('detailOverlay'))closeDetail()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('detailOverlay').hidden)closeDetail();else closeMenu()}});setupKeyboardVisibility();await loadHome()}
    document.addEventListener('DOMContentLoaded', () => { (async () => { await initialize(); })(); });
  </script>
